name: "LOUKSNA ZD V0.3 — Recorded Speech Model E2E"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/louksna-zd-v03-recorded-voice-e2e.yml"
      - ".github/workflows/louksna-zd-v03-governance.yml"
      - ".github/workflows/louksna-zd-v03-physical-voice.yml"
      - "scripts/missions/v03_templates/voice.rs"
      - "scripts/missions/validate_voice_hardware_evidence.py"
  workflow_call:
    inputs:
      candidate_sha:
        description: "Exact candidate commit SHA supplied by the governance workflow"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit SHA to test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: louksna-recorded-voice-e2e-${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  recorded-speech-real-models:
    name: "CP-07 supplemental — Real recorded speech → STT → live LLM → TTS waveform"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
      WHISPER_REF: v1.7.6
      WHISPER_MODEL: base.en
      OLLAMA_MODEL: llama3.2:1b
      PIPER_VOICE: en_US-lessac-medium
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false

      - name: Install pinned test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential cmake git curl ffmpeg file python3 python3-pip python3-venv jq
          python3 -m venv "$RUNNER_TEMP/voice-venv"
          "$RUNNER_TEMP/voice-venv/bin/pip" install --disable-pip-version-check "piper-tts==1.2.0"
          docker --version
          ffmpeg -version | head -n 1
          "$RUNNER_TEMP/voice-venv/bin/piper" --help >/dev/null

      - name: Build pinned whisper.cpp and download real speech fixture plus model
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" --config Release -j2
          mkdir -p "$RUNNER_TEMP/voice-input" "$RUNNER_TEMP/voice-output" evidence/zona-directiva-v03
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/ggml-org/whisper.cpp/$WHISPER_REF/samples/jfk.wav" \
            -o "$RUNNER_TEMP/voice-input/recorded-speech.wav"
          test "$(file -b "$RUNNER_TEMP/voice-input/recorded-speech.wav" 2>/dev/null || true)" != ""
          bash "$RUNNER_TEMP/whisper.cpp/models/download-ggml-model.sh" "$WHISPER_MODEL"
          test -s "$RUNNER_TEMP/whisper.cpp/models/ggml-$WHISPER_MODEL.bin"
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,duration -of json "$RUNNER_TEMP/voice-input/recorded-speech.wav" > "$RUNNER_TEMP/input-audio-metadata.json"

      - name: Run real speech recognition on downloaded human speech
        shell: bash
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/whisper.cpp/build/bin/whisper-cli" \
            -m "$RUNNER_TEMP/whisper.cpp/models/ggml-$WHISPER_MODEL.bin" \
            -f "$RUNNER_TEMP/voice-input/recorded-speech.wav" -nt -np \
            > "$RUNNER_TEMP/transcription.txt" 2> "$RUNNER_TEMP/whisper-stderr.log"
          python3 - "$RUNNER_TEMP/transcription.txt" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(errors="replace").lower()
          text=re.sub(r"[^a-z0-9 ]+"," ",text)
          text=" ".join(text.split())
          expected="ask not what your country can do for you"
          if expected not in text:
              raise SystemExit("REAL_STT_ASSERTION_FAILED: expected reference phrase not found in transcript")
          print("REAL_STT_ASSERTION=PASS")
          PY

      - name: Run live local LLM inference on recognized speech
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull ollama/ollama:0.12.6
          docker run --detach --name louksna-ollama -p 127.0.0.1:11434:11434 ollama/ollama:0.12.6
          cleanup() { docker rm -f louksna-ollama >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:11434/api/tags >/dev/null
          docker exec louksna-ollama ollama pull "$OLLAMA_MODEL"
          python3 - "$RUNNER_TEMP/transcription.txt" "$RUNNER_TEMP/llm-response.json" "$OLLAMA_MODEL" <<'PY'
          import json,pathlib,sys,urllib.request
          transcript=pathlib.Path(sys.argv[1]).read_text(errors="replace").strip()
          if not transcript: raise SystemExit("REAL_LLM_INPUT_EMPTY")
          body={"model":sys.argv[3],"stream":False,"messages":[
            {"role":"system","content":"You are a concise voice assistant. Reply in one short sentence."},
            {"role":"user","content":"Respond briefly to this recognized spoken statement: "+transcript}]}
          req=urllib.request.Request("http://127.0.0.1:11434/api/chat",data=json.dumps(body).encode(),headers={"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=180) as r: result=json.load(r)
          answer=result.get("message",{}).get("content","").strip()
          if not answer: raise SystemExit("REAL_LLM_RESPONSE_EMPTY")
          pathlib.Path(sys.argv[2]).write_text(json.dumps({"model":sys.argv[3],"response":answer},ensure_ascii=False))
          print("REAL_LLM_INFERENCE=PASS")
          PY

      - name: Synthesize the real LLM response with Piper TTS
        shell: bash
        run: |
          set -Eeuo pipefail
          VOICE_BASE="https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/en/en_US/lessac/medium"
          curl --fail --location --retry 3 --silent --show-error "$VOICE_BASE/en_US-lessac-medium.onnx" -o "$RUNNER_TEMP/voice-output/piper-voice.onnx"
          curl --fail --location --retry 3 --silent --show-error "$VOICE_BASE/en_US-lessac-medium.onnx.json" -o "$RUNNER_TEMP/voice-output/piper-voice.onnx.json"
          test -s "$RUNNER_TEMP/voice-output/piper-voice.onnx"
          python3 - "$RUNNER_TEMP/llm-response.json" "$RUNNER_TEMP/voice-venv/bin/piper" "$RUNNER_TEMP/voice-output/piper-voice.onnx" "$RUNNER_TEMP/voice-output/piper-voice.onnx.json" "$RUNNER_TEMP/voice-output/response.wav" <<'PY'
          import json,pathlib,subprocess,sys
          data=json.loads(pathlib.Path(sys.argv[1]).read_text())
          response=data["response"].strip()
          if not response: raise SystemExit("REAL_TTS_INPUT_EMPTY")
          subprocess.run([sys.argv[2],"--model",sys.argv[3],"--config",sys.argv[4],"--output_file",sys.argv[5]],input=response,text=True,check=True,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,timeout=180)
          out=pathlib.Path(sys.argv[5])
          if not out.is_file() or out.stat().st_size < 4096: raise SystemExit("REAL_TTS_WAV_MISSING_OR_TOO_SMALL")
          print("REAL_TTS_SYNTHESIS=PASS")
          PY
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels,duration -of json "$RUNNER_TEMP/voice-output/response.wav" > "$RUNNER_TEMP/output-audio-metadata.json"
          ffmpeg -v error -i "$RUNNER_TEMP/voice-output/response.wav" -f null -
          python3 - "$RUNNER_TEMP/output-audio-metadata.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          streams=d.get("streams",[])
          if not streams or float(streams[0].get("duration",0)) <= 0 or int(streams[0].get("sample_rate",0)) < 8000:
              raise SystemExit("REAL_TTS_AUDIO_VALIDATION_FAILED")
          print("REAL_TTS_WAVEFORM_DECODE=PASS")
          PY

      - name: Create SHA-bound evidence and verify temporary-file cleanup
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$CANDIDATE_SHA" "$RUNNER_TEMP/voice-input/recorded-speech.wav" "$RUNNER_TEMP/whisper.cpp/models/ggml-$WHISPER_MODEL.bin" "$RUNNER_TEMP/voice-output/piper-voice.onnx" "$RUNNER_TEMP/voice-output/response.wav" "$RUNNER_TEMP/transcription.txt" "$RUNNER_TEMP/llm-response.json" <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess,sys
          sha=lambda p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() if pathlib.Path(p).is_file() else None
          candidate,audio,whisper_model,piper_model,tts_wav,transcript,llm=sys.argv[1:]
          paths={"input_recorded_speech":audio,"whisper_model":whisper_model,"piper_model":piper_model,"tts_waveform":tts_wav,"transcription":transcript,"llm_response":llm}
          def valid(p): return pathlib.Path(p).is_file() and pathlib.Path(p).stat().st_size>0
          checks={
            "candidate_sha_is_40_hex":len(candidate)==40 and all(c in "0123456789abcdef" for c in candidate),
            "downloaded_human_speech_fixture":valid(audio),
            "whisper_model_downloaded":valid(whisper_model),
            "real_stt_reference_phrase":valid(transcript) and "ask not what your country can do for you" in pathlib.Path(transcript).read_text(errors="replace").lower(),
            "live_local_llm_response":valid(llm),
            "piper_voice_model_downloaded":valid(piper_model),
            "tts_waveform_generated":valid(tts_wav),
          }
          report={"schema":"louksna.zd.v03.recorded-voice-e2e.v1","checkpoint_id":"CP-07-SUPPLEMENTAL-RECORDED-AUDIO","status":"PASS" if all(checks.values()) else "FAIL","candidate_commit_sha":candidate,"run_id":os.getenv("GITHUB_RUN_ID"),"run_attempt":os.getenv("GITHUB_RUN_ATTEMPT"),"timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"scope":"Real public recorded speech fixture processed by downloaded Whisper model, live Ollama inference, and Piper TTS; this does not claim physical microphone capture or audible speaker playback.","checks":checks,"sha256":{k:sha(v) for k,v in paths.items()},"input_audio_metadata":json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]+"/input-audio-metadata.json").read_text()) if pathlib.Path(os.environ["RUNNER_TEMP"]+"/input-audio-metadata.json").is_file() else None,"output_audio_metadata":json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]+"/output-audio-metadata.json").read_text()) if pathlib.Path(os.environ["RUNNER_TEMP"]+"/output-audio-metadata.json").is_file() else None,"source_versions":{"whisper_cpp_ref":os.getenv("WHISPER_REF"),"whisper_model":os.getenv("WHISPER_MODEL"),"ollama_image":"ollama/ollama:0.12.6","ollama_model":os.getenv("OLLAMA_MODEL"),"piper_tts":"1.2.0","piper_voice":os.getenv("PIPER_VOICE")},"physical_audio_hardware_tested":False,"microphone_capture":False,"audible_playback_confirmed_by_operator":False,"certification_effect":"SUPPLEMENTAL_REAL_AUDIO_EVIDENCE_ONLY; CP-07 PHYSICAL REQUIREMENT AND G23/G24 REMAIN INDEPENDENT"}
          pathlib.Path("evidence/zona-directiva-v03/CP-07-recorded-voice-e2e.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2))
          if not all(checks.values()): raise SystemExit("Recorded voice E2E evidence incomplete")
          PY

      - name: Upload recorded-voice E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp07-recorded-voice-e2e
          path: evidence/zona-directiva-v03/CP-07-recorded-voice-e2e.json
          if-no-files-found: warn
          retention-days: 90
