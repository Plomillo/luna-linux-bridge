name: PUAC-2 mTLS certification chain

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/puac2_mtls_gate.py"
      - "tests/**"
      - ".github/workflows/puac2-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puac2-mtls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    name: PUAC-2 gate regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Compile gate
        run: python -m py_compile scripts/puac2_mtls_gate.py tests/test_puac2_mtls_gate.py
      - name: Run gate regression tests
        run: python -m pytest -q tests/test_puac2_mtls_gate.py

  certification:
    name: Verify signed G23/G24 chain (manual release gate)
    if: github.event_name == 'workflow_dispatch'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: puac2-certification
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Require evidence manifest
        shell: bash
        run: |
          set -eu
          test -f evidence/mtls-certification.json || {
            echo "::error::Missing evidence/mtls-certification.json; G23/G24 remain HOLD."
            exit 3
          }
      - name: Verify PUAC-2 evidence, G23 and G24 signatures
        env:
          PUAC2_G23_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G23_PUBLIC_KEY_PEM }}
          PUAC2_G24_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G24_PUBLIC_KEY_PEM }}
        run: python scripts/puac2_mtls_gate.py --manifest evidence/mtls-certification.json
