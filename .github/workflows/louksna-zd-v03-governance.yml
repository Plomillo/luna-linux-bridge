name: "LOUKSNA ZD V0.3 — Sequential Governance Gate"

on:
  push:
    branches:
      - governance/louksna-zd-v03-12-stage-gates-20261009
    paths:
      - governance/zona-directiva-v03/12_STAGE_GOVERNANCE_CONTRACT.md
      - .github/workflows/louksna-zd-v03-governance.yml
      - .github/workflows/louksna-zd-v03-physical-voice.yml
      - .github/workflows/louksna-zd-v03-recorded-voice-e2e.yml
      - .github/workflows/louksna-zd-v03-functional.yml
      - .github/workflows/louksna-zd-v03-supervisor.yml
      - scripts/missions/louksna_zd_v03_functionalizer.py
      - scripts/missions/repo_forensic_census.py
      - scripts/missions/debian_build_evidence.py
      - scripts/missions/debian_package_canonicalize.py
      - scripts/missions/debian13_kde_host_runtime.sh
      - scripts/missions/debian13_kde_qemu_runtime.sh
      - scripts/missions/louksna_zd_candidate_materializer.py
      - scripts/missions/louksna_zd_v03_playwright_ui_e2e.mjs
      - scripts/missions/debian13_package_smoke.sh
      - scripts/missions/v03_templates/**
      - scripts/missions/validate_voice_hardware_evidence.py
      - scripts/missions/test_validate_voice_hardware_evidence.py
      - docs/VOICE_E2E_GATE_REMEDIATION.md
      - docs/VOICE_E2E_RUNTIME_DEPENDENCIES.md
      - missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md
  pull_request:
    branches:
      - main
      - work/louksna-zona-directiva-v0.3-functional-20261006
    paths:
      - governance/zona-directiva-v03/12_STAGE_GOVERNANCE_CONTRACT.md
      - .github/workflows/louksna-zd-v03-governance.yml
      - .github/workflows/louksna-zd-v03-physical-voice.yml
      - .github/workflows/louksna-zd-v03-recorded-voice-e2e.yml
      - .github/workflows/louksna-zd-v03-functional.yml
      - .github/workflows/louksna-zd-v03-supervisor.yml
      - scripts/missions/louksna_zd_v03_functionalizer.py
      - scripts/missions/repo_forensic_census.py
      - scripts/missions/debian_build_evidence.py
      - scripts/missions/debian_package_canonicalize.py
      - scripts/missions/debian13_kde_host_runtime.sh
      - scripts/missions/debian13_kde_qemu_runtime.sh
      - scripts/missions/louksna_zd_candidate_materializer.py
      - scripts/missions/louksna_zd_v03_playwright_ui_e2e.mjs
      - scripts/missions/debian13_package_smoke.sh
      - scripts/missions/v03_templates/**
      - scripts/missions/validate_voice_hardware_evidence.py
      - scripts/missions/test_validate_voice_hardware_evidence.py
      - docs/VOICE_E2E_GATE_REMEDIATION.md
      - docs/VOICE_E2E_RUNTIME_DEPENDENCIES.md
      - missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md

  workflow_dispatch:
    inputs:
      voice_hardware_evidence_run_id:
        description: "Optional successful self-hosted physical voice E2E workflow run ID; must match this exact candidate SHA."
        required: false
        type: string
        default: ""

env:
  # On pull_request, validate the exact PR head commit, not GitHub's synthetic merge commit.
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  # Serialize by source branch/ref, not run ID: a newer candidate supersedes stale evidence for the same branch.
  # Cancel only an older run in this same concurrency group; never cancel unrelated branches.
  # CP-09 is disposable QEMU evidence, not physical GPU/display/audio/microphone certification.
  group: louksna-zd-v03-governance-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  stage-01-audit:
    name: "Stage 01 / CP-01 — Repository mechanism audit"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      audit_status: ${{ steps.audit.outputs.status }}
    steps:
      - name: Checkout exact workflow candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0

      - name: Enforce exact checkout identity
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git rev-parse HEAD)"
          expected="$CANDIDATE_SHA"
          printf 'TELEMETRY expected_checkout_sha=%s\n' "$expected"
          printf 'TELEMETRY actual_checkout_sha=%s\n' "$actual"
          test "$actual" = "$expected" || {
            echo "::error::CP-01 checkout SHA does not match the workflow event SHA"
            exit 1
          }

      - name: Emit live run identity
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "TELEMETRY event=EVENT_STARTED stage=01 checkpoint=CP-01"
          echo "TELEMETRY repository=$GITHUB_REPOSITORY"
          echo "TELEMETRY ref=$GITHUB_REF"
          echo "TELEMETRY commit=$CANDIDATE_SHA"
          echo "TELEMETRY run_id=$GITHUB_RUN_ID"
          echo "TELEMETRY run_attempt=$GITHUB_RUN_ATTEMPT"
          echo "TELEMETRY timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Census all Git-tracked files and hash repository contents
        id: census
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/zona-directiva-v03
          python3 -B scripts/missions/repo_forensic_census.py \
            --root "$GITHUB_WORKSPACE" \
            --output-dir evidence/zona-directiva-v03 \
            2>&1 | tee evidence/zona-directiva-v03/CP-01-repository-census.log

      - name: Audit observable repository mechanisms
        id: audit
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/zona-directiva-v03
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,datetime
          root=pathlib.Path(".")
          def run(*args):
              p=subprocess.run(args,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
              return {"returncode":p.returncode,"output":p.stdout.strip()}
          workflows=sorted(str(p) for p in pathlib.Path(".github/workflows").glob("*.yml")) + sorted(str(p) for p in pathlib.Path(".github/workflows").glob("*.yaml"))
          mission=pathlib.Path("missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md")
          contract=pathlib.Path("governance/zona-directiva-v03/12_STAGE_GOVERNANCE_CONTRACT.md")
          findings=[]
          if not mission.exists(): findings.append({"severity":"BLOCKER","id":"MISSION_MISSING","detail":"Mission file not found in governance checkout."})
          if not contract.exists(): findings.append({"severity":"BLOCKER","id":"CONTRACT_MISSING","detail":"Contract file not found."})
          if not pathlib.Path(".github/workflows/louksna-zd-v03-functional.yml").exists():
              findings.append({"severity":"BLOCKER","id":"FUNCTIONAL_WORKFLOW_MISSING","detail":"Expected functional workflow not found."})
          branch=os.environ.get("GITHUB_REF_NAME","")
          report={
            "schema":"louksna.zd.v03.repo-audit.v1",
            "contract_id":"LOUKSNA-ZD-V03-12-STAGE-GOVERNANCE-20261009",
            "mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006",
            "stage_id":"01","checkpoint_id":"CP-01",
            "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "repository":os.environ.get("GITHUB_REPOSITORY"),
            "ref":os.environ.get("GITHUB_REF"),
            "branch":branch,
            "commit_sha":os.environ.get("CANDIDATE_SHA"),
            "run_id":os.environ.get("GITHUB_RUN_ID"),
            "run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
            "main_mutation":"NOT_PERFORMED",
            "workflow_inventory":workflows,
            "mission_sha256":hashlib.sha256(mission.read_bytes()).hexdigest() if mission.exists() else None,
            "contract_sha256":hashlib.sha256(contract.read_bytes()).hexdigest() if contract.exists() else None,
            "functional_workflow_sha256":hashlib.sha256(pathlib.Path(".github/workflows/louksna-zd-v03-functional.yml").read_bytes()).hexdigest() if pathlib.Path(".github/workflows/louksna-zd-v03-functional.yml").exists() else None,
            "observable_git": {
              "head":run("git","rev-parse","HEAD"),
              "status":run("git","status","--short"),
              "branches":run("git","branch","--all","--no-color"),
              "tracked_workflows":run("git","ls-files",".github/workflows")
            },
            "limits":["Repository settings/branch protection and external GitHub Actions history require API permissions not supplied by this checkout job.","A CI checkout audit does not prove physical Debian 13 KDE GUI runtime."],
            "findings":findings,
            "status":"HOLD" if findings else "PASS_WITH_SCOPE_LIMITS"
          }
          out=pathlib.Path("evidence/zona-directiva-v03/CP-01-repository-audit.json")
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("TELEMETRY stage=01 checkpoint=CP-01 status="+report["status"])
          print("TELEMETRY workflow_count="+str(len(workflows)))
          print("TELEMETRY finding_count="+str(len(findings)))
          print("TELEMETRY audit_path="+str(out))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("status="+report["status"]+"\n")
          if findings: raise SystemExit(1)
          PY

      - name: Upload immutable audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp01-repository-audit
          path: |
            evidence/zona-directiva-v03/CP-01-repository-audit.json
            evidence/zona-directiva-v03/CP-01-repository-census-summary.json
            evidence/zona-directiva-v03/CP-01-repository-census.jsonl
            evidence/zona-directiva-v03/CP-01-repository-census.log
          if-no-files-found: warn
          retention-days: 90

  stage-02-contract-linkage:
    name: "Stage 02 / CP-02 — Contract and mission linkage"
    needs: stage-01-audit
    if: needs.stage-01-audit.result == 'success' && needs.stage-01-audit.outputs.audit_status == 'PASS_WITH_SCOPE_LIMITS'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - name: Checkout exact governance candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify contract, mission linkage, and protected branch boundaries
        id: verify
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/zona-directiva-v03
          python3 - <<'PY'
          import hashlib,json,os,pathlib,datetime,subprocess
          contract=pathlib.Path("governance/zona-directiva-v03/12_STAGE_GOVERNANCE_CONTRACT.md")
          mission=pathlib.Path("missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md")
          authority=pathlib.Path("Louksna.md")
          assurance=pathlib.Path("PUAC2.md")
          required=["EXTEND_DO_NOT_REPLACE","FAIL_CLOSED","NO_MAIN_MUTATION = TRUE","NO_AUTO_MERGE = TRUE","NO_AUTO_CERTIFICATION = TRUE","G23_INDEPENDENT_VALIDATION_REQUIRED = TRUE","G24_CERTIFICATION_REQUIRED = TRUE"]
          findings=[]
          for p in [contract,mission,authority,assurance]:
              if not p.is_file(): findings.append({"severity":"BLOCKER","id":"REQUIRED_FILE_MISSING","path":str(p)})
          if contract.is_file():
              text=contract.read_text()
              for item in required:
                  if item not in text: findings.append({"severity":"BLOCKER","id":"CONTRACT_INVARIANT_MISSING","detail":item})
              if "### ETAPA 01" not in text or "### ETAPA 12" not in text: findings.append({"severity":"BLOCKER","id":"STAGE_SEQUENCE_INCOMPLETE"})
          if mission.is_file():
              mt=mission.read_text()
              if "MISSION_ID = MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006" not in mt: findings.append({"severity":"BLOCKER","id":"MISSION_ID_MISMATCH"})
              if "NO_MAIN_MUTATION = TRUE" not in mt: findings.append({"severity":"BLOCKER","id":"MAIN_PROTECTION_CONTRACT_MISSING"})
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
          result={"schema":"louksna.zd.v03.checkpoint.v1","contract_id":"LOUKSNA-ZD-V03-12-STAGE-GOVERNANCE-20261009","mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006","stage_id":"02","checkpoint_id":"CP-02","timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"repository":os.getenv("GITHUB_REPOSITORY"),"run_id":os.getenv("GITHUB_RUN_ID"),"run_url":f"https://github.com/{os.getenv('GITHUB_REPOSITORY')}/actions/runs/{os.getenv('GITHUB_RUN_ID')}","commit_sha":os.getenv("CANDIDATE_SHA"),"candidate_branch":os.getenv("GITHUB_REF_NAME"),"status":"PASS" if not findings else "HOLD","requirements":required,"evidence":{"contract_sha256":digest(contract),"mission_sha256":digest(mission),"authority_sha256":digest(authority),"assurance_sha256":digest(assurance)},"findings":findings,"previous_checkpoint":"CP-01","next_authorized_stage":"03" if not findings else "NONE","rollback_pointer":os.getenv("CANDIDATE_SHA")}
          path=pathlib.Path("evidence/zona-directiva-v03/CP-02-contract-linkage.json")
          path.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("status="+result["status"]+"\n")
          if findings: raise SystemExit(1)
          PY
      - name: Preserve CP-02 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp02-contract-linkage
          path: evidence/zona-directiva-v03/CP-02-contract-linkage.json
          if-no-files-found: error
          retention-days: 90

  stage-03-backend-ledger:
    name: "Stage 03 / CP-03 — SQLite backend and evidence ledger"
    needs: stage-02-contract-linkage
    if: needs.stage-02-contract-linkage.result == 'success' && needs.stage-02-contract-linkage.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      status: ${{ steps.runtime.outputs.status }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Checkout frozen V0.2 source inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e34fddaae985bd9041be107b80e056f806092d2
          path: source-v02
          persist-credentials: false
      - name: Install native backend test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 360s sudo -E apt-get -o Acquire::Retries=3 update
          timeout 360s sudo -E apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            build-essential curl pkg-config libssl-dev libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          pkg-config --modversion glib-2.0 gobject-2.0
      - name: Run CP-03 static and runtime SQLite/evidence-ledger tests
        id: runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f scripts/missions/test_louksna_zd_v03_backend.py || { echo "CP-03 HOLD: backend test harness missing"; exit 1; }
          python3 -B -I scripts/missions/test_louksna_zd_v03_backend.py scripts/missions/v03_templates/main.rs
          mkdir -p "$RUNNER_TEMP/louksna-v03" "$GITHUB_WORKSPACE/evidence/zona-directiva-v03"
          printf '%s\n' '{"mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006","dispatch_id":"GH-GOVERNANCE-CP03","binding_id":"GOVERNANCE_CP03","executor_id":"CI_CHECKPOINT","expected_effect":{"effect_type":"RUNTIME_VALIDATION"}}' > "$RUNNER_TEMP/louksna-v03/DISPATCH.json"
          python3 -B -I scripts/missions/louksna_zd_candidate_materializer.py \
            "$RUNNER_TEMP/louksna-v03/DISPATCH.json" \
            "$RUNNER_TEMP/louksna-v03/ACK.json" \
            "$RUNNER_TEMP/louksna-v03/FME.json" \
            "$RUNNER_TEMP/louksna-v03/MATERIAL_RESULT.json" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/source-v02" \
            "$GITHUB_WORKSPACE/missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md"
          CANDIDATE="$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate"
          python3 -B -I scripts/missions/louksna_zd_v03_functionalizer.py "$CANDIDATE"
          cd "$CANDIDATE"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/louksna-v03/cargo-target-cp03"
          export CARGO_INCREMENTAL=0 TZ=UTC LC_ALL=C
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/louksna-src"
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --bin louksna-zona-directiva -- --nocapture --test-threads=1 2>&1 | tee "$GITHUB_WORKSPACE/evidence/zona-directiva-v03/CP-03-runtime-backend-tests.log"
          test_rc=${PIPESTATUS[0]}
          set -e
          python3 - "$GITHUB_WORKSPACE/evidence/zona-directiva-v03/CP-03-runtime-backend-tests.log" "$GITHUB_WORKSPACE/evidence/zona-directiva-v03/CP-03-backend-ledger.json" "$test_rc" <<'PY'
          import datetime,hashlib,json,os,pathlib,sys
          log=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); text=log.read_text(errors="replace")
          required=["sqlite_settings_chat_and_evidence_round_trip","empty_chat_message_is_rejected_without_network_access","evidence_ledger_failure_prevents_success_status"]
          missing=[name for name in required if name not in text]
          ok=sys.argv[3]=="0" and "test result: ok." in text and not missing
          report={"schema":"louksna.zd.v03.checkpoint-evidence.v1","stage_id":"03","checkpoint_id":"CP-03","status":"PASS" if ok else "HOLD","scope":"Runtime Rust backend tests against isolated on-disk SQLite, including positive and negative cases; no native GUI, Secret Service, attachment or voice claim.","timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"repository":os.getenv("GITHUB_REPOSITORY"),"commit_sha":os.getenv("CANDIDATE_SHA"),"run_id":os.getenv("GITHUB_RUN_ID"),"test_names":required,"missing_test_names":missing,"test_log_sha256":hashlib.sha256(log.read_bytes()).hexdigest(),"test_exit_code":int(sys.argv[3]),"test_harness_sha256":hashlib.sha256(pathlib.Path(os.environ["GITHUB_WORKSPACE"]+"/scripts/missions/test_louksna_zd_v03_backend.py").read_bytes()).hexdigest()}
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("status="+report["status"]+"\n")
          print(json.dumps(report,indent=2))
          if not ok: raise SystemExit("CP-03 HOLD: runtime SQLite/evidence-ledger proof incomplete")
          PY
      - name: Upload CP-03 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp03-backend-ledger
          path: |
            evidence/zona-directiva-v03/CP-03-backend-ledger.json
            evidence/zona-directiva-v03/CP-03-runtime-backend-tests.log
          if-no-files-found: warn
          retention-days: 90

  stage-04-github-bridge:
    name: "Stage 04 / CP-04 — Read-only GitHub bridge and credential safety"
    needs: stage-03-backend-ledger
    if: needs.stage-03-backend-ledger.result == 'success' && needs.stage-03-backend-ledger.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      status: ${{ steps.evidence.outputs.status }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Checkout frozen V0.2 source inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e34fddaae985bd9041be107b80e056f806092d2
          path: source-v02
          persist-credentials: false
      - name: Install disposable Secret Service test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 360s sudo -E apt-get -o Acquire::Retries=3 update
          timeout 360s sudo -E apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            build-essential curl pkg-config libssl-dev libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            dbus-x11 gnome-keyring libsecret-tools
          command -v secret-tool
          command -v dbus-run-session
      - name: Verify production credential lifecycle and real read-only GitHub API access
        id: evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo "CP-04 HOLD: GitHub API credential unavailable"; exit 1; }
          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" -o "$RUNNER_TEMP/repo-api.json"
          python3 - "$RUNNER_TEMP/repo-api.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d.get("full_name")
          assert isinstance(d.get("private"),bool)
          print("CP-04 live GitHub repository API read PASS; no mutation performed")
          PY
          mkdir -p "$RUNNER_TEMP/louksna-v03" evidence/zona-directiva-v03
          printf '%s\n' '{"mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006","dispatch_id":"GH-GOVERNANCE-CP04","binding_id":"GOVERNANCE_CP04","executor_id":"CI_CHECKPOINT","expected_effect":{"effect_type":"RUNTIME_VALIDATION"}}' > "$RUNNER_TEMP/louksna-v03/DISPATCH.json"
          python3 -B -I scripts/missions/louksna_zd_candidate_materializer.py \
            "$RUNNER_TEMP/louksna-v03/DISPATCH.json" \
            "$RUNNER_TEMP/louksna-v03/ACK.json" \
            "$RUNNER_TEMP/louksna-v03/FME.json" \
            "$RUNNER_TEMP/louksna-v03/MATERIAL_RESULT.json" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/source-v02" \
            "$GITHUB_WORKSPACE/missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md"
          CANDIDATE="$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate"
          python3 -B -I scripts/missions/louksna_zd_v03_functionalizer.py "$CANDIDATE"
          cd "$CANDIDATE"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/louksna-v03/cargo-target-cp04"
          export CARGO_INCREMENTAL=0 TZ=UTC LC_ALL=C
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/louksna-src"
          set +e
