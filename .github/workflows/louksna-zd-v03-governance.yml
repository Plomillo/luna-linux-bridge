  stage-07-voice-security:
    name: "Stage 07 / CP-07 — Voice E2E and security regression"
    needs: [stage-06-functions-attachments, stage-07-physical-voice]
    if: needs.stage-06-functions-attachments.result == 'success' && needs.stage-06-functions-attachments.outputs.status == 'PASS' && github.actor == 'Plomillo' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.stage-07-physical-voice.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.voice_gate.outputs.status }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Checkout frozen V0.2 source inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e34fddaae985bd9041be107b80e056f806092d2
          path: source-v02
          persist-credentials: false
      - name: Materialize candidate and install pinned browser E2E toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/louksna-v03" evidence/zona-directiva-v03
          # Always preserve a fail-closed voice-gate record even if browser E2E fails early.
          python3 - <<'PY'
          import datetime, json, pathlib
          p = pathlib.Path("evidence/zona-directiva-v03/CP-07-voice-gate.json")
          p.write_text(json.dumps({
            "schema": "louksna.zd.v03.voice-gate.v1",
            "stage_id": "07", "checkpoint_id": "CP-07",
            "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "voice_gate": "OPEN", "voice_active": False,
            "e2e_executed": False, "result": "HOLD_OPEN",
            "reason": "Provisional fail-closed record; voice E2E not evidenced.",
            "certification_effect": "G23_G24_BLOCKED"
          }, indent=2) + "\n")
          PY
          printf '%s\n' '{"mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006","dispatch_id":"GH-GOVERNANCE-CP07-PLAYWRIGHT","binding_id":"GOVERNANCE_CP07_PLAYWRIGHT","executor_id":"CI_CHECKPOINT","expected_effect":{"effect_type":"BROWSER_E2E_VALIDATION"}}' > "$RUNNER_TEMP/louksna-v03/DISPATCH.json"
          python3 -B -I scripts/missions/louksna_zd_candidate_materializer.py \
            "$RUNNER_TEMP/louksna-v03/DISPATCH.json" \
            "$RUNNER_TEMP/louksna-v03/ACK.json" \
            "$RUNNER_TEMP/louksna-v03/FME.json" \
            "$RUNNER_TEMP/louksna-v03/MATERIAL_RESULT.json" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/source-v02" \
            "$GITHUB_WORKSPACE/missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md"
          CANDIDATE="$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate"
          python3 -B -I scripts/missions/louksna_zd_v03_functionalizer.py "$CANDIDATE"
          cd "$CANDIDATE"
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          # GitHub-hosted ubuntu-24.04 already carries browser system libraries; install only the pinned browser here to avoid a slow apt dependency refresh.
          npx playwright install chromium
          node --version
          npm --version
          npx playwright --version
      - name: Execute real Chromium browser UI E2E with explicit Tauri IPC test double
        timeout-minutes: 4
        # Fail-closed: the captured E2E exit code must fail CP-07 and block dependent checkpoints.
        shell: bash
        run: |
          set -Eeuo pipefail
          CANDIDATE="$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate"
          test -f "$CANDIDATE/package.json" || { echo "CP-07 candidate package.json missing at expected materialized path: $CANDIDATE"; find "$GITHUB_WORKSPACE" -type f -path '*/src-tauri/tauri.conf.json' -print; exit 1; }
          REPORT="$GITHUB_WORKSPACE/evidence/zona-directiva-v03/CP-07-playwright-ui-e2e.json"
          E2E_LOG="$GITHUB_WORKSPACE/evidence/zona-directiva-v03/CP-07-playwright-ui-e2e.log"
          echo "CP-07 candidate=$CANDIDATE"
          test -f "$CANDIDATE/package.json"
          command -v node
          command -v timeout
          node --version
          set +e
          timeout 180s node scripts/missions/louksna_zd_v03_playwright_ui_e2e.mjs "$CANDIDATE" "$REPORT" 2>&1 | tee "$E2E_LOG"
          E2E_EXIT=${PIPESTATUS[0]}
          set -e
          if [[ ! -s "$REPORT" ]]; then
            python3 - "$REPORT" "$E2E_EXIT" <<'PY'
          import datetime, json, pathlib, sys
          report = {
              "schema": "louksna.zd.v03.playwright-ui-e2e.v1",
              "stage_id": "07",
              "checkpoint_id": "CP-07",
              "finished_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "repository": "Plomillo/luna-linux-bridge",
              "commit_sha": "${{ env.CANDIDATE_SHA }}",
              "run_id": "${{ github.run_id }}",
              "frontend_browser_e2e_executed": False,
              "native_tauri_runtime_tested": False,
              "voice_e2e_executed": False,
              "status": "FAIL",
              "error": "Playwright process exited without writing its report; exit_code=" + sys.argv[2],
              "failures": ["browser_e2e_report_missing"]
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(report, indent=2) + "\n")
          PY
          fi
          exit "$E2E_EXIT"
      - name: Execute voice-gate contract regression harness
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B scripts/missions/voice_e2e_gate_contract_test.py \
            scripts/missions/v03_templates/App.tsx \
            .github/workflows/louksna-zd-v03-governance.yml
          python3 -B scripts/missions/test_validate_voice_hardware_evidence.py
      - name: Import validated physical voice evidence from the same governance run
        if: needs.stage-07-physical-voice.result == 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: louksna-zd-v03-cp07-physical-voice-e2e
          path: evidence/zona-directiva-v03/physical-voice-evidence

      - name: Import physical voice evidence from a dedicated hardware run
        if: github.event_name == 'workflow_dispatch' && inputs.voice_hardware_evidence_run_id != '' && needs.stage-07-physical-voice.result != 'success'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: louksna-zd-v03-cp07-physical-voice-e2e
          run-id: ${{ inputs.voice_hardware_evidence_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: evidence/zona-directiva-v03/physical-voice-evidence

      - name: Record and validate CP-07 physical voice gate
        id: voice_gate
        shell: bash
        env:
          VOICE_HARDWARE_EVIDENCE_RUN_ID: ${{ inputs.voice_hardware_evidence_run_id || github.run_id }}
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/zona-directiva-v03
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess,sys
          evidence=pathlib.Path("evidence/zona-directiva-v03/physical-voice-evidence/CP-07-physical-voice-e2e.json")
          candidate=os.environ["CANDIDATE_SHA"]
          external_run=os.environ.get("VOICE_HARDWARE_EVIDENCE_RUN_ID","").strip()
          validated=None
          failure="No physical hardware evidence artifact was supplied; hosted CI cannot certify physical audio."
          if evidence.is_file() and external_run:
              raw=json.loads(evidence.read_text())
              if str(raw.get("source_run_id","")) != external_run:
                  failure="Physical voice artifact source_run_id does not match the selected GitHub Actions run."
              else:
                  check=subprocess.run([sys.executable,"scripts/missions/validate_voice_hardware_evidence.py",str(evidence),"--candidate-sha",candidate],text=True,capture_output=True)
                  try: validated=json.loads(check.stdout)
                  except Exception: validated=None
                  if check.returncode != 0 or not validated or validated.get("status") != "PASS":
                      failure="Physical voice evidence failed schema/provenance/SHA validation."
                      validated=validated or {"status":"HOLD","errors":["validator output invalid"]}
          if validated and validated.get("status")=="PASS":
              report={"schema":"louksna.zd.v03.voice-gate.v1","stage_id":"07","checkpoint_id":"CP-07",
                "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "repository":os.getenv("GITHUB_REPOSITORY"),"commit_sha":candidate,"run_id":os.getenv("GITHUB_RUN_ID"),
                "voice_gate":"PASS","voice_active":False,"voice_pipeline_implemented_in_source":True,
                "contract_regression_executed":True,"e2e_executed":True,"physical_audio_hardware_tested":True,
                "physical_evidence_source_run_id":external_run,"physical_evidence_sha256":hashlib.sha256(evidence.read_bytes()).hexdigest(),
                "physical_evidence_validation":validated,"contract_test_sha256":hashlib.sha256(pathlib.Path("scripts/missions/voice_e2e_gate_contract_test.py").read_bytes()).hexdigest(),
                "result":"PASS","reason":"Physical voice E2E evidence is bound to the exact candidate SHA and passed the fail-closed evidence validator; G23/G24 remain separate decisions.",
                "certification_effect":"ELIGIBLE_FOR_CP10_REVIEW_NOT_AUTO_CERTIFIED"}
              gate_status="PASS"
          else:
              report={"schema":"louksna.zd.v03.voice-gate.v1","stage_id":"07","checkpoint_id":"CP-07",
                "timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "repository":os.getenv("GITHUB_REPOSITORY"),"commit_sha":candidate,"run_id":os.getenv("GITHUB_RUN_ID"),
                "voice_gate":"OPEN","voice_active":False,"voice_pipeline_implemented_in_source":pathlib.Path("scripts/missions/v03_templates/voice.rs").is_file(),
                "contract_regression_executed":True,"e2e_executed":False,"physical_audio_hardware_tested":False,
                "contract_test_sha256":hashlib.sha256(pathlib.Path("scripts/missions/voice_e2e_gate_contract_test.py").read_bytes()).hexdigest(),
                "result":"HOLD_OPEN","reason":failure,"validator":validated,
                "certification_effect":"G23_G24_MUST_REMAIN_BLOCKED_WHILE_VOICE_IS_MANDATORY"}
              gate_status="HOLD"
          out=pathlib.Path("evidence/zona-directiva-v03/CP-07-voice-gate.json")
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("voice_gate="+report["voice_gate"]+"\n")
              f.write("status="+gate_status+"\n")
          PY
          echo "CP-07 gate result recorded with exact candidate binding; G23/G24 remain independent."
      - name: Fail CP-07 unless physical voice evidence passed
        if: steps.voice_gate.outputs.status != 'PASS'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "::error::CP-07 physical voice E2E has no validated evidence for the exact candidate SHA. A HOLD record is not a passing checkpoint."
          cat evidence/zona-directiva-v03/CP-07-voice-gate.json
          exit 1
      - name: Preserve CP-07 voice gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp07-voice-gate
          path: evidence/zona-directiva-v03/CP-07-voice-gate.json
          if-no-files-found: warn
          retention-days: 90
      - name: Preserve CP-07 browser E2E report and screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp07-playwright-ui-e2e
          path: |
            evidence/zona-directiva-v03/CP-07-playwright-ui-e2e.json
            evidence/zona-directiva-v03/CP-07-playwright-ui-e2e.png
            evidence/zona-directiva-v03/CP-07-playwright-ui-e2e.log
          if-no-files-found: warn
          retention-days: 90

  # Supplemental real-audio E2E is intentionally independent of hardware-only CP-07.
  stage-07-recorded-audio-e2e:
    name: "Stage 07 supplemental / Real recorded speech, live STT, LLM and TTS"
    needs: stage-06-functions-attachments
    if: needs.stage-06-functions-attachments.result == 'success' && needs.stage-06-functions-attachments.outputs.status == 'PASS'
    uses: ./.github/workflows/louksna-zd-v03-recorded-voice-e2e.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}

  stage-07-runner-preflight:
    name: "Stage 07 / CP-07 — Verify dedicated physical-audio runner inventory"
    needs: stage-06-functions-attachments
    if: needs.stage-06-functions-attachments.result == 'success' && needs.stage-06-functions-attachments.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify repository administration token is configured
        env:
          GH_TOKEN: ${{ secrets.LOUKSNA_REPO_ADMIN_READ_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::LOUKSNA_REPO_ADMIN_READ_TOKEN must be configured with repository Administration: read; refusing to infer runner availability."
            exit 1
          fi
      - name: Wait for a registered online dedicated hardware runner
        env:
          GH_TOKEN: ${{ secrets.LOUKSNA_REPO_ADMIN_READ_TOKEN }}
          REQUIRED_LABEL: louksna-voice-hw-dedicated
        shell: bash
        run: |
          set -Eeuo pipefail
          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100"
          for attempt in $(seq 1 30); do
            body="$RUNNER_TEMP/runner-inventory.json"
            code="$(curl --silent --show-error --output "$body" --write-out '%{http_code}' \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$api")"
            if [[ "$code" != "200" ]]; then
              echo "::error::Runner inventory API returned HTTP $code; check LOUKSNA_REPO_ADMIN_READ_TOKEN scope. No physical test was dispatched."
              exit 1
            fi
            if python3 - "$body" "$REQUIRED_LABEL" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          label=sys.argv[2]
          matches=[]
          for runner in data.get("runners",[]):
              labels={item.get("name") for item in runner.get("labels",[])}
              if label in labels and runner.get("status")=="online" and not runner.get("busy",False):
                  matches.append(runner)
          if matches:
              r=sorted(matches,key=lambda x:x.get("id",0))[0]
              print("DEDICATED_CP07_RUNNER_READY id=%s name=%s status=online busy=false" % (r.get("id"),r.get("name")))
              raise SystemExit(0)
          print("DEDICATED_CP07_RUNNER_WAIT label=%s attempt=%s" % (label,sys.argv[2] if False else "pending"))
          raise SystemExit(1)
          PY
            then
              exit 0
            fi
            echo "Dedicated physical runner not idle yet; retry $attempt/30."
            sleep 10
          done
          echo "::error::No online idle runner with label $REQUIRED_LABEL after 5 minutes. No workstation runner is substituted."
          exit 1

  stage-07-physical-voice:
    name: "Stage 07 / CP-07 — Real physical voice E2E"
    needs: [stage-06-functions-attachments, stage-07-runner-preflight]
    if: needs.stage-06-functions-attachments.result == 'success' && needs.stage-06-functions-attachments.outputs.status == 'PASS' && needs.stage-07-runner-preflight.result == 'success'
    uses: ./.github/workflows/louksna-zd-v03-physical-voice.yml
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  stage-08-reproducible-build:
    name: "Stage 08 / CP-08 — Build and Debian package"
    needs: stage-06-functions-attachments
    # Voice remains explicitly HOLD; continue non-voice package/runtime evidence without promoting the voice gate.
    if: needs.stage-06-functions-attachments.result == 'success' && needs.stage-06-functions-attachments.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      status: ${{ steps.material_status.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Checkout frozen V0.2 source inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 6e34fddaae985bd9041be107b80e056f806092d2
          path: source-v02
          persist-credentials: false
      - name: Install native Linux build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 360s sudo -E apt-get -o Acquire::Retries=3 update
          timeout 360s sudo -E apt-get -o Acquire::Retries=3 install --yes --no-install-recommends \
            build-essential curl wget file pkg-config patchelf \
            libssl-dev libgtk-3-dev libglib2.0-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
          pkg-config --modversion glib-2.0 gobject-2.0
      - name: Run first clean candidate build
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/zona-directiva-v03"
          mkdir -p "$RUNNER_TEMP/louksna-v03" "$EVIDENCE_DIR"
          printf '%s\n' '{"mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006","dispatch_id":"GH-GOVERNANCE-CP08","binding_id":"GOVERNANCE_CP08","executor_id":"CI_CHECKPOINT","expected_effect":{"effect_type":"BUILD_VALIDATION"}}' > "$RUNNER_TEMP/louksna-v03/DISPATCH.json"
          python3 -B -I scripts/missions/louksna_zd_candidate_materializer.py \
            "$RUNNER_TEMP/louksna-v03/DISPATCH.json" \
            "$RUNNER_TEMP/louksna-v03/ACK.json" \
            "$RUNNER_TEMP/louksna-v03/FME.json" \
            "$RUNNER_TEMP/louksna-v03/MATERIAL_RESULT.json" \
            "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/source-v02" \
            "$GITHUB_WORKSPACE/missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md"
          CANDIDATE="$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate"
          python3 -B -I scripts/missions/louksna_zd_v03_functionalizer.py "$CANDIDATE"
          python3 -B -I scripts/missions/test_louksna_zd_v03_backend.py scripts/missions/v03_templates/main.rs
          cd "$CANDIDATE"
          export SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$CANDIDATE_SHA")"
          export TZ=UTC LC_ALL=C CARGO_INCREMENTAL=0
          export CARGO_TARGET_DIR="$RUNNER_TEMP/louksna-v03/cargo-target-build-1"
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/louksna-src"
          if test -f package-lock.json; then
            npm ci
          else
            npm install --package-lock-only --ignore-scripts
            npm ci
          fi
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
          # Execute production Rust backend functions against isolated on-disk SQLite; this is not native GUI/voice proof.
          cargo test --manifest-path src-tauri/Cargo.toml --bin louksna-zona-directiva -- --nocapture --test-threads=1 2>&1 | tee "$EVIDENCE_DIR/CP-08-runtime-backend-tests.log"
          python3 - "$EVIDENCE_DIR/CP-08-runtime-backend-tests.log" "$EVIDENCE_DIR/CP-08-runtime-backend-tests.json" <<'PY'
          import datetime,hashlib,json,os,pathlib,sys
          log=pathlib.Path(sys.argv[1])
          text=log.read_text(errors="replace")
          required=["sqlite_settings_chat_and_evidence_round_trip","empty_chat_message_is_rejected_without_network_access","evidence_ledger_failure_prevents_success_status"]
          missing=[name for name in required if name not in text]
          ok=("test result: ok." in text and not missing)
          report={"schema":"louksna.zd.v03.runtime-backend-tests.v1","stage_id":"08","checkpoint_id":"CP-08","status":"PASS" if ok else "HOLD","scope":"Production Rust functions tested against isolated SQLite; no native Tauri IPC, Secret Service, GUI, attachment or voice claim.","timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"repository":os.getenv("GITHUB_REPOSITORY"),"commit_sha":os.getenv("CANDIDATE_SHA"),"run_id":os.getenv("GITHUB_RUN_ID"),"test_names":required,"missing_test_names":missing,"test_log_sha256":hashlib.sha256(log.read_bytes()).hexdigest()}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2))
          if not ok: raise SystemExit("CP-08 runtime backend test evidence incomplete")
          PY
          npx tauri build --bundles deb
          DEB="$(realpath "$(find "$CARGO_TARGET_DIR/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)")"
          test -n "$DEB"
          RAW_DEB="$DEB"
          NORMALIZED_DEB="${DEB%.deb}.canonical.deb"
          python3 -B -I "$GITHUB_WORKSPACE/scripts/missions/debian_package_canonicalize.py" --package "$RAW_DEB" --output "$NORMALIZED_DEB" --source-date-epoch "$SOURCE_DATE_EPOCH"
          DEB="$NORMALIZED_DEB"
          sha256sum "$DEB"
          stat -c 'package_size_bytes=%s' "$DEB"
          cp "$DEB" "$EVIDENCE_DIR/"
          python3 - "$DEB" "$EVIDENCE_DIR/CP-08-build-package.json" <<'PY'
          import datetime,hashlib,json,os,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          d={"schema":"louksna.zd.v03.checkpoint-evidence.v1","stage_id":"08","checkpoint_id":"CP-08","status":"BUILD_PASS_REPRODUCIBILITY_PENDING","scope":"First clean package build passed; an independent second build is required before reproducibility can pass.","timestamp_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),"repository":os.getenv("GITHUB_REPOSITORY"),"commit_sha":os.getenv("CANDIDATE_SHA"),"run_id":os.getenv("GITHUB_RUN_ID"),"builds":{"first":{"package_name":p.name,"size_bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()}}}
          pathlib.Path(sys.argv[2]).write_text(json.dumps(d,indent=2,sort_keys=True)+"\n")
          PY
      - name: Rebuild from clean source snapshot and compare package digests
        shell: bash
        run: |
          set -Eeuo pipefail
          EVIDENCE_DIR="$GITHUB_WORKSPACE/evidence/zona-directiva-v03"
          SECOND_ROOT="$RUNNER_TEMP/louksna-v03/repro2-source"
          RESULT="$RUNNER_TEMP/louksna-v03/repro2-result.json"
          mkdir -p "$SECOND_ROOT" "$SECOND_ROOT/source-v02" "$RUNNER_TEMP/louksna-v03"
          git -C "$GITHUB_WORKSPACE" archive "$CANDIDATE_SHA" | tar -x -C "$SECOND_ROOT"
          # Re-materialize the same pinned frozen V0.2 source input into the isolated
          # second-build workspace; do not point the materializer at the candidate repo.
          git -C "$GITHUB_WORKSPACE/source-v02" archive HEAD | tar -x -C "$SECOND_ROOT/source-v02"
          printf '%s\n' '{"mission_id":"MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006","dispatch_id":"GH-GOVERNANCE-CP08-REPRO2","binding_id":"GOVERNANCE_CP08_REPRO2","executor_id":"CI_CHECKPOINT","expected_effect":{"effect_type":"REPRODUCIBILITY_VALIDATION"}}' > "$RUNNER_TEMP/louksna-v03/DISPATCH2.json"
          if (
            set -Eeuo pipefail
            python3 -B -I "$SECOND_ROOT/scripts/missions/louksna_zd_candidate_materializer.py" \
              "$RUNNER_TEMP/louksna-v03/DISPATCH2.json" \
              "$RUNNER_TEMP/louksna-v03/ACK2.json" \
              "$RUNNER_TEMP/louksna-v03/FME2.json" \
              "$RUNNER_TEMP/louksna-v03/MATERIAL_RESULT2.json" \
              "$SECOND_ROOT" "$SECOND_ROOT/source-v02" \
              "$SECOND_ROOT/missions/inbox/louksna-zona-directiva-v03-functional-20261006/MISSION.md"
            CANDIDATE2="$SECOND_ROOT/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate"
            python3 -B -I "$SECOND_ROOT/scripts/missions/louksna_zd_v03_functionalizer.py" "$CANDIDATE2"
            cp "$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate/package-lock.json" "$CANDIDATE2/package-lock.json"
            CARGO_LOCK1="$GITHUB_WORKSPACE/LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/candidate/src-tauri/Cargo.lock"
            test -s "$CARGO_LOCK1"
            cp "$CARGO_LOCK1" "$CANDIDATE2/src-tauri/Cargo.lock"
            cmp -s "$CARGO_LOCK1" "$CANDIDATE2/src-tauri/Cargo.lock"
            cd "$CANDIDATE2"
            export SOURCE_DATE_EPOCH="$(git -C "$GITHUB_WORKSPACE" show -s --format=%ct "$CANDIDATE_SHA")"
            export TZ=UTC LC_ALL=C CARGO_INCREMENTAL=0
            export CARGO_TARGET_DIR="$RUNNER_TEMP/louksna-v03/cargo-target-build-2"
            export RUSTFLAGS="--remap-path-prefix=$SECOND_ROOT=/louksna-src"
            npm ci
            npm run build
            cargo check --manifest-path src-tauri/Cargo.toml
            npx tauri build --bundles deb
            DEB2="$(realpath "$(find "$CARGO_TARGET_DIR/release/bundle/deb" -maxdepth 1 -type f -name '*.deb' -print -quit)")"
            test -n "$DEB2"
            RAW_DEB2="$DEB2"
            NORMALIZED_DEB2="${DEB2%.deb}.canonical.deb"
            python3 -B -I "$SECOND_ROOT/scripts/missions/debian_package_canonicalize.py" --package "$RAW_DEB2" --output "$NORMALIZED_DEB2" --source-date-epoch "$SOURCE_DATE_EPOCH"
            DEB2="$NORMALIZED_DEB2"
            python3 -B -I "$GITHUB_WORKSPACE/scripts/missions/debian_build_evidence.py" digest --package "$DEB2" --output "$RESULT"
          ); then
            python3 -B -I "$GITHUB_WORKSPACE/scripts/missions/debian_build_evidence.py" finalize --report "$EVIDENCE_DIR/CP-08-build-package.json" --second-result "$RESULT"
          else
            python3 -B -I "$GITHUB_WORKSPACE/scripts/missions/debian_build_evidence.py" finalize --report "$EVIDENCE_DIR/CP-08-build-package.json" --second-build-failed
          fi
      - name: Publish material CP-08 checkpoint status
        id: material_status
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          REPORT="evidence/zona-directiva-v03/CP-08-build-package.json"
          status=HOLD
          if test -s "$REPORT"; then
            status="$(python3 - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          print("PASS" if d.get("status") == "PASS_REPRODUCIBLE_BUILD" else "HOLD")
          PY
          )"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "CP-08 material checkpoint status=$status"
      - name: Upload CP-08 build package and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp08-build-package
          path: |
            evidence/zona-directiva-v03/CP-08-build-package.json
            evidence/zona-directiva-v03/CP-08-runtime-backend-tests.json
            evidence/zona-directiva-v03/CP-08-runtime-backend-tests.log
            evidence/zona-directiva-v03/*.deb
          if-no-files-found: warn
          retention-days: 90

  stage-09-virtual-runtime:
    name: "Stage 09 / CP-09 — Debian 13 KDE disposable VM install, runtime and rollback evidence gate"
    needs: stage-08-reproducible-build
    if: needs.stage-08-reproducible-build.result == 'success' && needs.stage-08-reproducible-build.outputs.status == 'PASS'
    # User-authorized CP-09 execution in an actual disposable Debian 13 KDE/Xorg QEMU guest.
    # This is explicit VM evidence, not a physical GPU/audio/monitor certification claim.
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      runtime_status: ${{ steps.runtime_gate.outputs.status }}
      status: ${{ steps.runtime_gate.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Download exact CP-08 package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: louksna-zd-v03-cp08-build-package
          path: evidence/zona-directiva-v03/imported/louksna-zd-v03-cp08-build-package
      - name: Run Debian 13 container smoke test (supplemental only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/missions/debian13_package_smoke.sh \
            "$GITHUB_WORKSPACE/evidence/zona-directiva-v03/imported/louksna-zd-v03-cp08-build-package" \
            "$GITHUB_WORKSPACE/evidence/zona-directiva-v03"
      - name: Preserve Debian 13 container smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp09-debian13-container-smoke
          path: |
            evidence/zona-directiva-v03/CP-09-debian13-container-smoke.json
            evidence/zona-directiva-v03/CP-09-debian13-container-smoke.log
          if-no-files-found: warn
          retention-days: 90
      - name: Execute disposable Debian 13 KDE QEMU guest install, launch, and rollback
        id: runtime_gate
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/missions/debian13_kde_qemu_runtime.sh \
            "$GITHUB_WORKSPACE/evidence/zona-directiva-v03/imported/louksna-zd-v03-cp08-build-package" \
            "$GITHUB_WORKSPACE/evidence/zona-directiva-v03" \
            "$CANDIDATE_SHA"
      - name: Preserve CP-09 runtime gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp09-runtime-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/zona-directiva-v03/CP-09-debian13-kde-runtime.json
            evidence/zona-directiva-v03/CP-09-debian13-kde-runtime.log
          if-no-files-found: error
          retention-days: 90

  stage-10-evidence-freeze:
    name: "Stage 10 / CP-10 — Evidence dossier and candidate freeze"
    needs: [stage-09-virtual-runtime, stage-07-voice-security, stage-07-physical-voice]
    if: needs.stage-09-virtual-runtime.result == 'success' && needs.stage-09-virtual-runtime.outputs.status == 'PASS' && needs.stage-07-voice-security.result == 'success' && needs.stage-07-physical-voice.result == 'success'
    runs-on: ubuntu-24.04
    outputs:
      status: ${{ steps.validate.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Download same-run checkpoint artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: louksna-zd-v03-cp*
          path: evidence/zona-directiva-v03/imported
          merge-multiple: false
      - name: Validate evidence prerequisites
        id: validate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path("evidence/zona-directiva-v03/imported")
          required=["louksna-zd-v03-cp01-repository-audit","louksna-zd-v03-cp02-contract-linkage","louksna-zd-v03-cp03-backend-ledger","louksna-zd-v03-cp04-github-bridge","louksna-zd-v03-cp05-ui-telemetry","louksna-zd-v03-cp06-functions-attachments","louksna-zd-v03-cp07-voice-gate","louksna-zd-v03-cp07-playwright-ui-e2e","louksna-zd-v03-cp08-build-package","louksna-zd-v03-cp09-debian13-container-smoke","louksna-zd-v03-cp07-physical-voice-e2e"]
          required.append(f"louksna-zd-v03-cp09-runtime-gate-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          missing=[n for n in required if not (root/n).is_dir()]
          if missing:
              print("CP-10 HOLD: missing same-run evidence artifacts: "+", ".join(missing))
              raise SystemExit(1)
          files=sorted(root.rglob("*.json"))
          if not files:
              print("CP-10 HOLD: no JSON evidence documents downloaded")
              raise SystemExit(1)
          records=[]
          for p in files:
              try: d=json.loads(p.read_text())
              except Exception as e: raise SystemExit(f"CP-10 HOLD: invalid JSON {p}: {e}")
              if d.get("commit_sha") and d["commit_sha"] != __import__("os").environ["CANDIDATE_SHA"]:
                  raise SystemExit(f"CP-10 HOLD: stale commit evidence {p}")
              records.append({"path":str(p.relative_to(root)),"sha256":__import__("hashlib").sha256(p.read_bytes()).hexdigest()})
          blocking=[]
          for p in files:
              d=json.loads(p.read_text())
              name=p.name
              status=d.get("status")
              if name.startswith("CP-03") and status != "PASS":
                  runtime_report=root/"louksna-zd-v03-cp08-build-package"/"CP-08-runtime-backend-tests.json"
                  if not runtime_report.is_file():
                      blocking.append("CP-03 runtime backend evidence incomplete; no same-run CP-08 runtime test report")
                  else:
                      runtime=json.loads(runtime_report.read_text())
                      if runtime.get("status") != "PASS" or runtime.get("commit_sha") != os.environ["CANDIDATE_SHA"] or runtime.get("run_id") != os.environ["GITHUB_RUN_ID"]:
                          blocking.append("CP-03 supplemental runtime evidence is not PASS or not bound to this candidate/run")
                      log_path=runtime_report.with_name("CP-08-runtime-backend-tests.log")
                      if not log_path.is_file() or hashlib.sha256(log_path.read_bytes()).hexdigest() != runtime.get("test_log_sha256"):
                          blocking.append("CP-03 supplemental runtime test log missing or digest mismatch")
              if name.startswith("CP-04") and status != "PASS": blocking.append("CP-04 credential/bridge evidence incomplete")
              if name.startswith("CP-05") and status != "PASS": blocking.append("CP-05 live UI telemetry evidence incomplete")
              if name.startswith("CP-06") and status != "PASS": blocking.append("CP-06 GUI/persistence/attachment E2E evidence incomplete")
              if name.startswith("CP-07-voice") and (d.get("voice_gate") != "PASS" or d.get("result") not in ("PASS","PASS_WITH_SCOPE_LIMITS")): blocking.append("CP-07 voice E2E gate remains open")
              if name.startswith("CP-07-playwright") and status != "PASS_WITH_SCOPE_LIMITS": blocking.append("CP-07 Playwright browser UI E2E did not pass")
              if name == "CP-08-build-package.json" and status != "PASS_REPRODUCIBLE_BUILD": blocking.append("CP-08 reproducible build evidence incomplete")
              if name == "CP-09-debian13-kde-runtime.json":
                  if status != "PASS" or d.get("virtual_runtime_verified") is not True or d.get("runtime_environment") != "DISPOSABLE_QEMU_VM":
                      blocking.append("CP-09 Debian 13 KDE disposable VM runtime evidence is not PASS")
                  if d.get("commit_sha") != os.environ["CANDIDATE_SHA"]:
                      blocking.append("CP-09 report is not bound to the current candidate commit")
                  if d.get("install_test") != "PASS" or d.get("launch_test") != "PASS" or d.get("rollback_test") != "PASS":
                      blocking.append("CP-09 install/launch/rollback evidence incomplete")
                  log_path=p.with_name("CP-09-debian13-kde-runtime.log")
                  if not log_path.is_file():
                      blocking.append("CP-09 runtime log missing from evidence artifact")
                  elif hashlib.sha256(log_path.read_bytes()).hexdigest() != d.get("log_sha256"):
                      blocking.append("CP-09 runtime log SHA-256 mismatch")
                  package_dir=root/"louksna-zd-v03-cp08-build-package"
                  packages=sorted(package_dir.rglob("*.deb")) if package_dir.is_dir() else []
                  if len(packages) != 1:
                      blocking.append("CP-09 must bind exactly one same-run CP-08 Debian package")
                  elif hashlib.sha256(packages[0].read_bytes()).hexdigest() != d.get("candidate_sha256"):
                      blocking.append("CP-09 package digest does not match the same-run CP-08 package")
          blocking=sorted(set(blocking))
          final_status="PASS" if not blocking else "HOLD"
          out=pathlib.Path("evidence/zona-directiva-v03/CP-10-evidence-manifest.json")
          out.write_text(json.dumps({"schema":"louksna.zd.v03.evidence-manifest.v1","stage_id":"10","checkpoint_id":"CP-10","status":final_status,"candidate_commit_sha":__import__("os").environ["CANDIDATE_SHA"],"run_id":__import__("os").environ["GITHUB_RUN_ID"],"evidence_count":len(records),"evidence":records,"blocking_reasons":blocking,"next_authorized_stage":"11" if not blocking else "NONE"},indent=2,sort_keys=True)+"\n")
          print(json.dumps({"CP-10_status":final_status,"blocking_reasons":blocking},indent=2))
          with open(__import__("os").environ["GITHUB_OUTPUT"],"a") as f:
              f.write("status="+final_status+"\n")
          if blocking:
              raise SystemExit(1)
          PY
      - name: Preserve CP-10 evidence manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp10-evidence-manifest
          path: evidence/zona-directiva-v03/CP-10-evidence-manifest.json
          if-no-files-found: error
          retention-days: 90

  stage-11-independent-validation:
    name: "Stage 11 / CP-11 — G23 independent validation"
    needs: stage-10-evidence-freeze
    if: needs.stage-10-evidence-freeze.result == 'success' && needs.stage-10-evidence-freeze.outputs.status == 'PASS'
    runs-on: ubuntu-24.04
    environment:
      name: louksna-g23-independent-validation
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Record protected G23 independent-validation gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "GitHub Environment louksna-g23-independent-validation requires reviewer approval before this job can start."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - name: Independently re-download and verify frozen evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: louksna-zd-v03-cp*
          path: evidence/g23/imported
          merge-multiple: false
      - name: Recompute evidence hashes and validate exact-SHA voice proof
        id: g23
        env:
          CANDIDATE_SHA: ${{ env.CANDIDATE_SHA }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,sys
          root=pathlib.Path("evidence/g23/imported")
          manifest_path=root/"louksna-zd-v03-cp10-evidence-manifest"/"CP-10-evidence-manifest.json"
          if not manifest_path.is_file(): raise SystemExit("G23 HOLD: CP-10 manifest missing from this exact workflow run")
          manifest=json.loads(manifest_path.read_text(encoding="utf-8"))
          candidate=os.environ["CANDIDATE_SHA"]
          run_id=int(os.environ["GITHUB_RUN_ID"])
          if manifest.get("status")!="PASS": raise SystemExit("G23 HOLD: CP-10 is not PASS")
          if manifest.get("candidate_commit_sha")!=candidate: raise SystemExit("G23 HOLD: manifest candidate SHA mismatch")
          if str(manifest.get("run_id"))!=str(run_id): raise SystemExit("G23 HOLD: manifest run ID mismatch")
          records=manifest.get("evidence")
          if not isinstance(records,list) or not records: raise SystemExit("G23 HOLD: evidence list empty")
          checked=[]
          for rec in records:
              rel=rec.get("path","")
              expected=rec.get("sha256","")
              if not rel or pathlib.PurePosixPath(rel).is_absolute() or ".." in pathlib.PurePosixPath(rel).parts:
                  raise SystemExit("G23 HOLD: invalid manifest path")
              p=root/rel
              if not p.is_file(): raise SystemExit("G23 HOLD: evidence file missing: "+rel)
              actual=hashlib.sha256(p.read_bytes()).hexdigest()
              if actual!=expected: raise SystemExit("G23 HOLD: evidence digest mismatch: "+rel)
              checked.append({"path":rel,"sha256":actual})
          voice=root/"louksna-zd-v03-cp07-physical-voice-e2e"
          voice_json=voice/"CP-07-physical-voice-e2e.json"
          voice_log=voice/"CP-07-physical-voice-e2e.log"
          if not voice_json.is_file() or not voice_log.is_file():
              raise SystemExit("G23 HOLD: physical voice evidence/log missing")
          voice_data=json.loads(voice_json.read_text(encoding="utf-8"))
          if voice_data.get("source_run_id") is None:
              raise SystemExit("G23 HOLD: physical voice source run provenance missing")
          import subprocess
          subprocess.run([sys.executable,"scripts/missions/validate_voice_hardware_evidence.py",str(voice_json),"--candidate-sha",candidate],check=True)
          report={
            "schema":"louksna.zd.v03.g23-independent-validation.v1",
            "checkpoint_id":"G23","status":"PASS",
            "candidate_commit_sha":candidate,"source_workflow_run_id":run_id,
            "evidence_manifest_sha256":hashlib.sha256(manifest_path.read_bytes()).hexdigest(),
            "evidence_count":len(checked),"evidence_hashes_recomputed":True,
            "physical_voice_evidence_sha256":hashlib.sha256(voice_json.read_bytes()).hexdigest(),
            "physical_voice_log_sha256":hashlib.sha256(voice_log.read_bytes()).hexdigest(),
            "protected_environment":"louksna-g23-independent-validation",
            "protected_review_required":True,
            "validated_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          out=pathlib.Path("evidence/g23/CP-11-G23-independent-validation.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - name: Preserve G23 independent validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp11-g23-independent-validation
          path: evidence/g23/CP-11-G23-independent-validation.json
          if-no-files-found: error
          retention-days: 90

  stage-12-certification:
    name: "Stage 12 / CP-12 — G24 certification and release decision"
    needs: stage-11-independent-validation
    if: needs.stage-11-independent-validation.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: louksna-g24-certification
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Record protected G24 certification gate
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "GitHub Environment louksna-g24-certification requires reviewer approval before this job can start."
      - name: Checkout exact candidate and import G23 report
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: louksna-zd-v03-cp11-g23-independent-validation
          path: evidence/g24/g23
      - name: Validate G23 and issue digest-bound G24 decision record
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          p=pathlib.Path("evidence/g24/g23/CP-11-G23-independent-validation.json")
          if not p.is_file(): raise SystemExit("G24 HOLD: G23 report missing")
          g23=json.loads(p.read_text(encoding="utf-8"))
          if g23.get("schema")!="louksna.zd.v03.g23-independent-validation.v1" or g23.get("status")!="PASS":
              raise SystemExit("G24 HOLD: G23 status/schema invalid")
          if g23.get("candidate_commit_sha")!=os.environ["CANDIDATE_SHA"]:
              raise SystemExit("G24 HOLD: G23 candidate SHA mismatch")
          if g23.get("source_workflow_run_id")!=int(os.environ["GITHUB_RUN_ID"]):
              raise SystemExit("G24 HOLD: G23 source run mismatch")
          if g23.get("evidence_hashes_recomputed") is not True or not g23.get("evidence_manifest_sha256"):
              raise SystemExit("G24 HOLD: G23 independent digest validation incomplete")
          certificate={
            "schema":"louksna.zd.v03.g24-certification-decision.v1",
            "checkpoint_id":"G24","status":"CERTIFIED",
            "candidate_commit_sha":os.environ["CANDIDATE_SHA"],
            "source_workflow_run_id":int(os.environ["GITHUB_RUN_ID"]),
            "g23_report_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "g23_evidence_manifest_sha256":g23["evidence_manifest_sha256"],
            "certification_environment":"louksna-g24-certification",
            "protected_reviewer_approval_required":True,
            "certified_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "activation":"NOT_PERFORMED",
            "merge":"NOT_PERFORMED"
          }
          out=pathlib.Path("evidence/g24/CP-12-G24-certification-decision.json")
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(certificate,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(certificate,indent=2,sort_keys=True))
          PY
      - name: Preserve G24 certification decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-cp12-g24-certification-decision
          path: evidence/g24/CP-12-G24-certification-decision.json
          if-no-files-found: error
          retention-days: 90
