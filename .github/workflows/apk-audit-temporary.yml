name: Temporary APK forensic audit

on:
  push:
    branches:
      - "candidate/document-factory-v1-unit2-20261013"
    paths:
      - ".github/workflows/apk-audit-temporary.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify APK identity and archive integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="base (1).apk"
          test -s "$APK"
          file "$APK"
          stat -c "%s bytes" "$APK"
          sha256sum "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              bad=z.testzip()
              print('ZIP_TEST=' + ('PASS' if bad is None else 'FAIL:'+bad))
              if bad: raise SystemExit(2)
              print('ZIP_ENTRIES=',len(z.infolist()))
          PY
      - name: Parse manifest and DEX without xref graph
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input --no-cache-dir androguard==4.1.3
          python3 - "base (1).apk" "$RUNNER_TEMP/apk-audit-report.txt" <<'PY'
          import collections, hashlib, logging, re, sys, zipfile
          logging.disable(logging.CRITICAL)
          from loguru import logger
          logger.remove()
          from androguard.core.apk import APK
          from androguard.core.dex import DEX
          apk_path, report_path = sys.argv[1], sys.argv[2]
          def emit(k,v): print(f'{k}={v}')
          with open(report_path,'w',encoding='utf-8') as report:
              from contextlib import redirect_stdout
              with redirect_stdout(report):
                  a=APK(apk_path)
                  print('=== PACKAGE IDENTITY ===')
                  for key, method in [('PACKAGE','get_package'),('APP_LABEL','get_app_name'),('VERSION_NAME','get_androidversion_name'),('VERSION_CODE','get_androidversion_code'),('MIN_SDK','get_min_sdk_version'),('TARGET_SDK','get_target_sdk_version'),('EFFECTIVE_TARGET_SDK','get_effective_target_sdk_version'),('MAX_SDK','get_max_sdk_version'),('MAIN_ACTIVITY','get_main_activity')]:
                      try: emit(key,getattr(a,method)())
                      except Exception as e: emit(key,'UNAVAILABLE:'+type(e).__name__)
                  for key, method in [('PERMISSIONS','get_permissions'),('ACTIVITIES','get_activities'),('SERVICES','get_services'),('RECEIVERS','get_receivers'),('PROVIDERS','get_providers'),('LIBRARIES','get_libraries'),('FEATURES','get_features')]:
                      try:
                          print(key+'=')
                          for v in (getattr(a,method)() or []): print('  '+str(v))
                      except Exception as e: emit(key,'UNAVAILABLE:'+type(e).__name__)
                  print('=== MANIFEST COMPONENT DETAILS ===')
                  try:
                      root=a.get_android_manifest_xml()
                      ns='{http://schemas.android.com/apk/res/android}'
                      for kind in ('activity','activity-alias','service','receiver','provider'):
                          for el in root.findall('.//application/'+kind):
                              attrs={key.split('}')[-1]:val for key,val in el.attrib.items()}
                              acts=[x.attrib.get(ns+'name') for x in el.findall('./intent-filter/action')]
                              cats=[x.attrib.get(ns+'name') for x in el.findall('./intent-filter/category')]
                              print(kind.upper(),attrs,'actions=',acts,'categories=',cats)
                  except Exception as e: print('MANIFEST_COMPONENT_PARSE_ERROR',type(e).__name__,str(e)[:250])
                  print('=== ARCHIVE AND DEX INVENTORY ===')
                  with zipfile.ZipFile(apk_path) as z:
                      infos=z.infolist()
                      emit('ZIP_ENTRY_COUNT',len(infos))
                      emit('DEX_FILES',[x.filename for x in infos if re.fullmatch(r'classes(\d*)\.dex',x.filename)])
                      emit('NATIVE_LIBRARIES',[x.filename for x in infos if x.filename.startswith('lib/') and x.filename.endswith('.so')])
                      emit('APK_ASSET_BYTES',sum(x.file_size for x in infos if x.filename.startswith('assets/')))
                  dex_names=list(a.get_dex_names())
                  emit('DEX_COUNT',len(dex_names))
                  class_count=0
                  packages=collections.Counter()
                  matches=[]
                  dex_terms=('service','worker','job','alarm','receiver','boot','firebase','push','foreground','notification','sync','accessibility','vpn','inputmethod','wake','deviceadmin')
                  string_terms=re.compile(r'workmanager|androidx\.work|alarmmanager|jobscheduler|startforeground|startforegroundservice|startsticky|onstartcommand|boot_completed|firebasemessaging|wakelock|ignore_battery|foreground_service|accessibilityservice|vpnservice|device_admin|input_method',re.I)
                  string_hits=set()
                  for dex_name, raw in zip(dex_names,a.get_all_dex()):
                      d=DEX(raw)
                      names=[c.get_name() for c in d.get_classes()]
                      for name in names:
                          class_count+=1
                          parts=name.strip('L;').split('/')
                          packages['/'.join(parts[:2]) if len(parts)>1 else parts[0]]+=1
                          if any(t in name.lower() for t in dex_terms): matches.append(name)
                      try:
                          for value in d.get_strings():
                              s=str(value)
                              if string_terms.search(s): string_hits.add(s[:220])
                      except Exception: pass
                  emit('DEX_CLASS_COUNT',class_count)
                  print('TOP_CLASS_NAMESPACES=')
                  for k,v in packages.most_common(35): print(f'  {k}: {v}')
                  print('BACKGROUND_RELATED_CLASSES=')
                  for x in sorted(set(matches))[:150]: print('  '+x)
                  print('BACKGROUND_RELATED_STRINGS=')
                  for x in sorted(string_hits)[:100]: print('  '+x)
                  print('=== SIGNATURE INDICATORS ===')
                  for key in ('is_signed_v1','is_signed_v2','is_signed_v3','is_signed_v4'):
                      try:
                          if hasattr(a,key): emit(key.upper(),getattr(a,key)())
                      except Exception as e: emit(key.upper(),'UNAVAILABLE:'+type(e).__name__)
                  emit('SIGNATURE_API_METHODS',[m for m in dir(a) if 'cert' in m.lower() or 'sign' in m.lower()])
                  for label, method in [('V2','get_certificates_der_v2'),('V3','get_certificates_der_v3'),('V1','get_certificates_der')]:
                      try:
                          from asn1crypto import x509
                          raw_certs=getattr(a,method)()
                          rows=[]
                          for raw in raw_certs:
                              cert=x509.Certificate.load(raw)
                              rows.append({'sha256':cert.sha256_fingerprint.replace(' ','').lower(),'subject':cert.subject.human_friendly,'issuer':cert.issuer.human_friendly})
                          emit(label+'_SIGNER_CERTIFICATES',rows)
                      except Exception as e: emit(label+'_SIGNER_CERTIFICATES','UNAVAILABLE:'+type(e).__name__+':'+str(e)[:160])
                  print('AUDIT_PARSE=COMPLETED')
          print('REPORT_BYTES=',__import__('os').path.getsize(report_path))
          PY
          cat "$RUNNER_TEMP/apk-audit-report.txt"
      - name: Upload compact forensic report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apk-forensic-report
          path: ${{ runner.temp }}/apk-audit-report.txt
          if-no-files-found: error
          retention-days: 7
