name: "CUSTOSZ — consultas implementation verify certify 6m"

on:
  push:
    branches:
      - staging/consultas-implementation-6m-20261002
    paths:
      - .github/workflows/custosz-consultas-implementation-6m.yml

permissions:
  contents: read

jobs:
  verify-certify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout exact consultas candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: CUSTOSZ assess live candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p consultas-assurance
          CUSTOSZ="artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz"
          EXPECTED="dacf1f8c13b2fcbfc617cf0d4d780b30502c13395224691e6b0f05f53d9816a2"
          test -f "$CUSTOSZ"
          test "$(sha256sum "$CUSTOSZ" | awk '{print $1}')" = "$EXPECTED"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,sys
          root=pathlib.Path.cwd()
          c=root/"artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz"
          os.environ["CUSTOSZ_STATE_DIR"]=str(root/"consultas-assurance/ephemeral-custosz-state")
          sys.path.insert(0,str(c))
          import custosz_v05_legacy as w
          w.workspace=lambda: root
          w.discover=lambda: {"workspace":str(root),"projects":{"LUNA_PROJECT":{"status":"RESOLVED","path":str(root),"score":999}}}
          prompt=(
            "Evalúa este candidato de implementación consultas/ en modo READ_ONLY_ASSURANCE. "
            "Debe permanecer separado de missions/, preservar Louksna.md, impedir ejecución material "
            "desde consultas, exigir SOURCE_SHA256, estados ANSWERED/HOLD/REJECTED, promoción explícita "
            "CONSULTA->MISIÓN y no propagar certificación. No modificar nada ni autocertificar."
          )
          out={
            "schema":"LOUKSNA_CONSULTAS_CANDIDATE_CUSTOSZ_ASSESSMENT/1.0",
            "candidate_sha":os.environ["GITHUB_SHA"],
            "authority":"Louksna.md",
            "custosz_sha256":hashlib.sha256(c.read_bytes()).hexdigest(),
            "mode":"READ_ONLY_ASSURANCE",
            "architecture":w.architect(prompt,"LUNA_PROJECT"),
            "reasoning_policy":w.reasoning_policy(prompt,"LUNA_PROJECT")
          }
          pathlib.Path("consultas-assurance/CUSTOSZ_ASSESSMENT.json").write_text(
            json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("CUSTOSZ_CANDIDATE_ASSESSMENT=PASS")
          PY

      - name: Functional verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m json.tool consultas/schema/consulta-envelope.schema.json >/dev/null
          python3 -m json.tool consultas/registry/policy.json >/dev/null
          python3 scripts/consultas/selftest.py
          td="$(mktemp -d)"
          printf '¿Puede responder esta consulta de prueba?\n' > "$td/CONSULTA_ORIGINAL.md"
          python3 scripts/consultas/compile_consulta.py "$td/CONSULTA_ORIGINAL.md" --out "$td/envelope.json"
          python3 scripts/consultas/process_consulta.py "$td/envelope.json" "$td/CONSULTA_ORIGINAL.md"             --custosz artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz --out "$td/result.json"
          python3 - "$td/result.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["state"]=="ANSWERED", r
          assert r["execution_authorized"] is False
          assert r["mutation_authorized"] is False
          assert r.get("certification_propagated") is False
          print("LIVE_CONSULTA_PROCESSING=PASS")
          PY

      - name: G23 independent validation in clean worktree
        shell: bash
        env:
          BASE_SHA: "597853f8b45dceeac5d7ee38a4283f9c98d098a1"
        run: |
          set -Eeuo pipefail
          WT="$RUNNER_TEMP/consultas-g23"
          git worktree add --detach "$WT" "$GITHUB_SHA"
          cd "$WT"
          python3 scripts/consultas/selftest.py
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          base=os.environ["BASE_SHA"]
          cand=os.environ["GITHUB_SHA"]
          def sh(*a):
              return subprocess.check_output(a,text=True).strip()
          changed=sh("git","diff","--name-only",base,cand).splitlines()
          def allowed(p):
              return (
                  p.startswith("consultas/") or
                  p.startswith("scripts/consultas/") or
                  p==".github/workflows/custosz-consultas-mailbox.yml" or
                  p==".github/workflows/custosz-consultas-implementation-6m.yml"
              )
          policy=json.load(open("consultas/registry/policy.json",encoding="utf-8"))
          checks={
            "candidate_sha_bound":sh("git","rev-parse","HEAD")==cand,
            "scope_only":all(allowed(p) for p in changed),
            "missions_tree_unchanged":sh("git","rev-parse",base+":missions")==sh("git","rev-parse",cand+":missions"),
            "louksna_unchanged":sh("git","rev-parse",base+":Louksna.md")==sh("git","rev-parse",cand+":Louksna.md"),
            "mission_mailbox_unchanged":sh("git","rev-parse",base+":mission-mailbox")==sh("git","rev-parse",cand+":mission-mailbox"),
            "mission_scripts_unchanged":sh("git","rev-parse",base+":scripts/mission_mailbox")==sh("git","rev-parse",cand+":scripts/mission_mailbox"),
            "execution_false":policy["execution_authorized"] is False,
            "mutation_false":policy["mutation_authorized"] is False,
            "promotion_explicit":policy["promotion_rule"]=="NEW_AUTHORIZATION_PLUS_NEW_TRACEABLE_MISSION_OBJECT",
            "terminal_states_exact":policy["allowed_terminal_states"]==["ANSWERED","HOLD","REJECTED"],
            "no_cert_propagation":"CERTIFICATION_PROPAGATION" in policy["forbidden"]
          }
          result="PASS" if all(checks.values()) else "FAIL"
          out={
            "schema":"LOUKSNA_CONSULTAS_IMPLEMENTATION_G23/1.0",
            "gate":"G23_INDEPENDENT_VALIDATION",
            "scope":"CONSULTAS_CHANNEL_CANDIDATE_ONLY",
            "base_sha":base,
            "candidate_sha":cand,
            "changed_files":changed,
            "checks":checks,
            "result":result,
            "certification_propagation":False,
            "main_modified":False
          }
          target=pathlib.Path(os.environ["GITHUB_WORKSPACE"])/"consultas-assurance/G23.json"
          target.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(out,indent=2,sort_keys=True))
          if result!="PASS":
              raise SystemExit("G23_FAIL")
          PY

      - name: G24 certify exact candidate scope
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os,pathlib,subprocess
          g23=json.load(open("consultas-assurance/G23.json",encoding="utf-8"))
          cand=os.environ["GITHUB_SHA"]
          checks={
            "g23_pass":g23.get("result")=="PASS",
            "g23_scope_exact":g23.get("scope")=="CONSULTAS_CHANNEL_CANDIDATE_ONLY",
            "g23_candidate_bound":g23.get("candidate_sha")==cand,
            "no_certification_propagation":g23.get("certification_propagation") is False,
            "main_not_modified":g23.get("main_modified") is False
          }
          status="PASS" if all(checks.values()) else "FAIL"
          cert={
            "schema":"LOUKSNA_CONSULTAS_IMPLEMENTATION_G24/1.0",
            "gate":"G24_CERTIFICATION",
            "scope":"CONSULTAS_CHANNEL_CANDIDATE_ONLY",
            "candidate_sha":cand,
            "status":status,
            "operational_status":"CERTIFIED_CANDIDATE_NOT_IN_MAIN" if status=="PASS" else "HOLD",
            "authority":"Louksna.md",
            "checks":checks,
            "certification_propagation":False,
            "main_incorporation_certified":False,
            "next":"SEPARATE_AUTHORIZED_PROMOTION_OR_MIGRATION_STEP" if status=="PASS" else "HOLD"
          }
          pathlib.Path("consultas-assurance/G24.json").write_text(
            json.dumps(cert,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(cert,indent=2,sort_keys=True))
          if status!="PASS":
              raise SystemExit("G24_FAIL")
          PY

      - name: Preserve assurance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: consultas-implementation-assurance
          path: consultas-assurance/
          if-no-files-found: error
          retention-days: 30
