name: "CUSTOSZ V7 + Runtime — FFprobe governed admission"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/document-factory-ffprobe-custosz-v7.yml"
      - "scripts/missions/document_factory_ffprobe_dispatch.py"
      - "scripts/missions/document_factory_ffprobe_executor.py"
      - "scripts/missions/document_factory_ffprobe_supervisor.py"
      - "scripts/missions/document_factory_ffprobe_materializer.py"
      - "missions/document-factory-ffprobe-admission-20261005/MISSION.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custosz-document-factory-ffprobe-admission
  cancel-in-progress: false

jobs:
  ffprobe-admission:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 45
    steps:
      - name: Checkout main authority and mission surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
          path: main-root

      - name: Checkout CUSTOSZ V7 runtime surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: staging/custosz-mission-mailbox-20260928
          persist-credentials: false
          path: mailbox

      - name: Checkout exact ACTIVE Document Factory anchor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 43a82aa30607b8775c998fa39b2bc08bfc2a263f
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Establish isolated additive work branch
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          test "$(git rev-parse HEAD)" = "43a82aa30607b8775c998fa39b2bc08bfc2a263f"
          git switch -C custosz/document-factory-ffprobe-admission-20261005
          echo "ACTIVE_CERTIFIED_ANCHOR_PRESERVED=43a82aa30607b8775c998fa39b2bc08bfc2a263f"

      - name: CUSTOSZ V7 plus Runtime material FFprobe admission
        shell: bash
        run: |
          set -Eeuo pipefail
          export MAIN_ROOT="$GITHUB_WORKSPACE/main-root"
          export MAILBOX_ROOT="$GITHUB_WORKSPACE/mailbox"
          export TARGET_ROOT="$GITHUB_WORKSPACE/target"
          export OUT_DIR="$RUNNER_TEMP/document-factory-ffprobe-admission"
          export CUSTOSZ_WORKSPACE_OVERRIDE="$HOME/SYMPHYLAX_LAB/CUSTOSZ_V7_R1_G23_G24_20260927T021532Z/POSIX_COMPATIBILITY_VIEW"
          export MAKEFLAGS="-j2"
          ulimit -v 2097152 || true
          nice -n 10 python3 -B -I main-root/scripts/missions/document_factory_ffprobe_dispatch.py

      - name: Expose preserved materializer diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/document-factory-ffprobe-admission"
          echo "=== SUPERVISOR COMPLETION ==="
          cat "$D/SUPERVISOR_COMPLETION.json" 2>/dev/null || true
          echo "=== SUPERVISOR HEARTBEAT ==="
          cat "$D/SUPERVISOR_HEARTBEAT.json" 2>/dev/null || true
          echo "=== MATERIALIZER STDOUT ==="
          cat "$D/MATERIALIZER.stdout.log" 2>/dev/null || true
          echo "=== MATERIALIZER STDERR ==="
          cat "$D/MATERIALIZER.stderr.log" 2>/dev/null || true

      - name: Persist FFprobe candidate branch only
        shell: bash
        run: |
          set -Eeuo pipefail
          cd target
          test "$(git merge-base 43a82aa30607b8775c998fa39b2bc08bfc2a263f HEAD)" = "43a82aa30607b8775c998fa39b2bc08bfc2a263f"
          git add document-factory
          if git diff --cached --quiet; then
            echo "FFPROBE_MATERIAL_CHANGES=0"
            exit 1
          fi
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git commit -m "feat(document-factory): admit PGP-verified FFprobe provider candidate"
          git push origin HEAD:refs/heads/custosz/document-factory-ffprobe-admission-20261005

      - name: Preserve FFprobe admission evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-factory-ffprobe-custosz-v7
          path: ${{ runner.temp }}/document-factory-ffprobe-admission
          if-no-files-found: warn
          retention-days: 90
