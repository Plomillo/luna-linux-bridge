name: "Dropbox OAuth refresh material flow LIVE"

on:
  push:
    branches:
      - staging/dropbox-oauth-refresh-material-flow-20261005
    paths:
      - .github/workflows/dropbox-oauth-refresh-material-flow-live.yml
      - scripts/dropbox_governed_recovery_20h.py
      - mission-control/dropbox-main-governed-recovery-20h/REQUEST.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dropbox-oauth-refresh-material-flow-live
  cancel-in-progress: false

env:
  MISSION_ID: DROPBOX_MAIN_GOVERNED_RECOVERY_20H_20261004
  TARGET_NAME: "1. PROYECTOS PRIORITARIOS"
  HARD_CEILING_SECONDS: "72000"
  REQUIRE_DROPBOX_OAUTH_REFRESH: "1"
  ALLOW_RCLONE_TOKEN_BINDING: "1"
  DROPBOX_SHARED_LINK: "https://www.dropbox.com/scl/fo/0dhs5jhwksqtmwl26vusi/AIIzeblluaJfhuXh9EnP-10?rlkey=p712fwlkbwn9g0dtybu2sf159&st=3igdng0g&dl=0"

jobs:
  oauth_acquire:
    name: "OAuth P1 — prove authenticated material byte flow then leave running"
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 1200

    steps:
      - name: Checkout exact OAuth delta
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: _dropbox_oauth_${{ github.run_id }}
          persist-credentials: false

      - name: Resolve and verify exact MAIN-sync G23 G24 operational authorization
        shell: bash
        working-directory: ${{ github.workspace }}/_dropbox_oauth_${{ github.run_id }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          E="$RUNNER_TEMP/dropbox-oauth-binding-${GITHUB_RUN_ID}"
          mkdir -p "$E"
          python3 - "$E/AUTHORIZATION_GATE.json" <<'PY'
          import hashlib,io,json,os,pathlib,sys,urllib.parse,urllib.request,zipfile
          root=pathlib.Path(".")
          out_path=pathlib.Path(sys.argv[1])
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          scope="DROPBOX_OAUTH_BINDING_AND_ACQUISITION"
          cert_branch="staging/dropbox-lrb-main-sync-cert-20261005"
          workflow_name="Dropbox LRB MAIN-sync — independent G23 G24 scope certification"
          targets=[
            "scripts/dropbox/lrb_main_sync.py",
            "scripts/dropbox_governed_recovery_20h.py",
            ".github/workflows/dropbox-lrb-rclone-oauth-bootstrap.yml",
            ".github/workflows/dropbox-oauth-refresh-material-flow-live.yml",
            "mission-control/dropbox-main-governed-recovery-20h/MAIN_SYNC.json",
            "mission-control/dropbox-main-governed-recovery-20h/OWNER_AUTHORIZATION.json",
            ".github/workflows/dropbox-lrb-main-sync-cert.yml",
          ]
          rows=[]
          for rel in targets:
              p=root/rel
              if not p.is_file(): raise SystemExit("CERTIFIED_TARGET_MISSING:"+rel)
              rows.append({"path":rel,"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"size":p.stat().st_size})
          digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()

          def api(path):
              req=urllib.request.Request(
                  "https://api.github.com/repos/"+repo+path,
                  headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"louksna-dropbox-runtime-gate"})
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.load(r)
          def raw(url):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","User-Agent":"louksna-dropbox-runtime-gate"})
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read()
          def artifact_json(artifact,member):
              zbytes=raw(artifact["archive_download_url"])
              declared=str(artifact.get("digest") or "")
              if declared.startswith("sha256:") and hashlib.sha256(zbytes).hexdigest()!=declared.split(":",1)[1]:
                  raise SystemExit("ARTIFACT_ZIP_DIGEST_MISMATCH:"+artifact["name"])
              with zipfile.ZipFile(io.BytesIO(zbytes)) as z:
                  return json.loads(z.read(member)),hashlib.sha256(z.read(member)).hexdigest()

          q=urllib.parse.urlencode({"branch":cert_branch,"status":"success","per_page":30})
          runs=api("/actions/runs?"+q).get("workflow_runs",[])
          chosen=None
          for run in runs:
              if run.get("name")!=workflow_name or run.get("conclusion")!="success":
                  continue
              arts=api("/actions/runs/"+str(run["id"])+"/artifacts?per_page=100").get("artifacts",[])
              by={a.get("name"):a for a in arts if not a.get("expired")}
              if "dropbox-lrb-main-sync-g24" not in by: continue
              try:
                  g24,_=artifact_json(by["dropbox-lrb-main-sync-g24"],"G24.json")
              except Exception:
                  continue
              if g24.get("status")=="PASS" and g24.get("candidate_digest_sha256")==digest:
                  chosen=(run,by,g24)
                  break
          if chosen is None:
              raise SystemExit("NO_EXACT_G24_CERTIFICATION_FOR_LOCAL_DIGEST")
          run,by,g24=chosen
          required=("dropbox-lrb-main-sync-g23","dropbox-lrb-main-sync-g24","dropbox-lrb-main-sync-operational-authorization")
          if any(x not in by for x in required): raise SystemExit("CERT_CHAIN_ARTIFACT_MISSING")
          g23,g23_sha=artifact_json(by["dropbox-lrb-main-sync-g23"],"G23.json")
          g24,g24_sha=artifact_json(by["dropbox-lrb-main-sync-g24"],"G24.json")
          auth,_=artifact_json(by["dropbox-lrb-main-sync-operational-authorization"],"OPERATIONAL_AUTHORIZATION.json")
          failures=[]
          if g23.get("status")!="PASS" or g23.get("g24_authorized") is not True: failures.append("G23_INVALID")
          if g24.get("status")!="PASS" or g24.get("active_authorized") is not False: failures.append("G24_INVALID")
          if auth.get("status")!="PASS" or auth.get("active_authorized") is not True: failures.append("AUTHORIZATION_INVALID")
          if len({g23.get("scope"),g24.get("scope"),auth.get("scope"),scope})!=1: failures.append("SCOPE_CHAIN_MISMATCH")
          if g23.get("candidate_digest_sha256")!=digest or g24.get("candidate_digest_sha256")!=digest or auth.get("candidate_digest_sha256")!=digest:
              failures.append("CERTIFIED_DIGEST_MISMATCH")
          if auth.get("g23_record_sha256")!=g23_sha: failures.append("G23_RECORD_HASH_MISMATCH")
          if auth.get("g24_certificate_sha256")!=g24_sha: failures.append("G24_RECORD_HASH_MISMATCH")
          if auth.get("certification_propagation") is not False or auth.get("canonical_mutation") is not False: failures.append("AUTHORIZATION_INVARIANT_INVALID")
          if auth.get("desktop_commander_used") is not False or auth.get("main_mutation") is not False: failures.append("BOUNDARY_INVALID")
          result={
            "schema":"LOUKSNA_DROPBOX_RUNTIME_AUTHORIZATION_GATE/1.1",
            "status":"PASS" if not failures else "FAIL",
            "scope":scope,
            "candidate_digest_sha256":digest,
            "certification_run_id":run["id"],
            "certified_source_head_sha":g24.get("candidate_head_sha"),
            "g23_record_sha256":g23_sha,
            "g24_certificate_sha256":g24_sha,
            "desktop_commander_used":False,
            "failures":failures,
          }
          out_path.write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          raise SystemExit(0 if not failures else 6)
          PY

      - name: Verify OAuth or rclone binding presence without revealing credentials
        shell: bash
        working-directory: ${{ github.workspace }}/_dropbox_oauth_${{ github.run_id }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          E="$RUNNER_TEMP/dropbox-oauth-binding-${GITHUB_RUN_ID}"
          mkdir -p "$E"
          APP_KEY_PRESENT=false
          APP_SECRET_PRESENT=false
          REFRESH_TOKEN_PRESENT=false
          [ -n "${DROPBOX_APP_KEY:-}" ] && APP_KEY_PRESENT=true
          [ -n "${DROPBOX_APP_SECRET:-}" ] && APP_SECRET_PRESENT=true
          [ -n "${DROPBOX_REFRESH_TOKEN:-}" ] && REFRESH_TOKEN_PRESENT=true
          RCLONE_BINDING_PRESENT="$(python3 - <<'PY'
          import configparser,json,pathlib,shutil
          p=pathlib.Path.home()/".config/rclone/rclone.conf"
          ok=False
          if p.is_file() and shutil.which("rclone"):
              cp=configparser.RawConfigParser()
              try:
                  cp.read(p,encoding="utf-8")
                  for sec in cp.sections():
                      if cp.get(sec,"type",fallback="").strip().lower()!="dropbox": continue
                      raw=cp.get(sec,"token",fallback="").strip()
                      if not raw: continue
                      tok=json.loads(raw)
                      if str(tok.get("access_token") or "").strip():
                          ok=True; break
              except Exception:
                  ok=False
          print("true" if ok else "false")
          PY
          )"
          DIRECT=false
          [ "$APP_KEY_PRESENT" = true ] && [ "$APP_SECRET_PRESENT" = true ] && [ "$REFRESH_TOKEN_PRESENT" = true ] && DIRECT=true
          STATUS=FAIL
          AUTH_MODE=NONE
          if [ "$DIRECT" = true ]; then STATUS=PASS; AUTH_MODE=DROPBOX_API_OAUTH_REFRESH; fi
          if [ "$RCLONE_BINDING_PRESENT" = true ]; then STATUS=PASS; AUTH_MODE=DROPBOX_API_VIA_RCLONE_OAUTH; fi
          cat > "$E/BINDING_PREFLIGHT.json" <<JSON
          {
            "schema": "LOUKSNA_DROPBOX_OAUTH_BINDING_PREFLIGHT/1.1",
            "provider": "$AUTH_MODE",
            "app_key_present": $APP_KEY_PRESENT,
            "app_secret_present": $APP_SECRET_PRESENT,
            "refresh_token_present": $REFRESH_TOKEN_PRESENT,
            "rclone_oauth_binding_present": $RCLONE_BINDING_PRESENT,
            "secret_values_logged": false,
            "status": "$STATUS"
          }
          JSON
          cat "$E/BINDING_PREFLIGHT.json"
          test "$STATUS" = PASS
          python3 -m py_compile scripts/dropbox_governed_recovery_20h.py scripts/dropbox/lrb_main_sync.py

      - name: Start OAuth acquisition and prove material byte flow
        shell: bash
        working-directory: ${{ github.workspace }}/_dropbox_oauth_${{ github.run_id }}
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          STATE_ROOT: ${{ runner.temp }}/dropbox-oauth-live-${{ github.run_id }}
          CORPUS_ROOT: /home/diegoignacionorambuenamiranda/PROYECTOS/1. PROYECTOS PRIORITARIOS
        run: |
          set -Eeuo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          PROOF="$RUNNER_TEMP/dropbox-oauth-proof-${GITHUB_RUN_ID}"
          rm -rf "$STATE_ROOT" "$PROOF"
          mkdir -p "$STATE_ROOT" "$PROOF" "$CORPUS_ROOT"

          python3 -B scripts/dropbox_governed_recovery_20h.py             > >(tee "$STATE_ROOT/acquisition.stdout")             2> >(tee "$STATE_ROOT/acquisition.stderr" >&2) &
          pid=$!
          printf '%s\n' "$pid" > "$STATE_ROOT/acquisition.pid"

          deadline=$((SECONDS+900))
          proven=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            marker="$STATE_ROOT/evidence/DOWNLOAD_STARTED.json"
            if [ -f "$marker" ]; then
              readarray -t vals < <(python3 - "$marker" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding="utf-8"))
          print(str(bool(m.get("provider_authenticated"))).lower())
          print(str(int(m.get("observed_bytes") or 0)))
          print(str(m.get("destination") or ""))
          print(str(m.get("provider") or ""))
          print(str(m.get("dropbox_request_id") or ""))
          print(str(m.get("background_pid") or ""))
          PY
              )
              authenticated="${vals[0]}"
              observed="${vals[1]}"
              destination="${vals[2]}"
              provider="${vals[3]}"
              request_id="${vals[4]}"
              marker_pid="${vals[5]}"
              disk_bytes=0
              [ -n "$destination" ] && [ -f "$destination" ] && disk_bytes="$(stat -c '%s' "$destination")"
              if [ "$authenticated" = "true" ] && [ "$observed" -gt 0 ] && [ "$disk_bytes" -gt 0 ] && kill -0 "$pid" 2>/dev/null; then
                cp "$marker" "$PROOF/DOWNLOAD_STARTED.json"
                {
                  echo "MATERIAL_DOWNLOAD_STARTED=TRUE"
                  echo "PROVIDER_AUTHENTICATED=TRUE"
                  echo "PROVIDER=$provider"
                  echo "OBSERVED_BYTES=$observed"
                  echo "DISK_BYTES=$disk_bytes"
                  echo "SOURCE_OBJECT_IDENTIFIED=TRUE"
                  echo "BACKGROUND_PROCESS_ALIVE=TRUE"
                  echo "BACKGROUND_PID=$pid"
                  echo "MARKER_PID=$marker_pid"
                  echo "DROPBOX_REQUEST_ID=$request_id"
                  echo "DESTINATION=$destination"
                  echo "UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                } | tee "$PROOF/MATERIAL_BYTE_FLOW.txt"
                proven=true
                break
              fi
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "Acquisition exited before certified material byte flow."
              wait "$pid" || rc=$?
              rc="${rc:-0}"
              echo "ACQUISITION_EXIT=$rc"
              exit "$rc"
            fi
            sleep 1
          done

          if [ "$proven" != true ]; then
            echo "No authenticated material byte flow observed inside 900 seconds."
            kill "$pid" 2>/dev/null || true
            wait "$pid" || true
            exit 124
          fi

          echo "LOUKSNA_STOP_CONDITION_REACHED=TRUE"
          echo "Assistant must stop intervening; acquisition remains governed by this process."
          wait "$pid"
          rc=$?
          printf '%s\n' "$rc" > "$STATE_ROOT/acquisition.exit"
          exit "$rc"

      - name: Preserve OAuth material proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-oauth-material-flow-proof
          path: |
            ${{ runner.temp }}/dropbox-oauth-proof-${{ github.run_id }}
            ${{ runner.temp }}/dropbox-oauth-binding-${{ github.run_id }}
            ${{ runner.temp }}/dropbox-oauth-live-${{ github.run_id }}/evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
