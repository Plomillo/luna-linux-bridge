name: "R4 PART4 — reconcile completed Stage7 state"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-stage7-state-reconcile/**

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Reconcile logical state from verified physical truth
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time

          home=pathlib.Path.home()
          state=home/".local/state/louksna/r4-master-part1-part9"
          d=state/"PART_4_P3_HARDENED"
          execution=d/"EXECUTION.json"
          stage6=d/"STAGE6_G24.json"
          assert execution.is_file() and stage6.is_file()

          e=json.loads(execution.read_text())
          assert int(e.get("current_stage",0))==7
          assert int(e.get("last_completed_stage",0))>=6

          p3_start=int(pathlib.Path("/sys/class/block/nvme0n1p3/start").read_text())
          p3_size=int(pathlib.Path("/sys/class/block/nvme0n1p3/size").read_text())
          p3_end=p3_start+p3_size-1
          p1_start=int(pathlib.Path("/sys/class/block/nvme0n1p1/start").read_text())
          p1_size=int(pathlib.Path("/sys/class/block/nvme0n1p1/size").read_text())
          p1_end=p1_start+p1_size-1

          def out(cmd):
              return subprocess.run(cmd,text=True,capture_output=True,check=True).stdout.strip()

          uuid=out(["lsblk","-n","-o","UUID","/dev/nvme0n1p3"])
          partuuid=out(["lsblk","-n","-o","PARTUUID","/dev/nvme0n1p3"])
          stage6_sha=hashlib.sha256(stage6.read_bytes()).hexdigest()

          sudo_log=subprocess.run(
              ["sudo","-n","journalctl","_COMM=sudo","--since","2026-10-01 20:08:30 UTC","--no-pager","-o","cat"],
              text=True,capture_output=True,check=False
          ).stdout
          actual=[
              x for x in sudo_log.splitlines()
              if "COMMAND=/usr/bin/growpart /dev/nvme0n1 3" in x and " -N " not in x
          ]
          fs_resize=[x for x in sudo_log.splitlines() if "COMMAND=" in x and "resize2fs" in x]

          checks={
              "stage7_boundary":int(e.get("current_stage",0))==7 and int(e.get("last_completed_stage",0))>=6,
              "p3_start":p3_start==567296,
              "p3_end":p3_end==1000215182,
              "p3_size":p3_size==999647887,
              "p1_unchanged":(p1_start,p1_end,p1_size)==(2048,534527,532480),
              "p5_absent":not pathlib.Path("/dev/nvme0n1p5").exists(),
              "uuid_preserved":uuid=="e084ec2a-af39-48b5-bb89-db2dc6a98332",
              "partuuid_preserved":partuuid=="8e0b4274-21ff-4b16-8180-495381efb1d9",
              "stage6_bound":stage6_sha=="352763cc4e88b5575e7aee8aa9dcb5fa5dfc6fe54b34a072e4261f205f282bcd",
              "single_actual_attempt":len(actual)==1,
              "no_filesystem_resize":len(fs_resize)==0,
          }
          if not all(checks.values()):
              print(json.dumps({"status":"HOLD","checks":checks},indent=2))
              raise SystemExit(23)

          result={
              "status":"PASS",
              "scope":"P3_TRAILING_END_EXTENSION_ONLY",
              "attempt_count":1,
              "post_start_sector":p3_start,
              "post_end_sector":p3_end,
              "authorized_new_end_sector":1000215182,
              "p1_unchanged":True,
              "p5_absent":True,
              "uuid_preserved":True,
              "partuuid_preserved":True,
              "blind_retry_performed":False,
              "stage6_g24_sha256":stage6_sha,
              "physical_change_observed":True,
              "filesystem_resize_performed":False,
              "reconciled_from_live_physical_truth":True,
              "checks":checks,
              "recorded_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          (d/"STAGE7_RESULT.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))

          uid=os.getuid()
          env=os.environ.copy()
          env["XDG_RUNTIME_DIR"]=f"/run/user/{uid}"
          env["DBUS_SESSION_BUS_ADDRESS"]=f"unix:path=/run/user/{uid}/bus"
          subprocess.run(["systemctl","--user","restart","luna-r4-master-part1-part9.service"],env=env,check=True)

          final=None
          for _ in range(30):
              final=json.loads(execution.read_text())
              if int(final.get("last_completed_stage",0))>=7:
                  break
              time.sleep(1)
          print(json.dumps({
              "status":final.get("status"),
              "current_stage":final.get("current_stage"),
              "last_completed_stage":final.get("last_completed_stage"),
              "next_authorized_action":final.get("next_authorized_action"),
              "disk_mutation_performed":final.get("disk_mutation_performed"),
              "filesystem_mutation_performed":final.get("filesystem_mutation_performed"),
          },indent=2))
          if int(final.get("last_completed_stage",0))<7:
              raise SystemExit(31)
          PY
