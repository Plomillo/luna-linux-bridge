name: "Dropbox evidence to TXT — 1m"

on:
  push:
    branches:
      - staging/dropbox-main-governed-recovery-20h-20261004
    paths:
      - .github/workflows/dropbox-evidence-to-txt-1m.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dropbox-evidence-to-txt-1m
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: "37195158835"
  SOURCE_ARTIFACT_ID: "11300481722"
  SOURCE_ARTIFACT_NAME: "dropbox-main-governed-recovery-acquisition-evidence"
  SOURCE_ARTIFACT_DIGEST: "sha256:a64e2150e606b35416aa4db69ecb3445f16f6df69e45c21a3606ca31642817c0"
  SOURCE_BRANCH: "staging/dropbox-main-governed-recovery-20h-20261004"
  SOURCE_COMMIT: "11ad23d2344b4a245682cc6b6e014b793a8d3adf"
  TXT_OUT: "dropbox-acquisition-evidence-37195158835.txt"

jobs:
  evidence_to_txt:
    name: "Convert acquisition evidence artifact to TXT"
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Download GitHub evidence artifact only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p in out work
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip" \
            -o in/evidence.zip
          test -s in/evidence.zip

      - name: Convert artifact payload to single UTF-8 TXT
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, datetime as dt, hashlib, json, os, pathlib, zipfile
          root = pathlib.Path.cwd()
          zip_path = root / "in" / "evidence.zip"
          out_dir = root / "out"
          extract = root / "work" / "artifact"
          extract.mkdir(parents=True, exist_ok=True)
          out_dir.mkdir(parents=True, exist_ok=True)
          digest = "sha256:" + hashlib.sha256(zip_path.read_bytes()).hexdigest()
          with zipfile.ZipFile(zip_path) as z:
              bad = z.testzip()
              if bad:
                  raise SystemExit(f"ZIP_CRC_FAIL:{bad}")
              z.extractall(extract)
          files = sorted([p for p in extract.rglob("*") if p.is_file()], key=lambda p: p.as_posix())
          lines = []
          now = dt.datetime.now(dt.timezone.utc).isoformat().replace("+00:00", "Z")
          lines.append("LOUKSNA DROPBOX ACQUISITION EVIDENCE TXT")
          lines.append("schema=LOUKSNA_DROPBOX_EVIDENCE_TXT/1.0")
          lines.append(f"utc={now}")
          lines.append("authority=Louksna.md")
          lines.append("scope=GITHUB_ACTIONS_EVIDENCE_ARTIFACT_TO_TXT_ONLY")
          lines.append("dropbox_corpus_download_certified=false")
          lines.append("custosz_authorized=false")
          lines.append(f"source_run_id={os.environ.get('SOURCE_RUN_ID')}")
          lines.append(f"source_artifact_id={os.environ.get('SOURCE_ARTIFACT_ID')}")
          lines.append(f"source_artifact_name={os.environ.get('SOURCE_ARTIFACT_NAME')}")
          lines.append(f"source_artifact_digest_declared={os.environ.get('SOURCE_ARTIFACT_DIGEST')}")
          lines.append(f"source_artifact_zip_sha256_observed={digest}")
          lines.append(f"source_branch={os.environ.get('SOURCE_BRANCH')}")
          lines.append(f"source_commit={os.environ.get('SOURCE_COMMIT')}")
          lines.append(f"file_count={len(files)}")
          lines.append("")
          lines.append("FILES")
          for p in files:
              rel = p.relative_to(extract).as_posix()
              lines.append(f"- {rel}\tsize={p.stat().st_size}\tsha256={hashlib.sha256(p.read_bytes()).hexdigest()}")
          for p in files:
              rel = p.relative_to(extract).as_posix()
              raw = p.read_bytes()
              lines.append("")
              lines.append("=" * 96)
              lines.append(f"FILE: {rel}")
              lines.append(f"SIZE: {len(raw)}")
              lines.append(f"SHA256: {hashlib.sha256(raw).hexdigest()}")
              lines.append("-" * 96)
              try:
                  text = raw.decode("utf-8")
                  if rel.lower().endswith(".json"):
                      try:
                          text = json.dumps(json.loads(text), ensure_ascii=False, indent=2, sort_keys=True)
                      except Exception:
                          pass
                  lines.append(text.rstrip())
              except UnicodeDecodeError:
                  lines.append("BINARY_CONTENT_BASE64_BEGIN")
                  lines.append(base64.b64encode(raw).decode("ascii"))
                  lines.append("BINARY_CONTENT_BASE64_END")
          txt = "\n".join(lines).rstrip() + "\n"
          txt_path = out_dir / os.environ.get("TXT_OUT", "dropbox-acquisition-evidence.txt")
          txt_path.write_text(txt, encoding="utf-8", newline="\n")
          cert = {
              "schema": "LOUKSNA_DROPBOX_EVIDENCE_TXT_CERTIFICATION/1.0",
              "status": "PASS",
              "authority": "Louksna.md",
              "scope": "GitHub artifact evidence converted to TXT; no Dropbox corpus certification",
              "source_run_id": os.environ.get("SOURCE_RUN_ID"),
              "source_artifact_id": os.environ.get("SOURCE_ARTIFACT_ID"),
              "source_artifact_digest_declared": os.environ.get("SOURCE_ARTIFACT_DIGEST"),
              "source_artifact_zip_sha256_observed": digest,
              "txt_file": txt_path.name,
              "txt_sha256": hashlib.sha256(txt_path.read_bytes()).hexdigest(),
              "txt_bytes": txt_path.stat().st_size,
              "ceiling_seconds_gross": 60,
              "dropbox_corpus_download_certified": False,
              "g23_g24_changed": False,
              "custosz_authorized": False,
              "utc": now,
          }
          (out_dir / "CERTIFICATION.txt").write_text(json.dumps(cert, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8", newline="\n")
          print(json.dumps(cert, sort_keys=True))
          PY

      - name: Upload TXT evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-main-governed-recovery-acquisition-evidence-txt
          path: out
          if-no-files-found: error
          retention-days: 90
