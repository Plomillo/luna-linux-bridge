name: "CUSTOSZV9 candidate build and validation"

on:
  push:
    branches: ["feature/custoszv9-crfu-*"]
    paths:
      - "custoszv9/**"
      - "formal/crfu/**"
      - "tests/test_custoszv9.py"
      - "build_custoszv9.py"
      - ".github/workflows/custoszv9-build.yml"
      - ".github/workflows/custoszv9-independent-g22-g23-g24.yml"
      - "scripts/custoszv9_gate_trust_root.py"
      - "scripts/verify_custosz9_model_runtime_binding.py"
      - "docs/custoszv9-crfu-architecture.md"
  pull_request:
    branches: [main]
    paths:
      - "custoszv9/**"
      - "formal/crfu/**"
      - "tests/test_custoszv9.py"
      - "build_custoszv9.py"
      - ".github/workflows/custoszv9-build.yml"
      - ".github/workflows/custoszv9-independent-g22-g23-g24.yml"
      - "scripts/custoszv9_gate_trust_root.py"
      - "docs/custoszv9-crfu-architecture.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: custoszv9-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: "CRFU tests, exact V8 embedding and reproducible ZIPAPP"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Compile CRFU sources, tests and builder
        run: python3 -m compileall -q custoszv9 tests/test_custoszv9.py build_custoszv9.py scripts/custoszv9_gate_trust_root.py
      - name: Install pinned Ed25519 test dependency (CI only, not bundled in ZIPAPP)
        run: "python3 -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2"
      - name: Run CRFU regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 -m unittest discover -s tests -p 'test_custoszv9.py' -v 2>&1 | tee evidence/custoszv9-unit-tests.log
      - name: Build CUSTOSZV9.pyz from exact tracked V8 baseline
        env:
          CUSTOSZV9_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 build_custoszv9.py
      - name: Verify deterministic rebuild from identical source commit
        env:
          CUSTOSZV9_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          first="$(sha256sum dist/CUSTOSZV9.pyz | awk '{print $1}')"
          python3 build_custoszv9.py > "$RUNNER_TEMP/rebuild-report.json"
          second="$(sha256sum dist/CUSTOSZV9.pyz | awk '{print $1}')"
          test "$first" = "$second"
          python3 - "$first" "$second" "${{ github.event.pull_request.head.sha || github.sha }}" <<'PY'
          import json,sys
          from pathlib import Path
          first,second,commit=sys.argv[1:]
          result={"schema":"CUSTOSZV9_REPRODUCIBILITY/1.0","status":"PASS" if first==second else "FAIL",
                  "first_sha256":first,"second_sha256":second,"source_commit":commit,
                  "same_source_commit_two_builds":first==second}
          Path("evidence/custoszv9-reproducibility.json").write_text(json.dumps(result,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(result,sort_keys=True,indent=2))
          PY
      - name: Exercise CRFU CLI and self-tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dist/CUSTOSZV9.pyz --version
          python3 dist/CUSTOSZV9.pyz crfu status | tee "$RUNNER_TEMP/crfu-status.json"
          python3 - "$RUNNER_TEMP/crfu-status.json" <<'PY'
          import json,sys
          status=json.load(open(sys.argv[1],encoding="utf-8"))
          assert status["formal_assurance"] == "SEPARATE_REPOSITORY_SOURCE_NOT_EMBEDDED", status
          assert status["formal_sources_embedded"] is False, status
          assert status["formal_toolchain"] == "NOT_RUN_BY_PACKAGE_BUILDER", status
          assert status["certification"] == "NOT_GRANTED", status
          assert status["canonical_promotion"] == "NOT_AUTHORIZED", status
          print("CRFU status formal-payload separation: PASS")
          PY
          python3 dist/CUSTOSZV9.pyz crfu selftest
          python3 dist/CUSTOSZV9.pyz crfu journal-verify "$RUNNER_TEMP/nonexistent-journal.jsonl"
      - name: Exercise preserved V8 CLI inside the same interpreter
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 dist/CUSTOSZV9.pyz selftest
          python3 dist/CUSTOSZV9.pyz status
      - name: Enforce package integrity and no false certification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,zipfile
          from pathlib import Path
          package=Path("dist/CUSTOSZV9.pyz")
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read("custoszv9/data/build_manifest.json"))
              baseline=z.read("custoszv9/data/CUSTOSZV8.pyz")
              assert hashlib.sha256(baseline).hexdigest()==manifest["baseline"]["sha256"]
              assert len(baseline)==manifest["baseline"]["size_bytes"]==99400
              assert manifest["governance"]["G23"]=="NOT_GRANTED"
              assert manifest["governance"]["G24"]=="NOT_GRANTED"
              assert manifest["governance"]["canonical_promotion"]=="NOT_AUTHORIZED"
              formal=manifest["formal_assurance"]
              assert formal["toolchain_executed"] is False
              assert formal["sources_embedded"] is False
              assert formal["source_storage"]=="REPOSITORY_ONLY_SEPARATE_EVIDENCE_BUNDLE"
              names=z.namelist()
              assert not any(n.endswith(".agda") or "/formal_sources/" in "/"+n or n.startswith("formal/") for n in names)
          report=json.loads(Path("evidence/custoszv9-build-report.json").read_text(encoding="utf-8"))
          assert report["embedded_baseline_byte_exact"] is True and report["release_eligible"] is False
          assert report["formal_sources_embedded"] is False
          assert report["formal_source_hashes_recorded"] is True
          print(json.dumps({"status":"PASS_BUILD_ONLY_NOT_CERTIFIED","package_sha256":report["package_sha256"],"size_bytes":report["package_size_bytes"],"v8_baseline_sha256":report["baseline_sha256"]},indent=2))
          PY
      - name: Upload V9 candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CUSTOSZV9-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/CUSTOSZV9.pyz
            evidence/custoszv9-build-report.json
            evidence/custoszv9-unit-tests.log
            evidence/custoszv9-reproducibility.json
          if-no-files-found: error
          retention-days: 90

  bounded-cross-language-correspondence:
    name: "Exact Agda-Python resource binding and bounded differential validation"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR source with runtime bytes unchanged
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Checkout exact formal source revision as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e8fb3f83f97e3577cbac77aa369eaccc425317b1
          path: formal-src
          persist-credentials: false

      - name: Checkout exact runtime candidate bytes as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 62d2d649b47f7653f3c9e9d1eeb42e563371053a
          path: runtime-src
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install pinned CI-only test dependency
        run: python3 -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2

      - name: Bind exact commits and resource guard expressions
        run: python3 -I scripts/verify_custosz9_model_runtime_binding.py

      - name: Run exact runtime test suite, including bounded differential test
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          PYTHONPATH="$GITHUB_WORKSPACE/runtime-src" \
            python3 -m unittest discover -s runtime-src/tests -p 'test_custoszv9.py' -v \
            2>&1 | tee evidence/runtime-tests.log
          grep -E '^Ran [0-9]+ tests? in ' evidence/runtime-tests.log
          grep -Fx 'OK' evidence/runtime-tests.log

      - name: Install hash-verified Agda 2.8.0.2
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/Agda-v2.8.0.2-linux.tar.xz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/agda/agda/releases/download/v2.8.0.2/Agda-v2.8.0.2-linux.tar.xz" \
            --output "$archive"
          echo "2bcf24bb561b1be859bba841e5d67962d1616b3251bc147f878e4f60a2fbd9f7  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/agda-bin" "$RUNNER_TEMP/agda-extract"
          tar -xf "$archive" -C "$RUNNER_TEMP/agda-extract"
          test -x "$RUNNER_TEMP/agda-extract/agda"
          install -m 0755 "$RUNNER_TEMP/agda-extract/agda" "$RUNNER_TEMP/agda-bin/agda"
          echo "$RUNNER_TEMP/agda-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/agda-bin/agda" --version | tee evidence/agda-version.txt
          grep -F "Agda version 2.8.0.2" evidence/agda-version.txt

      - name: Type-check every pinned first-order Agda module
        shell: bash
        run: |
          set -Eeuo pipefail
          : > evidence/agda-first-order.log
          for source in formal-src/formal/crfu/*.agda; do
            echo "===== $source =====" | tee -a evidence/agda-first-order.log
            agda --safe --without-K -i formal-src/formal/crfu "$source" 2>&1 | tee -a evidence/agda-first-order.log
          done

      - name: Download and verify Cubical Agda v0.9
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/cubical-0.9.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/agda/cubical/releases/download/v0.9/cubical-0.9.tar.gz" \
            --output "$archive"
          echo "003f9c57c134e4a9401a4b339b3773be667aa169ff929ca3dfb9c8abefc225c5  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/cubical"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cubical"
          test -f "$RUNNER_TEMP/cubical/Cubical/Foundations/Univalence.agda"

      - name: Type-check the pinned Cubical Agda interface
        shell: bash
        run: |
          set -Eeuo pipefail
          agda --cubical --safe --guardedness \
            -i "$RUNNER_TEMP/cubical" \
            -i formal-src/formal/cubical \
            formal-src/formal/cubical/CRFUUnivalenceBridge.agda \
            2>&1 | tee evidence/agda-cubical.log

      - name: Finalize bounded evidence report without certification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          path = Path("evidence/custoszv9-bounded-model-runtime-binding.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          log = Path("evidence/runtime-tests.log").read_text(encoding="utf-8")
          match = re.search(r"^Ran (\d+) tests? in ", log, re.M)
          if not match or not re.search(r"^OK$", log, re.M):
              raise SystemExit("RUNTIME_TEST_LOG_NOT_PASS")
          report["status"] = "PASS_BOUNDED_RESOURCE_PREDICATE_CORRESPONDENCE_ONLY"
          report["validation"] = {
              "python_unit_tests": "PASS",
              "python_unit_test_count": int(match.group(1)),
              "bounded_resource_input_combinations": 4 ** 7,
              "bounded_regression_result": "PASS",
              "first_order_agda_typecheck": "PASS",
              "cubical_agda_interface_typecheck": "PASS",
              "agda_release": "2.8.0.2",
              "cubical_agda_release": "v0.9",
              "global_g01_g24_certification": "NOT_ISSUED"
          }
          report["evidence_hashes"] = {
              name: hashlib.sha256(Path("evidence", name).read_bytes()).hexdigest()
              for name in ("runtime-tests.log", "agda-version.txt",
                           "agda-first-order.log", "agda-cubical.log")
          }
          report["report_payload_sha256"] = hashlib.sha256(
              json.dumps(report, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY

      - name: Upload exact-source bounded evidence (not a certificate)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CUSTOSZV9-bounded-cross-language-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/custoszv9-bounded-model-runtime-binding.json
            evidence/runtime-tests.log
            evidence/agda-version.txt
            evidence/agda-first-order.log
            evidence/agda-cubical.log
          if-no-files-found: warn
          retention-days: 90

  publish-un-certified-binary:
    name: "Archive candidate on isolated artifact branch (not a release)"
    needs: build-test
    if: ${{ needs.build-test.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/feature/custoszv9-crfu-20261016' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download package and evidence from this successful run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/candidate
      - name: Verify candidate artifact is explicitly un-certified
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/candidate" "$GITHUB_SHA" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1]);commit=sys.argv[2]
          package=root/"dist"/"CUSTOSZV9.pyz"
          report=json.loads((root/"evidence"/"custoszv9-build-report.json").read_text(encoding="utf-8"))
          assert report["source_commit"]==commit
          assert report["status"]=="PASS_BUILD_ONLY_NOT_CERTIFIED"
          assert report["release_eligible"] is False
          assert report["G22"]=="NOT_GRANTED" and report["G23"]=="NOT_GRANTED" and report["G24"]=="NOT_GRANTED"
          digest=hashlib.sha256(package.read_bytes()).hexdigest()
          assert report["package_sha256"]==digest
          with zipfile.ZipFile(package) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read("custoszv9/data/build_manifest.json"))
              baseline=z.read("custoszv9/data/CUSTOSZV8.pyz")
              assert manifest["source_commit"]==commit
              assert hashlib.sha256(baseline).hexdigest()==manifest["baseline"]["sha256"]
              assert len(baseline)==99400
              assert manifest["governance"]["canonical_promotion"]=="NOT_AUTHORIZED"
          print(json.dumps({"status":"PASS_BUILD_ONLY_NOT_CERTIFIED","source_commit":commit,"package_sha256":digest,"package_size_bytes":package.stat().st_size},indent=2))
          PY
      - name: Checkout source only for Git object publication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Publish binary and evidence to an isolated, content-addressed candidate branch
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_branch="artifacts/custoszv9-${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$artifact_branch"
          git rm -rf . >/dev/null
          mkdir -p dist evidence
          cp "$RUNNER_TEMP/candidate/dist/CUSTOSZV9.pyz" dist/CUSTOSZV9.pyz
          sha256sum dist/CUSTOSZV9.pyz > dist/CUSTOSZV9.pyz.sha256
          cp "$RUNNER_TEMP/candidate/evidence/custoszv9-build-report.json" evidence/
          cp "$RUNNER_TEMP/candidate/evidence/custoszv9-unit-tests.log" evidence/
          cp "$RUNNER_TEMP/candidate/evidence/custoszv9-reproducibility.json" evidence/
          git add dist/CUSTOSZV9.pyz dist/CUSTOSZV9.pyz.sha256 evidence/
          git commit -m "Archive uncertified CUSTOSZV9 candidate for source ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/$artifact_branch"
          echo "::notice title=CUSTOSZV9 candidate artifact::Raw package stored at https://github.com/Plomillo/luna-linux-bridge/raw/$artifact_branch/dist/CUSTOSZV9.pyz"
