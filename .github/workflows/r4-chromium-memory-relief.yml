name: "R4 auxiliary — close Chromium for RAM relief"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-chromium-memory-relief/**

permissions:
  contents: read

concurrency:
  group: r4-chromium-memory-relief
  cancel-in-progress: false

jobs:
  close:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Observe, close Chromium, verify
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/chromium-relief-$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo > "$OUT/MEM_BEFORE.txt"
          ps -eo pid,ppid,comm,rss,args --sort=-rss | grep -E '(^|[ /])(chromium|chromium-browser)([ /]|$)' | grep -v grep > "$OUT/CHROMIUM_BEFORE.txt" || true

          mapfile -t LINKS < <(find "$HOME/.local/lib/louksna-remote-bridge" -type f -path '*/bridge/live_link.py' -print 2>/dev/null | sort)
          test "${#LINKS[@]}" -ge 1
          LINK="${LINKS[-1]}"
          python3 -B "$LINK" --state-dir "$HOME/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op status > "$OUT/LRB_STATUS_BEFORE.json"
          python3 -B "$LINK" --state-dir "$HOME/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op observe > "$OUT/LRB_OBSERVE_BEFORE.json"

          mapfile -t PIDS < <(pgrep -x chromium || true)
          if [ "${#PIDS[@]}" -eq 0 ]; then
            mapfile -t PIDS < <(pgrep -x chromium-browser || true)
          fi

          if [ "${#PIDS[@]}" -gt 0 ]; then
            printf '%s\n' "${PIDS[@]}" > "$OUT/TARGET_PIDS.txt"
            kill -TERM "${PIDS[@]}"
            for _ in $(seq 1 20); do
              sleep 0.5
              REMAIN=()
              for P in "${PIDS[@]}"; do
                kill -0 "$P" 2>/dev/null && REMAIN+=("$P")
              done
              [ "${#REMAIN[@]}" -eq 0 ] && break
            done
          else
            : > "$OUT/TARGET_PIDS.txt"
          fi

          ps -eo pid,ppid,comm,rss,args --sort=-rss | grep -E '(^|[ /])(chromium|chromium-browser)([ /]|$)' | grep -v grep > "$OUT/CHROMIUM_AFTER.txt" || true
          awk '/MemTotal|MemAvailable|SwapTotal|SwapFree/ {print}' /proc/meminfo > "$OUT/MEM_AFTER.txt"
          python3 -B "$LINK" --state-dir "$HOME/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op observe > "$OUT/LRB_OBSERVE_AFTER.json"

          python3 - "$OUT" <<'PY'
          import json,pathlib,sys,datetime as dt,re
          out=pathlib.Path(sys.argv[1])
          def mem(p):
              d={}
              for line in p.read_text().splitlines():
                  k,v=line.split(':',1)
                  d[k]=int(v.strip().split()[0])*1024
              return d
          b=mem(out/"MEM_BEFORE.txt"); a=mem(out/"MEM_AFTER.txt")
          before=(out/"CHROMIUM_BEFORE.txt").read_text(errors="replace").splitlines()
          after=(out/"CHROMIUM_AFTER.txt").read_text(errors="replace").splitlines()
          q={
              "schema":"LOUKSNA_CHROMIUM_MEMORY_RELIEF/1.0",
              "status":"PASS" if not after else "HOLD",
              "host":"LOUKSNA",
              "chromium_process_lines_before":len(before),
              "chromium_process_lines_after":len(after),
              "mem_available_before":b.get("MemAvailable"),
              "mem_available_after":a.get("MemAvailable"),
              "mem_available_delta":a.get("MemAvailable",0)-b.get("MemAvailable",0),
              "debian_download_performed":False,
              "kde_download_performed":False,
              "part6_mutation_performed":False,
              "observed_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          (out/"RESULT.json").write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if q["status"]!="PASS":
              raise SystemExit(23)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-chromium-memory-relief
          path: ${{ runner.temp }}/chromium-relief-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
