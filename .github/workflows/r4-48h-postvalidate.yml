name: "R4 48H — 15P live post-validation"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-48h-postvalidate/**

permissions:
  contents: read

concurrency:
  group: r4-15p-postvalidate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: staging/luna-r4-master-part1-part9-20260929
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            server/r4-48h
            server/r4-master
          sparse-checkout-cone-mode: true

      - name: Verify certified live 15-point control fabric
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_REAL="/home/diegoignacionorambuenamiranda"
          ROOT="$HOME_REAL/.local/lib/louksna/r4-48h"
          STAGED="$ROOT/staged"
          STATE="$HOME_REAL/.local/state/louksna/r4-48h"
          R4="$HOME_REAL/.local/state/louksna/r4-master-part1-part9"
          LIVE="$HOME_REAL/.local/lib/louksna/r4-master-part1-part9"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          test "$(hostname)" = LOUKSNA
          test "$(id -un)" = diegoignacionorambuenamiranda
          test -f "$STATE/G24_DEPLOY_BINDING.json"
          test -f "$ROOT/R4_48H_CONTRACT.json"

          python3 - "$ROOT/R4_48H_CONTRACT.json" "$STATE/G24_DEPLOY_BINDING.json" <<'PY'
          import json,pathlib,sys,datetime as dt
          c=json.loads(pathlib.Path(sys.argv[1]).read_text())
          b=json.loads(pathlib.Path(sys.argv[2]).read_text())
          assert c["schema"]=="LOUKSNA_R4_REMAINDER_48H_CONTRACT/2.0"
          assert len(c["points"])==15
          assert b["schema"]=="LOUKSNA_R4_15P_PROGRAM_DEPLOY_BINDING/1.0"
          assert b["status"]=="PASS"
          assert b["maestro_primary_worker"] is True
          assert b["lrb_observation_only"] is True
          assert b["desktop_plugin_used"] is False
          assert b["part4_reopen_authorized"] is False
          assert b["partitioning_authorized"] is False
          deadline=dt.datetime.fromisoformat(c["window"]["deadline_utc"].replace("Z","+00:00"))
          assert dt.datetime.now(dt.timezone.utc)<deadline
          print("CONTRACT_AND_BINDING=PASS")
          PY

          echo "=== WAIT FOR COORDINATOR/HANDOFF ==="
          for i in $(seq 1 90); do
            C="$(systemctl --user is-active luna-r4-48h-coordinator.service 2>/dev/null || true)"
            M="$(systemctl --user is-active luna-r4-master-part1-part9.service 2>/dev/null || true)"
            if [ "$C" = active ] && [ "$M" = active ] && [ -f "$LIVE/master_controller.py" ]; then
              RH="$(sha256sum server/r4-master/master_controller.py | awk '{print $1}')"
              LH="$(sha256sum "$LIVE/master_controller.py" | awk '{print $1}')"
              if [ "$RH" = "$LH" ]; then break; fi
            fi
            sleep 2
          done

          test "$(systemctl --user is-active luna-r4-48h-coordinator.service)" = active
          test "$(systemctl --user is-active luna-r4-master-part1-part9.service)" = active
          test "$(sha256sum server/r4-48h/maestro_48h_coordinator.py | awk '{print $1}')" = "$(sha256sum "$ROOT/maestro_48h_coordinator.py" | awk '{print $1}')"
          test "$(sha256sum server/r4-master/master_controller.py | awk '{print $1}')" = "$(sha256sum "$LIVE/master_controller.py" | awk '{print $1}')"
          test "$(sha256sum server/r4-48h/R4_48H_CONTRACT.json | awk '{print $1}')" = "$(sha256sum "$LIVE/R4_48H_CONTRACT.json" | awk '{print $1}')"

          echo "=== SERVICES ==="
          systemctl --user show luna-r4-48h-coordinator.service -p ActiveState -p SubState -p MainPID -p NRestarts -p StartLimitBurst
          systemctl --user show luna-r4-master-part1-part9.service -p ActiveState -p SubState -p MainPID -p NRestarts

          echo "=== MASTER LEASE ==="
          test -f "$R4/MASTER_CUSTOSZ_MISSION.json"
          cat "$R4/MASTER_CUSTOSZ_MISSION.json"
          python3 - "$R4/MASTER_CUSTOSZ_MISSION.json" "$LIVE/master_controller.py" <<'PY'
          import json,pathlib,sys
          d=json.load(open(sys.argv[1]))
          src=pathlib.Path(sys.argv[2]).read_text(encoding="utf-8",errors="replace")
          lease=int(d.get("lease_hours",0) or 0)
          assert 1 <= lease <= 24
          renewal=("LOUKSNA_R4_GLOBAL_MISSION_LEASE/2.0" in src and "min(24,configured" in src)
          assert renewal
          if d.get("schema")=="LOUKSNA_R4_GLOBAL_MISSION_LEASE/2.0":
              assert d["global_window_hours"]==48
              assert d["checkpoint_preserved"] is True
              assert d["evidence_chain_preserved"] is True
              cls="V2"
          else:
              assert d.get("mission_id")
              cls="LEGACY_BOUNDED_ACTIVE"
          print("RENEWABLE_LEASE=PASS CLASS="+cls)
          PY

          echo "=== 15P STATUS ==="
          test -f "$STATE/STATUS.json"
          cat "$STATE/STATUS.json"
          test -f "$STATE/LEDGER.jsonl"
          test -f "$STATE/LEDGER_HEAD.json"
          tail -n 40 "$STATE/LEDGER.jsonl"

          echo "=== LRB READ-ONLY OBSERVATION ==="
          mapfile -t LINKS < <(find "$HOME_REAL/.local/lib/louksna-remote-bridge" -type f -path '*/bridge/live_link.py' -print 2>/dev/null | sort)
          test "${#LINKS[@]}" -ge 1
          LINK="${LINKS[-1]}"
          python3 -B "$LINK" --state-dir "$HOME_REAL/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op status
          python3 -B "$LINK" --state-dir "$HOME_REAL/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op observe

          if pgrep -af 'lrb_companion_worker.py' > /tmp/r4-lrb-companion.txt; then
            cat /tmp/r4-lrb-companion.txt
            exit 88
          fi

          echo "=== PARTITION MUTATOR DENIAL ==="
          if pgrep -af '(^|/)(sfdisk|fdisk|parted|growpart|resize2fs|ntfsresize|mkfs[^ ]*|wipefs|blkdiscard)( |$)' >/tmp/r4-partition-procs.txt; then
            cat /tmp/r4-partition-procs.txt
            exit 91
          fi
          echo NONE

          echo "R4_15P_LIVE_POSTVALIDATION=PASS"
