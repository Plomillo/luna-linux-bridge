name: "R4 48H — live post-validation"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-48h-postvalidate/**

permissions:
  contents: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 8
    steps:
      - name: Verify deployed certified state read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_REAL="/home/diegoignacionorambuenamiranda"
          ROOT="$HOME_REAL/.local/lib/louksna/r4-48h"
          STATE="$HOME_REAL/.local/state/louksna/r4-48h"
          R4="$HOME_REAL/.local/state/louksna/r4-master-part1-part9"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          echo "=== SERVICES ==="
          systemctl --user show luna-r4-48h-coordinator.service -p ActiveState -p SubState -p MainPID -p NRestarts -p Wants -p Requires
          systemctl --user show luna-r4-master-part1-part9.service -p ActiveState -p SubState -p MainPID -p NRestarts
          echo "=== UNIT ==="
          systemctl --user cat luna-r4-48h-coordinator.service

          echo "=== CERTIFIED BINDING ==="
          cat "$STATE/G24_DEPLOY_BINDING.json"
          echo "=== CONTRACT ==="
          cat "$ROOT/R4_48H_CONTRACT.json"
          echo "=== COORDINATOR LEDGER TAIL ==="
          tail -n 40 "$STATE/COORDINATOR.jsonl" || true
          echo "=== FAILURES ==="
          cat "$STATE/COORDINATOR_FAILURE.json" 2>/dev/null || echo NONE

          echo "=== CERTIFICATES ==="
          find "$R4/certificates" -maxdepth 1 -type f -printf '%f\n' | sort

          echo "=== PROCESSES ==="
          ps -eo pid,ppid,etimes,comm,rss,args | grep -E 'master_controller|part6_hardened_worker|make build_name=louksna-proton|maestro_48h_coordinator' | grep -v grep || true

          echo "=== PARTITION PROCESS DENIAL ==="
          if pgrep -af '(^|/)(sfdisk|fdisk|parted|growpart|resize2fs|ntfsresize|mkfs[^ ]*|wipefs|blkdiscard)( |$)' > /tmp/r4-partition-procs.txt; then
            cat /tmp/r4-partition-procs.txt
            exit 91
          else
            echo NONE
          fi

          mapfile -t LINKS < <(find "$HOME_REAL/.local/lib/louksna-remote-bridge" -type f -path '*/bridge/live_link.py' -print 2>/dev/null | sort)
          test "${#LINKS[@]}" -ge 1
          LINK="${LINKS[-1]}"
          echo "=== LRB STATUS ==="
          python3 -B "$LINK" --state-dir "$HOME_REAL/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op status
          echo "=== LRB OBSERVE ==="
          python3 -B "$LINK" --state-dir "$HOME_REAL/.local/state/louksna/remote-bridge/service" --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op observe

          python3 - "$ROOT/R4_48H_CONTRACT.json" "$STATE/G24_DEPLOY_BINDING.json" <<'PY'
          import datetime as dt,json,pathlib,sys
          c=json.loads(pathlib.Path(sys.argv[1]).read_text())
          b=json.loads(pathlib.Path(sys.argv[2]).read_text())
          now=dt.datetime.now(dt.timezone.utc)
          deadline=dt.datetime.fromisoformat(c["window"]["deadline_utc"].replace("Z","+00:00"))
          q={
            "schema":"LOUKSNA_R4_48H_POSTVALIDATION/1.0",
            "status":"PASS",
            "now_utc":now.isoformat(),
            "deadline_utc":deadline.isoformat(),
            "remaining_seconds":max(0,int((deadline-now).total_seconds())),
            "g24_binding_status":b.get("status"),
            "part4_reopen_authorized":b.get("part4_reopen_authorized"),
            "partitioning_authorized":b.get("partitioning_authorized"),
            "hard_ceiling":c["window"]["hard_ceiling"],
          }
          assert q["remaining_seconds"]>0
          assert q["g24_binding_status"]=="PASS"
          assert q["part4_reopen_authorized"] is False
          assert q["partitioning_authorized"] is False
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
