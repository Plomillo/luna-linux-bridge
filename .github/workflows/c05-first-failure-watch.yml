name: C05 first-failure watch

on:
  workflow_run:
    workflows:
      - C05 hosted restricted-container seed execution
      - C05 automated independent validation
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report-first-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Identify first failed job and step and notify PR 196
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const prNumber = 196;
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const jobs = jobsResponse.data.jobs;
            const failedJobs = jobs.filter(job => job.conclusion === "failure");
            const first = failedJobs
              .map(job => ({
                job,
                step: (job.steps || []).find(step => step.conclusion === "failure")
              }))
              .find(item => item.step) || { job: failedJobs[0], step: null };

            const jobName = first.job?.name || "Unknown job";
            const stepName = first.step?.name || "No failed step exposed";
            const stepNumber = first.step?.number ?? "unknown";
            const logUrl = first.job?.html_url || run.html_url;
            const marker = "<!-- C05_FIRST_FAILURE_WATCH -->";
            const body = [
              marker,
              "## C05 — first failure detected",
              "",
              "- Workflow: **" + run.name + "** (#" + run.run_number + ")",
              "- Commit: `" + run.head_sha + "`",
              "- Failed job: **" + jobName + "**",
              "- First failed step exposed by GitHub: **" + stepName + "** (step " + stepNumber + ")",
              "- Run: " + run.html_url,
              "- Job/log view: " + logUrl,
              "",
              "This is an immediate failure signal, not a diagnosis or repair. The remediation owner must inspect the failing step's logs, reproduce the first failing assertion, patch the same branch, add a regression test, and verify the full C05 chain. Do not rerun blindly, weaken gates, or mark unsupported cases PASS.",
              ""
            ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100
            });
            const prior = comments.find(comment => comment.body?.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: prior.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body
              });
            }
