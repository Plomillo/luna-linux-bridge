name: "R4 PART4 R2 — wimtools capability"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-part4-r2-wimtools-capability.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Probe local and repository wimtools capability
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "--- LOCAL ---"
          command -v wimlib-imagex || true
          dpkg-query -W -f='${Package}\t${Version}\n' wimtools libwim15 2>/dev/null || true
          echo "--- APT POLICY ---"
          apt-cache policy wimtools libwim15 || true
          echo "--- APT SHOW ---"
          apt-cache show wimtools 2>/dev/null | sed -n '1,120p' || true
