name: "CUSTOSZ runtime: despacho material investigativo en sandbox"
on:
  push:
    branches: [staging/custosz-v7-metaos-20260927]
    paths: [.github/workflows/custosz-r4-runtime-sandbox.yml]
permissions:
  contents: write
jobs:
  test-runtime-dispatch:
    if: github.repository == 'Plomillo/luna-linux-bridge' && github.actor == 'Plomillo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Vincular el registro existente de CUSTOSZ con el runtime en un sandbox
        env:
          REPORT_FILE: ${{ runner.temp }}/runtime-sandbox-result.json
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -I - <<'PY'
          import os,sys,json,hashlib,tempfile,time
          from pathlib import Path
          from datetime import datetime,timezone
          repo=Path.cwd()
          rfile=Path(os.environ['REPORT_FILE'])
          mid='MIS-31e208fc59964c059f03'
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          artifact=repo/'artifacts/custosz-v7/CUSTOSZ_RUNTIME_V1_SR_EXEC_BOUND_FME_01.b.pyz'
          custosz=repo/'artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz'
          mission=repo/'docs/missions/LUNA_R4_CUSTOSZ_V7/MISION_MAESTRA_DEFINITIVA.md'
          a0=repo/'Louksna.md'
          report={'scope':'GITHUB_HOSTED_ISOLATED_RESEARCH_PROOF_ONLY','host_runtime_activation':False,
                  'g23':'HOLD','g24':'HOLD','mission_id':mid,'actual_runtime_sha256':sha(artifact),
                  'skeleton_expected_sha256':'4e9bf0e799487ea0fd6a6d32359176bdce996010e33ed151ce0f186155d11df0',
                  'status':'NOT_EXECUTED','evidence':{}}
          try:
              assert sha(artifact)=='a79e13869601d68fe801b85ad421719b79d4afa5520ae34b91b419bd8834ae67'
              assert sha(custosz)=='dacf1f8c13b2fcbfc617cf0d4d780b30502c13395224691e6b0f05f53d9816a2'
              assert sha(a0)=='5270c3d643339c283edf13b414f335f23f921c4dac023b06d38de62927e29bf9'
              assert mid in (repo/'docs/missions/LUNA_R4_CUSTOSZ_V7/README.md').read_text()
              with tempfile.TemporaryDirectory(prefix='r4-runtime-sandbox-') as d:
                  tmp=Path(d)
                  executor=tmp/'readonly_research_executor.py'
                  executor.write_text("""
import sys,os,json,hashlib,time
from pathlib import Path
dispatch,ack,fme,target=map(Path,sys.argv[1:5])
d=json.loads(dispatch.read_text())
canon=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
dig=lambda x:hashlib.sha256(canon(x)).hexdigest()
a={'mission_id':d['mission_id'],'dispatch_id':d['dispatch_id'],'executor_id':d['executor_id'],'accepted':True,'pid':os.getpid(),'process_or_execution_token':'isolated-github-hosted-readonly-research'}
a['ack_digest']=dig(a)
ack.write_text(json.dumps(a,sort_keys=True))
time.sleep(.12)
result={'scope':'GITHUB_HOSTED_ISOLATED_RESEARCH_ONLY','mission_id':d['mission_id'],'source_dispatch_sha256':hashlib.sha256(dispatch.read_bytes()).hexdigest(),'status':'SOURCE_IDENTITY_CHECKED','no_host_or_disk_mutation':True,'pending':['A1 semantic equivalence','PUAC2 formal admission','host runtime pin discrepancy','G23/G24 independent review','F3-DISK separate human authorization']}
target.write_text(json.dumps(result,sort_keys=True))
f={'mission_id':d['mission_id'],'dispatch_id':d['dispatch_id'],'binding_id':d['binding_id'],'pid':os.getpid(),'fme_id':'FME-GITHUB-READONLY-'+d['dispatch_id'],'target':str(target),'after_digest':hashlib.sha256(target.read_bytes()).hexdigest(),'effect_type':d['expected_effect']['effect_type'],'effect_is_material':True,'effect_is_mission_relevant':True,'effect_is_authorized':True,'effect_is_observable':True}
f['fme_digest']=dig(f)
fme.write_text(json.dumps(f,sort_keys=True))
time.sleep(.65)
""",encoding='utf-8')
                  sys.path.insert(0,str(artifact))
                  from runtime_core import Runtime,ExecutorAdapter,TimeBudgetController
                  from sr_exec_bound_fme_01 import SRExecBoundFME01
                  rt=Runtime(tmp/'runtime',a0,sha(a0))
                  rt.budget=TimeBudgetController(1200)
                  rt.mission.transition('PRECHECK')
                  rt.executors.register(ExecutorAdapter('CUSTOSZ_R4_READONLY_RESEARCH','LOCAL_SUBPROCESS',sys.executable,capabilities={'READONLY_RESEARCH':1.0}))
                  cp=rt.checkpoints.capture_file('MISSION_BEFORE_RESEARCH',mission)
                  spec={'mission_id':mid,'mission_spec_digest':sha(mission),'required_abilities':{'READONLY_RESEARCH':1.0},
                    'authority_context':{'authority':'Louksna.md','sha256':sha(a0)},
                    'policy_context':{'policy_id':'GITHUB_HOSTED_NO_USER_HOST_ACCESS','scope':'ISOLATED_READONLY_RESEARCH_ONLY','allow':True},
                    'execution_payload_digest':sha(executor),
                    'expected_effect':{'target':str(tmp/'RESEARCH_RESULT.json'),'effect_type':'READONLY_RESEARCH_REPORT'},
                    'checkpoint_pointer':cp['checkpoint_id'],'runtime_digest':sha(artifact),'mission_state':'DISPATCH_READY',
                    'executor_metadata':{'CUSTOSZ_R4_READONLY_RESEARCH':{'identity_valid':True,'provenance_valid':True,'digest':sha(sys.executable)}},
                    'executor_policy':{'CUSTOSZ_R4_READONLY_RESEARCH':{'permissions_valid':True,'resource_envelope_valid':True,'policy_allow':True,'risk':0,'cost':0}},
                    'probe_argv':{'CUSTOSZ_R4_READONLY_RESEARCH':['{COMMAND}','-B','-I','-c','import sys;sys.exit(0)']},
                    'dispatch':{'cwd':str(tmp),'argv_template':['{COMMAND}','-B','-I',str(executor),'{DISPATCH_PATH}','{ACK_PATH}','{FME_PATH}','{TARGET}'],'timeout_s':10,'ack_timeout_s':3,'fme_timeout_s':3}}
                  result=SRExecBoundFME01(rt).establish_material_execution(spec)
                  report['status']='RUNTIME_SANDBOX_DISPATCH_PASS' if result['result']=='PASS' else 'FAIL'
                  report['evidence']={'runtime_result':result['result'],'runtime_step_gate':result['global_step_gate'],'material_execution_proven_only_in_sandbox':result['material_execution_proven'],'runtime_evidence_head':result['evidence_chain_head'],'target_sha256':sha(tmp/'RESEARCH_RESULT.json'),'checkpoint_id':cp['checkpoint_id'],'research_result':json.loads((tmp/'RESEARCH_RESULT.json').read_text())}
          except Exception as e:
              report['status']='RUNTIME_SANDBOX_FAIL_CLOSED'
              report['error']=type(e).__name__+':'+str(e)[:300]
          report['tested_at_utc']=datetime.now(timezone.utc).isoformat()
          rfile.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          print('RUNTIME_SANDBOX_REPORT='+json.dumps(report,ensure_ascii=False,sort_keys=True))
          PY
      - name: Publicar dictamen exacto del ensayo del runtime en README
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_FILE: ${{ runner.temp }}/runtime-sandbox-result.json
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -I - <<'PY'
          import json,base64,os,urllib.request
          from pathlib import Path
          branch='staging/custosz-v7-metaos-20260927'
          url='https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/docs/missions/LUNA_R4_CUSTOSZ_V7/README.md'
          h={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}
          def req(method,u,p=None):
              data=None if p is None else json.dumps(p).encode()
              with urllib.request.urlopen(urllib.request.Request(u,method=method,headers=h,data=data),timeout=25) as response:return json.load(response)
          old=req('GET',url+'?ref='+branch)
          text=base64.b64decode(old['content']).decode()
          run=os.environ['GITHUB_RUN_ID']
          title='## Ensayo real del runtime en sandbox '+run
          path=Path(os.environ['REPORT_FILE'])
          report=json.loads(path.read_text()) if path.exists() else {'status':'NO_TEST_REPORT','run_id':run}
          if title not in text:
              section='\n\n'+title+'\n\nEvidencia: https://github.com/Plomillo/luna-linux-bridge/actions/runs/'+run+'\n\nPrueba aislada: NO certifica ni activa el runtime en LOUKSNA.\n\n~~~json\n'+json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+'\n~~~\n'
              p={'message':'docs(custosz): resultado de ensayo aislado del runtime '+run,'branch':branch,'sha':old['sha'],'content':base64.b64encode((text+section).encode()).decode()}
              out=req('PUT',url,p)
              print('RUNTIME_TEST_README_COMMIT='+out['commit']['sha'])
          else:print('REPORT_ALREADY_EXISTS='+run)
          PY
