name: "R4 APC48 — independent G23 G24 trust root"

on:
  pull_request_target:
    branches:
      - staging/luna-r4-apc48-trustroot-20260929
    paths:
      - server/apc48/**

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: r4-apc48-independent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  g23:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable trust root
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trust
          sparse-checkout: scripts/assurance/apc48_trust_root.py
          sparse-checkout-cone-mode: false

      - name: Checkout candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          path: candidate
          sparse-checkout: server/apc48
          sparse-checkout-cone-mode: true

      - name: Freeze candidate read-only
        shell: bash
        run: chmod -R a-w "$GITHUB_WORKSPACE/candidate"

      - name: G23 independent structural validation
        shell: bash
        env:
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 -B -I "$GITHUB_WORKSPACE/trust/scripts/assurance/apc48_trust_root.py" g23 \
            --candidate "$GITHUB_WORKSPACE/candidate" \
            --out "$RUNNER_TEMP/g23/G23.json"
          cat "$RUNNER_TEMP/g23/G23.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve G23
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-apc48-independent-g23
          path: ${{ runner.temp }}/g23
          if-no-files-found: error
          retention-days: 90

  g24:
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable trust root
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trust
          sparse-checkout: scripts/assurance/apc48_trust_root.py
          sparse-checkout-cone-mode: false

      - name: Download G23
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-apc48-independent-g23
          path: ${{ runner.temp }}/g23

      - name: Authenticate G24 authority with OIDC bound to candidate digest
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUST_ROOT_SHA: ${{ github.workflow_sha }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g24"
          DIGEST="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_digest_sha256"])' "$RUNNER_TEMP/g23/G23.json")"
          AUD="louksna-r4-apc48-g24:$DIGEST"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(RESP="$RESP" python3 - <<'PY'
import json,os
print(json.loads(os.environ["RESP"])["value"])
PY
)"
          TOKEN="$TOKEN" DIGEST="$DIGEST" AUD="$AUD" HEAD_SHA="$HEAD_SHA" TRUST_ROOT_SHA="$TRUST_ROOT_SHA" python3 - <<'PY'
import base64,hashlib,json,os,pathlib
tok=os.environ["TOKEN"]
parts=tok.split(".")
if len(parts)!=3:
    raise SystemExit("OIDC_TOKEN_FORMAT_INVALID")
payload=parts[1] + "="*((4-len(parts[1])%4)%4)
claims=json.loads(base64.urlsafe_b64decode(payload))
aud=claims.get("aud")
expected=os.environ["AUD"]
if aud!=expected and not (isinstance(aud,list) and expected in aud):
    raise SystemExit("OIDC_AUDIENCE_MISMATCH")
if claims.get("repository")!="Plomillo/luna-linux-bridge":
    raise SystemExit("OIDC_REPOSITORY_MISMATCH")
obj={
  "schema":"LOUKSNA_R4_APC48_AUTHORITY/1.0",
  "authority_authenticated":True,
  "candidate_digest_sha256":os.environ["DIGEST"],
  "candidate_head_sha":os.environ["HEAD_SHA"],
  "trust_root_sha":os.environ["TRUST_ROOT_SHA"],
  "signature_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(tok.encode()).hexdigest(),
  "repository":claims.get("repository"),
  "subject":claims.get("sub"),
  "workflow":claims.get("workflow"),
  "raw_token_persisted":False
}
pathlib.Path(os.environ["RUNNER_TEMP"],"g24","AUTHORITY_EVIDENCE.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
PY
          unset TOKEN RESP

      - name: G24 digest-bound pre-installation certification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -I "$GITHUB_WORKSPACE/trust/scripts/assurance/apc48_trust_root.py" g24 \
            --g23 "$RUNNER_TEMP/g23/G23.json" \
            --authority "$RUNNER_TEMP/g24/AUTHORITY_EVIDENCE.json" \
            --out "$RUNNER_TEMP/g24/G24_CERTIFICATE.json"
          cat "$RUNNER_TEMP/g24/G24_CERTIFICATE.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve G24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-apc48-independent-g24
          path: ${{ runner.temp }}/g24
          if-no-files-found: error
          retention-days: 90
