name: TCP endpoint candidate - control

on:
  push:
    paths:
      - 'bridge/tcp_endpoint_candidate.py'
      - 'bridge/tcp_endpoint_probe.py'
      - '.github/workflows/tcp-endpoint-candidate-10m.yml'

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Control execution
        run: |
          set -Eeuo pipefail
          echo "ACTIONS_CONTROL_PLANE_OK"
          python3 --version
          uname -a
