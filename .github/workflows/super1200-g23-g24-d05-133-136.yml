name: SUPER1200 — source-bound G23/G24 gates for D05 133-136
# Same mechanism as D05 129-132. Scoped only. Never promotes global SUPER1200 certification.

on:
  workflow_dispatch:
  push:
    branches:
      - custosz/super-1200-implementation-20261007
    paths:
      - "continuity/runtime-evidence/D05/capability-0133.json"
      - "continuity/runtime-evidence/D05/capability-0134.json"
      - "continuity/runtime-evidence/D05/capability-0135.json"
      - "continuity/runtime-evidence/D05/capability-0136.json"
      - "implementation/super1200/domains/D05_proof_lifecycle.py"
      - "implementation/super1200/tests/test_d05_proof_lifecycle.py"
      - "continuity/g23_g24_d05_133_136.py"
      - ".github/workflows/super1200-g23-g24-d05-133-136.yml"

permissions:
  contents: read

concurrency:
  group: super1200-g23-g24-d05-133-136
  cancel-in-progress: false

jobs:
  g23-independent-validation:
    name: G23 — independent validation (D05 133-136)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      result: ${{ steps.validate.outputs.result }}
      scope: ${{ steps.validate.outputs.scope }}
    steps:
      - name: Checkout governed candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          persist-credentials: false
      - name: Independently validate D05 133-136 evidence
        id: validate
        shell: bash
        env:
          GATE_STAGE: G23
        run: |
          set -Eeuo pipefail
          python3 -B continuity/g23_g24_d05_133_136.py
      - name: Preserve G23 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: super1200-g23-d05-133-136-${{ github.run_id }}
          path: g23-validation.json
          if-no-files-found: warn
          retention-days: 90

  g24-scoped-certification:
    name: G24 — scoped certification (requires G23)
    needs: g23-independent-validation
    if: needs.g23-independent-validation.outputs.result == 'PASS' && needs.g23-independent-validation.outputs.scope == 'D05:133-136'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout governed candidate branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          fetch-depth: 0
      - name: Download G23 proof from independent job
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: super1200-g23-d05-133-136-${{ github.run_id }}
      - name: Revalidate G23 scope and perform G24 source-bound checks
        shell: bash
        env:
          GATE_STAGE: G24
          G23_RESULT: ${{ needs.g23-independent-validation.outputs.result }}
          G23_SCOPE: ${{ needs.g23-independent-validation.outputs.scope }}
        run: |
          set -Eeuo pipefail
          python3 -B continuity/g23_g24_d05_133_136.py
      - name: Persist scoped G23/G24 records without global promotion
        shell: bash
        env:
          GATE_STAGE: PERSIST
        run: |
          set -Eeuo pipefail
          python3 -B continuity/g23_g24_d05_133_136.py
          git diff --check
          git add continuity/STATE.json continuity/certification/D05_133_136.json
          git config user.name "super1200-g24-certifier"
          git config user.email "super1200-g24-certifier@users.noreply.github.com"
          git commit -m "cert(super1200): certify D05 133-136 scope only"
          git pull --rebase origin custosz/super-1200-implementation-20261007
          git push origin HEAD:refs/heads/custosz/super-1200-implementation-20261007
          echo "SUPER1200_G24_PERSISTENCE=PASS SCOPE=D05:133-136 GLOBAL_CERTIFICATION=FALSE"
      - name: Preserve scoped G24 decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: super1200-g24-d05-133-136-${{ github.run_id }}
          path: g24-certification-decision.json
          if-no-files-found: warn
          retention-days: 90
