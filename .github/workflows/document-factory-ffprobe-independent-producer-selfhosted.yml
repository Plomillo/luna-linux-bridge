name: "Document Factory — FFprobe independent producer self-hosted"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/document-factory-ffprobe-independent-producer-selfhosted.yml"

permissions:
  contents: read

concurrency:
  group: document-factory-ffprobe-independent-producer-selfhosted
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 3774cb102ad6318fc824b2cb87c5055e9f5f4b0b
  ACTIVE_SHA: 43a82aa30607b8775c998fa39b2bc08bfc2a263f
  BASELINE_SHA: 716f9dc3f45324eb87280954c18b8dc475a451e8
  TRUST_ROOT_SHA: 17fdfa77aabf06ded29a4291a34bad27e80fac84
  SOURCE_FRESH_PRODUCER_RUN: "37384163620"
  SOURCE_FRESH_PRODUCER_ARTIFACT_SHA256: 4ece99564e2828e8b8516c0fea6db0b574397e4ffc981f3c6652c81f960fb7e9
  SOURCE_FRESH_PRODUCER_DIGEST: 72ad5ae5f348ab35c1c97b82075136c9a71cc45fab6b427387a565bd6a3cff0a
  PANDOC_SHA256: 67d7d011fed8c8543306022b985b9b2499ab9b74818df91d8727c7e9ebc5ba06
  LIBREOFFICE_SHA256: d0a6031a3837e48f9854e6d2da6489b9fadbd814afa4741fa32a197741663a22

jobs:
  independent-producer:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3774cb102ad6318fc824b2cb87c5055e9f5f4b0b
          fetch-depth: 0
          persist-credentials: false
          path: independent-candidate-${{ github.run_id }}

      - name: Independent producer with live telemetry
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE/independent-candidate-$GITHUB_RUN_ID"

          emit() {
            printf 'CUSTOSZ_INDEPENDENT_PRODUCER_TELEMETRY {"phase":"%s","status":"%s","candidate_sha":"%s","at":"%s"}\n' "$1" "$2" "$CANDIDATE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }

          HB_SEQ=0
          heartbeat() {
            while true; do
              HB_SEQ=$((HB_SEQ+1))
              printf 'CUSTOSZ_INDEPENDENT_PRODUCER_HEARTBEAT {"sequence":%s,"state":"RUNNING","candidate_sha":"%s","at":"%s"}\n' "$HB_SEQ" "$CANDIDATE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              sleep 2
            done
          }
          heartbeat &
          HB_PID=$!
          cleanup() { kill "$HB_PID" 2>/dev/null || true; wait "$HB_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          emit INDEPENDENCE_PRECHECK RUNNING
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$ACTIVE_SHA"
          git cat-file -e "$BASELINE_SHA^{commit}"
          git diff --name-only "$BASELINE_SHA" "$CANDIDATE_SHA" > "$RUNNER_TEMP/independent-changed-paths.txt"
          BAD="$(grep -Ev '^(document-factory/|\.github/workflows/document-factory-candidate\.yml$)' "$RUNNER_TEMP/independent-changed-paths.txt" || true)"
          test -z "$BAD"
          emit INDEPENDENCE_PRECHECK PASS

          emit NEGATIVE_AND_SELFTEST RUNNING
          python3 -B document-factory/src/selftest.py | tee "$RUNNER_TEMP/independent-selftest.json"
          python3 -B document-factory/src/factory.py validate-profile document-factory/profiles/uniacc-neuroplasticidad-u2.json --repo-root .
          emit NEGATIVE_AND_SELFTEST PASS

          emit VERIFIED_PANDOC RUNNING
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-linux-amd64.tar.gz" -o "$RUNNER_TEMP/independent-pandoc.tgz"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/independent-pandoc.tgz" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/independent-pandoc"
          mkdir -p "$RUNNER_TEMP/independent-pandoc"
          tar -xzf "$RUNNER_TEMP/independent-pandoc.tgz" --strip-components=1 -C "$RUNNER_TEMP/independent-pandoc"
          "$RUNNER_TEMP/independent-pandoc/bin/pandoc" --version | head -n 1 | tee "$RUNNER_TEMP/independent-pandoc-version.txt"
          export PATH="$RUNNER_TEMP/independent-pandoc/bin:$PATH"
          emit VERIFIED_PANDOC PASS

          emit VERIFIED_LIBREOFFICE RUNNING
          if [ -x /opt/libreoffice26.8/program/soffice ]; then
            /opt/libreoffice26.8/program/soffice --version | head -n 1 | tee "$RUNNER_TEMP/independent-libreoffice-version.txt"
            grep -F "26.8.0" "$RUNNER_TEMP/independent-libreoffice-version.txt"
            printf '%s\n' "$LIBREOFFICE_SHA256" > "$RUNNER_TEMP/independent-libreoffice-expected-archive-sha256.txt"
            echo "CUSTOSZ_INDEPENDENT_LIBREOFFICE_SOURCE=PREVIOUSLY_MATERIALIZED_VERIFIED_RUNTIME"
          else
            curl --fail --silent --show-error --location --connect-timeout 20 --max-time 600 --retry 3 --retry-delay 5 \
              "https://download.documentfoundation.org/libreoffice/stable/26.8.0/deb/x86_64/LibreOffice_26.8.0_Linux_x86-64_deb.tar.gz" \
              -o "$RUNNER_TEMP/independent-libreoffice.tgz"
            echo "$LIBREOFFICE_SHA256  $RUNNER_TEMP/independent-libreoffice.tgz" | sha256sum -c -
            rm -rf "$RUNNER_TEMP/independent-lo"
            mkdir -p "$RUNNER_TEMP/independent-lo"
            tar -xzf "$RUNNER_TEMP/independent-libreoffice.tgz" -C "$RUNNER_TEMP/independent-lo"
            sudo dpkg -i "$RUNNER_TEMP"/independent-lo/*/DEBS/*.deb || { sudo apt-get update; sudo apt-get -f install -y; sudo dpkg -i "$RUNNER_TEMP"/independent-lo/*/DEBS/*.deb; }
            /opt/libreoffice26.8/program/soffice --version | head -n 1 | tee "$RUNNER_TEMP/independent-libreoffice-version.txt"
            grep -F "26.8.0" "$RUNNER_TEMP/independent-libreoffice-version.txt"
            printf '%s\n' "$LIBREOFFICE_SHA256" > "$RUNNER_TEMP/independent-libreoffice-expected-archive-sha256.txt"
            echo "CUSTOSZ_INDEPENDENT_LIBREOFFICE_SOURCE=OFFICIAL_ARCHIVE_HASH_VERIFIED"
          fi
          export PATH="/opt/libreoffice26.8/program:$PATH"
          emit VERIFIED_LIBREOFFICE PASS

          emit FRESH_REFERENCE_BUILD RUNNING
          W="$RUNNER_TEMP/independent-factory-demo"
          rm -rf "$W"
          mkdir -p "$W/source" "$W/data"
          python3 - <<'PY'
          import json,os,pathlib
          w=pathlib.Path(os.environ["RUNNER_TEMP"])/"independent-factory-demo"
          body=" ".join(["evidence"]*850)
          (w/"source/report.md").write_text("---\ntitle: Independent Synthetic Demo\n---\n<!-- BODY_START -->\n# Introducción\n"+body+"\n<!-- BODY_END -->\n",encoding="utf-8")
          (w/"source/slides.md").write_text("---\ntitle: Independent Synthetic Demo\n---\n# Demo\nIndependent CI fixture.\n",encoding="utf-8")
          (w/"data/sheets.json").write_text(json.dumps({"sheets":[{"name":"Evidence","rows":[["id","status"],["INDEPENDENT_SELFTEST","PASS"]]}]},indent=2)+"\n",encoding="utf-8")
          ledger={"schema":"DOCUMENT_FACTORY_SOURCE_LEDGER/1.0","fixture":True,"sources":[{"source_id":"IND-S1","verified":True},{"source_id":"IND-S2","verified":True},{"source_id":"IND-S3","verified":True}]}
          (w/"data/source-ledger.json").write_text(json.dumps(ledger,indent=2)+"\n",encoding="utf-8")
          PY
          python3 -B document-factory/src/factory.py build "$W" document-factory/profiles/uniacc-neuroplasticidad-u2.json --repo-root .
          python3 -B document-factory/src/factory.py self-audit "$W" document-factory/profiles/uniacc-neuroplasticidad-u2.json
          python3 -B document-factory/src/factory.py freeze "$W"
          emit FRESH_REFERENCE_BUILD PASS

          emit ASSEMBLE_INDEPENDENT_PACKAGE RUNNING
          P="$RUNNER_TEMP/independent-frozen"
          rm -rf "$P"
          mkdir -p "$P/framework" "$P/workspace"
          cp -a document-factory/. "$P/framework/"
          cp -a "$W"/. "$P/workspace/"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          rt=pathlib.Path(os.environ["RUNNER_TEMP"])
          root=rt/"independent-frozen"
          selftest=json.loads((rt/"independent-selftest.json").read_text(encoding="utf-8").splitlines()[-1])
          evidence={
            "schema":"DOCUMENT_FACTORY_PRODUCER_EVIDENCE/1.0",
            "status":"PASS",
            "candidate_head_sha":os.environ["CANDIDATE_SHA"],
            "base_sha":os.environ["BASELINE_SHA"],
            "trust_root_sha":os.environ["TRUST_ROOT_SHA"],
            "selftest":selftest,
            "changed_paths":[x for x in (rt/"independent-changed-paths.txt").read_text().splitlines() if x],
            "provider_archive_sha256":{"pandoc":os.environ["PANDOC_SHA256"],"libreoffice":os.environ["LIBREOFFICE_SHA256"]},
            "pandoc_version":(rt/"independent-pandoc-version.txt").read_text().strip(),
            "libreoffice_version":(rt/"independent-libreoffice-version.txt").read_text().strip(),
            "runner":"self-hosted:luna-linux",
            "producer_role":"INDEPENDENT_PRODUCER",
            "source_fresh_producer_run":os.environ["SOURCE_FRESH_PRODUCER_RUN"],
            "source_fresh_producer_artifact_sha256":os.environ["SOURCE_FRESH_PRODUCER_ARTIFACT_SHA256"],
            "source_fresh_producer_digest":os.environ["SOURCE_FRESH_PRODUCER_DIGEST"],
            "bitwise_cross_environment_reproducibility_claimed":False
          }
          (root/"PRODUCER_EVIDENCE.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          rows=[]
          for f in sorted(x for x in root.rglob("*") if x.is_file() and x.name not in {"CANDIDATE_DIGEST.txt","FROZEN_CANDIDATE.json"}):
              rows.append({"path":f.relative_to(root).as_posix(),"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"size_bytes":f.stat().st_size})
          digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          (root/"CANDIDATE_DIGEST.txt").write_text(digest+"\n",encoding="utf-8")
          (root/"FROZEN_CANDIDATE.json").write_text(json.dumps({"schema":"DOCUMENT_FACTORY_FROZEN_CANDIDATE/1.0","frozen":True,"candidate_digest_sha256":digest,"files":rows,"g23":"NOT_EXECUTED","g24":"NOT_EXECUTED"},indent=2,sort_keys=True)+"\n",encoding="utf-8")
          indep={
            "schema":"DOCUMENT_FACTORY_INDEPENDENCE/1.0",
            "status":"PASS",
            "candidate_head_sha":os.environ["CANDIDATE_SHA"],
            "validator_trust_root_sha":os.environ["TRUST_ROOT_SHA"],
            "candidate_digest_sha256":digest,
            "producer_job":"independent-producer-self-hosted",
            "validator_job":"g23-pending",
            "candidate_code_executed_in_g23":False,
            "candidate_write_access_in_g23":False,
            "repair_allowed_in_g23":False,
            "candidate_artifact_consumed_as_data_only":True,
            "organizational_independence":"NOT_CLAIMED",
            "structural_independence":"PASS"
          }
          (root/"INDEPENDENCE.json").write_text(json.dumps(indep,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("CUSTOSZ_INDEPENDENT_PRODUCER_DIGEST="+digest,flush=True)
          PY
          emit ASSEMBLE_INDEPENDENT_PACKAGE PASS
          emit INDEPENDENT_PRODUCER PASS

      - name: Upload independent producer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-factory-ffprobe-independent-producer
          path: ${{ runner.temp }}/independent-frozen
          if-no-files-found: error
          retention-days: 90
