name: "LOUKSNA ZD V0.3 — CP-04 Secret Service lifecycle"

on:
  workflow_dispatch:
  push:
    branches:
      - work/voice-e2e-stack-20261010
    paths:
      - scripts/missions/test_louksna_zd_v03_secret_service_runtime.py
      - .github/workflows/louksna-cp04-secret-service-runtime.yml

permissions:
  contents: read

concurrency:
  group: louksna-cp04-secret-service-${{ github.sha }}
  cancel-in-progress: false

jobs:
  secret-service-runtime:
    name: "CP-04 — Isolated Secret Service store / lookup / clear / absence"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Secret Service test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y dbus-x11 gnome-keyring libsecret-tools

      - name: Run isolated synthetic credential lifecycle
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dbus-run-session -- bash -Eeuo pipefail -c '
            TEST_HOME="$(mktemp -d /tmp/louksna-cp04-home.XXXXXX)"
            trap "rm -rf \"$TEST_HOME\"" EXIT
            export HOME="$TEST_HOME"
            export XDG_CONFIG_HOME="$TEST_HOME/.config"
            export XDG_DATA_HOME="$TEST_HOME/.local/share"
            export XDG_RUNTIME_DIR="$TEST_HOME/runtime"
            mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            set +e
            KEYRING_ENV="$(printf "%s\n" "louksna-disposable-test-password" | gnome-keyring-daemon --unlock --components=secrets 2>/dev/null)"
            KEYRING_RC=$?
            set -e
            if [ "$KEYRING_RC" -eq 0 ] && [ -n "$KEYRING_ENV" ]; then eval "$KEYRING_ENV"; fi
            python3 scripts/missions/test_louksna_zd_v03_secret_service_runtime.py
          '

      - name: Upload digest-bound CP-04 runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-cp04-secret-service-evidence
          path: evidence/cp04-secret-service/
          if-no-files-found: warn
          retention-days: 90
