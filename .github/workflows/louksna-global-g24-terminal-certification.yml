name: LUNITA G24 terminal certification

# Runs only after G23 completes. Re-downloads the same release asset and
# refuses to certify unless the independent attestation names that exact hash.

on:
  workflow_run:
    workflows:
      - LUNITA G23 independent validation
    types:
      - completed
  workflow_dispatch:
    inputs:
      g23_run_id:
        description: Successful G23 run id whose attestation must be checked
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  g24:
    name: Certify only the hash G23 actually executed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Resolve the G23 run
        id: g23
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ inputs.g23_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the G23 attestation
        uses: actions/download-artifact@v4
        with:
          name: lunita-g23-attestation
          run-id: ${{ steps.g23.outputs.run_id }}
          github-token: ${{ github.token }}
          path: g23-evidence

      - name: Re-download the asset and require the same hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          evidence = pathlib.Path("g23-evidence")
          att_path = next(evidence.rglob("LUNITA_G23_ATTESTATION.json"))
          att = json.loads(att_path.read_text())
          required = [
              att.get("schema") == "LUNITA_G23_ATTESTATION/2",
              att.get("result") == "PASS",
              att.get("independent_runner") is True,
              att.get("builder_host") is False,
              att.get("mount_cycles") == 10,
              att.get("mount") == "squashfuse",
              att.get("rsession_rc") == 0,
              att.get("welch_observed") is True,
              att.get("jasp_ok") is True,
              att.get("sudo_ok") is True,
              att.get("sudo_uid") == "0",
              att.get("e01_status") == "EXECUTED",
              att.get("e04_dims") == 384,
              att.get("model_file") == "Qwen3-0.6B-IQ3_XS.gguf",
              att.get("model_bytes") == 379605408,
              att.get("model_sha256") == "0906dcf62aa4f005887e855731376f0bf3be8f5ffa61f547df71e6154ea748d9",
              "IQ3_XS" in str(att.get("e01_model")),
              att.get("brujula_status") == 200,
              att.get("brujula_title") == "LUNITA-BRUJULA-MARKER",
              att.get("jamovi_ok") is True,
              att.get("jamovi_engine") == "jmv::ttestIS",
              att.get("jamovi_mean_a") == 2.5,
              att.get("jamovi_desktop_ui") is False,
              att.get("rstudio_ok") is True,
              att.get("libreoffice_ok") is True,
              att.get("xfce_session") is True,
              att.get("xfce_display") == "Xvfb",
              att.get("physical_console") is False,
              att.get("kvm") is False,
              att.get("mailbox_ok") is True,
              att.get("qdrant_persisted") is True,
              att.get("qdrant_top") == "alfa",
              att.get("e2e_ok") is True,
              att.get("t01_count") == 80,
              att.get("t01_failed") == [],
              att.get("integral_meta28") is False,
              isinstance(att.get("sha256"), str) and len(att["sha256"]) == 64,
              isinstance(att.get("bytes"), int) and 0 < att["bytes"] <= 2_000_000_000,
              bool(att.get("release_tag")) and bool(att.get("asset_name")),
          ]
          if not all(required):
              print(json.dumps(att, indent=2))
              raise SystemExit("G23 attestation is incomplete")
          dest = pathlib.Path("downloaded-asset")
          dest.mkdir()
          subprocess.check_call([
              "gh", "release", "download", att["release_tag"],
              "--repo", os.environ["GITHUB_REPOSITORY"],
              "--pattern", att["asset_name"],
              "--dir", str(dest),
              "--clobber",
          ])
          blob = dest / att["asset_name"]
          h = hashlib.sha256()
          with blob.open("rb") as fh:
              for chunk in iter(lambda: fh.read(8 << 20), b""):
                  h.update(chunk)
          digest = h.hexdigest()
          size = blob.stat().st_size
          if digest != att["sha256"] or size != att["bytes"]:
              raise SystemExit(f"asset identity mismatch {digest} {size}")
          certificate = {
              "schema": "LUNITA_G24_CERTIFICATE/2",
              "gate": "G24",
              "result": "CERTIFIED_SCOPE",
              "integral_meta28": False,
              "not_certified": ["jamovi_electron_desktop", "physical_or_kvm_console_boot"],
              "sha256": digest,
              "bytes": size,
              "asset_name": att["asset_name"],
              "release_tag": att["release_tag"],
              "g23_run_id": os.environ.get("G23_RUN_ID") or "${{ steps.g23.outputs.run_id }}",
              "g23_result": att["result"],
              "same_hash_as_g23": True,
              "sudo_ok": att.get("sudo_ok") is True,
              "sudo_scope": att.get("sudo_scope"),
              "e01_status": att.get("e01_status"),
              "e01_model": att.get("e01_model"),
              "model_sha256": att.get("model_sha256"),
              "xfce_session": att.get("xfce_session") is True,
              "xfce_display": att.get("xfce_display"),
              "physical_console": False,
              "brujula_title": att.get("brujula_title"),
              "jamovi_engine": att.get("jamovi_engine"),
              "jamovi_desktop_ui": False,
              "libreoffice_ok": att.get("libreoffice_ok") is True,
              "rstudio_ok": att.get("rstudio_ok") is True,
              "mailbox_ok": att.get("mailbox_ok") is True,
              "qdrant_persisted": att.get("qdrant_persisted") is True,
              "e2e_ok": att.get("e2e_ok") is True,
              "t01_count": att.get("t01_count"),
              "t01_failed": att.get("t01_failed"),
          }
          pathlib.Path("LUNITA_G24_CERTIFICATE.json").write_text(json.dumps(certificate, indent=2) + "\n")
          print(json.dumps(certificate, indent=2))
          PY

      - name: Upload G24 certificate
        uses: actions/upload-artifact@v4
        with:
          name: lunita-g24-certificate
          path: LUNITA_G24_CERTIFICATE.json
          if-no-files-found: error
