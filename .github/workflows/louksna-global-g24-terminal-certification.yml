name: "Louksna global G24 terminal certification"

on:
  workflow_run:
    workflows:
      - "Louksna global G23 independent validation"
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: louksna-global-g24-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  terminal-decision:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout trusted terminal certifier and policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Download the G23 report as untrusted data from the exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: louksna-global-g23-result
          path: ${{ runner.temp }}/g23
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Bind candidate SHA from the G23 record
        id: bind
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/g23/G23_GLOBAL.json" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          sha=p.get("candidate_sha")
          if not isinstance(sha,str) or re.fullmatch(r"[0-9a-f]{40}",sha) is None:
              raise SystemExit("G23_CANDIDATE_SHA_INVALID")
          with open(sys.argv[2],"a",encoding="utf-8") as out: out.write("candidate_sha="+sha+"\n")
          PY
      - name: Checkout the exact candidate source as untrusted data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.bind.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Independently verify the G23 attestation and signer workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/g23/G23_GLOBAL.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/louksna-global-g23-independent-validation.yml" \
            --format json > "$RUNNER_TEMP/G23_ATTESTATION_VERIFICATION.json"
      - name: Re-run global ledger with trusted G24 code and pinned policy
        shell: bash
        run: |
          set -Eeuo pipefail
          actual="$(git -C candidate rev-parse HEAD)"
          test "$actual" = "${{ steps.bind.outputs.candidate_sha }}" || { echo "::error::CANDIDATE_SHA_MISMATCH"; exit 2; }
          python3 -I trust-root/scripts/louksna_global_gate_ledger.py \
            --candidate-root "$GITHUB_WORKSPACE/candidate" \
            --trusted-root "$GITHUB_WORKSPACE/trust-root" \
            --policy "$GITHUB_WORKSPACE/trust-root/scripts/louksna_global_scope_policy.json" \
            --matrix "$GITHUB_WORKSPACE/trust-root/scripts/louksna_global_gate_matrix.json" \
            --candidate-sha "${{ steps.bind.outputs.candidate_sha }}" \
            --output "$RUNNER_TEMP/G23_RECHECK.json"
      - name: Apply G24 terminal decision
        id: decide
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I trust-root/scripts/louksna_g24_terminal_certifier.py \
            --g23-report "$RUNNER_TEMP/g23/G23_GLOBAL.json" \
            --recheck-report "$RUNNER_TEMP/G23_RECHECK.json" \
            --attestation-verification "$RUNNER_TEMP/G23_ATTESTATION_VERIFICATION.json" \
            --output "$RUNNER_TEMP/G24_GLOBAL_DECISION.json"
          python3 - "$RUNNER_TEMP/G24_GLOBAL_DECISION.json" "$GITHUB_OUTPUT" <<'PY'
          import json,sys
          record=json.load(open(sys.argv[1],encoding="utf-8"))
          with open(sys.argv[2],"a",encoding="utf-8") as out:
              out.write("decision="+str(record.get("decision","FAIL"))+"\n")
              out.write("certification_issued="+str(bool(record.get("certification_issued",False))).lower()+"\n")
          PY
      - name: Attest the G24 terminal decision (PASS is required for certification)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/G24_GLOBAL_DECISION.json
      - name: Verify the G24 terminal-decision attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/G24_GLOBAL_DECISION.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/louksna-global-g24-terminal-certification.yml" \
            --format json > "$RUNNER_TEMP/G24_ATTESTATION_VERIFICATION.json"
      - name: Preserve terminal decision and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-global-g24-terminal-decision
          path: |
            ${{ runner.temp }}/G24_GLOBAL_DECISION.json
            ${{ runner.temp }}/G23_RECHECK.json
            ${{ runner.temp }}/G24_ATTESTATION_VERIFICATION.json
          if-no-files-found: error
          retention-days: 90
      - name: Summarize result without silent promotion
        if: always()
        shell: bash
        run: |
          {
            echo "## Louksna global G24"
            echo "- Decision: `${{ steps.decide.outputs.decision || 'NOT_COMPLETED' }}`"
            echo "- Certification issued: `${{ steps.decide.outputs.certification_issued || 'false' }}`"
            echo "- Operational activation: prohibited by this certificate workflow."
          } >> "$GITHUB_STEP_SUMMARY"
