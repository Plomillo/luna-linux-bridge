name: "LUNA R4 master — validate bundle and host preflight"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - server/r4-master/**
      - .github/workflows/luna-r4-master-part-certify.yml
      - .github/workflows/luna-r4-master-validate.yml

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Syntax and contract validation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n server/r4-master/MASTER_RUN.sh
          python3 -m py_compile server/r4-master/master_controller.py
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path("server/r4-master")
          contract=json.loads((root/"R4_MASTER_CONTRACT.json").read_text(encoding="utf-8"))
          pins=json.loads((root/"UPSTREAM_PINS.json").read_text(encoding="utf-8"))
          mission=(root/"MASTER_MISSION.md").read_text(encoding="utf-8")
          controller=(root/"master_controller.py").read_text(encoding="utf-8")
          runner=(root/"MASTER_RUN.sh").read_text(encoding="utf-8")

          seq=[x["part"] for x in contract["sequence"]]
          assert seq == [f"PART_{i}" for i in range(1,10)]
          assert contract["checkpoint"]["resume_mode"]=="DIFFERENTIAL"
          assert contract["checkpoint"]["full_reinstall_forbidden"] is True
          assert contract["server_ready"]["repeat"] is False
          assert contract["certification"]["chain"]==["EVIDENCE","VALIDATION","G23","G24","ACTIVE_OR_NEXT_PART"]
          assert contract["destructive_scope"]["automatic_without_specific_gate"] is False
          assert contract["destructive_scope"]["operational_amendment"]=="PART4-R2-20260929"
          assert set(contract["destructive_scope"]["pre_destruction_required"]) == {"H2","H4","CERTIFIED_PROYECTOS_FREEZE","EXACT_SCOPE_PREVALIDATION","STEP_G23","STEP_G24"}
          assert set(contract["destructive_scope"]["superseded_preconditions"]) == {"TWO_VERIFIED_BACKUPS_BEFORE_WINDOWS_RETIREMENT","RESTORE_PROOF_BEFORE_WINDOWS_RETIREMENT"}
          assert contract["part4_r2"]["part5_to_part9_unchanged"] is True
          amendment=json.loads((root/"PART4_R2_AMENDMENT.json").read_text(encoding="utf-8"))
          assert amendment["amendment_id"]=="PART4-R2-20260929"
          assert amendment["authority"]=="Louksna.md"
          assert amendment["canonical_mutation"] is False
          assert amendment["authority_transfer"] is False
          assert amendment["failure_posture"]=="FAIL_CLOSED"
          assert "PART_1 -> PART_2 -> PART_3 -> PART_4 -> PART_5 -> PART_6 -> PART_7 -> PART_8 -> PART_9" in mission
          assert "PART_1_FULL_REINSTALL" in mission
          assert "H2 and H4 remain human" in mission
          assert '["dpkg-query","-W","-f=${Status}",pkg]' in controller
          assert "publish_and_certify" in controller
          assert "luna-r4-master-part-certify.yml" in controller
          assert "PART4_H2_H4.json" in controller
          assert "PART_4_R2/STATE.json" in controller
          assert "PART4_R2_AMENDMENT.json" in runner
          assert "PART4_R2_AUTOPILOT_ADDENDUM.json" in runner
          assert "PART4_R2_FINAL_MERGE_ADDENDUM.json" in runner
          assert "part4_r2_verify_tree.py" in runner
          assert "part4_r2_storage_migrate.sh" in runner
          assert "part4_r2_final_g24" in controller
          assert "final_merge_g24" in controller
          assert "verified_root_on_consolidated_linux" in controller
          assert "NoNewPrivileges=yes" not in runner
          assert "ProtectSystem=full" not in runner
          assert "systemctl --user enable --now luna-r4-master-part1-part9.service" in runner
          assert pins["mojo"]["version"]=="1.1.0"
          print("R4_MASTER_STATIC_VALIDATION=PASS")
          PY

      - name: Freeze bundle digest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/r4-master-validation"
          python3 - <<'PY'
          import hashlib, json, pathlib, os
          root=pathlib.Path("server/r4-master")
          names=["MASTER_RUN.sh","master_controller.py","MASTER_MISSION.md","R4_MASTER_CONTRACT.json","UPSTREAM_PINS.json","PART4_R2_AMENDMENT.json","PART4_R2_AUTOPILOT_ADDENDUM.json","PART4_R2_FINAL_MERGE_ADDENDUM.json","part4_r2_verify_tree.py","part4_r2_storage_migrate.sh"]
          rows=[]
          for name in sorted(names):
              data=(root/name).read_bytes()
              rows.append({"path":"server/r4-master/"+name,"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
          material="".join(f"{x['path']}\0{x['sha256']}\0{x['bytes']}\n" for x in rows).encode()
          digest=hashlib.sha256(material).hexdigest()
          out=pathlib.Path(os.environ["RUNNER_TEMP"])/"r4-master-validation"
          (out/"BUNDLE.json").write_text(json.dumps({
              "schema":"LOUKSNA_R4_MASTER_BUNDLE/1.0",
              "status":"PASS",
              "source_commit":os.environ["GITHUB_SHA"],
              "bundle_digest_sha256":digest,
              "files":rows,
          },indent=2,sort_keys=True)+"\n")
          print("MASTER_BUNDLE_DIGEST_SHA256="+digest)
          for x in rows: print(x["sha256"],x["bytes"],x["path"])
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-master-static-validation
          path: ${{ runner.temp }}/r4-master-validation
          if-no-files-found: error
          retention-days: 90

  host_preflight:
    needs: static
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: server/r4-master
          sparse-checkout-cone-mode: true

      - name: Read-only host readiness check
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(hostname)" = "LOUKSNA"
          test "$(id -un)" = "diegoignacionorambuenamiranda"

          CHECKPOINT="/home/diegoignacionorambuenamiranda/LOUKSNA_MAESTRO_20260925/MISSION3_OPERATIVE/R4_PART1_DESKTOP_V1/runs/20260926T034746Z-38579"
          UI="/home/diegoignacionorambuenamiranda/Descargas/LUNA_R4_UI_REFERENCE"
          test -d "$CHECKPOINT"
          for f in CHECKPOINT.json LAUNCHERS.json PANEL_CREATED.json RUNTIME_VERIFY.json; do test -f "$CHECKPOINT/$f"; done

          test "$(sha256sum "$UI/LUNA_R4_UI_REFERENCE_PARTS_1_9.jpg" | awk '{print $1}')" = "8a9852c4155d64fd74059c7239e67c82e16e5acd556627d70575db85078d4ed4"
          test "$(sha256sum "$UI/KDE_UI_REFERENCE_20260929T020349Z.7z" | awk '{print $1}')" = "c21e04d5447e123b59fc9b94d2e9684bc03ea164999ef6f60210e257557a16dc"

          test "$(systemctl is-active actions.runner.Plomillo-luna-linux-bridge.luna-linux.service)" = "active"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UIDN/bus"
          test "$(systemctl --user is-active symphylax-r1.service)" = "active"
          sudo -n /usr/local/sbin/louksna-apc status > "$RUNNER_TEMP/APC_STATUS.json"
          python3 - "$RUNNER_TEMP/APC_STATUS.json" <<'PY'
          import json,sys,datetime as dt
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["status"]=="ACTIVE"
          assert d["authorization_valid"] is True
          assert d["resume_mode"]=="DIFFERENTIAL"
          assert d["start_part"]=="PART_1"
          assert d["part2_gate"]=="PART1_POST_VALIDATION_PASS"
          exp=dt.datetime.fromisoformat(d["expires_at_utc"].replace("Z","+00:00"))
          assert dt.datetime.now(dt.timezone.utc) < exp
          PY

          test -f "$HOME/.local/lib/louksna/symphylax-r1/Louksna.md"
          test -f "$HOME/.local/lib/louksna/symphylax-r1/CUSTOSZ.v07.f04_b.pyz"
          test -f "$HOME/.local/lib/louksna/symphylax-r1/CUSTOSZ_RUNTIME_V1_SR_EXEC_BOUND_FME_01.b.pyz"
          test -f "$HOME/.local/lib/louksna/symphylax-r1/MetaOS.wasm"
          gh auth status >/dev/null

          echo "R4_MASTER_HOST_PREFLIGHT=PASS"
          echo "CURRENT_PART=PART_1"
          echo "MODE=DIFFERENTIAL"
          echo "SERVER_READY_REPEAT=FALSE"
