name: "CUSTOSZ Consultas Mailbox — read-only advisory"

on:
  push:
    branches:
      - main
      - staging/consultas-implementation-6m-20261002
    paths:
      - consultas/inbox/**
      - consultas/schema/**
      - consultas/registry/**
      - scripts/consultas/**
      - .github/workflows/custosz-consultas-mailbox.yml

permissions:
  contents: read

jobs:
  consultas:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Verify consultas channel
        shell: bash
        run: python3 scripts/consultas/selftest.py

      - name: Process consultas in inbox read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p consultas-output
          found=0
          while IFS= read -r -d '' src; do
            found=1
            base="$(dirname "$src")"
            id="$(basename "$base")"
            python3 scripts/consultas/compile_consulta.py "$src" --out "consultas-output/$id.envelope.json"
            python3 scripts/consultas/process_consulta.py "consultas-output/$id.envelope.json" "$src"               --custosz artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz               --out "consultas-output/$id.result.json"
          done < <(find consultas/inbox -type f -name CONSULTA_ORIGINAL.md -print0 2>/dev/null || true)
          if [ "$found" = 0 ]; then echo "NO_CONSULTAS_TO_PROCESS"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consultas-readonly-results
          path: consultas-output/
          if-no-files-found: ignore
          retention-days: 30
