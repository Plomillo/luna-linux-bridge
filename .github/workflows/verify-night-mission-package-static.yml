name: "SYMPHYLAX: validar paquete nocturno inerte F2.3"
on:
  push:
    branches:
      - staging/architecture-louksnamejorada-20260927
    paths:
      - .github/workflows/verify-night-mission-package-static.yml
      - scripts/governance/verify_night_mission_package_candidate.py
      - docs/architecture/SYMPHYLAX_R1_NIGHT_MISSION_PACKAGE_CANDIDATE.json

permissions:
  contents: read

concurrency:
  group: symphylax-f23-static-package-only
  cancel-in-progress: false

jobs:
  package-static-negative-tests:
    name: "GitHub-hosted; paquete inerte; sin host ni servidor"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout fijado
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar invariantes, DAG y denegaciones
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -I scripts/governance/verify_night_mission_package_candidate.py \
            --package docs/architecture/SYMPHYLAX_R1_NIGHT_MISSION_PACKAGE_CANDIDATE.json \
            --self-test
          echo "F23_STATIC_ONLY=PASS"
          echo "NO_SELF_HOSTED_RUNNER=TRUE; NO_AUTORIZO=TRUE; NO_G23_G24=TRUE; NO_HOST_ACTION=TRUE"
