name: "Dropbox META OS probe artifact forensic read"

on:
  push:
    branches:
      - staging/dropbox-github-cloud-partitioned-20261005
    paths:
      - .github/workflows/dropbox-metaos-probe-artifact-read.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read exact successful public probe artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11466490492"
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/metaos-read"
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            -o "$RUNNER_TEMP/metaos-read/probe.zip"
          python3 - "$RUNNER_TEMP/metaos-read/probe.zip" <<'PY'
          import json,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1])
          print("ZIP_FILES="+json.dumps(z.namelist()))
          for name in z.namelist():
              if name.endswith("json_candidates.json"):
                  rows=json.loads(z.read(name))
                  hits=[x for x in rows if (x.get("url") or {}).get("path")=="/list_shared_link_folder_entries"]
                  print("NETWORK_HIT_COUNT="+str(len(hits)))
                  for i,x in enumerate(hits):
                      print("=== NETWORK_HIT_"+str(i)+" ===")
                      print(json.dumps(x,ensure_ascii=False,sort_keys=True))
                      try:
                          data=json.loads(x.get("body") or "{}")
                          normalized={
                              "schema":"PUAC2_DROPBOX_FROZEN_PUBLIC_INVENTORY/1.0",
                              "source_run_id":37585254356,
                              "source_artifact_id":11466490492,
                              "response_sha256":x.get("sha256"),
                              "status_code":x.get("status"),
                              "content_type":x.get("content_type"),
                              "total_num_entries":data.get("total_num_entries"),
                              "has_more_entries":data.get("has_more_entries"),
                              "next_request_voucher":data.get("next_request_voucher"),
                              "folder":data.get("folder"),
                              "entries":[{
                                  "filename":e.get("filename"),
                                  "href":e.get("href"),
                                  "is_dir":bool(e.get("is_dir")),
                                  "bytes":e.get("bytes"),
                                  "file_id":e.get("file_id"),
                                  "folder_id":e.get("folder_id"),
                              } for e in (data.get("entries") or [])],
                          }
                          print("NORMALIZED_INVENTORY="+json.dumps(normalized,ensure_ascii=False,separators=(",",":"),sort_keys=True))
                      except Exception as exc:
                          print("NORMALIZED_INVENTORY_ERROR="+type(exc).__name__+":"+str(exc))
              if name.endswith("elements.json"):
                  rows=json.loads(z.read(name))
                  hits=[]
                  for x in rows:
                      href=x.get("href") or {}
                      p=href.get("path") or ""
                      if x.get("data_testid")=="sl-list-column--name" and "/8.%20META%20OS/" in p:
                          hits.append({"text":x.get("text"),"href":href})
                  uniq=[]
                  seen=set()
                  for x in hits:
                      k=json.dumps(x,sort_keys=True)
                      if k not in seen:
                          seen.add(k); uniq.append(x)
                  print("FROZEN_CHILD_COUNT="+str(len(uniq)))
                  print("FROZEN_CHILDREN="+json.dumps(uniq,ensure_ascii=False,sort_keys=True))
          PY
