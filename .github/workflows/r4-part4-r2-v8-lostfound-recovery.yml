name: "R4 PART4 R2 — V8 lost+found recovery without migration replay"

on:
  workflow_dispatch:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-r2-v8-lostfound-recovery/**

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: r4-part4-r2-v8-lostfound-recovery
  cancel-in-progress: false

env:
  FREEZE_RUN: "36619942178"
  V8_SOURCE_RUN: "36687767779"
  EXPECTED_MANIFEST_SHA: "99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e"
  EXPECTED_P3_UUID: "e084ec2a-af39-48b5-bb89-db2dc6a98332"
  EXPECTED_P5_UUID: "be769419-4a44-489e-8e5a-98b30999d859"
  EXPECTED_RECORDS: "498092"
  EXPECTED_BYTES: "200490852057"

jobs:
  source_guard:
    name: Verify recovery code and no migration replay
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Static guard
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile server/r4-master/part4_r2_verify_tree_v2.py
          python3 server/r4-master/part4_r2_verify_tree_v2.py --selftest
          grep -F 'PLAN DEFINITIVO' 'PLAN DEFINITIVO' >/dev/null
          test -f server/r4-master/part4_r2_final_merge_prepare.sh
          grep -F 'part4_r2_verify_tree_v2.py' server/r4-master/part4_r2_final_merge_prepare.sh >/dev/null
          grep -F -- '--allow-ext4-root-lost-found' server/r4-master/part4_r2_final_merge_prepare.sh >/dev/null
          echo "MIGRATION_REPLAY=FORBIDDEN"
          echo "RECOVERY_SCOPE=VERIFY_EXISTING_P3_THEN_RETIRE_P2_P4"

  live_reconcile:
    name: Reconcile existing P3 material read-only
    needs: source_guard
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            server/r4-master
            PLAN DEFINITIVO
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}
      - name: Observe live state and verify existing P3 without rewriting it
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/reconcile"; mkdir -p "$OUT"
          test "$(hostname)" = "LOUKSNA"
          test "$(id -un)" = "diegoignacionorambuenamiranda"
          test "$(sha256sum "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz"|awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
          ROOTSRC="$(readlink -f "$(findmnt -n -o SOURCE /)")"
          test "$ROOTSRC" = /dev/nvme0n1p5
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)" = "$EXPECTED_P3_UUID"
          test "$(sudo -n blkid -p -s TYPE -o value /dev/nvme0n1p3)" = ext4
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)" = "$EXPECTED_P5_UUID"
          test -b /dev/nvme0n1p2
          test -b /dev/nvme0n1p4
          mapfile -t MOUNTS < <(findmnt -rn -S /dev/nvme0n1p3 -o TARGET)
          test "${#MOUNTS[@]}" -eq 1
          P3MNT="${MOUNTS[0]}"
          test -d "$P3MNT"
          python3 server/r4-master/part4_r2_verify_tree_v2.py             --root "$P3MNT"             --manifest "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz"             --out "$OUT/VERIFY_P3_EXISTING.json"             --allow-ext4-root-lost-found
          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/PARTITION_TABLE_BEFORE_RECOVERY.sfdisk"
          lsblk -b -J -o NAME,PATH,TYPE,SIZE,FSTYPE,LABEL,UUID,PARTUUID,START,MOUNTPOINTS > "$OUT/LSBLK_BEFORE_RECOVERY.json"
          export P3MNT ROOTSRC
          python3 - "$OUT/VERIFY_P3_EXISTING.json" "$OUT/RECONCILED_STATE.json" <<'PY'
          import json,os,pathlib,sys,time
          v=json.load(open(sys.argv[1]))
          ignored=v.get("ignored_filesystem_admin_entries",[])
          checks={
            "tree_pass":v.get("status")=="PASS",
            "mismatch_zero":v.get("mismatch_count")==0,
            "records":v.get("seen_records")==498092,
            "bytes":v.get("regular_file_bytes")==200490852057,
            "lost_found_only":len(ignored)==1 and ignored[0].get("path")=="lost+found" and ignored[0].get("reason")=="EXT4_ROOT_ADMIN_DIRECTORY",
            "root_p5":os.environ["ROOTSRC"]=="/dev/nvme0n1p5",
            "p3_mounted":bool(os.environ["P3MNT"])
          }
          ok=all(checks.values())
          r={
            "schema":"LOUKSNA_R4_PART4_R2_V8_RECONCILED_EXISTING_P3/1.0",
            "status":"PASS" if ok else "HOLD",
            "checks":checks,
            "p3_mount":os.environ["P3MNT"],
            "v8_source_run":36687767779,
            "migration_replayed":False,
            "observed_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-existing-p3-reconciled
          path: ${{ runner.temp }}/reconcile/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_existing_p3:
    name: G23 independently validate existing P3 recovery
    needs: live_reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-existing-p3-reconciled
          path: ${{ runner.temp }}/r
      - name: Validate exact evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/r/VERIFY_P3_EXISTING.json" "$RUNNER_TEMP/r/RECONCILED_STATE.json" "$RUNNER_TEMP/g23/G23_EXISTING_P3.json" <<'PY'
          import hashlib,json,pathlib,sys,datetime as dt
          vp,rp,out=map(pathlib.Path,sys.argv[1:])
          v=json.loads(vp.read_text()); r=json.loads(rp.read_text())
          checks={
            "reconcile_pass":r.get("status")=="PASS",
            "tree_pass":v.get("status")=="PASS",
            "manifest":v.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
            "records":v.get("seen_records")==498092,
            "bytes":v.get("regular_file_bytes")==200490852057,
            "mismatch_zero":v.get("mismatch_count")==0,
            "migration_not_replayed":r.get("migration_replayed") is False,
            "lost_found_scoped":v.get("ignored_filesystem_admin_entries")==[{
              "path":"lost+found","reason":"EXT4_ROOT_ADMIN_DIRECTORY","same_device":True,"symlink":False
            }]
          }
          ok=all(checks.values())
          q={"schema":"LOUKSNA_R4_PART4_R2_V8_EXISTING_P3_G23/1.0","status":"PASS" if ok else "HOLD",
             "checks":checks,"verify_sha256":hashlib.sha256(vp.read_bytes()).hexdigest(),
             "reconcile_sha256":hashlib.sha256(rp.read_bytes()).hexdigest(),
             "g24_allowed":ok,"validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-existing-p3-g23
          path: ${{ runner.temp }}/g23/G23_EXISTING_P3.json
          retention-days: 90
          compression-level: 0

  g24_existing_p3:
    name: G24 certify recovered existing P3 state
    needs: g23_existing_p3
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-existing-p3-g23
          path: ${{ runner.temp }}/g23
      - name: Issue exact scope certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_EXISTING_P3.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"; AUD="louksna-r4-part4-r2-existing-p3:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN; mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24_EXISTING_P3.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p))
          aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          r={"schema":"LOUKSNA_R4_PART4_R2_V8_EXISTING_P3_G24/1.0","status":"PASS",
             "scope":"EXISTING_P3_EXT4_PROYECTOS_VERIFIED_NO_MIGRATION_REPLAY",
             "g23_sha256":os.environ["H"],"authority_authenticated":True,
             "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
             "migration_replayed":False,"canonical_mutation":False,"authority_transfer":False,
             "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-existing-p3-g24
          path: ${{ runner.temp }}/g24/G24_EXISTING_P3.json
          retention-days: 90
          compression-level: 0

  retire_and_bind:
    name: Retire only P2 P4 and bind existing P3 at PROYECTOS
    needs: g24_existing_p3
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: server/r4-master
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-existing-p3-g24
          path: ${{ runner.temp }}/g24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}
      - name: Exact-scope mutation after G24
        shell: bash
        run: |
          set -Eeuo pipefail
          CERT="$RUNNER_TEMP/g24/G24_EXISTING_P3.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$CERT")" = PASS
          OUT="$RUNNER_TEMP/retire"; mkdir -p "$OUT"
          test "$(readlink -f "$(findmnt -n -o SOURCE /)")" = /dev/nvme0n1p5
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)" = "$EXPECTED_P3_UUID"
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)" = "$EXPECTED_P5_UUID"
          test -b /dev/nvme0n1p2
          test -b /dev/nvme0n1p4
          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/CHECKPOINT_BEFORE_RETIRE.sfdisk"
          P1="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p1)"
          P3="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)"
          P5="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)"
          sudo -n parted -s /dev/nvme0n1 rm 2
          sudo -n parted -s /dev/nvme0n1 rm 4
          sudo -n partprobe /dev/nvme0n1 || true
          sudo -n partx -u /dev/nvme0n1 || true
          sudo -n udevadm settle
          if test -b /dev/nvme0n1p2; then sudo -n partx -d --nr 2 /dev/nvme0n1 || true; fi
          if test -b /dev/nvme0n1p4; then sudo -n partx -d --nr 4 /dev/nvme0n1 || true; fi
          sudo -n udevadm settle
          test ! -b /dev/nvme0n1p2
          test ! -b /dev/nvme0n1p4
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p1)" = "$P1"
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)" = "$P3"
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)" = "$P5"
          mapfile -t CURS < <(findmnt -rn -S /dev/nvme0n1p3 -o TARGET)
          test "${#CURS[@]}" -eq 1
          CUR="${CURS[0]}"
          test "$CUR" != "$HOME/PROYECTOS"
          test -d "$HOME/PROYECTOS"
          test -z "$(find "$HOME/PROYECTOS" -mindepth 1 -maxdepth 1 -print -quit)"
          sudo -n umount "$CUR"
          sudo -n mount -t ext4 /dev/nvme0n1p3 "$HOME/PROYECTOS"
          test "$(readlink -f "$(findmnt -T "$HOME/PROYECTOS" -n -o SOURCE)")" = /dev/nvme0n1p3
          python3 server/r4-master/part4_r2_verify_tree_v2.py             --root "$HOME/PROYECTOS"             --manifest "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz"             --out "$OUT/VERIFY_PROJECTS_AFTER_RETIRE.json"             --allow-ext4-root-lost-found
          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/PARTITION_TABLE_AFTER_RETIRE.sfdisk"
          lsblk -b -J -o NAME,PATH,TYPE,SIZE,FSTYPE,LABEL,UUID,PARTUUID,START,MOUNTPOINTS > "$OUT/LSBLK_AFTER_RETIRE.json"
          sha256sum "$OUT"/* | sort > "$OUT/EVIDENCE.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-retired-bound-material
          path: ${{ runner.temp }}/retire/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_retired:
    name: G23 validate exact P2 P4 retirement and P3 binding
    needs: retire_and_bind
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-material
          path: ${{ runner.temp }}/r
      - name: Validate non-regression
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/r/VERIFY_PROJECTS_AFTER_RETIRE.json" "$RUNNER_TEMP/r/PARTITION_TABLE_BEFORE_RETIRE.sfdisk" "$RUNNER_TEMP/r/PARTITION_TABLE_AFTER_RETIRE.sfdisk" "$RUNNER_TEMP/g23/G23_RETIRED_BOUND.json" <<'PY'
          import hashlib,json,pathlib,re,sys,datetime as dt
          vp,bp,ap,out=map(pathlib.Path,sys.argv[1:])
          v=json.loads(vp.read_text())
          def parts(p):
            d={}
            for line in p.read_text(errors="replace").splitlines():
              m=re.match(r"^/dev/nvme0n1p(\d+)\s*:\s*start=\s*(\d+),\s*size=\s*(\d+)",line)
              if m:d[int(m.group(1))]=(int(m.group(2)),int(m.group(3)))
            return d
          b,a=parts(bp),parts(ap)
          checks={
            "tree_pass":v.get("status")=="PASS" and v.get("mismatch_count")==0,
            "manifest":v.get("manifest_sha256")=="99346fd6032b548b8de5c6081101e7e11c726" if False else v.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
            "records":v.get("seen_records")==498092,
            "bytes":v.get("regular_file_bytes")==200490852057,
            "before_1_2_3_4_5":set(b)=={1,2,3,4,5},
            "after_1_3_5":set(a)=={1,3,5},
            "p1_preserved":a.get(1)==b.get(1),
            "p3_preserved":a.get(3)==b.get(3),
            "p5_preserved":a.get(5)==b.get(5),
            "p2_removed":2 in b and 2 not in a,
            "p4_removed":4 in b and 4 not in a,
            "lost_found_scoped":len(v.get("ignored_filesystem_admin_entries",[]))==1
          }
          ok=all(checks.values())
          q={"schema":"LOUKSNA_R4_PART4_R2_V8_RETIRED_BOUND_G23/1.0","status":"PASS" if ok else "HOLD",
             "checks":checks,"before_sha256":hashlib.sha256(bp.read_bytes()).hexdigest(),
             "after_sha256":hashlib.sha256(ap.read_bytes()).hexdigest(),
             "verify_sha256":hashlib.sha256(vp.read_bytes()).hexdigest(),
             "g24_allowed":ok,"validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-retired-bound-g23
          path: ${{ runner.temp }}/g23/G23_RETIRED_BOUND.json
          retention-days: 90
          compression-level: 0

  g24_retired:
    name: G24 certify P2 P4 retired and final merge ready
    needs: g23_retired
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-g23
          path: ${{ runner.temp }}/g23
      - name: Issue retirement certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_RETIRED_BOUND.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"; AUD="louksna-r4-part4-r2-retired-bound:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN; mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24_RETIRED_BOUND.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p))
          aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          r={"schema":"LOUKSNA_R4_PART4_R2_V8_RETIRED_BOUND_G24/1.0","status":"PASS",
             "scope":"P2_P4_RETIRED_P1_P3_P5_PRESERVED_P3_BOUND_TO_HOME_PROYECTOS",
             "g23_sha256":os.environ["H"],"authority_authenticated":True,
             "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
             "final_merge_ready":True,"canonical_mutation":False,"authority_transfer":False,
             "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-retired-bound-g24
          path: ${{ runner.temp }}/g24/G24_RETIRED_BOUND.json
          retention-days: 90
          compression-level: 0

  handoff:
    name: Persist certified recovered state and continue existing final merge
    needs: g24_retired
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-existing-p3-g24
          path: ${{ runner.temp }}/p3g24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-g24
          path: ${{ runner.temp }}/rg24
      - name: Bind state and dispatch final merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          P="$RUNNER_TEMP/p3g24/G24_EXISTING_P3.json"
          R="$RUNNER_TEMP/rg24/G24_RETIRED_BOUND.json"
