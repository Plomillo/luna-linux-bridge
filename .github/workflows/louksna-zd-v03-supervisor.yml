name: "LOUKSNA ZD V0.3 — Second-order automation supervisor"

on:
  push:
    branches:
      - governance/louksna-zd-v03-12-stage-gates-20261009
    paths:
      - .github/workflows/louksna-zd-v03-governance.yml
      - .github/workflows/louksna-zd-v03-supervisor.yml
      - scripts/missions/louksna_zd_v03_functionalizer.py
      - scripts/missions/louksna_zd_candidate_materializer.py
      - scripts/missions/louksna_zd_v03_playwright_ui_e2e.mjs
      - scripts/missions/repo_forensic_census.py
      - scripts/missions/debian13_package_smoke.sh
      - governance/zona-directiva-v03/12_STAGE_GOVERNANCE_CONTRACT.md
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: louksna-zd-v03-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    name: "Observe telemetry, preserve evidence, retry only recoverable CP-08 failures"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect governance runs and apply bounded recovery policy
        id: supervise
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: governance/louksna-zd-v03-12-stage-gates-20261009
          WORKFLOW_FILE: louksna-zd-v03-governance.yml
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/zona-directiva-v03
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.error, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          branch = os.environ["TARGET_BRANCH"]
          workflow = os.environ["WORKFLOW_FILE"]
          api = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "louksna-zd-v03-supervisor",
          }
          def request(url, method="GET", payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=20) as response:
                  raw = response.read()
                  return response.status, json.loads(raw) if raw else {}
          now = datetime.datetime.now(datetime.timezone.utc)
          result = {
              "schema": "louksna.zd.v03.supervisor.v1",
              "mission_id": "MIS-LOUKSNA-ZD-V03-FUNCTIONAL-20261006",
              "timestamp_utc": now.isoformat(),
              "repository": repo,
              "supervisor_run_id": os.environ.get("GITHUB_RUN_ID"),
              "supervisor_commit": os.environ.get("GITHUB_SHA"),
              "target_branch": branch,
              "workflow_file": workflow,
              "observation": "STARTED",
              "retry_policy": "CP-08 failure only; at most one automatic retry per workflow run; never retry CP-07 voice HOLD, CP-09 host absence, CP-11 independent-validation HOLD, or CP-12 certification HOLD",
              "actions": [],
              "findings": [],
          }
          try:
              _, data = request(f"{api}/repos/{repo}/actions/workflows/{workflow}/runs?branch={branch}&per_page=20")
              runs = data.get("workflow_runs", [])
              result["observed_runs"] = len(runs)
              result["runs"] = [{
                  "id": r.get("id"),
                  "run_number": r.get("run_number"),
                  "status": r.get("status"),
                  "conclusion": r.get("conclusion"),
                  "run_attempt": r.get("run_attempt"),
                  "head_sha": r.get("head_sha"),
                  "html_url": r.get("html_url"),
                  "created_at": r.get("created_at"),
                  "updated_at": r.get("updated_at"),
              } for r in runs[:10]]
              candidates = [r for r in runs if r.get("status") == "completed"
                            and r.get("conclusion") == "failure"
                            and int(r.get("run_attempt") or 1) < 2]
              for run in candidates:
                  _, jobs_data = request(f"{api}/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
                  jobs = jobs_data.get("jobs", [])
                  cp08 = [j for j in jobs if "CP-08" in j.get("name", "") or "Stage 08" in j.get("name", "")]
                  failed_cp08 = [j for j in cp08 if j.get("conclusion") == "failure"]
                  if not failed_cp08:
                      result["actions"].append({
                          "run_id": run["id"], "decision": "NO_RETRY",
                          "reason": "Failure is not an eligible CP-08 recoverable build/install failure."
                      })
                      continue
                  status, _ = request(f"{api}/repos/{repo}/actions/runs/{run['id']}/rerun-failed-jobs",
                                      method="POST", payload={})
                  result["actions"].append({
                      "run_id": run["id"], "decision": "RERUN_FAILED_JOBS",
                      "http_status": status, "attempt_before": run.get("run_attempt"),
                      "failed_jobs": [{"name": j.get("name"), "id": j.get("id")} for j in failed_cp08]
                  })
              if not runs:
                  result["observation"] = "NO_GOVERNANCE_RUNS_FOUND"
                  result["findings"].append({
                      "severity": "BLOCKER",
                      "id": "NO_GOVERNANCE_RUNS",
                      "detail": "Supervisor is alive but cannot certify that the governance pipeline is running."
                  })
              else:
                  # Monitor an active run before a newer queued run so artifact absence
                  # is not misclassified as a missing-evidence failure during execution.
                  latest = next((r for r in runs if r.get("status") == "in_progress"), runs[0])
                  result["monitoring_selection"] = "PREFER_IN_PROGRESS_THEN_NEWEST"
                  result["latest_governance_run"] = {
                      "id": latest.get("id"),
                      "status": latest.get("status"),
                      "conclusion": latest.get("conclusion"),
                      "head_sha": latest.get("head_sha"),
                      "created_at": latest.get("created_at"),
                      "html_url": latest.get("html_url"),
                  }
                  # Second-order monitor: inspect real job states and same-run artifacts, not only the workflow conclusion.
              try:
                  _, job_data = request(f"{api}/repos/{repo}/actions/runs/{latest['id']}/jobs?per_page=100")
                  _, artifact_data = request(f"{api}/repos/{repo}/actions/runs/{latest['id']}/artifacts?per_page=100")
                  observed_jobs = job_data.get("jobs", [])
                  observed_artifacts = [a for a in artifact_data.get("artifacts", []) if not a.get("expired")]
                  expected_artifacts = [
                      "louksna-zd-v03-cp01-repository-audit",
                      "louksna-zd-v03-cp02-contract-linkage",
                      "louksna-zd-v03-cp03-backend-ledger",
                      "louksna-zd-v03-cp04-github-bridge",
                      "louksna-zd-v03-cp05-ui-telemetry",
                      "louksna-zd-v03-cp06-functions-attachments",
                      "louksna-zd-v03-cp07-voice-gate-open",
                      "louksna-zd-v03-cp07-playwright-ui-e2e",
                      "louksna-zd-v03-cp08-build-package",
                      "louksna-zd-v03-cp09-debian13-container-smoke",
                  ]
                  artifact_names = [a.get("name", "") for a in observed_artifacts]
                  counts = {name: artifact_names.count(name) for name in set(artifact_names)}
                  duplicate_names = sorted(name for name, count in counts.items() if count > 1)
                  missing_artifacts = [name for name in expected_artifacts if name not in artifact_names]
                  gate_rows = []
                  for job in observed_jobs:
                      name = job.get("name", "")
                      import re
                      match = re.search(r"CP-(\d\d)", name)
                      if match:
                          gate_rows.append({
                              "checkpoint": "CP-" + match.group(1),
                              "job_name": name,
                              "status": job.get("status"),
                              "conclusion": job.get("conclusion"),
                              "job_id": job.get("id"),
                              "html_url": job.get("html_url"),
                          })
                  same_sha_runs = [
                      {"id": r.get("id"), "status": r.get("status"), "conclusion": r.get("conclusion"), "html_url": r.get("html_url")}
                      for r in runs if r.get("head_sha") == latest.get("head_sha")
                  ]
                  result["monitoring"] = {
                      "target_run_id": latest.get("id"),
                      "target_run_url": latest.get("html_url"),
                      "candidate_sha": latest.get("head_sha"),
                      "jobs": gate_rows,
                      "active_artifacts": [{"name": a.get("name"), "size_in_bytes": a.get("size_in_bytes"), "expired": a.get("expired")} for a in observed_artifacts],
                      "missing_expected_artifacts": missing_artifacts,
                      "duplicate_artifact_names": duplicate_names,
                      "runs_for_same_sha": same_sha_runs,
                      "anti_duplication": "PASS" if not duplicate_names else "HOLD_DUPLICATE_ARTIFACT_NAMES",
                      "evidence_completeness": "INCOMPLETE" if missing_artifacts else "EXPECTED_ARTIFACTS_PRESENT",
                      "certification_inferred": False,
                  }
                  if duplicate_names:
                      result["findings"].append({
                          "severity": "BLOCKER", "id": "DUPLICATE_EVIDENCE_ARTIFACT_NAMES",
                          "detail": "Duplicate artifact names detected within the observed run: " + ", ".join(duplicate_names)
                      })
                  if missing_artifacts:
                      result["findings"].append({
                          "severity": "INFO" if latest.get("status") != "completed" else "WARNING",
                          "id": "EXPECTED_EVIDENCE_ARTIFACTS_NOT_YET_PRESENT",
                          "detail": "Missing same-run artifacts (may indicate stages not reached or evidence not uploaded): " + ", ".join(missing_artifacts)
                      })
                  failed_jobs = [j for j in observed_jobs if j.get("conclusion") == "failure"]
                  if failed_jobs:
                      result["findings"].append({
                          "severity": "BLOCKER", "id": "FAILED_CHECKPOINT_JOBS",
                          "detail": "; ".join(j.get("name", "unknown") + " [" + str(j.get("id")) + "]" for j in failed_jobs)
                      })
              except Exception as inspect_exc:
                  result["monitoring"] = {"status": "MONITOR_QUERY_FAILED", "error": type(inspect_exc).__name__ + ": " + str(inspect_exc)[:400]}
                  result["findings"].append({
                      "severity": "BLOCKER", "id": "CHECKPOINT_TELEMETRY_QUERY_FAILED",
                      "detail": "Could not inspect latest-run jobs/artifacts: " + type(inspect_exc).__name__ + ": " + str(inspect_exc)[:400]
                  })
              if latest.get("status") != "completed":
                  result["observation"] = "IN_PROGRESS"
                  result["findings"].append({
                      "severity": "INFO",
                      "id": "LATEST_GOVERNANCE_RUN_IN_PROGRESS",
                      "detail": "Latest governance run has not completed; no PASS or certification is inferred."
                  })
              elif latest.get("conclusion") != "success":
                  result["observation"] = "FAIL"
                  result["findings"].append({
                      "severity": "BLOCKER",
                      "id": "LATEST_GOVERNANCE_RUN_NOT_SUCCESSFUL",
                      "detail": "Latest governance run concluded " + str(latest.get("conclusion")) + "; older successful runs cannot override it."
                  })
              else:
                  result["observation"] = "PASS_WITH_OPEN_GATES"
                  result["findings"].append({
                      "severity": "WARNING",
                      "id": "GOVERNANCE_SUCCESS_IS_NOT_CERTIFICATION",
                      "detail": "Workflow success proves only that configured jobs completed; CP-07 HOLD, CP-09 host evidence, CP-11 G23, and CP-12 G24 must be checked independently."
                  })
          except Exception as exc:
              result["observation"] = "ERROR"
              result["findings"].append({
                  "severity": "BLOCKER",
                  "id": "SUPERVISOR_API_OR_PERMISSION_FAILURE",
                  "detail": type(exc).__name__ + ": " + str(exc)[:500]
              })
          result["evidence_sha256"] = hashlib.sha256(
              json.dumps(result, sort_keys=True, separators=(",", ":")).encode()
          ).hexdigest()
          path = pathlib.Path("evidence/zona-directiva-v03/supervisor-telemetry.json")
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print(json.dumps(result, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("status=" + result["observation"] + "\n")
          if result["observation"] == "ERROR":
              raise SystemExit(1)
          PY
      - name: Preserve supervisor telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-zd-v03-supervisor-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/zona-directiva-v03/supervisor-telemetry.json
          if-no-files-found: error
          retention-days: 90
