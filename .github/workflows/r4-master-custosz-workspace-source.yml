name: "R4 master — inspect CUSTOSZ workspace resolver"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-master-custosz-workspace-source.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz
          sparse-checkout-cone-mode: false
      - shell: bash
        run: |
          python3 -B -I - <<'PY'
          import sys,inspect
          sys.path.insert(0,"artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz")
          import custosz_v05_legacy as w
          for name in ("workspace","discover","is_ws","sources"):
              print("\n===== "+name+" =====")
              print(inspect.getsource(getattr(w,name)))
          PY
