name: "R4 PART4 R2 — certify evidence-contract bug and resume post-retire"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - ".github/workflows/r4-part4-r2-postretire-evidence-bug-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r4-part4-r2-postretire-evidence-bug-recovery
  cancel-in-progress: false

env:
  SOURCE_RUN: "36829706689"
  SOURCE_JOB: "110267836934"
  SOURCE_HEAD: "d4f590f969cded95897cd9e00cc21deeb45d8f28"
  SOURCE_ARTIFACT_ID: "11147345475"
  SOURCE_ARTIFACT_DIGEST: "sha256:8be0e2bd80fa30c1953f91c35c7792de79e17c044a587f3f1c56a8c75d737ae4"
  EXPECTED_MANIFEST_SHA: "99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e"
  EXPECTED_P3_UUID: "e084ec2a-af39-48b5-bb89-db2dc6a98332"
  EXPECTED_P5_UUID: "be769419-4a44-489e-8e5a-98b30999d859"
  EXPECTED_RECORDS: "498092"
  EXPECTED_BYTES: "200490852057"

jobs:
  audit_bug:
    name: "Audit exact evidence-contract filename mismatch"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-material
          path: ${{ runner.temp }}/material
          github-token: ${{ github.token }}
          repository: Plomillo/luna-linux-bridge
          run-id: ${{ env.SOURCE_RUN }}
      - name: Prove bug from immutable source run + producer artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/bug"
          git show "$SOURCE_HEAD:.github/workflows/r4-part4-r2-v8-lostfound-recovery.yml" > "$RUNNER_TEMP/bug/ORIGINAL_WORKFLOW.yml"
          python3 - "$RUNNER_TEMP/material" "$RUNNER_TEMP/bug/ORIGINAL_WORKFLOW.yml" "$RUNNER_TEMP/bug/BUG_AUDIT.json" <<'PY'
          import hashlib,json,os,pathlib,sys,datetime as dt
          material,oldwf,out=map(pathlib.Path,sys.argv[1:])
          names=sorted(p.name for p in material.iterdir() if p.is_file())
          source=oldwf.read_text(encoding="utf-8")
          verify=json.loads((material/"VERIFY_PROJECTS_AFTER_RETIRE.json").read_text())
          checks={
            "producer_checkpoint_present": "CHECKPOINT_BEFORE_RETIRE.sfdisk" in names,
            "consumer_requested_nonexistent_name": "PARTITION_TABLE_BEFORE_RETIRE.sfdisk" not in names,
            "producer_source_declares_checkpoint": '$OUT/CHECKPOINT_BEFORE_RETIRE.sfdisk' in source,
            "consumer_source_requests_wrong_name": '$RUNNER_TEMP/r/PARTITION_TABLE_BEFORE_RETIRE.sfdisk' in source,
            "after_table_present": "PARTITION_TABLE_AFTER_RETIRE.sfdisk" in names,
            "post_retire_tree_pass": verify.get("status")=="PASS" and verify.get("mismatch_count")==0,
            "records_preserved": verify.get("seen_records")==498092,
            "bytes_preserved": verify.get("regular_file_bytes")==200490852057,
            "manifest_preserved": verify.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e"
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_R2_EVIDENCE_CONTRACT_BUG_AUDIT/1.0",
            "status":"PASS" if ok else "HOLD",
            "classification":"EVIDENCE_CONTRACT_FILENAME_MISMATCH",
            "source_run":36829706689,
            "source_job":110267836934,
            "source_head":"d4f590f969cded95897cd9e00cc21deeb45d8f28",
            "source_artifact_id":11147345475,
            "source_artifact_digest":"sha256:8be0e2bd80fa30c1953f91c35c7792de79e17c044a587f3f1c56a8c75d737ae4",
            "producer_filename":"CHECKPOINT_BEFORE_RETIRE.sfdisk",
            "buggy_consumer_filename":"PARTITION_TABLE_BEFORE_RETIRE.sfdisk",
            "checks":checks,
            "material_replay_required":False,
            "partition_replay_required":False,
            "data_copy_replay_required":False,
            "minimum_corrective_delta":"G23 consumes CHECKPOINT_BEFORE_RETIRE.sfdisk",
            "audited_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
            "original_workflow_sha256":hashlib.sha256(oldwf.read_bytes()).hexdigest(),
            "verify_sha256":hashlib.sha256((material/"VERIFY_PROJECTS_AFTER_RETIRE.json").read_bytes()).hexdigest()
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(41)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-evidence-contract-bug-audit
          path: ${{ runner.temp }}/bug/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_bug:
    name: "G23 independently validate bug diagnosis"
    needs: audit_bug
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-evidence-contract-bug-audit
          path: ${{ runner.temp }}/bug
      - name: G23 exact diagnosis validation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23bug"
          python3 - "$RUNNER_TEMP/bug/BUG_AUDIT.json" "$RUNNER_TEMP/g23bug/G23_BUG.json" <<'PY'
          import hashlib,json,pathlib,sys,datetime as dt
          inp,out=map(pathlib.Path,sys.argv[1:])
          d=json.loads(inp.read_text())
          checks={
            "audit_pass":d.get("status")=="PASS",
            "classification_exact":d.get("classification")=="EVIDENCE_CONTRACT_FILENAME_MISMATCH",
            "producer_exact":d.get("producer_filename")=="CHECKPOINT_BEFORE_RETIRE.sfdisk",
            "consumer_exact":d.get("buggy_consumer_filename")=="PARTITION_TABLE_BEFORE_RETIRE.sfdisk",
            "no_material_replay":d.get("material_replay_required") is False,
            "no_partition_replay":d.get("partition_replay_required") is False,
            "no_data_copy_replay":d.get("data_copy_replay_required") is False,
            "minimum_delta_exact":d.get("minimum_corrective_delta")=="G23 consumes CHECKPOINT_BEFORE_RETIRE.sfdisk"
          }
          ok=all(checks.values())
          q={"schema":"LOUKSNA_R4_PART4_R2_EVIDENCE_CONTRACT_BUG_G23/1.0",
             "status":"PASS" if ok else "HOLD","checks":checks,
             "bug_audit_sha256":hashlib.sha256(inp.read_bytes()).hexdigest(),
             "correction_allowed":ok,"validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-evidence-contract-bug-g23
          path: ${{ runner.temp }}/g23bug/G23_BUG.json
          retention-days: 90
          compression-level: 0

  g24_bug:
    name: "G24 certify exact bug and minimum corrective delta"
    needs: g23_bug
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-evidence-contract-bug-g23
          path: ${{ runner.temp }}/g23bug
      - name: G24 bug certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23bug/G23_BUG.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"
          AUD="louksna-r4-part4-r2-evidence-contract-bug:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24bug"
          python3 - "$RUNNER_TEMP/g24bug/G24_BUG.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p))
          aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={"schema":"LOUKSNA_R4_PART4_R2_EVIDENCE_CONTRACT_BUG_G24/1.0","status":"PASS",
             "certified_scope":"BUG_DIAGNOSIS_AND_MINIMUM_EVIDENCE_PATH_CORRECTION_ONLY",
             "classification":"EVIDENCE_CONTRACT_FILENAME_MISMATCH",
             "g23_sha256":os.environ["H"],"authority_authenticated":True,
             "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
             "material_replay_forbidden":True,"partition_replay_forbidden":True,
             "data_copy_replay_forbidden":True,
             "authorized_corrective_delta":"G23 consumes CHECKPOINT_BEFORE_RETIRE.sfdisk",
             "canonical_mutation":False,"authority_transfer":False,
             "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-evidence-contract-bug-g24
          path: ${{ runner.temp }}/g24bug/G24_BUG.json
          retention-days: 90
          compression-level: 0

  g23_postretire:
    name: "G23 validate already-produced post-retire evidence with corrected contract"
    needs: g24_bug
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-material
          path: ${{ runner.temp }}/r
          github-token: ${{ github.token }}
          repository: Plomillo/luna-linux-bridge
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-evidence-contract-bug-g24
          path: ${{ runner.temp }}/bug-g24
      - name: Validate existing material evidence without replay
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/bug-g24/G24_BUG.json")" = PASS
          python3 - "$RUNNER_TEMP/r/VERIFY_PROJECTS_AFTER_RETIRE.json" "$RUNNER_TEMP/r/CHECKPOINT_BEFORE_RETIRE.sfdisk" "$RUNNER_TEMP/r/PARTITION_TABLE_AFTER_RETIRE.sfdisk" "$RUNNER_TEMP/g23/G23_RETIRED_BOUND_RECOVERED.json" <<'PY'
          import hashlib,json,pathlib,re,sys,datetime as dt
          vp,bp,ap,out=map(pathlib.Path,sys.argv[1:])
          v=json.loads(vp.read_text())
          def parts(p):
              d={}
              for line in p.read_text(errors="replace").splitlines():
                  m=re.match(r"^/dev/nvme0n1p(\d+)\s*:\s*start=\s*(\d+),\s*size=\s*(\d+)",line)
                  if m:d[int(m.group(1))]=(int(m.group(2)),int(m.group(3)))
              return d
          b,a=parts(bp),parts(ap)
          checks={
            "tree_pass":v.get("status")=="PASS" and v.get("mismatch_count")==0,
            "manifest":v.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
            "records":v.get("seen_records")==498092,
            "bytes":v.get("regular_file_bytes")==200490852057,
            "before_1_2_3_4_5":set(b)=={1,2,3,4,5},
            "after_1_3_5":set(a)=={1,3,5},
            "p1_preserved":a.get(1)==b.get(1),
            "p3_preserved":a.get(3)==b.get(3),
            "p5_preserved":a.get(5)==b.get(5),
            "p2_removed":2 in b and 2 not in a,
            "p4_removed":4 in b and 4 not in a,
            "lost_found_scoped":len(v.get("ignored_filesystem_admin_entries",[]))==1
          }
          ok=all(checks.values())
          q={"schema":"LOUKSNA_R4_PART4_R2_V8_RETIRED_BOUND_G23_RECOVERY/1.0","status":"PASS" if ok else "HOLD",
             "checks":checks,"source_run":36829706689,"source_artifact_id":11147345475,
             "evidence_contract_bug_g24":"PASS",
             "before_sha256":hashlib.sha256(bp.read_bytes()).hexdigest(),
             "after_sha256":hashlib.sha256(ap.read_bytes()).hexdigest(),
             "verify_sha256":hashlib.sha256(vp.read_bytes()).hexdigest(),
             "material_replayed":False,"g24_allowed":ok,
             "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-retired-bound-g23-recovered
          path: ${{ runner.temp }}/g23/G23_RETIRED_BOUND_RECOVERED.json
          retention-days: 90
          compression-level: 0

  g24_postretire:
    name: "G24 certify already-achieved P2/P4 retirement and P3 binding"
    needs: g23_postretire
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-g23-recovered
          path: ${{ runner.temp }}/g23
      - name: Issue exact recovered state certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_RETIRED_BOUND_RECOVERED.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"
          AUD="louksna-r4-part4-r2-retired-bound-recovered:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24_RETIRED_BOUND_RECOVERED.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p))
          aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={"schema":"LOUKSNA_R4_PART4_R2_V8_RETIRED_BOUND_G24_RECOVERY/1.0","status":"PASS",
             "scope":"P2_P4_RETIRED_P1_P3_P5_PRESERVED_P3_BOUND_TO_HOME_PROYECTOS",
             "g23_sha256":os.environ["H"],"authority_authenticated":True,
             "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
             "source_run":36829706689,"source_artifact_id":11147345475,
             "final_merge_ready":True,"material_replayed":False,
             "canonical_mutation":False,"authority_transfer":False,
             "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-retired-bound-g24-recovered
          path: ${{ runner.temp }}/g24/G24_RETIRED_BOUND_RECOVERED.json
          retention-days: 90
          compression-level: 0

  handoff:
    name: "Bind certified recovered state without repeating material work"
    needs: g24_postretire
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-existing-p3-g24
          path: ${{ runner.temp }}/p3g24
          github-token: ${{ github.token }}
          repository: Plomillo/luna-linux-bridge
          run-id: ${{ env.SOURCE_RUN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retired-bound-g24-recovered
          path: ${{ runner.temp }}/rg24
      - name: Re-observe physical state, bind certificate, no disk mutation
        shell: bash
        run: |
          set -Eeuo pipefail
          P="$RUNNER_TEMP/p3g24/G24_EXISTING_P3.json"
          R="$RUNNER_TEMP/rg24/G24_RETIRED_BOUND_RECOVERED.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$P")" = PASS
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$R")" = PASS
          test ! -b /dev/nvme0n1p2
          test ! -b /dev/nvme0n1p4
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)" = "$EXPECTED_P3_UUID"
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)" = "$EXPECTED_P5_UUID"
          test "$(readlink -f "$(findmnt -n -o SOURCE /)")" = /dev/nvme0n1p5
          test "$(readlink -f "$(findmnt -T "$HOME/PROYECTOS" -n -o SOURCE)")" = /dev/nvme0n1p3
          STATE="$HOME/.local/state/louksna/r4-master-part1-part9/PART_4_R2/STATE.json"
          test -f "$STATE"
          mkdir -p "$RUNNER_TEMP/handoff"
          cp "$STATE" "$RUNNER_TEMP/handoff/STATE_BEFORE.json"
          python3 - "$STATE" "$P" "$R" <<'PY'
          import hashlib,json,os,pathlib,sys,time
          sp,pp,rp=map(pathlib.Path,sys.argv[1:])
          d=json.loads(sp.read_text())
          d.update({
            "storage_migration_g24":True,
            "storage_migration_g24_sha256":hashlib.sha256(pp.read_bytes()).hexdigest(),
            "projects_migrated_hash_equivalent":True,
            "ntfs_retired":True,
            "p2_p4_retirement_g24":True,
            "p2_p4_retirement_g24_sha256":hashlib.sha256(rp.read_bytes()).hexdigest(),
            "evidence_contract_bug_certified":True,
            "evidence_contract_bug_class":"EVIDENCE_CONTRACT_FILENAME_MISMATCH",
            "lost_found_exception_certified":True,
            "migration_replayed":False,
            "final_linux_layout":False,
            "final_merge_g24":False,
            "part4_r2_final_g24":False,
            "verified_root_on_consolidated_linux":False,
            "updated_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          })
          tmp=sp.with_suffix(".tmp"); tmp.write_text(json.dumps(d,indent=2,sort_keys=True)+"\n"); os.replace(tmp,sp)
          PY
          cp "$STATE" "$RUNNER_TEMP/handoff/STATE_AFTER.json"
          sha256sum "$RUNNER_TEMP/handoff/STATE_BEFORE.json" "$RUNNER_TEMP/handoff/STATE_AFTER.json" > "$RUNNER_TEMP/handoff/STATE_HASHES.txt"
          printf '%s\n' "MATERIAL_REPLAY=FALSE" "P2_P4_ALREADY_RETIRED=TRUE" "P3_BOUND_TO_PROYECTOS=TRUE" "NEXT=FINAL_MERGE" > "$RUNNER_TEMP/handoff/HANDOFF.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-postretire-recovery-handoff
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
