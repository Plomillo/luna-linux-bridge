name: LOUKSNAPG — full-rank Whisper Q4/Q5 repair experiment

on:
  push:
    branches:
      - louksnapg2/puac2-alternative-20261029
    paths:
      - tools/louksnapg_whisper_fullrank_quantization.py
      - .github/workflows/louksnapg-whisper-fullrank-quantization.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louksnapg-whisper-fullrank-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OMP_THREAD_LIMIT: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONNOUSERSITE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ENABLE_HF_TRANSFER: "0"

jobs:
  repair:
    name: Build full-rank Q4_0/Q5_0 candidates under 3 GiB
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ubuntu:24.04
      options: --memory=3g --memory-swap=3g --cpus=1
    steps:
      - name: Install Git and native build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git cmake build-essential python3-dev pkg-config libgomp1
          update-ca-certificates

      - name: Checkout additive experiment and test fixture helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            tools/louksnapg_whisper_fullrank_quantization.py
            tools/louksnapg_whisper_int8_repair.py

      - name: Set up pinned Python toolchain
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Verify exact 3-GiB RAM, zero swap and one-core cgroup
        shell: bash
        run: |
          set -Eeuo pipefail
          memory="$(cat /sys/fs/cgroup/memory.max)"
          swap="$(cat /sys/fs/cgroup/memory.swap.max)"
          read -r quota period < /sys/fs/cgroup/cpu.max
          expected=$((3 * 1024 * 1024 * 1024))
          [[ "$memory" == "$expected" ]] || { echo "REPAIR_MEMORY_CGROUP_MISMATCH:$memory:$expected" >&2; exit 1; }
          [[ "$swap" == "0" ]] || { echo "REPAIR_SWAP_NOT_DISABLED:$swap" >&2; exit 1; }
          [[ "$quota" =~ ^[0-9]+$ && "$period" =~ ^[0-9]+$ && "$quota" -eq "$period" ]] || { echo "REPAIR_CPU_CGROUP_MISMATCH:$quota:$period" >&2; exit 1; }
          printf '{"status":"PASS","memory_limit_bytes":%s,"swap_limit_bytes":%s,"cpu_quota":%s,"cpu_period":%s}\n' "$memory" "$swap" "$quota" "$period"

      - name: Clone exact upstream converter and Whisper asset revisions
        shell: bash
        env:
          WHISPER_CPP_REVISION: 482279b8a18855ba741d7b88c30fcb3874691f59
          OPENAI_WHISPER_REVISION: 86098128c0b4f24f0e2aa2994de830614b474227
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/upstream"
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/upstream/whisper.cpp"
          git -C "$RUNNER_TEMP/upstream/whisper.cpp" fetch --depth=1 origin "$WHISPER_CPP_REVISION"
          git -C "$RUNNER_TEMP/upstream/whisper.cpp" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream/whisper.cpp" rev-parse HEAD)" = "$WHISPER_CPP_REVISION"
          git clone --filter=blob:none --no-checkout https://github.com/openai/whisper.git "$RUNNER_TEMP/upstream/openai-whisper"
          git -C "$RUNNER_TEMP/upstream/openai-whisper" fetch --depth=1 origin "$OPENAI_WHISPER_REVISION"
          git -C "$RUNNER_TEMP/upstream/openai-whisper" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/upstream/openai-whisper" rev-parse HEAD)" = "$OPENAI_WHISPER_REVISION"
          test -s "$RUNNER_TEMP/upstream/openai-whisper/whisper/assets/mel_filters.npz"

      - name: Install pinned single-threaded CPU conversion dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir "transformers==4.55.4" "huggingface_hub==0.35.3" "safetensors==0.6.2" "accelerate==1.10.1" "sentencepiece==0.2.1" "numpy==2.2.6"

      - name: Build pinned CPU inference and full-rank quantizer binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake -S "$RUNNER_TEMP/upstream/whisper.cpp" -B "$RUNNER_TEMP/upstream/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON -DWHISPER_BUILD_SERVER=OFF -DGGML_CUDA=OFF -DGGML_OPENCL=OFF
          cmake --build "$RUNNER_TEMP/upstream/whisper.cpp/build" --config Release --parallel 1 --target whisper-cli whisper-quantize
          test -x "$RUNNER_TEMP/upstream/whisper.cpp/build/bin/whisper-cli"
          test -x "$RUNNER_TEMP/upstream/whisper.cpp/build/bin/whisper-quantize"

      - name: Build full-rank block-quantized overlays from immutable teacher weights
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/whisper-fullrank/hf-home
          HF_HUB_CACHE: ${{ runner.temp }}/whisper-fullrank/hf-cache
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/whisper-fullrank/evidence" "$RUNNER_TEMP/whisper-fullrank/work"
          export HF_HUB_OFFLINE=0 TRANSFORMERS_OFFLINE=0
          python -B tools/louksnapg_whisper_fullrank_quantization.py build --whisper-cpp-root "$RUNNER_TEMP/upstream/whisper.cpp" --openai-whisper-root "$RUNNER_TEMP/upstream/openai-whisper" --output-dir "$RUNNER_TEMP/whisper-fullrank/work" --report "$RUNNER_TEMP/whisper-fullrank/evidence/WHISPER_FULLRANK_BUILD.json" 2>&1 | tee "$RUNNER_TEMP/whisper-fullrank/evidence/build.log"

      - name: Upload isolated full-rank model candidates and pinned toolchain
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-whisper-fullrank-${{ github.run_id }}
          path: ${{ runner.temp }}/whisper-fullrank/work/artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload 3-GiB repair evidence even when rejected
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-whisper-fullrank-build-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/whisper-fullrank/evidence/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0

  evaluate:
    name: Evaluate ${{ matrix.quantization }} under 1 GiB and one CPU
    needs: repair
    if: needs.repair.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        quantization: [q4_0, q5_0]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
      options: --memory=1g --memory-swap=1g --cpus=1
    steps:
      - name: Install Git, audio fixture generator and CPU shared libraries
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git espeak-ng libgomp1
          update-ca-certificates

      - name: Checkout additive evaluator and pinned fixture helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
          sparse-checkout: |
            tools/louksnapg_whisper_fullrank_quantization.py
            tools/louksnapg_whisper_int8_repair.py

      - name: Set up pinned Python evaluator
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Verify exact 1-GiB RAM, zero swap and one-core cgroup
        shell: bash
        run: |
          set -Eeuo pipefail
          memory="$(cat /sys/fs/cgroup/memory.max)"
          swap="$(cat /sys/fs/cgroup/memory.swap.max)"
          read -r quota period < /sys/fs/cgroup/cpu.max
          expected=$((1 * 1024 * 1024 * 1024))
          [[ "$memory" == "$expected" ]] || { echo "CANDIDATE_MEMORY_CGROUP_MISMATCH:$memory:$expected" >&2; exit 1; }
          [[ "$swap" == "0" ]] || { echo "CANDIDATE_SWAP_NOT_DISABLED:$swap" >&2; exit 1; }
          [[ "$quota" =~ ^[0-9]+$ && "$period" =~ ^[0-9]+$ && "$quota" -eq "$period" ]] || { echo "CANDIDATE_CPU_CGROUP_MISMATCH:$quota:$period" >&2; exit 1; }
          printf '{"status":"PASS","memory_limit_bytes":%s,"swap_limit_bytes":%s,"cpu_quota":%s,"cpu_period":%s}\n' "$memory" "$swap" "$quota" "$period"

      - name: Install pinned CPU audio evaluation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "huggingface_hub==0.35.3" "datasets==3.2.0" "pyarrow==19.0.1" "soundfile==0.13.1" "numpy==2.2.6"

      - name: Download immutable full-rank candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: louksnapg-whisper-fullrank-${{ github.run_id }}
          path: ${{ runner.temp }}/whisper-fullrank/artifact

      - name: Evaluate exact candidate on synthetic and pinned real speech
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/whisper-fullrank-evaluation/hf-home
          HF_HUB_CACHE: ${{ runner.temp }}/whisper-fullrank-evaluation/hf-cache
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/whisper-fullrank-evaluation/evidence" "$RUNNER_TEMP/whisper-fullrank-evaluation/work"
          python -B tools/louksnapg_whisper_fullrank_quantization.py evaluate --artifact-root "$RUNNER_TEMP/whisper-fullrank/artifact" --quantization "${{ matrix.quantization }}" --fixture-helper "$GITHUB_WORKSPACE/tools/louksnapg_whisper_int8_repair.py" --work-dir "$RUNNER_TEMP/whisper-fullrank-evaluation/work" --report "$RUNNER_TEMP/whisper-fullrank-evaluation/evidence/${{ matrix.quantization }}-evaluation.json" 2>&1 | tee "$RUNNER_TEMP/whisper-fullrank-evaluation/evidence/${{ matrix.quantization }}-evaluation.log"

      - name: Upload evaluation evidence even when quality fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-whisper-fullrank-${{ matrix.quantization }}-evaluation-${{ github.run_id }}
          path: ${{ runner.temp }}/whisper-fullrank-evaluation/evidence/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
