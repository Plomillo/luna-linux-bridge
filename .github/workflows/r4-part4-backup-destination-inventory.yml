name: "R4 PART4 — local backup destination inventory"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-part4-backup-destination-inventory.yml
      - mission-control/r4-part4-backup-destination-inventory/**

permissions:
  contents: read

jobs:
  inventory:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Inventory local block devices and free space read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/r4-part4-backup-destination-inventory-$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "=== LSBLK ==="
            lsblk -b -J -o NAME,PATH,TYPE,SIZE,FSTYPE,FSVER,FSAVAIL,FSUSE%,MOUNTPOINTS,UUID,PARTUUID,MODEL,SERIAL,TRAN,RO
            echo "=== DF ==="
            df -B1 -T
            echo "=== FINDMNT ==="
            findmnt -J
          } | tee "$OUT/INVENTORY.txt"
          sha256sum "$OUT/INVENTORY.txt" > "$OUT/SHA256SUMS.txt"

      - name: Preserve inventory evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R4-PART4-backup-destination-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-part4-backup-destination-inventory-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30
