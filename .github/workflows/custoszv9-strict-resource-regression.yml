name: "CUSTOSZV9 strict resource and global ledger regression"

on:
  push:
    branches:
      - "feature/formal-assurance-custosz9fix-*"
    paths:
      - "custoszv9/crfu/**"
      - "tests/test_custoszv9.py"
      - "tests/test_louksna_global_gate_ledger.py"
      - "scripts/louksna_global_*.py"
      - "scripts/louksna_global_*.json"
      - "scripts/check_crfu_source_contracts.py"
      - "tests/test_crfu_source_contracts.py"
      - ".github/workflows/custoszv9-strict-resource-regression.yml"
  pull_request:
    branches:
      - "feature/formal-assurance-custosz9fix-*"
    paths:
      - "custoszv9/crfu/**"
      - "tests/test_custoszv9.py"
      - "tests/test_louksna_global_gate_ledger.py"
      - "scripts/louksna_global_*.py"
      - "scripts/louksna_global_*.json"
      - ".github/workflows/custoszv9-strict-resource-regression.yml"

permissions:
  contents: read

concurrency:
  group: custoszv9-strict-resource-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install pinned test dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Run complete CUSTOSZV9 test suite
        run: python -m unittest discover -s tests -p 'test_custoszv9.py' -v
      - name: Run global G01-G24 fail-closed tests
        run: python -m unittest discover -s tests -p 'test_louksna_global_gate_ledger.py' -v
      - name: Verify source-bound structural contract correspondence
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_crfu_source_contracts.py --root . --candidate-sha "$(git rev-parse HEAD)" --output "$RUNNER_TEMP/source-contract-conformance.json"
      - name: Test source-contract correspondence and drift rejection
        run: python -m unittest discover -s tests -p 'test_crfu_source_contracts.py' -v
