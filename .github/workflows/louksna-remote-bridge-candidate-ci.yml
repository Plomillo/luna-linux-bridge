name: "LOUKSNA Remote Bridge candidate — isolated read-only CI"
on:
  push:
    branches:
      - candidate/louksna-remote-bridge-v0-unreleased
    paths:
      - "bridge/**"
      - ".github/workflows/louksna-remote-bridge-candidate-ci.yml"
  pull_request:
    paths:
      - "bridge/**"
permissions:
  contents: read
concurrency:
  group: lrb-readonly-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  isolated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Checkout only reviewed candidate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python static syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile bridge/lrb_core.py bridge/github_adapter.py bridge/tests/*.py
      - name: Contract JSON validation and explicit uncertified state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("bridge")
          c=json.loads((root/"CONTRACT.v0.json").read_text())
          b=json.loads((root/"BUILD_STATUS.json").read_text())
          assert c["schema"]=="LOUKSNA_REMOTE_BRIDGE_CONTRACT/0.1"
          assert c["authority"]=="Louksna.md"
          assert c["release"]["certified"] is False
          assert b["host_deployed"] is False
          print("STATIC_CONTRACT=PASS; HOST_DEPLOYED=FALSE")
          PY
      - name: Run bounded negative regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          timeout 90s python3 -B -m unittest discover -s bridge/tests -p "test_*.py" -v
      - name: Functional observer and revisioned-time smoke (no root, no host)
        shell: bash
        run: |
          set -Eeuo pipefail
          S="$RUNNER_TEMP/lrb-smoke-state"
          python3 -B bridge/lrb_core.py --state-dir "$S" status > "$RUNNER_TEMP/STATUS_BEFORE.json"
          python3 -B bridge/lrb_core.py --state-dir "$S" observe > "$RUNNER_TEMP/OBSERVE.json"
          python3 -B bridge/lrb_core.py --state-dir "$S" time-update --revision 0 --heartbeat-sec 10 --work-seconds 20 > "$RUNNER_TEMP/TIME_UPDATE.json"
          python3 -B bridge/lrb_core.py --state-dir "$S" monitor --cycles 2 > "$RUNNER_TEMP/MONITOR.json"
          python3 -B bridge/lrb_core.py --state-dir "$S" plan --objective 'Observe without mutating' --model-expectation 'Expect PASS if evidence exists' --model-name 'DECLARED_TEST_MODEL' --model-version 'UNVERIFIED' > "$RUNNER_TEMP/PLAN.json"
          python3 -B bridge/lrb_core.py --state-dir "$S" status > "$RUNNER_TEMP/STATUS_AFTER.json"
          python3 - "$RUNNER_TEMP/STATUS_AFTER.json" "$RUNNER_TEMP/PLAN.json" <<'PY'
          import json,sys
          state=json.load(open(sys.argv[1]))
          plan=json.load(open(sys.argv[2]))
          assert state["time_policy"]["revision"]==1
          assert state["g23"]=="NOT_EXECUTED"
          assert plan["execution_allowed"] is False
          print("LRB_GITHUB_HOSTED_SMOKE=PASS; HOST_CERTIFICATION=FALSE")
          PY
          mkdir -p "$RUNNER_TEMP/lrb-test-evidence"
          cp "$RUNNER_TEMP"/{STATUS_BEFORE,STATUS_AFTER,OBSERVE,TIME_UPDATE,MONITOR,PLAN}.json "$RUNNER_TEMP/lrb-test-evidence/"
      - name: Record immutable candidate test evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lrb-test-evidence"
          printf 'commit=%s\nrun=%s\nevent=%s\nscope=GITHUB_HOSTED_READONLY\nnot_host_certification=true\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_EVENT_NAME" > "$RUNNER_TEMP/lrb-test-evidence/RECEIPT.txt"
          sha256sum bridge/lrb_core.py bridge/github_adapter.py bridge/CONTRACT.v0.json \
            > "$RUNNER_TEMP/lrb-test-evidence/SOURCE_SHA256.txt"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-remote-bridge-readonly-ci
          path: ${{ runner.temp }}/lrb-test-evidence/
          retention-days: 90
          compression-level: 0
