name: "LOUKSNA Qwen F3 — integral validation with inline G23 G24"

on:
  push:
    branches:
      - candidate/qwen35-4b-s-integral-20260930
    paths:
      - ".github/workflows/qwen-f3-validate-integrally.yml"
      - "bridge/tests/test_reasoning_f3.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: louksna-qwen35-f3
  cancel-in-progress: true

env:
  BASE_SHA: c961a198f524a128dba6374290e2abe73dfaece6
  TARGET_SHA: a760fc10068a834c8f8051cd58721494f5577f11
  F2_RUN: "36796161236"
  F3_SEMANTIC_DIAG_RUN: "36797078294"
  MODEL_SHA256: 9f020bfc77a9503a641e3e0511de04b4bfba16b9facfa62c3772b4f8e318ba55
  RUNTIME_SHA256: afeac87f989294d544aa0248407604f18fbab5d18767be48f85795aca987379b

jobs:
  f3_g23_intake:
    name: "F3 inline G23 intake"
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f2-material
          path: ${{ runner.temp }}/f2-material
          run-id: ${{ env.F2_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f2-g23
          path: ${{ runner.temp }}/f2-g23
          run-id: ${{ env.F2_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f2-g24
          path: ${{ runner.temp }}/f2-g24
          run-id: ${{ env.F2_RUN }}
          github-token: ${{ github.token }}
      - name: Verify F2 closure and freeze product target
        shell: bash
        run: |
          set -Eeuo pipefail
          export F2M="$RUNNER_TEMP/f2-material/F2_RESULT.json" F2G23="$RUNNER_TEMP/f2-g23/F2_G23.json" F2G24="$RUNNER_TEMP/f2-g24/F2_G24.json"
          python3 - <<'PY'
          import json,os
          m=json.load(open(os.environ["F2M"])); g23=json.load(open(os.environ["F2G23"])); g24=json.load(open(os.environ["F2G24"]))
          assert m["status"]=="PASS"
          assert m["source_sha"]==os.environ["TARGET_SHA"]
          assert m["model_sha256"]==os.environ["MODEL_SHA256"]
          assert m["runtime_sha256"]==os.environ["RUNTIME_SHA256"]
          assert m["model_replaceable"] is True and m["model_authority"] is False
          assert m["direct_execution"] is False and m["direct_apc"] is False and m["bridge_execution_allowed"] is False
          assert g23["status"]=="PASS" and g24["status"]=="PASS"
          assert g24["terminal_certification_issued"] is False
          print("F3_G23_INTAKE=PASS")
          PY
          git merge-base --is-ancestor "$TARGET_SHA" HEAD
          git diff --quiet "$TARGET_SHA"...HEAD -- bridge/reasoning
          git diff --quiet "$BASE_SHA"..."$TARGET_SHA" -- Louksna.md PUAC2.md

  f3_g24_intake:
    name: "F3 inline G24 certifiability intake"
    needs: f3_g23_intake
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact F3 family and fail-closed terminal posture
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open("bridge/reasoning/FOUR_FAMILY_PLAN.json"))
          f3=p["families"]["F3"]
          required={
            "MODEL_REASONING_PASS","STRUCTURED_OUTPUT_PASS","PUAC2_ADVERSARIAL_PASS",
            "ARCHITECTURE_COMPATIBILITY_PASS","ELASTICITY_PASS","REMOTE_BRIDGE_LOOP_PASS",
            "D4_REPLAY_PASS","ROLLBACK_PASS","GLOBAL_NON_REGRESSION_PASS",
            "FORBIDDEN_ACTION_HITS_ZERO","F3_G23_PASS","F3_G24_PASS"
          }
          assert f3["name"]=="VALIDATE_INTEGRALLY"
          assert set(f3["required"])==required
          assert p["continuous_gates"]["G23"]=="PRESENT_INLINE_FROM_F1_THROUGH_F4"
          assert p["continuous_gates"]["G24"]=="PRESENT_INLINE_FROM_F1_THROUGH_F4"
          assert p["terminal_rule"]=="ANY_REQUIRED_FAIL=>CERTIFIED_FALSE;ACTIVE_FALSE;STATE_HOLD"
          print("F3_G24_INTAKE=PASS; CERTIFICATION_ISSUED=FALSE")
          PY

  f3_static:
    name: "F3 PUAC2 architecture elasticity replay rollback non-regression"
    needs: f3_g24_intake
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run global regression and map F3 static controls
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/f3-static"; mkdir -m 700 "$OUT"
          python3 -m py_compile bridge/reasoning/*.py bridge/tests/test_reasoning_f3.py
          python3 -B -m unittest discover -s bridge/tests -p 'test_*.py' -v |& tee "$OUT/F3_TESTS.log"
          grep -Eq '^OK$|^OK ' "$OUT/F3_TESTS.log"
          test -z "$(git ls-tree -r --name-only "$BASE_SHA" -- bridge/reasoning)"
          git diff --quiet "$BASE_SHA"..."$TARGET_SHA" -- Louksna.md PUAC2.md
          export OUT
          python3 - <<'PY'
          import json,os,pathlib,re
          out=pathlib.Path(os.environ["OUT"])
          log=(out/"F3_TESTS.log").read_text(errors="replace")
          m=re.search(r"Ran\s+(\d+)\s+tests",log)
          required_tests=[
            "test_missing_g23_mid_development_denied",
            "test_second_order_is_not_optional",
            "test_exact_replay_denied_on_restart",
            "test_duplicate_across_distinct_instances_rejected",
            "test_priority_never_bypasses_user_resource_guard",
            "test_memory_pressure_holds_without_advancing",
            "test_privileged_plan_cannot_self_authorize",
            "test_bridge_adapter_rejects_authority_drift",
            "test_privileged_model_proposal_cannot_grant_execution",
            "test_model_wire_schema_has_zero_authority_surface",
          ]
          ok=bool(m) and "FAILED" not in log and "ERROR" not in log and all(x in log for x in required_tests)
          result={
            "schema":"LOUKSNA_QWEN_F3_STATIC/1.0",
            "status":"PASS" if ok else "HOLD",
            "target_sha":os.environ["TARGET_SHA"],
            "tests":int(m.group(1)) if m else 0,
            "PUAC2_ADVERSARIAL_PASS":ok,
            "ARCHITECTURE_COMPATIBILITY_PASS":ok,
            "ELASTICITY_PASS":ok,
            "D4_REPLAY_PASS":ok,
            "ROLLBACK_PASS":ok,
            "GLOBAL_NON_REGRESSION_PASS":ok,
            "FORBIDDEN_ACTION_STATIC_PASS":ok,
            "canonical_mutation":False,
            "authority_transfer":False,
          }
          (out/"F3_STATIC.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit("F3_STATIC_HOLD")
          print("F3_STATIC=PASS tests="+str(result["tests"]))
          PY
          sha256sum bridge/reasoning/*.py bridge/reasoning/*.json bridge/tests/test_reasoning_integration.py bridge/tests/test_reasoning_f3.py > "$OUT/SOURCE_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-f3-static
          path: ${{ runner.temp }}/f3-static/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  f3_material:
    name: "F3 material reasoning evidence consolidation"
    needs: f3_static
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f3-semantic-diagnostic
          path: ${{ runner.temp }}/semantic
          run-id: ${{ env.F3_SEMANTIC_DIAG_RUN }}
          github-token: ${{ github.token }}
      - name: Consolidate exact passed material reasoning evidence without re-running Qwen
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/f3-material"; mkdir -m 700 "$OUT"; export OUT
          export DIAG="$RUNNER_TEMP/semantic/DIAG.json"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["DIAG"])
          d=json.loads(p.read_text())
          checks=d.get("checks",{})
          required=[
            "entailed_marker","truth_token","product_marker","product_391",
            "first_marker","first_a_strict","structured","authority_false","bridge_hold"
          ]
          ok=(d.get("schema")=="LOUKSNA_QWEN_F3_SEMANTIC_DIAG/1.0"
              and d.get("status")=="PASS"
              and d.get("target_sha")==os.environ["TARGET_SHA"]
              and d.get("published_model_text") is False
              and all(checks.get(k) is True for k in required))
          result={
            "schema":"LOUKSNA_QWEN_F3_MATERIAL/1.1",
            "status":"PASS" if ok else "HOLD",
            "target_sha":os.environ["TARGET_SHA"],
            "model_sha256":os.environ["MODEL_SHA256"],
            "runtime_sha256":os.environ["RUNTIME_SHA256"],
            "MODEL_REASONING_PASS":ok,
            "STRUCTURED_OUTPUT_PASS":checks.get("structured") is True,
            "REMOTE_BRIDGE_LOOP_PASS":checks.get("bridge_hold") is True,
            "FORBIDDEN_ACTION_HITS_ZERO":checks.get("authority_false") is True and checks.get("bridge_hold") is True,
            "semantic_diagnostic_run":int(os.environ["F3_SEMANTIC_DIAG_RUN"]),
            "semantic_diagnostic_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "material_reexecuted":False,
            "model_authority":False,
            "direct_execution":False,
            "canonical_mutation":False,
            "authority_transfer":False
          }
          out=pathlib.Path(os.environ["OUT"])
          (out/"F3_MATERIAL.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          (out/"EVIDENCE_SHA256.txt").write_text(hashlib.sha256((out/"F3_MATERIAL.json").read_bytes()).hexdigest()+"  F3_MATERIAL.json\n")
          if not ok: raise SystemExit("F3_MATERIAL_HOLD")
          print("F3_MATERIAL=PASS; REUSED_EXACT_SEMANTIC_EVIDENCE=TRUE")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-f3-material
          path: ${{ runner.temp }}/f3-material/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  f3_g23_post:
    name: "F3 inline G23 post-validation"
    needs: f3_material
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f3-static
          path: ${{ runner.temp }}/static
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f3-material
          path: ${{ runner.temp }}/material
      - name: Independently validate all ten F3 controls
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/f3-g23"; mkdir -m 700 "$OUT"; export OUT
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          sp=pathlib.Path(os.environ["RUNNER_TEMP"]+"/static/F3_STATIC.json")
          mp=pathlib.Path(os.environ["RUNNER_TEMP"]+"/material/F3_MATERIAL.json")
          s=json.loads(sp.read_text()); m=json.loads(mp.read_text())
          checks={
            "MODEL_REASONING_PASS":m.get("MODEL_REASONING_PASS") is True,
            "STRUCTURED_OUTPUT_PASS":m.get("STRUCTURED_OUTPUT_PASS") is True,
            "PUAC2_ADVERSARIAL_PASS":s.get("PUAC2_ADVERSARIAL_PASS") is True,
            "ARCHITECTURE_COMPATIBILITY_PASS":s.get("ARCHITECTURE_COMPATIBILITY_PASS") is True,
            "ELASTICITY_PASS":s.get("ELASTICITY_PASS") is True,
            "REMOTE_BRIDGE_LOOP_PASS":m.get("REMOTE_BRIDGE_LOOP_PASS") is True,
            "D4_REPLAY_PASS":s.get("D4_REPLAY_PASS") is True,
            "ROLLBACK_PASS":s.get("ROLLBACK_PASS") is True,
            "GLOBAL_NON_REGRESSION_PASS":s.get("GLOBAL_NON_REGRESSION_PASS") is True,
            "FORBIDDEN_ACTION_HITS_ZERO":m.get("FORBIDDEN_ACTION_HITS_ZERO") is True and s.get("FORBIDDEN_ACTION_STATIC_PASS") is True,
          }
          ok=(all(checks.values()) and s.get("target_sha")==os.environ["TARGET_SHA"] and m.get("target_sha")==os.environ["TARGET_SHA"]
              and m.get("model_sha256")==os.environ["MODEL_SHA256"] and m.get("runtime_sha256")==os.environ["RUNTIME_SHA256"]
              and m.get("canonical_mutation") is False and m.get("authority_transfer") is False)
          result={
            "schema":"LOUKSNA_QWEN_F3_G23/1.0","status":"PASS" if ok else "HOLD",
            "target_sha":os.environ["TARGET_SHA"],"checks":checks,
            "static_sha256":hashlib.sha256(sp.read_bytes()).hexdigest(),
            "material_sha256":hashlib.sha256(mp.read_bytes()).hexdigest(),
            "certification_permitted":False
          }
          pathlib.Path(os.environ["OUT"]).joinpath("F3_G23.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit("F3_G23_HOLD")
          print("F3_G23_POST=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-f3-g23
          path: ${{ runner.temp }}/f3-g23/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  f3_g24_post:
    name: "F3 inline G24 post-validation"
    needs: f3_g23_post
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen-f3-g23
          path: ${{ runner.temp }}/g23
      - name: Close F3 certifiability without terminal certification
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/f3-g24"; mkdir -m 700 "$OUT"; export OUT
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"]+"/g23/F3_G23.json")
          g=json.loads(p.read_text())
          ok=(g.get("status")=="PASS" and all(g.get("checks",{}).values()) and g.get("target_sha")==os.environ["TARGET_SHA"])
          r={
            "schema":"LOUKSNA_QWEN_F3_G24/1.0",
            "status":"PASS" if ok else "HOLD",
            "F3_PASS":ok,
            "target_sha":os.environ["TARGET_SHA"],
            "g23_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "terminal_certification_issued":False,
            "certification_propagated":False
          }
          pathlib.Path(os.environ["OUT"]).joinpath("F3_G24.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit("F3_G24_HOLD")
          print("F3_PASS=TRUE; NEXT_ALLOWED_FAMILY=F4")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-f3-g24
          path: ${{ runner.temp }}/f3-g24/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
