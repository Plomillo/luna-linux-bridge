name: Debian package — Louksna Linux Bridge

on:
  pull_request:
    branches:
      - work/louksna-zd-v04-master-20261007
    paths:
      - 'debian/**'
      - 'bridge/**'
      - 'scripts/**'
      - '.github/workflows/louksna-debian-package.yml'
  push:
    branches:
      - work/v0.4.0-3-desktop-gui
      - work/louksna-zd-v04-master-20261007
    paths:
      - 'debian/**'
      - 'bridge/**'
      - 'scripts/**'
      - '.github/workflows/louksna-debian-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install Debian build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper-compat dpkg-dev python3 python3-tk openssl lintian systemd

      - name: Verify governed source identity
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD:Louksna.md)" = "1a399ab7494d6df5582436819eee557083e753ed"
          test "$(git rev-parse HEAD:PUAC2.md)" = "da3b216888c86e588685d384c34dd3c481414b22"

      - name: Run project tests
        run: |
          python3 -m compileall -q bridge
          python3 -m unittest bridge/tests/test_mtls_gateway.py
          python3 -m unittest bridge/tests/test_lrb_core.py
          python3 -m unittest bridge/tests/test_live_link.py
          python3 -m unittest bridge/tests/test_release_policy.py
          python3 -m py_compile bridge/louksna_gui.py

      - name: Build Debian package
        run: |
          dpkg-buildpackage --build=binary --no-sign
          test -s ../louksna-linux-bridge_0.4.0-4_all.deb
          dpkg-deb --info ../louksna-linux-bridge_0.4.0-4_all.deb
          rm -rf /tmp/louksna-deb-root /tmp/louksna-deb-control
          mkdir -p /tmp/louksna-deb-root /tmp/louksna-deb-control
          dpkg-deb --extract ../louksna-linux-bridge_0.4.0-4_all.deb /tmp/louksna-deb-root
          dpkg-deb --control ../louksna-linux-bridge_0.4.0-4_all.deb /tmp/louksna-deb-control
          test -f /tmp/louksna-deb-root/usr/lib/louksna/bridge/louksna_gui.py
          test -x /tmp/louksna-deb-root/usr/bin/louksna-linux-bridge
          test -f /tmp/louksna-deb-root/usr/share/applications/louksna-linux-bridge.desktop
          grep -q '^Exec=/usr/bin/louksna-linux-bridge$' /tmp/louksna-deb-root/usr/share/applications/louksna-linux-bridge.desktop
          grep -q 'python3-tk' /tmp/louksna-deb-control/control
          sh -n /tmp/louksna-deb-root/usr/lib/louksna/bridge/provision-mtls-local.sh
          systemd-analyze verify /tmp/louksna-deb-root/lib/systemd/system/louksna-mtls-readonly.service

      - name: Generate candidate evidence
        if: always()
        run: |
          set -eu
          DEB="../louksna-linux-bridge_0.4.0-4_all.deb"
          if [ ! -s "$DEB" ]; then
            echo "No Debian package was produced; refusing to fabricate evidence."
            exit 1
          fi
          sha256sum "$DEB" | tee debian-package.sha256
          set +e
          lintian --tag-display-limit 0 "$DEB" > lintian.txt 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > lintian.exit
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,time
          p=pathlib.Path("../louksna-linux-bridge_0.4.0-4_all.deb")
          lint=pathlib.Path("lintian.txt").read_text(errors="replace")
          rc=int(pathlib.Path("lintian.exit").read_text().strip())
          evidence={
            "schema":"LOUKSNA_DEBIAN_CANDIDATE_EVIDENCE/1.0",
            "status":"CANDIDATE_NOT_RELEASE_CLEARED" if rc or any(x.startswith("E:") for x in lint.splitlines()) else "BUILD_AND_LINTIAN_PASS_RELEASE_CLEARANCE_NOT_ASSERTED",
            "timestamp_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),
            "repository":"Plomillo/luna-linux-bridge",
            "branch":__import__("os").environ.get("GITHUB_REF_NAME",""),
            "trigger_sha":__import__("os").environ.get("GITHUB_SHA",""),
            "commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "package":p.name,"bytes":p.stat().st_size,
            "sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "lintian_exit_code":rc,
            "lintian_errors":[x for x in lint.splitlines() if x.startswith("E:")],
            "louksna_blob":subprocess.check_output(["git","rev-parse","HEAD:Louksna.md"],text=True).strip(),
            "puac2_blob":subprocess.check_output(["git","rev-parse","HEAD:PUAC2.md"],text=True).strip(),
            "G23":"NOT_EXECUTED","G24":"NOT_EXECUTED",
            "host_installation":"NOT_TESTED","rollback":"NOT_TESTED_ON_HOST",
            "service_enabled":False
          }
          pathlib.Path("debian-package-evidence.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          PY

      - name: Upload internal build candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna-linux-bridge_0.4.0-4_candidate
          if-no-files-found: warn
          retention-days: 14
          path: |
            ../louksna-linux-bridge_0.4.0-4_all.deb
            debian-package.sha256
            debian-package-evidence.json
            lintian.txt
            lintian.exit

      - name: Enforce fail-closed release gates
        if: always()
        run: |
          test -s ../louksna-linux-bridge_0.4.0-4_all.deb
          test -s lintian.exit
          test -s lintian.txt
          if [ "$(cat lintian.exit)" -ne 0 ] || grep -q '^E:' lintian.txt; then
            echo "::error::Candidate built but is held: lintian gate failed."
            exit 1
          fi
          if [ ! -s debian/copyright ] || [ ! -s docs/DISTRIBUTION_CLEARANCE.json ]; then
            echo "::error::Candidate built but distribution clearance is absent; not release-cleared."
            exit 1
          fi
