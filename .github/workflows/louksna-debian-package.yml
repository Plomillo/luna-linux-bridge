name: Debian package — Louksna Linux Bridge

on:
  push:
    branches:
      - work/louksna-zd-v04-03-mtls-provisioning-20261008
    paths:
      - 'debian/**'
      - 'bridge/**'
      - 'bridge/tests/**'
      - 'docs/**'
      - 'Louksna.md'
      - 'PUAC2.md'
      - 'scripts/build'
      - 'scripts/provision-mtls-local.sh'
      - 'scripts/audit_distribution_evidence.py'
      - '.github/workflows/louksna-debian-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install Debian build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper-compat dpkg-dev python3 openssl lintian systemd

      - name: Verify governed source identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:Louksna.md)" = "1a399ab7494d6df5582436819eee557083e753ed"
          test "$(git rev-parse HEAD:PUAC2.md)" = "da3b216888c86e588685d384c34dd3c481414b22"

      - name: Build and test Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Package integrity and install-root smoke test
        run: |
          set -eux
          DEB="$(realpath ../louksna-linux-bridge_0.4.0-3_all.deb)"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          rm -rf /tmp/louksna-deb-root
          mkdir -p /tmp/louksna-deb-root
          dpkg-deb --extract "$DEB" /tmp/louksna-deb-root
          test -f /tmp/louksna-deb-root/usr/lib/louksna/bridge/gui.py
          test -x /tmp/louksna-deb-root/usr/bin/louksna
          test -f /tmp/louksna-deb-root/usr/share/applications/louksna-linux-bridge.desktop
          grep -q '^Exec=/usr/bin/louksna$' /tmp/louksna-deb-root/usr/share/applications/louksna-linux-bridge.desktop
          test -x /tmp/louksna-deb-root/usr/lib/louksna/bridge/provision-mtls-local.sh
          sh -n /tmp/louksna-deb-root/usr/lib/louksna/bridge/provision-mtls-local.sh
          test -f /tmp/louksna-deb-root/lib/systemd/system/louksna-mtls-readonly.service
          systemd-analyze verify /tmp/louksna-deb-root/lib/systemd/system/louksna-mtls-readonly.service
          test -f /tmp/louksna-deb-root/usr/share/doc/louksna-linux-bridge/CONTRACT.v0.json
          dpkg-deb --control "$DEB" /tmp/louksna-deb-control
          if [ -f /tmp/louksna-deb-control/postinst ]; then
            python3 - /tmp/louksna-deb-control/postinst <<'PY'
          import pathlib, re, sys
          lines=pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          text="\n".join(lines)
          if re.search(r"\bdeb-systemd-invoke\s+(?:start|restart|try-restart)\b", text):
              raise SystemExit("package postinst invokes service start/restart")
          for index, line in enumerate(lines):
              if re.search(r"\bdeb-systemd-helper\s+enable\b", line):
                  context="\n".join(lines[max(0,index-3):index])
                  if "was-enabled" not in context:
                      raise SystemExit("unconditional systemd enable in postinst")
          print("PACKAGE_SERVICE_POLICY=PASS; no start/restart and no unconditional enable")
          PY
          fi
          PYTHONPATH=/tmp/louksna-deb-root/usr/lib/louksna/bridge             python3 -m py_compile /tmp/louksna-deb-root/usr/lib/louksna/bridge/*.py
          sha256sum "$DEB" | tee debian-package.sha256
          # Preserve the exact linter exit status and output, but continue far enough
          # to publish diagnostic evidence. A later gate fails the job on any E: tag.
          set +e
          lintian --tag-display-limit 0 "$DEB" > lintian.txt 2>&1
          lintian_rc=$?
          set -e
          printf '%s\n' "$lintian_rc" > lintian.exit
          cat lintian.txt

      - name: Run hash-bound file-level distribution audit
        run: |
          set +e
          set -u
          AUDIT_LOG=distribution-audit.log
          : > "$AUDIT_LOG"
          python3 -m py_compile scripts/audit_distribution_evidence.py >> "$AUDIT_LOG" 2>&1
          compile_rc=$?
          audit_rc=0
          if [ "$compile_rc" -eq 0 ]; then
            python3 scripts/audit_distribution_evidence.py \
              --package ../louksna-linux-bridge_0.4.0-3_all.deb \
              --output distribution-audit.json >> "$AUDIT_LOG" 2>&1
            audit_rc=$?
          else
            audit_rc="$compile_rc"
          fi
          if [ ! -s distribution-audit.json ]; then
            AUDIT_TOOL_EXIT="$audit_rc" python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          package=pathlib.Path("../louksna-linux-bridge_0.4.0-3_all.deb")
          digest=hashlib.sha256(package.read_bytes()).hexdigest() if package.is_file() else None
          report={
            "schema":"LOUKSNA_DISTRIBUTION_FORENSIC_AUDIT/1.0",
            "generated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "commit_sha":subprocess.run(["git","rev-parse","HEAD"],text=True,capture_output=True).stdout.strip(),
            "package":{"filename":package.name,"sha256":digest,"size_bytes":package.stat().st_size if package.is_file() else None},
            "source_coverage":{"source_file_count":0,"source_mapping_complete":False,"expected_installed_paths_missing_from_package":["AUDIT_TOOL_FAILED"]},
            "distribution_rights":{"status":"HOLD"},
            "result":"HOLD_AUDIT_TOOL_FAILED",
            "audit_tool_exit_code":int(os.environ["AUDIT_TOOL_EXIT"]),
            "limitations":["Fallback failure record: the forensic audit tool did not produce its report."]
          }
          pathlib.Path("distribution-audit.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          PY
          fi
          AUDIT_TOOL_EXIT="$audit_rc" python3 - <<'PY'
          import json, os, pathlib
          path=pathlib.Path("distribution-audit.json")
          report=json.loads(path.read_text())
          report["audit_tool_exit_code"]=int(os.environ["AUDIT_TOOL_EXIT"])
          path.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("DISTRIBUTION_AUDIT_RESULT="+str(report.get("result"))+
                "; source_count="+str(report.get("source_coverage",{}).get("source_file_count"))+
                "; source_mapping_complete="+str(report.get("source_coverage",{}).get("source_mapping_complete"))+
                "; legal_clearance="+str(report.get("distribution_rights",{}).get("status"))+
                "; tool_exit="+os.environ["AUDIT_TOOL_EXIT"])
          PY
          cat "$AUDIT_LOG"

      - name: Install and exercise provisioner on ephemeral runner
        run: |
          set -eux
          DEB="$(realpath ../louksna-linux-bridge_0.4.0-3_all.deb)"
          # Never use a runner that already has Louksna trust material: this test
          # must not touch pre-existing host state.
          test ! -e /etc/louksna
          test ! -L /etc/louksna
          OWNER_UID="$(id -u)"
          OWNER_GID="$(id -g)"
          OWNER_HOME="$(getent passwd "$OWNER_UID" | cut -d: -f6)"
          test -n "$OWNER_HOME"
          OWNER_CONFIG_CREATED=0
          LOUKSNA_CONFIG_CREATED=0
          [ -e "$OWNER_HOME/.config" ] || OWNER_CONFIG_CREATED=1
          [ -e "$OWNER_HOME/.config/louksna" ] || LOUKSNA_CONFIG_CREATED=1
          test ! -e "$OWNER_HOME/.config/louksna/mtls"
          test ! -L "$OWNER_HOME/.config/louksna/mtls"
          cleanup_provisioning_test() {
            sudo rm -f /etc/louksna/remote-bridge/mtls.json \
              /etc/louksna/remote-bridge/tls/ca.key \
              /etc/louksna/remote-bridge/tls/ca.pem \
              /etc/louksna/remote-bridge/tls/ca.srl \
              /etc/louksna/remote-bridge/tls/server.key \
              /etc/louksna/remote-bridge/tls/server.pem \
              /etc/louksna/remote-bridge/tls/server.csr \
              /etc/louksna/remote-bridge/tls/server.ext \
              /etc/louksna/remote-bridge/tls/client.pem \
              /etc/louksna/remote-bridge/tls/client.ext \
              /etc/louksna/remote-bridge/tls/ca.srl \
              "$OWNER_HOME/.config/louksna/mtls/client.key" \
              "$OWNER_HOME/.config/louksna/mtls/client.pem" \
              "$OWNER_HOME/.config/louksna/mtls/ca.pem"
            sudo rmdir /etc/louksna/remote-bridge/tls 2>/dev/null || true
            sudo rmdir /etc/louksna/remote-bridge 2>/dev/null || true
            sudo rmdir /etc/louksna 2>/dev/null || true
            rmdir "$OWNER_HOME/.config/louksna/mtls" 2>/dev/null || true
            [ "$LOUKSNA_CONFIG_CREATED" -eq 1 ] && rmdir "$OWNER_HOME/.config/louksna" 2>/dev/null || true
            [ "$OWNER_CONFIG_CREATED" -eq 1 ] && rmdir "$OWNER_HOME/.config" 2>/dev/null || true
          }
          trap cleanup_provisioning_test EXIT
          sudo apt-get install -y "$DEB"
          sudo env SUDO_UID="$OWNER_UID" SUDO_GID="$OWNER_GID" \
            /usr/lib/louksna/bridge/provision-mtls-local.sh
          sudo env RUNNER_UID="$OWNER_UID" python3 - <<'PY'
          import json, os, pathlib, stat, subprocess
          base=pathlib.Path("/etc/louksna/remote-bridge")
          cfg=base/"mtls.json"
          data=json.loads(cfg.read_text())
          assert data["schema"]=="LRB_MTLS_READONLY_GATEWAY/0.3"
          assert cfg.stat().st_uid==0 and stat.S_IMODE(cfg.stat().st_mode)==0o600
          for name in ("server_cert","server_key","client_ca"):
              p=pathlib.Path(data[name])
              assert p.is_absolute() and p.is_file() and not p.is_symlink()
          assert stat.S_IMODE(pathlib.Path(data["server_key"]).stat().st_mode)==0o600
          result=subprocess.run(["openssl","x509","-in",data["server_cert"],"-noout","-text"],
                                text=True,capture_output=True,check=True).stdout
          assert "TLS Web Server Authentication" in result
          owner_home=pathlib.Path(subprocess.check_output(
              ["getent","passwd",os.environ["RUNNER_UID"]],text=True).split(":")[5])
          client=owner_home/".config/louksna/mtls"
          assert client.is_dir() and client.stat().st_uid==int(os.environ["RUNNER_UID"])
          assert stat.S_IMODE(client.stat().st_mode)==0o700
          assert stat.S_IMODE((client/"client.key").stat().st_mode)==0o600
          client_text=subprocess.run(["openssl","x509","-in",str(client/"client.pem"),"-noout","-text"],
                                     text=True,capture_output=True,check=True).stdout
          assert "TLS Web Client Authentication" in client_text
          pin=subprocess.check_output(["openssl","x509","-in",str(client/"client.pem"),"-outform","DER"])
          import hashlib
          assert hashlib.sha256(pin).hexdigest()==data["client_cert_sha256"]
          subprocess.run(["openssl","verify","-CAfile",data["client_ca"],data["server_cert"]],
                         check=True,capture_output=True,text=True)
          unit="/lib/systemd/system/louksna-mtls-readonly.service"
          assert pathlib.Path(unit).is_file()
          state=subprocess.run(["systemctl","is-active","--quiet","louksna-mtls-readonly.service"])
          assert state.returncode != 0, "provisioner unexpectedly activated the service"
          enabled=subprocess.run(["systemctl","is-enabled","--quiet","louksna-mtls-readonly.service"])
          assert enabled.returncode != 0, "package unexpectedly enabled the service"
          print("PROVISIONER_INTEGRATION=PASS; SERVICE_ACTIVE=false; SERVICE_ENABLED=false")
          PY
          # Remove only state created by this test, then inject an OpenSSL failure
          # to prove that partial provisioning rolls back on the real package script.
          cleanup_provisioning_test
          trap - EXIT
          FAIL_BIN="$(mktemp -d)"
          printf '#!/bin/sh\nexit 71\n' > "$FAIL_BIN/openssl"
          chmod 0755 "$FAIL_BIN/openssl"
          if sudo env PATH="$FAIL_BIN:$PATH" SUDO_UID="$OWNER_UID" SUDO_GID="$OWNER_GID" \
              /usr/lib/louksna/bridge/provision-mtls-local.sh; then
            echo "::error::Injected OpenSSL failure was not propagated"
            exit 1
          else
            failure_rc="$?"
            test "$failure_rc" -eq 71
          fi
          test ! -e /etc/louksna
          test ! -L /etc/louksna
          test ! -e "$OWNER_HOME/.config/louksna/mtls"
          [ "$LOUKSNA_CONFIG_CREATED" -eq 1 ] && rmdir "$OWNER_HOME/.config/louksna" 2>/dev/null || true
          [ "$OWNER_CONFIG_CREATED" -eq 1 ] && rmdir "$OWNER_HOME/.config" 2>/dev/null || true
          rm -rf "$FAIL_BIN"
          echo "PROVISIONER_FAULT_INJECTION=PASS; PARTIAL_STATE_ROLLED_BACK=true"
      - name: Build evidence
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, time
          deb=pathlib.Path("../louksna-linux-bridge_0.4.0-3_all.deb")
          audit=pathlib.Path("distribution-audit.json")
          lintian_rc=int(pathlib.Path("lintian.exit").read_text().strip())
          lintian_output=pathlib.Path("lintian.txt").read_text(errors="replace")
          lintian_errors=[line for line in lintian_output.splitlines() if line.startswith("E:")]
          evidence={
            "schema":"LOUKSNA_ZD_DEBIAN_PACKAGE_EVIDENCE/1.1",
            "status":"PASS" if lintian_rc == 0 and not lintian_errors else "HOLD_LINTIAN",
            "lintian_exit_code":lintian_rc,
            "lintian_errors":lintian_errors,
            "timestamp_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),
            "branch":__import__("os").environ.get("GITHUB_REF_NAME",""),
            "trigger_sha":__import__("os").environ.get("GITHUB_SHA",""),
            "workflow_ref":__import__("os").environ.get("GITHUB_WORKFLOW_REF",""),
            "commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
            "package":deb.name,
            "bytes":deb.stat().st_size,
            "sha256":hashlib.sha256(deb.read_bytes()).hexdigest(),
            "distribution_audit_sha256":hashlib.sha256(audit.read_bytes()).hexdigest(),
            "distribution_audit_result":json.loads(audit.read_text()).get("result"),
            "distribution_audit_source_count":json.loads(audit.read_text()).get("source_coverage",{}).get("source_file_count"),
            "louksna_blob":subprocess.check_output(["git","rev-parse","HEAD:Louksna.md"],text=True).strip(),
            "puac2_blob":subprocess.check_output(["git","rev-parse","HEAD:PUAC2.md"],text=True).strip(),
            "g23":"NOT_EXECUTED",
            "g24":"NOT_EXECUTED",
            "post_g24":"NOT_EXECUTED",
            "rollback":"NOT_TESTED_ON_HOST",
            "postboot":"NOT_TESTED_ON_HOST",
            "active":False
          }
          pathlib.Path("debian-package-evidence.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n")
          PY

      # This private Actions artifact exists only to deliver the requested build candidate.
      # It is explicitly not a release/redistribution artifact; release upload remains behind clearance.
      - name: Stage internal build candidate (not for redistribution)
        run: |
          set -eu
          test -s ../louksna-linux-bridge_0.4.0-3_all.deb
          mkdir -p dist/candidate
          cp ../louksna-linux-bridge_0.4.0-3_all.deb dist/candidate/
          cp debian-package.sha256 debian-package-evidence.json lintian.txt lintian.exit dist/candidate/
          cp distribution-audit.json dist/candidate/

      - name: Upload internal build candidate (not for redistribution)
        uses: actions/upload-artifact@v4
        with:
          name: louksna-linux-bridge_0.4.0-3_candidate-not-cleared
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/candidate/louksna-linux-bridge_0.4.0-3_all.deb
            dist/candidate/debian-package.sha256
            dist/candidate/debian-package-evidence.json
            dist/candidate/lintian.txt
            dist/candidate/lintian.exit
            dist/candidate/distribution-audit.json

      - name: Enforce fail-closed package policy
        if: always()
        run: |
          test -s lintian.exit || { echo "::error::Missing lintian exit evidence"; exit 1; }
          test -s lintian.txt || { echo "::error::Missing lintian output"; exit 1; }
          if [ "$(cat lintian.exit)" -ne 0 ] || grep -q '^E:' lintian.txt; then
            echo "::error::lintian reported an error; package is not releasable."
            exit 1
          fi

      - name: Enforce distribution clearance before artifact staging
        run: |
          set -eu
          test -s distribution-audit.json || { echo "::error::Missing file-level distribution audit evidence"; exit 1; }
          python3 - <<'PY'
          import json, pathlib, sys
          report=json.loads(pathlib.Path("distribution-audit.json").read_text())
          if report.get("source_coverage", {}).get("source_mapping_complete") is not True:
              print("::error::DISTRIBUTION_GATE=HOLD; source-to-package mapping is incomplete")
              sys.exit(1)
          print("Source inventory and package mapping are structurally complete; this does not establish legal rights.")
          PY
          if [ ! -s debian/copyright ]; then
            echo "::error::DISTRIBUTION_GATE=HOLD; debian/copyright is absent."
            exit 1
          fi
          if [ ! -s docs/DISTRIBUTION_CLEARANCE.json ]; then
            echo "::error::DISTRIBUTION_GATE=HOLD; independent clearance record is absent."
            exit 1
          fi
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          path = pathlib.Path("docs/DISTRIBUTION_CLEARANCE.json")
          record = json.loads(path.read_text())
          required_text = ("candidate_commit", "debian_copyright_sha256", "reviewer", "reviewed_at_utc")
          required_true = ("file_coverage_complete", "third_party_clearance_complete",
                           "redistribution_authorized", "maintainer_contact_verified",
                           "independent_review_passed")
          errors = []
          if record.get("status") != "CLEARED":
              errors.append("status must be CLEARED")
          for key in required_text:
              if not isinstance(record.get(key), str) or not record[key].strip():
                  errors.append(f"{key} must be non-empty")
          if record.get("candidate_commit") != subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True).strip():
              errors.append("candidate_commit does not match checked-out HEAD")
          actual = hashlib.sha256(pathlib.Path("debian/copyright").read_bytes()).hexdigest()
          if record.get("debian_copyright_sha256") != actual:
              errors.append("debian_copyright_sha256 does not match current file")
          if not isinstance(record.get("evidence_refs"), list) or not record["evidence_refs"]:
              errors.append("evidence_refs must be a non-empty list")
          for key in required_true:
              if record.get(key) is not True:
                  errors.append(f"{key} must be true")
          if errors:
              print("DISTRIBUTION_GATE=HOLD")
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print("DISTRIBUTION_GATE=CLEARED (record present; underlying evidence still requires independent human verification)")
          PY

      - name: Stage Debian package for artifact upload
        run: |
          mkdir -p dist/debian
          cp ../louksna-linux-bridge_0.4.0-3_all.deb dist/debian/
          cp debian-package.sha256 debian-package-evidence.json lintian.txt lintian.exit distribution-audit.json dist/debian/

      - name: Upload Debian package and evidence
        uses: actions/upload-artifact@v4
        with:
          name: louksna-linux-bridge_0.4.0-3_debian
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/debian/louksna-linux-bridge_0.4.0-3_all.deb
            dist/debian/debian-package.sha256
            dist/debian/debian-package-evidence.json
            dist/debian/lintian.txt
            dist/debian/lintian.exit
            dist/debian/distribution-audit.json
