name: Lunita CUSTOSZ V9 Recovery Contract

on:
  push:
    branches:
      - recovery/lunita-custoszv9-operational-20261020
    paths:
      - "recovery/lunita-custoszv9/**"
      - ".github/workflows/lunita-custoszv9-recovery-contract.yml"
  pull_request:
    paths:
      - "recovery/lunita-custoszv9/**"
      - ".github/workflows/lunita-custoszv9-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunita-custoszv9-recovery-contract
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only PyTorch for SeamlessM4T tensor contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "torch==2.14.1" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
      - name: Install pinned SeamlessM4T Python dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            "numpy==2.2.6" "safetensors==0.7.0" "transformers==4.57.6"
      - name: Verify CPU tensor runtime
        shell: bash
        run: |
          python -c 'import torch; assert torch.__version__.startswith("2.14.1"); print("PYTORCH_CPU_RUNTIME=" + torch.__version__)'
      - name: Compile recovery gate and tests
        run: python -m py_compile recovery/lunita-custoszv9/permission_gate.py recovery/lunita-custoszv9/test_permission_gate.py recovery/lunita-custoszv9/test_continuation_antiparalysis.py
      - name: Run fail-closed contract tests
        run: python -m unittest discover -s recovery/lunita-custoszv9 -p "test_*.py" -v
      - name: Install pinned E02-E15 runtime dependencies into isolated vendor directory
        shell: bash
        env:
          SITE_PACKAGES: recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
        run: |
          mkdir -p "$SITE_PACKAGES"
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-compile \
            --target "$SITE_PACKAGES" \
            -r recovery/lunita-custoszv9/runtime_engines_v1/requirements-engine-stack.txt
      - name: Download and verify OWL-RL wheel checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/owlrl"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/owlrl" "owlrl==7.6.2"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = list((Path(os.environ["RUNNER_TEMP"]) / "owlrl").glob("owlrl-7.6.2-*.whl"))
          assert len(files) == 1, f"Expected one OWL-RL wheel, found {len(files)}"
          digest = hashlib.sha256(files[0].read_bytes()).hexdigest()
          expected = "83347bf7f133979e87b2b18695d51d25510b99cec3f6919b5df05d4fbf058ae0"
          assert digest == expected, f"OWL-RL wheel checksum mismatch: {digest}"
          print(f"OWL_RL_WHEEL_SHA256={digest}")
          PY
          python -m pip install --disable-pip-version-check --no-deps --no-compile \
            --target recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages \
            "$RUNNER_TEMP"/owlrl/*.whl
      - name: Compile additive engine and deployment implementation
        run: |
          python -m py_compile \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/quantize_embedding_model_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_gateway_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/gateway_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/lunita_beta_v1_8.py \
            recovery/lunita-custoszv9/runtime_engines_v1/launcher_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/apply_engine_overlay_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/provision_engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/overlay_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/target_runtime_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/target_acceptance_tests_v1.py
      - name: Execute real E02-E15 engine acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          LUNITA_FASTEMBED_CACHE: ${{ runner.temp }}/lunita-fastembed-cache
          HF_HOME: ${{ runner.temp }}/lunita-fastembed-cache
          HF_HUB_CACHE: ${{ runner.temp }}/lunita-fastembed-cache/hub
        run: |
          mkdir -p "$LUNITA_FASTEMBED_CACHE" "$HF_HUB_CACHE"
          python engine_acceptance_v1.py
          python - <<'PY'
          import os
          import pathlib
          import shutil
          source = pathlib.Path(os.environ["LUNITA_FASTEMBED_CACHE"]).resolve(strict=True)
          destination = pathlib.Path("model-cache/fastembed")
          if destination.exists():
              raise SystemExit("Refusing to overwrite existing packaged model cache")
          destination.mkdir(parents=True, exist_ok=False)
          repositories = sorted(path for path in source.glob("models--*") if path.is_dir())
          if not repositories:
              raise SystemExit(f"No Hugging Face model cache repositories found under {source}")
          copied_files = 0
          copied_bytes = 0
          for repository in repositories:
              target_repository = destination / repository.name
              refs = repository / "refs"
              if refs.is_dir():
                  shutil.copytree(refs, target_repository / "refs")
              snapshots = repository / "snapshots"
              if not snapshots.is_dir():
                  raise SystemExit(f"Snapshot directory is missing: {snapshots}")
              for snapshot in sorted(path for path in snapshots.iterdir() if path.is_dir()):
                  target_snapshot = target_repository / "snapshots" / snapshot.name
                  target_snapshot.mkdir(parents=True, exist_ok=False)
                  for item in sorted(snapshot.rglob("*")):
                      relative = item.relative_to(snapshot)
                      target = target_snapshot / relative
                      if item.is_dir() and not item.is_symlink():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      if item.is_symlink():
                          resolved = item.resolve(strict=True)
                          try:
                              resolved.relative_to(source)
                          except ValueError as exc:
                              raise SystemExit(f"Cache symlink escapes approved cache root: {item}") from exc
                          if not resolved.is_file():
                              raise SystemExit(f"Cache symlink target is not a regular file: {item}")
                          source_file = resolved
                      elif item.is_file():
                          source_file = item
                      else:
                          raise SystemExit(f"Unexpected cache filesystem entry: {item}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source_file, target)
                      copied_files += 1
                      copied_bytes += target.stat().st_size
          symlinks = [str(path) for path in destination.rglob("*") if path.is_symlink()]
          if symlinks:
              raise SystemExit(f"Materialized model cache contains symlinks: {symlinks[:10]}")
          print(f"MATERIALIZED_FASTEMBED_CACHE={destination}")
          print(f"MATERIALIZED_MODEL_FILES={copied_files}")
          print(f"MATERIALIZED_MODEL_BYTES={copied_bytes}")
          PY
      - name: Install isolated ONNX quantization tool
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/onnx-quant-tools"
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --no-compile --target "$RUNNER_TEMP/onnx-quant-tools" "onnx==1.19.1"
      - name: Quantize E04 embedding ONNX and enforce semantic quality
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          PYTHONPATH: ${{ runner.temp }}/onnx-quant-tools:${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
          LUNITA_FASTEMBED_CACHE: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/model-cache/fastembed
          HF_HOME: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/model-cache/fastembed
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python quantize_embedding_model_v1.py
      - name: Re-run E02-E15 acceptance against measured INT8 E04 model
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
          LUNITA_FASTEMBED_CACHE: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/model-cache/fastembed
          LUNITA_VECTOR_DB_PATH: ${{ runner.temp }}/lunita-int8-qdrant
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python engine_acceptance_v1.py
      - name: Diagnose overlay size by package and largest files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          from collections import defaultdict
          root = pathlib.Path("recovery/lunita-custoszv9/runtime_engines_v1")
          totals = defaultdict(int)
          files = []
          for path in root.rglob("*"):
              if path.is_file():
                  size = path.stat().st_size
                  rel = path.relative_to(root)
                  key = rel.parts[0] if rel.parts else "."
                  totals[key] += size
                  files.append((size, rel.as_posix()))
          for key, size in sorted(totals.items(), key=lambda item: item[1], reverse=True):
              print(f"OVERLAY_COMPONENT_BYTES {size} {key}")
          vendor = root / "vendor/python3.12/site-packages"
          package_sizes = []
          for package in vendor.iterdir():
              if package.is_dir():
                  size = sum(item.stat().st_size for item in package.rglob("*") if item.is_file())
              elif package.is_file():
                  size = package.stat().st_size
              else:
                  continue
              package_sizes.append((size, package.name))
          for size, name in sorted(package_sizes, reverse=True)[:80]:
              print(f"VENDOR_PACKAGE_BYTES {size} {name}")
          for size, name in sorted(files, reverse=True)[:40]:
              print(f"OVERLAY_LARGEST_FILE_BYTES {size} {name}")
          PY
      - name: Enforce distributable overlay size budget
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("recovery/lunita-custoszv9/runtime_engines_v1")
          total = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          print(f"LUNITA_OVERLAY_BYTES={total}")
          print(f"LUNITA_OVERLAY_MIB={total / 1024 / 1024:.2f}")
          limit = 480 * 1024 * 1024
          if total > limit:
              raise SystemExit(f"Overlay exceeds 480 MiB distributable budget: {total}")
          PY
      - name: Execute command-team engine gateway acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python gateway_acceptance_v1.py
      - name: Execute additive beta v1.8 launcher acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python launcher_acceptance_v1.py
      - name: Execute additive overlay and checkpoint acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python overlay_acceptance_v1.py
      - name: Execute target-side overlay and INT8 receipt acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python target_acceptance_tests_v1.py
      - name: Upload reproducible Lunita engine overlay bundle
        uses: actions/upload-artifact@v4
        with:
          name: lunita-engine-overlay-v1-py312
          path: |
            recovery/lunita-custoszv9/runtime_engines_v1/
            !recovery/lunita-custoszv9/runtime_engines_v1/__pycache__/
            !recovery/lunita-custoszv9/runtime_engines_v1/**/*.pyc
          if-no-files-found: error
          retention-days: 30
  target-runtime-acceptance:
    name: "Lunita v1.8 — direct installed-runtime acceptance"
    needs: contract-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/recovery/lunita-custoszv9-operational-20261020'
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    env:
      LUNITA_ROOT: /opt/lunita
      LUNITA_CANDIDATE_ID: G06_REBUILD_CANDIDATE_R1
    steps:
      - name: Checkout exact tested source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Prepare Python 3.12 without changing system Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the overlay built by this exact workflow run
        uses: actions/download-artifact@v4
        with:
          name: lunita-engine-overlay-v1-py312
          path: ${{ runner.temp }}/lunita-overlay

      - name: Verify target and create a hash-bound additive checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
          export CHECKPOINT_DIR="$XDG_STATE_HOME/lunita/checkpoints/$LUNITA_CANDIDATE_ID/$(date -u +%Y%m%dT%H%M%S%NZ)"
          python - <<'PY'
          import hashlib, json, os, pathlib, sys
          from datetime import datetime, timezone
          root = pathlib.Path(os.environ["LUNITA_ROOT"])
          candidate = os.environ["LUNITA_CANDIDATE_ID"]
          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lunita-overlay"
          expected_launcher = "46efd711729c344e7efba9ce2503127c48f0b88207cc5a17311ff1d555b075b2"
          launcher = root / "agent/lunita.py"
          overlay = root / "engines/runtime_engines_v1"
          def digest(path):
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(block)
              return h.hexdigest()
          if not launcher.is_file() or launcher.is_symlink():
              raise SystemExit(f"BLOCKED: pinned legacy launcher missing or unsafe: {launcher}")
          launcher_sha = digest(launcher)
          if launcher_sha != expected_launcher:
              raise SystemExit(f"BLOCKED: legacy launcher SHA mismatch: {launcher_sha}")
          if overlay.exists():
              receipt = overlay / "OVERLAY_APPLY_RECEIPT.json"
              if not receipt.is_file():
                  raise SystemExit("BLOCKED: overlay path exists without a valid receipt; refusing overwrite")
              row = json.loads(receipt.read_text(encoding="utf-8"))
              if row.get("candidate_id") != candidate or row.get("status") != "APPLIED_ADDITIVELY_NOT_CERTIFIED":
                  raise SystemExit("BLOCKED: existing overlay belongs to another candidate or has invalid status")
              print("OVERLAY_ALREADY_PRESENT=TRUE; REAPPLY=DENIED")
              raise SystemExit(0)
          required = [
              source / "engine_runtime_v1.py",
              source / "target_runtime_acceptance_v1.py",
              source / "vendor/python3.12/site-packages",
              source / "model-cache/fastembed",
          ]
          missing = [str(p) for p in required if not p.exists()]
          if missing:
              raise SystemExit("BLOCKED: built overlay artifact incomplete: " + ", ".join(missing))
          engines = root / "engines"
          if engines.is_symlink():
              raise SystemExit("BLOCKED: target engines directory is a symlink")
          checkpoint = pathlib.Path(os.environ["CHECKPOINT_DIR"])
          checkpoint.mkdir(parents=True, mode=0o700, exist_ok=False)
          preserved = [{"path": str(launcher), "sha256": launcher_sha, "bytes": launcher.stat().st_size}]
          model = root / "brain/model/Qwen_Qwen3-0.6B-IQ3_XS.gguf"
          if model.is_file() and not model.is_symlink():
              preserved.append({"path": str(model), "sha256": digest(model), "bytes": model.stat().st_size})
          manifest = {
              "schema": "LUNITA_RUNTIME_OVERLAY_PREDEPLOYMENT_MANIFEST/1.0",
              "candidate_id": candidate,
              "captured_at_utc": datetime.now(timezone.utc).isoformat(),
              "rootfs": "/",
              "target_path": str(overlay),
              "target_prestate": "ABSENT",
              "preserved_inputs": preserved,
              "mutation_scope": ["additive-create:" + str(overlay)],
              "rollback": "remove-only-the-new-overlay-directory; preserve launcher, models and all pre-existing paths",
          }
          manifest_path = checkpoint / "checkpoint_manifest.json"
          payload = json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2).encode() + b"\n"
          manifest_path.write_bytes(payload)
          manifest_sha = hashlib.sha256(payload).hexdigest()
          receipt = {
              "schema": "LUNITA_RUNTIME_OVERLAY_CHECKPOINT/1.0",
              "status": "PASS",
              "candidate_id": candidate,
              "scope": "LUNITA_ADDITIVE_RUNTIME_ENGINE_OVERLAY",
              "checkpoint_id": "PREDEPLOY_" + candidate + "_" + checkpoint.name,
              "checkpoint_root": str(checkpoint),
              "checkpoint_manifest": str(manifest_path),
              "checkpoint_manifest_sha256": manifest_sha,
          }
          receipt_path = checkpoint / "CHECKPOINT_RECEIPT.json"
          receipt_path.write_text(json.dumps(receipt, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status":"CHECKPOINT_PASS","checkpoint":str(receipt_path),"manifest_sha256":manifest_sha,"preserved":preserved},sort_keys=True))
          PY

      - name: Apply the overlay additively; never replace an existing path
        shell: bash
        run: |
          set -Eeuo pipefail
          export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
          if [ -d "$LUNITA_ROOT/engines/runtime_engines_v1" ]; then
            echo "Existing overlay left untouched; the target acceptance runner will verify every hash."
            exit 0
          fi
          CHECKPOINT="$(find "$XDG_STATE_HOME/lunita/checkpoints/$LUNITA_CANDIDATE_ID" -name CHECKPOINT_RECEIPT.json -type f -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$CHECKPOINT"
          python recovery/lunita-custoszv9/runtime_engines_v1/apply_engine_overlay_v1.py \
            --rootfs / \
            --source-dir "$RUNNER_TEMP/lunita-overlay" \
            --checkpoint-receipt "$CHECKPOINT" \
            --candidate-id "$LUNITA_CANDIDATE_ID" \
            --apply

      - name: Execute actual E01-E15, E04 INT8 and legacy application acceptance
        shell: bash
        run: |
          set -Eeuo pipefail
          export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
          export LUNITA_TARGET_RUNTIME_RECEIPT_DIR="$XDG_STATE_HOME/lunita/runtime_validation"
          export LUNITA_FASTEMBED_CACHE="$LUNITA_ROOT/engines/runtime_engines_v1/model-cache/fastembed"
          export LUNITA_VECTOR_DB_PATH="$XDG_STATE_HOME/lunita/vectors"
          export LUNITA_ENGINE_AUDIT_LOG="$XDG_STATE_HOME/lunita/audit/engine-execution.jsonl"
          export PYTHONPATH="$LUNITA_ROOT/engines/runtime_engines_v1/vendor/python3.12/site-packages:$LUNITA_ROOT/engines/runtime_engines_v1"
          export HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1 HF_HUB_DISABLE_TELEMETRY=1
          mkdir -p "$RUNNER_TEMP/lunita-target-evidence"
          set +e
          python "$LUNITA_ROOT/engines/runtime_engines_v1/target_runtime_acceptance_v1.py" \
            | tee "$RUNNER_TEMP/lunita-target-evidence/target-runtime-acceptance.stdout.json"
          rc=${PIPESTATUS[0]}
          set -e
          cp -a "$LUNITA_TARGET_RUNTIME_RECEIPT_DIR"/. "$RUNNER_TEMP/lunita-target-evidence/" 2>/dev/null || true
          cp -a "$LUNITA_ROOT/engines/runtime_engines_v1/OVERLAY_APPLY_RECEIPT.json" "$RUNNER_TEMP/lunita-target-evidence/" 2>/dev/null || true
          exit "$rc"

      - name: Collect target acceptance and checkpoint evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/lunita-target-evidence/checkpoints"
          if [ -d "$HOME/.local/state/lunita/checkpoints/G06_REBUILD_CANDIDATE_R1" ]; then
            cp -a "$HOME/.local/state/lunita/checkpoints/G06_REBUILD_CANDIDATE_R1"/. "$RUNNER_TEMP/lunita-target-evidence/checkpoints/"
          fi

      - name: Preserve target acceptance and deployment checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunita-v1-8-target-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/lunita-target-evidence/
          if-no-files-found: warn
          retention-days: 90
