name: Lunita CUSTOSZ V9 Recovery Contract

on:
  push:
    branches:
      - recovery/lunita-custoszv9-operational-20261020
    paths:
      - "recovery/lunita-custoszv9/**"
      - ".github/workflows/lunita-custoszv9-recovery-contract.yml"
  pull_request:
    paths:
      - "recovery/lunita-custoszv9/**"
      - ".github/workflows/lunita-custoszv9-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunita-custoszv9-recovery-contract
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only PyTorch for SeamlessM4T tensor contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "torch==2.14.1" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
      - name: Install pinned SeamlessM4T Python dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            "numpy==2.2.6" "safetensors==0.7.0" "transformers==4.57.6"
      - name: Verify CPU tensor runtime
        shell: bash
        run: |
          python -c 'import torch; assert torch.__version__.startswith("2.14.1"); print("PYTORCH_CPU_RUNTIME=" + torch.__version__)'
      - name: Compile recovery gate and tests
        run: python -m py_compile recovery/lunita-custoszv9/permission_gate.py recovery/lunita-custoszv9/test_permission_gate.py recovery/lunita-custoszv9/test_continuation_antiparalysis.py
      - name: Run fail-closed contract tests
        run: python -m unittest discover -s recovery/lunita-custoszv9 -p "test_*.py" -v
      - name: Install pinned E02-E15 runtime dependencies into isolated vendor directory
        shell: bash
        env:
          SITE_PACKAGES: recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
        run: |
          mkdir -p "$SITE_PACKAGES"
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-compile \
            --target "$SITE_PACKAGES" \
            -r recovery/lunita-custoszv9/runtime_engines_v1/requirements-engine-stack.txt
      - name: Install version-compatible Spanish NLP model into vendor directory
        shell: bash
        env:
          SITE_PACKAGES: recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-compile \
            --target "$SITE_PACKAGES" \
            "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl"
      - name: Download and verify OWL-RL wheel checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/owlrl"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/owlrl" "owlrl==7.6.2"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = list((Path(os.environ["RUNNER_TEMP"]) / "owlrl").glob("owlrl-7.6.2-*.whl"))
          assert len(files) == 1, f"Expected one OWL-RL wheel, found {len(files)}"
          digest = hashlib.sha256(files[0].read_bytes()).hexdigest()
          expected = "83347bf7f133979e87b2b18695d51d25510b99cec3f6919b5df05d4fbf058ae0"
          assert digest == expected, f"OWL-RL wheel checksum mismatch: {digest}"
          print(f"OWL_RL_WHEEL_SHA256={digest}")
          PY
          python -m pip install --disable-pip-version-check --no-deps --no-compile \
            --target recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages \
            "$RUNNER_TEMP"/owlrl/*.whl
      - name: Compile additive engine and deployment implementation
        run: |
          python -m py_compile \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/apply_engine_overlay_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/provision_engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/overlay_acceptance_v1.py
      - name: Execute real E02-E15 engine acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          LUNITA_FASTEMBED_CACHE: ${{ runner.temp }}/lunita-fastembed-cache
        run: |
          mkdir -p "$LUNITA_FASTEMBED_CACHE"
          python engine_acceptance_v1.py
          python - <<'PY'
          import os
          import pathlib
          import shutil
          source = pathlib.Path(os.environ["LUNITA_FASTEMBED_CACHE"])
          destination = pathlib.Path("model-cache/fastembed")
          if destination.exists():
              raise SystemExit("Refusing to overwrite existing packaged model cache")
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(source, destination, symlinks=False)
          symlinks = [str(path) for path in destination.rglob("*") if path.is_symlink()]
          if symlinks:
              raise SystemExit(f"Materialized model cache still contains symlinks: {symlinks[:10]}")
          print(f"MATERIALIZED_FASTEMBED_CACHE={destination}")
          PY
      - name: Execute additive overlay and checkpoint acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python overlay_acceptance_v1.py
      - name: Upload reproducible Lunita engine overlay bundle
        uses: actions/upload-artifact@v4
        with:
          name: lunita-engine-overlay-v1-py312
          path: |
            recovery/lunita-custoszv9/runtime_engines_v1/
            !recovery/lunita-custoszv9/runtime_engines_v1/__pycache__/
            !recovery/lunita-custoszv9/runtime_engines_v1/**/*.pyc
          if-no-files-found: error
          retention-days: 30
