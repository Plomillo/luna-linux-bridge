name: Lunita CUSTOSZ V9 Recovery Contract

on:
  push:
    branches:
      - recovery/lunita-custoszv9-operational-20261020
    paths:
      - "recovery/lunita-custoszv9/**"
      - ".github/workflows/lunita-custoszv9-recovery-contract.yml"
  pull_request:
    paths:
      - "recovery/lunita-custoszv9/**"
      - ".github/workflows/lunita-custoszv9-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lunita-custoszv9-recovery-contract
  cancel-in-progress: false

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only PyTorch for SeamlessM4T tensor contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "torch==2.14.1" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
      - name: Install pinned SeamlessM4T Python dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            "numpy==2.2.6" "safetensors==0.7.0" "transformers==4.57.6"
      - name: Verify CPU tensor runtime
        shell: bash
        run: |
          python -c 'import torch; assert torch.__version__.startswith("2.14.1"); print("PYTORCH_CPU_RUNTIME=" + torch.__version__)'
      - name: Compile recovery gate and tests
        run: python -m py_compile recovery/lunita-custoszv9/permission_gate.py recovery/lunita-custoszv9/test_permission_gate.py recovery/lunita-custoszv9/test_continuation_antiparalysis.py
      - name: Run fail-closed contract tests
        run: python -m unittest discover -s recovery/lunita-custoszv9 -p "test_*.py" -v
      - name: Install pinned E02-E15 runtime dependencies into isolated vendor directory
        shell: bash
        env:
          SITE_PACKAGES: recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
        run: |
          mkdir -p "$SITE_PACKAGES"
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-compile \
            --target "$SITE_PACKAGES" \
            -r recovery/lunita-custoszv9/runtime_engines_v1/requirements-engine-stack.txt
      - name: Install version-compatible Spanish NLP model into vendor directory
        shell: bash
        env:
          SITE_PACKAGES: recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-compile \
            --target "$SITE_PACKAGES" \
            "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl"
      - name: Download and verify OWL-RL wheel checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/owlrl"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/owlrl" "owlrl==7.6.2"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = list((Path(os.environ["RUNNER_TEMP"]) / "owlrl").glob("owlrl-7.6.2-*.whl"))
          assert len(files) == 1, f"Expected one OWL-RL wheel, found {len(files)}"
          digest = hashlib.sha256(files[0].read_bytes()).hexdigest()
          expected = "83347bf7f133979e87b2b18695d51d25510b99cec3f6919b5df05d4fbf058ae0"
          assert digest == expected, f"OWL-RL wheel checksum mismatch: {digest}"
          print(f"OWL_RL_WHEEL_SHA256={digest}")
          PY
          python -m pip install --disable-pip-version-check --no-deps --no-compile \
            --target recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages \
            "$RUNNER_TEMP"/owlrl/*.whl
      - name: Compile additive engine and deployment implementation
        run: |
          python -m py_compile \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_gateway_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/gateway_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/lunita_beta_v1_8.py \
            recovery/lunita-custoszv9/runtime_engines_v1/launcher_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/apply_engine_overlay_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/provision_engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/overlay_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/target_runtime_acceptance_v1.py
      - name: Execute real E02-E15 engine acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          LUNITA_FASTEMBED_CACHE: ${{ runner.temp }}/lunita-fastembed-cache
          HF_HOME: ${{ runner.temp }}/lunita-fastembed-cache
          HF_HUB_CACHE: ${{ runner.temp }}/lunita-fastembed-cache/hub
        run: |
          mkdir -p "$LUNITA_FASTEMBED_CACHE" "$HF_HUB_CACHE"
          python engine_acceptance_v1.py
          python - <<'PY'
          import os
          import pathlib
          import shutil
          source = pathlib.Path(os.environ["LUNITA_FASTEMBED_CACHE"]).resolve(strict=True)
          destination = pathlib.Path("model-cache/fastembed")
          if destination.exists():
              raise SystemExit("Refusing to overwrite existing packaged model cache")
          destination.mkdir(parents=True, exist_ok=False)
          repositories = sorted(path for path in source.glob("models--*") if path.is_dir())
          if not repositories:
              raise SystemExit(f"No Hugging Face model cache repositories found under {source}")
          copied_files = 0
          copied_bytes = 0
          for repository in repositories:
              target_repository = destination / repository.name
              refs = repository / "refs"
              if refs.is_dir():
                  shutil.copytree(refs, target_repository / "refs")
              snapshots = repository / "snapshots"
              if not snapshots.is_dir():
                  raise SystemExit(f"Snapshot directory is missing: {snapshots}")
              for snapshot in sorted(path for path in snapshots.iterdir() if path.is_dir()):
                  target_snapshot = target_repository / "snapshots" / snapshot.name
                  target_snapshot.mkdir(parents=True, exist_ok=False)
                  for item in sorted(snapshot.rglob("*")):
                      relative = item.relative_to(snapshot)
                      target = target_snapshot / relative
                      if item.is_dir() and not item.is_symlink():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      if item.is_symlink():
                          resolved = item.resolve(strict=True)
                          try:
                              resolved.relative_to(source)
                          except ValueError as exc:
                              raise SystemExit(f"Cache symlink escapes approved cache root: {item}") from exc
                          if not resolved.is_file():
                              raise SystemExit(f"Cache symlink target is not a regular file: {item}")
                          source_file = resolved
                      elif item.is_file():
                          source_file = item
                      else:
                          raise SystemExit(f"Unexpected cache filesystem entry: {item}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source_file, target)
                      copied_files += 1
                      copied_bytes += target.stat().st_size
          symlinks = [str(path) for path in destination.rglob("*") if path.is_symlink()]
          if symlinks:
              raise SystemExit(f"Materialized model cache contains symlinks: {symlinks[:10]}")
          print(f"MATERIALIZED_FASTEMBED_CACHE={destination}")
          print(f"MATERIALIZED_MODEL_FILES={copied_files}")
          print(f"MATERIALIZED_MODEL_BYTES={copied_bytes}")
          PY
      - name: Diagnose overlay size by package and largest files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          from collections import defaultdict
          root = pathlib.Path("recovery/lunita-custoszv9/runtime_engines_v1")
          totals = defaultdict(int)
          files = []
          for path in root.rglob("*"):
              if path.is_file():
                  size = path.stat().st_size
                  rel = path.relative_to(root)
                  key = rel.parts[0] if rel.parts else "."
                  totals[key] += size
                  files.append((size, rel.as_posix()))
          for key, size in sorted(totals.items(), key=lambda item: item[1], reverse=True):
              print(f"OVERLAY_COMPONENT_BYTES {size} {key}")
          vendor = root / "vendor/python3.12/site-packages"
          package_sizes = []
          for package in vendor.iterdir():
              if package.is_dir():
                  size = sum(item.stat().st_size for item in package.rglob("*") if item.is_file())
              elif package.is_file():
                  size = package.stat().st_size
              else:
                  continue
              package_sizes.append((size, package.name))
          for size, name in sorted(package_sizes, reverse=True)[:80]:
              print(f"VENDOR_PACKAGE_BYTES {size} {name}")
          for size, name in sorted(files, reverse=True)[:40]:
              print(f"OVERLAY_LARGEST_FILE_BYTES {size} {name}")
          PY
      - name: Enforce distributable overlay size budget
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("recovery/lunita-custoszv9/runtime_engines_v1")
          total = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          print(f"LUNITA_OVERLAY_BYTES={total}")
          print(f"LUNITA_OVERLAY_MIB={total / 1024 / 1024:.2f}")
          limit = 480 * 1024 * 1024
          if total > limit:
              raise SystemExit(f"Overlay exceeds 480 MiB distributable budget: {total}")
          PY
      - name: Execute command-team engine gateway acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python gateway_acceptance_v1.py
      - name: Execute additive beta v1.8 launcher acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python launcher_acceptance_v1.py
      - name: Execute additive overlay and checkpoint acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python overlay_acceptance_v1.py
      - name: Upload reproducible Lunita engine overlay bundle
        uses: actions/upload-artifact@v4
        with:
          name: lunita-engine-overlay-v1-py312
          path: |
            recovery/lunita-custoszv9/runtime_engines_v1/
            !recovery/lunita-custoszv9/runtime_engines_v1/__pycache__/
            !recovery/lunita-custoszv9/runtime_engines_v1/**/*.pyc
          if-no-files-found: error
          retention-days: 30
