name: "R4 PART4 R2 — blkid remediation G23 G24"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-part4-r2-blkid-remediation-g23-g24.yml
      - server/r4-master/part4_r2_storage_migrate.sh
      - server/r4-master/part4_r2_final_merge_prepare.sh
      - mission-control/r4-part4-r2-blkid-remediation/**

permissions:
  contents: write
  actions: read
  id-token: write

concurrency:
  group: r4-part4-r2-blkid-remediation
  cancel-in-progress: false

jobs:
  g23:
    name: G23 independently validate blkid remediation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Syntax validation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n server/r4-master/part4_r2_storage_migrate.sh
          bash -n server/r4-master/part4_r2_final_merge_prepare.sh

      - name: Verify GitHub incident evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh run view 36628834483 --repo Plomillo/luna-linux-bridge --log | grep -F 'HOLD:MISSING_COMMAND:blkid'
          gh run view 36628709421 --repo Plomillo/luna-linux-bridge --log | grep -F '/usr/sbin/blkid -s UUID -o value "$DEV"'

      - name: Validate remediation scope and hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - mission-control/r4-part4-r2-blkid-remediation/REMEDIATION-20260929.json "$RUNNER_TEMP/g23/G23_BLKID_REMEDIATION.json" <<'PY'
          import datetime as dt, hashlib, json, pathlib, subprocess, sys
          ep=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          e=json.loads(ep.read_text(encoding="utf-8"))
          storage=pathlib.Path("server/r4-master/part4_r2_storage_migrate.sh")
          final=pathlib.Path("server/r4-master/part4_r2_final_merge_prepare.sh")
          st=storage.read_text(encoding="utf-8"); ft=final.read_text(encoding="utf-8")
          def blob(p):
              return subprocess.check_output(["git","hash-object",str(p)],text=True).strip()
          pathline='export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"'
          probe='blkid_uuid(){ sudo -n "$BLKID" -p -s UUID -o value "$1"; }'
          checks={
            "schema":e.get("schema")=="LOUKSNA_R4_PART4_R2_BLKID_REMEDIATION/1.0",
            "candidate":e.get("status")=="CANDIDATE",
            "authority":e.get("authority")=="Louksna.md",
            "fail_closed":e.get("failure_posture")=="FAIL_CLOSED",
            "incident_bound":e.get("incident",{}).get("workflow_run")==36628834483 and e.get("incident",{}).get("observed_hold")=="HOLD:MISSING_COMMAND:blkid",
            "prior_proof_bound":e.get("prior_positive_evidence",{}).get("workflow_run")==36628709421,
            "storage_blob_bound":blob(storage)==e["files"][str(storage)]["new_git_blob"],
            "final_blob_bound":blob(final)==e["files"][str(final)]["new_git_blob"],
            "storage_controlled_path":pathline in st,
            "final_controlled_path":pathline in ft,
            "storage_canonical_blkid":'BLKID="/usr/sbin/blkid"' in st,
            "final_canonical_blkid":'BLKID="/usr/sbin/blkid"' in ft,
            "storage_direct_probe":probe in st,
            "final_direct_probe":probe in ft,
            "storage_absolute_exec_gate":'need_exec "$BLKID"' in st,
            "final_absolute_exec_gate":'need_exec "$BLKID"' in ft,
            "storage_noninteractive_sudo":'sudo -n true >/dev/null 2>&1 || hold "NONINTERACTIVE_SUDO_REQUIRED"' in st,
            "final_noninteractive_sudo":'sudo -n true >/dev/null 2>&1 || hold "NONINTERACTIVE_SUDO_REQUIRED"' in ft,
            "storage_no_generic_blkid_lookup":'findmnt blkid blockdev' not in st,
            "final_no_generic_blkid_lookup":'findmnt blkid blockdev' not in ft,
            "storage_no_unprivileged_direct_blkid":'/usr/sbin/blkid -s UUID' not in st,
            "final_no_unprivileged_direct_blkid":'/usr/sbin/blkid -s UUID' not in ft,
            "no_scope_expansion":"NO_AUTHORIZATION_SCOPE_EXPANSION" in e.get("invariants",[]),
            "no_disk_mutation_by_patch":"NO_DISK_MUTATION_BY_REMEDIATION_COMMIT" in e.get("invariants",[])
          }
          passed=all(checks.values())
          r={
            "schema":"LOUKSNA_R4_PART4_R2_BLKID_G23/1.0",
            "status":"PASS" if passed else "HOLD",
            "scope":"BLKID_PATH_AND_DIRECT_PROBE_REMEDIATION_ONLY",
            "checks":checks,
            "evidence_sha256":hashlib.sha256(ep.read_bytes()).hexdigest(),
            "storage_sha256":hashlib.sha256(storage.read_bytes()).hexdigest(),
            "final_merge_sha256":hashlib.sha256(final.read_bytes()).hexdigest(),
            "repair_allowed":False,
            "g24_allowed":passed,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(r,indent=2,sort_keys=True))
          if not passed: raise SystemExit(3)
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-blkid-g23
          path: ${{ runner.temp }}/g23/G23_BLKID_REMEDIATION.json
          retention-days: 90
          compression-level: 0

  g24:
    name: G24 certify blkid remediation
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-blkid-g23
          path: ${{ runner.temp }}/g23

      - name: Issue digest-bound remediation certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G23="$RUNNER_TEMP/g23/G23_BLKID_REMEDIATION.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"])' "$G23")" = PASS
          H="$(sha256sum "$G23" | awk '{print $1}')"
          AUD="louksna-r4-part4-r2-blkid-remediation:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export TOKEN H AUD
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24_BLKID_REMEDIATION.json" <<'PY'
          import base64, datetime as dt, hashlib, json, os, pathlib, sys
          token=os.environ["TOKEN"]; parts=token.split(".")
          if len(parts)!=3: raise SystemExit("OIDC_FORMAT")
          payload=parts[1]+"="*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          r={
            "schema":"LOUKSNA_R4_PART4_R2_BLKID_G24/1.0",
            "status":"PASS",
            "scope":"BLKID_PATH_AND_DIRECT_PROBE_REMEDIATION_ONLY",
            "g23_sha256":os.environ["H"],
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(token.encode()).hexdigest(),
            "does_not_certify_disk_geometry":True,
            "does_not_expand_authorization":True,
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
          unset TOKEN RESP

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-blkid-g24
          path: ${{ runner.temp }}/g24/G24_BLKID_REMEDIATION.json
          retention-days: 90
          compression-level: 0

  resume:
    name: Resume storage migration only after remediation G24
    needs: g24
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-blkid-g24
          path: ${{ runner.temp }}/g24

      - name: Dispatch governed storage resume
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          CERT="$RUNNER_TEMP/g24/G24_BLKID_REMEDIATION.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"])' "$CERT")" = PASS
          CERT_SHA="$(sha256sum "$CERT" | awk '{print $1}')"
          TRIGGER="mission-control/r4-part4-r2-storage-migration/RESUME-AFTER-BLKID-G24-${GITHUB_RUN_ID}.json"
          BODY="$(printf '{"schema":"LOUKSNA_R4_PART4_R2_STORAGE_RESUME/1.0","reason":"BLKID_REMEDIATION_G24_PASS","certificate_sha256":"%s","source_run":%s}' "$CERT_SHA" "$GITHUB_RUN_ID" | base64 -w0)"
          gh api --method PUT "repos/Plomillo/luna-linux-bridge/contents/$TRIGGER" \
            -f message="handoff(PART4-R2): resume storage migration after blkid G24" \
            -f content="$BODY" \
            -f branch="staging/luna-r4-master-part1-part9-20260929"
          echo "BLKID_REMEDIATION_G24=PASS"
          echo "STORAGE_RESUME=DISPATCHED"
