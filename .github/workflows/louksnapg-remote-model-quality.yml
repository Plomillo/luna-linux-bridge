name: LOUKSNAPG remote model semantic quality

on:
  push:
    branches:
      - main
      - "louksnapg/**"
    paths:
      - ".github/workflows/louksnapg-remote-model-quality.yml"
      - "tools/louksnapg_remote_model_quality_gate.py"
      - "tools/louksnapg_reference_whisper_diagnostic.py"
      - "tools/cajita_task_e2e.py"
      - "tests/test_louksnapg_remote_model_quality_gate.py"
      - "cajita-luna-runtime/CAJITA_REMOTE_MODEL_POLICY.json"
      - "cajita-luna-runtime/cajita_remote_execution.py"
      - "cajita-luna-runtime/cajita_task_adapters.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louksnapg-remote-model-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-harness-preflight:
    name: "Validate quality harness without model inference"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Compile only; do not load models or call endpoints
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            tools/louksnapg_remote_model_quality_gate.py \
            tools/louksnapg_reference_whisper_diagnostic.py \
            tools/cajita_task_e2e.py \
            cajita-luna-runtime/cajita_remote_execution.py \
            cajita-luna-runtime/cajita_task_adapters.py \
            tests/test_louksnapg_remote_model_quality_gate.py
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("cajita-luna-runtime/CAJITA_REMOTE_MODEL_POLICY.json").read_text(encoding="utf-8"))
          assert policy["certification"] == "NOT_GRANTED"
          assert set(policy["domains"]) == {
              "D01_CEREBRO", "D03_TRANSCRIPCION",
              "D04_TRADUCTOR_INTELIGENTE", "D06_SISTEMA_INTELIGENTE"
          }
          assert policy["unsupported_domains"]["D04_TRADUCCION_LENGUAS_ANTIGUAS"]["allow_general_translation_fallback"] is False
          print("REMOTE_QUALITY_HARNESS_SYNTAX=PASS")
          print("MODEL_INFERENCE_EXECUTED=false")
          print("GLOBAL_CERTIFICATION=NOT_GRANTED")
          PY

      - name: Run route-only preflight with a one-core and 1 GiB budget
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/louksnapg-remote-quality-preflight
          ulimit -v 1048576
          CPU="$(awk '/Cpus_allowed_list/ { split($2, values, /[-,]/); print values[1] }' /proc/self/status)"
          test -n "$CPU"
          taskset -c "$CPU" python -B tools/louksnapg_remote_model_quality_gate.py \
            --runtime-root cajita-luna-runtime \
            --work-dir "$RUNNER_TEMP/louksnapg-remote-quality-preflight" \
            --report out/louksnapg-remote-quality-preflight/LOUKSNAPG_REMOTE_QUALITY_PREFLIGHT.json \
            --preflight-only \
            2>&1 | tee "$RUNNER_TEMP/louksnapg-remote-quality-preflight.log"

      - name: Run local unit tests for quality and required-domain gates
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 1048576
          CPU="$(awk '/Cpus_allowed_list/ { split($2, values, /[-,]/); print values[1] }' /proc/self/status)"
          test -n "$CPU"
          taskset -c "$CPU" python -B -m unittest discover \
            -s tests -p 'test_louksnapg_remote_model_quality_gate.py' -v \
            2>&1 | tee "$RUNNER_TEMP/louksnapg-remote-quality-unit-tests.log"

      - name: Upload route preflight evidence without certifying product functionality
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-remote-quality-preflight-${{ github.run_id }}
          path: |
            out/louksnapg-remote-quality-preflight/LOUKSNAPG_REMOTE_QUALITY_PREFLIGHT.json
            ${{ runner.temp }}/louksnapg-remote-quality-preflight.log
            ${{ runner.temp }}/louksnapg-remote-quality-unit-tests.log
          if-no-files-found: warn
          retention-days: 90

  remote-semantic-quality:
    name: "Real semantic tasks through source-pinned remote models"
    if: github.event_name == 'workflow_dispatch'
    needs: quality-harness-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LOUKSNAPG_REMOTE_CEREBRO_URL: ${{ secrets.LOUKSNAPG_REMOTE_CEREBRO_URL }}
      LOUKSNAPG_REMOTE_CEREBRO_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_CEREBRO_KEY_HEX }}
      LOUKSNAPG_REMOTE_TRANSCRIPTION_URL: ${{ secrets.LOUKSNAPG_REMOTE_TRANSCRIPTION_URL }}
      LOUKSNAPG_REMOTE_TRANSCRIPTION_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_TRANSCRIPTION_KEY_HEX }}
      LOUKSNAPG_REMOTE_TRANSLATION_URL: ${{ secrets.LOUKSNAPG_REMOTE_TRANSLATION_URL }}
      LOUKSNAPG_REMOTE_TRANSLATION_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_TRANSLATION_KEY_HEX }}
      LOUKSNAPG_REMOTE_ANALYSIS_URL: ${{ secrets.LOUKSNAPG_REMOTE_ANALYSIS_URL }}
      LOUKSNAPG_REMOTE_ANALYSIS_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_ANALYSIS_KEY_HEX }}
      HF_HOME: /tmp/louksnapg-remote-quality/hf-home
      HF_DATASETS_CACHE: /tmp/louksnapg-remote-quality/datasets
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Check remote endpoint and key configuration before installing dependencies
        id: endpoint_preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/louksnapg-remote-quality
          python - <<'PY'
          import datetime, json, os, re, sys
          from pathlib import Path
          names = [
              "LOUKSNAPG_REMOTE_CEREBRO_URL", "LOUKSNAPG_REMOTE_CEREBRO_KEY_HEX",
              "LOUKSNAPG_REMOTE_TRANSCRIPTION_URL", "LOUKSNAPG_REMOTE_TRANSCRIPTION_KEY_HEX",
              "LOUKSNAPG_REMOTE_TRANSLATION_URL", "LOUKSNAPG_REMOTE_TRANSLATION_KEY_HEX",
              "LOUKSNAPG_REMOTE_ANALYSIS_URL", "LOUKSNAPG_REMOTE_ANALYSIS_KEY_HEX",
          ]
          missing = []
          for name in names:
              value = os.environ.get(name, "")
              if not value.strip():
                  missing.append(name)
              elif name.endswith("_KEY_HEX") and not re.fullmatch(r"[0-9a-fA-F]{64}", value):
                  missing.append(name)
          report = {
              "schema": "LOUKSNAPG_REMOTE_ENDPOINT_PREFLIGHT/1.0",
              "observed_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"),
              "candidate_source_commit": os.environ.get("GITHUB_SHA"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "workflow_ref": os.environ.get("GITHUB_REF"),
              "status": "PASS_CONFIGURATION_PRESENT" if not missing else "BLOCKED_CONFIGURATION_MISSING",
              "missing_environment_variable_names": sorted(set(missing)),
              "secret_values_recorded": False,
              "model_weights_downloaded": False,
              "model_inference_executed": False,
              "dependencies_installed": False,
              "global_certification": "NOT_GRANTED",
          }
          output = Path("out/louksnapg-remote-quality/REMOTE_ENDPOINT_CONFIGURATION_PREFLIGHT.json")
          output.write_text(json.dumps(report, ensure_ascii=False, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          if missing:
              sys.exit(2)
          PY

      - name: Install pinned known-audio fixture dependencies only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          python -m pip install --disable-pip-version-check \
            "datasets==3.2.0" "pyarrow==19.0.1" "numpy==2.2.6" \
            "soundfile==0.13.1" "scipy==1.16.2"
      - name: Run real model tasks via required remote-only routing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/louksnapg-remote-quality
          ulimit -v 1048576
          CPU="$(awk '/Cpus_allowed_list/ { split($2, values, /[-,]/); print values[1] }' /proc/self/status)"
          taskset -c "$CPU" python -B tools/louksnapg_remote_model_quality_gate.py \
            --runtime-root cajita-luna-runtime \
            --work-dir "$RUNNER_TEMP/louksnapg-remote-quality/work" \
            --report out/louksnapg-remote-quality/LOUKSNAPG_REMOTE_MODEL_QUALITY.json \
            2>&1 | tee "$RUNNER_TEMP/louksnapg-remote-quality.log"
      - name: Upload semantic evidence without granting certification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-remote-semantic-quality-${{ github.run_id }}
          path: |
            out/louksnapg-remote-quality/REMOTE_ENDPOINT_CONFIGURATION_PREFLIGHT.json
            out/louksnapg-remote-quality/LOUKSNAPG_REMOTE_MODEL_QUALITY.json
            ${{ runner.temp }}/louksnapg-remote-quality.log
          if-no-files-found: warn
          retention-days: 90
