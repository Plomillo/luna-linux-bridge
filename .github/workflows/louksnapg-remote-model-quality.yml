name: LOUKSNAPG remote model semantic quality

on:
  push:
    branches:
      - main
      - "louksnapg/**"
    paths:
      - ".github/workflows/louksnapg-remote-model-quality.yml"
      - "tools/louksnapg_remote_model_quality_gate.py"
      - "tools/louksnapg_reference_whisper_diagnostic.py"
      - "cajita-luna-runtime/CAJITA_REMOTE_MODEL_POLICY.json"
      - "cajita-luna-runtime/cajita_remote_execution.py"
      - "cajita-luna-runtime/cajita_task_adapters.py"
  workflow_dispatch:
    inputs:
      enable_remote_quality:
        description: "Run live remote model inference. Requires four deployed endpoints and eight repository secrets."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: louksnapg-remote-model-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remote-semantic-quality:
    name: "Real semantic tasks through source-pinned remote models"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      LOUKSNAPG_REMOTE_CEREBRO_URL: ${{ secrets.LOUKSNAPG_REMOTE_CEREBRO_URL }}
      LOUKSNAPG_REMOTE_CEREBRO_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_CEREBRO_KEY_HEX }}
      LOUKSNAPG_REMOTE_TRANSCRIPTION_URL: ${{ secrets.LOUKSNAPG_REMOTE_TRANSCRIPTION_URL }}
      LOUKSNAPG_REMOTE_TRANSCRIPTION_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_TRANSCRIPTION_KEY_HEX }}
      LOUKSNAPG_REMOTE_TRANSLATION_URL: ${{ secrets.LOUKSNAPG_REMOTE_TRANSLATION_URL }}
      LOUKSNAPG_REMOTE_TRANSLATION_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_TRANSLATION_KEY_HEX }}
      LOUKSNAPG_REMOTE_ANALYSIS_URL: ${{ secrets.LOUKSNAPG_REMOTE_ANALYSIS_URL }}
      LOUKSNAPG_REMOTE_ANALYSIS_KEY_HEX: ${{ secrets.LOUKSNAPG_REMOTE_ANALYSIS_KEY_HEX }}
      HF_HOME: ${{ runner.temp }}/louksnapg-remote-quality/hf-home
      HF_DATASETS_CACHE: ${{ runner.temp }}/louksnapg-remote-quality/datasets
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONNOUSERSITE: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Require explicit manual authorization before remote inference
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          enabled="$(python3 - "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH" <<'PY'
          import json, pathlib, sys
          event_name, path = sys.argv[1:]
          try:
              event = json.loads(pathlib.Path(path).read_text(encoding="utf-8"))
          except Exception:
              event = {}
          enabled = event_name == "workflow_dispatch" and str(event.get("inputs", {}).get("enable_remote_quality", "false")).lower() == "true"
          print("true" if enabled else "false")
          PY
          )"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [ "$enabled" != "true" ]; then
            echo "REMOTE_MODEL_SEMANTIC_QUALITY=SKIPPED_EXPLICIT_INPUT_REQUIRED"
            echo "No model requests, audio uploads, or model downloads were performed."
          fi

      - name: Checkout exact candidate source
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install pinned known-audio fixture dependencies only
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng
          python -m pip install --disable-pip-version-check \
            "datasets==3.2.0" "pyarrow==19.0.1" "numpy==2.2.6" \
            "soundfile==0.13.1" "scipy==1.16.2"

      - name: Validate remote-only quality harness and required endpoints
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            tools/louksnapg_remote_model_quality_gate.py \
            tools/louksnapg_reference_whisper_diagnostic.py \
            cajita-luna-runtime/cajita_remote_execution.py \
            cajita-luna-runtime/cajita_task_adapters.py

      - name: Run real model tasks via required remote-only routing
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/louksnapg-remote-quality
          ulimit -v 1048576
          CPU="$(awk '/Cpus_allowed_list/ { split($2, values, /[-,]/); print values[1] }' /proc/self/status)"
          taskset -c "$CPU" python -B tools/louksnapg_remote_model_quality_gate.py \
            --runtime-root cajita-luna-runtime \
            --work-dir "$RUNNER_TEMP/louksnapg-remote-quality/work" \
            --report out/louksnapg-remote-quality/LOUKSNAPG_REMOTE_MODEL_QUALITY.json \
            2>&1 | tee "$RUNNER_TEMP/louksnapg-remote-quality.log"

      - name: Upload semantic evidence without granting certification
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-remote-semantic-quality-${{ github.run_id }}
          path: |
            out/louksnapg-remote-quality/LOUKSNAPG_REMOTE_MODEL_QUALITY.json
            ${{ runner.temp }}/louksnapg-remote-quality.log
          if-no-files-found: warn
          retention-days: 90
