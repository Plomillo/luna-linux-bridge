  terminal_seal:
    name: "F4 integral terminal OIDC seal"
    needs: maestro
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-integral-aggregate, path: "${{ runner.temp }}/agg"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-g23-final, path: "${{ runner.temp }}/g23"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-g24-final, path: "${{ runner.temp }}/g24"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-g23-2, path: "${{ runner.temp }}/g23-2"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-g24-2, path: "${{ runner.temp }}/g24-2"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-maestro, path: "${{ runner.temp }}/maestro"}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: {name: qwen-f4-custosz, path: "${{ runner.temp }}/custosz"}
      - name: Seal
        shell: bash
        run: |
          set -Eeuo pipefail
          export AGG="$RUNNER_TEMP/agg/INTEGRAL_AGGREGATE.json" G23="$RUNNER_TEMP/g23/G23_FINAL.json" G24="$RUNNER_TEMP/g24/G24_FINAL.json" G232="$RUNNER_TEMP/g23-2/G23_2.json" G242="$RUNNER_TEMP/g24-2/G24_2.json" MAESTRO="$RUNNER_TEMP/maestro/MAESTRO_ACCEPTANCE.json" CUSTOSZ="$RUNNER_TEMP/custosz/CUSTOSZ_INTEGRAL_REVIEW.json"
          OUT="$RUNNER_TEMP/cert"; mkdir -m 700 "$OUT"; export OUT
          CHAIN="$(sha256sum "$AGG" "$G23" "$G24" "$G232" "$G242" "$MAESTRO" "$CUSTOSZ" | sha256sum | awk '{print $1}')"; export CHAIN
          AUD="louksna-qwen-integral:$PRODUCT_TARGET_SHA:$CHAIN"; export AUD
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["value"])' "$RESP")"; export TOKEN
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib
          P={k:pathlib.Path(os.environ[k]) for k in ("AGG","G23","G24","G232","G242","MAESTRO","CUSTOSZ")}
          D={k:json.loads(p.read_text()) for k,p in P.items()}
          if any(d.get("status")!="PASS" for d in D.values()): raise SystemExit("CHAIN_NOT_PASS")
          target=os.environ["PRODUCT_TARGET_SHA"]
          if D["AGG"].get("product_target_sha")!=target: raise SystemExit("TARGET_AGG")
          for k in ("G23","G24","G232","G242","MAESTRO","CUSTOSZ"):
              if D[k].get("product_target_sha",D[k].get("target_sha"))!=target: raise SystemExit("TARGET_"+k)
          tok=os.environ["TOKEN"]; parts=tok.split(".")
          payload=parts[1]+"="*((4-len(parts[1])%4)%4); claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud")
          if aud!=os.environ["AUD"] and not (isinstance(aud,list) and os.environ["AUD"] in aud): raise SystemExit("OIDC_AUD")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPO")
          cert={"schema":"LOUKSNA_QWEN_INTEGRAL_TERMINAL_CERTIFICATE/1.0","status":"PASS","final_state":"INTEGRAL_CERTIFIED_ACTIVE","certified":True,"active":True,"certification_type":"INTEGRAL_TERMINAL","product_target_sha":target,"bridge_base_sha":os.environ["BRIDGE_BASE_SHA"],"model":{"id":"QWEN35_4B_S","sha256":os.environ["MODEL_SHA256"],"role":"TRANSVERSAL_REASONING_INTELLIGENCE","replaceable":True,"canonical_authority":False,"execution_authority":False,"gate_authority":False,"self_certification":False},"runtime_sha256":os.environ["RUNTIME_SHA256"],"families":{"F1":"PASS","F2":"PASS","F3":"PASS","F4":"PASS"},"CUSTOSZ":"PASS","G23_FINAL":"PASS","G24_FINAL":"PASS","G23_2":"PASS","G24_2":"PASS","MAESTRO":"PASS","rollback":"PASS","non_regression":"PASS","continuous_g23_g24_from_start":True,"certification_propagated":False,"canonical_mutation":False,"authority_transfer":False,"silent_operation":False,"integral_chain_sha256":os.environ["CHAIN"],"evidence_sha256":{k:hashlib.sha256(p.read_bytes()).hexdigest() for k,p in P.items()},"authority_authenticated":True,"authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(tok.encode()).hexdigest(),"sealed_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          raw=(json.dumps(cert,indent=2,sort_keys=True)+"\n").encode(); out=pathlib.Path(os.environ["OUT"])
          out.joinpath("QWEN_INTEGRAL_TERMINAL_CERTIFICATE.json").write_bytes(raw)
          out.joinpath("QWEN_INTEGRAL_TERMINAL_CERTIFICATE.sha256").write_text(hashlib.sha256(raw).hexdigest()+"  QWEN_INTEGRAL_TERMINAL_CERTIFICATE.json\n")
          print(json.dumps({"final_state":cert["final_state"],"certified":True,"active":True,"families":cert["families"]},sort_keys=True))
          PY
          unset TOKEN RESP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: qwen-integral-terminal-certificate, path: "${{ runner.temp }}/cert/", if-no-files-found: error, retention-days: 90, compression-level: 0}
