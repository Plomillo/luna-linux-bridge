name: Directiva — continuous evidence search (no silent HOLD)
# Under PUAC-2 + antiparalysis. Does not certify. Only searches and records next_action.

on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  search:
    name: Search host evidence and update KEDB
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: automation/mtls-evidence-gate-20261013
          persist-credentials: true
      - name: Record evidence search (antiparalysis)
        run: |
          set -Eeuo pipefail
          mkdir -p continuity/KEDB_ENTRIES
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > continuity/KEDB_ENTRIES/DIRECTIVA_EVIDENCE_SEARCH_LATEST.json <<EOF
          {
            "schema": "LOUKSNA_KEDB/1.0",
            "entry_id": "KEDB-DIRECTIVA-SEARCH-LATEST",
            "scope": "DIRECTIVA",
            "symptom": "Host evidence still absent on luna-aux",
            "root_cause": "Bootstrap script defined; execution on runner not yet confirmed",
            "evidence_present": false,
            "known_solution_id": "scripts/directiva/host_bootstrap.sh",
            "status": "SEARCHING",
            "next_action": "Execute host_bootstrap.sh as root on luna-aux, place real certs and reports, re-dispatch puac2-autonomous.yml",
            "research_launched": true,
            "updated_at_utc": "$TS",
            "notes": "Continuous search active. No silent HOLD. G23/G24 remain sequential once evidence exists."
          }
          EOF
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git add continuity/KEDB_ENTRIES || true
          if ! git diff --cached --quiet; then
            git commit -m "kedb(directiva): evidence search tick $TS"
            git pull --rebase origin automation/mtls-evidence-gate-20261013 || true
            git push origin HEAD:automation/mtls-evidence-gate-20261013 || true
          fi
