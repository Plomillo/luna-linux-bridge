name: Cajita Calibre Slim Candidate
# v2 scope: PDF/EPUB public outputs; HTML is retained only as an internal TXT conversion dependency.

on:
  push:
    branches:
      - cajita/calibre-slim-pdf-epub-16mb-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calibre-slim-candidate-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Validate candidate scripts and manifests
        id: static-checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/calibre-slim/prune_candidate.py \
            tools/calibre-slim/prune_binary_distribution.py \
            tools/calibre-slim/inspect_layout.py \
            tools/calibre-slim/dump_frozen_index.py \
            tools/calibre-slim/scrub_frozen_archive.py \
            tools/calibre-slim/smoke_test.py
          python3 -m json.tool tools/calibre-slim/profile.json >/dev/null
          python3 -m json.tool tools/calibre-slim/source-lock.json >/dev/null
          test -x /usr/bin/python3
          echo "static_checks=PASS" >> "$GITHUB_OUTPUT"

      - name: Install headless PDF rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl xz-utils tar coreutils findutils python3 xvfb \
            libegl1 libopengl0 libgl1 libx11-xcb1 libxcb-cursor0 \
            libxcb-xinerama0 libxcb-keysyms1 libxcb-image0 libxcb-icccm4 \
            libxkbcommon-x11-0 libnss3 libasound2t64 libfontconfig1 \
            libfreetype6 libxrender1 libxext6 libxi6 libxrandr2 \
            libxfixes3 libxkbcommon0 libdbus-1-3 libsm6 libice6 \
            fonts-dejavu-core

      - name: Download and verify pinned official artifacts
        id: downloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/calibre-slim"/{downloads,source,binary,reports,artifacts}
          cd "$RUNNER_TEMP/calibre-slim/downloads"
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/kovidgoyal/calibre/releases/download/v9.17.0/calibre-9.17.0-x86_64.txz \
            -o calibre-9.17.0-x86_64.txz
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/kovidgoyal/calibre/releases/download/v9.17.0/calibre-9.17.0.tar.xz \
            -o calibre-9.17.0.tar.xz
          test "$(stat -c %s calibre-9.17.0-x86_64.txz)" = "201590724"
          test "$(stat -c %s calibre-9.17.0.tar.xz)" = "50661596"
          echo "953e4512a6482848cd803c88b6d942e6afca65dc3b67c7d1353ae048d616de53  calibre-9.17.0-x86_64.txz" | sha256sum --check -
          echo "07507ea8ace5f8a0f768c13afdb799ad685a636c1cdbd8b11162ddb419743be5  calibre-9.17.0.tar.xz" | sha256sum --check -
          sha256sum calibre-9.17.0-x86_64.txz calibre-9.17.0.tar.xz > "$RUNNER_TEMP/calibre-slim/reports/upstream.sha256"
          echo "artifact_identity=PASS" >> "$GITHUB_OUTPUT"

      - name: Extract official source and binary releases
        id: extract
        if: steps.downloads.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/calibre-slim"
          tar -xJf "$WORK/downloads/calibre-9.17.0.tar.xz" -C "$WORK/source"
          tar -xJf "$WORK/downloads/calibre-9.17.0-x86_64.txz" -C "$WORK/binary"
          SRC_BUILTINS="$(find "$WORK/source" -type f -path '*/src/calibre/customize/builtins.py' -print -quit)"
          BIN_CONVERTER="$(find -L "$WORK/binary" -type f -name ebook-convert -perm /111 -print -quit)"
          test -n "$SRC_BUILTINS"
          test -n "$BIN_CONVERTER"
          SOURCE_ROOT="${SRC_BUILTINS%/src/calibre/customize/builtins.py}"
          DIST_ROOT="$(dirname "$BIN_CONVERTER")"
          test -d "$SOURCE_ROOT/src/calibre"
          test -f "$DIST_ROOT/lib/calibre-extensions/python-lib.bypy.frozen"
          UPSTREAM_BINARY_RAW_BYTES="$(python3 -c 'from pathlib import Path; import sys; r=Path(sys.argv[1]); print(sum(p.stat().st_size for p in r.rglob("*") if p.is_file() and not p.is_symlink()))' "$DIST_ROOT")"
          printf 'SOURCE_ROOT=%s\nDIST_ROOT=%s\nBASELINE_CONVERTER=%s\nUPSTREAM_BINARY_RAW_BYTES=%s\n' \
            "$SOURCE_ROOT" "$DIST_ROOT" "$BIN_CONVERTER" "$UPSTREAM_BINARY_RAW_BYTES" > "$WORK/reports/layout.env"
          echo "layout_discovery=PASS" >> "$GITHUB_OUTPUT"

      - name: Run baseline conversion canaries before pruning
        id: baseline
        if: steps.extract.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/calibre-slim/reports/layout.env"
          set +e
          xvfb-run -a python3 tools/calibre-slim/smoke_test.py \
            --mode baseline \
            --converter "$BASELINE_CONVERTER" \
            --work-dir "$RUNNER_TEMP/calibre-slim/baseline-work" \
            --report "$RUNNER_TEMP/calibre-slim/reports/baseline-smoke.json"
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "Baseline conversion tests failed; no candidate will be released."
            exit 1
          fi

      - name: Prune official source snapshot and create source evidence
        id: source-prune
        if: steps.baseline.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/calibre-slim"
          source "$WORK/reports/layout.env"
          python3 tools/calibre-slim/prune_candidate.py \
            --root "$SOURCE_ROOT/src" --apply --source-only \
            --report "$WORK/reports/source-prune.json"
          mkdir -p "$WORK/artifacts" "$DIST_ROOT/source/calibre/customize"
          cp "$SOURCE_ROOT/src/calibre/customize/builtins.py" "$DIST_ROOT/source/calibre/customize/builtins.py"
          cp "$SOURCE_ROOT/LICENSE" "$DIST_ROOT/CALIBRE_UPSTREAM_LICENSE"
          cp "$SOURCE_ROOT/COPYRIGHT" "$DIST_ROOT/CALIBRE_UPSTREAM_COPYRIGHT"
          "$DIST_ROOT/calibre-debug" -e tools/calibre-slim/dump_frozen_index.py -- "$WORK/reports/frozen-index.json"
          test -s "$WORK/reports/frozen-index.json"
          cp tools/calibre-slim/source-lock.json "$WORK/artifacts/"
          cp tools/calibre-slim/prune_candidate.py "$WORK/artifacts/"
          cp tools/calibre-slim/prune_binary_distribution.py "$WORK/artifacts/"
          cp tools/calibre-slim/inspect_layout.py "$WORK/artifacts/"
          cp tools/calibre-slim/calibre-slim-convert "$WORK/artifacts/"
          cp tools/calibre-slim/profile.json "$WORK/artifacts/"
          cp "$SOURCE_ROOT/LICENSE" "$WORK/artifacts/CALIBRE_UPSTREAM_LICENSE"
          cp "$SOURCE_ROOT/COPYRIGHT" "$WORK/artifacts/CALIBRE_UPSTREAM_COPYRIGHT"

      - name: Prune disposable binary distribution
        id: binary-prune
        if: steps.baseline.outcome == 'success' && steps.source-prune.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/calibre-slim"
          source "$WORK/reports/layout.env"
          python3 tools/calibre-slim/scrub_frozen_archive.py \
            --root "$DIST_ROOT" --index "$WORK/reports/frozen-index.json" --apply \
            --report "$WORK/reports/frozen-scrub.json"
          python3 tools/calibre-slim/prune_binary_distribution.py \
            --root "$DIST_ROOT" --upstream-raw-bytes "$UPSTREAM_BINARY_RAW_BYTES" --apply \
            --report "$WORK/reports/binary-prune.json"
          cp tools/calibre-slim/calibre-slim-convert "$DIST_ROOT/calibre-slim-convert"
          chmod 0755 "$DIST_ROOT/calibre-slim-convert"
          echo "candidate_root=$DIST_ROOT" >> "$GITHUB_OUTPUT"

      - name: Run post-pruning conversion and command-scope tests
        id: candidate-tests
        if: steps.binary-prune.outcome == 'success'
        shell: bash
        run: |
          set -uo pipefail
          source "$RUNNER_TEMP/calibre-slim/reports/layout.env"
          set +e
          xvfb-run -a python3 tools/calibre-slim/smoke_test.py \
            --mode candidate \
            --converter "$DIST_ROOT/calibre-slim-convert" \
            --work-dir "$RUNNER_TEMP/calibre-slim/candidate-work" \
            --report "$RUNNER_TEMP/calibre-slim/reports/candidate-smoke.json"
          RC=$?
          set -e
          echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
          if [ "$RC" -ne 0 ]; then
            echo "Post-pruning conversion tests failed; packaging is blocked."
            exit 1
          fi

      - name: Package Calibre PDF/EPUB overlay and enforce 16 MB cap
        id: package
        if: steps.candidate-tests.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/calibre-slim/reports/layout.env"
          WORK="$RUNNER_TEMP/calibre-slim"
          OVERLAY="$WORK/overlay"
          rm -rf "$OVERLAY"
          mkdir -p "$OVERLAY/source/calibre/customize" "$OVERLAY/evidence"
          cp "$DIST_ROOT/source/calibre/customize/builtins.py" "$OVERLAY/source/calibre/customize/builtins.py"
          cp tools/calibre-slim/calibre-slim-convert "$OVERLAY/calibre-slim-convert"
          chmod 0755 "$OVERLAY/calibre-slim-convert"
          cp tools/calibre-slim/profile.json "$OVERLAY/"
          cp tools/calibre-slim/source-lock.json "$OVERLAY/"
          cp tools/calibre-slim/README.md "$OVERLAY/"
          cp tools/calibre-slim/prune_candidate.py "$OVERLAY/"
          cp tools/calibre-slim/prune_binary_distribution.py "$OVERLAY/"
          cp "$WORK/artifacts/CALIBRE_UPSTREAM_LICENSE" "$OVERLAY/"
          cp "$WORK/artifacts/CALIBRE_UPSTREAM_COPYRIGHT" "$OVERLAY/"
          cp "$WORK/reports/source-prune.json" "$OVERLAY/evidence/"
          cp "$WORK/reports/binary-prune.json" "$OVERLAY/evidence/"
          cp "$WORK/reports/frozen-scrub.json" "$OVERLAY/evidence/"
          cp "$WORK/reports/candidate-smoke.json" "$OVERLAY/evidence/"
          cat > "$OVERLAY/runtime-dependencies.json" <<'JSON'
          {
            "schema": "CAJITA_CALIBRE_OVERLAY_RUNTIME_DEPENDENCIES/1.0",
            "candidate_id": "CAJITA_CALIBRE_SLIM_PDF_EPUB_V2_20261024",
            "runtime": "Calibre v9.17.0 official Linux x86_64 native runtime",
            "included_in_overlay": false,
            "required": true,
            "resolution": "Set CALIBRE_EBOOK_CONVERT to the pinned runtime's ebook-convert executable or ensure that executable is on PATH.",
            "note": "The 16,000,000-byte ceiling applies to this feature overlay archive only, not to the complete Calibre runtime plus its shared Qt/WebEngine dependencies."
          }
          JSON
          OUT="$WORK/artifacts/calibre-9.17.0-cajita-pdf-epub-overlay.tar.xz"
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --use-compress-program='xz -T2 -6' -cf "$OUT" -C "$OVERLAY" .
          python3 - "$OVERLAY" "$OUT" "$WORK/reports/package.json" "$WORK/reports/binary-prune.json" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          root, archive, report_path, prune_path = map(Path, sys.argv[1:])
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for block in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(block)
              return h.hexdigest()
          prune = json.loads(prune_path.read_text())
          archive_bytes = archive.stat().st_size
          limit = 16000000
          report = {
            "schema": "CAJITA_CALIBRE_SLIM_OVERLAY_PACKAGE_AUDIT/2.0",
            "candidate_id": "CAJITA_CALIBRE_SLIM_PDF_EPUB_V2_20261024",
            "artifact_type": "UPSTREAM_CALIBRE_FEATURE_OVERLAY_NOT_SELF_CONTAINED_RUNTIME",
            "status": "SMOKE_TESTS_PASS_NOT_CERTIFIED",
            "upstream_tag": "v9.17.0",
            "archive_file": archive.name,
            "archive_bytes": archive_bytes,
            "maximum_archive_bytes": limit,
            "archive_budget_pass": archive_bytes <= limit,
            "archive_sha256": digest(archive),
            "overlay_raw_bytes": sum(p.stat().st_size for p in root.rglob('*') if p.is_file() and not p.is_symlink()),
            "overlay_file_count": sum(1 for p in root.rglob('*') if p.is_file() and not p.is_symlink()),
            "prune_report_sha256": digest(prune_path),
            "frozen_entries_scrubbed_in_test_runtime": json.loads((report_path.parent / "frozen-scrub.json").read_text())["selected_entry_count"],
            "self_contained_native_runtime": False,
            "required_external_runtime": "Official Calibre v9.17.0 Linux x86_64 binary runtime and its Qt/WebEngine dependencies",
            "global_cajita_16mb_compliance": "NOT_ESTABLISHED; external runtime bytes are outside this overlay archive",
            "feature_subset": ["TXT -> PDF", "TXT -> EPUB", "PDF -> EPUB", "EPUB -> PDF"],
            "excluded": ["HTML", "DOCX", "other public output formats", "UI translation catalogs", "OCR", "GUI/store/catalog/device-management features"],
            "certification": "NOT_GRANTED",
            "source_rebuildability": "NOT_ESTABLISHED"
          }
          report_path.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2))
          if archive_bytes > limit:
              print(f"FAIL_CLOSED: overlay archive {archive_bytes} exceeds {limit} bytes", file=sys.stderr)
              raise SystemExit(2)
          PY
          cp "$WORK/reports/package.json" "$WORK/artifacts/"
          cp "$WORK/reports/baseline-smoke.json" "$WORK/artifacts/"
          cp "$WORK/reports/candidate-smoke.json" "$WORK/artifacts/"
          cp "$WORK/reports/source-prune.json" "$WORK/artifacts/"
          cp "$WORK/reports/binary-prune.json" "$WORK/artifacts/"
          cp "$WORK/reports/frozen-index.json" "$WORK/artifacts/"
          cp "$WORK/reports/frozen-scrub.json" "$WORK/artifacts/"
          cp "$WORK/reports/upstream.sha256" "$WORK/artifacts/"
          rm -f "$WORK/artifacts/calibre-9.17.0-cajita-source-pruned.tar.xz"
          sha256sum "$WORK/artifacts/"* > "$WORK/artifacts/SHA256SUMS.txt"

      - name: Upload candidate artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cajita-calibre-pdf-epub-overlay-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/calibre-slim/artifacts/**
            ${{ runner.temp }}/calibre-slim/reports/**
            tools/calibre-slim/**
          if-no-files-found: warn
          retention-days: 30

      - name: Summarize candidate outcome
        if: always()
        shell: bash
        run: |
          {
            echo "## Cajita Calibre PDF/EPUB Overlay Candidate"
            echo
            echo "- Upstream: Calibre v9.17.0, pinned hashes."
            echo "- Baseline smoke test: ${{ steps.baseline.outcome }}"
            echo "- Source pruning: ${{ steps.source-prune.outcome }}"
            echo "- Binary pruning: ${{ steps.binary-prune.outcome }}"
            echo "- Post-pruning smoke test: ${{ steps.candidate-tests.outcome }}"
            echo "- Packaging: ${{ steps.package.outcome }}"
            echo "- Certification: NOT GRANTED by this workflow."
            echo "- Overlay cap: 16,000,000 bytes; the workflow fails if the overlay archive exceeds it."
            echo "- Native Calibre runtime is external and not counted in the overlay archive; global Cajita size compliance is not established."
            echo "- Main Cajita runtime and Macrodown manifest are not modified."
          } >> "$GITHUB_STEP_SUMMARY"
