name: "Dropbox Connected → GitHub Cloud Partitioned"

on:
  push:
    branches:
      - staging/dropbox-github-cloud-partitioned-20261005
    paths:
      - mission-control/dropbox-github-cloud-partitioned/EXECUTE.json
      - .github/workflows/dropbox-github-cloud-partitioned.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dropbox-github-cloud-partitioned
  cancel-in-progress: false

env:
  DROPBOX_PROVIDER: "DROPBOX_CONNECTED_PLUGIN"
  HARD_CEILING_SECONDS: "20400"
  STALL_SECONDS: "420"
  MAX_RECOVERY_ROUNDS: "4"

jobs:
  acquire:
    name: "GitHub-hosted partitioned Dropbox acquisition"
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      artifact_name: ${{ steps.names.outputs.artifact_name }}
      manifest_sha256: ${{ steps.complete.outputs.manifest_sha256 }}
      payload_count: ${{ steps.complete.outputs.payload_count }}
      payload_bytes: ${{ steps.complete.outputs.payload_bytes }}
    steps:
      - name: Checkout exact partitioned mission
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate cloud-only partitioned contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/tests/test_dropbox_github_cloud_partitioned.py
          python3 -m py_compile scripts/dropbox_cloud_partitioned_acquire.py
          python3 -m py_compile scripts/dropbox_transfer_resilience.py

      - id: names
        name: Initialize partitioned cloud state
        shell: bash
        run: |
          set -Eeuo pipefail
          ROOT="$RUNNER_TEMP/dropbox-partitioned-${GITHUB_RUN_ID}"
          mkdir -p "$ROOT/evidence" "$ROOT/browser-downloads" "$ROOT/payload" "$ROOT/checkpoints" "$ROOT/quarantine"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "artifact_name=dropbox-github-cloud-partitioned-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - id: resume_cache
        name: Restore latest durable PUAC2 resume ledger
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/dropbox-resume-ledger
          key: dropbox-resume-v2-${{ github.run_id }}
          restore-keys: |
            dropbox-resume-v2-

      - name: Bind verified resume state and 5-of-8 bootstrap evidence
        shell: bash
        env:
          STATE_ROOT: ${{ steps.names.outputs.root }}
        run: |
          set -Eeuo pipefail
          SEED="$GITHUB_WORKSPACE/mission-control/dropbox-github-cloud-partitioned/RESUME_SEED.json"
          test -s "$SEED"
          echo "RESUME_SEED=$SEED" >> "$GITHUB_ENV"
          if [ -s "$RUNNER_TEMP/dropbox-resume-ledger/LATEST.json" ]; then
            python3 scripts/dropbox_transfer_resilience.py verify-checkpoint \
              --checkpoint "$RUNNER_TEMP/dropbox-resume-ledger/LATEST.json"
            echo "RESUME_CHECKPOINT=$RUNNER_TEMP/dropbox-resume-ledger/LATEST.json" >> "$GITHUB_ENV"
            if [ -s "$RUNNER_TEMP/dropbox-resume-ledger/RUN_ARTIFACT_BINDING.json" ]; then
              echo "RESUME_ARTIFACT_BINDING=$RUNNER_TEMP/dropbox-resume-ledger/RUN_ARTIFACT_BINDING.json" >> "$GITHUB_ENV"
            fi
            echo "PUAC2_DURABLE_RESUME=RESTORED"
          else
            echo "PUAC2_DURABLE_RESUME=BOOTSTRAP_5_OF_8"
          fi

      - name: Recover frozen root child-link evidence from prior GitHub cloud run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dropbox-github-cloud-browser-diagnostics-37355731169
          path: ${{ runner.temp }}/frozen-root
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37355731169

      - name: Bind frozen root HTML fallback
        shell: bash
        run: |
          set -Eeuo pipefail
          FROZEN="$(find "$RUNNER_TEMP/frozen-root" -type f -name 'PAGE_AFTER_CONTINUATION_TIMEOUT.html' -print -quit)"
          test -n "$FROZEN"
          test -s "$FROZEN"
          echo "FROZEN_ROOT_HTML=$FROZEN" >> "$GITHUB_ENV"
          echo "FROZEN_ROOT_EVIDENCE=BOUND"

      - name: Install pinned Playwright browser tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input "playwright==1.55.0"
          python3 -m playwright install --with-deps chromium
          python3 -c 'import importlib.metadata; print("playwright="+importlib.metadata.version("playwright"))'

      - name: Start resilient Dropbox acquisition with anti-paralysis and live bug recovery
        shell: bash
        env:
          STATE_ROOT: ${{ steps.names.outputs.root }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          stdout="$STATE_ROOT/evidence/acquisition.stdout"
          stderr="$STATE_ROOT/evidence/acquisition.stderr"
          touch "$stdout" "$stderr"
          material_proven=false
          success=false
          round=1

          while [ "$round" -le "$MAX_RECOVERY_ROUNDS" ]; do
            echo "RECOVERY_ROUND=$round" | tee -a "$stdout"
            echo "=== ROUND $round $(date -u +%FT%TZ) ===" >> "$stderr"

            python3 -B scripts/dropbox_cloud_partitioned_acquire.py >>"$stdout" 2>>"$stderr" &
            pid=$!
            echo "$pid" > "$STATE_ROOT/evidence/acquisition.pid"
            last_progress=$SECONDS
            last_sig=""
            stalled=false

            while kill -0 "$pid" 2>/dev/null; do
              marker="$STATE_ROOT/evidence/FIRST_DOWNLOAD_EVENT.json"
              bytes="$(find "$STATE_ROOT/browser-downloads" "$STATE_ROOT/payload" -maxdepth 1 -type f -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{print s+0}')"
              progress_mtime=0
              if [ -f "$STATE_ROOT/evidence/PROGRESS.json" ]; then
                progress_mtime="$(stat -c '%Y' "$STATE_ROOT/evidence/PROGRESS.json" 2>/dev/null || echo 0)"
              fi
              sig="${bytes}:${progress_mtime}"
              if [ "$sig" != "$last_sig" ]; then
                last_sig="$sig"
                last_progress=$SECONDS
              fi

              python3 - "$STATE_ROOT/evidence/HEARTBEAT.json" "$pid" "$bytes" "$round" "$last_progress" "$SECONDS" <<'PY'
          import datetime as dt,json,pathlib,sys
          p=pathlib.Path(sys.argv[1])
          out={
            "schema":"PUAC2_TRANSFER_HEARTBEAT/1.0",
            "status":"RUNNING",
            "pid":int(sys.argv[2]),
            "observed_bytes":int(sys.argv[3]),
            "recovery_round":int(sys.argv[4]),
            "seconds_since_progress":int(sys.argv[6])-int(sys.argv[5]),
            "recorded_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

              if [ "$material_proven" != true ] && [ -f "$marker" ] && [ "$bytes" -gt 0 ]; then
                python3 - "$marker" "$STATE_ROOT/evidence/MATERIAL_BYTE_FLOW.json" "$bytes" "$pid" "$round" <<'PY'
          import json,pathlib,sys,datetime as dt
          event=json.load(open(sys.argv[1],encoding="utf-8"))
          out={
            "schema":"PUAC2_DROPBOX_GITHUB_MATERIAL_BYTE_FLOW/2.0",
            "status":"PASS",
            "MATERIAL_BYTE_FLOW":True,
            "provider":"DROPBOX_PUBLIC_SOURCE_TO_GITHUB_HOSTED_CLOUD",
            "execution_plane":"GITHUB_HOSTED_UBUNTU_24_04",
            "source_object_identified":bool(event.get("source_object_identified")),
            "source_kind":event.get("source_kind"),
            "source_identity":event.get("source_identity"),
            "download_event_observed":event.get("download_event_observed") is True,
            "observed_bytes":int(sys.argv[3]),
            "background_process_alive":True,
            "background_pid":int(sys.argv[4]),
            "recovery_round":int(sys.argv[5]),
            "new_post_fix_evidence":True,
            "local_pc_data_plane":False,
            "self_hosted_runner_data_plane":False,
            "observed_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(out,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(out,sort_keys=True))
          PY
                echo "MATERIAL_BYTE_FLOW=TRUE"
                echo "SOURCE_OBJECT_IDENTIFIED=TRUE"
                echo "OBSERVED_BYTES=$bytes"
                echo "BACKGROUND_PROCESS_ALIVE=TRUE"
                echo "EXECUTION_PLANE=GITHUB_HOSTED_UBUNTU_24_04"
                echo "PUAC2_RESUME_TELEMETRY=PASS"
                material_proven=true
              fi

              if [ $((SECONDS-last_progress)) -gt "$STALL_SECONDS" ]; then
                echo "STALL_DETECTED=TRUE seconds_without_progress=$((SECONDS-last_progress)) round=$round" | tee -a "$stderr"
                python3 - "$STATE_ROOT/evidence/STALL_EVENT.json" "$pid" "$bytes" "$round" <<'PY'
          import datetime as dt,json,pathlib,sys
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
            "schema":"PUAC2_TRANSFER_STALL_EVENT/1.0",
            "status":"STALLED",
            "pid":int(sys.argv[2]),
            "observed_bytes":int(sys.argv[3]),
            "recovery_round":int(sys.argv[4]),
            "recorded_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          },indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
                kill -TERM "$pid" 2>/dev/null || true
                sleep 5
                kill -KILL "$pid" 2>/dev/null || true
                stalled=true
                break
              fi
              sleep 5
            done

            set +e
            wait "$pid"
            rc=$?
            set -e
            if [ "$stalled" = true ] && [ "$rc" -eq 0 ]; then rc=124; fi
            echo "ACQUISITION_ROUND_EXIT=$rc round=$round" | tee -a "$stdout"

            if [ "$rc" -eq 0 ]; then
              success=true
              break
            fi

            bugdir="$STATE_ROOT/evidence/bugs/round-$round"
            mkdir -p "$bugdir"
            python3 scripts/dropbox_transfer_resilience.py diagnose --stderr "$stderr" --out "$bugdir" || true
            if [ -s "$bugdir/BUG_RECORD.json" ]; then
              python3 scripts/dropbox_transfer_resilience.py apply-safe-runtime-repair \
                --target scripts/dropbox_cloud_partitioned_acquire.py \
                --bug "$bugdir/BUG_RECORD.json" \
                --out "$bugdir/SAFE_RUNTIME_REPAIR.json" || true
            fi

            if [ -s "$STATE_ROOT/checkpoints/LATEST.json" ]; then
              python3 scripts/dropbox_transfer_resilience.py verify-checkpoint \
                --checkpoint "$STATE_ROOT/checkpoints/LATEST.json"
              export RESUME_CHECKPOINT="$STATE_ROOT/checkpoints/LATEST.json"
              echo "RESUME_FROM_LAST_VERIFIED_CHECKPOINT=TRUE" | tee -a "$stdout"
            else
              echo "NO_VERIFIED_CHECKPOINT_AVAILABLE=TRUE" | tee -a "$stderr"
            fi

            if [ "$round" -ge "$MAX_RECOVERY_ROUNDS" ]; then
              break
            fi
            sleep $((round*5))
            round=$((round+1))
          done

          if [ "$success" != true ]; then
            echo "RESILIENT_ACQUISITION_EXHAUSTED=TRUE"
            tail -n 120 "$stderr" || true
            exit 70
          fi

          if [ "$material_proven" != true ]; then
            echo "NO_NEW_MATERIAL_BYTES_OBSERVED=TRUE"
          fi

          echo "RESILIENT_ACQUISITION=PASS"
          tail -n 80 "$stdout" || true

      - id: complete
        name: Validate complete resumed corpus without executing downloaded content
        shell: bash
        env:
          STATE_ROOT: ${{ steps.names.outputs.root }}
        run: |
          set -Eeuo pipefail
          python3 - "$STATE_ROOT" <<'PY'
          import hashlib,json,pathlib,sys,zipfile
          root=pathlib.Path(sys.argv[1])
          manifest_path=root/"evidence/MANIFEST.json"
          m=json.load(open(manifest_path,encoding="utf-8"))
          assert m.get("status")=="PASS",m.get("status")
          completed=m.get("completed") or []
          prior=m.get("prior_completed") or []
          total=0
          for item in completed:
              p=root/"payload"/item["payload_name"]
              assert p.is_file() and p.stat().st_size==int(item["bytes"]) and p.stat().st_size>0,item
              h=hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda:f.read(8*1024*1024),b""): h.update(chunk)
              assert h.hexdigest()==item["sha256"],item["payload_name"]
              if item["kind"]=="folder_zip":
                  assert zipfile.is_zipfile(p),item["payload_name"]
                  with zipfile.ZipFile(p) as z:
                      assert z.testzip() is None,item["payload_name"]
                      assert len(z.infolist())==int(item["entry_count"]),item["payload_name"]
              total+=p.stat().st_size
          for item in prior:
              binding=item.get("artifact_binding") or item
              assert str(binding.get("artifact_id") or ""),item
              assert str(binding.get("artifact_digest") or "").startswith("sha256:"),item
              assert int(binding.get("artifact_size_bytes") or 0)>0,item
          assert int(m.get("payload_count"))==len(completed)
          assert int(m.get("payload_bytes"))==total
          assert int(m.get("root_object_count"))==8,m.get("root_object_count")
          assert int(m.get("root_completed_count"))==int(m.get("root_object_count"))
          assert int(m.get("unresolved_critical_bugs") or 0)==0
          cp=root/"checkpoints/LATEST.json"
          assert cp.is_file()
          print(json.dumps({
            "status":"PASS",
            "payload_count_current_run":len(completed),
            "payload_bytes_current_run":total,
            "prior_completed_count":len(prior),
            "root_object_count":m["root_object_count"],
            "root_completed_count":m["root_completed_count"],
          },sort_keys=True))
          PY
          python3 scripts/dropbox_transfer_resilience.py verify-checkpoint \
            --checkpoint "$STATE_ROOT/checkpoints/LATEST.json"
          manifest_sha="$(sha256sum "$STATE_ROOT/evidence/MANIFEST.json" | awk '{print $1}')"
          checkpoint_hash="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["checkpoint_hash"])' "$STATE_ROOT/checkpoints/LATEST.json")"
          payload_count="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["payload_count"])' "$STATE_ROOT/evidence/MANIFEST.json")"
          payload_bytes="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["payload_bytes"])' "$STATE_ROOT/evidence/MANIFEST.json")"
          echo "manifest_sha256=$manifest_sha" >> "$GITHUB_OUTPUT"
          echo "checkpoint_hash=$checkpoint_hash" >> "$GITHUB_OUTPUT"
          echo "payload_count=$payload_count" >> "$GITHUB_OUTPUT"
          echo "payload_bytes=$payload_bytes" >> "$GITHUB_OUTPUT"

      - id: upload
        name: Preserve partitioned corpus and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.names.outputs.artifact_name }}
          path: |
            ${{ steps.names.outputs.root }}/payload
            ${{ steps.names.outputs.root }}/evidence
            ${{ steps.names.outputs.root }}/checkpoints
            ${{ steps.names.outputs.root }}/quarantine
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
          include-hidden-files: true

      - name: Bind current artifact to the durable checkpoint ledger
        if: always() && steps.upload.outcome == 'success'
        shell: bash
        env:
          STATE_ROOT: ${{ steps.names.outputs.root }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          ARTIFACT_NAME: ${{ steps.names.outputs.artifact_name }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/dropbox-resume-ledger"
          bytes="$(find "$STATE_ROOT/payload" "$STATE_ROOT/evidence" "$STATE_ROOT/checkpoints" -type f -printf '%s\n' 2>/dev/null | awk '{s+=$1} END{print s+0}')"
          python3 scripts/dropbox_transfer_resilience.py bind-artifact \
            --root "$STATE_ROOT" \
            --out "$RUNNER_TEMP/dropbox-resume-ledger" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-name "$ARTIFACT_NAME" \
            --artifact-digest "$ARTIFACT_DIGEST" \
            --artifact-size-bytes "$bytes" \
            --run-id "$GITHUB_RUN_ID"

      - name: Save durable PUAC2 resume ledger for the next runner
        if: always() && steps.upload.outcome == 'success'
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: ${{ runner.temp }}/dropbox-resume-ledger
          key: dropbox-resume-v2-${{ github.run_id }}

  G23:
    name: "G23 — independent partitioned corpus validation"
    needs: acquire
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    outputs:
      g23_sha256: ${{ steps.validate.outputs.g23_sha256 }}
    steps:
      - name: Checkout validator code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recover exact partitioned acquisition artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.acquire.outputs.artifact_name }}
          path: ${{ runner.temp }}/acquired

      - id: validate
        name: Independently verify PUAC2 manifest, prior artifacts, hashes, checkpoint and ZIP CRCs
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.acquire.outputs.manifest_sha256 }}
          EXPECTED_PAYLOAD_COUNT: ${{ needs.acquire.outputs.payload_count }}
          EXPECTED_PAYLOAD_BYTES: ${{ needs.acquire.outputs.payload_bytes }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/acquired" "$RUNNER_TEMP/g23/G23.json" <<'PY'
          import hashlib,json,os,pathlib,sys,urllib.request,zipfile,datetime as dt
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          mp=root/"evidence/MANIFEST.json"
          m=json.load(open(mp,encoding="utf-8"))
          checks={}
          checks["manifest_sha"]=hashlib.sha256(mp.read_bytes()).hexdigest()==os.environ["EXPECTED_MANIFEST_SHA"]
          checks["manifest_status"]=m.get("status")=="PASS"
          checks["root_8_of_8"]=int(m.get("root_object_count") or 0)==8 and int(m.get("root_completed_count") or 0)==8
          completed=m.get("completed") or []
          prior=m.get("prior_completed") or []
          checks["current_count"]=len(completed)==int(os.environ["EXPECTED_PAYLOAD_COUNT"])
          total=0; details=[]
          for item in completed:
              p=root/"payload"/item["payload_name"]
              ok=p.is_file() and p.stat().st_size==int(item["bytes"]) and p.stat().st_size>0
              h=None
              if ok:
                  hh=hashlib.sha256()
                  with p.open("rb") as f:
                      for chunk in iter(lambda:f.read(8*1024*1024),b""): hh.update(chunk)
                  h=hh.hexdigest(); ok=ok and h==item["sha256"]
              if ok and item["kind"]=="folder_zip":
                  ok=zipfile.is_zipfile(p)
                  if ok:
                      with zipfile.ZipFile(p) as z:
                          ok=z.testzip() is None and len(z.infolist())==int(item["entry_count"])
              total += p.stat().st_size if p.is_file() else 0
              details.append({"payload_name":item["payload_name"],"status":"PASS" if ok else "FAIL","sha256":h})
          checks["all_current_payloads"]=all(x["status"]=="PASS" for x in details)
          checks["current_bytes"]=total==int(os.environ["EXPECTED_PAYLOAD_BYTES"])

          prior_checks=[]
          token=os.environ.get("GITHUB_TOKEN","")
          repo=os.environ.get("GITHUB_REPOSITORY","")
          for item in prior:
              b=item.get("artifact_binding") or item
              aid=str(b.get("artifact_id") or "")
              expected_digest=str(b.get("artifact_digest") or "")
              expected_size=int(b.get("artifact_size_bytes") or 0)
              ok=bool(aid and expected_digest.startswith("sha256:") and expected_size>0)
              observed={}
              if ok:
                  req=urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/artifacts/{aid}",
                      headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"User-Agent":"Louksna-PUAC2-G23/1.0"}
                  )
                  try:
                      with urllib.request.urlopen(req,timeout=30) as resp:
                          observed=json.loads(resp.read().decode())
                      ok=not bool(observed.get("expired"))
                      if observed.get("digest"):
                          ok=ok and observed.get("digest")==expected_digest
                      if item.get("top_level_ordinal"):
                          ok=ok and int(observed.get("size_in_bytes") or 0)==expected_size
                  except Exception as e:
                      observed={"error":f"{type(e).__name__}:{e}"}; ok=False
              prior_checks.append({"artifact_id":aid,"status":"PASS" if ok else "FAIL","observed":observed})
          checks["prior_artifacts"]=len(prior)>=5 and all(x["status"]=="PASS" for x in prior_checks)

          cp=root/"checkpoints/LATEST.json"
          checks["checkpoint_present"]=cp.is_file()
          checkpoint_hash=None
          if cp.is_file():
              c=json.load(open(cp,encoding="utf-8"))
              expected=c.get("checkpoint_hash")
              body=dict(c); body.pop("checkpoint_hash",None); body.pop("_hash_normalization",None)
              rp=dict(body.get("recovery_plan_v2") or {}); rp["checkpoint_hash"]=None; body["recovery_plan_v2"]=rp
              raw=json.dumps(body,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()
              checkpoint_hash=hashlib.sha256(raw).hexdigest()
              checks["checkpoint_hash"]=checkpoint_hash==expected
          else:
              checks["checkpoint_hash"]=False

          checks["no_unresolved_critical_bugs"]=int(m.get("unresolved_critical_bugs") or 0)==0
          ok=all(checks.values())
          report={
            "schema":"PUAC2_DROPBOX_GITHUB_G23/2.0",
            "status":"PASS" if ok else "FAIL",
            "authority":"Louksna.md",
            "governance":"PUAC2.md",
            "scope":"DROPBOX_CONNECTED_TO_GITHUB_HOSTED_PARTITIONED_TRANSFER",
            "manifest_sha256":hashlib.sha256(mp.read_bytes()).hexdigest(),
            "checkpoint_hash":checkpoint_hash,
            "root_object_count":m.get("root_object_count"),
            "root_completed_count":m.get("root_completed_count"),
            "current_payload_count":len(completed),
            "current_payload_bytes":total,
            "prior_artifact_count":len(prior),
            "independent_validator":"SEPARATE_GITHUB_HOSTED_JOB",
            "repair_allowed":False,
            "downloaded_content_executed":False,
            "certification_propagation":False,
            "canonical_mutation":False,
            "checks":checks,
            "prior_artifact_checks":prior_checks,
            "g24_authorized":ok,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(report,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
          h="$(sha256sum "$RUNNER_TEMP/g23/G23.json" | awk '{print $1}')"
          echo "g23_sha256=$h" >> "$GITHUB_OUTPUT"

      - name: Preserve G23
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-github-cloud-partitioned-g23-${{ github.run_id }}
          path: ${{ runner.temp }}/g23/G23.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  G24:
    name: "G24 — certify exact partitioned corpus"
    needs: [acquire, G23]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Recover exact G23
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dropbox-github-cloud-partitioned-g23-${{ github.run_id }}
          path: ${{ runner.temp }}/g23

      - name: Bind G24 to G23 and GitHub OIDC identity
        shell: bash
        env:
          EXPECTED_MANIFEST_SHA: ${{ needs.acquire.outputs.manifest_sha256 }}
          EXPECTED_G23_SHA: ${{ needs.G23.outputs.g23_sha256 }}
        run: |
          set -Eeuo pipefail
          G23="$RUNNER_TEMP/g23/G23.json"
          test "$(sha256sum "$G23" | awk '{print $1}')" = "$EXPECTED_G23_SHA"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G23")" = PASS
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$G23")" = "$EXPECTED_MANIFEST_SHA"

          AUD="louksna-dropbox-partitioned:$EXPECTED_MANIFEST_SHA:$EXPECTED_G23_SHA"
          TOKEN_JSON="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"
          test -n "$TOKEN"
          mkdir -p "$RUNNER_TEMP/g24"
          TOKEN="$TOKEN" python3 - "$G23" "$EXPECTED_G23_SHA" "$RUNNER_TEMP/g24/G24.json" <<'PY'
          import hashlib,json,os,pathlib,sys,datetime as dt
          p=pathlib.Path(sys.argv[1]); gsha=sys.argv[2]; tok=os.environ["TOKEN"]
          g=json.load(open(p,encoding="utf-8"))
          checks={
            "g23_pass":g.get("status")=="PASS",
            "g23_hash_bound":hashlib.sha256(p.read_bytes()).hexdigest()==gsha,
            "oidc_present":bool(tok),
            "scope_exact":g.get("scope")=="DROPBOX_CONNECTED_TO_GITHUB_HOSTED_PARTITIONED_TRANSFER",
          }
          ok=all(checks.values())
          cert={
            "schema":"LOUKSNA_DROPBOX_GITHUB_PARTITIONED_G24/1.0",
            "status":"PASS" if ok else "BLOCKED",
            "operational_status":"CERTIFIED_ACQUIRED_PARTITIONED_CORPUS" if ok else "HOLD",
            "authority":"Louksna.md",
            "scope":"DROPBOX_CONNECTED_TO_GITHUB_HOSTED_PARTITIONED_TRANSFER",
            "manifest_sha256":g.get("manifest_sha256"),
            "payload_count":g.get("payload_count"),
            "payload_bytes":g.get("payload_bytes"),
            "g23_sha256":gsha,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(tok.encode()).hexdigest(),
            "certification_propagation":False,
            "canonical_mutation":False,
            "local_pc_data_plane":False,
            "self_hosted_runner_data_plane":False,
            "checks":checks,
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[3]).write_text(json.dumps(cert,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(cert,sort_keys=True))
          if not ok: raise SystemExit(24)
          PY

      - name: Preserve G24
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-github-cloud-partitioned-g24-${{ github.run_id }}
          path: ${{ runner.temp }}/g24/G24.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0


  terminal_general:
    name: "Terminal General Certification — exact transfer mission"
    needs: [acquire, G23, G24]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Recover acquisition evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.acquire.outputs.artifact_name }}
          path: ${{ runner.temp }}/acquired

      - name: Recover G23
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dropbox-github-cloud-partitioned-g23-${{ github.run_id }}
          path: ${{ runner.temp }}/g23

      - name: Recover G24
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dropbox-github-cloud-partitioned-g24-${{ github.run_id }}
          path: ${{ runner.temp }}/g24

      - name: Issue local terminal general certificate after exact chain closure
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/terminal"
          python3 - "$RUNNER_TEMP/acquired" "$RUNNER_TEMP/g23/G23.json" "$RUNNER_TEMP/g24/G24.json" "$RUNNER_TEMP/terminal/TERMINAL_GENERAL_CERTIFICATION.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); g23p=pathlib.Path(sys.argv[2]); g24p=pathlib.Path(sys.argv[3]); out=pathlib.Path(sys.argv[4])
          mpath=root/"evidence/MANIFEST.json"; cppath=root/"checkpoints/LATEST.json"
          m=json.load(open(mpath,encoding="utf-8"))
          g23=json.load(open(g23p,encoding="utf-8"))
          g24=json.load(open(g24p,encoding="utf-8"))
          cp=json.load(open(cppath,encoding="utf-8"))
          checks={
            "transfer_8_of_8":int(m.get("root_object_count") or 0)==8 and int(m.get("root_completed_count") or 0)==8,
            "unresolved_critical_bugs_zero":int(m.get("unresolved_critical_bugs") or 0)==0,
            "checkpoint_chain_tip_present":bool(cp.get("checkpoint_hash")),
            "g23_pass":g23.get("status")=="PASS",
            "g24_pass":g24.get("status")=="PASS",
            "scope_match":g23.get("scope")==g24.get("scope")=="DROPBOX_CONNECTED_TO_GITHUB_HOSTED_PARTITIONED_TRANSFER",
            "manifest_binding":g23.get("manifest_sha256")==hashlib.sha256(mpath.read_bytes()).hexdigest()==g24.get("manifest_sha256"),
            "no_certification_propagation":g23.get("certification_propagation") is False and g24.get("certification_propagation") is False,
          }
          ok=all(checks.values())
          cert={
            "schema":"LOUKSNA_TRANSFER_TERMINAL_GENERAL_CERTIFICATION_LOCAL/1.0",
            "status":"PASS" if ok else "BLOCKED",
            "canonical_status":"LOCAL_TERMINAL_CERTIFICATE_NOT_CANONICAL_ADMISSION",
            "authority":"Louksna.md",
            "governance":"PUAC2.md",
            "scope":"DROPBOX_CONNECTED_TO_GITHUB_HOSTED_PARTITIONED_TRANSFER",
            "final_corpus_manifest_hash":hashlib.sha256(mpath.read_bytes()).hexdigest(),
            "checkpoint_chain_tip_hash":cp.get("checkpoint_hash"),
            "g23_record_hash":hashlib.sha256(g23p.read_bytes()).hexdigest(),
            "g24_record_hash":hashlib.sha256(g24p.read_bytes()).hexdigest(),
            "root_object_count":m.get("root_object_count"),
            "root_completed_count":m.get("root_completed_count"),
            "current_payload_bytes":m.get("payload_bytes"),
            "prior_completed_count":m.get("prior_completed_count"),
            "checks":checks,
            "certification_propagation":False,
            "authority_transfer":False,
            "operational_authorization_separate":True,
            "issued_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          out.write_text(json.dumps(cert,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(cert,sort_keys=True))
          if not ok: raise SystemExit(32)
          PY

      - name: Preserve terminal general certification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-transfer-terminal-general-${{ github.run_id }}
          path: ${{ runner.temp }}/terminal/TERMINAL_GENERAL_CERTIFICATION.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
