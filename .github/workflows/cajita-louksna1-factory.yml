name: Cajita V10 materialization and Louksna1 governed factory

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cajita-louksna1-factory.yml"
      - "tools/cajita_runtime_factory.py"
      - "tools/cajita_architecture_binding.py"
      - "tools/cajita_task_e2e.py"
      - "tools/cajita_axiom_source_loader.py"
      - "tests/test_cajita_axiom_source_loader.py"
      - "tests/test_cajita_runtime_factory.py"
      - "tests/test_cajita_router.py"
      - "tests/test_cajita_antiparalysis.py"
      - "cajita-luna-runtime/cajita_antiparalysis.py"
      - "cajita-luna-runtime/cajita_router.py"
      - "cajita-luna-runtime/cajita_runtime.py"
      - "cajita-luna-runtime/cajita_task_adapters.py"
      - "cajita-luna-runtime/cajita_target_adapters.py"
      - "tests/test_cajita_task_adapters.py"
      - "tests/test_cajita_target_adapters.py"
      - "tests/test_cajita_task_e2e.py"
      - "tools/cajita_axiom_graph_audit.py"
      - "tests/test_cajita_axiom_graph_audit.py"
      - "cajita-luna-runtime/1. Cerebro/cerebro_180mb_runtime.py"
      - "cajita-luna-runtime/3. Transcripción/lowrank_runtime.py"
      - "cajita-luna-runtime/4. Traductor Inteligente/Traducción general/lowrank_runtime.py"
      - "cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/docling_30mb_runtime_v1.py"
      - "cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/lowrank_runtime_v2.py"
      - "cajita-luna-runtime/reproduce_macrodown.py"
      - "cajita-luna-runtime/cajita_tokenizer_materializer.py"
      - "tests/test_cajita_tokenizer_materializer.py"
      - "tests/test_cajita_architecture_binding.py"
      - "cajita-luna-runtime/cajita_externalized_packaging.py"
      - "cajita-luna-runtime/cajita_externalized_asset_loader.py"
      - "integrations/kestra/flows/21-louksna1-release-audit.yml"
      - "integrations/kestra/validate.py"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write

concurrency:
  # Bind serialization to an immutable producer revision. A stuck/slow historical
  # smoke run must not block a repaired candidate from starting; publication still
  # uses a normal fast-forward push, so stale producers cannot overwrite main.
  group: cajita-louksna1-factory-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  manufacture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate_ready: ${{ steps.factory.outputs.candidate_ready }}
      source_commit: ${{ steps.factory.outputs.source_commit }}
    steps:
      - name: Checkout exact source commit without blanket LFS download
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Install build-only archive extractors
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip rsync

      - name: Materialize and verify six exact model payloads
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          LFS_INCLUDE='cajita-luna-runtime/1. Cerebro/model.safetensors,cajita-luna-runtime/3. Transcripción/model.safetensors,cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors,cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/quantized_weights.bin,cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors,cajita-luna-runtime/6. Sistema Inteligente/Anti-Alucinaciones/model.onnx,cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/clips_core_source_642.zip,cajita-luna-runtime/2. Orquestación/Multi + Interdisciplinar/APACHE_JENA_6_2_0.7z,cajita-luna-runtime/2. Orquestación/Orquestador/PLAYWRIGHT_1_63_0_SOURCE.7z,cajita-luna-runtime/4. Traductor Inteligente/Hermenéutica H-G/trealla-2.100.24.zip,cajita-luna-runtime/4. Traductor Inteligente/Traducción de lenguas antiguas/foma-master.zip,cajita-luna-runtime/6. Sistema Inteligente/Archivado Deteccion/siegfried_1-11-6_linux-x86_64_static.zip,cajita-luna-runtime/6. Sistema Inteligente/Consola/quickjs-linux-x86_64-2026-06-04.zip,cajita-luna-runtime/6. Sistema Inteligente/Memoria Gobernada/sqlite-amalgamation-3530400.zip,cajita-luna-runtime/6. Sistema Inteligente/Anti-Alucinaciones/ONNX_RUNTIME_1_29_0_CP311.7z,cajita-luna-runtime/6. Sistema Inteligente/Cognitive CI - CD/DAGGER_0_21_8_LINUX_AMD64.7z,cajita-luna-runtime/6. Sistema Inteligente/Cognitive CI - CD/OPA_STATIC_LINUX_AMD64_CANDIDATE.7z,cajita-luna-runtime/6. Sistema Inteligente/Migración y Persistencia/RQLITE_10_2_7_LINUX_AMD64.7z,cajita-luna-runtime/6. Sistema Inteligente/Migración y Persistencia/SQLITE_SOURCE_3_53_4.7z,cajita-luna-runtime/6. Sistema Inteligente/Motor - Protocolar/sml-1.2.0.zip,cajita-luna-runtime/6. Sistema Inteligente/Portabilidad base/CMAKE_4_4_3_WINDOWS_X64_OFFICIAL_BASE.7z,cajita-luna-runtime/6. Sistema Inteligente/Runtime Android Windows/AVALONIA_12_1_1_NUGET.7z,cajita-luna-runtime/6. Sistema Inteligente/Runtime Android Windows/TAURI_2_11_5_SOURCE_ZIP.7z'
          git lfs pull --include="$LFS_INCLUDE" --exclude="" origin "$GITHUB_SHA"
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            "cajita-luna-runtime/1. Cerebro/model.safetensors": ("e2516453d09285581bd6f3bf45a4c3a9fa6431bdc3dff56e7249d30e4e294ae0", 40489120),
            "cajita-luna-runtime/3. Transcripción/model.safetensors": ("67ee70beb2fb3529270a8169fbb6bd0f538912a064a6a303bec238647b4a5f5f", 10399882),
            "cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors": ("630aad9958f9c78603852c29c382b0fe9d63e64772e21dc6367875a91dc6a28f", 11720882),
            "cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/quantized_weights.bin": ("4a13b916b63b682a28c8fe89fc608b90d3bf5a8a77cb0988e1e19131c64ebc88", 13483380),
            "cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors": ("01eba827b9dd001a2352f0fd28a0bea229d3a5b3a78a41f3ea3e7c6c21995f56", 14956240),
            "cajita-luna-runtime/6. Sistema Inteligente/Anti-Alucinaciones/model.onnx": ("c6a266fe0f7f1f782094ff4b1e7ae3547fa48a22ab44712881cc03bba07bc5b7", 110516001),
          }
          for name, (digest, size) in expected.items():
            p = Path(name)
            if not p.is_file() or p.stat().st_size != size or hashlib.sha256(p.read_bytes()).hexdigest() != digest:
              raise SystemExit("WEIGHT_IDENTITY_MISMATCH:" + name)
          print("SIX_WEIGHTS_EXACT_HASH_AND_SIZE=PASS")
          PY

      - name: Exercise CUSTOSZ V9 as a bounded factory helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          REF='refs/heads/artifacts/custoszv9-b09353cbfff4efddfdec0cf853ae9658055fad2d'
          git fetch origin "+$REF:refs/remotes/origin/custoszv9-v9"
          git show refs/remotes/origin/custoszv9-v9:dist/CUSTOSZV9.pyz > "$RUNNER_TEMP/CUSTOSZV9.pyz"
          ACTUAL="$(sha256sum "$RUNNER_TEMP/CUSTOSZV9.pyz" | awk '{print $1}')"
          test "$ACTUAL" = "d585b351f617f4d5d134248e0c427d36ee0172b7ec32b0bdef6b7d381d394817"
          set +e
          python "$RUNNER_TEMP/CUSTOSZV9.pyz" --version > "$RUNNER_TEMP/custosz-version.txt" 2>&1
          VERSION_RC=$?
          python "$RUNNER_TEMP/CUSTOSZV9.pyz" crfu selftest > "$RUNNER_TEMP/custosz-selftest.txt" 2>&1
          SELFTEST_RC=$?
          set -e
          export VERSION_RC SELFTEST_RC
          python - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          report={"schema":"CUSTOSZV9_FACTORY_HELPER_EVIDENCE/1.0","artifact_sha256":"d585b351f617f4d5d134248e0c427d36ee0172b7ec32b0bdef6b7d381d394817","version_exit_code":int(os.environ["VERSION_RC"]),"selftest_exit_code":int(os.environ["SELFTEST_RC"]),"version_output":(root/"custosz-version.txt").read_text(errors="replace")[-2000:],"selftest_output":(root/"custosz-selftest.txt").read_text(errors="replace")[-6000:],"self_reported_certification":"NOT_GRANTED","authority":"BOUNDED_HELPER_ONLY_NOT_G23_OR_G24"}
          report["status"]="PASS_HELPER_TESTS" if report["version_exit_code"]==0 and report["selftest_exit_code"]==0 else "HELPER_TEST_FAILED"
          Path("out/CUSTOSZV9_EVIDENCE.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps({"status":report["status"],"certification":report["self_reported_certification"]},indent=2))
          PY
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 cryptography==44.0.3

      - name: Test manufacturing and anti-paralysis controls
        shell: bash
        env:
          PYTHONPATH: tools:scripts:cajita-luna-runtime
          CAJITA_STATE_DIR: ${{ runner.temp }}/cajita-state
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_cajita*.py' -v
          python - <<'PY'
          import yaml
          from pathlib import Path
          path = Path("integrations/kestra/flows/21-louksna1-release-audit.yml")
          flow = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert flow["id"] == "louksna1_release_audit"
          assert flow["namespace"] == "louksna.kestra"
          tasks = {task["id"]: task for task in flow["tasks"]}
          assert {"release_manifest", "g23_evidence", "g24_evidence", "task_adapter_evidence", "latest_factory_run", "gate"} <= set(tasks)
          gate = tasks["gate"]
          assert gate["type"] == "io.kestra.plugin.core.flow.If"
          assert "479000000" in gate["condition"]
          assert "NOT_GRANTED" in gate["condition"]
          assert ".id > 0" in gate["condition"]
          assert ".total_count > 0" not in gate["condition"]
          harness = Path("tools/cajita_task_e2e.py").read_text(encoding="utf-8")
          assert "synthetic_quality_acceptance" in harness
          assert "ESPEAK_NG_REQUIRED_FOR_KNOWN_SPEECH_FIXTURE" in harness
          print("LOUKSNA1_KESTRA_FLOW_STATIC_CONTRACT=PASS")
          PY
          python cajita-luna-runtime/cajita_antiparalysis.py selftest --state-dir "$RUNNER_TEMP/anti-paralysis-selftest"
          python cajita-luna-runtime/cajita_router.py selftest

      - name: Manufacture candidate and enforce aggregate 490 MB cap
        id: factory
        shell: bash
        env:
          PYTHONPATH: tools:scripts:cajita-luna-runtime
        run: |
          set +e
          python tools/cajita_runtime_factory.py --repo-root "$GITHUB_WORKSPACE" --output-dir out > "$RUNNER_TEMP/factory-output.txt" 2>&1
          RC=$?
          cat "$RUNNER_TEMP/factory-output.txt"
          if [ "$RC" -eq 0 ] && [ -s out/CAJITA_LUNA_RUNTIME_V10.macrodown ] && [ -s out/Louksna1.md ]; then
            echo "candidate_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "candidate_ready=false" >> "$GITHUB_OUTPUT"
          fi
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Upload exact candidate and factory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-candidate
          path: |
            out/Louksna1.md
            out/CAJITA_LUNA_RUNTIME_V10.macrodown
            out/CAJITA_LUNA_RUNTIME_V10.macrodown.sha256
            out/LOUKSNA1_RELEASE_MANIFEST.json
            out/factory-report.json
            out/CUSTOSZV9_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 90

      - name: Upload source-only module registry for safe candidate publication
        if: always() && hashFiles('out/stage/cajita-luna-runtime/module_registry.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cajita-source-module-registry
          path: out/stage/cajita-luna-runtime/module_registry.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload standalone Louksna1 document for direct retrieval
        if: always() && hashFiles('out/Louksna1.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-document
          path: out/Louksna1.md
          if-no-files-found: error
          retention-days: 90

      - name: Preserve rollback copies of original containers outside the runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-source-archive-rollback
          path: out/rollback-source-archives/**
          if-no-files-found: warn
          retention-days: 90

  g23-independent-validation:
    needs: manufacture
    if: needs.manufacture.result == 'success' && needs.manufacture.outputs.candidate_ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout exact producer commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.manufacture.outputs.source_commit }}
          lfs: false

      - name: Download candidate
        uses: actions/download-artifact@v4
        with:
          name: louksna1-candidate
          path: candidate

      - name: Set up independent validator Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned test-only YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 cryptography==44.0.3

      - name: Install archive extractor for independent externalized reconstruction
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Independently recompute package, document, modules and six weight identities
        shell: bash
        env:
          LOUKSNA_FACTORY_HEAD_SHA: ${{ needs.manufacture.outputs.source_commit }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, zipfile
          from pathlib import Path
          root=Path("candidate")
          # Runtime-container paths are validated separately by exact SHA-256/size.
          # They are storage representations, not files in the frozen logical tree.
          runtime_root=None
          externalized_container_paths=set()
          def canonical_tree_rows(directory):
            rows=[]
            for base, dirs, files in os.walk(directory, topdown=True, followlinks=False):
              bp=Path(base)
              if any((bp/child).is_symlink() for child in dirs):
                raise AssertionError("MODULE_SYMLINK_DIRECTORY:"+str(directory))
              dirs[:]=sorted(dirs)
              for name in sorted(files):
                path=bp/name
                if path.is_symlink() or not path.is_file():
                  raise AssertionError("MODULE_NON_REGULAR_FILE:"+str(path.relative_to(directory)))
                if name=="CAJITA_MODULE.json":
                  continue
                if runtime_root is not None:
                  try:
                    runtime_rel=path.resolve().relative_to(runtime_root).as_posix()
                  except ValueError:
                    runtime_rel=None
                  if runtime_rel in externalized_container_paths:
                    continue
                data=path.read_bytes()
                rows.append({"path":path.relative_to(directory).as_posix(),"bytes":len(data),"sha256":hashlib.sha256(data).hexdigest()})
            return sorted(rows,key=lambda row:row["path"].encode("utf-8"))
          def tree_sha256(rows):
            payload=json.dumps(rows,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode("utf-8")
            return hashlib.sha256(payload).hexdigest()
          def logical_tree_rows(directory):
            rows=canonical_tree_rows(directory)
            manifest_path=runtime/"CAJITA_COMPRESSED_TOKENIZER_MANIFEST.json"
            if manifest_path.is_file() and not manifest_path.is_symlink():
              try:
                return tokenizer_tree_rows(directory,runtime,rows)
              except TokenizerMaterializationError as exc:
                raise AssertionError("TOKENIZER_LOGICAL_TREE_IDENTITY:"+str(exc)) from exc
            return rows
          package=root/"CAJITA_LUNA_RUNTIME_V10.macrodown"
          doc=root/"Louksna1.md"
          report=json.loads((root/"factory-report.json").read_text())
          release=json.loads((root/"LOUKSNA1_RELEASE_MANIFEST.json").read_text())
          protected=Path("LOUKSNAMEJORADA.md").read_bytes()
          assert doc.read_bytes().startswith(protected), "PROTECTED_ARCHITECTURE_NOT_BYTE_EXACT_PREFIX"
          assert hashlib.sha256(protected).hexdigest()==release["protected_architecture"]["sha256"]
          assert hashlib.sha256(package.read_bytes()).hexdigest()==release["runtime_distribution"]["sha256"]
          assert hashlib.sha256(doc.read_bytes()).hexdigest()==release["louksna1"]["sha256"]
          assert package.stat().st_size+doc.stat().st_size<=479_000_000, "COMBINED_SIZE_GATE"
          with zipfile.ZipFile(package) as z:
            assert z.testzip() is None, "ZIP_CRC"
            names=z.namelist()
            assert len(names)==len(set(names)), "DUPLICATE_MEMBERS"
            assert not any(Path(n).name.upper().startswith("README") for n in names), "README_MEMBER"
            placement=json.loads(z.read("EXTERNALIZED_ASSET_PLACEMENT.json"))
            assets=placement.get("assets",[])
            expected_ids={
              "APACHE_JENA_6_2_0","PLAYWRIGHT_1_63_0_SOURCE","ONNX_RUNTIME_1_29_0_CP311",
              "DAGGER_0_21_8_LINUX_AMD64","OPA_STATIC_LINUX_AMD64_CANDIDATE","RQLITE_10_2_7_LINUX_AMD64",
              "SQLITE_SOURCE_3_53_4","CMAKE_4_4_3_WINDOWS_X64_OFFICIAL_BASE","AVALONIA_12_1_1_NUGET",
              "TAURI_2_11_5_SOURCE_ZIP",
            }
            assert len(assets)==10 and {x.get("id") for x in assets}==expected_ids, "EXTERNALIZED_ASSET_ID_SET"
            allowed_archives={}
            for asset in assets:
              meta=asset.get("compact_runtime_container",{})
              full_path=meta.get("path","")
              prefix="cajita-luna-runtime/"
              assert isinstance(full_path,str) and full_path.startswith(prefix), "EXTERNALIZED_ARCHIVE_PATH_PREFIX"
              rel=full_path[len(prefix):]
              assert Path(rel).suffix.lower()==".7z", "EXTERNALIZED_ARCHIVE_SUFFIX:"+str(asset.get("id"))
              assert asset.get("placed_path")==full_path and rel not in allowed_archives, "EXTERNALIZED_ARCHIVE_PATH_COLLISION"
              size=meta.get("size_bytes")
              digest=meta.get("sha256")
              assert isinstance(size,int) and not isinstance(size,bool) and size>0, "EXTERNALIZED_ARCHIVE_SIZE"
              assert isinstance(digest,str) and len(digest)==64 and all(c in "0123456789abcdef" for c in digest), "EXTERNALIZED_ARCHIVE_SHA256"
              allowed_archives[rel]={"id":asset["id"],"bytes":size,"sha256":digest}
            archive_members={name for name in names if Path(name).suffix.lower() in {".zip",".7z"}}
            assert archive_members==set(allowed_archives), "ARCHIVE_MEMBER_SET_MISMATCH:"+json.dumps({"expected":sorted(allowed_archives),"actual":sorted(archive_members)})
            for name,expected in allowed_archives.items():
              payload=z.read(name)
              assert len(payload)==expected["bytes"] and hashlib.sha256(payload).hexdigest()==expected["sha256"], "EXTERNALIZED_ARCHIVE_HASH_OR_SIZE:"+expected["id"]
            m=json.loads(z.read("MACRODOWN_MANIFEST.json"))
            table={x["path"]:x for x in m["files"]}
            assert set(table)==set(names)-{"MACRODOWN_MANIFEST.json"}, "MANIFEST_SET"
            for name,row in table.items():
              data=z.read(name)
              assert len(data)==int(row["size_bytes"]) and hashlib.sha256(data).hexdigest()==row["sha256"], "MEMBER_HASH:"+name
            (root/"runtime").mkdir()
            for name in names:
              if name=="MACRODOWN_MANIFEST.json": continue
              target=root/"runtime"/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(z.read(name))
          runtime=root/"runtime"
          runtime_root=runtime.resolve()
          externalized_container_paths=set(allowed_archives)
          assert len(externalized_container_paths)==10, "EXTERNALIZED_CONTAINER_LOGICAL_PATH_SET"
          import sys
          sys.path.insert(0,str(runtime))
          from cajita_tokenizer_materializer import tokenizer_tree_rows, TokenizerMaterializationError
          routing=json.loads((runtime/"command_subdomain_routing.json").read_text())
          assert routing["domain_order"]==["D01_CEREBRO","D02_ORQUESTACION","D03_TRANSCRIPCION","D04_TRADUCTOR_INTELIGENTE","D05_INTELIGENCIA_DOCUMENTAL","D06_SISTEMA_INTELIGENTE"]
          assert len(routing["engine_registry"])==15 and len(routing["route_profiles"])==14 and len(routing["targets"])==21
          # The compact distribution excludes the source-only registry and carries
          # its derived registry with the same 21 target declarations.
          source_registry_path=runtime/"module_registry.json"
          distribution_registry_path=runtime/"CAJITA_DISTRIBUTION_MODULE_REGISTRY.json"
          assert not (source_registry_path.exists() and distribution_registry_path.exists()), "SOURCE_AND_DISTRIBUTION_REGISTRIES_MUST_NOT_COEXIST"
          registry_path=source_registry_path if source_registry_path.is_file() and not source_registry_path.is_symlink() else distribution_registry_path
          assert registry_path.is_file() and not registry_path.is_symlink(), "DISTRIBUTION_MODULE_REGISTRY_MISSING"
          registry=json.loads(registry_path.read_text())
          assert registry["schema"]=="CAJITA_MODULE_REGISTRY/1.0"
          assert registry_path.name=="CAJITA_DISTRIBUTION_MODULE_REGISTRY.json", "SOURCE_REGISTRY_NOT_ALLOWED_IN_COMPACT_DISTRIBUTION"
          profile=registry["distribution_profile"]
          assert profile["policy"]=="PACK_CONTAINER_ONCE_AND_RECONSTRUCT_EXPANDED_TREE_ON_DEMAND"
          assert profile["certification"]=="NOT_GRANTED"
          externalized=registry.get("externalized_modules",[])
          assert len(externalized)==10 and len({row["canonical_asset_id"] for row in externalized})==10
          for row in externalized:
            container=runtime/row["container_path"]
            assert container.is_file() and not container.is_symlink(), "EXTERNALIZED_CONTAINER_MISSING:"+row["canonical_asset_id"]
            payload=container.read_bytes()
            assert len(payload)==int(row["container_bytes"]) and hashlib.sha256(payload).hexdigest()==row["container_sha256"], "EXTERNALIZED_CONTAINER_HASH_OR_SIZE:"+row["canonical_asset_id"]
          # The package intentionally omits expanded externalized trees. Rebuild
          # those exact trees from the hash-pinned containers before recomputing
          # target-level tree counts and hashes; never weaken the frozen checks.
          asset_ids=sorted((row["canonical_asset_id"] for row in externalized))
          assert set(asset_ids)=={asset["id"] for asset in assets}, "EXTERNALIZED_REGISTRY_PLACEMENT_ID_SET"
          materialization_results=[]
          for asset_id in asset_ids:
            command=[sys.executable,str(runtime/"cajita_runtime.py"),"materialize-asset","--asset-id",asset_id,"--root",str(runtime)]
            result=subprocess.run(command,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=1800,check=False)
            if result.returncode != 0:
              raise AssertionError("G23_EXTERNALIZED_MATERIALIZATION:"+asset_id+":"+result.stderr[-3000:]+result.stdout[-1000:])
            evidence=json.loads(result.stdout)
            assert evidence.get("id")==asset_id and evidence.get("status") in {"PASS_MATERIALIZED_FROM_HASH_PINNED_CONTAINER","ALREADY_MATERIALIZED_EXACT"}, "G23_EXTERNALIZED_MATERIALIZATION_STATUS:"+asset_id
            materialization_results.append({"id":asset_id,"status":evidence["status"],"bytes":evidence.get("bytes"),"file_count":evidence.get("file_count"),"tree_sha256":evidence.get("tree_sha256")})
          print(json.dumps({"g23_externalized_reconstruction":"PASS","asset_count":len(materialization_results),"assets":materialization_results},ensure_ascii=False))
          assert registry["materialized_module_count"]>=1
          assert registry["canonical_target_module_count"] == 21
          assert len(registry["target_modules"]) == 21
          for target_module in registry["target_modules"]:
            target_manifest = runtime / target_module["manifest"]
            assert target_manifest.is_file() and not target_manifest.is_symlink()
            manifest_bytes = target_manifest.read_bytes()
            assert hashlib.sha256(manifest_bytes).hexdigest() == target_module["manifest_sha256"], "TARGET_MODULE_MANIFEST_HASH:" + target_module["target_id"]
            target_data = json.loads(manifest_bytes)
            assert target_data["target_id"] == target_module["target_id"]
            target_dir = runtime / target_module["path"]
            assert target_dir.is_dir() and not target_dir.is_symlink()
            actual_rows = logical_tree_rows(target_dir)
            actual_tree_hash = tree_sha256(actual_rows)
            recorded = target_data["tree_integrity"]
            if len(actual_rows) != int(recorded["file_count_excluding_module_descriptors"]):
              source_dir = Path("cajita-luna-runtime") / target_module["path"]
              source_rows = canonical_tree_rows(source_dir) if source_dir.is_dir() and not source_dir.is_symlink() else []
              source_names = {row["path"] for row in source_rows}
              actual_names = {row["path"] for row in actual_rows}
              missing = sorted(source_names - actual_names, key=lambda x:x.encode("utf-8"))[:20]
              extra = sorted(actual_names - source_names, key=lambda x:x.encode("utf-8"))[:20]
              raise AssertionError("TARGET_MODULE_FILE_COUNT:" + target_module["target_id"] + ":expected=" + str(recorded["file_count_excluding_module_descriptors"]) + ":actual=" + str(len(actual_rows)) + ":source=" + str(len(source_rows)) + ":missing=" + json.dumps(missing) + ":extra=" + json.dumps(extra))
            actual_bytes = sum(row["bytes"] for row in actual_rows)
            expected_bytes = int(recorded["bytes_excluding_module_descriptors"])
            if actual_bytes != expected_bytes:
              raise AssertionError("TARGET_MODULE_BYTE_COUNT:" + target_module["target_id"] + ":" + json.dumps({
                "manifest_path": target_module["manifest"],
                "manifest_sha256": target_module["manifest_sha256"],
                "registry_tree_sha256": target_module["tree_sha256"],
                "manifest_tree_sha256": recorded["sha256"],
                "actual_tree_sha256": actual_tree_hash,
                "expected_bytes": expected_bytes,
                "actual_bytes": actual_bytes,
                "difference_bytes": actual_bytes - expected_bytes,
                "expected_file_count": int(recorded["file_count_excluding_module_descriptors"]),
                "actual_file_count": len(actual_rows),
                "file_bytes": [{"path": row["path"], "bytes": row["bytes"], "sha256": row["sha256"]} for row in actual_rows],
              }, ensure_ascii=False, sort_keys=True))
            assert actual_tree_hash == target_module["tree_sha256"], "TARGET_MODULE_TREE_HASH:" + target_module["target_id"]
            assert actual_tree_hash == recorded["sha256"], "TARGET_MODULE_MANIFEST_TREE_HASH:" + target_module["target_id"]
          binding_meta = registry["axiom_interdisciplinary_binding"]
          binding_path = runtime / binding_meta["path"]
          assert binding_path.is_file()
          binding = json.loads(binding_path.read_text())
          assert binding["status"] == "SOURCE_BOUND_GRAPH_EXECUTION_PENDING"
          assert binding["target"]["id"] == "D02_MULTI_INTERDISCIPLINAR"
          assert binding["axiom_inventory"]["range"] == "AX0001-AX12414"
          assert binding["axiom_inventory"]["declared_materialized_count"] == 11757
          assert binding["axiom_inventory"]["declared_historical_gap_count"] == 657
          assert binding["block_inventory"]["range"] == "B1-B134"
          assert binding["framework_count"] == 18
          for module in registry["modules"]:
            path=runtime/module["manifest"]
            assert path.is_file() and not path.is_symlink()
            manifest_bytes=path.read_bytes()
            assert hashlib.sha256(manifest_bytes).hexdigest()==module["manifest_sha256"], "MATERIALIZED_MODULE_MANIFEST_HASH:"+module["module_key"]
            manifest=json.loads(manifest_bytes)
            assert manifest["materialization"]["status"]=="PASS"
            assert manifest["module_key"]==module["module_key"]
            module_dir=runtime/module["module_key"]
            assert module_dir.is_dir() and not module_dir.is_symlink()
            rows=logical_tree_rows(module_dir)
            assert len(rows)==int(manifest["materialization"]["file_count"]), "MATERIALIZED_MODULE_FILE_COUNT:"+module["module_key"]
            assert sum(row["bytes"] for row in rows)==int(manifest["materialization"]["bytes"]), "MATERIALIZED_MODULE_BYTE_COUNT:"+module["module_key"]
            assert tree_sha256(rows)==module["tree_sha256"], "MATERIALIZED_MODULE_TREE_HASH:"+module["module_key"]
          weights=json.loads((runtime/"CAJITA_RUNTIME_V1/weights_manifest.json").read_text())
          for w in weights["artifacts"]:
            p=runtime/w["path"]
            assert p.is_file() and p.stat().st_size==int(w["bytes"]) and hashlib.sha256(p.read_bytes()).hexdigest()==w["sha256"], "WEIGHT:"+w["id"]
          print(json.dumps({"status":"PASS","scope":"DISTRIBUTION_HASHES_STRUCTURE_MATERIALIZATION_WEIGHT_IDENTITY","combined_bytes":package.stat().st_size+doc.stat().st_size,"package_sha256":hashlib.sha256(package.read_bytes()).hexdigest(),"louksna1_sha256":hashlib.sha256(doc.read_bytes()).hexdigest(),"domains":6,"engines":15,"commands":14,"targets":21,"global_certification":"NOT_GRANTED"},indent=2))
          PY
          PYTHONPATH=tools:scripts:candidate/runtime python -m unittest discover -s tests -p 'test_cajita*.py' -v
          python candidate/runtime/cajita_antiparalysis.py selftest --state-dir "$RUNNER_TEMP/g23-antiparalysis"
          python tools/cajita_axiom_source_loader.py --runtime-root candidate/runtime --companion candidate/Louksna1.md
          (cd candidate/runtime && python cajita_router.py selftest)
          python candidate/runtime/cajita_runtime.py selftest --root candidate/runtime
          python candidate/runtime/cajita_runtime.py audit-weights --root candidate/runtime
          (cd candidate/runtime && python "2. Orquestación/Orquestador/CLIs/cli_registry.py" --self-test)
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path("candidate"); p=root/"CAJITA_LUNA_RUNTIME_V10.macrodown"; d=root/"Louksna1.md"
          source_commit=os.environ["LOUKSNA_FACTORY_HEAD_SHA"]
          assert len(source_commit)==40 and all(ch in "0123456789abcdef" for ch in source_commit), "G23_SOURCE_COMMIT_INVALID"
          out={"schema":"LOUKSNA1_G23_EVIDENCE/1.0","gate":"G23","status":"PASS","independent_job":True,"source_commit":source_commit,"package_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"package_bytes":p.stat().st_size,"louksna1_sha256":hashlib.sha256(d.read_bytes()).hexdigest(),"louksna1_bytes":d.stat().st_size,"combined_bytes":p.stat().st_size+d.stat().st_size,"combined_cap_bytes":479000000,"certification_scope":"DISTRIBUTION_INTEGRITY_STRUCTURE_WEIGHT_IDENTITY_AND_REGISTERED_SMOKES","task_adapter_completion":"NOT_ESTABLISHED","semantic_quality_equivalence":"NOT_ESTABLISHED","global_certification":"NOT_GRANTED"}
          Path("candidate/G23_EVIDENCE.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out,indent=2))
          PY

      - name: Upload independent G23 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-g23-evidence
          path: candidate/G23_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 90

  g24-resource-limited-runtime-smoke:
    needs: [manufacture, g23-independent-validation]
    if: needs.manufacture.outputs.candidate_ready == 'true' && needs.g23-independent-validation.result == 'success'
    outputs:
      gate_pass: ${{ steps.resource_limited_smoke.outputs.gate_pass }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact producer commit for the E2E harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.manufacture.outputs.source_commit }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Verify E2E harness is a regular checked-out file
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/cajita_task_e2e.py
          test ! -L tools/cajita_task_e2e.py
          test -s tools/cajita_task_e2e.py
          python -m py_compile tools/cajita_task_e2e.py

      - name: Download candidate for runtime smoke
        uses: actions/download-artifact@v4
        with:
          name: louksna1-candidate
          path: evidence/louksna1-candidate

      - name: Download G23 evidence for runtime smoke
        uses: actions/download-artifact@v4
        with:
          name: louksna1-g23-evidence
          path: evidence/louksna1-g23-evidence

      - name: Execute six-domain smoke under one CPU and 1 GiB cgroup limits
        id: resource_limited_smoke
        shell: bash
        run: |
          set +e
          ROOT="$RUNNER_TEMP/cajita-runtime"
          mkdir -p "$ROOT"
          unzip -q "evidence/louksna1-candidate/CAJITA_LUNA_RUNTIME_V10.macrodown" -d "$ROOT"
          DOCKERCTX="$RUNNER_TEMP/cajita-smoke-image"
          mkdir -p "$DOCKERCTX"
          cat > "$DOCKERCTX/Dockerfile" <<'EOF'
          FROM python:3.13-slim-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends espeak-ng build-essential \
              && rm -rf /var/lib/apt/lists/* \
              && pip install --no-cache-dir --extra-index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu numpy==2.2.6 safetensors==0.8.0 transformers==4.57.6 sentencepiece==0.2.2 tokenizers==0.22.2 pillow==13.0.0 Jinja2==3.1.6 protobuf==4.25.9 PyYAML==6.0.3
          EOF
          docker build -t cajita-louksna1-smoke "$DOCKERCTX" > "$RUNNER_TEMP/docker-build.log" 2>&1
          BUILD_RC=$?
          STATUS="NOT_GRANTED"
          REASON="RESOURCE_LIMITED_SMOKE_NOT_COMPLETED"
          PEAK=""
          MEMMAX=""
          CPUMAX=""
          SMOKE_RC=125
          TASK_RC=125
          CONTAINER_RC=125
          if [ "$BUILD_RC" -eq 0 ]; then
            docker run --rm --memory=1073741824 --memory-swap=1073741824 --cpus=1 \
              -e OMP_NUM_THREADS=1 -e OPENBLAS_NUM_THREADS=1 -e MKL_NUM_THREADS=1 -e NUMEXPR_NUM_THREADS=1 \
              -e TOKENIZERS_PARALLELISM=false -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 \
              -e LOUKSNA1_COMPANION_PATH=/telemetry/Louksna1.md \
              -v "$ROOT:/runtime:ro" -v "$RUNNER_TEMP:/telemetry:rw" \
              -v "$GITHUB_WORKSPACE/evidence/louksna1-candidate/Louksna1.md:/telemetry/Louksna1.md:ro" \
              -v "$GITHUB_WORKSPACE/tools/cajita_task_e2e.py:/harness/cajita_task_e2e.py:ro" -w /runtime \
              cajita-louksna1-smoke sh -lc \
              'cat /sys/fs/cgroup/memory.max > /telemetry/cgroup-memory-max.txt; cat /sys/fs/cgroup/cpu.max > /telemetry/cgroup-cpu-max.txt; python cajita_runtime.py smoke-all --timeout 600 > /telemetry/smoke-all.log 2>&1; smoke_rc=$?; echo "$smoke_rc" > /telemetry/smoke-all.rc; python /harness/cajita_task_e2e.py --root /runtime --output-dir /telemetry/task-adapter-fixtures --output /telemetry/task-adapter-e2e-raw.json --timeout 900 > /telemetry/task-adapter-e2e.log 2>&1; task_rc=$?; echo "$task_rc" > /telemetry/task-adapter-e2e.rc; cat /sys/fs/cgroup/memory.peak > /telemetry/cgroup-memory-peak.txt; if [ "$smoke_rc" -eq 0 ] && [ "$task_rc" -eq 0 ]; then exit 0; else exit 1; fi'
            CONTAINER_RC=$?
            SMOKE_RC="$(cat "$RUNNER_TEMP/smoke-all.rc" 2>/dev/null || echo "$CONTAINER_RC")"
            TASK_RC="$(cat "$RUNNER_TEMP/task-adapter-e2e.rc" 2>/dev/null || echo 125)"
            if [ -f "$RUNNER_TEMP/smoke-all.log" ]; then
              echo "=== CAJITA_SMOKE_DIAGNOSTICS_BEGIN ==="
              cat "$RUNNER_TEMP/smoke-all.log"
              echo "=== CAJITA_SMOKE_DIAGNOSTICS_END ==="
            fi
            if [ -f "$RUNNER_TEMP/task-adapter-e2e.log" ]; then
              echo "=== CAJITA_TASK_ADAPTER_E2E_DIAGNOSTICS_BEGIN ==="
              cat "$RUNNER_TEMP/task-adapter-e2e.log"
              echo "=== CAJITA_TASK_ADAPTER_E2E_DIAGNOSTICS_END ==="
            fi
            if [ -f "$RUNNER_TEMP/task-adapter-e2e-raw.json" ]; then
              echo "=== CAJITA_TASK_ADAPTER_E2E_RESULT_BEGIN ==="
              cat "$RUNNER_TEMP/task-adapter-e2e-raw.json"
              echo "=== CAJITA_TASK_ADAPTER_E2E_RESULT_END ==="
            fi
            MEMMAX="$(cat "$RUNNER_TEMP/cgroup-memory-max.txt" 2>/dev/null)"
            CPUMAX="$(cat "$RUNNER_TEMP/cgroup-cpu-max.txt" 2>/dev/null)"
            PEAK="$(cat "$RUNNER_TEMP/cgroup-memory-peak.txt" 2>/dev/null)"
            if [ "$SMOKE_RC" -eq 0 ] && [ "$TASK_RC" -eq 0 ] && [ "$MEMMAX" = "1073741824" ] && [ "$CPUMAX" = "100000 100000" ] && [ -n "$PEAK" ] && [ "$PEAK" -le 1073741824 ]; then
              STATUS="PASS_FOR_DECLARED_SYNTHETIC_FUNCTIONAL_E2E_SCOPE"
              REASON="SIX_DOMAIN_SMOKE_PLUS_FIVE_KNOWN_ANSWER_MODEL_TASKS_PLUS_SIX_SOURCE_BOUND_TARGET_ENGINE_SMOKES_PASS_WITH_EFFECTIVE_ONE_CPU_1_GIB_LIMITS"
            else
              REASON="SMOKE_TASK_ADAPTER_OR_RESOURCE_GATE_FAILED_SMOKE_RC_${SMOKE_RC}_TASK_RC_${TASK_RC}"
            fi
          else
            REASON="SMOKE_IMAGE_BUILD_FAILED"
          fi
          export STATUS REASON PEAK MEMMAX CPUMAX SMOKE_RC TASK_RC BUILD_RC
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path("evidence/louksna1-candidate/CAJITA_LUNA_RUNTIME_V10.macrodown")
          d=Path("evidence/louksna1-candidate/Louksna1.md")
          raw_path=Path(os.environ["RUNNER_TEMP"])/"task-adapter-e2e-raw.json"
          task_report=json.loads(raw_path.read_text(encoding="utf-8")) if raw_path.is_file() else {"status":"NOT_COMPLETED","task_results":[]}
          release=json.loads(Path("evidence/louksna1-candidate/LOUKSNA1_RELEASE_MANIFEST.json").read_text(encoding="utf-8"))
          task_report["source_commit"]=release.get("source_commit")
          task_bytes=(json.dumps(task_report,sort_keys=True,ensure_ascii=False,indent=2)+"\n").encode("utf-8")
          task_path=Path("evidence/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json")
          task_path.parent.mkdir(parents=True,exist_ok=True)
          task_path.write_bytes(task_bytes)
          task_sha=hashlib.sha256(task_bytes).hexdigest()
          task_status=task_report.get("status","NOT_COMPLETED")
          task_rows=task_report.get("task_results",[])
          target_engine_rows=task_report.get("target_engine_results",[])
          target_engine_pass_count=sum(1 for x in target_engine_rows if x.get("status")=="PASS_TARGET_ENGINE_EXECUTION" and x.get("exit_code")==0)
          target_engine_expected_count=task_report.get("target_engine_expected_count",6)
          target_engine_status=task_report.get("target_engine_smoke_status","NOT_COMPLETED")
          result={"schema":"LOUKSNA1_G24_EVIDENCE/1.0","gate":"G24","status":os.environ["STATUS"],
            "decision":os.environ["STATUS"] if os.environ["STATUS"].startswith("PASS_") else "NOT_GRANTED",
            "package_sha256":hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None,
            "louksna1_sha256":hashlib.sha256(d.read_bytes()).hexdigest() if d.is_file() else None,
            "source_commit":release.get("source_commit"),"reason":os.environ["REASON"],
            "smoke_return_code":int(os.environ["SMOKE_RC"]),"task_adapter_return_code":int(os.environ.get("TASK_RC","125")),
            "task_adapter_evidence_sha256":task_sha,"task_adapter_evidence_status":task_status,
            "task_adapter_pass_count":sum(1 for x in task_rows if x.get("status")=="PASS_FUNCTIONAL_EXECUTION" and x.get("exit_code")==0),
            "task_adapter_expected_count":5,
            "target_engine_smoke_status":target_engine_status,
            "target_engine_pass_count":target_engine_pass_count,
            "target_engine_expected_count":target_engine_expected_count,
            "target_engine_scope":"SIX_SOURCE_BOUND_RUNTIME_ENGINE_SMOKES_ONLY",
            "target_engine_task_coverage":"NOT_ESTABLISHED",
            "image_build_return_code":int(os.environ["BUILD_RC"]),
            "memory_max_bytes":os.environ.get("MEMMAX") or None,"cpu_quota":os.environ.get("CPUMAX") or None,
            "memory_peak_bytes":int(os.environ["PEAK"]) if os.environ.get("PEAK","").isdigit() else None,
            "scope":"SIX_DOMAIN_STARTUP_SMOKE_PLUS_FIVE_KNOWN_ANSWER_SYNTHETIC_MODEL_TASKS_PLUS_SIX_SOURCE_BOUND_TARGET_ENGINE_SMOKES_AND_FAIL_CLOSED_ORCHESTRATION_GUARD",
            "task_adapters":"PASS_FOR_DECLARED_SCOPE" if task_status=="PASS_SYNTHETIC_END_TO_END_EXECUTION_ONLY" else "FAIL_OR_NOT_COMPLETED",
            "semantic_quality_equivalence":"NOT_ESTABLISHED","all_21_target_adapters":"NOT_ESTABLISHED",
            "runtime_engine_scope_registration":"NOT_A_CONSUMER_TASK_ADAPTER_COMPLETION",
            "reference_quality_equivalence":"NOT_ESTABLISHED",
            "native_hardware_validation":"REQUIRED",
            "global_integrated_product_certification":"NOT_GRANTED"}
          Path("evidence/LOUKSNA1_G24_EVIDENCE.json").write_text(json.dumps(result,indent=2,ensure_ascii=False)+"\n",encoding="utf-8")
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY
          if [ "$STATUS" = "PASS_FOR_DECLARED_SYNTHETIC_FUNCTIONAL_E2E_SCOPE" ]; then
            echo "gate_pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "gate_pass=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload standalone G24 decision for release gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-g24-evidence
          path: |
            evidence/LOUKSNA1_G24_EVIDENCE.json
            evidence/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload G24 runtime telemetry separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-g24-telemetry
          path: |
            ${{ runner.temp }}/smoke-all.log
            ${{ runner.temp }}/docker-build.log
            ${{ runner.temp }}/cgroup-memory-max.txt
            ${{ runner.temp }}/cgroup-cpu-max.txt
            ${{ runner.temp }}/cgroup-memory-peak.txt
            ${{ runner.temp }}/task-adapter-e2e.log
            ${{ runner.temp }}/task-adapter-e2e-raw.json
            ${{ runner.temp }}/task-adapter-e2e.rc
            ${{ runner.temp }}/smoke-all.rc
          if-no-files-found: warn
          retention-days: 90

      - name: Require G24 pass before treating the factory workflow as successful
        if: always()
        shell: bash
        env:
          G24_GATE_PASS: ${{ steps.resource_limited_smoke.outputs.gate_pass }}
        run: |
          set -euo pipefail
          if [ "$G24_GATE_PASS" != "true" ]; then
            echo "G24=FAIL_CLOSED; candidate publication remains blocked"
            exit 1
          fi
          echo "G24=PASS_FOR_DECLARED_SYNTHETIC_FUNCTIONAL_E2E_SCOPE"

  publish-candidate:
    needs: [manufacture, g23-independent-validation, g24-resource-limited-runtime-smoke]
    if: needs.manufacture.outputs.candidate_ready == 'true' && needs.g23-independent-validation.result == 'success' && needs.g24-resource-limited-runtime-smoke.result == 'success' && needs.g24-resource-limited-runtime-smoke.outputs.gate_pass == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout current main, no branch and no pull request
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Download product candidate
        uses: actions/download-artifact@v4
        with:
          name: louksna1-candidate
          path: downloaded/louksna1-candidate

      - name: Download source-only module registry
        uses: actions/download-artifact@v4
        with:
          name: cajita-source-module-registry
          path: downloaded/cajita-source-module-registry

      - name: Download independent G23 evidence
        uses: actions/download-artifact@v4
        with:
          name: louksna1-g23-evidence
          path: downloaded/louksna1-g23-evidence

      - name: Download independent G24 evidence
        uses: actions/download-artifact@v4
        with:
          name: louksna1-g24-evidence
          path: downloaded/louksna1-g24-evidence

      - name: Verify exact source prefix, record gate states, and commit the candidate directly
        shell: bash
        run: |
          set -euo pipefail
          FACTORY="downloaded/louksna1-candidate"
          G23="downloaded/louksna1-g23-evidence/G23_EVIDENCE.json"
          G24="downloaded/louksna1-g24-evidence/LOUKSNA1_G24_EVIDENCE.json"
          TASK_EVIDENCE="downloaded/louksna1-g24-evidence/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json"
          test -s "$G23"
          test -s "$TASK_EVIDENCE"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path("downloaded/louksna1-candidate/Louksna1.md").read_bytes()
          protected=Path("LOUKSNAMEJORADA.md").read_bytes()
          assert d.startswith(protected), "PROTECTED_ARCHITECTURE_PREFIX_CHANGED"
          report=json.loads(Path("downloaded/louksna1-candidate/LOUKSNA1_RELEASE_MANIFEST.json").read_text())
          assert hashlib.sha256(protected).hexdigest()==report["protected_architecture"]["sha256"]
          g23=json.loads(Path("downloaded/louksna1-g23-evidence/G23_EVIDENCE.json").read_text())
          g24path=Path("downloaded/louksna1-g24-evidence/LOUKSNA1_G24_EVIDENCE.json")
          g24=json.loads(g24path.read_text()) if g24path.is_file() else {"status":"NOT_GRANTED","reason":"G24_EVIDENCE_MISSING"}
          task_path=Path("downloaded/louksna1-g24-evidence/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json")
          task=json.loads(task_path.read_text(encoding="utf-8")) if task_path.is_file() else {"status":"NOT_GRANTED"}
          report["gates"]={"G23":g23.get("status","NOT_GRANTED"),"G24":g24.get("status","NOT_GRANTED")}
          report["task_adapter_evidence"]={"path":"docs/cajita-luna/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json","sha256":hashlib.sha256(task_path.read_bytes()).hexdigest() if task_path.is_file() else None,"status":task.get("status","NOT_GRANTED"),"tested_model_domain_count":task.get("tested_model_domain_count",0),"registered_model_domain_count":task.get("registered_model_domain_count",0)}
          report["G23_evidence_sha256"]=hashlib.sha256(Path("downloaded/louksna1-g23-evidence/G23_EVIDENCE.json").read_bytes()).hexdigest()
          report["G24_evidence_sha256"]=hashlib.sha256(g24path.read_bytes()).hexdigest() if g24path.is_file() else None
          report["global_certification"]="NOT_GRANTED"
          report["certification_scope"]="DISTRIBUTION_INTEGRITY_PLUS_SCOPED_SYNTHETIC_TASK_EXECUTION"
          report["reason_global_certification_not_granted"]="Five synthetic model-domain tasks have scoped execution evidence only; all 21 target adapters, graph execution and semantic quality equivalence remain unestablished."
          report["status"]="PUBLISHED_CANDIDATE_GLOBAL_CERTIFICATION_NOT_GRANTED"
          report["CUSTOSZV9"]={"used_as":"BOUNDED_FACTORY_HELPER","self_reported_certification":"NOT_GRANTED","not_used_as_independent_certifier":True}
          Path("downloaded/louksna1-candidate/LOUKSNA1_RELEASE_MANIFEST.json").write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n")
          PY
          git lfs install
          mkdir -p "$RUNNER_TEMP/cajita-unpacked"
          unzip -q "$FACTORY/CAJITA_LUNA_RUNTIME_V10.macrodown" -d "$RUNNER_TEMP/cajita-unpacked"
          test -s "$RUNNER_TEMP/cajita-unpacked/MACRODOWN_MANIFEST.json"
          rsync -a --delete "$RUNNER_TEMP/cajita-unpacked/" "cajita-luna-runtime/"
          # The compact Macrodown intentionally excludes the full source registry.
          # Restore the exact stage-built registry as a separate governed source artifact.
          SOURCE_REGISTRY="downloaded/cajita-source-module-registry/module_registry.json"
          test -s "$SOURCE_REGISTRY"
          test ! -L "$SOURCE_REGISTRY"
          cp "$SOURCE_REGISTRY" cajita-luna-runtime/module_registry.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("cajita-luna-runtime")
          source_path = root / "module_registry.json"
          distribution_path = root / "CAJITA_DISTRIBUTION_MODULE_REGISTRY.json"
          if source_path.is_symlink() or not source_path.is_file():
              raise SystemExit("SOURCE_MODULE_REGISTRY_NOT_REGULAR_AFTER_RESTORE")
          source_bytes = source_path.read_bytes()
          source = json.loads(source_bytes)
          distribution = json.loads(distribution_path.read_text(encoding="utf-8"))
          if source.get("schema") != "CAJITA_MODULE_REGISTRY/1.0":
              raise SystemExit("SOURCE_MODULE_REGISTRY_SCHEMA_INVALID")
          if len(source.get("modules", [])) != 28:
              raise SystemExit("SOURCE_MODULE_REGISTRY_COUNT_INVALID")
          if source.get("canonical_target_module_count") != 21 or len(source.get("target_modules", [])) != 21:
              raise SystemExit("SOURCE_CANONICAL_TARGET_REGISTRY_INVALID")
          actual_sha = hashlib.sha256(source_bytes).hexdigest()
          if distribution.get("source_module_registry_sha256") != actual_sha:
              raise SystemExit("SOURCE_DISTRIBUTION_REGISTRY_BINDING_MISMATCH")
          print(json.dumps({"status":"PASS_SOURCE_REGISTRY_RESTORED","source_registry_sha256":actual_sha,"materialized_module_count":len(source["modules"]),"canonical_target_module_count":len(source["target_modules"]),"distribution_registry_bound":True}))
          PY
          cp "$FACTORY/Louksna1.md" Louksna1.md
          mkdir -p docs/cajita-luna
          cp "$FACTORY/LOUKSNA1_RELEASE_MANIFEST.json" docs/cajita-luna/LOUKSNA1_RELEASE_MANIFEST.json
          cp "$FACTORY/factory-report.json" docs/cajita-luna/CAJITA_LOUKSNA1_FACTORY_REPORT.json
          cp "$G23" docs/cajita-luna/LOUKSNA1_G23_EVIDENCE.json
          if [ -s "$G24" ]; then cp "$G24" docs/cajita-luna/LOUKSNA1_G24_EVIDENCE.json; fi
          cp "$TASK_EVIDENCE" docs/cajita-luna/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json
          if [ -s "$FACTORY/CUSTOSZV9_EVIDENCE.json" ]; then cp "$FACTORY/CUSTOSZV9_EVIDENCE.json" docs/cajita-luna/CUSTOSZV9_FACTORY_HELPER_EVIDENCE.json; fi
          git diff --check
          git add -f -A -- cajita-luna-runtime
          git add -A -- Louksna1.md docs/cajita-luna/LOUKSNA1_RELEASE_MANIFEST.json docs/cajita-luna/CAJITA_LOUKSNA1_FACTORY_REPORT.json docs/cajita-luna/LOUKSNA1_G23_EVIDENCE.json docs/cajita-luna/LOUKSNA1_G24_EVIDENCE.json docs/cajita-luna/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json docs/cajita-luna/CUSTOSZV9_FACTORY_HELPER_EVIDENCE.json
          if git diff --cached --quiet; then
            echo "NO_CANDIDATE_DIFF"
          else
            git diff --cached --stat
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Materialize Cajita modules and publish Louksna1 candidate"
            git push origin HEAD:main
          fi

      - name: Attest package/document build provenance
        if: success()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            downloaded/louksna1-candidate/CAJITA_LUNA_RUNTIME_V10.macrodown
            downloaded/louksna1-candidate/Louksna1.md

      - name: Upload final package and release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOUKSNA1-PRODUCT-CANDIDATE
          path: |
            downloaded/louksna1-candidate/CAJITA_LUNA_RUNTIME_V10.macrodown
            downloaded/louksna1-candidate/CAJITA_LUNA_RUNTIME_V10.macrodown.sha256
            downloaded/louksna1-candidate/Louksna1.md
            docs/cajita-luna/LOUKSNA1_RELEASE_MANIFEST.json
            docs/cajita-luna/CAJITA_LOUKSNA1_FACTORY_REPORT.json
            docs/cajita-luna/LOUKSNA1_G23_EVIDENCE.json
            docs/cajita-luna/LOUKSNA1_G24_EVIDENCE.json
            docs/cajita-luna/LOUKSNA1_TASK_ADAPTER_EVIDENCE.json
            docs/cajita-luna/CUSTOSZV9_FACTORY_HELPER_EVIDENCE.json
          if-no-files-found: warn
          retention-days: 90
