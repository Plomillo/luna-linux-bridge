name: "LOUKSNA V0.4 — continuation worker"
on:
  workflow_call:
    inputs:
      transition_id:
        required: true
        type: string
      next_point:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      transition_id:
        required: true
        type: string
      next_point:
        required: true
        type: string
permissions:
  contents: write
  actions: write
concurrency:
  group: louksna-v04-worker-${{ inputs.transition_id }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/louksna-zd-v04-master-20261007
          fetch-depth: 0
          persist-credentials: true
      - name: Checkout exact CUSTOSZ V7 mailbox
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: staging/custosz-mission-mailbox-20260928
          persist-credentials: false
          sparse-checkout: |
            artifacts/custosz-v7
          sparse-checkout-cone-mode: false
          path: mailbox
      - name: Prepare isolated CUSTOSZ compatibility workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/SYMPHYLAX_LAB/CUSTOSZ_V7_R1_G23_G24_20260927T021532Z/POSIX_COMPATIBILITY_VIEW"
      - name: Execute registered continuation
        env:
          NEXT_POINT: ${{ inputs.next_point }}
          MISSION_ROOT: ${{ github.workspace }}
          MAILBOX_ROOT: ${{ github.workspace }}/mailbox
          OUT_DIR: ${{ runner.temp }}/louksna-v04-${{ inputs.next_point }}
          CUSTOSZ_WORKSPACE_OVERRIDE: ${{ env.HOME }}/SYMPHYLAX_LAB/CUSTOSZ_V7_R1_G23_G24_20260927T021532Z/POSIX_COMPATIBILITY_VIEW
        run: |
          set -Eeuo pipefail
          export CUSTOSZ_WORKSPACE_OVERRIDE="$HOME/SYMPHYLAX_LAB/CUSTOSZ_V7_R1_G23_G24_20260927T021532Z/POSIX_COMPATIBILITY_VIEW"
          python3 -B scripts/continuity/louksna_zd_v04_continuation_worker.py
      - name: Emit worker completion signal
        if: always()
        env:
          TRANSITION_ID: ${{ inputs.transition_id }}
          NEXT_POINT: ${{ inputs.next_point }}
        run: |
          set -Eeuo pipefail
          mkdir -p continuity/signals
          python3 - <<'PY'
          import json, os, time
          p=f"continuity/signals/{os.environ['TRANSITION_ID']}.json"
          json.dump({"transition_id":os.environ["TRANSITION_ID"],"next_point":os.environ["NEXT_POINT"],"utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"source":"continuation-worker"},open(p,"w"),indent=2,sort_keys=True)
          PY
      - name: Persist continuation evidence
        if: always()
        run: |
          set -Eeuo pipefail
          git add continuity
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git commit -m "evidence(louksna): persist continuation checkpoint"
          git pull --rebase origin work/louksna-zd-v04-master-20261007
          git push origin HEAD:work/louksna-zd-v04-master-20261007
      - name: Explicitly trigger next supervisor evaluation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSITION_ID: ${{ inputs.transition_id }}
        run: |
          set -Eeuo pipefail
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/louksna-zd-v04-continuity-supervisor.yml/dispatches" \
            -f ref="work/louksna-zd-v04-master-20261007" \
            -f "inputs[transition_id]=${TRANSITION_ID}"
