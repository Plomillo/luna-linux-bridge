name: "CUSTOSZ V7: CLI mission contract static"
on:
  push:
    branches:
      - staging/custosz-v7-metaos-20260927
    paths:
      - .github/workflows/custosz-legacy-cli-static.yml
permissions:
  contents: read
jobs:
  inspect-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Mostrar CLI real y contrato de misión sin ejecutar PYZ
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path('artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz')
          with zipfile.ZipFile(p) as z:
              x=z.read('custosz_v05_legacy.py').decode().splitlines()
              for a,b in [(38,128),(355,len(x))]:
                  print('LEGACY_SOURCE_RANGE',a,b)
                  for i in range(a-1,b):
                      print(str(i+1)+': '+x[i])
          PY
