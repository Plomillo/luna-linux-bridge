name: "R4 PART4 R2 — certify WinRE recovery path"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-part4-r2-winre-bcd-certify.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: r4-part4-r2-winre-bcd-certify
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 10
    steps:
      - name: Materialize exact recovery-path evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          P4=/dev/nvme0n1p4
          EFI=/boot/efi
          TMP="$RUNNER_TEMP/winre-p4"
          OUT="$RUNNER_TEMP/winre-bcd-proof"
          mkdir -p "$TMP" "$OUT"

          test "$(sudo -n /usr/sbin/blkid -p -s UUID -o value "$P4")" = CADE667DDE666225
          P4_START_BYTES="$(sudo -n parted -m /dev/nvme0n1 unit B print | awk -F: '$1=="4"{gsub(/B/,"",$2);print $2}')"
          test "$P4_START_BYTES" = 511402049536

          sudo -n mount -t ntfs3 -o ro "$P4" "$TMP"
          trap 'sudo -n umount "$TMP" >/dev/null 2>&1 || true' EXIT

          REAG="$TMP/Recovery/WindowsRE/ReAgent.xml"
          WIM="$TMP/Recovery/WindowsRE/winre.wim"
          SDI="$TMP/Recovery/WindowsRE/boot.sdi"
          BCDR="$EFI/EFI/Microsoft/Recovery/BCD"
          BOOTMGFW="$EFI/EFI/Microsoft/Boot/bootmgfw.efi"

          for f in "$REAG" "$WIM" "$SDI" "$BCDR" "$BOOTMGFW"; do test -f "$f"; done
          strings -el "$BCDR" > "$OUT/BCD_RECOVERY.strings.txt"
          cp "$REAG" "$OUT/ReAgent.xml"
          sha256sum "$REAG" "$WIM" "$SDI" "$BCDR" "$BOOTMGFW" > "$OUT/ASSET_HASHES.sha256"

          export P4_START_BYTES
          python3 - "$OUT" <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, re, sys
          out=pathlib.Path(sys.argv[1])
          x=(out/"ReAgent.xml").read_text(encoding="utf-8",errors="replace")
          s=(out/"BCD_RECOVERY.strings.txt").read_text(encoding="utf-8",errors="replace")
          m=re.search(r'<WinreBCD id="([^"]+)"',x)
          loc=re.search(r'<WinreLocation path="([^"]+)" id="([^"]+)" offset="([^"]+)" guid="([^"]+)"',x)
          checks={
            "winre_bcd_id":m is not None,
            "winre_location_parse":loc is not None,
            "winre_path_exact":loc is not None and loc.group(1).lower()==r"\recovery\windowsre",
            "winre_offset_matches_p4":loc is not None and int(loc.group(3))==int(os.environ["P4_START_BYTES"]),
            "bcd_winre_wim":r"\Recovery\WindowsRE\Winre.wim".lower() in s.lower(),
            "bcd_boot_sdi":r"\Recovery\WindowsRE\boot.sdi".lower() in s.lower(),
            "bcd_recovery_environment":"Windows Recovery Environment" in s,
          }
          obj={
            "schema":"LOUKSNA_R4_PART4_R2_WINRE_BCD_PROOF/1.0",
            "status":"PASS" if all(checks.values()) else "HOLD",
            "p4":"/dev/nvme0n1p4",
            "p4_uuid":"CADE667DDE666225",
            "p4_start_bytes":int(os.environ["P4_START_BYTES"]),
            "winre_bcd_id":m.group(1) if m else None,
            "winre_location":{"path":loc.group(1),"id":loc.group(2),"offset":int(loc.group(3)),"guid":loc.group(4)} if loc else None,
            "checks":checks,
            "asset_hashes_sha256":hashlib.sha256((out/"ASSET_HASHES.sha256").read_bytes()).hexdigest(),
            "source_mutated":False,
            "proved_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          (out/"BCD_PROOF.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
          print(json.dumps(obj,indent=2,sort_keys=True))
          if obj["status"]!="PASS": raise SystemExit(20)
          PY

          sudo -n umount "$TMP"
          trap - EXIT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-winre-bcd-proof
          path: ${{ runner.temp }}/winre-bcd-proof/
          retention-days: 90
          compression-level: 0

  g23:
    needs: evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-winre-bcd-proof
          path: ${{ runner.temp }}/proof
      - name: Independent validation and one-shot plan derivation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/proof/BCD_PROOF.json" "$RUNNER_TEMP/g23/G23_WINRE_BCD.json" <<'PY'
          import datetime as dt, hashlib, json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); out=pathlib.Path(sys.argv[2])
          checks={
            "producer_pass":d.get("status")=="PASS",
            "p4_exact":d.get("p4")=="/dev/nvme0n1p4",
            "p4_uuid":d.get("p4_uuid")=="CADE667DDE666225",
            "p4_offset":d.get("p4_start_bytes")==511402049536,
            "all_checks":all(d.get("checks",{}).values()),
            "read_only":d.get("source_mutated") is False,
          }
          ok=all(checks.values())
          plan={
            "boot_mode":"UEFI_ONE_SHOT_ONLY",
            "efi_partition":"/dev/nvme0n1p1",
            "efi_loader":r"\EFI\Microsoft\Boot\bootmgfw.efi",
            "recovery_bcd_source":r"\EFI\Microsoft\Recovery\BCD",
            "boot_bcd_target":r"\EFI\Microsoft\Boot\BCD",
            "recovery_partition":"/dev/nvme0n1p4",
            "recovery_uuid":"CADE667DDE666225",
            "preserve_debian_boot0000":True,
            "permanent_bootorder_change":False,
            "require_pre_mutation_checkpoint":True,
            "require_post_boot_restore":True,
            "reboot_authorized_by_this_certificate":False
          }
          r={
            "schema":"LOUKSNA_R4_PART4_R2_WINRE_BCD_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "scope":"WINRE_RECOVERY_PATH_AND_ONE_SHOT_BOOT_PLAN",
            "proof_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "checks":checks,
            "boot_plan":plan,
            "g24_allowed":ok,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps(r,indent=2,sort_keys=True))
          if not ok: raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-winre-bcd-g23
          path: ${{ runner.temp }}/g23/G23_WINRE_BCD.json
          retention-days: 90
          compression-level: 0

  g24:
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-winre-bcd-g23
          path: ${{ runner.temp }}/g23
      - name: Digest-bound certification
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_WINRE_BCD.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G" | awk '{print $1}')"
          AUD="louksna-r4-part4-r2-winre-bcd:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$G" "$RUNNER_TEMP/g24/G24_WINRE_BCD.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          g=json.loads(pathlib.Path(sys.argv[1]).read_text())
          token=os.environ["TOKEN"]; parts=token.split(".")
          payload=parts[1]+"="*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          cert={
            "schema":"LOUKSNA_R4_PART4_R2_WINRE_BCD_G24/1.0",
            "status":"PASS",
            "scope":"WINRE_RECOVERY_PATH_AND_ONE_SHOT_BOOT_PLAN",
            "g23_sha256":os.environ["H"],
            "boot_plan":g["boot_plan"],
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(token.encode()).hexdigest(),
            "does_not_certify_repair_result":True,
            "does_not_authorize_partition_mutation":True,
            "does_not_authorize_reboot":True,
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(cert,indent=2,sort_keys=True)+"\n")
          print(json.dumps(cert,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-winre-bcd-g24
          path: ${{ runner.temp }}/g24/G24_WINRE_BCD.json
          retention-days: 90
          compression-level: 0
