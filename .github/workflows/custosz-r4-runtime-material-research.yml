name: "CUSTOSZ V7 + Runtime: ejecutar investigación R4 material en GitHub (20m)"
on:
  push:
    branches:
      - staging/custosz-v7-metaos-20260927
    paths:
      - .github/workflows/custosz-r4-runtime-material-research.yml

permissions:
  contents: write

concurrency:
  group: custosz-r4-runtime-material-research
  cancel-in-progress: false

jobs:
  runtime-material-research:
    if: github.repository == 'Plomillo/luna-linux-bridge' && github.actor == 'Plomillo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout misión y artefactos CUSTOSZ del commit disparador
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: mission
      - name: Checkout A1 exacta
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: staging/architecture-louksnamejorada-20260927
          path: source-a1
      - name: Checkout Skeleton R4 exacto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: staging/luna-r4-context-recovery-20260927
          path: source-r4
      - name: Checkout estado CAS exacto
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: staging/contenedor-semantico-e826-20260927
          path: source-cas
      - name: Ejecutar la misión mediante CUSTOSZ V7 y CUSTOSZ_RUNTIME_V1 en sandbox GitHub
        shell: bash
        env:
          RESULT_FILE: ${{ runner.temp }}/CUSTOSZ_RUNTIME_R4_RESULT.json
        run: |
          set -Eeuo pipefail
          python3 -B -I - <<'PY'
          import os,sys,json,hashlib,tempfile,subprocess,re,time
          from pathlib import Path
          from datetime import datetime,timezone

          ROOT=Path("mission").resolve()
          A1ROOT=Path("source-a1").resolve()
          R4ROOT=Path("source-r4").resolve()
          CASROOT=Path("source-cas").resolve()
          OUT=Path(os.environ["RESULT_FILE"])
          CUSTOSZ=ROOT/"artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz"
          RUNTIME=ROOT/"artifacts/custosz-v7/CUSTOSZ_RUNTIME_V1_SR_EXEC_BOUND_FME_01.b.pyz"
          METAOS=ROOT/"artifacts/custosz-v7/MetaOS.wasm"
          A0=ROOT/"Louksna.md"
          PUAC2=ROOT/"PUAC2.md"
          A1=A1ROOT/"LOUKSNAMEJORADA.md"
          SKELETON=R4ROOT/"docs/luna-r4/source/SKELETON_CANONICO_REFERENCIA.txt"
          CAS=CASROOT/"artifacts/semantic-container/TRANSFER_STATUS.json"
          MISSION=ROOT/"docs/missions/LUNA_R4_CUSTOSZ_V7/MISION_MAESTRA_DEFINITIVA.md"
          README=ROOT/"docs/missions/LUNA_R4_CUSTOSZ_V7/README.md"
          sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          utc=lambda:datetime.now(timezone.utc).isoformat()
          expected={
            "A0":"5270c3d643339c283edf13b414f335f23f921c4dac023b06d38de62927e29bf9",
            "A1":"2114188988126aa7a9650c131526c9d7c54ad351db315635569a317114f4eb51",
            "CUSTOSZ":"dacf1f8c13b2fcbfc617cf0d4d780b30502c13395224691e6b0f05f53d9816a2",
            "RUNTIME_STAGING":"a79e13869601d68fe801b85ad421719b79d4afa5520ae34b91b419bd8834ae67",
            "METAOS":"5d8f1239e3a0b452be722078760b000afc22af0a64f93ffb0a1f74024f15aed0",
            "SKELETON":"fb9fad37994e684ad54b1ffc2762660eebcb8e41bd9c4ba685ffac55217d5b0f"
          }
          actual={"A0":sha(A0),"A1":sha(A1),"CUSTOSZ":sha(CUSTOSZ),"RUNTIME_STAGING":sha(RUNTIME),"METAOS":sha(METAOS),"SKELETON":sha(SKELETON)}
          if actual!=expected:
              raise SystemExit("SOURCE_PIN_MISMATCH:"+json.dumps(actual,sort_keys=True))
          # Bind to the mission CUSTOSZ already registered on the real LUNA workspace.
          prior=README.read_text(encoding="utf-8")
          mm=re.search(r'"custosz_mission_id"\s*:\s*"([^"]+)"',prior)
          mission_id=mm.group(1) if mm else "MIS-31e208fc59964c059f03"
          native_deadline="2026-09-28T04:03:24.531623+00:00"

          # The full work is intentionally on GitHub-hosted compute, not the user's device.
          report={
            "mission_id":mission_id,
            "native_deadline_utc":native_deadline,
            "scope":"GITHUB_HOSTED_MATERIAL_RESEARCH_ONLY",
            "user_host_ram_consumed_by_research":False,
            "host_installation":False,
            "host_disk_mutation":False,
            "g23":"HOLD","g24":"HOLD",
            "started_utc":utc(),
            "source_hashes":actual,
            "skeleton_runtime_pin":"4e9bf0e799487ea0fd6a6d32359176bdce996010e33ed151ce0f186155d11df0",
            "selected_staging_runtime_sha256":actual["RUNTIME_STAGING"],
            "status":"STARTED"
          }

          # CUSTOSZ V7 actual artifact executes its own status/selftest on hosted compute.
          for cmd in ("v07-status","v07-selftest"):
              p=subprocess.run([sys.executable,"-B","-I",str(CUSTOSZ),cmd],capture_output=True,text=True,timeout=20)
              report["custosz_"+cmd]={"exit_code":p.returncode,"stdout":p.stdout[:4000],"stderr":p.stderr[:1000]}
              if p.returncode!=0: raise SystemExit("CUSTOSZ_"+cmd+"_FAILED")

          with tempfile.TemporaryDirectory(prefix="custosz-r4-runtime-") as d:
              tmp=Path(d)
              executor=tmp/"custosz_r4_research_executor.py"
              executor.write_text(r'''
import sys,json,hashlib,re
from pathlib import Path
dispatch,ack,fme,target,root,a1root,r4root,casroot=map(Path,sys.argv[1:9])
d=json.loads(dispatch.read_text())
canon=lambda x:json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
dig=lambda x:hashlib.sha256(canon(x)).hexdigest()
sha=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
a={"mission_id":d["mission_id"],"dispatch_id":d["dispatch_id"],"executor_id":d["executor_id"],"accepted":True,
   "process_or_execution_token":"github-hosted-custosz-v7-r4-readonly"}
a["ack_digest"]=dig(a);ack.write_text(json.dumps(a,sort_keys=True))
A0=root/"Louksna.md"; PU=root/"PUAC2.md"; A1=a1root/"LOUKSNAMEJORADA.md"
SK=r4root/"docs/luna-r4/source/SKELETON_CANONICO_REFERENCIA.txt"
CAS=casroot/"artifacts/semantic-container/TRANSFER_STATUS.json"
mission=root/"docs/missions/LUNA_R4_CUSTOSZ_V7/MISION_MAESTRA_DEFINITIVA.md"
pu=PU.read_text(encoding="utf-8",errors="replace")
sk=SK.read_text(encoding="utf-8",errors="replace")
cas=json.loads(CAS.read_text())
result={
 "mission_id":d["mission_id"],"scope":"READONLY_RESEARCH",
 "status":"MATERIAL_RESEARCH_COMPLETED",
 "verified":{
   "a0_sha256":sha(A0),"a1_sha256":sha(A1),"puac2_sha256":sha(PU),
   "skeleton_sha256":sha(SK),"mission_sha256":sha(mission)},
 "puac2":{
   "candidate_2_0_present":"VERSION=2.0.0-CANDIDATE" in pu,
   "g23_not_granted":"G23=NO_CONCEDIDA" in pu,
   "g24_not_granted":"G24=NO_CONCEDIDA" in pu,
   "d01_d10_markers":sum(1 for x in ("D01","D02","D03","D04","D05","D06","D07","D08","D09","D10") if x in pu)},
 "r4":{
   "target_os_debian13":"TARGET_OS=Debian GNU/Linux 13 Trixie" in sk,
   "firefox_default_excluded":"Firefox" in sk,
   "runtime_pin_declared":re.search(r"RUNTIME_SHA256=([0-9a-f]{64})",sk).group(1) if re.search(r"RUNTIME_SHA256=([0-9a-f]{64})",sk) else None,
   "installation_performed_false":"INSTALLATION_PERFORMED=FALSE" in sk},
 "cas":{
   "expected":cas.get("cas_object_count_expected"),"uploaded":cas.get("cas_objects_uploaded"),
   "pending":cas.get("cas_objects_pending"),"content_validation_pending":cas.get("source_content_hash_validation_pending")},
 "conclusions":[
   "A0, A1, PUAC2, Skeleton and mission identities were verified on GitHub-hosted compute.",
   "CUSTOSZ V7 native mission is already registered on the real LUNA_PROJECT workspace; this executor binds material research to that mission_id without consuming user-host RAM.",
   "The selected staging runtime is explicitly named by the staging manifest but its SHA-256 differs from the Skeleton generic runtime pin; treat this as a variant/provenance reconciliation item, not as authority to activate it on the host.",
   "PUAC2 remains a 2.0.0 candidate with G23/G24 not granted; its requirements may guide assurance but cannot self-certify.",
   "CAS transport remains incomplete in GitHub while prior evidence verified 252 source objects; transfer completion and semantic runtime validation remain distinct.",
   "No host installation, Windows/EFI/GPT/PROYECTOS mutation or reboot was performed."
 ],
 "next_authorized_research":[
   "Reconcile selected runtime variant against Skeleton pin and provenance.",
   "Complete A0-A1 semantic/admission evidence without mutating canonical sources.",
   "Implement and independently test the consent/executor bridge before host installation.",
   "Complete CAS Git LFS transport from isolated clean checkout and validate destination hashes.",
   "Prepare differential R4 component matrix and sandbox installation lots."
 ]}
target.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
f={"mission_id":d["mission_id"],"dispatch_id":d["dispatch_id"],"binding_id":d["binding_id"],
   "fme_id":"FME-GITHUB-R4-"+d["dispatch_id"],"target":str(target),
   "after_digest":sha(target),"effect_type":d["expected_effect"]["effect_type"],
   "effect_is_material":True,"effect_is_mission_relevant":True,"effect_is_authorized":True,"effect_is_observable":True}
f["fme_digest"]=dig(f);fme.write_text(json.dumps(f,sort_keys=True))
''',encoding="utf-8")

              sys.path.insert(0,str(RUNTIME))
              from runtime_core import Runtime,ExecutorAdapter,TimeBudgetController
              from sr_exec_bound_fme_01 import SRExecBoundFME01
              rt=Runtime(tmp/"runtime",A0,sha(A0))
              selftest=rt.selftest()
              report["runtime_selftest"]=selftest
              if selftest.get("status")!="PASS": raise SystemExit("RUNTIME_SELFTEST_FAILED")
              rt.budget=TimeBudgetController(1200)
              rt.mission.transition("PRECHECK")
              exec_id="CUSTOSZ_V7_R4_GITHUB_RESEARCH"
              rt.executors.register(ExecutorAdapter(exec_id,"LOCAL_SUBPROCESS",sys.executable,capabilities={"READONLY_RESEARCH":1.0}))
              cp=rt.checkpoints.capture_file("MISSION_R4_BEFORE_RESEARCH",MISSION)
              target=tmp/"RUNTIME_RESEARCH_RESULT.json"
              spec={
                "mission_id":mission_id,
                "mission_spec_digest":sha(MISSION),
                "required_abilities":{"READONLY_RESEARCH":1.0},
                "authority_context":{"authority":"Louksna.md","sha256":sha(A0)},
                "policy_context":{"policy_id":"GITHUB_HOSTED_NO_USER_HOST_RAM","scope":"READONLY_RESEARCH_ONLY","allow":True},
                "execution_payload_digest":sha(executor),
                "expected_effect":{"target":str(target),"effect_type":"READONLY_RESEARCH_REPORT"},
                "checkpoint_pointer":cp["checkpoint_id"],
                "runtime_digest":sha(RUNTIME),
                "mission_state":"DISPATCH_READY",
                "executor_metadata":{exec_id:{"identity_valid":True,"provenance_valid":True,"digest":sha(sys.executable)}},
                "executor_policy":{exec_id:{"permissions_valid":True,"resource_envelope_valid":True,"policy_allow":True,"risk":0,"cost":0}},
                "probe_argv":{exec_id:["{COMMAND}","-B","-I","-c","import sys;sys.exit(0)"]},
                "dispatch":{"cwd":str(tmp),"argv_template":["{COMMAND}","-B","-I",str(executor),"{DISPATCH_PATH}","{ACK_PATH}","{FME_PATH}","{TARGET}",str(ROOT),str(A1ROOT),str(R4ROOT),str(CASROOT)],"timeout_s":600,"ack_timeout_s":15,"fme_timeout_s":30}
              }
              rr=SRExecBoundFME01(rt).establish_material_execution(spec)
              report["runtime_dispatch"]={k:rr.get(k) for k in ("result","global_step_gate","material_execution_proven","evidence_chain_head")}
              if rr.get("result")!="PASS" or not target.is_file():
                  raise SystemExit("RUNTIME_MATERIAL_DISPATCH_FAILED:"+json.dumps(report["runtime_dispatch"],sort_keys=True))
              report["research_result"]=json.loads(target.read_text())
              report["runtime_evidence_ledger"]=rt.journal.verify()
              report["status"]="CUSTOSZ_AND_RUNTIME_MATERIAL_RESEARCH_PASS"

          report["ended_utc"]=utc()
          OUT.write_text(json.dumps(report,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("FINAL_RESULT="+json.dumps({"status":report["status"],"mission_id":mission_id,"runtime":report.get("runtime_dispatch")},sort_keys=True))
          PY
      - name: Publicar resultado exacto en GitHub
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_FILE: ${{ runner.temp }}/CUSTOSZ_RUNTIME_R4_RESULT.json
        run: |
          set -Eeuo pipefail
          python3 -B -I - <<'PY'
          import os,json,base64,urllib.request
          from pathlib import Path
          branch="staging/custosz-v7-metaos-20260927"
          root="docs/missions/LUNA_R4_CUSTOSZ_V7"
          result_path=Path(os.environ["RESULT_FILE"])
          if not result_path.is_file():
              result={"status":"RUNTIME_DISPATCH_NO_RESULT","run_id":os.environ["GITHUB_RUN_ID"]}
          else:
              result=json.loads(result_path.read_text())
          token=os.environ["GH_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json","User-Agent":"CUSTOSZ-R4-runtime-report"}
          def get(path):
              u="https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/"+path+"?ref="+branch
              with urllib.request.urlopen(urllib.request.Request(u,headers=headers),timeout=25) as r:return json.load(r)
          def put(path,text,msg):
              u="https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/"+path
              try: old=get(path); sha=old["sha"]
              except Exception: sha=None
              payload={"message":msg,"branch":branch,"content":base64.b64encode(text.encode()).decode()}
              if sha:payload["sha"]=sha
              req=urllib.request.Request(u,data=json.dumps(payload).encode(),headers=headers,method="PUT")
              with urllib.request.urlopen(req,timeout=40) as r:return json.load(r)
          put(root+"/CUSTOSZ_RUNTIME_R4_RESULT.json",json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n","docs(custosz): resultado material del runtime R4")
          rp=root+"/README.md"; old=get(rp); text=base64.b64decode(old["content"]).decode()
          title="## Despacho material CUSTOSZ + Runtime run "+os.environ["GITHUB_RUN_ID"]
          if title not in text:
              section="\n\n"+title+"\n\nEvidencia: https://github.com/Plomillo/luna-linux-bridge/actions/runs/"+os.environ["GITHUB_RUN_ID"]+"\n\n~~~json\n"+json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n~~~\n"
              put(rp,text+section,"docs(custosz): registrar despacho material CUSTOSZ+Runtime")
          print("GITHUB_RESULT_PUBLISHED="+str(result.get("status")))
          PY
