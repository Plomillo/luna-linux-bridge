name: Lunita v1.8 Direct Functional Validation

on:
  push:
    branches:
      - fix/lunita-v18-rootfs-bound-checkpoint-20261109
    paths:
      - "recovery/lunita-custoszv9/**"
      - "scripts/lunita/**"
      - ".github/workflows/lunita-v18-direct-functional-validation.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "recovery/lunita-custoszv9/**"
      - "scripts/lunita/**"
      - ".github/workflows/lunita-v18-direct-functional-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    if: ${{ (github.event_name == 'push' && github.ref_name == 'fix/lunita-v18-rootfs-bound-checkpoint-20261109') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'fix/lunita-v18-rootfs-bound-checkpoint-20261109') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/lunita-v18-rootfs-bound-checkpoint-20261109' && github.event.pull_request.base.ref == 'fix/lunita-v18-certification-path-20261109') }}
    name: "Lunita v1.8 contract and overlay acceptance"
    concurrency:
      group: lunita-v1-8-contract-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pivot-root target execution script syntax
        shell: bash
        run: bash -n scripts/lunita/run_target_runtime_acceptance_in_container_v1.sh
      - name: Install SquashFS tooling for reproducible packaging acceptance
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          command -v mksquashfs
          command -v unsquashfs
      - name: Compile and execute reproducible SquashFS packaging and certification acceptance
        shell: bash
        run: |
          python -m py_compile \
            scripts/lunita/package_candidate_squashfs_v1.py \
            scripts/lunita/certify_candidate_squashfs_v1.py \
            scripts/lunita/rootfs_base_cache_v1.py \
            scripts/lunita/clean_transient_browser_tmp_v1.py
          python scripts/lunita/package_candidate_squashfs_v1.py --self-test
          python scripts/lunita/rootfs_base_cache_v1.py self-test
          python scripts/lunita/clean_transient_browser_tmp_v1.py self-test
          python scripts/lunita/certify_candidate_squashfs_v1.py --self-test
          python -m unittest discover -s scripts/lunita -p "test_certify_candidate_squashfs_v1.py" -v
      - name: Install pinned CPU-only PyTorch for SeamlessM4T tensor contracts
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: "torch==2.14.1" \
            --index-url https://download.pytorch.org/whl/cpu \
            --extra-index-url https://pypi.org/simple
      - name: Install pinned SeamlessM4T Python dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            "numpy==2.2.6" "safetensors==0.7.0" "transformers==4.57.6"
      - name: Verify CPU tensor runtime
        shell: bash
        run: |
          python -c 'import torch; assert torch.__version__.startswith("2.14.1"); print("PYTORCH_CPU_RUNTIME=" + torch.__version__)'
      - name: Compile recovery gate and tests
        run: python -m py_compile recovery/lunita-custoszv9/permission_gate.py recovery/lunita-custoszv9/test_permission_gate.py recovery/lunita-custoszv9/test_continuation_antiparalysis.py
      - name: Run fail-closed contract tests
        run: python -m unittest discover -s recovery/lunita-custoszv9 -p "test_*.py" -v
      - name: Install pinned E02-E15 runtime dependencies into isolated vendor directory
        shell: bash
        env:
          SITE_PACKAGES: recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
        run: |
          mkdir -p "$SITE_PACKAGES"
          python -m pip install --disable-pip-version-check --only-binary=:all: --no-compile \
            --target "$SITE_PACKAGES" \
            -r recovery/lunita-custoszv9/runtime_engines_v1/requirements-engine-stack.txt
      - name: Download and verify OWL-RL wheel checksum
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/owlrl"
          python -m pip download --disable-pip-version-check --no-deps --only-binary=:all: \
            --dest "$RUNNER_TEMP/owlrl" "owlrl==7.6.2"
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          files = list((Path(os.environ["RUNNER_TEMP"]) / "owlrl").glob("owlrl-7.6.2-*.whl"))
          assert len(files) == 1, f"Expected one OWL-RL wheel, found {len(files)}"
          digest = hashlib.sha256(files[0].read_bytes()).hexdigest()
          expected = "83347bf7f133979e87b2b18695d51d25510b99cec3f6919b5df05d4fbf058ae0"
          assert digest == expected, f"OWL-RL wheel checksum mismatch: {digest}"
          print(f"OWL_RL_WHEEL_SHA256={digest}")
          PY
          python -m pip install --disable-pip-version-check --no-deps --no-compile \
            --target recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages \
            "$RUNNER_TEMP"/owlrl/*.whl
      - name: Compile additive engine and deployment implementation
        run: |
          python -m py_compile \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/quantize_embedding_model_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/engine_gateway_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/gateway_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/lunita_beta_v1_8.py \
            recovery/lunita-custoszv9/runtime_engines_v1/launcher_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/apply_engine_overlay_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/checkpoint_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/provision_engine_runtime_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/overlay_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/target_runtime_acceptance_v1.py \
            recovery/lunita-custoszv9/runtime_engines_v1/target_acceptance_tests_v1.py
      - name: Execute real E02-E15 engine acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
          LUNITA_FASTEMBED_CACHE: ${{ runner.temp }}/lunita-fastembed-cache
          HF_HOME: ${{ runner.temp }}/lunita-fastembed-cache
          HF_HUB_CACHE: ${{ runner.temp }}/lunita-fastembed-cache/hub
        run: |
          mkdir -p "$LUNITA_FASTEMBED_CACHE" "$HF_HUB_CACHE"
          python engine_acceptance_v1.py
          python - <<'PY'
          import os
          import pathlib
          import shutil
          source = pathlib.Path(os.environ["LUNITA_FASTEMBED_CACHE"]).resolve(strict=True)
          destination = pathlib.Path("model-cache/fastembed")
          if destination.exists():
              raise SystemExit("Refusing to overwrite existing packaged model cache")
          destination.mkdir(parents=True, exist_ok=False)
          repositories = sorted(path for path in source.glob("models--*") if path.is_dir())
          if not repositories:
              raise SystemExit(f"No Hugging Face model cache repositories found under {source}")
          copied_files = 0
          copied_bytes = 0
          for repository in repositories:
              target_repository = destination / repository.name
              refs = repository / "refs"
              if refs.is_dir():
                  shutil.copytree(refs, target_repository / "refs")
              snapshots = repository / "snapshots"
              if not snapshots.is_dir():
                  raise SystemExit(f"Snapshot directory is missing: {snapshots}")
              for snapshot in sorted(path for path in snapshots.iterdir() if path.is_dir()):
                  target_snapshot = target_repository / "snapshots" / snapshot.name
                  target_snapshot.mkdir(parents=True, exist_ok=False)
                  for item in sorted(snapshot.rglob("*")):
                      relative = item.relative_to(snapshot)
                      target = target_snapshot / relative
                      if item.is_dir() and not item.is_symlink():
                          target.mkdir(parents=True, exist_ok=True)
                          continue
                      if item.is_symlink():
                          resolved = item.resolve(strict=True)
                          try:
                              resolved.relative_to(source)
                          except ValueError as exc:
                              raise SystemExit(f"Cache symlink escapes approved cache root: {item}") from exc
                          if not resolved.is_file():
                              raise SystemExit(f"Cache symlink target is not a regular file: {item}")
                          source_file = resolved
                      elif item.is_file():
                          source_file = item
                      else:
                          raise SystemExit(f"Unexpected cache filesystem entry: {item}")
                      target.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(source_file, target)
                      copied_files += 1
                      copied_bytes += target.stat().st_size
          symlinks = [str(path) for path in destination.rglob("*") if path.is_symlink()]
          if symlinks:
              raise SystemExit(f"Materialized model cache contains symlinks: {symlinks[:10]}")
          print(f"MATERIALIZED_FASTEMBED_CACHE={destination}")
          print(f"MATERIALIZED_MODEL_FILES={copied_files}")
          print(f"MATERIALIZED_MODEL_BYTES={copied_bytes}")
          PY
      - name: Install isolated ONNX quantization tool
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/onnx-quant-tools"
          python -m pip install --disable-pip-version-check --only-binary=:all: \
            --no-compile --target "$RUNNER_TEMP/onnx-quant-tools" "onnx==1.19.1"
      - name: Quantize E04 embedding ONNX and enforce semantic quality
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          PYTHONPATH: ${{ runner.temp }}/onnx-quant-tools:${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
          LUNITA_FASTEMBED_CACHE: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/model-cache/fastembed
          HF_HOME: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/model-cache/fastembed
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python quantize_embedding_model_v1.py
      - name: Re-run E02-E15 acceptance against measured INT8 E04 model
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        env:
          PYTHONPATH: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/vendor/python3.12/site-packages
          LUNITA_FASTEMBED_CACHE: ${{ github.workspace }}/recovery/lunita-custoszv9/runtime_engines_v1/model-cache/fastembed
          LUNITA_VECTOR_DB_PATH: ${{ runner.temp }}/lunita-int8-qdrant
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: python engine_acceptance_v1.py
      - name: Diagnose overlay size by package and largest files
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          from collections import defaultdict
          root = pathlib.Path("recovery/lunita-custoszv9/runtime_engines_v1")
          totals = defaultdict(int)
          files = []
          for path in root.rglob("*"):
              if path.is_file():
                  size = path.stat().st_size
                  rel = path.relative_to(root)
                  key = rel.parts[0] if rel.parts else "."
                  totals[key] += size
                  files.append((size, rel.as_posix()))
          for key, size in sorted(totals.items(), key=lambda item: item[1], reverse=True):
              print(f"OVERLAY_COMPONENT_BYTES {size} {key}")
          vendor = root / "vendor/python3.12/site-packages"
          package_sizes = []
          for package in vendor.iterdir():
              if package.is_dir():
                  size = sum(item.stat().st_size for item in package.rglob("*") if item.is_file())
              elif package.is_file():
                  size = package.stat().st_size
              else:
                  continue
              package_sizes.append((size, package.name))
          for size, name in sorted(package_sizes, reverse=True)[:80]:
              print(f"VENDOR_PACKAGE_BYTES {size} {name}")
          for size, name in sorted(files, reverse=True)[:40]:
              print(f"OVERLAY_LARGEST_FILE_BYTES {size} {name}")
          PY
      - name: Enforce distributable overlay size budget
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          root = pathlib.Path("recovery/lunita-custoszv9/runtime_engines_v1")
          total = sum(path.stat().st_size for path in root.rglob("*") if path.is_file())
          print(f"LUNITA_OVERLAY_BYTES={total}")
          print(f"LUNITA_OVERLAY_MIB={total / 1024 / 1024:.2f}")
          limit = 480 * 1024 * 1024
          if total > limit:
              raise SystemExit(f"Overlay exceeds 480 MiB distributable budget: {total}")
          PY
      - name: Execute command-team engine gateway acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python gateway_acceptance_v1.py
      - name: Execute additive beta v1.8 launcher acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python launcher_acceptance_v1.py
      - name: Execute additive overlay and checkpoint acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python overlay_acceptance_v1.py
      - name: Execute target-side overlay and INT8 receipt acceptance tests
        working-directory: recovery/lunita-custoszv9/runtime_engines_v1
        run: python target_acceptance_tests_v1.py
      - name: Upload reproducible Lunita engine overlay bundle
        uses: actions/upload-artifact@v4
        with:
          name: lunita-engine-overlay-v1-py312
          path: |
            recovery/lunita-custoszv9/runtime_engines_v1/
            !recovery/lunita-custoszv9/runtime_engines_v1/__pycache__/
            !recovery/lunita-custoszv9/runtime_engines_v1/**/*.pyc
          if-no-files-found: error
          retention-days: 30

  target-runtime:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/fix/lunita-v18-rootfs-bound-checkpoint-20261109' }}
    name: "Lunita v1.8 real target and independent acceptance"
    concurrency:
      group: lunita-v1-8-target-runtime-${{ github.ref }}-${{ github.sha }}
      cancel-in-progress: true
    needs: contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the exact overlay built by this workflow run
        uses: actions/download-artifact@v4
        with:
          name: lunita-engine-overlay-v1-py312
          path: ${{ runner.temp }}/lunita-engine-overlay
      - name: Restore exact-input Ubuntu 24.04 rootfs base cache
        id: rootfs-base-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/lunita-rootfs-base-cache
          key: lunita-rootfs-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lunita/build_rootfs_candidate_v1.sh', 'scripts/lunita/brujula.js', 'recovery/lunita-custoszv9/lunita_beta_v1_7.py', 'scripts/lunita/rootfs_base_cache_v1.py') }}
      - name: Prove host user namespaces before target-side acceptance
        shell: bash
        run: |
          set -euo pipefail
          sudo -n bash -euo pipefail <<'ROOT'
          RESTORE_FILE="$(mktemp)"
          restore_userns_sysctls() {
            local result=$?
            trap - EXIT
            set +e
            local key original path observed
            while IFS='=' read -r key original; do
              [ -n "$key" ] || continue
              sysctl -q -w "$key=$original" || result=1
              case "$key" in
                kernel.apparmor_restrict_unprivileged_userns) path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns ;;
                kernel.unprivileged_userns_clone) path=/proc/sys/kernel/unprivileged_userns_clone ;;
                user.max_user_namespaces) path=/proc/sys/user/max_user_namespaces ;;
                *) result=1; continue ;;
              esac
              observed="$(cat "$path" 2>/dev/null)"
              [ "$observed" = "$original" ] || result=1
            done < "$RESTORE_FILE"
            rm -f "$RESTORE_FILE"
            exit "$result"
          }
          trap restore_userns_sysctls EXIT
          enable_userns_sysctl() {
            local key="$1" wanted="$2" path original
            case "$key" in
              kernel.apparmor_restrict_unprivileged_userns) path=/proc/sys/kernel/apparmor_restrict_unprivileged_userns ;;
              kernel.unprivileged_userns_clone) path=/proc/sys/kernel/unprivileged_userns_clone ;;
              user.max_user_namespaces) path=/proc/sys/user/max_user_namespaces ;;
              *) echo "ERROR: unregistered user-namespace sysctl: $key" >&2; return 2 ;;
            esac
            if [ ! -e "$path" ]; then echo "USERNS_SYSCTL_UNAVAILABLE=$key"; return 0; fi
            original="$(cat "$path")"
            if [ "$original" != "$wanted" ]; then
              printf '%s=%s\n' "$key" "$original" >> "$RESTORE_FILE"
              sysctl -q -w "$key=$wanted"
            fi
            echo "USERNS_SYSCTL_ACTIVE $key=$wanted (original=$original)"
          }
          enable_userns_sysctl kernel.apparmor_restrict_unprivileged_userns 0
          enable_userns_sysctl kernel.unprivileged_userns_clone 1
          if [ -r /proc/sys/user/max_user_namespaces ] && [ "$(cat /proc/sys/user/max_user_namespaces)" = "0" ]; then
            enable_userns_sysctl user.max_user_namespaces 65536
          fi
          sudo -n -u nobody /usr/bin/unshare --user --map-root-user /usr/bin/true
          echo "PASS_HOST_USERNS_PREFLIGHT: unprivileged user namespace creation is available on the actual GitHub runner kernel."
          ROOT
      - name: Rebuild Ubuntu 24.04 rootfs only when the exact base cache is absent
        if: steps.rootfs-base-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/lunita-rootfs"
          mkdir -p "$RUNNER_TEMP/lunita-rootfs-base-cache"
          sudo env RUNNER_TEMP="$RUNNER_TEMP" bash scripts/lunita/build_rootfs_candidate_v1.sh "$ROOTFS"
          test -f "$ROOTFS/var/lib/dpkg/status"
          test -f "$ROOTFS/opt/lunita/metadata/ROOTFS_BUILD_RECEIPT.json"
          sudo python3.12 scripts/lunita/rootfs_base_cache_v1.py pack \
            --workspace "$GITHUB_WORKSPACE" \
            --rootfs "$ROOTFS" \
            --cache-dir "$RUNNER_TEMP/lunita-rootfs-base-cache" \
            --commit "$GITHUB_SHA"
          printf 'LUNITA_ROOTFS=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_ROOTFS_REAL=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_ROOT=%s/opt/lunita\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_XDG_STATE_HOME=%s/lunita-xdg\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LUNITA_CHECKPOINT_DIR=\n' >> "$GITHUB_ENV"
          printf 'FLATPAK_SYSTEM_DIR=%s/var/lib/flatpak\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'R_HOME=%s/opt/lunita/instruments/lapiz/R-4.6.1/lib/R\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_TARGET_ROOTFS=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
      - name: Restore and verify the immutable Ubuntu 24.04 rootfs base
        if: steps.rootfs-base-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/lunita-rootfs"
          sudo python3.12 scripts/lunita/rootfs_base_cache_v1.py restore \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "$RUNNER_TEMP/lunita-rootfs-base-cache" \
            --rootfs "$ROOTFS"
          test -f "$ROOTFS/var/lib/dpkg/status"
          test -f "$ROOTFS/opt/lunita/metadata/ROOTFS_BUILD_RECEIPT.json"
          printf 'LUNITA_ROOTFS=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_ROOTFS_REAL=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_ROOT=%s/opt/lunita\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_XDG_STATE_HOME=%s/lunita-xdg\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'LUNITA_CHECKPOINT_DIR=\n' >> "$GITHUB_ENV"
          printf 'FLATPAK_SYSTEM_DIR=%s/var/lib/flatpak\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'R_HOME=%s/opt/lunita/instruments/lapiz/R-4.6.1/lib/R\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_TARGET_ROOTFS=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
      - name: Verify pristine Ubuntu rootfs cache archive and receipt before persistent save
        if: success() && steps.rootfs-base-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo python3.12 scripts/lunita/rootfs_base_cache_v1.py verify \
            --workspace "$GITHUB_WORKSPACE" \
            --cache-dir "$RUNNER_TEMP/lunita-rootfs-base-cache"
      - name: Save verified pristine Ubuntu base for later candidates
        id: rootfs-base-cache-save
        if: success() && steps.rootfs-base-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/lunita-rootfs-base-cache
          key: lunita-rootfs-base-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/lunita/build_rootfs_candidate_v1.sh', 'scripts/lunita/brujula.js', 'recovery/lunita-custoszv9/lunita_beta_v1_7.py', 'scripts/lunita/rootfs_base_cache_v1.py') }}
      - name: Ensure host Flatpak client is available for independent JASP validation
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v flatpak >/dev/null 2>&1; then
            installed=false
            for attempt in 1 2 3 4; do
              echo "HOST_FLATPAK_INSTALL_ATTEMPT=$attempt/4"
              if sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update && \
                 sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends flatpak; then
                installed=true
                break
              fi
              if [ "$attempt" -lt 4 ]; then sleep $((attempt * 10)); fi
            done
            [ "$installed" = true ] || {
              echo "BLOCKED: host Flatpak installation failed after bounded network retries." >&2
              exit 1
            }
          fi
          command -v flatpak
          flatpak --version

      - name: Verify the actual candidate rootfs and target prerequisites
        shell: bash
        run: |
          set -euo pipefail
          set -x
          : "${LUNITA_ROOTFS:?The repository rootfs builder did not emit LUNITA_ROOTFS}"
          ROOTFS="$(realpath -e "$LUNITA_ROOTFS")"
          test -f "$ROOTFS/opt/lunita/metadata/ROOTFS_BUILD_RECEIPT.json"
          test -x "$ROOTFS/opt/lunita/instruments/brujula/node/bin/node"
          test -x "$ROOTFS/opt/lunita/instruments/brujula/chrome/chrome"
          test -x "$ROOTFS/opt/lunita/instruments/lapiz/R-4.6.1/bin/Rscript"
          test -d "$ROOTFS"
          test -f "$ROOTFS/var/lib/dpkg/status"
          test -f "$ROOTFS/opt/lunita/agent/lunita.py"
          test -f "$ROOTFS/opt/lunita/brain/model/Qwen_Qwen3-0.6B-IQ3_XS.gguf"
          test -x "$ROOTFS/usr/bin/python3.12"
          test -x "$ROOTFS/usr/bin/flatpak"
          test -d "$ROOTFS/var/lib/flatpak/app/org.jaspstats.JASP"
          test -d "$ROOTFS/var/lib/flatpak/app/org.jamovi.jamovi"
          find "$ROOTFS/opt/lunita/brain/runtime" -type f -name llama-cli -perm -111 -print -quit | grep -q .
          command -v flatpak >/dev/null
          if [ "$(id -u)" -ne 0 ]; then sudo -n true; fi
          printf 'LUNITA_ROOTFS_REAL=%s\n' "$ROOTFS" >> "$GITHUB_ENV"
          printf 'LUNITA_ROOT=%s\n' "$ROOTFS/opt/lunita" >> "$GITHUB_ENV"
          printf 'LUNITA_XDG_STATE_HOME=%s\n' "$RUNNER_TEMP/lunita-xdg" >> "$GITHUB_ENV"
          printf 'LUNITA_CHECKPOINT_DIR=\n' >> "$GITHUB_ENV"
          printf 'FLATPAK_SYSTEM_DIR=%s\n' "$ROOTFS/var/lib/flatpak" >> "$GITHUB_ENV"
      - name: Verify exact candidate identity labels and preservation of existing instrument labels
        shell: bash
        run: |
          set -euo pipefail
          python3.12 - "$LUNITA_ROOTFS_REAL" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = root / "opt/lunita/metadata"
          json_path = metadata / "LUNITA_LABEL_HIERARCHY.json"
          text_path = metadata / "LUNITA_LABEL_HIERARCHY.txt"
          receipt_path = metadata / "ROOTFS_BUILD_RECEIPT.json"
          for path in (json_path, text_path, receipt_path):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"BLOCKED: required candidate metadata is missing or unsafe: {path}")
          expected_tree = "\n".join([
              "LA PIEZA",
              "└── EL ESTUCHE",
              "    └── UBUNTU 24.04 LTS MINIMAL",
              "        └── LUNITA LA INVESTIGADORA",
              "            ├── MOTOR COGNITIVO",
              "            │   └── Qwen3-0.6B IQ3_XS GGUF",
              "            │",
              "            ├── BRÚJULA GIROSCÓPICA",
              "            │   ├── Node.js 22.23.2",
              "            │   ├── Playwright 1.63.0",
              "            │   ├── playwright-core 1.63.0",
              "            │   └── Chrome for Testing 153.0.8010.12",
              "            │",
              "            ├── LÁPIZ",
              "            │   └── R 4.6.1",
              "            │",
              "            ├── SACAPUNTAS",
              "            │   └── jamovi 2.7.27",
              "            │",
              "            └── LUPA",
              "                └── JASP 0.98.1",
          ]) + "\n"
          document = json.loads(json_path.read_text(encoding="utf-8"))
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          binding = receipt.get("label_hierarchy", {})
          if document.get("schema") != "LUNITA_LABEL_HIERARCHY/1.0" or document.get("candidate_id") != "G06_REBUILD_CANDIDATE_R1" or document.get("version") != "1.8.0":
              raise SystemExit("BLOCKED: label hierarchy identity/schema mismatch.")
          if document.get("preservation_policy") != "APPEND_ONLY;DO_NOT_REWRITE_EXISTING_LABELS":
              raise SystemExit("BLOCKED: candidate label preservation policy mismatch.")
          if document.get("rendered_tree") != expected_tree or text_path.read_text(encoding="utf-8") != expected_tree:
              raise SystemExit("BLOCKED: exact candidate label tree mismatch.")
          labels = []
          def walk(node):
              if not isinstance(node, dict) or not isinstance(node.get("label"), str):
                  raise SystemExit("BLOCKED: malformed label node.")
              labels.append(node["label"])
              children = node.get("children", [])
              if not isinstance(children, list):
                  raise SystemExit("BLOCKED: malformed label children.")
              for child in children:
                  walk(child)
          walk(document.get("hierarchy"))
          expected_labels = [
              "LA PIEZA", "EL ESTUCHE", "UBUNTU 24.04 LTS MINIMAL", "LUNITA LA INVESTIGADORA",
              "MOTOR COGNITIVO", "Qwen3-0.6B IQ3_XS GGUF", "BRÚJULA GIROSCÓPICA",
              "Node.js 22.23.2", "Playwright 1.63.0", "playwright-core 1.63.0",
              "Chrome for Testing 153.0.8010.12", "LÁPIZ", "R 4.6.1",
              "SACAPUNTAS", "jamovi 2.7.27", "LUPA", "JASP 0.98.1"
          ]
          if labels != expected_labels:
              raise SystemExit(f"BLOCKED: exact candidate labels differ: {labels!r}")
          if binding.get("schema") != "LUNITA_LABEL_HIERARCHY/1.0" or binding.get("json_path") != "/opt/lunita/metadata/LUNITA_LABEL_HIERARCHY.json" or binding.get("text_path") != "/opt/lunita/metadata/LUNITA_LABEL_HIERARCHY.txt":
              raise SystemExit("BLOCKED: rootfs build receipt does not bind the exact label files.")
          if binding.get("json_sha256") != hashlib.sha256(json_path.read_bytes()).hexdigest() or binding.get("text_sha256") != hashlib.sha256(text_path.read_bytes()).hexdigest():
              raise SystemExit("BLOCKED: candidate label file digest mismatch.")
          preserved = {
              "BRUJULA": "Brújula giroscópica", "JAMOVI": "Sacapuntas",
              "JASP": "Lupa", "R": "Lápiz", "QWEN": "Motor Cognitivo"
          }
          if receipt.get("instrument_labels") != preserved:
              raise SystemExit("BLOCKED: pre-existing instrument labels were changed.")
          manifest_path = pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"]) / "LUNITA_V1_8_CANDIDATE_FREEZE.json"
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit("BLOCKED: frozen candidate manifest is missing or unsafe.")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          existing = manifest.get("instruments", {})
          for key in ("BRUJULA", "JAMOVI", "JASP"):
              record = existing.get(key, {})
              original_label = record.get("display_label")
              if not isinstance(original_label, str) or not original_label:
                  raise SystemExit(f"BLOCKED: frozen manifest has no original display label for {key}.")
              if preserved[key] != original_label:
                  raise SystemExit(f"BLOCKED: existing {key} label differs; refusing to rewrite it.")
          print("PASS_EXACT_CANDIDATE_LABEL_HIERARCHY")
          print(f"LUNITA_LABEL_COUNT={len(labels)}")
          print("PASS_PREEXISTING_MANIFEST_LABELS_PRESERVED")
          print("PASS_ONLY_ABSENT_INSTRUMENT_LABELS_ADDED")
          PY
      - name: Apply the overlay only when it is absent and the candidate is clean
        shell: bash
        run: |
          set -euo pipefail
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          OVERLAY="$LUNITA_ROOT/engines/runtime_engines_v1"
          if [ -e "$OVERLAY" ]; then
            test -d "$OVERLAY"
            test -f "$OVERLAY/OVERLAY_APPLY_RECEIPT.json" || {
              echo "BLOCKED: overlay path exists without its immutable apply receipt; no overwrite attempted."
              exit 2
            }
            echo "Existing additive overlay detected; preserving it without reapplication."
          else
            ENGINE_FILE="$(find "$RUNNER_TEMP/lunita-engine-overlay" -type f -name engine_runtime_v1.py -print -quit)"
            test -n "$ENGINE_FILE"
            SOURCE_DIR="$(dirname "$ENGINE_FILE")"
            CHECKPOINT_DIR="$RUNNER_TEMP/lunita-checkpoint-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            PYTHON312="$(command -v python3.12)"
            run_root "$PYTHON312" recovery/lunita-custoszv9/runtime_engines_v1/checkpoint_v1.py \
              --rootfs "$LUNITA_ROOT" \
              --checkpoint-dir "$CHECKPOINT_DIR" \
              --candidate-id G06_REBUILD_CANDIDATE_R1
            run_root "$PYTHON312" recovery/lunita-custoszv9/runtime_engines_v1/apply_engine_overlay_v1.py \
              --rootfs "$LUNITA_ROOT" \
              --source-dir "$SOURCE_DIR" \
              --checkpoint-receipt "$CHECKPOINT_DIR/CHECKPOINT_RECEIPT.json" \
              --candidate-id G06_REBUILD_CANDIDATE_R1 \
              --apply
            printf 'LUNITA_CHECKPOINT_DIR=%s\n' "$CHECKPOINT_DIR" >> "$GITHUB_ENV"
          fi
      - name: Execute actual E01 inference and E02-E15 plus legacy application smoke tests
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" \
            LUNITA_ROOTFS_REAL="$LUNITA_ROOTFS_REAL" \
            LUNITA_ROOT="$LUNITA_ROOT" \
            LUNITA_XDG_STATE_HOME="$LUNITA_XDG_STATE_HOME" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            bash scripts/lunita/run_target_runtime_acceptance_in_container_v1.sh
      - name: Verify target virtual filesystems were unmounted before image materialization
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="${LUNITA_ROOTFS_REAL:-}"
          if [[ -z "$ROOTFS" || ! -d "$ROOTFS" ]]; then
            echo "Rootfs path was not established; preserve the earlier setup/restore failure as the blocking result."
            exit 0
          fi
          for part in dev proc sys run; do
            if mountpoint -q "$ROOTFS/$part"; then
              echo "BLOCKED: target mount remains active: $part"
              exit 2
            fi
          done
      - name: Remove only verified transient Chromium smoke-test sockets
        shell: bash
        run: |
          set -euo pipefail
          sudo -n python3.12 scripts/lunita/clean_transient_browser_tmp_v1.py clean \
            --rootfs "$LUNITA_ROOTFS_REAL" \
            --expected-uid 1000 \
            --receipt "$RUNNER_TEMP/lunita-rootfs-temp-cleanup-receipt.json"
      - name: Build and round-trip verify LUNITA.squashfs
        id: package-squashfs
        shell: bash
        run: |
          set -euo pipefail
          sudo -n apt-get update
          sudo -n apt-get install -y --no-install-recommends squashfs-tools
          RECEIPT_DIR="$LUNITA_XDG_STATE_HOME/lunita/runtime_validation"
          TARGET_RECEIPT_COUNT="$(sudo -n find "$RECEIPT_DIR" -maxdepth 1 -type f -name 'LUNITA_TARGET_RUNTIME_ACCEPTANCE_*.json' -printf '.' | wc -c)"
          if [ "$TARGET_RECEIPT_COUNT" -ne 1 ]; then
            echo "Expected exactly one direct target-runtime receipt; found $TARGET_RECEIPT_COUNT"
            exit 2
          fi
          TARGET_RECEIPT="$(sudo -n find "$RECEIPT_DIR" -maxdepth 1 -type f -name 'LUNITA_TARGET_RUNTIME_ACCEPTANCE_*.json' -print -quit)"
          IMAGE_DIR="$RUNNER_TEMP/lunita-squashfs"
          mkdir -p "$IMAGE_DIR"
          sudo -n python3.12 scripts/lunita/package_candidate_squashfs_v1.py \
            --rootfs "$LUNITA_ROOTFS_REAL" \
            --target-receipt "$TARGET_RECEIPT" \
            --output "$IMAGE_DIR/LUNITA.squashfs"
          sudo -n chmod 0644 "$IMAGE_DIR/LUNITA.squashfs" "$IMAGE_DIR/LUNITA.squashfs.sha256" "$IMAGE_DIR/LUNITA_SQUASHFS_PACKAGE_RECEIPT.json"
          sudo -n chmod 0755 "$IMAGE_DIR"
          printf 'image=%s\n' "$IMAGE_DIR/LUNITA.squashfs" >> "$GITHUB_OUTPUT"
      - name: Upload verified LUNITA.squashfs candidate artifact
        if: always() && steps.package-squashfs.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lunita-v1-8-squashfs-candidate
          path: |
            ${{ runner.temp }}/lunita-squashfs/LUNITA.squashfs
            ${{ runner.temp }}/lunita-squashfs/LUNITA.squashfs.sha256
            ${{ runner.temp }}/lunita-squashfs/LUNITA_SQUASHFS_PACKAGE_RECEIPT.json
          if-no-files-found: error
          retention-days: 90
      - name: Run the existing v1.8 independent rootfs and JASP certification lane
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PATH="$PATH" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            LUNITA_XDG_STATE_HOME="$LUNITA_XDG_STATE_HOME" \
            LUNITA_ROOTFS_REAL="$LUNITA_ROOTFS_REAL" \
            bash scripts/lunita/run_independent_certification_lane_in_container_v1.sh
      - name: Certify the exact SquashFS image from S32 and independent evidence
        shell: bash
        run: |
          set -euo pipefail
          CERT_STATE="$RUNNER_TEMP/lunita-stability-state"
          CERT_CANDIDATE="$RUNNER_TEMP/lunita-stability-candidate"
          IMAGE_DIR="$RUNNER_TEMP/lunita-squashfs"
          sudo -n env PATH="$PATH" python3.12 scripts/lunita/certify_candidate_squashfs_v1.py \
            --image "$IMAGE_DIR/LUNITA.squashfs" \
            --checksum "$IMAGE_DIR/LUNITA.squashfs.sha256" \
            --package-receipt "$IMAGE_DIR/LUNITA_SQUASHFS_PACKAGE_RECEIPT.json" \
            --target-receipt-dir "$LUNITA_XDG_STATE_HOME/lunita/runtime_validation" \
            --independent-report "$CERT_CANDIDATE/BETA_INDEPENDENT_VALIDATION.json" \
            --candidate-manifest "$GITHUB_WORKSPACE/LUNITA_V1_8_CANDIDATE_FREEZE.json" \
            --s32-receipt-dir "$CERT_STATE/worker_outputs" \
            --stable-release-dir "$CERT_STATE/releases/LUNITA_STABLE_1_8" \
            --output "$IMAGE_DIR/LUNITA_FUNCTIONAL_CERTIFICATE.json"
          sudo -n chmod 0644 "$IMAGE_DIR/LUNITA_FUNCTIONAL_CERTIFICATE.json"
      - name: Upload certified Lunita v1.8 SquashFS bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lunita-v1-8-squashfs-certified
          path: |
            ${{ runner.temp }}/lunita-squashfs/LUNITA.squashfs
            ${{ runner.temp }}/lunita-squashfs/LUNITA.squashfs.sha256
            ${{ runner.temp }}/lunita-squashfs/LUNITA_SQUASHFS_PACKAGE_RECEIPT.json
            ${{ runner.temp }}/lunita-squashfs/LUNITA_FUNCTIONAL_CERTIFICATE.json
          if-no-files-found: error
          retention-days: 90
      - name: Collect immutable target and independent evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/lunita-certification-evidence"
          mkdir -p "$OUT"
          run_root() {
            if [ "$(id -u)" -eq 0 ]; then "$@"; else sudo -n "$@"; fi
          }
          for PATH_IN in \
            "${LUNITA_XDG_STATE_HOME:-}/lunita/runtime_validation" \
            "${LUNITA_ROOT:-}/engines/runtime_engines_v1/OVERLAY_APPLY_RECEIPT.json" \
            "${LUNITA_CHECKPOINT_DIR:-}" \
            "$RUNNER_TEMP/lunita-rootfs-temp-cleanup-receipt.json" \
            "$RUNNER_TEMP/lunita-rootfs-base-cache/LUNITA_ROOTFS_BASE_CACHE_RECEIPT.json"; do
            if [ -n "$PATH_IN" ] && [ -e "$PATH_IN" ]; then
              run_root cp -a "$PATH_IN" "$OUT/"
            fi
          done
          for PATH_IN in \
            "$RUNNER_TEMP/lunita-stability-state" \
            "$RUNNER_TEMP/lunita-stability-candidate"; do
            if [ -e "$PATH_IN" ]; then
              run_root cp -a "$PATH_IN" "$OUT/"
            fi
          done
          run_root chmod -R a+rX "$OUT"
      - name: Final cleanup of target rootfs mounts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${LUNITA_ROOTFS_REAL:-}" ] && [ -d "$LUNITA_ROOTFS_REAL" ]; then
            for part in run sys proc dev; do
              if mountpoint -q "$LUNITA_ROOTFS_REAL/$part"; then
                sudo -n umount -R "$LUNITA_ROOTFS_REAL/$part"
              fi
            done
            for part in dev proc sys run; do
              if mountpoint -q "$LUNITA_ROOTFS_REAL/$part"; then
                echo "BLOCKED: target mount remains active after cleanup: $part"
                exit 2
              fi
            done
          fi
      - name: Upload real target and independent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunita-v1-8-target-independent-evidence
          path: ${{ runner.temp }}/lunita-certification-evidence/
          if-no-files-found: warn
          retention-days: 30
