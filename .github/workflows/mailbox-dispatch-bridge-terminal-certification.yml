name: "CUSTOSZ Mailbox — terminal post-promotion certification"

on:
  push:
    branches:
      - staging/mailbox-dispatch-bridge-repair-20261002
    paths:
      - mission-control/mailbox-dispatch-bridge-terminal/**

permissions:
  contents: read

concurrency:
  group: mailbox-dispatch-bridge-terminal-certification
  cancel-in-progress: false

env:
  CANDIDATE_DIGEST: "08cb7d9d9913cc474e3356db71893b03bd4a1fcf03fffb491dc9f5aaf6b75cd5"
  EVIDENCE_ROOT: "evidence/mailbox-dispatch-bridge-certified/08cb7d9d9913cc474e3356db71893b03bd4a1fcf03fffb491dc9f5aaf6b75cd5"

jobs:
  g23_terminal:
    name: "G23 terminal — live-state independent validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      g23_terminal_sha256: ${{ steps.validate.outputs.g23_terminal_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: staging/mailbox-dispatch-bridge-repair-20261002
          persist-credentials: false
          fetch-depth: 1

      - id: validate
        name: Validate live state against exact G24-certified package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile             scripts/mission_mailbox/route_mission.py             scripts/mission_mailbox/dispatch_execution.py             scripts/mission_mailbox/test_dispatch_execution.py
          python3 -B -I scripts/mission_mailbox/test_router_policy.py
          python3 -B -I scripts/mission_mailbox/test_dispatch_execution.py

          mkdir -p "$RUNNER_TEMP/g23-terminal"
          python3 - "$EVIDENCE_ROOT" "$CANDIDATE_DIGEST" "$RUNNER_TEMP/g23-terminal/G23_TERMINAL.json" <<'PY'
          import hashlib,json,pathlib,sys,datetime as dt
          root=pathlib.Path(sys.argv[1]); digest=sys.argv[2]; out=pathlib.Path(sys.argv[3])
          package=json.load(open(root/"PROMOTION_PACKAGE.json",encoding="utf-8"))
          prior_g23=json.load(open(root/"G23.json",encoding="utf-8"))
          prior_g24=json.load(open(root/"G24.json",encoding="utf-8"))
          checks={
              "package_status":package.get("status")=="G24_CERTIFIED_READY_FOR_PROMOTION",
              "package_digest":package.get("candidate_digest_sha256")==digest,
              "prior_g23_pass":prior_g23.get("status")=="PASS",
              "prior_g24_pass":prior_g24.get("status")=="PASS",
              "prior_g24_promotion_authorized":prior_g24.get("promotion_authorized") is True,
              "prior_g23_digest":prior_g23.get("candidate_digest_sha256")==digest,
              "prior_g24_digest":prior_g24.get("candidate_digest_sha256")==digest,
          }
          for item in package["files"]:
              p=pathlib.Path(item["path"])
              if not p.is_file():
                  checks["live_exists:"+item["path"]]=False
                  continue
              b=p.read_bytes(); h=hashlib.sha256(b).hexdigest()
              checks["live_hash:"+item["path"]]=h==item["sha256"]
              checks["live_bytes:"+item["path"]]=len(b)==item["bytes"]
          wf=pathlib.Path(".github/workflows/custosz-mission-mailbox.yml").read_text(encoding="utf-8")
          checks["dispatch_bridge_marker"]="MAILBOX_TERMINAL_DISPATCH_BRIDGE_V1" in wf
          checks["dispatcher_present"]=pathlib.Path("scripts/mission_mailbox/dispatch_execution.py").is_file()
          checks["router_still_preserves_preexecution_state"]="ROUTED_READY_NOT_YET_EXECUTED" in pathlib.Path("scripts/mission_mailbox/route_mission.py").read_text(encoding="utf-8")
          ok=all(checks.values())
          report={
              "schema":"LOUKSNA_MAILBOX_DISPATCH_BRIDGE_TERMINAL_G23/1.0",
              "status":"PASS" if ok else "HOLD",
              "scope":"LIVE_MAILBOX_ROUTER_TO_MATERIAL_DISPATCH_BRIDGE",
              "candidate_digest_sha256":digest,
              "independent_validator":"GITHUB_HOSTED_UBUNTU_G23_TERMINAL",
              "repair_allowed":False,
              "checks":checks,
              "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          if not ok:
              raise SystemExit(23)
          PY
          H="$(sha256sum "$RUNNER_TEMP/g23-terminal/G23_TERMINAL.json" | awk '{print $1}')"
          echo "g23_terminal_sha256=$H" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/g23-terminal/G23_TERMINAL.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mailbox-dispatch-bridge-terminal-g23
          path: ${{ runner.temp }}/g23-terminal/G23_TERMINAL.json
          if-no-files-found: error
          retention-days: 90

  g24_terminal:
    name: "G24 terminal — certify live promoted state"
    needs: g23_terminal
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: staging/mailbox-dispatch-bridge-repair-20261002
          persist-credentials: true
          fetch-depth: 2

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mailbox-dispatch-bridge-terminal-g23
          path: ${{ runner.temp }}/g23-terminal

      - name: Certify exact G23 terminal result with GitHub OIDC
        shell: bash
        env:
          EXPECTED_G23_SHA: ${{ needs.g23_terminal.outputs.g23_terminal_sha256 }}
        run: |
          set -Eeuo pipefail
          G23="$RUNNER_TEMP/g23-terminal/G23_TERMINAL.json"
          test "$(sha256sum "$G23" | awk '{print $1}')" = "$EXPECTED_G23_SHA"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$G23")" = PASS
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["candidate_digest_sha256"])' "$G23")" = "$CANDIDATE_DIGEST"

          AUD="louksna-mailbox-terminal:$CANDIDATE_DIGEST:$EXPECTED_G23_SHA"
          TOKEN_JSON="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$TOKEN_JSON")"
          test -n "$TOKEN"

          DEST="evidence/mailbox-dispatch-bridge-terminal/$CANDIDATE_DIGEST"
          mkdir -p "$DEST"
          cp "$G23" "$DEST/G23_TERMINAL.json"
          TOKEN="$TOKEN" python3 - "$G23" "$EXPECTED_G23_SHA" "$DEST/TERMINAL_CERTIFICATION.json" <<'PY'
          import hashlib,json,os,pathlib,sys,datetime as dt
          g23p=pathlib.Path(sys.argv[1]); g23sha=sys.argv[2]; out=pathlib.Path(sys.argv[3])
          g23=json.load(open(g23p,encoding="utf-8")); token=os.environ["TOKEN"]
          checks={
              "g23_terminal_pass":g23.get("status")=="PASS",
              "g23_terminal_hash_bound":hashlib.sha256(g23p.read_bytes()).hexdigest()==g23sha,
              "oidc_present":bool(token),
          }
          ok=all(checks.values())
          cert={
              "schema":"LOUKSNA_MAILBOX_DISPATCH_BRIDGE_TERMINAL_G24/1.0",
              "status":"PASS" if ok else "BLOCKED",
              "operational_status":"CERTIFIED_ACTIVE_IN_SCOPE" if ok else "HOLD",
              "scope":"LIVE_MAILBOX_ROUTER_TO_MATERIAL_DISPATCH_BRIDGE",
              "authority":"Louksna.md",
              "candidate_digest_sha256":g23.get("candidate_digest_sha256"),
              "g23_terminal_sha256":g23sha,
              "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(token.encode()).hexdigest(),
              "canonical_mutation":False,
              "certification_propagated":False,
              "no_silent_operations":True,
              "checks":checks,
              "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
          }
          out.write_text(json.dumps(cert,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          if not ok:
              raise SystemExit(24)
          PY

          cat "$DEST/TERMINAL_CERTIFICATION.json"
          git config user.name "louksna-github-terminal-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add "$DEST"
          git commit -m "evidence(mailbox): terminally certify promoted dispatch bridge"
          git push origin HEAD:staging/mailbox-dispatch-bridge-repair-20261002

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mailbox-dispatch-bridge-terminal-g24
          path: evidence/mailbox-dispatch-bridge-terminal/${{ env.CANDIDATE_DIGEST }}
          if-no-files-found: error
          retention-days: 90
