name: "R4 PART4 — backup target topology"
on:
  push:
    branches: [staging/luna-r4-master-part1-part9-20260929]
    paths:
      - .github/workflows/r4-part4-backup-target-topology.yml
      - mission-control/r4-part4-backup-target-topology/**
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Inspect local storage targets read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/r4-part4-backup-target-topology-$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          {
            echo "=== LSBLK ==="
            /usr/bin/lsblk -b -O -J
            echo "=== FINDMNT ==="
            /usr/bin/findmnt -J
            echo "=== DF ==="
            /usr/bin/df -B1 -T
          } > "$OUT/TOPOLOGY.txt"
          cat "$OUT/TOPOLOGY.txt"
          sha256sum "$OUT/TOPOLOGY.txt" > "$OUT/SHA256SUMS.txt"
      - name: Preserve topology evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R4-PART4-backup-target-topology-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-part4-backup-target-topology-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14
