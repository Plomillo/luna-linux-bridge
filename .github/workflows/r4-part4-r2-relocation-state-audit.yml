name: "R4 PART4 R2 — forensic relocation-state audit"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-r2-relocation-audit/**

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r4-part4-r2-relocation-state-audit
  cancel-in-progress: false

env:
  P3: /dev/nvme0n1p3
  OWNER: diegoignacionorambuenamiranda
  EXPECTED_MANIFEST_SHA: 99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e

jobs:
  forensic:
    name: "Read-only classify P3 relocation state"
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            server/r4-master
            mission-control/r4-plan-definitivo
          sparse-checkout-cone-mode: true
      - name: Acquire certified manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/freeze"
          gh run download 36619942178 --repo Plomillo/luna-linux-bridge             -n R4-PART4-PROYECTOS-freeze-36619942178 -D "$RUNNER_TEMP/freeze"
          test "$(sha256sum "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz"|awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
      - name: Observe P3 mount and classify manifest-owned top-level placement
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n true
          OUT="$RUNNER_TEMP/audit"; mkdir -p "$OUT"
          findmnt -rn -S "$P3" -o SOURCE,TARGET,FSTYPE,OPTIONS > "$OUT/P3_FINDMNT.txt" || true
          lsblk -b -J -o NAME,PATH,TYPE,SIZE,FSTYPE,FSAVAIL,FSUSE%,MOUNTPOINTS,UUID,PARTUUID,START > "$OUT/LSBLK.json"
          WORK="$HOME/.local/state/louksna/r4-master-part1-part9/PART_4_R2/final-merge"
          EXPECT_NEWROOT="$WORK/newroot"
          PROJECTS="$HOME/PROYECTOS"
          P3_MOUNT="$(findmnt -rn -S "$P3" -o TARGET | head -n1 || true)"
          TEMP_MOUNTED=0
          if [ -z "$P3_MOUNT" ]; then
            P3_MOUNT="$RUNNER_TEMP/p3-readonly"
            mkdir -p "$P3_MOUNT"
            sudo -n mount -o ro,noload "$P3" "$P3_MOUNT"
            TEMP_MOUNTED=1
          fi
          trap 'if [ "$TEMP_MOUNTED" = 1 ]; then sudo -n umount "$P3_MOUNT" || true; fi' EXIT
          export P3_MOUNT EXPECT_NEWROOT PROJECTS
          sudo -n env P3_MOUNT="$P3_MOUNT" EXPECT_NEWROOT="$EXPECT_NEWROOT" PROJECTS="$PROJECTS"             python3 - "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz" "$OUT/RELOCATION_AUDIT.json" <<'PY'
          import gzip,json,os,pathlib,sys,time
          man,out=map(pathlib.Path,sys.argv[1:])
          root=pathlib.Path(os.environ["P3_MOUNT"])
          owner="diegoignacionorambuenamiranda"
          dest=root/"home"/owner/"PROYECTOS"
          tops=set()
          with gzip.open(man,"rt",encoding="utf-8") as f:
              for line in f:
                  p=json.loads(line)["path"]
                  parts=pathlib.PurePosixPath(p).parts
                  if parts: tops.add(parts[0])
          root_present=sorted(n for n in tops if os.path.lexists(root/n))
          dest_present=sorted(n for n in tops if os.path.lexists(dest/n))
          both=sorted(set(root_present)&set(dest_present))
          neither=sorted(tops-set(root_present)-set(dest_present))
          if len(root_present)==len(tops) and not dest_present:
              state="PRE_RELOCATION"
          elif len(dest_present)==len(tops) and not root_present:
              state="POST_RELOCATION"
          elif not both and not neither and (root_present or dest_present):
              state="SPLIT_RELOCATION"
          elif both:
              state="DUPLICATED_MIXED_STATE"
          else:
              state="INCOMPLETE_OR_UNKNOWN"
          q={
            "schema":"LOUKSNA_R4_PART4_R2_RELOCATION_FORENSIC/1.0",
            "status":"PASS" if state in {"PRE_RELOCATION","POST_RELOCATION"} else "HOLD",
            "classification":state,
            "p3_mount":str(root),
            "expected_newroot":os.environ["EXPECT_NEWROOT"],
            "projects_mount":os.environ["PROJECTS"],
            "top_count":len(tops),
            "root_present_count":len(root_present),
            "dest_present_count":len(dest_present),
            "both_count":len(both),
            "neither_count":len(neither),
            "root_present":root_present,
            "dest_present":dest_present,
            "both":both,
            "neither":neither,
            "manifest_sha256":"99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
            "material_mutation":False,
            "captured_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
          if [ "$TEMP_MOUNTED" = 1 ]; then
            sudo -n umount "$P3_MOUNT"
            TEMP_MOUNTED=0
          fi
          sha256sum "$OUT/"* > "$OUT/SHA256SUMS.txt"
      - name: Static audit resume/idempotency/privilege coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/audit"
          python3 - server/r4-master/part4_r2_final_merge_prepare.sh mission-control/r4-plan-definitivo/BUG_AUTONOMY_POLICY.json "$OUT/STATIC_AUDIT.json" <<'PY'
          import hashlib,json,pathlib,re,sys,time
          script,policy,out=map(pathlib.Path,sys.argv[1:])
          s=script.read_text()
          p=json.loads(policy.read_text())
          checks={
            "permanent_sudo_policy":p.get("sudo_policy",{}).get("capability")=="PERMANENT_NONINTERACTIVE_SUDO_ALREADY_AUTHORIZED",
            "same_nature_bug_authorized":p.get("similar_bug_authorization",{}).get("status")=="AUTHORIZED",
            "privileged_verifier_helper":"verify_tree_privileged()" in s and 'sudo -n python3 "$VERIFY"' in s,
            "after_relocation_uses_privileged_verifier":'verify_tree_privileged "$NEWROOT_MNT/home/$OWNER/PROYECTOS"' in s,
            "pre_relocation_is_unconditional":'python3 "$VERIFY" --root "$PROJECTS_MOUNT"' in s,
            "project_mount_precondition_is_unconditional":'[ "$proj_source" = "$NEWROOT_DEV" ] || hold "PROJECTS_NOT_ON_P3:$proj_source"' in s
          }
          q={
            "schema":"LOUKSNA_R4_PART4_R2_RESUME_STATIC_AUDIT/1.0",
            "status":"PASS",
            "checks":checks,
            "script_sha256":hashlib.sha256(script.read_bytes()).hexdigest(),
            "policy_sha256":hashlib.sha256(policy.read_bytes()).hexdigest(),
            "finding":"RESUME_PATH_REQUIRES_STATE_RECONCILIATION" if checks["pre_relocation_is_unconditional"] else "NO_UNCONDITIONAL_PRE_RELOCATION_CHECK",
            "generated_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-relocation-forensic
          path: ${{ runner.temp }}/audit/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23:
    name: "G23 independently validate relocation-state diagnosis"
    needs: forensic
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-relocation-forensic
          path: ${{ runner.temp }}/audit
      - name: G23
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/audit/RELOCATION_AUDIT.json" "$RUNNER_TEMP/audit/STATIC_AUDIT.json" "$RUNNER_TEMP/g23/G23.json" <<'PY'
          import hashlib,json,pathlib,sys,time
          rf,sf,out=map(pathlib.Path,sys.argv[1:])
          r=json.loads(rf.read_text()); s=json.loads(sf.read_text())
          checks={
            "relocation_observation_pass":r.get("status")=="PASS",
            "state_is_unambiguous":r.get("classification") in {"PRE_RELOCATION","POST_RELOCATION"},
            "no_duplicate_mixed_state":r.get("both_count")==0,
            "no_missing_top_level":r.get("neither_count")==0,
            "manifest_bound":r.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
            "no_material_mutation":r.get("material_mutation") is False,
            "static_resume_bug_evidenced":s.get("finding")=="RESUME_PATH_REQUIRES_STATE_RECONCILIATION",
            "permanent_sudo_policy_bound":s.get("checks",{}).get("permanent_sudo_policy") is True
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_R2_RELOCATION_BUG_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "classification":"RESUME_IDEMPOTENCY_STATE_MISMATCH" if ok else "UNRESOLVED",
            "observed_material_state":r.get("classification"),
            "checks":checks,
            "relocation_audit_sha256":hashlib.sha256(rf.read_bytes()).hexdigest(),
            "static_audit_sha256":hashlib.sha256(sf.read_bytes()).hexdigest(),
            "minimum_corrective_delta":"Make plan/prepare reconcile PRE_RELOCATION vs POST_RELOCATION and verify the location that actually contains the certified manifest-owned tree; never move/copy already-relocated data twice.",
            "g24_allowed":ok,
            "validated_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-relocation-g23
          path: ${{ runner.temp }}/g23/G23.json
          retention-days: 90
          compression-level: 0

  g24:
    name: "G24 certify relocation-state bug diagnosis"
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-relocation-g23
          path: ${{ runner.temp }}/g23
      - name: G24
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"
          AUD="louksna-r4-relocation-resume-bug:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24.json" <<'PY'
          import base64,hashlib,json,os,pathlib,sys,time
          t=os.environ["TOKEN"]; p=t.split(".")[1]; p += "="*((4-len(p)%4)%4); c=json.loads(base64.urlsafe_b64decode(p))
          aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={
            "schema":"LOUKSNA_R4_PART4_R2_RELOCATION_BUG_G24/1.0",
            "status":"PASS",
            "certified_scope":"RESUME_IDEMPOTENCY_STATE_MISMATCH_DIAGNOSIS_AND_MINIMUM_RECONCILIATION_DELTA",
            "g23_sha256":os.environ["H"],
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
            "repeat_projects_migration":False,
            "repeat_partition_migration":False,
            "scope_expansion":False,
            "privilege_expansion":False,
            "authorized_fix":"state-aware PRE_RELOCATION/POST_RELOCATION reconciliation only",
            "certified_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-relocation-g24
          path: ${{ runner.temp }}/g24/G24.json
          retention-days: 90
          compression-level: 0
