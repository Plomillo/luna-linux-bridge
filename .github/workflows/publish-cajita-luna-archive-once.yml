name: One-shot Cajita de Luna archive publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-cajita-luna-archive-once.yml"

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARCHIVE: /home/diegoignacionorambuenamiranda/Descargas/CajitadeLuna.7z
      EXPECTED_BYTES: "348027363"
      EXPECTED_SHA256: b40150508f702ee456da4041927611c5f0f78639d45a8582eff2e88258eb6abf
      TAG: cajita-luna-archive-2026-10-23-b4015050

    steps:
      - name: Validate exact source file
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          actual_bytes="$(stat -c '%s' "$ARCHIVE")"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum -c -
          7z t -bd "$ARCHIVE" > "$RUNNER_TEMP/cajita-7z-test.log" 2>&1 || {
            tail -30 "$RUNNER_TEMP/cajita-7z-test.log"
            exit 1
          }
          tail -5 "$RUNNER_TEMP/cajita-7z-test.log"

      - name: Prepare checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_SHA256" "CajitadeLuna.7z" > "$RUNNER_TEMP/CajitadeLuna.7z.sha256"
          {
            printf '%s\n\n' 'Original Cajita de Luna archive uploaded without modifying its bytes.'
            printf -- '- Archive size: %s bytes\n' "$EXPECTED_BYTES"
            printf -- '- SHA-256: `%s`\n' "$EXPECTED_SHA256"
            printf '%s\n' '- Archive integrity test: `7z t` passed before publication.'
            printf -- '- Uncompressed content size reported by 7-Zip: %s bytes.\n' '430611776'
            printf '%s\n' '- Round-trip integrity is verified by downloading the published asset and rechecking SHA-256.'
            printf '\n%s\n' 'This release records artifact distribution and integrity only. It does not assert complete functional equivalence, independent validation, or runtime certification.'
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" --json assets > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            gh release edit "$TAG" --repo "$GH_REPO" \
              --title "Cajita de Luna archive — candidate upload (2026-10-23)" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --target main \
              --title "Cajita de Luna archive — candidate upload (2026-10-23)" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "$ARCHIVE#CajitadeLuna.7z" \
              "$RUNNER_TEMP/CajitadeLuna.7z.sha256#CajitadeLuna.7z.sha256"
          fi

      - name: Verify published asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$EXPECTED_BYTES" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_size = int(sys.argv[2])
          assets = data.get("assets", [])
          archive = next((a for a in assets if a.get("name") == "CajitadeLuna.7z"), None)
          checksum = next((a for a in assets if a.get("name") == "CajitadeLuna.7z.sha256"), None)
          if not archive or archive.get("size") != expected_size:
              raise SystemExit("FAIL: GitHub release asset name/size mismatch")
          if not checksum or checksum.get("size", 0) == 0:
              raise SystemExit("FAIL: checksum sidecar missing")
          print("RELEASE_URL=" + data.get("url", ""))
          print("TAG=" + data.get("tagName", ""))
          print("ASSET_NAME=" + archive["name"])
          print("ASSET_SIZE=" + str(archive["size"]))
          print("CHECKSUM_ASSET=" + checksum["name"])
          PY
          verify_dir="$RUNNER_TEMP/cajita-roundtrip-verification"
          mkdir -p "$verify_dir"
          gh release download "$TAG" --repo "$GH_REPO" --pattern "CajitadeLuna.7z*" --dir "$verify_dir"
          (
            cd "$verify_dir"
            sha256sum -c "CajitadeLuna.7z.sha256"
          )
          rm -rf "$verify_dir"
          echo "ROUNDTRIP_SHA256_VERIFICATION=PASS"

      - name: Disable temporary publisher after verified release
        if: success()
        shell: bash
        run: gh workflow disable publish-cajita-luna-archive-once.yml --repo "$GH_REPO"
