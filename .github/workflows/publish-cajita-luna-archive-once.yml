name: One-shot Cajita de Luna archive publisher

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-cajita-luna-archive-once.yml"

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ARCHIVE: /home/diegoignacionorambuenamiranda/Descargas/CajitadeLuna.7z
      EXPECTED_BYTES: "348027363"
      EXPECTED_SHA256: b40150508f702ee456da4041927611c5f0f78639d45a8582eff2e88258eb6abf
      TAG: cajita-luna-archive-2026-10-23-b4015050

    steps:
      - name: Validate exact source file
        shell: bash
        run: |
          set -euo pipefail
          test -f "$ARCHIVE"
          actual_bytes="$(stat -c '%s' "$ARCHIVE")"
          test "$actual_bytes" = "$EXPECTED_BYTES"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum -c -
          7z t -bd "$ARCHIVE" > "$RUNNER_TEMP/cajita-7z-test.log" 2>&1 || {
            tail -30 "$RUNNER_TEMP/cajita-7z-test.log"
            exit 1
          }
          tail -5 "$RUNNER_TEMP/cajita-7z-test.log"

      - name: Prepare checksum and release notes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_SHA256" "CajitadeLuna.7z" > "$RUNNER_TEMP/CajitadeLuna.7z.sha256"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          Original Cajita de Luna archive uploaded without modifying its bytes.

          - Archive size: 348,027,363 bytes
          - SHA-256: `$EXPECTED_SHA256`
          - Archive integrity test: `7z t` passed before publication.
          - Uncompressed content size reported by 7-Zip: 430,611,776 bytes.

          This release records artifact distribution and integrity only. It does not assert complete functional equivalence, independent validation, or runtime certification.
          EOF

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Refusing to overwrite an existing release: $TAG"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --target main \
            --title "Cajita de Luna archive — candidate upload (2026-10-23)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "$ARCHIVE#CajitadeLuna.7z" \
            "$RUNNER_TEMP/CajitadeLuna.7z.sha256#CajitadeLuna.7z.sha256"

      - name: Verify published asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GH_REPO" --json url,tagName,assets > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" "$EXPECTED_BYTES" "$EXPECTED_SHA256" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          expected_size = int(sys.argv[2])
          expected_digest = "sha256:" + sys.argv[3]
          assets = data.get("assets", [])
          archive = next((a for a in assets if a.get("name") == "CajitadeLuna.7z"), None)
          checksum = next((a for a in assets if a.get("name") == "CajitadeLuna.7z.sha256"), None)
          if not archive or archive.get("size") != expected_size:
              raise SystemExit("FAIL: GitHub release asset name/size mismatch")
          digest = archive.get("digest")
          if digest and digest.lower() != expected_digest:
              raise SystemExit("FAIL: GitHub-reported digest mismatch")
          if not checksum or checksum.get("size", 0) == 0:
              raise SystemExit("FAIL: checksum sidecar missing")
          print("RELEASE_URL=" + data.get("url", ""))
          print("TAG=" + data.get("tagName", ""))
          print("ASSET_NAME=" + archive["name"])
          print("ASSET_SIZE=" + str(archive["size"]))
          print("ASSET_SHA256_METADATA=" + (digest or "not-exposed-by-GitHub"))
          print("CHECKSUM_ASSET=" + checksum["name"])
          print("UPLOAD_VERIFICATION=PASS")
          PY

      - name: Disable temporary publisher after verified release
        if: success()
        shell: bash
        run: gh workflow disable publish-cajita-luna-archive-once.yml --repo "$GH_REPO"
