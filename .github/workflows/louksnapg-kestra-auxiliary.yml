name: LOUKSNAPG product artifact and Kestra auxiliary audit

on:
  push:
    branches:
      - "louksnapg/**"
    paths:
      - ".github/workflows/louksnapg-kestra-auxiliary.yml"
      - "contracts/louksnapg/architecture-contract.v1.json"
      - "tools/louksnapg_architecture_contract.py"
      - "integrations/kestra/flows/24-louksnapg-bundle-audit.yml"
      - ".github/workflows/cajita-louksna1-factory.yml"
      - ".github/workflows/louksnapg-bundle-ci.yml"
      - "tools/louksnapg_integral_gate.py"
      - "tools/louksnapg_six_obligation_audit.py"
      - "tests/test_louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_worker_mission.py"
      - "tests/test_louksnapg_six_obligation_audit.py"
      - "docs/cajita-luna/LOUKSNAPG_ARCHITECTURAL_CONTRACT.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.json"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Factory workflow run ID to audit
        required: true
        type: string
      source_commit:
        description: Exact source commit SHA for that run
        required: true
        type: string
  workflow_run:
    workflows:
      - "Cajita V9 materialization and Louksna1 governed factory"
    types:
      - completed
    branches:
      - main
      - "louksnapg/**"

permissions:
  actions: read
  contents: read

concurrency:
  # Each run is bound to one concrete producer/source SHA. Avoid a stale
  # polling run monopolizing the branch and blocking the replacement audit.
  group: louksnapg-aux-audit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  independently-validate-and-publish-product-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out verifier at the auxiliary workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve exact factory run and source SHA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          event=json.loads(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8").read())
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          supplied_run=None
          wanted_sha=None
          branch=None
          if "workflow_run" in event:
              wr=event["workflow_run"]
              supplied_run=str(wr["id"])
              wanted_sha=wr["head_sha"]
              branch=wr["head_branch"]
          elif event.get("inputs"):
              supplied_run=str(event["inputs"]["source_run_id"]).strip()
              wanted_sha=str(event["inputs"]["source_commit"]).strip()
          else:
              # GitHub push events identify the pushed commit with "after"; "before"
              # is only the predecessor and cannot bind the factory output.
              wanted_sha=str(event.get("after") or event.get("head_commit",{}).get("id","")).strip()
              branch=str(event.get("ref","").removeprefix("refs/heads/"))
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}
          def get(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          def product_candidate_ready(run):
              # Wait for the exact G24 runtime task evidence as well as manufacture and
              # package-level G23. G24 does not need to pass for Kestra to audit it:
              # a completed failed G24 is still the truthful subject of the secondary audit.
              jobs_result=get("/actions/runs/"+urllib.parse.quote(str(run["id"]),safe="")+"/jobs?per_page=100")
              jobs_by_name={item.get("name"):item for item in jobs_result.get("jobs",[])}
              required_integrity=("manufacture","g23-independent-validation")
              g24_name="g24-resource-limited-runtime-smoke"
              if any(name not in jobs_by_name for name in (*required_integrity,g24_name)):
                  return False
              for name in required_integrity:
                  item=jobs_by_name[name]
                  if item.get("status")=="completed" and item.get("conclusion")!="success":
                      raise RuntimeError("SOURCE_FACTORY_OR_G23_FAILED_CLOSED:"+name+":"+str(item.get("conclusion")))
              if not all(
                  jobs_by_name[name].get("status")=="completed"
                  and jobs_by_name[name].get("conclusion")=="success"
                  for name in required_integrity
              ):
                  return False
              # G24 may correctly fail closed when model quality, trusted G23,
              # or separate G24 evidence is absent. Do not suppress its failure;
              # wait until its own signed/telemetry artifacts have been finalized.
              return jobs_by_name[g24_name].get("status")=="completed"
          selected=None
          for attempt in range(361):
              try:
                  if supplied_run:
                      candidate=get("/actions/runs/"+urllib.parse.quote(supplied_run,safe=""))
                      if wanted_sha and candidate.get("head_sha")!=wanted_sha:
                          raise RuntimeError("SUPPLIED_RUN_SOURCE_COMMIT_MISMATCH")
                      selected=candidate
                  else:
                      query=urllib.parse.urlencode({"branch":branch,"per_page":100})
                      result=get("/actions/workflows/cajita-louksna1-factory.yml/runs?"+query)
                      candidates=[row for row in result.get("workflow_runs",[])
                          if row.get("path")==".github/workflows/cajita-louksna1-factory.yml"
                          and row.get("event")=="push"
                          and row.get("head_branch")==branch]
                      exact=[row for row in candidates if row.get("head_sha")==wanted_sha]
                      if exact:
                          exact.sort(key=lambda row:(row.get("run_attempt",0),row.get("created_at","")),reverse=True)
                          selected=exact[0]
                      elif candidates:
                          # The auxiliary workflow may be the only file changed by
                          # this push. In that case audit the newest factory run on
                          # this same branch, even if that run began after the push event.
                          candidates.sort(key=lambda row:(row.get("created_at",""),row.get("run_attempt",0)),reverse=True)
                          selected=candidates[0]
                  if selected and product_candidate_ready(selected):
                      break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (404,429,500,502,503,504):
                      raise
              if attempt==360:
                  raise SystemExit("FACTORY_MANUFACTURE_AND_G23_NOT_PASSED_WITHIN_AUXILIARY_WAIT_WINDOW")
              time.sleep(10)
          if not selected:
              raise SystemExit("EXACT_FACTORY_RUN_NOT_FOUND")
          final_jobs=get("/actions/runs/"+urllib.parse.quote(str(selected["id"]),safe="")+"/jobs?per_page=100")
          jobs_by_name={item.get("name"):item for item in final_jobs.get("jobs",[])}
          g24=jobs_by_name.get("g24-resource-limited-runtime-smoke",{})
          if g24.get("status")!="completed":
              raise SystemExit("G24_TERMINAL_STATE_NOT_CONFIRMED")
          output=os.environ["GITHUB_OUTPUT"]
          with open(output,"a",encoding="utf-8") as handle:
              handle.write("run_id="+str(selected["id"])+"\n")
              handle.write("source_sha="+selected["head_sha"]+"\n")
              handle.write("run_conclusion="+str(selected.get("conclusion") or "unknown")+"\n")
              handle.write("source_branch="+str(selected.get("head_branch") or "")+"\n")
              handle.write("g24_conclusion="+str(g24.get("conclusion") or "unknown")+"\n")
          print(json.dumps({"run_id":selected["id"],"source_sha":selected["head_sha"],"conclusion":selected.get("conclusion"),"branch":selected.get("head_branch"),"g24_conclusion":g24.get("conclusion")},indent=2))
          PY

      - name: Download candidate and reports from the exact factory run
        uses: actions/download-artifact@v4
        with:
          name: louksna1-candidate
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence

      - name: Download exact package-level G23 artifact from the same factory run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: louksna1-g23-evidence
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence/g23-evidence

      - name: Download exact G24 decision artifact from the same factory run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: louksna1-g24-evidence
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence/g24-evidence

      - name: Download exact G24 runtime telemetry from the same factory run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: louksna1-g24-telemetry
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence/g24-telemetry

      - name: Locate the actual single-file product and source-bound reports
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          find evidence -type f -name 'LOUKSNAPG.md' -print -quit | grep -q .
          PRODUCT="$(find evidence -type f -name 'LOUKSNAPG.md' -print -quit)"
          cp "$PRODUCT" candidate/LOUKSNAPG.md
          for name in LOUKSNAPG_BUILD_REPORT.json LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json; do
            source="$(find evidence -type f -name "$name" -print -quit)"
            test -n "$source"
            cp "$source" "candidate/$name"
          done
          G23_EVIDENCE="$(find evidence/g23-evidence -type f -name 'G23_EVIDENCE.json' -print -quit || true)"
          if [ -n "$G23_EVIDENCE" ]; then cp "$G23_EVIDENCE" candidate/LOUKSNAPG_G23_INTEGRITY_EVIDENCE.json; fi
          G24_EVIDENCE="$(find evidence/g24-evidence -type f -name 'LOUKSNA1_G24_EVIDENCE.json' -print -quit || true)"
          G24_TASKS="$(find evidence/g24-telemetry -type f -name 'task-adapter-e2e-raw.json' -print -quit || true)"
          G24_GATE="$(find evidence/g24-telemetry -type f -name 'LOUKSNAPG_FUNCTIONAL_GATE.json' -print -quit || true)"
          if [ -n "$G24_EVIDENCE" ]; then cp "$G24_EVIDENCE" candidate/LOUKSNAPG_G24_DECISION.json; fi
          if [ -n "$G24_TASKS" ]; then cp "$G24_TASKS" candidate/LOUKSNAPG_G24_TASK_DIAGNOSTICS.json; fi
          if [ -n "$G24_GATE" ]; then cp "$G24_GATE" candidate/LOUKSNAPG_G24_FUNCTIONAL_GATE.json; fi
          echo "g24_evidence_available=$([ -n "$G24_EVIDENCE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "g24_task_report_available=$([ -n "$G24_TASKS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "g24_functional_gate_available=$([ -n "$G24_GATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "product_path=candidate/LOUKSNAPG.md" >> "$GITHUB_OUTPUT"
          ls -lh candidate

      - name: Independently verify single-file package, exact hash, provenance and hard cap
        id: verify
        continue-on-error: true
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python -m py_compile tools/louksnapg_independent_validator.py
          python tools/louksnapg_independent_validator.py \
            --bundle candidate/LOUKSNAPG.md \
            --max-bytes 479000000 \
            --expected-source-commit "$SOURCE_COMMIT" \
            --report candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path("candidate/LOUKSNAPG.md")
          build=json.loads(Path("candidate/LOUKSNAPG_BUILD_REPORT.json").read_text(encoding="utf-8"))
          worker=json.loads(Path("candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json").read_text(encoding="utf-8"))
          check=json.loads(Path("candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json").read_text(encoding="utf-8"))
          sha=hashlib.sha256(b.read_bytes()).hexdigest()
          assert b.stat().st_size==check["bundle_bytes"]<=479000000
          assert sha==check["bundle_sha256"]==build["bundle_sha256"]==worker["artifact"]["sha256"]
          assert check["source_commit"]==build["source_commit"]==worker["source_commit"]==os.environ["SOURCE_COMMIT"]
          assert check["container_integrity"]=="PASS"
          assert check["protected_prefix_integrity"]=="PASS"
          assert check["cajita_document_copy_integrity"]=="PASS"
          assert check["runtime_member_integrity"]=="PASS"
          assert check["single_distribution_container"]=="PASS"
          assert check["identity_preservation_status"]=="PASS_SOURCE_IDENTITY_PRESERVED"
          assert check["engine_replacement"]=="FORBIDDEN"
          assert build["identity_preservation_status"]=="PASS_SOURCE_IDENTITY_PRESERVED"
          assert build["engine_replacement"]=="FORBIDDEN"
          assert build["global_certification"]=="NOT_GRANTED"
          assert worker["worker_status"]=="PASS"
          print(json.dumps({"status":"PASS_SINGLE_FILE_PACKAGE_INTEGRITY","artifact":b.name,"bytes":b.stat().st_size,"sha256":sha,"source_commit":check["source_commit"],"worker_status":worker["worker_status"],"global_certification":"NOT_GRANTED"},indent=2))
          PY

      - name: Build contract integrity report and immutable pre-audit telemetry
        id: contract
        if: steps.verify.outcome == 'success'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
          G24_JOB_CONCLUSION: ${{ steps.source.outputs.g24_conclusion }}
        run: |
          set -euo pipefail
          python tools/louksnapg_architecture_contract.py \
            --contract contracts/louksnapg/architecture-contract.v1.json \
            --report candidate/LOUKSNAPG_ARCHITECTURE_CONTRACT.json
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          cp=Path("contracts/louksnapg/architecture-contract.v1.json")
          contract_bytes=cp.read_bytes()
          contract_sha=hashlib.sha256(contract_bytes).hexdigest()
          report=json.loads(Path("candidate/LOUKSNAPG_ARCHITECTURE_CONTRACT.json").read_text(encoding="utf-8"))
          bundle=Path("candidate/LOUKSNAPG.md")
          bundle_sha=hashlib.sha256(bundle.read_bytes()).hexdigest()
          worker_path=Path("candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json")
          worker=json.loads(worker_path.read_text(encoding="utf-8"))
          worker_sha=hashlib.sha256(worker_path.read_bytes()).hexdigest()
          validation=json.loads(Path("candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json").read_text(encoding="utf-8"))
          now=lambda:datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          task_path=Path("candidate/LOUKSNAPG_G24_TASK_DIAGNOSTICS.json")
          gate_path=Path("candidate/LOUKSNAPG_G24_FUNCTIONAL_GATE.json")
          g24_path=Path("candidate/LOUKSNAPG_G24_DECISION.json")
          task_report=json.loads(task_path.read_text(encoding="utf-8")) if task_path.is_file() else {}
          gate_report=json.loads(gate_path.read_text(encoding="utf-8")) if gate_path.is_file() else {}
          g24_report=json.loads(g24_path.read_text(encoding="utf-8")) if g24_path.is_file() else {}
          task_rows=task_report.get("task_results",[]) if isinstance(task_report.get("task_results",[]),list) else []
          quality_pass_count=sum(1 for row in task_rows if isinstance(row,dict) and row.get("status")=="PASS_FUNCTIONAL_EXECUTION" and row.get("exit_code")==0 and (row.get("quality_acceptance") or {}).get("status")=="PASS")
          quality_fail_count=sum(1 for row in task_rows if isinstance(row,dict) and (row.get("quality_acceptance") or {}).get("status")=="FAIL")
          observed_target_ids=sorted({row.get("target_id") for row in task_rows if isinstance(row,dict) and isinstance(row.get("target_id"),str)})
          task_sha=hashlib.sha256(task_path.read_bytes()).hexdigest() if task_path.is_file() else None
          gate_subject_bound=gate_report.get("source_commit")==os.environ["SOURCE_COMMIT"] and gate_report.get("bundle_sha256")==bundle_sha
          g24_subject_bound=g24_report.get("source_commit")==os.environ["SOURCE_COMMIT"] and g24_report.get("package_sha256")==bundle_sha
          synthetic_diagnostics=bool(task_report) and ("synthetic" in str(task_report.get("inputs","")).casefold() or any(isinstance(row,dict) and (row.get("quality_acceptance") or {}).get("reference_kind")=="FIXED_SYNTHETIC_EXPECTATION" for row in task_rows))
          functional_status="FAIL" if quality_fail_count>0 or gate_report.get("decision")=="HOLD" else "NOT_ESTABLISHED"
          functional_absence={
            "schema":"LOUKSNAPG_FUNCTIONAL_EVIDENCE/1.0",
            "status":functional_status,
            "execution_mode":"SYNTHETIC_DIAGNOSTIC_ONLY" if synthetic_diagnostics else ("REAL_RUNTIME_EXECUTION_INCOMPLETE" if task_report else "NOT_PERFORMED"),
            "synthetic_only":True if synthetic_diagnostics else None,
            "source_commit":os.environ["SOURCE_COMMIT"],
            "bundle_sha256":bundle_sha,
            "task_harness_status":task_report.get("status","NOT_COMPLETED"),
            "task_report_sha256":task_sha,
            "task_execution_count":len(task_rows),
            "observed_target_ids":observed_target_ids,
            "observed_target_count":len(observed_target_ids),
            "expected_target_count":21,
            "quality_pass_count":quality_pass_count,
            "quality_fail_count":quality_fail_count,
            "target_pass_count":0 if synthetic_diagnostics or gate_report.get("decision")!="PASS" else quality_pass_count,
            "all_21_target_task_coverage":"NOT_ESTABLISHED",
            "g24_job_conclusion":os.environ.get("G24_JOB_CONCLUSION","unknown"),
            "functional_gate_decision":gate_report.get("decision","NOT_ESTABLISHED"),
            "functional_gate_subject_binding":"PASS" if gate_subject_bound else "HOLD",
            "g24_decision_status":g24_report.get("decision","NOT_GRANTED"),
            "g24_subject_binding":"PASS" if g24_subject_bound else "HOLD",
            "diagnostic_only":True,
            "reason":"Synthetic fixed-fixture diagnostics are not product proof; the last G24 run observed quality failures and did not establish all 21 real target adapters.",
            "global_certification":"NOT_GRANTED"
          }
          fp=Path("candidate/LOUKSNAPG_FUNCTIONAL_EVIDENCE_NOT_ESTABLISHED.json")
          fp.write_text(json.dumps(functional_absence,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          functional_sha=hashlib.sha256(fp.read_bytes()).hexdigest()
          g23_absence={"schema":"LOUKSNAPG_G23_ATTESTATION_STATUS/1.0","status":"NOT_PERFORMED","source_commit":os.environ["SOURCE_COMMIT"],"bundle_sha256":bundle_sha,"reason":"No trusted independent G23 signed attestation was provided.","global_certification":"NOT_GRANTED"}
          gp=Path("candidate/LOUKSNAPG_G23_ATTESTATION_NOT_PERFORMED.json")
          gp.write_text(json.dumps(g23_absence,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          g23_sha=hashlib.sha256(gp.read_bytes()).hexdigest()
          g24_absence={"schema":"LOUKSNAPG_G24_DECISION_STATUS/1.0","status":"NOT_GRANTED","source_commit":os.environ["SOURCE_COMMIT"],"bundle_sha256":bundle_sha,"reason":"No separate authorized G24 signed decision was provided.","global_certification":"NOT_GRANTED"}
          g24p=Path("candidate/LOUKSNAPG_G24_DECISION_NOT_GRANTED.json")
          g24p.write_text(json.dumps(g24_absence,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          g24_sha=hashlib.sha256(g24p.read_bytes()).hexdigest()
          rows=[
            ("SOURCE","HOLD_REVISION_PIN_PENDING","Official source documentation reviewed; exact upstream revision and model weight hashes not established."),
            ("INPUT","PASS","Candidate and source-bound reports hashed."),
            ("OPERATION","PASS" if worker.get("worker_status")=="PASS" else "HOLD","Bounded CUSTOSZ V9 package build receipt; not model inference evidence."),
            ("OUTPUT","PASS" if validation.get("container_integrity")=="PASS" and validation.get("bundle_sha256")==bundle_sha else "HOLD","Independent package integrity bound to exact candidate SHA-256."),
            ("TEST","HOLD_NO_REAL_21_TARGET_EVIDENCE","No real non-synthetic result envelope for all 21 primitive targets is available."),
            ("VALIDATION","PASS" if report.get("contract_status")=="PASS" and validation.get("container_integrity")=="PASS" else "HOLD","Static contract and package integrity only."),
            ("INDEPENDENT_VALIDATION_G23","NOT_PERFORMED","No signed product-level G23 attestation claimed."),
            ("KESTRA_AUDIT","PENDING_DISPATCH","Pre-audit telemetry snapshot is the audit input envelope; execution receipt is separately persisted."),
            ("CERTIFICATION_DECISION_G24","NOT_GRANTED","Separate authorized G24 signature is absent."),
            ("NON_REGRESSION","PENDING","Complete functional and no-regression evidence not established."),
            ("ROLLBACK","NOT_RUNTIME_VERIFIED","Rollback restoration has not been runtime-tested.")
          ]
          events=[]
          for i,(kind,status,detail) in enumerate(rows,1):
            event={
              "operation_id":"LOUKSNAPG-AUX-"+os.environ["SOURCE_COMMIT"][:12],
              "sequence_id":i,
              "timestamp_utc":now(),
              "actor":"github-actions",
              "tool_name":"LOUKSNAPG auxiliary audit",
              "tool_version":"branch-revision-bound",
              "source":"github://"+os.environ.get("GITHUB_REPOSITORY","unknown")+"/commit/"+os.environ["SOURCE_COMMIT"],
              "source_commit":os.environ["SOURCE_COMMIT"],
              "bundle_sha256":bundle_sha,
              "contract_sha256":contract_sha,
              "input_sha256":contract_sha if kind in ("SOURCE","VALIDATION") else worker_sha,
              "input_bytes":len(contract_bytes) if kind in ("SOURCE","VALIDATION") else worker_path.stat().st_size,
              "validation_status":status,
              "rollback_reference":"PR 157 feature branch only; main unchanged; preserve inputs and revert branch commit if needed",
              "status":status,
              "event_type":kind,
              "count":1,
              "details":detail
            }
            raw=json.dumps(event,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
            event_sha=hashlib.sha256(raw).hexdigest()
            event["output_bytes"]=len(raw)
            event["output_sha256"]=event_sha
            event["evidence_sha256"]=event_sha
            events.append(event)
          telem={
            "schema":"LOUKSNAPG_PERSISTENT_TELEMETRY_SNAPSHOT/1.0",
            "source_commit":os.environ["SOURCE_COMMIT"],
            "bundle_sha256":bundle_sha,
            "contract_sha256":contract_sha,
            "generated_at_utc":now(),
            "trace_integrity":"PASS_SHA256_BOUND_IMMUTABLE_PREAUDIT_SNAPSHOT",
            "status":"INCOMPLETE_HOLD",
            "release_telemetry_status":"INCOMPLETE_HOLD",
            "events":events,
            "safety":{"heavy_model_download_count":0,"remote_commander_used":False,"canonical_mutation":False,"synthetic_evidence_used_as_product_proof":False},
            "missing_release_evidence":["exact pinned upstream revisions and model weight hashes","real inference for five model-backed targets","21 non-synthetic functional results","G23 signed attestation","separate signed G24 decision","host matrix","runtime rollback verification","full non-regression review"],
            "global_certification":"NOT_GRANTED"
          }
          telem_canonical=json.dumps(telem,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          telem["evidence_sha256"]=hashlib.sha256(telem_canonical).hexdigest()
          tp=Path("candidate/LOUKSNAPG_TELEMETRY_PREAUDIT.json")
          tp.write_text(json.dumps(telem,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          telemetry_sha=hashlib.sha256(tp.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as h:
            h.write("sha256="+contract_sha+"\n")
            h.write("telemetry_sha256="+telemetry_sha+"\n")
            h.write("worker_sha256="+worker_sha+"\n")
            h.write("functional_sha256="+functional_sha+"\n")
            h.write("g23_sha256="+g23_sha+"\n")
            h.write("g24_sha256="+g24_sha+"\n")
            h.write("contract_status="+("PASS_CONTRACT_INTEGRITY" if report.get("contract_status")=="PASS" else "HOLD")+"\n")
          print(json.dumps({"contract_sha256":contract_sha,"contract_status":report.get("contract_status"),"telemetry_sha256":telemetry_sha,"telemetry_events":len(events),"release_telemetry_status":"INCOMPLETE_HOLD","global_certification":"NOT_GRANTED"},indent=2))
          PY

      - name: Upload the single product file as its own download artifact
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: LOUKSNAPG-PRODUCT-CANDIDATE
          path: candidate/LOUKSNAPG.md
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Invoke Kestra auxiliary audit when credentials are configured
        id: kestra
        if: steps.verify.outcome == 'success'
        continue-on-error: true
        env:
          KESTRA_URL: ${{ vars.KESTRA_URL || secrets.KESTRA_URL }}
          KESTRA_API_TOKEN: ${{ secrets.KESTRA_API_TOKEN }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
          CONTRACT_SHA256: ${{ steps.contract.outputs.sha256 }}
          CONTRACT_STATUS: ${{ steps.contract.outputs.contract_status }}
          TELEMETRY_SHA256: ${{ steps.contract.outputs.telemetry_sha256 }}
          CUSTOSZ_RECEIPT_SHA256: ${{ steps.contract.outputs.worker_sha256 }}
          FUNCTIONAL_EVIDENCE_SHA256: ${{ steps.contract.outputs.functional_sha256 }}
          G23_ABSENCE_SHA256: ${{ steps.contract.outputs.g23_sha256 }}
          G24_ABSENCE_SHA256: ${{ steps.contract.outputs.g24_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          build=json.loads(Path("candidate/LOUKSNAPG_BUILD_REPORT.json").read_text(encoding="utf-8"))
          worker=json.loads(Path("candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json").read_text(encoding="utf-8"))
          validation=json.loads(Path("candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json").read_text(encoding="utf-8"))
          functional=json.loads(Path("candidate/LOUKSNAPG_FUNCTIONAL_EVIDENCE_NOT_ESTABLISHED.json").read_text(encoding="utf-8"))
          bundle=Path("candidate/LOUKSNAPG.md")
          token=os.environ.get("KESTRA_API_TOKEN","")
          base=os.environ.get("KESTRA_URL","").rstrip("/")
          receipt={
            "schema":"LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT/1.0",
            "source_commit":os.environ["SOURCE_COMMIT"],
            "artifact":"LOUKSNAPG.md",
            "bundle_bytes":bundle.stat().st_size,
            "bundle_sha256":hashlib.sha256(bundle.read_bytes()).hexdigest(),
            "integrity_status":"PASS",
            "functional_evidence_status":functional.get("status","NOT_ESTABLISHED"),
            "g23_signature_verification_status":"NOT_ESTABLISHED",
              "g23_producer_id":"NOT_ESTABLISHED",
              "g23_validator_id":"NOT_ESTABLISHED",
              "g24_decision_sha256":os.environ.get("G24_ABSENCE_SHA256",""),
              "g24_decision_status":"NOT_GRANTED",
              "g24_signature_verification_status":"NOT_ESTABLISHED",
              "g24_signer_id":"NOT_GRANTED_NO_SIGNER",
            "global_certification":"NOT_GRANTED",
          }
          if not base or not token:
            receipt.update({"status":"NOT_CONFIGURED","reason":"KESTRA_URL_OR_KESTRA_API_TOKEN_MISSING"})
            Path("candidate/LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n",encoding="utf-8")
            print(json.dumps(receipt,indent=2))
            sys_exit=0
          else:
            import subprocess,sys
            fields={
              "source_commit":os.environ["SOURCE_COMMIT"],
              "bundle_sha256":validation["bundle_sha256"],
              "bundle_bytes":str(validation["bundle_bytes"]),
              "max_bytes":"479000000",
              "document_sha256":build["source_document_sha256"],
              "runtime_source_sha256":build["source_runtime_archive_sha256"],
              "worker_status":worker["worker_status"],
              "independent_integrity_status":"PASS",
              "identity_binding_status":validation["identity_preservation_status"],
              "engine_replacement_status":validation["engine_replacement"],
              "functional_evidence_sha256":os.environ.get("FUNCTIONAL_EVIDENCE_SHA256",""),
              "functional_evidence_source_commit":os.environ["SOURCE_COMMIT"],
              "functional_evidence_status":"NOT_ESTABLISHED",
              "functional_target_pass_count":str(functional.get("target_pass_count",0)),
              "functional_target_expected_count":"21",
              "functional_evidence_mode":functional.get("execution_mode","NOT_PERFORMED"),
              "g23_attestation_sha256":os.environ.get("G23_ABSENCE_SHA256",""),
              "g23_signature_verification_status":"NOT_ESTABLISHED",
              "architecture_contract_sha256":os.environ.get("CONTRACT_SHA256",""),
              "architecture_contract_status":os.environ.get("CONTRACT_STATUS","HOLD"),
              "primary_worker_id":"CUSTOSZ_V9",
              "secondary_worker_id":"KESTRA",
              "custosz_worker_evidence_sha256":os.environ.get("CUSTOSZ_RECEIPT_SHA256",""),
              "official_source_review_status":"NOT_ESTABLISHED",
              "telemetry_evidence_sha256":os.environ.get("TELEMETRY_SHA256",""),
              "telemetry_status":"INCOMPLETE_HOLD",
              "heavy_model_download_count":"0",
              "remote_commander_used":"false",
              "functional_status":"FAIL" if functional.get("status")=="FAIL" else "NOT_ESTABLISHED",
              "semantic_quality_status":"FAIL" if int(functional.get("quality_fail_count",0))>0 else "NOT_ESTABLISHED",
              "host_matrix_status":"NOT_ESTABLISHED",
              "rollback_status":"NOT_ESTABLISHED",
              "axiom_binding_status":"NOT_ESTABLISHED",
              "block_binding_status":"NOT_ESTABLISHED",
            }
            cmd=["curl","--fail-with-body","--silent","--show-error","--max-time","60","-X","POST",
                 base+"/api/v1/main/executions/louksna.kestra/louksnapg_bundle_audit",
                 "-H","Authorization: Bearer "+token]
            for key,value in fields.items():
              cmd.extend(["-F",key+"="+value])
            proc=subprocess.run(cmd,capture_output=True,text=True,check=False)
            receipt["status"]="DISPATCHED_AWAITING_TERMINAL_STATE" if proc.returncode==0 else "SUBMISSION_FAILED"
            receipt["http_response_sha256"]=hashlib.sha256(proc.stdout.encode()).hexdigest()
            receipt["curl_return_code"]=proc.returncode
            receipt["dispatch_observed_at_utc"]=__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()
            try:
              response=json.loads(proc.stdout)
              receipt["execution_id"]=response.get("id")
              receipt["execution_url"]=response.get("url")
            except json.JSONDecodeError:
              receipt["response_tail"]=proc.stdout[-800:]
            if proc.returncode!=0:
              receipt["error_tail"]=proc.stderr[-800:]
            if proc.returncode==0 and receipt.get("execution_id"):
              import time,urllib.error,urllib.parse,urllib.request
              execution_id=urllib.parse.quote(str(receipt["execution_id"]),safe="")
              terminal={"SUCCESS","FAILED","WARNING","KILLED","CANCELLED","SKIPPED","RESTARTED"}
              poll_log=[]
              for attempt in range(45):
                req=urllib.request.Request(base+"/api/v1/main/executions/"+execution_id,headers={"Accept":"application/json","Authorization":"Bearer "+token})
                try:
                  with urllib.request.urlopen(req,timeout=15) as resp:
                    body=resp.read()
                  obj=json.loads(body.decode("utf-8"))
                  state=(obj.get("state") or {}).get("current","UNKNOWN")
                  poll_log.append({"attempt":attempt+1,"http_status":200,"state":state,"body_sha256":hashlib.sha256(body).hexdigest()})
                  if state in terminal:
                    receipt["kestra_terminal_state"]=state
                    receipt["kestra_execution_evidence_sha256"]=hashlib.sha256(body).hexdigest()
                    receipt["kestra_state_observed_at_utc"]=__import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat()
                    if state=="SUCCESS":
                      receipt["status"]="FLOW_EXECUTION_SUCCESS_RELEASE_STILL_HOLD"
                    elif state=="FAILED":
                      receipt["status"]="AUDIT_FAILED_OR_FAIL_CLOSED_HOLD"
                    else:
                      receipt["status"]="AUDIT_TERMINATED_WITHOUT_SUCCESS"
                    # Retain only task state/status fields, never request credentials.
                    task_states=[]
                    for task in obj.get("taskRunList",[]) or []:
                      task_states.append({"task_id":task.get("taskId"),"state":((task.get("state") or {}).get("current","UNKNOWN"))})
                    receipt["task_states"]=task_states
                    break
                except urllib.error.HTTPError as err:
                  poll_log.append({"attempt":attempt+1,"http_status":err.code,"state":"POLL_HTTP_ERROR"})
                except Exception as err:
                  poll_log.append({"attempt":attempt+1,"state":"POLL_ERROR","error_type":type(err).__name__})
                time.sleep(2)
              else:
                receipt["status"]="POLL_TIMEOUT_TERMINAL_STATE_UNCONFIRMED"
              receipt["poll_observations"]=poll_log
            elif proc.returncode==0:
              receipt["status"]="DISPATCH_RESPONSE_MISSING_EXECUTION_ID"
            Path("candidate/LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT.json").write_text(json.dumps(receipt,indent=2)+"\n",encoding="utf-8")
            print(json.dumps(receipt,indent=2))
            sys_exit=0
          raise SystemExit(sys_exit)
          PY

      - name: Append the exact Kestra receipt to final C4 telemetry
        id: final_telemetry
        if: always() && steps.verify.outcome == 'success' && steps.contract.outcome == 'success'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path

          pre_path=Path("candidate/LOUKSNAPG_TELEMETRY_PREAUDIT.json")
          receipt_path=Path("candidate/LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT.json")
          bundle=Path("candidate/LOUKSNAPG.md")
          contract_path=Path("contracts/louksnapg/architecture-contract.v1.json")
          if not pre_path.is_file() or pre_path.is_symlink():
              raise SystemExit("C4_PREAUDIT_TELEMETRY_MISSING_OR_UNSAFE")
          if not bundle.is_file() or bundle.is_symlink() or not contract_path.is_file() or contract_path.is_symlink():
              raise SystemExit("C4_SOURCE_BINDING_INPUT_MISSING_OR_UNSAFE")
          if not receipt_path.is_file() or receipt_path.is_symlink():
              failure={
                  "schema":"LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT/1.0",
                  "status":"RECEIPT_MISSING",
                  "reason":"KESTRA_RECEIPT_FILE_MISSING_AFTER_DISPATCH",
                  "source_commit":os.environ["SOURCE_COMMIT"],
                  "bundle_sha256":hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  "integrity_status":"NOT_ESTABLISHED",
                  "global_certification":"NOT_GRANTED"
              }
              receipt_path.write_text(json.dumps(failure,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          receipt_bytes=receipt_path.read_bytes()
          receipt=json.loads(receipt_bytes.decode("utf-8"))
          if not isinstance(receipt,dict):
              raise SystemExit("C4_KESTRA_RECEIPT_ROOT_NOT_OBJECT")
          receipt_sha=hashlib.sha256(receipt_bytes).hexdigest()
          bundle_sha=hashlib.sha256(bundle.read_bytes()).hexdigest()
          contract_sha=hashlib.sha256(contract_path.read_bytes()).hexdigest()
          telemetry=json.loads(pre_path.read_text(encoding="utf-8"))
          if not isinstance(telemetry,dict) or not isinstance(telemetry.get("events"),list):
              raise SystemExit("C4_PREAUDIT_TELEMETRY_SCHEMA_INVALID")
          if telemetry.get("source_commit")!=os.environ["SOURCE_COMMIT"] or telemetry.get("bundle_sha256")!=bundle_sha or telemetry.get("contract_sha256")!=contract_sha:
              raise SystemExit("C4_PREAUDIT_SUBJECT_BINDING_MISMATCH")
          events=telemetry["events"]
          if any(not isinstance(row,dict) for row in events):
              raise SystemExit("C4_PREAUDIT_EVENT_ROW_INVALID")
          if any(row.get("event_type")=="KESTRA_AUDIT_RESULT" for row in events):
              raise SystemExit("C4_KESTRA_RESULT_ALREADY_APPENDED_TO_PREAUDIT")
          if [row.get("sequence_id") for row in events]!=list(range(1,len(events)+1)):
              raise SystemExit("C4_PREAUDIT_SEQUENCE_GAP_OR_REORDER")
          status=receipt.get("status","NOT_ESTABLISHED")
          terminal=receipt.get("kestra_terminal_state")
          execution_present=bool(receipt.get("execution_id"))
          receipt_details={
              "receipt_sha256":receipt_sha,
              "receipt_status":status,
              "execution_id_present":execution_present,
              "terminal_state":terminal,
              "reason":receipt.get("reason") or receipt.get("error_tail") or receipt.get("status"),
              "http_response_sha256":receipt.get("http_response_sha256"),
              "kestra_execution_evidence_sha256":receipt.get("kestra_execution_evidence_sha256"),
              "preaudit_telemetry_sha256":hashlib.sha256(pre_path.read_bytes()).hexdigest()
          }
          if execution_present and terminal:
              event_status="PASS_EXECUTION_RECEIPT_BOUND"
          else:
              event_status="HOLD_KESTRA_EXECUTION_NOT_ESTABLISHED"
          event={
              "operation_id":"LOUKSNAPG-AUX-"+os.environ["SOURCE_COMMIT"][:12],
              "sequence_id":len(events)+1,
              "timestamp_utc":datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z"),
              "actor":"github-actions",
              "tool_name":"Kestra audit receipt materializer",
              "tool_version":"1.0",
              "source":"github://"+os.environ.get("GITHUB_REPOSITORY","unknown")+"/actions/runs/"+os.environ.get("GITHUB_RUN_ID","unknown"),
              "source_commit":os.environ["SOURCE_COMMIT"],
              "bundle_sha256":bundle_sha,
              "contract_sha256":contract_sha,
              "input_sha256":receipt_sha,
              "input_bytes":len(receipt_bytes),
              "validation_status":event_status,
              "rollback_reference":"PR 157 feature branch only; main unchanged; preserve immutable preaudit and candidate; revert branch commit if required",
              "status":event_status,
              "event_type":"KESTRA_AUDIT_RESULT",
              "count":1,
              "details":receipt_details
          }
          raw=json.dumps(event,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode("utf-8")
          event_digest=hashlib.sha256(raw).hexdigest()
          event["output_bytes"]=len(raw)
          event["output_sha256"]=event_digest
          event["evidence_sha256"]=event_digest
          telemetry.pop("evidence_sha256",None)
          telemetry["events"]=events+[event]
          telemetry["generated_at_utc"]=datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          telemetry["trace_integrity"]="PASS_SHA256_BOUND_POSTDISPATCH_APPEND"
          telemetry["post_dispatch_receipt_status"]=status
          telemetry["post_dispatch_receipt_sha256"]=receipt_sha
          telemetry["post_dispatch_receipt_bound"]=(receipt.get("source_commit")==os.environ["SOURCE_COMMIT"] and receipt.get("bundle_sha256")==bundle_sha)
          telemetry["status"]="INCOMPLETE_HOLD"
          telemetry["release_telemetry_status"]="INCOMPLETE_HOLD"
          telemetry["global_certification"]="NOT_GRANTED"
          canonical=json.dumps(telemetry,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode("utf-8")
          telemetry["evidence_sha256"]=hashlib.sha256(canonical).hexdigest()
          final_path=Path("candidate/LOUKSNAPG_TELEMETRY_FINAL.json")
          final_path.write_text(json.dumps(telemetry,sort_keys=True,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as handle:
              handle.write("receipt_sha256="+receipt_sha+"\n")
              handle.write("final_telemetry_sha256="+hashlib.sha256(final_path.read_bytes()).hexdigest()+"\n")
          print(json.dumps({
              "schema":telemetry.get("schema"),
              "source_commit":telemetry.get("source_commit"),
              "bundle_sha256":bundle_sha,
              "contract_sha256":contract_sha,
              "preaudit_event_count":len(events),
              "final_event_count":len(telemetry["events"]),
              "post_dispatch_event_type":"KESTRA_AUDIT_RESULT",
              "kestra_receipt_status":status,
              "execution_id_present":execution_present,
              "terminal_state":terminal,
              "receipt_sha256":receipt_sha,
              "final_telemetry_sha256":hashlib.sha256(final_path.read_bytes()).hexdigest(),
              "release_telemetry_status":"INCOMPLETE_HOLD",
              "global_certification":"NOT_GRANTED"
          },indent=2))
          PY

      - name: Evaluate the six architectural obligations against exact run-bound evidence
        id: six_obligations
        if: always() && steps.verify.outcome == 'success' && steps.contract.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          G23_ARGS=()
          if [ -s candidate/LOUKSNAPG_G23_INTEGRITY_EVIDENCE.json ]; then
            G23_ARGS=(--g23-integrity candidate/LOUKSNAPG_G23_INTEGRITY_EVIDENCE.json)
          fi
          python tools/louksnapg_six_obligation_audit.py \
            --contract contracts/louksnapg/architecture-contract.v1.json \
            --source-commit "$SOURCE_COMMIT" \
            --bundle candidate/LOUKSNAPG.md \
            --worker-evidence candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json \
            --task-report candidate/LOUKSNAPG_G24_TASK_DIAGNOSTICS.json \
            --functional-gate candidate/LOUKSNAPG_G24_FUNCTIONAL_GATE.json \
            --g24-evidence candidate/LOUKSNAPG_G24_DECISION.json \
            --telemetry candidate/LOUKSNAPG_TELEMETRY_FINAL.json \
            --kestra-receipt candidate/LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT.json \
            "${G23_ARGS[@]}" \
            --report candidate/LOUKSNAPG_SIX_OBLIGATION_AUDIT.json

      - name: Upload candidate validation and Kestra receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LOUKSNAPG-AUXILIARY-EVIDENCE
          path: |
            candidate/LOUKSNAPG_BUILD_REPORT.json
            candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json
            candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json
            candidate/LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT.json
            candidate/LOUKSNAPG_ARCHITECTURE_CONTRACT.json
            candidate/LOUKSNAPG_TELEMETRY_PREAUDIT.json
            candidate/LOUKSNAPG_TELEMETRY_FINAL.json
            candidate/LOUKSNAPG_FUNCTIONAL_EVIDENCE_NOT_ESTABLISHED.json
            candidate/LOUKSNAPG_G23_ATTESTATION_NOT_PERFORMED.json
            candidate/LOUKSNAPG_G24_DECISION_NOT_GRANTED.json
            candidate/LOUKSNAPG_G23_INTEGRITY_EVIDENCE.json
            candidate/LOUKSNAPG_SIX_OBLIGATION_AUDIT.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce the required secondary-worker execution receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("candidate/LOUKSNAPG_KESTRA_AUXILIARY_RECEIPT.json")
          if not p.is_file():
              raise SystemExit("KESTRA_RECEIPT_MISSING; SECONDARY_WORKER_GATE=HOLD")
          r=json.loads(p.read_text(encoding="utf-8"))
          status=r.get("status")
          terminal=r.get("kestra_terminal_state")
          print(json.dumps({"receipt_status":status,"terminal_state":terminal,"execution_id_present":bool(r.get("execution_id")),"global_certification":"NOT_GRANTED"},indent=2))
          if status in {"NOT_CONFIGURED","SUBMISSION_FAILED","DISPATCH_RESPONSE_MISSING_EXECUTION_ID","POLL_TIMEOUT_TERMINAL_STATE_UNCONFIRMED","AUDIT_TERMINATED_WITHOUT_SUCCESS"}:
              raise SystemExit("KESTRA_SECONDARY_WORKER_NOT_VERIFIED:"+str(status))
          if status != "AUDIT_FAILED_OR_FAIL_CLOSED_HOLD" or terminal != "FAILED":
              raise SystemExit("KESTRA_AUDIT_DID_NOT_PRODUCE_THE_EXPECTED_FAIL_CLOSED_HOLD; SECONDARY_WORKER_GATE=HOLD")
          print("KESTRA_SECONDARY_WORKER=EXECUTED; AUDIT_RESULT=FAIL_CLOSED_HOLD; PRODUCT_CERTIFICATION=NOT_GRANTED")
          PY

      - name: Fail closed if the exact product fails independent validation
        if: steps.verify.outcome != 'success'
        run: exit 1
