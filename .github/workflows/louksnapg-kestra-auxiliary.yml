name: LOUKSNAPG product artifact and Kestra auxiliary audit

on:
  push:
    branches:
      - "louksnapg/**"
    paths:
      - ".github/workflows/louksnapg-kestra-auxiliary.yml"
      - "contracts/louksnapg/architecture-contract.v1.json"
      - "tools/louksnapg_architecture_contract.py"
      - "integrations/kestra/flows/24-louksnapg-bundle-audit.yml"
      - ".github/workflows/cajita-louksna1-factory.yml"
      - ".github/workflows/louksnapg-bundle-ci.yml"
      - "tools/louksnapg_integral_gate.py"
      - "tools/louksnapg_six_obligation_audit.py"
      - "tests/test_louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_worker_mission.py"
      - "docs/cajita-luna/LOUKSNAPG_ARCHITECTURAL_CONTRACT.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.json"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026_RUN40309113060.json"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026_RUN40309113060.md"
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Factory workflow run ID to audit
        required: true
        type: string
      source_commit:
        description: Exact source commit SHA for that run
        required: true
        type: string
  workflow_run:
    workflows:
      - "Cajita V9 materialization and Louksna1 governed factory"
    types:
      - completed
    branches:
      - main
      - "louksnapg/**"

permissions:
  actions: read
  contents: read

concurrency:
  # Each run is bound to one concrete producer/source SHA. Avoid a stale
  # polling run monopolizing the branch and blocking the replacement audit.
  group: louksnapg-aux-audit-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  independently-validate-and-publish-product-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out verifier at the auxiliary workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve exact factory run and source SHA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          event=json.loads(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8").read())
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          supplied_run=None
          wanted_sha=None
          branch=None
          if "workflow_run" in event:
              wr=event["workflow_run"]
              supplied_run=str(wr["id"])
              wanted_sha=wr["head_sha"]
              branch=wr["head_branch"]
          elif event.get("inputs"):
              supplied_run=str(event["inputs"]["source_run_id"]).strip()
              wanted_sha=str(event["inputs"]["source_commit"]).strip()
          else:
              # GitHub push events identify the pushed commit with "after"; "before"
              # is only the predecessor and cannot bind the factory output.
              wanted_sha=str(event.get("after") or event.get("head_commit",{}).get("id","")).strip()
              branch=str(event.get("ref","").removeprefix("refs/heads/"))
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}
          def get(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as response:
                  return json.load(response)
          def product_candidate_ready(run):
              # Dispatch the secondary audit as soon as the exact candidate is
              # manufactured and package-level G23 passes. G24 is a separate,
              # slower model-quality evaluation; it must not deadlock the independent
              # Kestra audit. Missing G24 artifacts remain HOLD and a second audit is
              # triggered when the factory workflow reaches its terminal state.
              jobs_result=get("/actions/runs/"+urllib.parse.quote(str(run["id"]),safe="")+"/jobs?per_page=100")
              jobs_by_name={item.get("name"):item for item in jobs_result.get("jobs",[])}
              required_integrity=("manufacture","g23-independent-validation")
              if any(name not in jobs_by_name for name in required_integrity):
                  return False
              for name in required_integrity:
                  item=jobs_by_name[name]
                  if item.get("status")=="completed" and item.get("conclusion")!="success":
                      raise RuntimeError("SOURCE_FACTORY_OR_G23_FAILED_CLOSED:"+name+":"+str(item.get("conclusion")))
              return all(
                  jobs_by_name[name].get("status")=="completed"
                  and jobs_by_name[name].get("conclusion")=="success"
                  for name in required_integrity
              )
          selected=None
          for attempt in range(361):
              try:
                  if supplied_run:
                      candidate=get("/actions/runs/"+urllib.parse.quote(supplied_run,safe=""))
                      if wanted_sha and candidate.get("head_sha")!=wanted_sha:
                          raise RuntimeError("SUPPLIED_RUN_SOURCE_COMMIT_MISMATCH")
                      selected=candidate
                  else:
                      query=urllib.parse.urlencode({"branch":branch,"per_page":100})
                      # Use the repository-wide Actions endpoint (already permissioned
                      # by actions:read) and filter the exact producer workflow locally.
                      # This avoids the workflow-file route returning an incomplete list
                      # when the same push only changes the auxiliary workflow.
                      result=get("/actions/runs?"+query)
                      candidates=[row for row in result.get("workflow_runs",[])
                          if row.get("path")==".github/workflows/cajita-louksna1-factory.yml"
                          and row.get("event")=="push"
                          and row.get("head_branch")==branch]
                      if attempt == 0:
                          print(json.dumps({
                              "resolver_branch":branch,
                              "event_sha":wanted_sha,
                              "candidate_count":len(candidates),
                              "candidates":[{"id":row.get("id"),"sha":row.get("head_sha"),"status":row.get("status"),"created_at":row.get("created_at")} for row in candidates[:8]]
                          },indent=2))
                      exact=[row for row in candidates if row.get("head_sha")==wanted_sha]
                      if exact:
                          exact.sort(key=lambda row:(row.get("run_attempt",0),row.get("created_at","")),reverse=True)
                          selected=exact[0]
                      elif candidates:
                          # The auxiliary workflow may be the only file changed by
                          # this push. In that case audit the newest factory run on
                          # this same branch, even if that run began after the push event.
                          candidates.sort(key=lambda row:(row.get("created_at",""),row.get("run_attempt",0)),reverse=True)
                          selected=candidates[0]
                  if selected and product_candidate_ready(selected):
                      break
              except urllib.error.HTTPError as exc:
                  if exc.code not in (404,429,500,502,503,504):
                      raise
              if attempt==360:
                  raise SystemExit("FACTORY_MANUFACTURE_AND_G23_NOT_PASSED_WITHIN_AUXILIARY_WAIT_WINDOW")
              time.sleep(10)
          if not selected:
              raise SystemExit("EXACT_FACTORY_RUN_NOT_FOUND")
          final_jobs=get("/actions/runs/"+urllib.parse.quote(str(selected["id"]),safe="")+"/jobs?per_page=100")
          jobs_by_name={item.get("name"):item for item in final_jobs.get("jobs",[])}
          g24=jobs_by_name.get("g24-resource-limited-runtime-smoke",{})
          g24_state="COMPLETED" if g24.get("status")=="completed" else "IN_PROGRESS_OR_NOT_YET_STARTED"
          output=os.environ["GITHUB_OUTPUT"]
          with open(output,"a",encoding="utf-8") as handle:
              handle.write("run_id="+str(selected["id"])+"\n")
              handle.write("source_sha="+selected["head_sha"]+"\n")
              handle.write("run_conclusion="+str(selected.get("conclusion") or "unknown")+"\n")
              handle.write("source_branch="+str(selected.get("head_branch") or "")+"\n")
              handle.write("g24_conclusion="+str(g24.get("conclusion") or "unknown")+"\n")
          print(json.dumps({"run_id":selected["id"],"source_sha":selected["head_sha"],"conclusion":selected.get("conclusion"),"branch":selected.get("head_branch"),"g24_conclusion":g24.get("conclusion") or g24_state},indent=2))
          PY

      - name: Download candidate and reports from the exact factory run
        uses: actions/download-artifact@v4
        with:
          name: louksna1-candidate
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence

      - name: Download exact package-level G23 artifact from the same factory run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: louksna1-g23-evidence
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence/g23-evidence

      - name: Download exact G24 decision artifact from the same factory run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: louksna1-g24-evidence
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence/g24-evidence

      - name: Download exact G24 runtime telemetry from the same factory run
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: louksna1-g24-telemetry
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: evidence/g24-telemetry

      - name: Locate the actual single-file product and source-bound reports
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate
          find evidence -type f -name 'LOUKSNAPG.md' -print -quit | grep -q .
          PRODUCT="$(find evidence -type f -name 'LOUKSNAPG.md' -print -quit)"
          cp "$PRODUCT" candidate/LOUKSNAPG.md
          for name in LOUKSNAPG_BUILD_REPORT.json LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json; do
            source="$(find evidence -type f -name "$name" -print -quit)"
            test -n "$source"
            cp "$source" "candidate/$name"
          done
          G23_EVIDENCE="$(find evidence/g23-evidence -type f -name 'G23_EVIDENCE.json' -print -quit || true)"
          if [ -n "$G23_EVIDENCE" ]; then cp "$G23_EVIDENCE" candidate/LOUKSNAPG_G23_INTEGRITY_EVIDENCE.json; fi
          G24_EVIDENCE="$(find evidence/g24-evidence -type f -name 'LOUKSNA1_G24_EVIDENCE.json' -print -quit || true)"
          G24_TASKS="$(find evidence/g24-telemetry -type f -name 'task-adapter-e2e-raw.json' -print -quit || true)"
          G24_GATE="$(find evidence/g24-telemetry -type f -name 'LOUKSNAPG_FUNCTIONAL_GATE.json' -print -quit || true)"
          if [ -n "$G24_EVIDENCE" ]; then cp "$G24_EVIDENCE" candidate/LOUKSNAPG_G24_DECISION.json; fi
          if [ -n "$G24_TASKS" ]; then cp "$G24_TASKS" candidate/LOUKSNAPG_G24_TASK_DIAGNOSTICS.json; fi
          if [ -n "$G24_GATE" ]; then cp "$G24_GATE" candidate/LOUKSNAPG_G24_FUNCTIONAL_GATE.json; fi
          echo "g24_evidence_available=$([ -n "$G24_EVIDENCE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "g24_task_report_available=$([ -n "$G24_TASKS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "g24_functional_gate_available=$([ -n "$G24_GATE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "product_path=candidate/LOUKSNAPG.md" >> "$GITHUB_OUTPUT"
          ls -lh candidate

      - name: Independently verify single-file package, exact hash, provenance and hard cap
        id: verify
        continue-on-error: true
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          python -m py_compile tools/louksnapg_independent_validator.py
          python tools/louksnapg_independent_validator.py \
            --bundle candidate/LOUKSNAPG.md \
            --max-bytes 479000000 \
            --expected-source-commit "$SOURCE_COMMIT" \
            --report candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          b=Path("candidate/LOUKSNAPG.md")
          build=json.loads(Path("candidate/LOUKSNAPG_BUILD_REPORT.json").read_text(encoding="utf-8"))
          worker=json.loads(Path("candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json").read_text(encoding="utf-8"))
          check=json.loads(Path("candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json").read_text(encoding="utf-8"))
          sha=hashlib.sha256(b.read_bytes()).hexdigest()
          assert b.stat().st_size==check["bundle_bytes"]<=479000000
          assert sha==check["bundle_sha256"]==build["bundle_sha256"]==worker["artifact"]["sha256"]
          assert check["source_commit"]==build["source_commit"]==worker["source_commit"]==os.environ["SOURCE_COMMIT"]
          assert check["container_integrity"]=="PASS"
          assert check["protected_prefix_integrity"]=="PASS"
          assert check["cajita_document_copy_integrity"]=="PASS"
          assert check["runtime_member_integrity"]=="PASS"
          assert check["single_distribution_container"]=="PASS"
          assert check["identity_preservation_status"]=="PASS_SOURCE_IDENTITY_PRESERVED"
          assert check["engine_replacement"]=="FORBIDDEN"
          assert build["identity_preservation_status"]=="PASS_SOURCE_IDENTITY_PRESERVED"
          assert build["engine_replacement"]=="FORBIDDEN"
          assert build["global_certification"]=="NOT_GRANTED"
          assert worker["worker_status"]=="PASS"
          print(json.dumps({"status":"PASS_SINGLE_FILE_PACKAGE_INTEGRITY","artifact":b.name,"bytes":b.stat().st_size,"sha256":sha,"source_commit":check["source_commit"],"worker_status":worker["worker_status"],"global_certification":"NOT_GRANTED"},indent=2))
          PY

      - name: Build contract integrity report and immutable pre-audit telemetry
        id: contract
        if: steps.verify.outcome == 'success'
        shell: bash
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.source_sha }}
          G24_JOB_CONCLUSION: ${{ steps.source.outputs.g24_conclusion }}
        run: |
          set -euo pipefail
          python tools/louksnapg_architecture_contract.py \
            --contract contracts/louksnapg/architecture-contract.v1.json \
            --report candidate/LOUKSNAPG_ARCHITECTURE_CONTRACT.json
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          cp=Path("contracts/louksnapg/architecture-contract.v1.json")
          contract_bytes=cp.read_bytes()
          contract_sha=hashlib.sha256(contract_bytes).hexdigest()
          report=json.loads(Path("candidate/LOUKSNAPG_ARCHITECTURE_CONTRACT.json").read_text(encoding="utf-8"))
          bundle=Path("candidate/LOUKSNAPG.md")
          bundle_sha=hashlib.sha256(bundle.read_bytes()).hexdigest()
          worker_path=Path("candidate/LOUKSNAPG_CUSTOSZV9_WORKER_EVIDENCE.json")
          worker=json.loads(worker_path.read_text(encoding="utf-8"))
          worker_sha=hashlib.sha256(worker_path.read_bytes()).hexdigest()
          validation=json.loads(Path("candidate/LOUKSNAPG_AUXILIARY_VALIDATION.json").read_text(encoding="utf-8"))
          now=lambda:datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          task_path=Path("candidate/LOUKSNAPG_G24_TASK_DIAGNOSTICS.json")
          gate_path=Path("candidate/LOUKSNAPG_G24_FUNCTIONAL_GATE.json")
          g24_path=Path("candidate/LOUKSNAPG_G24_DECISION.json")
          task_report=json.loads(task_path.read_text(encoding="utf-8")) if task_path.is_file() else {}
          gate_report=json.loads(gate_path.read_text(encoding="utf-8")) if gate_path.is_file() else {}
          g24_report=json.loads(g24_path.read_text(encoding="utf-8")) if g24_path.is_file() else {}
          task_rows=task_report.get("task_results",[]) if isinstance(task_report.get("task_results",[]),list) else []
          quality_pass_count=sum(1 for row in task_rows if isinstance(row,dict) and row.get("status")=="PASS_FUNCTIONAL_EXECUTION" and row.get("exit_code")==0 and (row.get("quality_acceptance") or {}).get("status")=="PASS")
          quality_fail_count=sum(1 for row in task_rows if isinstance(row,dict) and (row.get("quality_acceptance") or {}).get("status")=="FAIL")
          observed_target_ids=sorted({row.get("target_id") for row in task_rows if isinstance(row,dict) and isinstance(row.get("target_id"),str)})
          task_sha=hashlib.sha256(task_path.read_bytes()).hexdigest() if task_path.is_file() else None
          gate_subject_bound=gate_report.get("source_commit")==os.environ["SOURCE_COMMIT"] and gate_report.get("bundle_sha256")==bundle_sha
          g24_subject_bound=g24_report.get("source_commit")==os.environ["SOURCE_COMMIT"] and g24_report.get("package_sha256")==bundle_sha
          synthetic_diagnostics=bool(task_report) and ("synthetic" in str(task_report.get("inputs","")).casefold() or any(isinstance(row,dict) and (row.get("quality_acceptance") or {}).get("reference_kind")=="FIXED_SYNTHETIC_EXPECTATION" for row in task_rows))
          functional_status="FAIL" if quality_fail_count>0 or gate_report.get("decision")=="HOLD" else "NOT_ESTABLISHED"
          functional_absence={
            "schema":"LOUKSNAPG_FUNCTIONAL_EVIDENCE/1.0",
            "status":functional_status,
            "execution_mode":"SYNTHETIC_DIAGNOSTIC_ONLY" if synthetic_diagnostics else ("REAL_RUNTIME_EXECUTION_INCOMPLETE" if task_report else "NOT_PERFORMED"),
            "synthetic_only":True if synthetic_diagnostics else None,
            "source_commit":os.environ["SOURCE_COMMIT"],
            "bundle_sha256":bundle_sha,
            "task_harness_status":task_report.get("status","NOT_COMPLETED"),
            "task_report_sha256":task_sha,
            "task_execution_count":len(task_rows),
            "observed_target_ids":observed_target_ids,
            "observed_target_count":len(observed_target_ids),
            "expected_target_count":21,
            "quality_pass_count":quality_pass_count,
            "quality_fail_count":quality_fail_count,
            "target_pass_count":0 if synthetic_diagnostics or gate_report.get("decision")!="PASS" else quality_pass_count,
            "all_21_target_task_coverage":"NOT_ESTABLISHED",
            "g24_job_conclusion":os.environ.get("G24_JOB_CONCLUSION","unknown"),
            "functional_gate_decision":gate_report.get("decision","NOT_ESTABLISHED"),
            "functional_gate_subject_binding":"PASS" if gate_subject_bound else "HOLD",
            "g24_decision_status":g24_report.get("decision","NOT_GRANTED"),
            "g24_subject_binding":"PASS" if g24_subject_bound else "HOLD",
            "diagnostic_only":True,
            "reason":"Synthetic fixed-fixture diagnostics are not product proof; the last G24 run observed quality failures and did not establish all 21 real target adapters.",
            "global_certification":"NOT_GRANTED"
          }
          fp=Path("candidate/LOUKSNAPG_FUNCTIONAL_EVIDENCE_NOT_ESTABLISHED.json")
          fp.write_text(json.dumps(functional_absence,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          functional_sha=hashlib.sha256(fp.read_bytes()).hexdigest()
          g23_absence={"schema":"LOUKSNAPG_G23_ATTESTATION_STATUS/1.0","status":"NOT_PERFORMED","source_commit":os.environ["SOURCE_COMMIT"],"bundle_sha256":bundle_sha,"reason":"No trusted independent G23 signed attestation was provided.","global_certification":"NOT_GRANTED"}
          gp=Path("candidate/LOUKSNAPG_G23_ATTESTATION_NOT_PERFORMED.json")
          gp.write_text(json.dumps(g23_absence,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          g23_sha=hashlib.sha256(gp.read_bytes()).hexdigest()
          g24_absence={"schema":"LOUKSNAPG_G24_DECISION_STATUS/1.0","status":"NOT_GRANTED","source_commit":os.environ["SOURCE_COMMIT"],"bundle_sha256":bundle_sha,"reason":"No separate authorized G24 signed decision was provided.","global_certification":"NOT_GRANTED"}
          g24p=Path("candidate/LOUKSNAPG_G24_DECISION_NOT_GRANTED.json")
          g24p.write_text(json.dumps(g24_absence,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          g24_sha=hashlib.sha256(g24p.read_bytes()).hexdigest()
          rows=[
            ("SOURCE","HOLD_REVISION_PIN_PENDING","Official source documentation reviewed; exact upstream revision and model weight hashes not established."),
            ("INPUT","PASS","Candidate and source-bound reports hashed."),
            ("OPERATION","PASS" if worker.get("worker_status")=="PASS" else "HOLD","Bounded CUSTOSZ V9 package build receipt; not model inference evidence."),
            ("OUTPUT","PASS" if validation.get("container_integrity")=="PASS" and validation.get("bundle_sha256")==bundle_sha else "HOLD","Independent package integrity bound to exact candidate SHA-256."),
            ("TEST","HOLD_NO_REAL_21_TARGET_EVIDENCE","No real non-synthetic result envelope for all 21 primitive targets is available."),
            ("VALIDATION","PASS" if report.get("contract_status")=="PASS" and validation.get("container_integrity")=="PASS" else "HOLD","Static contract and package integrity only."),
            ("INDEPENDENT_VALIDATION_G23","NOT_PERFORMED","No signed product-level G23 attestation claimed."),
            ("KESTRA_AUDIT","PENDING_DISPATCH","Pre-audit telemetry snapshot is the audit input envelope; execution receipt is separately persisted."),
            ("CERTIFICATION_DECISION_G24","NOT_GRANTED","Separate authorized G24 signature is absent."),
            ("NON_REGRESSION","PENDING","Complete functional and no-regression evidence not established."),
            ("ROLLBACK","NOT_RUNTIME_VERIFIED","Rollback restoration has not been runtime-tested.")
          ]
          events=[]
          for i,(kind,status,detail) in enumerate(rows,1):
            event={
              "operation_id":"LOUKSNAPG-AUX-"+os.environ["SOURCE_COMMIT"][:12],
              "sequence_id":i,
              "timestamp_utc":now(),
              "actor":"github-actions",
              "tool_name":"LOUKSNAPG auxiliary audit",
              "tool_version":"branch-revision-bound",
              "source":"github://"+os.environ.get("GITHUB_REPOSITORY","unknown")+"/commit/"+os.environ["SOURCE_COMMIT"],
              "source_commit":os.environ["SOURCE_COMMIT"],
              "bundle_sha256":bundle_sha,
              "contract_sha256":contract_sha,
              "input_sha256":contract_sha if kind in ("SOURCE","VALIDATION") else worker_sha,
              "input_bytes":len(contract_bytes) if kind in ("SOURCE","VALIDATION") else worker_path.stat().st_size,
              "validation_status":status,
              "rollback_reference":"PR 157 feature branch only; main unchanged; preserve inputs and revert branch commit if needed",
              "status":status,
              "event_type":kind,
              "count":1,
              "details":detail
            }
            raw=json.dumps(event,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
            event_sha=hashlib.sha256(raw).hexdigest()
            event["output_bytes"]=len(raw)
            event["output_sha256"]=event_sha
            event["evidence_sha256"]=event_sha
            events.append(event)
          telem={
            "schema":"LOUKSNAPG_PERSISTENT_TELEMETRY_SNAPSHOT/1.0",
            "source_commit":os.environ["SOURCE_COMMIT"],
            "bundle_sha256":bundle_sha,
            "contract_sha256":contract_sha,
            "generated_at_utc":now(),
            "trace_integrity":"PASS_SHA256_BOUND_IMMUTABLE_PREAUDIT_SNAPSHOT",
            "status":"INCOMPLETE_HOLD",
            "release_telemetry_status":"INCOMPLETE_HOLD",
            "events":events,
            "safety":{"heavy_model_download_count":0,"remote_commander_used":False,"canonical_mutation":False,"synthetic_evidence_used_as_product_proof":False},
            "missing_release_evidence":["exact pinned upstream revisions and model weight hashes","real inference for five model-backed targets","21 non-synthetic functional results","G23 signed attestation","separate signed G24 decision","host matrix","runtime rollback verification","full non-regression review"],
            "global_certification":"NOT_GRANTED"
          }
          telem_canonical=json.dumps(telem,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          telem["evidence_sha256"]=hashlib.sha256(telem_canonical).hexdigest()
          tp=Path("candidate/LOUKSNAPG_TELEMETRY_PREAUDIT.json")
