              "functional_target_expected_count":"21",
              "functional_evidence_mode":functional.get("execution_mode","NOT_PERFORMED"),
              "g23_attestation_sha256":os.environ.get("G23_ABSENCE_SHA256",""),
              "g23_signature_verification_status":"NOT_ESTABLISHED",
              "g23_producer_id":"NOT_ESTABLISHED",
              "g23_validator_id":"NOT_ESTABLISHED",
              "g24_decision_sha256":os.environ.get("G24_ABSENCE_SHA256",""),
              "g24_decision_status":"NOT_GRANTED",
              "g24_signature_verification_status":"NOT_ESTABLISHED",
              "g24_signer_id":"NOT_GRANTED_NO_SIGNER",
              "architecture_contract_sha256":os.environ.get("CONTRACT_SHA256",""),
              "architecture_contract_status":os.environ.get("CONTRACT_STATUS","HOLD"),
              "primary_worker_id":"CUSTOSZ_V9",
              "secondary_worker_id":"KESTRA",
              "custosz_worker_evidence_sha256":os.environ.get("CUSTOSZ_RECEIPT_SHA256",""),
              "custosz_repair_report_sha256":repair_sha,
              "custosz_repair_status":repair.get("status","NOT_ESTABLISHED"),
              "custosz_repair_preflight_status":repair.get("repair_preflight_status","NOT_ESTABLISHED"),
              "custosz_candidate_integrity_status":repair.get("candidate_integrity_status","NOT_ESTABLISHED"),
              "custosz_repair_target_pass_count":str(repair_pass_count),
              "custosz_repair_target_expected_count":str(len(repair_targets_expected)),
              "custosz_repair_source_commit":repair.get("source_commit",""),
              "custosz_repair_bundle_sha256":repair.get("bundle_sha256",""),
              "custosz_repair_contract_sha256":repair.get("contract_sha256",""),
              "custosz_repair_hash_verified":"true" if repair_evidence_valid else "false",
              "official_source_review_status":"NOT_ESTABLISHED",
              "telemetry_evidence_sha256":os.environ.get("TELEMETRY_SHA256",""),
              "telemetry_status":"INCOMPLETE_HOLD",
