name: "Louksna CP chronological continuation"

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - ops/debian13-kde-vm-20261009
    paths:
      - ".github/workflows/cp-chronological-continuation.yml"
      - ".github/scripts/cp_continuation_inventory.py"
      - "governance/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: louksna-cp-chronological-continuation
  cancel-in-progress: false

jobs:
  inventory-and-gate:
    name: "Recover CP inventory and enforce fail-closed progression"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate workflow syntax with pinned actionlint
        shell: bash
        run: |
          set -Eeuo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/cp-chronological-continuation.yml .github/workflows/louksna-cp09-debian13-kde-vm.yml

      - name: Inventory canonical CP references and unresolved gates
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/cp-continuation
          python3 .github/scripts/cp_continuation_inventory.py --repo-root . --output evidence/cp-continuation/cp-inventory-report.md --json-output evidence/cp-continuation/cp-inventory-report.json
          {
            echo "## Louksna CP chronological continuation"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Tracking issue: #58"
            cat evidence/cp-continuation/cp-inventory-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable run evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cp-continuation-evidence-${{ github.run_id }}
          path: evidence/cp-continuation/
          if-no-files-found: error
          retention-days: 90

      - name: Record checkpoint in tracking issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('evidence/cp-continuation/cp-inventory-report.md', 'utf8');
            const body = [
              '## Scheduled CP continuation checkpoint',
              '',
              '- Run: ' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId,
              '- Commit: ' + context.sha,
              '- Workflow conclusion is not a certification decision.',
              '',
              report,
              '',
              'Automated inventory does not grant G23/G24. A qualified independent validator and authorized certifier must separately record explicit PASS evidence.'
            ].join('\n');
            const marker = '<!-- cp-continuation-checkpoint -->';
            const markedBody = marker + '\n' + body;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 58, per_page: 100
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body: markedBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: 58, body: markedBody
              });
            }
        env:
          GH_TOKEN: ${{ github.token }}
