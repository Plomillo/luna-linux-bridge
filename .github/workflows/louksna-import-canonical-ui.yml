name: Louksna Import Canonical UI References
on:
  push:
    branches:
      - louksna-zona-directiva-v0.2-hardened
    paths:
      - ".github/workflows/louksna-import-canonical-ui.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: louksna-zona-directiva-v0.2-hardened
          fetch-depth: 0

      - name: Download exact six canonical UI references
        shell: bash
        env:
          URL_01: "https://uce32a965422abad1a8035f72d99.dl.dropboxusercontent.com/cd/0/get/DJbHuOH_To90f2bC410sqe_D6FVWxUzONu6uQbpyvzwX8Tdp53P6UKS5AjfJTzjDa7mRlBUTyLcKazY9ot3zlz1pmKUQHqW5SdGsopirdtwpTcLzLoUW4TdrzapDcXAS-quFZf_f1sIBzZVbA5ieo-lFbD7kmT9b1K5sHtQYjEI7Jw/file?c_luid=74a76a89"
          URL_02: "https://uc13ba3dd4b02edfa9c9dac919aa.dl.dropboxusercontent.com/cd/0/get/DJZYAOGoiyeBlLRIM4WUrs0m0HmNYNDg-weBsV19nii8Gbs1vRuhT50CCi5OcRNLmjM3Syt7ZSv45HyukoojItvIWB48_EhcGex9rN2fwBd73n3UYdmRV76WWeMyVW4ouLIwt-S9auTsnOg96qeBAVjky1X8f6mu_K1NIxh6wytx3A/file?c_luid=74a76a89"
          URL_03: "https://uc76f7a3fbec76754235f7531663.dl.dropboxusercontent.com/cd/0/get/DJbZybBt7Q-JPHw3B8MCKtTqLaBk4NBpnyip9PP7B_B3jE1Xat65budscs_2LClP7VI7ULT_DoHAVrCkK5lGpCEn77EJV_8BVrBE6eGQgVuVg4vB1fKHi6xDL8CrG03RmSDWEHwvqL2BEE0OCQnrETpQtO8dSBTZKGeTxDft45yUmg/file?c_luid=74a76a89"
          URL_04: "https://uc1f17e26efdf722bc9f692eb678.dl.dropboxusercontent.com/cd/0/get/DJYgKh6OMX4DxB1jYQCdUjshlD-RALGKq0yX1uDC09bhApDLJIJ1H-6f5UoJlGbISRRuPhszv_xHIoEQjsonPu-twLhX0ORg8BH05aI1di_QvvpH3cnchxmzZddvQ9c-ezcpZbFNUXjv5wAHMYzk77bibNJpaViNy3x1IPyC694o8g/file?c_luid=74a76a89"
          URL_05: "https://ucebd612aab2c5fa929aa3fe3042.dl.dropboxusercontent.com/cd/0/get/DJbeTp2oe26MYpvbs8DRBY63YoGmj52VUlbB1NZ6YVMEQxI-t6t8AkZFWRzsx2yrFIAbHtGyKsXMnnhrMSR30cxT9bKaNZPfuALRLkaX7DuNNxUwjqNiQbci0OcoKWi5PB5zaOEXsUjZfSjw4KOM2SUFEsCikmFegrZRx85s0TB0Cg/file?c_luid=74a76a89"
          URL_06: "https://uc7e9a4d6a2d6370a88eef64657b.dl.dropboxusercontent.com/cd/0/get/DJZTV5npLfXY6H0gNPVHsig-z6avPrGcGQWdvmI6i_u1_YUfj-dKNjcC16VdJSoVhyjyV7MSF5Z5uxykoeyQppcUA4kHJ_624u3gSsa7gOdBrJ0HgC9QI46r7LbH3iYU4QARU4iPJFTxegY6hFMSAyqQOGVSgPEvtrjJcD8C4ugWtg/file?c_luid=74a76a89"
        run: |
          set -euo pipefail
          DEST="LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/images"
          mkdir -p "$DEST"

          curl --fail --location --silent --show-error "$URL_01" -o "$DEST/01_louksna_zona_directiva_centro_de_mando_8k.png"
          curl --fail --location --silent --show-error "$URL_02" -o "$DEST/02_louksna_zona_directiva_repositorios_8k.png"
          curl --fail --location --silent --show-error "$URL_03" -o "$DEST/03_louksna_zona_directiva_pull_requests_8k.png"
          curl --fail --location --silent --show-error "$URL_04" -o "$DEST/04_louksna_zona_directiva_evidencia_8k.png"
          curl --fail --location --silent --show-error "$URL_05" -o "$DEST/05_louksna_zona_directiva_chat_llamada_8k.png"
          curl --fail --location --silent --show-error "$URL_06" -o "$DEST/06_louksna_zona_directiva_configuracion_8k.png"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, struct

          dest=Path("LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/images")
          names=[
            "01_louksna_zona_directiva_centro_de_mando_8k.png",
            "02_louksna_zona_directiva_repositorios_8k.png",
            "03_louksna_zona_directiva_pull_requests_8k.png",
            "04_louksna_zona_directiva_evidencia_8k.png",
            "05_louksna_zona_directiva_chat_llamada_8k.png",
            "06_louksna_zona_directiva_configuracion_8k.png",
          ]
          manifest=[]
          for n in names:
              p=dest/n
              b=p.read_bytes()
              if len(b)<24 or b[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"INVALID_PNG: {n}")
              w,h=struct.unpack(">II", b[16:24])
              manifest.append({
                  "file": n,
                  "bytes": len(b),
                  "width": w,
                  "height": h,
                  "sha256": hashlib.sha256(b).hexdigest(),
                  "status": "VERIFIED_PNG"
              })
          (dest/"ASSET_MANIFEST.json").write_text(json.dumps({
              "spec":"LOUKSNA ZONA DIRECTIVA — GitHub Interface Skeleton V0.2 HARDENED",
              "identity":"LOUKSNA_ONLY",
              "asset_count":6,
              "assets":manifest
          },indent=2,ensure_ascii=False)+"\n", encoding="utf-8")
          with (dest/"SHA256SUMS.txt").open("w",encoding="utf-8") as f:
              for x in manifest:
                  f.write(f'{x["sha256"]}  {x["file"]}\n')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit canonical UI references
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LOUKSNA_ZONA_DIRECTIVA_GITHUB_INTERFACE_V0.2_HARDENED/images
          git diff --cached --exit-code && { echo "No changes"; exit 0; } || true
          git commit -m "assets(louksna): add six canonical UI references"
          git push origin HEAD:louksna-zona-directiva-v0.2-hardened
