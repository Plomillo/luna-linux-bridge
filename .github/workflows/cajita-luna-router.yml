name: Cajita six-domain router regression

on:
  push:
    branches: [main, "repair/**"]
    paths:
      - "cajita-luna-runtime/cajita_router.py"
      - "cajita-luna-runtime/cajita_runtime.py"
      - "tests/test_cajita_router.py"
      - ".github/workflows/cajita-luna-router.yml"
  pull_request:
    paths:
      - "cajita-luna-runtime/cajita_router.py"
      - "cajita-luna-runtime/cajita_runtime.py"
      - "tests/test_cajita_router.py"
      - ".github/workflows/cajita-luna-router.yml"

permissions:
  contents: read

concurrency:
  group: cajita-router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile runtime and router
        run: python -B -m py_compile cajita-luna-runtime/cajita_runtime.py cajita-luna-runtime/cajita_router.py
      - name: Run router regression tests
        env:
          PYTHONPATH: cajita-luna-runtime
        run: python -B -m unittest discover -s tests -p "test_cajita_router.py" -v
      - name: Verify route catalog through runtime
        run: python -B cajita-luna-runtime/cajita_runtime.py routes
