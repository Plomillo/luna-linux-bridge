name: WhatsApp Whisper parser tests

on:
  push:
    paths:
      - "tools/whatsapp-whisper/**"
      - ".github/workflows/whatsapp-whisper-tests.yml"
  pull_request:
    paths:
      - "tools/whatsapp-whisper/**"
      - ".github/workflows/whatsapp-whisper-tests.yml"

permissions:
  contents: read

jobs:
  parser-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run parser regression tests
        run: python -m unittest discover -s tools/whatsapp-whisper/tests -v
