name: Cajita — cuantización real de cargas neuronales de los diez activos nuevos

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cajita-new-engine-quantization.yml"
      - "tools/cajita_quantize_new_engine_weights.py"
      - "cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cajita-new-engine-quantization-main
  cancel-in-progress: false

jobs:
  quantize-neural-payloads:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout main without materializing protected legacy LFS weights
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Install 7-Zip and Python tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python --version
          7z | head -n 3

      - name: Validate quantizer syntax
        run: python -m py_compile tools/cajita_quantize_new_engine_weights.py

      - name: Scan and quantize actual neural tensors in the ten new assets
        run: python tools/cajita_quantize_new_engine_weights.py

      - name: Verify six protected legacy model paths are unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --quiet HEAD -- \
            "cajita-luna-runtime/1. Cerebro/model.safetensors" \
            "cajita-luna-runtime/3. Transcripción/model.safetensors" \
            "cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors" \
            "cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/quantized_weights.bin" \
            "cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors" \
            "cajita-luna-runtime/6. Sistema Inteligente/Anti-Alucinaciones/model.onnx"
          echo "PROTECTED_LEGACY_MODEL_PATHS_UNCHANGED=PASS"

      - name: Preserve quantized candidates as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cajita-new-assets-quantization-candidates
          path: ${{ runner.temp }}/cajita_quantized_candidates/
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit quantization evidence to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/cajita-luna/CAJITA_NEW_ENGINE_QUANTIZATION_20261023.json
          if git diff --cached --quiet; then
            echo "No quantization report produced; fail closed."
            exit 1
          fi
          git diff --cached --stat
          git commit -m "Record tensor-quantization results for ten new Cajita assets"
          git push origin HEAD:main
