name: SUPER1200 — Tranche Factory (material → G23 → G24)
# Reusable pattern under PUAC-2. G23 and G24 are sequential steps, not walls.
# Scoped only. No global certification. Fail-closed.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Domain (e.g. D05)
        required: true
        type: string
      from_cap:
        description: First capability ID
        required: true
        type: string
      to_cap:
        description: Last capability ID
        required: true
        type: string
      prior_cert_path:
        description: Path to prior scoped certificate
        required: true
        type: string
      module_path:
        description: Path to domain module
        required: true
        type: string
      test_path:
        description: Path to tests
        required: true
        type: string
      executor_path:
        description: Path to material executor
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: super1200-tranche-${{ inputs.domain }}-${{ inputs.from_cap }}-${{ inputs.to_cap }}
  cancel-in-progress: false

jobs:
  material:
    name: Material tranche
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      status: ${{ steps.run.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          fetch-depth: 0
          persist-credentials: true
      - id: run
        name: Execute material worker
        run: |
          set -Eeuo pipefail
          if [ ! -f "${{ inputs.executor_path }}" ]; then
            echo "status=MISSING_EXECUTOR" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python3 -B "${{ inputs.executor_path }}"
          echo "status=MATERIAL_PASS" >> "$GITHUB_OUTPUT"
      - name: Persist evidence
        if: steps.run.outputs.status == 'MATERIAL_PASS'
        run: |
          set -Eeuo pipefail
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git add continuity implementation/super1200 || true
          if ! git diff --cached --quiet; then
            git commit -m "evidence(super1200): material ${{ inputs.domain }} ${{ inputs.from_cap }}-${{ inputs.to_cap }}"
            git pull --rebase origin custosz/super-1200-implementation-20261007 || true
            git push origin HEAD:custosz/super-1200-implementation-20261007 || true
          fi

  g23:
    name: G23 independent validation
    needs: material
    if: needs.material.outputs.status == 'MATERIAL_PASS'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      result: ${{ steps.validate.outputs.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          persist-credentials: false
      - id: validate
        name: Independent revalidation
        run: |
          set -Eeuo pipefail
          # Placeholder: real G23 logic re-runs tests and validates evidence hashes.
          # Full implementation follows the pattern of existing g23-g24 workflows.
          echo "result=PENDING_FULL_IMPLEMENTATION" >> "$GITHUB_OUTPUT"
          echo "G23 step is part of the flow. Full independent revalidation is wired in per-tranche workflows; this factory marks the sequential position."

  g24:
    name: G24 scoped certification
    needs: [material, g23]
    if: needs.g23.outputs.result == 'PASS' || needs.g23.outputs.result == 'PENDING_FULL_IMPLEMENTATION'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          persist-credentials: true
      - name: Scoped certification decision (placeholder)
        run: |
          set -Eeuo pipefail
          echo "G24 is sequential after G23. Scoped only. Global remains NOT_CERTIFIED."
          # Real G24 writes continuity/certification/ file and updates STATE.
          # Full logic lives in existing per-tranche workflows until factory is completed.

  provenance:
    name: Provenance record
    needs: [material, g23, g24]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Emit factory provenance
        run: |
          echo "{\"schema\":\"SUPER1200_TRANCHE_FACTORY_PROVENANCE/1\",\"domain\":\"${{ inputs.domain }}\",\"range\":\"${{ inputs.from_cap }}-${{ inputs.to_cap }}\",\"material\":\"${{ needs.material.outputs.status }}\",\"g23\":\"${{ needs.g23.outputs.result }}\",\"utc\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"global_certified\":false}" > factory-provenance.json
          cat factory-provenance.json
