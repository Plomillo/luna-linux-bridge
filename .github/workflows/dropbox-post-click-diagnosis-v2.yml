name: "Dropbox post-click diagnosis v2"

on:
  push:
    branches:
      - staging/dropbox-main-governed-recovery-20h-20261004
    paths:
      - .github/workflows/dropbox-post-click-diagnosis-v2.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Inspect exact post-click HTML
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11356868309"
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/dbx
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/dbx/a.zip
          python3 - <<'PY'
          import zipfile,pathlib,re,html
          with zipfile.ZipFile('/tmp/dbx/a.zip') as z:
              z.extractall('/tmp/dbx/u')
          root=pathlib.Path('/tmp/dbx/u')
          p=root/'BROWSER_PAGE.html'
          if not p.exists():
              p=root/'acquisition'/'BROWSER_PAGE.html'
          print("HTML",p,"exists",p.exists())
          t=p.read_text(encoding='utf-8',errors='replace')
          terms=[
              'Or continue with download only',
              'Download anyway',
              'download-warning',
              'too large',
              'Download the folder now',
              'action-bar-download-button',
              'Cancel',
              'Try again',
              'Something went wrong',
              'zip'
          ]
          for term in terms:
              print("\n### TERM",term)
              count=0
              for m in re.finditer(re.escape(term),t,re.I):
                  a=max(0,m.start()-600); b=min(len(t),m.end()+1200)
                  s=html.unescape(re.sub(r'\s+',' ',t[a:b]))
                  print(s[:1800])
                  count+=1
                  if count>=8: break
              print("COUNT_SHOWN",count)
          PY
