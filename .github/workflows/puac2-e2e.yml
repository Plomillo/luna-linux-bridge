name: PUAC-2 end-to-end mTLS release pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/puac2_mtls_gate.py"
      - "tests/**"
      - "bridge/**"
      - "louksna/**"
      - "debian/**"
      - "packaging/**"
      - "docs/**"
      - ".github/workflows/puac2-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: puac2-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Stage 0 — source, tests and evidence preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated verification dependencies
        run: python -m pip install --disable-pip-version-check pytest cryptography
      - name: Compile and run PUAC-2 regression suite
        run: |
          set -eu
          python -m py_compile scripts/puac2_mtls_gate.py tests/test_puac2_mtls_gate.py
          python -m pytest -q tests/test_puac2_mtls_gate.py
      - name: Record immutable candidate identity
        run: |
          set -eu
          echo "repository=$GITHUB_REPOSITORY"
          echo "candidate_commit=$GITHUB_SHA"
          echo "event=$GITHUB_EVENT_NAME"
          git status --short
      - name: Fail closed on missing host evidence manifest for release runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          test -f evidence/mtls-certification.json || {
            echo "::error::Missing evidence/mtls-certification.json. Host evidence, G23 and G24 remain HOLD."
            exit 3
          }

  host_validation:
    name: Stage 1 — host mTLS, operational tests and rollback evidence
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    # Register a dedicated, secured runner on the target Linux host with this label.
    # Do not replace this with ubuntu-latest: the host's actual trust/configuration must be tested.
    runs-on: [self-hosted, linux, louksna-mtls-host]
    environment: puac2-host-validation
    timeout-minutes: 15
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require real host configuration and TLS material
        shell: bash
        run: |
          set -eu
          cfg=/etc/louksna/remote-bridge/mtls.json
          test -f "$cfg" || { echo "::error::Missing $cfg"; exit 3; }
          test -r "$cfg" || { echo "::error::Host mTLS config is not readable by the authorized runner"; exit 3; }
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/etc/louksna/remote-bridge/mtls.json")
          obj = json.loads(p.read_text())
          if not isinstance(obj, dict) or not obj:
              raise SystemExit("mTLS config is empty or not an object")
          print("Host mTLS config exists and parses; secret values are not printed.")
          PY
      - name: Verify listener and TLS handshake locally
        shell: bash
        run: |
          set -eu
          systemctl is-active --quiet louksna-remote-bridge.service
          timeout 8 openssl s_client -connect 127.0.0.1:8443 -brief </dev/null
      - name: Require independently stored operational and rollback test reports
        shell: bash
        run: |
          set -eu
          test -n "${PUAC2_HOST_TEST_REPORT:-}" || { echo "::error::Configure PUAC2_HOST_TEST_REPORT as a protected runner environment variable pointing to the approved host test report."; exit 3; }
          test -r "$PUAC2_HOST_TEST_REPORT" || { echo "::error::Host test report unavailable"; exit 3; }
          test -n "${PUAC2_ROLLBACK_TEST_REPORT:-}" || { echo "::error::Configure PUAC2_ROLLBACK_TEST_REPORT as a protected runner environment variable pointing to the rollback test report."; exit 3; }
          test -r "$PUAC2_ROLLBACK_TEST_REPORT" || { echo "::error::Rollback test report unavailable"; exit 3; }
      - name: Never publish host secrets or private key material
        if: always()
        run: echo "Host checks completed; no private keys or mtls.json contents are uploaded."

  g23_independent_validation:
    name: Stage 2 — G23 independent validation approval
    if: github.event_name == 'workflow_dispatch'
    needs: host_validation
    runs-on: ubuntu-latest
    environment: puac2-g23-validation
    timeout-minutes: 5
    steps:
      - name: Require a G23 signed attestation for this exact candidate
        run: |
          set -eu
          test -f evidence/mtls-certification.json || {
            echo "::error::G23 attestation manifest missing; remain HOLD."
            exit 3
          }
          echo "Environment approval is audited by GitHub. The cryptographic G23 signature is checked in the final gate."

  g24_certification:
    name: Stage 3 — G24 certification approval
    if: github.event_name == 'workflow_dispatch'
    needs: g23_independent_validation
    runs-on: ubuntu-latest
    environment: puac2-g24-certification
    timeout-minutes: 5
    steps:
      - name: Require G24 authority approval after G23
        run: |
          set -eu
          test -f evidence/mtls-certification.json || {
            echo "::error::G24 certification manifest missing; remain HOLD."
            exit 3
          }
          echo "G24 is sequenced after G23. Final cryptographic verification is mandatory."

  final_chain_verification:
    name: Stage 4 — verify evidence, signatures, identity separation and candidate binding
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, host_validation, g23_independent_validation, g24_certification]
    runs-on: ubuntu-latest
    environment: puac2-certification
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install signature verification dependency
        run: python -m pip install --disable-pip-version-check cryptography
      - name: Verify complete signed chain fail-closed
        env:
          PUAC2_G23_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G23_PUBLIC_KEY_PEM }}
          PUAC2_G24_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G24_PUBLIC_KEY_PEM }}
        run: python scripts/puac2_mtls_gate.py --manifest evidence/mtls-certification.json
