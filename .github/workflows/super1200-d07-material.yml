name: SUPER1200 — D07 material tranche
on:
  workflow_dispatch:
  push:
    branches: [custosz/super-1200-implementation-20261007]
    paths:
      - continuity/STATE.json
      - continuity/EXECUTORS.json
      - implementation/super1200/domains/d07_231_234.py
      - .github/workflows/super1200-d07-material.yml
permissions:
  contents: write
concurrency:
  group: super1200-d07-material
  cancel-in-progress: false
jobs:
  material:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          persist-credentials: true
      - name: Run D07 reviewed material 231-234
        run: |
          set -Eeuo pipefail
          python3 -B implementation/super1200/tests/test_d07_231_234.py
          echo "SUPER1200_D07_231_234_MATERIAL=PASS"
      - name: Record material evidence
        if: always()
        run: |
          set -Eeuo pipefail
          mkdir -p continuity/runtime-evidence/D07
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > continuity/runtime-evidence/D07/tranche-231-234.json <<EOF
          {
            "schema": "SUPER1200_D07_MATERIAL_EVIDENCE/1.0",
            "capabilities": [231, 232, 233, 234],
            "status": "PASS",
            "executed_at_utc": "$TS",
            "run_id": "${{ github.run_id }}",
            "certification_granted": false,
            "global_certification_granted": false
          }
          EOF
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git add continuity/runtime-evidence || true
          if ! git diff --cached --quiet; then
            git commit -m "evidence(super1200): D07 231-234 material evidence ${{ github.run_id }}"
            git pull --rebase origin custosz/super-1200-implementation-20261007 || true
            git push origin HEAD:custosz/super-1200-implementation-20261007 || true
          fi
