name: Jonas HoTT API tests

on:
  pull_request:
    paths:
      - "jonas_hott_api/**"
      - "tests/test_jonas_*.py"
      - "scripts/missions/package_jonas_family.py"
      - ".github/workflows/jonas-hott-tests.yml"
  push:
    branches:
      - "feature/jonas-hott-live-telemetry-v1"
    paths:
      - "jonas_hott_api/**"
      - "tests/test_jonas_*.py"
      - ".github/workflows/jonas-hott-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jonas-hott-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python API and shared-account tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jonas_hott_api/requirements.txt
      - name: Install declared dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r jonas_hott_api/requirements.txt
      - name: Compile application and tests
        id: compile
        run: |
          mkdir -p evidence/jonas
          python -m compileall -q jonas_hott_api tests scripts/missions/package_jonas_family.py
      - name: Run Jonas API and shared-account tests
        id: api_tests
        env:
          JONAS_API_TOKEN: ci-test-token
          JONAS_PERIOD_LIMIT_MICRO_USD: "1000000"
          JONAS_PROTECTED_RESERVE_MICRO_USD: "200000"
          JONAS_DB_PATH: "${{ runner.temp }}/jonas-ci.sqlite3"
          JONAS_ACCOUNT_STATE_TTL_SECONDS: "3600"
        run: |
          set -o pipefail
          python -m pytest -q tests/test_jonas_hott_api.py tests/test_jonas_account_state.py 2>&1 | tee evidence/jonas/pytest.log
      - name: Build and clean-environment test the family source candidate
        id: package_check
        if: always()
        shell: bash
        env:
          JONAS_API_TOKEN: ci-test-token
          JONAS_PERIOD_LIMIT_MICRO_USD: "1000000"
          JONAS_PROTECTED_RESERVE_MICRO_USD: "200000"
          JONAS_ACCOUNT_STATE_TTL_SECONDS: "3600"
        run: |
          set -Eeuo pipefail
          mkdir -p dist evidence/jonas
          python scripts/missions/package_jonas_family.py --output-dir dist
          PACKAGE_ROOT="$RUNNER_TEMP/jonas-package-check"
          PACKAGE_VENV="$RUNNER_TEMP/jonas-package-venv"
          rm -rf "$PACKAGE_ROOT" "$PACKAGE_VENV"
          mkdir -p "$PACKAGE_ROOT"
          python -m zipfile -e dist/jonas-family-source-candidate.zip "$PACKAGE_ROOT"
          python -m venv "$PACKAGE_VENV"
          "$PACKAGE_VENV/bin/python" -m pip install --disable-pip-version-check -r "$PACKAGE_ROOT/jonas_hott_api/requirements.txt"
          cd "$PACKAGE_ROOT"
          set -o pipefail
          "$PACKAGE_VENV/bin/python" -m pytest -q tests/test_jonas_hott_api.py tests/test_jonas_account_state.py 2>&1 | tee "$GITHUB_WORKSPACE/evidence/jonas/package-pytest.log"
      - name: Capture hash-bound CI evidence
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          API_TEST_OUTCOME: ${{ steps.api_tests.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package_check.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib
          root = pathlib.Path(".")
          evidence = root / "evidence" / "jonas"
          evidence.mkdir(parents=True, exist_ok=True)
          tracked = [
              "jonas_hott_api/app.py",
              "jonas_hott_api/account_state.py",
              "jonas_hott_api/family_checkin.html",
              "jonas_hott_api/README.md",
              "scripts/missions/package_jonas_family.py",
              "docs/jonas-hott-live-telemetry.md",
              "docs/jonas-three-track-completion-plan.md",
              "tests/test_jonas_hott_api.py",
              "tests/test_jonas_account_state.py",
          ]
          hashes = {}
          for name in tracked:
              path = root / name
              hashes[name] = hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None
          log_hashes = {}
          for name in ("pytest.log", "package-pytest.log"):
              log_path = evidence / name
              log_hashes[name] = hashlib.sha256(log_path.read_bytes()).hexdigest() if log_path.is_file() else None
          report = {
              "schema": "jonas.ci-evidence.v1",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "branch": os.environ.get("GITHUB_REF_NAME"),
              "commit_sha": os.environ.get("GITHUB_SHA"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "timestamp_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "compile_outcome": os.environ.get("COMPILE_OUTCOME"),
              "api_test_outcome": os.environ.get("API_TEST_OUTCOME"),
              "package_outcome": os.environ.get("PACKAGE_OUTCOME"),
              "source_package_sha256": (json.loads((root / "dist" / "jonas-family-source-package.json").read_text()).get("archive_sha256") if (root / "dist" / "jonas-family-source-package.json").is_file() else None),
              "test_log_sha256": log_hashes,
              "source_sha256": hashes,
              "status": "PASS" if all(os.environ.get(key) == "success" for key in ("COMPILE_OUTCOME", "API_TEST_OUTCOME", "PACKAGE_OUTCOME")) else "FAIL",
              "certified": False,
              "production_authorized": False,
              "limits": [
                  "CI tests do not verify an official provider catalog or billing endpoint.",
                  "CI does not deploy a shared family service or prove TLS, per-user production authorization, backup/restore, or external billing reconciliation.",
                  "No G23/G24 independent validation or certification is inferred."
              ],
          }
          out = evidence / "ci-evidence.json"
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          report["evidence_sha256"] = hashlib.sha256(json.dumps(report, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Preserve hash-bound CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jonas-hott-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/jonas/
            dist/jonas-family-source-candidate.zip
            dist/jonas-family-source-candidate.zip.sha256
            dist/jonas-family-source-package.json
          if-no-files-found: warn
          retention-days: 90
