      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retire-plan
          path: ${{ runner.temp }}/p
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-retire-plan-g24
          path: ${{ runner.temp }}/g24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}
      - name: Verify, checkpoint, retire only P2 P4, verify again
        shell: bash
        run: |
          set -Eeuo pipefail
          PLAN="$RUNNER_TEMP/p/RETIRE_PLAN.json"; CERT="$RUNNER_TEMP/g24/G24_RETIRE_PLAN_V8.json"; OUT="$RUNNER_TEMP/retired"; mkdir -p "$OUT"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$CERT")" = PASS
          test "$(sha256sum "$PLAN"|awk '{print $1}')" = "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["plan_sha256"])' "$CERT")"
          python3 server/r4-master/part4_r2_verify_tree.py --root "$HOME/PROYECTOS" --manifest "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz" --out "$OUT/VERIFY_PRE.json"
          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/CHECKPOINT.sfdisk"
          P1="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p1)"; P3="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)"; P5="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)"
          export P1 P3 P5
          python3 - "$PLAN" <<'PY'
          import json,os,sys
          d=json.load(open(sys.argv[1])); assert d["p1_uuid"]==os.environ["P1"] and d["p3_uuid"]==os.environ["P3"] and d["p5_uuid"]==os.environ["P5"]
          PY
          sudo -n parted -s /dev/nvme0n1 rm 2
          sudo -n parted -s /dev/nvme0n1 rm 4
          sudo -n partprobe /dev/nvme0n1 || true
          sudo -n partx -u /dev/nvme0n1 || true
          sudo -n udevadm settle
          if [ -b /dev/nvme0n1p2 ]; then sudo -n partx -d --nr 2 /dev/nvme0n1 || true; fi
          if [ -b /dev/nvme0n1p4 ]; then sudo -n partx -d --nr 4 /dev/nvme0n1 || true; fi
          sudo -n udevadm settle
          test ! -b /dev/nvme0n1p2
          test ! -b /dev/nvme0n1p4
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p1)" = "$P1"
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)" = "$P3"
          test "$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)" = "$P5"
          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/AFTER.sfdisk"
          python3 server/r4-master/part4_r2_verify_tree.py --root "$HOME/PROYECTOS" --manifest "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz" --out "$OUT/VERIFY_POST.json"
          sha256sum "$OUT"/* | sort > "$OUT/EVIDENCE.sha256"
