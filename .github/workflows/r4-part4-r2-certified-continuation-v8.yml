name: "R4 PART4 R2 — V8 governed temp recovery and certified migration"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-r2-certified-continuation-v8/**
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: r4-part4-r2-certified-continuation-v8
  cancel-in-progress: false

env:
  FREEZE_RUN: "36619942178"
  SOURCE_V7_FAILURE_RUN: "36682665542"
  EXPECTED_MANIFEST_SHA: "99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e"
  EXPECTED_RECORDS: "498092"
  EXPECTED_BYTES: "200490852057"
  RUNUSER_SHA: "ea71a94cb0097f3e1d5ce2fa8fb775bf1bd1ddd74960fad3ee22d7d8d1ef4488"
  POLICY_MANIFEST_SHA: "a570fbb5b0dcafaa1c1633015c75970acd6c9ea342a2f4130c6b254cb0fbbade"
  COMPONENT_MANIFEST_SHA: "d81cd60be8a9c1b589fc180b95b4410aeb262bfef342c7a73f95f24dae1bcbe9"
  PRIV_G23_SHA: "641955e0a149f99cb4905bb44fbcae29a422b18a6e4cd3b9d210010c9aaa0029"
  PRIV_G24_SHA: "53b882221d31ac3fe4ba14565a9681f47f574c8fffcd9f5da02ddeade6d2c139"

jobs:
  static:
    name: V8 syntax, contracts and irreversible-boundary validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            server/r4-master
            .github/workflows
          sparse-checkout-cone-mode: true

      - name: Static syntax and cross-gate proof
        shell: bash
        run: |
          set -Eeuo pipefail
          F=.github/workflows/r4-part4-r2-certified-continuation-v8.yml
          ruby -e 'require "yaml"; x=YAML.load_file(ARGV[0]); raise "JOBS_MISSING" unless x.is_a?(Hash) && x["jobs"].is_a?(Hash); puts "YAML_PASS" ' "$F"
          for s in server/r4-master/part4_r2_v8_probe.sh server/r4-master/part4_r2_temp_cleanup_v8.sh server/r4-master/part4_r2_storage_resume_after_v7_capacity_fail_closed_v8.sh; do bash -n "$s"; done
          python3 -m py_compile server/r4-master/part4_r2_v8_g23.py server/r4-master/part4_r2_v8_certify.py server/r4-master/part4_r2_posix_fingerprint_v8.py server/r4-master/part4_r2_xattr_inventory.py
          python3 - <<'PY'
          import pathlib
          s=pathlib.Path("server/r4-master/part4_r2_storage_resume_after_v7_capacity_fail_closed_v8.sh").read_text()
          c=pathlib.Path("server/r4-master/part4_r2_temp_cleanup_v8.sh").read_text()
          assert s.count("-aHA --no-xattrs --delete --numeric-ids")==2
          assert s.count("resize_partition_sfdisk(){")==1
          assert s.index("POSIX_TEMP_PREREFORMAT.json")<s.index("sudo -n mkfs.ext4")
          assert "TEMP_NOT_CLEAN" in s and "mkfs.ext4" not in c
          assert 'rm -rf --one-file-system -- ' in c
          print("V8_STATIC_GUARDS_PASS")
          PY
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$RUNNER_TEMP/bin/actionlint" -color -ignore 'label "luna-aux" is unknown' -ignore 'shellcheck reported issue' "$F"

  probe:
    name: V8 read-only source, temporary-state and capacity probe
    needs: static
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout:  server/r4-master
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}

      - name: Prove live disk and fully verify preserved PROYECTOS
        shell: bash
        run: |
          set -Eeuo pipefail
          bash server/r4-master/part4_r2_v8_probe.sh "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz" "$RUNNER_TEMP/v8-probe"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-probe
          path: ${{ runner.temp }}/v8-probe/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_clean:
    name: G23 independently validate exact V8 cleanup scope
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            server/r4-master
            mission-control/r4-part4-r2-failures
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-probe
          path: ${{ runner.temp }}/probe

      - name: Independent precleanup validation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 server/r4-master/part4_r2_v8_g23.py pre --probe "$RUNNER_TEMP/probe" --failure mission-control/r4-part4-r2-failures/FAILURE-36682665542.json --out "$RUNNER_TEMP/g23/G23_PRECLEAN_V8.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-cleanup-g23
          path: ${{ runner.temp }}/g23/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g24_clean:
    name: G24 authorize ONLY deletion of identified temp partial
    needs: g23_clean
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout:  server/r4-master
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-cleanup-g23
          path: ${{ runner.temp }}/g23

      - name: Authenticated and digest-bound cleanup-only certification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 server/r4-master/part4_r2_v8_certify.py --stage CLEANUP --g23 "$RUNNER_TEMP/g23/G23_PRECLEAN_V8.json" --out "$RUNNER_TEMP/g24/G24_CLEANUP_V8.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-cleanup-g24
          path: ${{ runner.temp }}/g24/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  clean:
    name: Execute temp-only G24 cleanup without touching P3
    needs: g24_clean
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout:  server/r4-master
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-probe
          path: ${{ runner.temp }}/probe

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-cleanup-g24
          path: ${{ runner.temp }}/g24

      - name: Guarded cleanup and remeasure exact ext4 free bytes and inodes
        shell: bash
        run: |
          set -Eeuo pipefail
          bash server/r4-master/part4_r2_temp_cleanup_v8.sh "$RUNNER_TEMP/probe/CLEANUP_PLAN_V8.json" "$RUNNER_TEMP/g24/G24_CLEANUP_V8.json" "$RUNNER_TEMP/v8-cleanup"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-temp-cleanup-material
          path: ${{ runner.temp }}/v8-cleanup/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_postclean:
    name: G23 verify cleanup, capacity and conditional migration readiness
    needs: clean
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout:  server/r4-master
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-probe
          path: ${{ runner.temp }}/probe

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-temp-cleanup-material
          path: ${{ runner.temp }}/cleanup

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-cleanup-g24
          path: ${{ runner.temp }}/g24

      - name: Independently verify temp cleanup and build next gate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 server/r4-master/part4_r2_v8_g23.py post --probe "$RUNNER_TEMP/probe" --cleanup "$RUNNER_TEMP/cleanup" --cleanup-cert "$RUNNER_TEMP/g24/G24_CLEANUP_V8.json" --out "$RUNNER_TEMP/g23/G23_POSTCLEAN_V8.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-postclean-g23
          path: ${{ runner.temp }}/g23/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g24_resume:
    name: G24 conditional migration authorization after post-clean G23
    needs: g23_postclean
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout:  server/r4-master
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-postclean-g23
          path: ${{ runner.temp }}/g23

      - name: Separate scoped migration certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 server/r4-master/part4_r2_v8_certify.py --stage MIGRATION --g23 "$RUNNER_TEMP/g23/G23_POSTCLEAN_V8.json" --out "$RUNNER_TEMP/g24/G24_RESUME_V8.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-resume-g24
          path: ${{ runner.temp }}/g24/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  migrate:
    name: Execute V8 migration only with new exact-scope G24
    needs: g24_resume
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout:  server/r4-master
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-temp-cleanup-material
          path: ${{ runner.temp }}/cleanup

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-resume-g24
          path: ${{ runner.temp }}/g24

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}

      - name: Bind V8 migration certificate, cleanup report and exact live checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          PLAN="$RUNNER_TEMP/cleanup/MIGRATION_PLAN_V8.json"
          CLEAN="$RUNNER_TEMP/cleanup/CLEANUP_RESULT_V8.json"
          CERT="$RUNNER_TEMP/g24/G24_RESUME_V8.json"
          SCRIPT=server/r4-master/part4_r2_storage_resume_after_v7_capacity_fail_closed_v8.sh
          python3 - "$PLAN" "$CLEAN" "$CERT" "$SCRIPT" <<'PY'
          import hashlib,json,pathlib,sys
          pp,cp,gp,sp=map(pathlib.Path,sys.argv[1:])
          p,c,g=map(lambda x:json.loads(x.read_text()),(pp,cp,gp))
          h=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          assert g["status"]=="PASS" and g["scope"]=="P3_EXT4_ONLY_AFTER_TEMP_CONTENT_POSIX_VERIFIED"
          assert g["plan_sha256"]==h(pp)
          assert g["script_sha256"]==h(sp)==p["script_sha256"]
          assert g["cleanup_report_sha256"]==h(cp)==p["cleanup_report_sha256"]
          assert c["status"]=="PASS" and c["p3_reformatted"] is False
          assert g["p3_reformat_authorized_only_after_verified_temp_content_and_posix_equivalence"] is True
          assert g["p2_p4_retirement_authorized"] is False
          PY
          mkdir -p "$RUNNER_TEMP/v8-migration"
          bash "$SCRIPT" "$PLAN" "$RUNNER_TEMP/v8-migration" "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz" "$CLEAN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v8-migration-material
          path: ${{ runner.temp }}/v8-migration/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_migration:
    name: G23 validate recovered P3 ext4 intermediate state
    needs: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-migration-material
          path: ${{ runner.temp }}/m
      - name: Independently validate manifest, geometry and rollback closure
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/m" "$RUNNER_TEMP/g23/G23_MIGRATION_V8.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); r=json.loads((root/"MIGRATION_RESUME_RESULT.json").read_text()); v=json.loads((root/"VERIFY_FINAL.json").read_text()); ps=json.loads((root/"POSIX_SOURCE.json").read_text()); pf=json.loads((root/"POSIX_FINAL.json").read_text()); xa=json.loads((root/"XATTR_SOURCE.json").read_text()); d={}
          for line in (root/"PARTITION_TABLE_AFTER.sfdisk").read_text(errors="replace").splitlines():
              m=re.match(r"^/dev/nvme0n1p(\d+)\s*:\s*start=\s*(\d+),\s*size=\s*(\d+)",line)
              if m:d[int(m.group(1))]=(int(m.group(2)),int(m.group(3)))
          checks={"report":r.get("status")=="PASS","verify":v.get("status")=="PASS" and v.get("mismatch_count")==0,
                  "manifest":v.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
                  "records":v.get("seen_records")==498092,"bytes":v.get("regular_file_bytes")==200490852057,
                  "geometry":d=={1:(2048,532480),2:(534528,32768),3:(567296,853842233),5:(854411576,144420552),4:(998832128,1368064)},
                  "new_uuid":bool(r.get("new_p3_ext4_uuid")) and r.get("new_p3_ext4_uuid")!="F2848A148489DC0B",
                   "posix_equivalent":pf.get("status")=="PASS" and pf.get("matches_expected") is True and pf.get("fingerprint_sha256")==ps.get("fingerprint_sha256"),
                   "xattr_policy":xa.get("status")=="PASS" and xa.get("unexpected_count")==0 and r.get("projects_posix_metadata_equivalent") is True and r.get("raw_ntfs_wsl_xattrs_transported") is False}
          ok=all(checks.values()); g={"schema":"LOUKSNA_R4_PART4_R2_MIGRATION_V8_G23/1.0","status":"PASS" if ok else "HOLD","checks":checks,
             "result_sha256":hashlib.sha256((root/"MIGRATION_RESUME_RESULT.json").read_bytes()).hexdigest(),"verify_sha256":hashlib.sha256((root/"VERIFY_FINAL.json").read_bytes()).hexdigest(),
             "partition_sha256":hashlib.sha256((root/"PARTITION_TABLE_AFTER.sfdisk").read_bytes()).hexdigest(),"g24_allowed":ok,"repair_allowed":False,
             "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          out.write_text(json.dumps(g,indent=2,sort_keys=True)+"\n"); print(json.dumps(g,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-migration-g23
          path: ${{ runner.temp }}/g23/G23_MIGRATION_V8.json
          retention-days: 90
          compression-level: 0

  g24_migration:
    name: G24 certify recovered P3 ext4
    needs: g23_migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-migration-g23
          path: ${{ runner.temp }}/g23
      - name: Issue migration certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_MIGRATION_V8.json"; test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"; AUD="louksna-r4-part4-r2-v8-migration:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"; TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN; mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24_MIGRATION_V8.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; q=t.split("."); p=q[1]+"="*((4-len(q[1])%4)%4); c=json.loads(base64.urlsafe_b64decode(p)); aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          r={"schema":"LOUKSNA_R4_PART4_R2_MIGRATION_V8_G24/1.0","status":"PASS","scope":"P3_EXT4_VERIFIED_P2_P4_P5_PRESERVED","g23_sha256":os.environ["H"],
             "authority_authenticated":True,"authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),"canonical_mutation":False,"authority_transfer":False,
             "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v8-migration-g24
          path: ${{ runner.temp }}/g24/G24_MIGRATION_V8.json
          retention-days: 90
          compression-level: 0

  retire_plan:
    name: Build exact P2 P4 retirement plan
    needs: g24_migration
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v8-migration-g24
          path: ${{ runner.temp }}/mg24
      - name: Capture retirement plan
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/mg24/G24_MIGRATION_V8.json")" = PASS
          OUT="$RUNNER_TEMP/retire-plan"; mkdir -p "$OUT"
          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/BEFORE.sfdisk"
          P1="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p1)"; P3="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p3)"; P5="$(sudo -n blkid -p -s UUID -o value /dev/nvme0n1p5)"
          export P1 P3 P5
          python3 - "$OUT/BEFORE.sfdisk" "$OUT/RETIRE_PLAN.json" <<'PY'
          import datetime as dt,hashlib,json,os,re,sys,pathlib
          p=pathlib.Path(sys.argv[1]); d={}
          for line in p.read_text(errors="replace").splitlines():
              m=re.match(r"^/dev/nvme0n1p(\d+)\s*:\s*start=\s*(\d+),\s*size=\s*(\d+)",line)
              if m:d[int(m.group(1))]=(int(m.group(2)),int(m.group(3)))
          exp={1:(2048,532480),2:(534528,32768),3:(567296,853842233),5:(854411576,144420552),4:(998832128,1368064)}
          assert d==exp,(d,exp)
          r={"schema":"LOUKSNA_R4_PART4_R2_RETIRE_PLAN_V8/1.0","status":"PASS","disk":"/dev/nvme0n1","remove":[2,4],"preserve":[1,3,5],
