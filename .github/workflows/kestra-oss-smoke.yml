name: Kestra Open Source - branch smoke test

on:
  push:
    branches:
      - custosz/super-1200-implementation-20261007
    paths:
      - "integrations/kestra/**"
      - ".github/workflows/kestra-oss-smoke.yml"

permissions:
  contents: read

concurrency:
  group: kestra-oss-smoke-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # github.workspace is available at job scope; runner.temp is not.
      EVIDENCE_DIR: ${{ github.workspace }}/kestra-ci-evidence
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Create ephemeral CI credentials
        working-directory: integrations/kestra
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 - <<'PY'
          import base64
          from pathlib import Path
          from secrets import token_hex
          Path(".env").write_text(
              chr(10).join([
                  "KESTRA_DB_PASSWORD=" + token_hex(32),
                  "KESTRA_ADMIN_EMAIL=kestra-ci@example.com",
                  "KESTRA_ADMIN_PASSWORD=" + "Kestra-" + token_hex(30) + "A9!",
              ]) + chr(10),
              encoding="utf-8",
          )
          Path(".env_encoded").write_text(
              "SECRET_GITHUB_TOKEN=" + base64.b64encode(b"CI_ONLY_NOT_A_REAL_GITHUB_TOKEN").decode("ascii") + chr(10),
              encoding="utf-8",
          )
          Path(".env_encoded").chmod(0o600)
          PY

      - name: Validate governance invariants and Compose schema
        working-directory: integrations/kestra
        shell: bash
        run: |
          set -euo pipefail
          python3 validate.py
          bash -n configure-github-token.sh
          docker compose -f compose.yml config --quiet

      - name: Pull pinned Open Source images
        working-directory: integrations/kestra
        run: docker compose -f compose.yml pull

      - name: Start isolated temporary instance
        working-directory: integrations/kestra
        run: docker compose -f compose.yml up -d --wait --wait-timeout 300

      - name: Assert Kestra and PostgreSQL health
        working-directory: integrations/kestra
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . ./.env
          set +a
          healthy=0
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 3 --max-time 5 --config <(printf 'user = "%s:%s"' "$KESTRA_ADMIN_EMAIL" "$KESTRA_ADMIN_PASSWORD") --silent --show-error --fail http://127.0.0.1:18081/health -o "$EVIDENCE_DIR/health.json" 2>/dev/null; then
              if python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if d.get("status") == "UP" else 1)' "$EVIDENCE_DIR/health.json"; then
                postgres_id="$(docker compose ps -q postgres)"
                postgres_state="$(docker inspect --format='{{.State.Health.Status}}' "$postgres_id" 2>/dev/null || true)"
                ui_code="$(curl --connect-timeout 3 --max-time 5 --location --config <(printf 'user = "%s:%s"' "$KESTRA_ADMIN_EMAIL" "$KESTRA_ADMIN_PASSWORD") --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/ 2>/dev/null || true)"
                ready="$(docker compose logs --no-color kestra 2>/dev/null | grep -F 'Kestra is ready!' || true)"
                if [ "$postgres_state" = "healthy" ] && [[ "$ui_code" == 2?? ]] && [ -n "$ready" ]; then
                  healthy=1
                  break
                fi
              fi
            fi
            sleep 5
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose -f compose.yml ps --all || true
            docker compose -f compose.yml logs --no-color --tail=250 || true
            if [ -f "$EVIDENCE_DIR/health.json" ]; then cat "$EVIDENCE_DIR/health.json"; fi
            echo "Health check failed: management status, PostgreSQL health, or authenticated UI readiness is not UP."
            exit 1
          fi
          {
            echo "Authenticated management health: UP"
            echo "PostgreSQL container health: healthy"
            echo "Authenticated UI: HTTP $ui_code"
            echo "Kestra ready marker: found"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parse the SUPER1200 continuity flow without activating it
        working-directory: integrations/kestra
        shell: bash
        run: |
          set -Eeuo pipefail
          set -a
          . ./.env
          set +a
          umask 077
          auth_cfg="$RUNNER_TEMP/kestra-curl-auth-flow"
          printf 'user = "%s:%s"\n' "$KESTRA_ADMIN_EMAIL" "$KESTRA_ADMIN_PASSWORD" > "$auth_cfg"
          trap 'rm -f "$auth_cfg" "$RUNNER_TEMP/super1200-continuity-disabled.yml"' EXIT

          python3 - "$RUNNER_TEMP/super1200-continuity-disabled.yml" <<'PY'
          import sys
          from pathlib import Path
          source = Path("flows/10-super1200-continuity.yml").read_text(encoding="utf-8")
          marker = "namespace: louksna.kestra\n"
          if source.count(marker) != 1:
              raise SystemExit("Expected exactly one namespace declaration")
          # Import a disabled copy to validate Kestra's actual YAML/plugin parser.
          # It must not create a live schedule or dispatch the worker in ephemeral CI.
          disabled = source.replace(marker, marker + "disabled: true\n", 1)
          if "metaos_ready == true" in disabled:
              raise SystemExit("MetaOS must remain deferred")
          if "status=in_progress" not in disabled or "status=queued" not in disabled:
              raise SystemExit("Active/queued run guards are missing")
          Path(sys.argv[1]).write_text(disabled, encoding="utf-8")
          PY

          flow_http="$(curl --connect-timeout 3 --max-time 15 --config "$auth_cfg" --silent --show-error \
            --output "$EVIDENCE_DIR/super1200-flow-import-response.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/x-yaml' \
            --data-binary @"$RUNNER_TEMP/super1200-continuity-disabled.yml" \
            http://127.0.0.1:8080/api/v1/main/flows || true)"
          if [[ ! "$flow_http" =~ ^2[0-9][0-9]$ ]]; then
            echo "SUPER1200 flow parser/import failed: HTTP $flow_http"
            cat "$EVIDENCE_DIR/super1200-flow-import-response.json" 2>/dev/null || true
            exit 1
          fi
          echo "SUPER1200 continuity flow YAML/parser import: PASS (disabled copy; no schedule or worker dispatch)" >> "$GITHUB_STEP_SUMMARY"

      - name: Import and execute the no-side-effect Kestra smoke flow
        working-directory: integrations/kestra
        shell: bash
        run: |
          set -Eeuo pipefail
          set -a
          . ./.env
          set +a
          umask 077
          auth_cfg="$RUNNER_TEMP/kestra-curl-auth"
          printf 'user = "%s:%s"\n' "$KESTRA_ADMIN_EMAIL" "$KESTRA_ADMIN_PASSWORD" > "$auth_cfg"
          trap 'rm -f "$auth_cfg"' EXIT

          flow_http="$(curl --connect-timeout 3 --max-time 15 --config "$auth_cfg" --silent --show-error \
            --output "$EVIDENCE_DIR/flow-create-response.json" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/x-yaml' \
            --data-binary @flows/00-smoke-test.yml \
            http://127.0.0.1:8080/api/v1/main/flows || true)"
          if [[ ! "$flow_http" =~ ^2[0-9][0-9]$ ]]; then
            echo "Flow import failed: HTTP $flow_http"
            cat "$EVIDENCE_DIR/flow-create-response.json" 2>/dev/null || true
            exit 1
          fi

          execution_http="$(curl --connect-timeout 3 --max-time 15 --config "$auth_cfg" --silent --show-error \
            --output "$EVIDENCE_DIR/execution-start-response.json" --write-out '%{http_code}' \
            --request POST \
            http://127.0.0.1:8080/api/v1/main/executions/louksna.kestra/kestra_oss_smoke || true)"
          if [[ ! "$execution_http" =~ ^2[0-9][0-9]$ ]]; then
            echo "Flow execution request failed: HTTP $execution_http"
            cat "$EVIDENCE_DIR/execution-start-response.json" 2>/dev/null || true
            exit 1
          fi

          execution_id="$(python3 - "$EVIDENCE_DIR/execution-start-response.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value = data.get("id") or data.get("executionId")
          if not isinstance(value, str) or not value:
              raise SystemExit("Execution response did not contain an execution id")
          print(value)
          PY
          )"

          state=""
          for attempt in $(seq 1 75); do
            status_http="$(curl --connect-timeout 3 --max-time 10 --config "$auth_cfg" --silent --show-error \
              --output "$EVIDENCE_DIR/execution-status.json" --write-out '%{http_code}' \
              "http://127.0.0.1:8080/api/v1/main/executions/$execution_id" || true)"
            if [[ "$status_http" =~ ^2[0-9][0-9]$ ]]; then
              state="$(python3 - "$EVIDENCE_DIR/execution-status.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          value = data.get("state", {})
          current = value.get("current") if isinstance(value, dict) else value
          print(current if isinstance(current, str) else "UNKNOWN")
          PY
              )"
              if [ "$state" = "SUCCESS" ]; then break; fi
              if [[ "$state" == "FAILED" || "$state" == "KILLED" || "$state" == "WARNING" ]]; then
                echo "Smoke flow reached terminal state: $state"
                cat "$EVIDENCE_DIR/execution-status.json"
                exit 1
              fi
            fi
            sleep 2
          done

          if [ "$state" != "SUCCESS" ]; then
            echo "Timed out or could not verify execution success; last state: $state"
            cat "$EVIDENCE_DIR/execution-status.json" 2>/dev/null || true
            exit 1
          fi

          python3 - "$EVIDENCE_DIR/execution-evidence.json" "$execution_id" "$state" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "flow_id": "kestra_oss_smoke",
              "namespace": "louksna.kestra",
              "execution_id": sys.argv[2],
              "state": sys.argv[3],
              "side_effects": "log_only",
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          {
            echo "Authenticated flow import: HTTP $flow_http"
            echo "Flow execution request: HTTP $execution_http"
            echo "Flow execution id: $execution_id"
            echo "Flow execution terminal state: $state"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture non-secret runtime evidence
        if: always()
        working-directory: integrations/kestra
        shell: bash
        run: |
          set +e
          mkdir -p "$EVIDENCE_DIR"
          {
            echo "captured_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "repository=$GITHUB_REPOSITORY"
            echo "ref=$GITHUB_REF"
            echo "commit=$GITHUB_SHA"
            echo "kestra_image=kestra/kestra:v2.0.3"
            echo "postgres_image=postgres:18.6-alpine"
            echo
            docker compose -f compose.yml ps --all
          } > "$EVIDENCE_DIR/runtime.txt" 2>&1
          for ref in kestra/kestra:v2.0.3 postgres:18.6-alpine; do
            {
              echo "IMAGE_REF=$ref"
              docker image inspect "$ref" --format 'IMAGE_ID={{.Id}} REPO_DIGESTS={{json .RepoDigests}}'
            } >> "$EVIDENCE_DIR/resolved-images.txt" 2>&1
          done
          docker compose -f compose.yml logs --no-color --tail=250 \
            > "$EVIDENCE_DIR/startup.log" 2>&1
          sha256sum compose.yml .env.example validate.py GOVERNANCE.json flows/00-smoke-test.yml \
            > "$EVIDENCE_DIR/source-files-sha256.txt" 2>&1
          {
            echo "## Kestra Open Source branch smoke"
            echo "- Commit: $GITHUB_SHA"
            echo "- Images: kestra/kestra:v2.0.3, postgres:18.6-alpine"
            echo "- Credentials: ephemeral and not uploaded"
            echo "- Scope: static/Compose validation, server/JDBC/UI health, authenticated import and execution of a log-only smoke flow"
            echo "- G23/G24: not evaluated by this workflow"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Destroy temporary runtime
        if: always()
        working-directory: integrations/kestra
        run: |
          docker compose -f compose.yml down --volumes --remove-orphans || true
          rm -f .env .env_encoded

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestra-oss-smoke-${{ github.run_id }}
          path: ${{ github.workspace }}/kestra-ci-evidence/
          if-no-files-found: warn
          retention-days: 30
