name: "R4 PART4 R2 — certified continuation v4 after NTFS shrink"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-r2-certified-continuation-v4/**
      - server/r4-master/part4_r2_storage_resume_after_ntfs_shrink_v4.sh
      - .github/workflows/r4-part4-r2-certified-continuation-v4.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: r4-part4-r2-certified-continuation-v4
  cancel-in-progress: false

env:
  FREEZE_RUN: "36619942178"
  FAILURE_RUN: "36661752109"
  EXPECTED_MANIFEST_SHA: "99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e"
  EXPECTED_RECORDS: "498092"
  EXPECTED_BYTES: "200490852057"
  RUNUSER_SHA: "ea71a94cb0097f3e1d5ce2fa8fb775bf1bd1ddd74960fad3ee22d7d8d1ef4488"
  POLICY_MANIFEST_SHA: "a570fbb5b0dcafaa1c1633015c75970acd6c9ea342a2f4130c6b254cb0fbbade"
  COMPONENT_MANIFEST_SHA: "d81cd60be8a9c1b589fc180b95b4410aeb262bfef342c7a73f95f24dae1bcbe9"
  PRIV_G23_SHA: "641955e0a149f99cb4905bb44fbcae29a422b18a6e4cd3b9d210010c9aaa0029"
  PRIV_G24_SHA: "53b882221d31ac3fe4ba14565a9681f47f574c8fffcd9f5da02ddeade6d2c139"

jobs:
  probe:
    name: Live privilege sync and irreversible-boundary recovery probe
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            server/r4-master
            mission-control/privilege-bridge
            mission-control/r4-part4-r2-failures
          sparse-checkout-cone-mode: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}

      - name: Prove privilege bridge v1.2.1 and current storage boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/v4-probe"; mkdir -p "$OUT"
          P3=/dev/nvme0n1p3
          RUNUSER=/usr/sbin/runuser
          USER_NAME=diegoignacionorambuenamiranda
          PB=/var/lib/louksna/privilege-bridge
          SCRIPT=server/r4-master/part4_r2_storage_resume_after_ntfs_shrink_v4.sh
          MANIFEST="$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz"
          FAIL=mission-control/r4-part4-r2-failures/FAILURE-36661752109.json
          SYNC=mission-control/privilege-bridge/V121-CERTIFIED-20260930T033205Z.json

          test "$(hostname)" = LOUKSNA
          test "$(id -un)" = "$USER_NAME"
          test "$(sha256sum "$RUNUSER"|awk '{print $1}')" = "$RUNUSER_SHA"
          test "$(sha256sum "$MANIFEST"|awk '{print $1}')" = "$EXPECTED_MANIFEST_SHA"
          sudo -n true
          sudo -n visudo -c >/dev/null
          sudo -n "$RUNUSER" -u "$USER_NAME" -- bash --noprofile --norc -c 'sudo -k >/dev/null 2>&1 || true; test "$(sudo -n id -u)" = 0; test "$(sudo -n id -un)" = root'
          test "$(systemctl is-active actions.runner.Plomillo-luna-linux-bridge.luna-linux.service)" = active
          test "$(systemctl is-enabled actions.runner.Plomillo-luna-linux-bridge.luna-linux.service)" = enabled
          test "$(systemctl show actions.runner.Plomillo-luna-linux-bridge.luna-linux.service -p Restart --value)" = always
          test "$(systemctl is-active louksna-privilege-guardian.timer)" = active

          test "$(sudo -n sha256sum "$PB/SUDO_POLICY_COMPLETE.sha256"|awk '{print $1}')" = "$POLICY_MANIFEST_SHA"
          test "$(sudo -n sha256sum "$PB/INSTALL_MANIFEST_V121.sha256"|awk '{print $1}')" = "$COMPONENT_MANIFEST_SHA"
          test "$(sudo -n sha256sum "$PB/g23/G23_V121_20260930T033205Z.json"|awk '{print $1}')" = "$PRIV_G23_SHA"
          test "$(sudo -n sha256sum "$PB/g24/G24_V121_20260930T033205Z.json"|awk '{print $1}')" = "$PRIV_G24_SHA"
          test "$(sudo -n python3 -c 'import json;print(json.load(open("/var/lib/louksna/privilege-bridge/g23/G23_V121_20260930T033205Z.json"))["status"])')" = PASS
          test "$(sudo -n python3 -c 'import json;print(json.load(open("/var/lib/louksna/privilege-bridge/g24/G24_V121_20260930T033205Z.json"))["status"])')" = PASS

          python3 - "$FAIL" "$SYNC" <<'PY'
          import json,sys
          f=json.load(open(sys.argv[1])); s=json.load(open(sys.argv[2]))
          assert f["status"]=="FAIL_CLOSED_HOLD"
          assert f["source_run"]==36661752109
          assert f["irreversible_mutation_reached"] is True
          assert f["last_confirmed_pass_event"]=="NTFS_FILESYSTEM_SHRUNK"
          assert s["status"]=="PASS_STRICT"
          assert s["bridge"]["version"]=="1.2.1"
          assert s["bridge"]["state"]=="CERTIFIED_ACTIVE"
          PY

          if findmnt -n -S "$P3" >/dev/null 2>&1; then
            echo "P3 unexpectedly mounted:" >&2
            findmnt -n -S "$P3" >&2
            exit 20
          fi

          sudo -n sfdisk --dump /dev/nvme0n1 > "$OUT/PARTITION_TABLE_LIVE.sfdisk"
          python3 - "$OUT/PARTITION_TABLE_LIVE.sfdisk" <<'PY'
          import re,sys
          d={}
          for line in open(sys.argv[1],errors="replace"):
              m=re.match(r"^/dev/nvme0n1p(\d+)\s*:\s*start=\s*(\d+),\s*size=\s*(\d+)",line)
              if m:d[int(m.group(1))]=(int(m.group(2)),int(m.group(3)))
          exp={1:(2048,532480),2:(534528,32768),3:(567296,853844280),5:(854411576,144420552),4:(998832128,1368064)}
          assert d==exp,(d,exp)
          PY
          test "$(sudo -n blkid -p -s UUID -o value "$P3")" = F2848A148489DC0B

          LC_ALL=C sudo -n ntfsresize --info --force "$P3" > "$OUT/NTFS_INFO_LIVE.txt" 2>&1
          python3 - "$OUT/NTFS_INFO_LIVE.txt" <<'PY'
          import re,sys,json,pathlib
          t=pathlib.Path(sys.argv[1]).read_text(errors="replace")
          a=re.search(r"Current volume size:\s*([0-9]+) bytes",t)
          b=re.search(r"Current device size:\s*([0-9]+) bytes",t)
          assert a and b
          vol=int(a.group(1)); dev=int(b.group(1))
          assert 0 <= 228137631744-vol < 4096,(vol,228137631744)
          assert dev==437168271360,(dev,437168271360)
          pathlib.Path(sys.argv[1]+".parsed.json").write_text(json.dumps({"volume_size_bytes":vol,"device_size_bytes":dev},indent=2)+"\n")
          PY

          STAGE="$HOME/.local/state/louksna/r4-master-part1-part9/PART_4_R2/v4-probe-source"
          mkdir -p "$STAGE"; chmod 700 "$STAGE"
          sudo -n mount -t ntfs3 -o "ro,uid=$(id -u),gid=$(id -g),umask=0077" "$P3" "$STAGE"
          trap 'sudo -n umount "$STAGE" >/dev/null 2>&1 || true' EXIT
          python3 server/r4-master/part4_r2_verify_tree.py --root "$STAGE/PROYECTOS" --manifest "$MANIFEST" --out "$OUT/VERIFY_SOURCE_AFTER_FAILED_SHRINK.json"
          sudo -n umount "$STAGE"; trap - EXIT

          SCRIPT_SHA="$(sha256sum "$SCRIPT"|awk '{print $1}')"
          CHECKPOINT_SHA="$(sha256sum "$OUT/PARTITION_TABLE_LIVE.sfdisk"|awk '{print $1}')"
          SOURCE_VERIFY_SHA="$(sha256sum "$OUT/VERIFY_SOURCE_AFTER_FAILED_SHRINK.json"|awk '{print $1}')"
          VOL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["volume_size_bytes"])' "$OUT/NTFS_INFO_LIVE.txt.parsed.json")"
          export SCRIPT_SHA CHECKPOINT_SHA SOURCE_VERIFY_SHA VOL
          python3 - "$OUT/RECOVERY_PLAN.json" <<'PY'
          import datetime as dt,json,os,pathlib
          r={
            "schema":"LOUKSNA_R4_PART4_R2_RECOVERY_PLAN_V4/1.0","status":"PASS","stage":"NTFS_FILESYSTEM_SHRUNK_P3_BOUNDARY_ORIGINAL",
            "source_failure_run":36661752109,"disk":"/dev/nvme0n1","source_partition":"/dev/nvme0n1p3","source_uuid":"F2848A148489DC0B",
            "manifest_sha256":"99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e","records":498092,"regular_file_bytes":200490852057,
            "ntfs":{"fs_target_bytes":228137631744,"live_volume_size_bytes":int(os.environ["VOL"]),"live_device_size_bytes":437168271360},
            "geometry":{"p3_start":567296,"p3_original_size":853844280,"p3_shrunk_size":446629888,"p3_new_end":447197183,
                        "temp_start":447199232,"temp_end":854409528,"p3_final_size":853842233,"p3_final_end":854409528,
                        "p1":[2048,532480],"p2":[534528,32768],"p5":[854411576,144420552],"p4":[998832128,1368064]},
            "mutation_method":"SFDISK_FORCE_NO_REREAD_N3_PLUS_PARTX",
            "mutation_reason":"GNU_PARTED_SCRIPT_MODE_REFUSED_SHRINK_CONFIRMATION_IN_RUN_36661752109",
            "script":"server/r4-master/part4_r2_storage_resume_after_ntfs_shrink_v4.sh","script_sha256":os.environ["SCRIPT_SHA"],
            "live_partition_checkpoint_sha256":os.environ["CHECKPOINT_SHA"],"source_verify_sha256":os.environ["SOURCE_VERIFY_SHA"],
            "privilege_bridge":{"version":"1.2.1","runuser_sha256":"ea71a94cb0097f3e1d5ce2fa8fb775bf1bd1ddd74960fad3ee22d7d8d1ef4488",
                                "policy_manifest_sha256":"a570fbb5b0dcafaa1c1633015c75970acd6c9ea342a2f4130c6b254cb0fbbade",
                                "component_manifest_sha256":"d81cd60be8a9c1b589fc180b95b4410aeb262bfef342c7a73f95f24dae1bcbe9",
                                "g23_sha256":"641955e0a149f99cb4905bb44fbcae29a422b18a6e4cd3b9d210010c9aaa0029",
                                "g24_sha256":"53b882221d31ac3fe4ba14565a9681f47f574c8fffcd9f5da02ddeade6d2c139"},
            "rollback_contract":{"before_p3_reformat":"SHRUNK_NTFS_P3_REMAINS_SOURCE_OF_TRUTH",
                                 "after_temp_verify_before_p3_reformat":"SHRUNK_NTFS_P3_AND_VERIFIED_TEMP_EXT4",
                                 "after_p3_reformat_until_final_verify":"VERIFIED_TEMP_EXT4_IS_RECOVERY_COPY",
                                 "after_final_verify":"VERIFIED_EXT4_P3_IS_PROTECTED_SOURCE"},
            "generated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(os.environ["RUNNER_TEMP"]+"/v4-probe/RECOVERY_PLAN.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY

          cat > "$OUT/LIVE_PRIVILEGE_EVIDENCE.json" <<EOF
          {"schema":"LOUKSNA_PRIVILEGE_BRIDGE_LIVE_SYNC/1.0","status":"PASS_STRICT","host":"LOUKSNA","runuser_sha256":"$RUNUSER_SHA","policy_manifest_sha256":"$POLICY_MANIFEST_SHA","component_manifest_sha256":"$COMPONENT_MANIFEST_SHA","g23_sha256":"$PRIV_G23_SHA","g24_sha256":"$PRIV_G24_SHA","sudo_noninteractive":true,"runuser_roundtrip":true,"runner_active":true,"guardian_active":true}
          EOF
          sha256sum "$OUT"/* | sort > "$OUT/EVIDENCE.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v4-recovery-plan
          path: ${{ runner.temp }}/v4-probe/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_plan:
    name: G23 independently validate live recovery plan
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            server/r4-master
            mission-control/r4-part4-r2-failures
            mission-control/privilege-bridge
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v4-recovery-plan
          path: ${{ runner.temp }}/p
      - name: Validate exact irreversible boundary, privilege anchor and rollback
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/p/RECOVERY_PLAN.json" "$RUNNER_TEMP/p/VERIFY_SOURCE_AFTER_FAILED_SHRINK.json"             server/r4-master/part4_r2_storage_resume_after_ntfs_shrink_v4.sh             mission-control/r4-part4-r2-failures/FAILURE-36661752109.json             mission-control/privilege-bridge/V121-CERTIFIED-20260930T033205Z.json             "$RUNNER_TEMP/g23/G23_RECOVERY_PLAN_V4.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,sys
          plan=pathlib.Path(sys.argv[1]); verify=pathlib.Path(sys.argv[2]); script=pathlib.Path(sys.argv[3]); fail=pathlib.Path(sys.argv[4]); sync=pathlib.Path(sys.argv[5]); out=pathlib.Path(sys.argv[6])
          p=json.loads(plan.read_text()); v=json.loads(verify.read_text()); f=json.loads(fail.read_text()); s=json.loads(sync.read_text())
          checks={
            "plan_pass":p.get("status")=="PASS","stage":p.get("stage")=="NTFS_FILESYSTEM_SHRUNK_P3_BOUNDARY_ORIGINAL",
            "failure_run":p.get("source_failure_run")==36661752109 and f.get("irreversible_mutation_reached") is True,
            "uuid":p.get("source_uuid")=="F2848A148489DC0B","manifest":p.get("manifest_sha256")=="99346fd6032b548b8de0b9bf7d8a671d1ccd048dd6d2309cd82b754866916d0e",
            "source_verify":v.get("status")=="PASS" and v.get("mismatch_count")==0 and v.get("seen_records")==498092 and v.get("regular_file_bytes")==200490852057,
            "source_verify_hash":hashlib.sha256(verify.read_bytes()).hexdigest()==p.get("source_verify_sha256"),
            "script_hash":hashlib.sha256(script.read_bytes()).hexdigest()==p.get("script_sha256"),
            "geometry":p.get("geometry")=={"p1":[2048,532480],"p2":[534528,32768],"p3_final_end":854409528,"p3_final_size":853842233,"p3_new_end":447197183,"p3_original_size":853844280,"p3_shrunk_size":446629888,"p3_start":567296,"p4":[998832128,1368064],"p5":[854411576,144420552],"temp_end":854409528,"temp_start":447199232},
            "ntfs":0 <= 228137631744-int(p["ntfs"]["live_volume_size_bytes"]) < 4096 and p["ntfs"]["live_device_size_bytes"]==437168271360,
            "method":p.get("mutation_method")=="SFDISK_FORCE_NO_REREAD_N3_PLUS_PARTX",
            "rollback":p.get("rollback_contract",{}).get("before_p3_reformat")=="SHRUNK_NTFS_P3_REMAINS_SOURCE_OF_TRUTH",
            "priv_sync":s.get("status")=="PASS_STRICT" and s.get("bridge",{}).get("state")=="CERTIFIED_ACTIVE",
            "priv_hashes":p.get("privilege_bridge",{}).get("g24_sha256")=="53b882221d31ac3fe4ba14565a9681f47f574c8fffcd9f5da02ddeade6d2c139"}
          ok=all(checks.values())
          r={"schema":"LOUKSNA_R4_PART4_R2_RECOVERY_PLAN_V4_G23/1.0","status":"PASS" if ok else "HOLD","scope":"RESUME_ONLY_AFTER_CONFIRMED_NTFS_SHRINK_BEFORE_P3_BOUNDARY_SHRINK","checks":checks,
             "plan_sha256":hashlib.sha256(plan.read_bytes()).hexdigest(),"script_sha256":hashlib.sha256(script.read_bytes()).hexdigest(),"repair_allowed":False,"g24_allowed":ok,
             "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          out.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n"); print(json.dumps(r,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v4-recovery-plan-g23
          path: ${{ runner.temp }}/g23/G23_RECOVERY_PLAN_V4.json
          retention-days: 90
          compression-level: 0

  g24_plan:
    name: G24 certify live recovery plan
    needs: g23_plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v4-recovery-plan-g23
          path: ${{ runner.temp }}/g23
      - name: Issue digest-bound recovery certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_RECOVERY_PLAN_V4.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"; P="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["plan_sha256"])' "$G")"; S="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["script_sha256"])' "$G")"
          AUD="louksna-r4-part4-r2-v4-recovery:$P:$S:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H P S AUD TOKEN; mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24_RECOVERY_PLAN_V4.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; q=t.split("."); payload=q[1]+"="*((4-len(q[1])%4)%4); c=json.loads(base64.urlsafe_b64decode(payload)); aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          r={"schema":"LOUKSNA_R4_PART4_R2_RECOVERY_PLAN_V4_G24/1.0","status":"PASS","scope":"RESUME_AFTER_NTFS_SHRINK_ONLY","plan_sha256":os.environ["P"],"script_sha256":os.environ["S"],"g23_sha256":os.environ["H"],
             "authority_authenticated":True,"authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),"canonical_mutation":False,"authority_transfer":False,
             "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()}
          pathlib.Path(sys.argv[1]).write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-v4-recovery-plan-g24
          path: ${{ runner.temp }}/g24/G24_RECOVERY_PLAN_V4.json
          retention-days: 90
          compression-level: 0

  execute:
    name: Execute G24-certified storage recovery and migration
    needs: g24_plan
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: server/r4-master
          sparse-checkout-cone-mode: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v4-recovery-plan
          path: ${{ runner.temp }}/p
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v4-recovery-plan-g24
          path: ${{ runner.temp }}/g24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: R4-PART4-PROYECTOS-freeze-36619942178
          path: ${{ runner.temp }}/freeze
          run-id: ${{ env.FREEZE_RUN }}
          github-token: ${{ github.token }}
      - name: Bind certificate and execute resume state machine
        shell: bash
        run: |
          set -Eeuo pipefail
          PLAN="$RUNNER_TEMP/p/RECOVERY_PLAN.json"; CERT="$RUNNER_TEMP/g24/G24_RECOVERY_PLAN_V4.json"; SCRIPT=server/r4-master/part4_r2_storage_resume_after_ntfs_shrink_v4.sh
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$CERT")" = PASS
          test "$(sha256sum "$PLAN"|awk '{print $1}')" = "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["plan_sha256"])' "$CERT")"
          test "$(sha256sum "$SCRIPT"|awk '{print $1}')" = "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["script_sha256"])' "$CERT")"
          OUT="$RUNNER_TEMP/v4-migration"; mkdir -p "$OUT"
          bash "$SCRIPT" "$PLAN" "$OUT" "$RUNNER_TEMP/freeze/PROYECTOS_MANIFEST.jsonl.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: r4-part4-r2-v4-migration-material
          path: ${{ runner.temp }}/v4-migration/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  g23_migration:
    name: G23 validate recovered P3 ext4 intermediate state
    needs: execute
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-v4-migration-material
          path: ${{ runner.temp }}/m
      - name: Independently validate manifest, geometry and rollback closure
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
