name: "R4 — LOUKSNA Remote Bridge live observe"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-lrb-live-observe/**

permissions:
  contents: read

concurrency:
  group: r4-lrb-live-observe
  cancel-in-progress: false

jobs:
  observe:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 8
    steps:
      - name: Observe host only through LOUKSNA Remote Bridge
        shell: bash
        run: |
          set -Eeuo pipefail
          HOME_REAL="/home/diegoignacionorambuenamiranda"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"

          mapfile -t LINKS < <(find "$HOME_REAL/.local/lib/louksna-remote-bridge" -type f -path '*/bridge/live_link.py' -print 2>/dev/null | sort)
          test "${#LINKS[@]}" -ge 1
          LINK="${LINKS[-1]}"

          STATUS="$(python3 -B "$LINK"             --state-dir "$HOME_REAL/.local/state/louksna/remote-bridge/service"             --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op status)"
          OBSERVE="$(python3 -B "$LINK"             --state-dir "$HOME_REAL/.local/state/louksna/remote-bridge/service"             --socket-dir "$XDG_RUNTIME_DIR/lrb-sock" request --op observe)"

          python3 - "$STATUS" "$OBSERVE" <<'PY'
          import hashlib,json,sys
          status=json.loads(sys.argv[1]); observe=json.loads(sys.argv[2])
          if status.get("host")!="LOUKSNA":
              raise SystemExit("LRB_HOST_MISMATCH")
          if not observe.get("evidence_sha256"):
              raise SystemExit("LRB_EVIDENCE_SHA_MISSING")
          out={
            "schema":"LOUKSNA_R4_LRB_LIVE_OBSERVATION/1.0",
            "status":"PASS",
            "transport":"LOUKSNA_REMOTE_BRIDGE",
            "desktop_commander_used":False,
            "material_execution":False,
            "lrb_status":status,
            "lrb_observe":observe,
            "observation_binding_sha256":hashlib.sha256(
              (json.dumps(status,sort_keys=True,separators=(",",":"))+
               json.dumps(observe,sort_keys=True,separators=(",",":"))).encode()
            ).hexdigest()
          }
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
