name: "Android 17 package identity probe"

on:
  push:
    branches:
      - staging/metacognitive-ecosystem-v1-r4-cloud-cert-20260928
    paths:
      - .github/workflows/android17-package-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect SDK package identities
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --list --channel=3 > "$RUNNER_TEMP/sdk-list.txt"
          echo "=== API 37 / Cinnamon Bun package candidates ==="
          grep -Ei 'android-37|cinnamon|build-tools;37|system-images;android-37' "$RUNNER_TEMP/sdk-list.txt" | head -120 || true
