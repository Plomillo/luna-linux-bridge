name: BTX source forensic audit

on:
  push:
    branches:
      - audit/btx-book-census-20261023
    paths:
      - ".github/workflows/btx-source-audit.yml"
      - "tools/btx-audit/**"
      - "cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/**"
  pull_request:
    paths:
      - ".github/workflows/btx-source-audit.yml"
      - "tools/btx-audit/**"
      - "cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-btx-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install read-only archive and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full poppler-utils
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Parquet reader
        run: python -m pip install --disable-pip-version-check pyarrow==21.0.0 pymupdf==1.26.5
      - name: Test archive path and inventory safety
        working-directory: tools/btx-audit
        run: python -m unittest -v test_audit_source.py
      - name: Inspect BTX archive without publishing Bible text
        run: python tools/btx-audit/audit_source.py --output btx-source-audit.json
      - name: Profile font and layout metadata without emitting Bible text
        run: python tools/btx-audit/inspect_pdf_layout.py > btx-layout-profile.json
      - name: Upload forensic metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btx-source-forensic-audit
          path: |
            btx-source-audit.json
            btx-layout-profile.json
          if-no-files-found: warn
          retention-days: 14
