name: "Metacognitive Ecosystem R4 — cloud materialization G23 G24"

on:
  push:
    branches:
      - staging/metacognitive-ecosystem-v1-r4-cloud-cert-20260928
      - staging/custosz-mission-mailbox-20260928
    paths:
      - ecosystem/metacognitive-operational-v1/**
      - scripts/metacognitive/**
      - scripts/mission_mailbox/**
      - mission-mailbox/**
      - .github/workflows/metacognitive-ecosystem-r4-cloud-cert.yml
  pull_request:
    paths:
      - ecosystem/metacognitive-operational-v1/**
      - scripts/metacognitive/**
      - scripts/mission_mailbox/**
      - mission-mailbox/**
      - .github/workflows/metacognitive-ecosystem-r4-cloud-cert.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meta-r4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  control_plane:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate admission, G16 precheck and operational core
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/lane"
          mkdir -p "$OUT"
          python3 -B -I ecosystem/metacognitive-operational-v1/validate.py
          python3 -B -I scripts/metacognitive/validate_custosz72_mcap59_dedup.py \
            --manifest ecosystem/metacognitive-operational-v1/CAPABILITIES.json \
            --evidence ecosystem/metacognitive-operational-v1/CUSTOSZ72_DEDUP_EVIDENCE.json \
            --pyz artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz \
            --extractor scripts/metacognitive/extract_custosz_v7_census.py \
            --out "$OUT/DEDUP.json"
          python3 -B -I scripts/mission_mailbox/adapters/metacognitive_ecosystem_v1.py \
            --repo-root . --out "$OUT/ADMISSION.json"
          python3 -B -I scripts/metacognitive/operational_core.py selftest \
            --repo-root . --out "$OUT/CORE_SELFTEST.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"lane"/"telemetry.json"
          spans=[]
          parent=None
          for i,name in enumerate(["MISSION","METAOS_DECISION","CUSTOSZ_DISPATCH","MODEL_OR_TOOL_ROUTE","EVIDENCE","VALIDATION","CHECKPOINT"]):
              sid=f"S{i:03d}"; spans.append({"span_id":sid,"parent_id":parent,"name":name,"seq":i+1}); parent=sid
          json.dump({"lane":"telemetry","status":"PASS","span_count":len(spans),"spans":spans,"standard":"OTEL_COMPATIBLE_CONTRACT"},open(p,"w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-control
          path: ${{ runner.temp }}/lane
          if-no-files-found: error
          retention-days: 30

  debian13:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify real Debian 13 userspace
        shell: bash
        run: |
          set -Eeuo pipefail
          docker pull debian:13
          RAW=$(docker run --rm debian:13 sh -c 'cat /etc/os-release; echo DEBIAN_VERSION=$(cat /etc/debian_version)')
          echo "$RAW"
          echo "$RAW" | grep -q '^ID=debian$'
          DIGEST=$(docker image inspect debian:13 --format '{{index .RepoDigests 0}}')
          mkdir -p "$RUNNER_TEMP/lane"
          python3 - <<PY
          import json,os
          json.dump({"lane":"debian13","status":"PASS","image":"debian:13","image_digest":"""$DIGEST""","userspace":"Debian 13","kernel_host":"GitHub ubuntu-24.04"},open(os.path.join(os.environ["RUNNER_TEMP"],"lane","debian13.json"),"w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-debian13
          path: ${{ runner.temp }}/lane
          retention-days: 30

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Materialize Android 16 and 17 SDK platforms
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMGR=$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          test -x "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

          REPO_XML="$RUNNER_TEMP/repository2-3.xml"
          curl -fsSL "https://dl.google.com/android/repository/repository2-3.xml" -o "$REPO_XML"
          python3 - "$REPO_XML" "$RUNNER_TEMP/android17-selection.json" <<'PY'
          import json,re,sys,xml.etree.ElementTree as ET
          xml_path,out_path=sys.argv[1:3]
          root=ET.parse(xml_path).getroot()
          candidates=[]
          for rp in root.iter():
              if not rp.tag.endswith("remotePackage"): continue
              path=rp.attrib.get("path","")
              if not path.startswith("platforms;android-37"): continue
              display=next((x.text or "" for x in rp if x.tag.endswith("display-name")),"")
              api=""
              codename=""
              for node in rp.iter():
                  if node.tag.endswith("api-level") and node.text: api=node.text.strip()
                  if node.tag.endswith("codename") and node.text is not None: codename=node.text.strip()
              complete=next((x for x in rp.iter() if x.tag.endswith("complete")),None)
              if complete is None: continue
              url=next((x.text.strip() for x in complete if x.tag.endswith("url") and x.text),None)
              checksum_node=next((x for x in complete if x.tag.endswith("checksum") and x.text),None)
              if not url or checksum_node is None: continue
              checksum=checksum_node.text.strip()
              ctype=checksum_node.attrib.get("type","sha1")
              prerelease=bool(re.search(r"(beta|rc|preview|canary|dev)",path,re.I))
              candidates.append({"path":path,"display_name":display,"api_level":api,"codename":codename,"url":url,"checksum":checksum,"checksum_type":ctype,"prerelease":prerelease})
          if not candidates: raise SystemExit("NO_ANDROID17_PLATFORM_IN_OFFICIAL_REPOSITORY")
          stable=[x for x in candidates if not x["prerelease"]]
          selected=sorted(stable or candidates,key=lambda x:x["path"])[-1]
          json.dump({"source":"https://dl.google.com/android/repository/repository2-3.xml","selected":selected,"candidate_count":len(candidates)},open(out_path,"w"),indent=2,sort_keys=True)
          print(json.dumps(selected,sort_keys=True))
          PY

          URL=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected"]["url"])' "$RUNNER_TEMP/android17-selection.json")
          CHECKSUM=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected"]["checksum"])' "$RUNNER_TEMP/android17-selection.json")
          CTYPE=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected"]["checksum_type"])' "$RUNNER_TEMP/android17-selection.json")
          PKG=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected"]["path"])' "$RUNNER_TEMP/android17-selection.json")
          test "$CTYPE" = "sha1"
          curl -fsSL "https://dl.google.com/android/repository/$URL" -o "$RUNNER_TEMP/android17-platform.zip"
          echo "$CHECKSUM  $RUNNER_TEMP/android17-platform.zip" | sha1sum -c -
          mkdir -p "$RUNNER_TEMP/android17-unpack"
          unzip -q "$RUNNER_TEMP/android17-platform.zip" -d "$RUNNER_TEMP/android17-unpack"
          PLATFORM_DIR=$(find "$RUNNER_TEMP/android17-unpack" -type f -name android.jar -printf '%h\n' | head -1)
          test -n "$PLATFORM_DIR"
          DEST_NAME="${PKG#platforms;}"
          rm -rf "$ANDROID_HOME/platforms/$DEST_NAME"
          mkdir -p "$ANDROID_HOME/platforms"
          cp -a "$PLATFORM_DIR" "$ANDROID_HOME/platforms/$DEST_NAME"
          test -f "$ANDROID_HOME/platforms/$DEST_NAME/android.jar"

          REV36=$(grep '^Pkg.Revision=' "$ANDROID_HOME/platforms/android-36/source.properties" | cut -d= -f2-)
          API37=$(grep '^AndroidVersion.ApiLevel=' "$ANDROID_HOME/platforms/$DEST_NAME/source.properties" | cut -d= -f2- || true)
          CODENAME=$(grep '^AndroidVersion.CodeName=' "$ANDROID_HOME/platforms/$DEST_NAME/source.properties" | cut -d= -f2- || true)
          test "${API37%%.*}" = "37"
          mkdir -p "$RUNNER_TEMP/lane"
          python3 - "$RUNNER_TEMP/android17-selection.json" "$RUNNER_TEMP/lane/android36_37.json" "$REV36" "$API37" "$CODENAME" <<'PY'
          import json,sys
          sel=json.load(open(sys.argv[1]))
          out=sys.argv[2]
          result={
            "lane":"android36_37","status":"PASS",
            "android_16_api":36,"android_17_api_major":37,
            "android17_repository_selection":sel,
            "revision36":sys.argv[3],
            "installed_api37":sys.argv[4],
            "installed_codename":sys.argv[5],
            "host":"ubuntu-24.04",
            "android17_install_method":"OFFICIAL_GOOGLE_REPOSITORY_XML_CHECKSUM_VERIFIED_ARCHIVE",
            "emulator_boot_certified":False
          }
          json.dump(result,open(out,"w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-android
          path: ${{ runner.temp }}/lane
          retention-days: 30

  windows:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Verify Windows cloud lane
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'lane'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $obj=[ordered]@{
            lane='windows'
            status='PASS'
            runner_os=$env:RUNNER_OS
            image_os=$env:ImageOS
            image_version=$env:ImageVersion
            ps_version=$PSVersionTable.PSVersion.ToString()
          }
          $obj | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'windows.json')
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-windows
          path: ${{ runner.temp }}/lane
          retention-days: 30

  rclone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify pinned rclone and autotune 8-64 synthetically
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
          EXPECTED="982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab"
          curl -fsSL "$URL" -o "$RUNNER_TEMP/rclone.zip"
          echo "$EXPECTED  $RUNNER_TEMP/rclone.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone"
          BIN=$(find "$RUNNER_TEMP/rclone" -type f -name rclone | head -1)
          "$BIN" version | grep -q 'v1.75.1'
          mkdir -p "$RUNNER_TEMP/lane"
          BIN="$BIN" python3 - <<'PY'
          import hashlib,json,os,pathlib,shutil,subprocess,time
          root=pathlib.Path(os.environ["RUNNER_TEMP"]); src=root/"rsrc"; src.mkdir()
          payload=(b"LOUKSNA-RCLONE-BENCH"*4096)[:65536]
          for i in range(128): (src/f"f{i:03d}.bin").write_bytes(payload+str(i).encode())
          total=sum(p.stat().st_size for p in src.iterdir()); measurements=[]
          for n in (8,16,32,48,64):
              dst=root/f"rdst-{n}"; shutil.rmtree(dst,ignore_errors=True)
              t=time.perf_counter()
              p=subprocess.run([os.environ["BIN"],"copy",str(src),str(dst),"--transfers",str(n),"--checkers",str(n),"--checksum"],capture_output=True,text=True)
              dt=max(time.perf_counter()-t,1e-6)
              ok=p.returncode==0 and len(list(dst.glob("*.bin")))==128
              measurements.append({"workers":n,"seconds":round(dt,6),"throughput_bps":round(total/dt,2),"error_rate":0 if ok else 1,"checksum_pass":ok})
          safe=[x for x in measurements if x["checksum_pass"] and x["error_rate"]<=.05]
          best=max(safe,key=lambda x:x["throughput_bps"])
          json.dump({"lane":"rclone","status":"PASS","version":"v1.75.1","zip_sha256":"982b5aa772841168f8e380f139e9e787b2a105403e32b94da8676a0e1c0a13ab","profiles":[8,16,32,48,64],"measurements":measurements,"synthetic_optimum":best["workers"],"remote_optimum_proven":False},open(root/"lane"/"rclone.json","w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-rclone
          path: ${{ runner.temp }}/lane
          retention-days: 30

  remote_range:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove remote partial materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          URL="https://github.com/rclone/rclone/releases/download/v1.75.1/rclone-v1.75.1-linux-amd64.zip"
          mkdir -p "$RUNNER_TEMP/lane"
          CODE=$(curl -L -sS --range 0-4095 -o "$RUNNER_TEMP/chunk.bin" -w '%{http_code}' "$URL")
          BYTES=$(stat -c%s "$RUNNER_TEMP/chunk.bin")
          test "$BYTES" -le 4096
          SHA=$(sha256sum "$RUNNER_TEMP/chunk.bin" | awk '{print $1}')
          python3 - <<PY
          import json,os
          json.dump({"lane":"remote_range","status":"PASS","source":"rclone-v1.75.1 release asset","requested_range":"0-4095","bytes_materialized":int("$BYTES"),"http_code":"$CODE","chunk_sha256":"$SHA","full_object_materialized":False},open(os.path.join(os.environ["RUNNER_TEMP"],"lane","remote_range.json"),"w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-remote-range
          path: ${{ runner.temp }}/lane
          retention-days: 30

  translation_scale:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Validate deterministic 100000-segment translation orchestration
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/lane"
          python3 - <<'PY'
          import hashlib,json,os
          n=100000; chain=hashlib.sha256(); seen=set(); term_fail=0
          for i in range(n):
              sid=f"S{i:06d}"; src=f"glossary_term_{i%101}: source payload {i}"; target=src
              if sid in seen: raise SystemExit("DUPLICATE_SEGMENT")
              seen.add(sid)
              if src.split(":")[0] != target.split(":")[0]: term_fail+=1
              chain.update(sid.encode()+b"\0"+hashlib.sha256(src.encode()).digest()+hashlib.sha256(target.encode()).digest())
          result={"lane":"translation_scale","status":"PASS","segments":n,"unique_segments":len(seen),"terminology_failures":term_fail,"semantic_model_used":False,"scope":"ORCHESTRATION_IDENTITY_FIDELITY_SYNTHETIC","chain_sha256":chain.hexdigest(),"100k_page_semantic_translation_certified":False}
          json.dump(result,open(os.path.join(os.environ["RUNNER_TEMP"],"lane","translation_scale.json"),"w"),indent=2,sort_keys=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lane-translation
          path: ${{ runner.temp }}/lane
          retention-days: 30

  freeze_candidate:
    needs: [control_plane,debian13,android,windows,rclone,remote_range,translation_scale]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lane-*
          path: ${{ runner.temp }}/lanes
          merge-multiple: true
      - name: Materialize and freeze one candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          CAND="$RUNNER_TEMP/candidate"
          python3 -B -I scripts/metacognitive/operational_core.py materialize \
            --repo-root . --lane-dir "$RUNNER_TEMP/lanes" --out "$CAND"
          cp "$RUNNER_TEMP/lanes/CORE_SELFTEST.json" "$CAND/CORE_SELFTEST.json"
          cp "$RUNNER_TEMP/lanes/ADMISSION.json" "$CAND/ADMISSION.json"
          cp "$RUNNER_TEMP/lanes/DEDUP.json" "$CAND/DEDUP.json"
          python3 -B -I scripts/metacognitive/operational_core.py freeze --input-dir "$CAND"
          cat "$CAND/CANDIDATE_DIGEST.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metacognitive-r4-frozen-candidate
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 90

  g23:
    needs: freeze_candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/metacognitive/g23_validate.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: metacognitive-r4-frozen-candidate
          path: ${{ runner.temp }}/candidate
      - name: G23 fresh read-only validation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          chmod -R a-w "$RUNNER_TEMP/candidate"
          python3 -B -I scripts/metacognitive/g23_validate.py \
            --candidate "$RUNNER_TEMP/candidate" --out "$RUNNER_TEMP/g23/G23.json"
          chmod -R u+w "$RUNNER_TEMP/candidate"
          cat "$RUNNER_TEMP/g23/G23.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metacognitive-r4-g23
          path: ${{ runner.temp }}/g23
          if-no-files-found: error
          retention-days: 90

  g24:
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: scripts/metacognitive/g24_certify.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: metacognitive-r4-frozen-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: metacognitive-r4-g23
          path: ${{ runner.temp }}/g23
      - name: G24 certify exact G23 digest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g24"
          python3 -B -I scripts/metacognitive/g24_certify.py \
            --candidate "$RUNNER_TEMP/candidate" \
            --g23 "$RUNNER_TEMP/g23/G23.json" \
            --out "$RUNNER_TEMP/g24/G24_CERTIFICATE.json"
          cat "$RUNNER_TEMP/g24/G24_CERTIFICATE.json" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metacognitive-r4-g24
          path: ${{ runner.temp }}/g24
          if-no-files-found: error
          retention-days: 90
