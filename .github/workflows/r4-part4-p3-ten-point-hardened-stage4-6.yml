name: "R4 PART4 — hardened ten-point continuation Stage4-6"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-p3-ten-point-hardened/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: r4-part4-p3-ten-point-hardened
  cancel-in-progress: false

env:
  CONTRACT_ID: "PART4-P3-GROWTH-HARDENED-ANTI-PARALYSIS-20261001"
  DIRECTIVE_ID: "PART4-P3-TEN-POINT-HARDENED-CONTINUATION-20261001"
  EXPECTED_CONTRACT_SHA256: "da4c5296d0e19585e61d6867fee651c0c951965accb9b144ab4504caa93cc0a9"
  EXPECTED_MISSION_ID: "MIS-e5963403a3b44ee8be96"

jobs:
  material:
    name: Static material validation
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate additive directive and safe Stage4-6 handlers
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/material"
          python3 -m py_compile server/r4-master/master_controller.py
          python3 - "$RUNNER_TEMP/material/MATERIAL.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,re,sys
          out=pathlib.Path(sys.argv[1])
          ctrl=pathlib.Path("server/r4-master/master_controller.py")
          contract=pathlib.Path("server/r4-master/PART4_P3_GROWTH_HARDENED_ANTI_PARALYSIS.json")
          directive=pathlib.Path("server/r4-master/PART4_P3_TEN_POINT_HARDENED_CONTINUATION.json")
          c=ctrl.read_text()
          d=json.loads(directive.read_text())
          k=json.loads(contract.read_text())
          section=c[c.index("    # Stage 4:"):c.index("    # Stages 7-12")]
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          checks={
            "contract_id":k.get("contract_id")=="PART4-P3-GROWTH-HARDENED-ANTI-PARALYSIS-20261001",
            "contract_hash":h(contract)=="da4c5296d0e19585e61d6867fee651c0c951965accb9b144ab4504caa93cc0a9",
            "directive_id":d.get("directive_id")=="PART4-P3-TEN-POINT-HARDENED-CONTINUATION-20261001",
            "directive_authority":d.get("authority")=="Louksna.md",
            "directive_mission":d.get("mission_id")=="MIS-e5963403a3b44ee8be96",
            "directive_subordinate":d.get("subordinate_to_contract",{}).get("contract_id")==k.get("contract_id"),
            "directive_parent_not_mutated":d.get("subordinate_to_contract",{}).get("mutation_of_parent_contract") is False,
            "ten_points_exact":len(d.get("ten_points",[]))==10,
            "directive_no_disk_auth":d.get("disk_mutation_authorized_by_this_directive") is False,
            "directive_no_fs_auth":d.get("filesystem_mutation_authorized_by_this_directive") is False,
            "stage4_handler":"if stage==4:" in section and "GPT_BACKUP.bin" in section and "--backup=" in section,
            "stage5_handler":"if stage==5:" in section and "STAGE5_CANDIDATE.json" in section,
            "stage6_handler":"if stage==6:" in section and "STAGE6_G24.json" in section,
            "no_resize2fs_stage4_6":"resize2fs" not in section,
            "no_growpart_commit_stage4_6":'run([growpart' not in section and '["growpart"' not in section,
            "no_resizepart_stage4_6":"resizepart" not in section,
            "no_reboot_stage4_6":'"reboot"' not in section and '"systemctl","reboot"' not in section,
            "no_sfdisk_write_stage4_6":"--delete" not in section and "--part-type" not in section,
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_TEN_POINT_MATERIAL/1.0",
            "status":"PASS" if ok else "HOLD",
            "scope":"DEPLOY_AND_EXECUTE_SAFE_STAGE4_TO_STAGE6_ONLY",
            "contract_sha256":h(contract),
            "directive_sha256":h(directive),
            "controller_sha256":h(ctrl),
            "checks":checks,
            "disk_geometry_mutation_authorized":False,
            "filesystem_mutation_authorized":False,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-ten-point-material
          path: ${{ runner.temp }}/material/MATERIAL.json
          retention-days: 90
          compression-level: 0

  g23_activation:
    name: G23 independent activation validation
    needs: material
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-ten-point-material
          path: ${{ runner.temp }}/material
      - name: Validate safe activation scope
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/material/MATERIAL.json" "$RUNNER_TEMP/g23/G23.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,sys
          p,o=map(pathlib.Path,sys.argv[1:])
          m=json.loads(p.read_text())
          checks={
            "material_pass":m.get("status")=="PASS",
            "all_material_checks":all(m.get("checks",{}).values()),
            "scope_exact":m.get("scope")=="DEPLOY_AND_EXECUTE_SAFE_STAGE4_TO_STAGE6_ONLY",
            "no_disk_auth":m.get("disk_geometry_mutation_authorized") is False,
            "no_fs_auth":m.get("filesystem_mutation_authorized") is False,
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_TEN_POINT_ACTIVATION_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "scope":"DEPLOY_AND_EXECUTE_SAFE_STAGE4_TO_STAGE6_ONLY",
            "material_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "checks":checks,
            "g24_allowed":ok,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          o.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-ten-point-activation-g23
          path: ${{ runner.temp }}/g23/G23.json
          retention-days: 90
          compression-level: 0

  g24_activation:
    name: G24 certify safe handler activation
    needs: g23_activation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-ten-point-activation-g23
          path: ${{ runner.temp }}/g23
      - name: Issue digest-bound activation certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"] if d.get("g24_allowed") else "HOLD")' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"
          AUD="louksna-r4-part4-ten-point-safe46:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split("."); payload=p[1]+"="*((4-len(p[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={
            "schema":"LOUKSNA_R4_PART4_TEN_POINT_ACTIVATION_G24/1.0",
            "status":"PASS",
            "scope":"DEPLOY_AND_EXECUTE_SAFE_STAGE4_TO_STAGE6_ONLY",
            "g23_sha256":os.environ["H"],
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
            "disk_geometry_mutation_authorized":False,
            "filesystem_mutation_authorized":False,
            "certification_propagated":False,
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-ten-point-activation-g24
          path: ${{ runner.temp }}/g24/G24.json
          retention-days: 90
          compression-level: 0

  deploy_stage4:
    name: Deploy directive and materialize Stage4 capsule
    needs: g24_activation
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-ten-point-activation-g24
          path: ${{ runner.temp }}/activation-g24
      - name: Deploy safe handlers and wait for local capsule
        shell: bash
        run: |
          set -Eeuo pipefail
          CERT="$RUNNER_TEMP/activation-g24/G24.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"])' "$CERT")" = PASS
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["disk_geometry_mutation_authorized"])' "$CERT")" = False
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["filesystem_mutation_authorized"])' "$CERT")" = False

          DST="$HOME/.local/lib/louksna/r4-master-part1-part9"
          STATE="$HOME/.local/state/louksna/r4-master-part1-part9"
          EXEC="$STATE/PART_4_P3_HARDENED/EXECUTION.json"
          CAPS="$STATE/PART_4_P3_HARDENED/STAGE4_CAPSULE"
          install -m 0700 server/r4-master/master_controller.py "$DST/master_controller.py"
          install -m 0600 server/r4-master/PART4_P3_GROWTH_HARDENED_ANTI_PARALYSIS.json "$DST/PART4_P3_GROWTH_HARDENED_ANTI_PARALYSIS.json"
          install -m 0600 server/r4-master/PART4_P3_TEN_POINT_HARDENED_CONTINUATION.json "$DST/PART4_P3_TEN_POINT_HARDENED_CONTINUATION.json"
          python3 -m py_compile "$DST/master_controller.py"

          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UIDN/bus"
          systemctl --user restart luna-r4-master-part1-part9.service

          for i in $(seq 1 90); do
            if [ -f "$CAPS/CAPSULE_MANIFEST.json" ] && [ -f "$EXEC" ]; then
              STAGE="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("current_stage",0))' "$EXEC")"
              STATUS="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("status",""))' "$EXEC")"
              [ "$STAGE" -eq 4 ] && [ "$STATUS" = "AWAITING_G23_G24" ] && break
            fi
            sleep 2
          done
          test -f "$CAPS/CAPSULE_MANIFEST.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"])' "$CAPS/CAPSULE_MANIFEST.json")" = LOCAL_READY

          OUT="$RUNNER_TEMP/stage4"; mkdir -p "$OUT"
          cp -a "$CAPS" "$OUT/STAGE4_CAPSULE"
          cp "$EXEC" "$OUT/EXECUTION.json"
          cp "$DST/PART4_P3_GROWTH_HARDENED_ANTI_PARALYSIS.json" "$OUT/CONTRACT.json"
          cp "$DST/PART4_P3_TEN_POINT_HARDENED_CONTINUATION.json" "$OUT/DIRECTIVE.json"
          cp "$STATE/MASTER_STATUS.json" "$OUT/MASTER_STATUS.json"
          sha256sum "$OUT/STAGE4_CAPSULE/"* > "$OUT/CAPSULE_FILES_SHA256.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-stage4-recovery-capsule
          path: ${{ runner.temp }}/stage4/
          retention-days: 90
          compression-level: 0

  g23_stage4:
    name: G23 independently verify off-host recovery capsule
    needs: deploy_stage4
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage4-recovery-capsule
          path: ${{ runner.temp }}/stage4
      - name: Verify capsule hashes, geometry and authority binding
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/stage4" "$RUNNER_TEMP/g23/G23.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          cap=root/"STAGE4_CAPSULE"; man=cap/"CAPSULE_MANIFEST.json"
          m=json.loads(man.read_text()); e=json.loads((root/"EXECUTION.json").read_text())
          d=json.loads((root/"DIRECTIVE.json").read_text()); c=json.loads((root/"CONTRACT.json").read_text())
          h=lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          listed=m.get("files",{})
          files_ok=all((cap/n).is_file() and h(cap/n)==v.get("sha256") and (cap/n).stat().st_size==v.get("bytes") for n,v in listed.items())
          checks={
            "manifest_local_ready":m.get("status")=="LOCAL_READY",
            "manifest_checks":all(m.get("checks",{}).values()),
            "file_hashes":files_ok,
            "gpt_backup_present":(cap/"GPT_BACKUP.bin").is_file() and (cap/"GPT_BACKUP.bin").stat().st_size>0,
            "p3_start":int(m.get("p3_start_sector",-1))==567296,
            "root_p3":m.get("root_source")=="/dev/nvme0n1p3",
            "root_ext4":m.get("root_fstype")=="ext4",
            "contract_id":m.get("contract_id")==c.get("contract_id")=="PART4-P3-GROWTH-HARDENED-ANTI-PARALYSIS-20261001",
            "contract_hash":m.get("contract_sha256")==h(root/"CONTRACT.json")=="da4c5296d0e19585e61d6867fee651c0c951965accb9b144ab4504caa93cc0a9",
            "directive_id":m.get("directive_id")==d.get("directive_id")=="PART4-P3-TEN-POINT-HARDENED-CONTINUATION-20261001",
            "directive_hash":m.get("directive_sha256")==h(root/"DIRECTIVE.json"),
            "mission_continuity":m.get("mission_id")==e.get("mission_id")=="MIS-e5963403a3b44ee8be96",
            "no_disk_mutation":m.get("disk_mutation_performed") is False,
            "no_fs_mutation":m.get("filesystem_mutation_performed") is False,
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_STAGE4_CAPSULE_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "scope":"RECOVERY_CAPSULE_VALID_FOR_PRE_GROWTH_STATE",
            "capsule_manifest_sha256":h(man),
            "checks":checks,
            "g24_allowed":ok,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-stage4-capsule-g23
          path: ${{ runner.temp }}/g23/G23.json
          retention-days: 90
          compression-level: 0

  g24_stage4:
    name: G24 certify recovery capsule only
    needs: g23_stage4
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage4-capsule-g23
          path: ${{ runner.temp }}/g23
      - name: Issue exact-scope Stage4 certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"] if d.get("g24_allowed") else "HOLD")' "$G")" = PASS
          H="$(sha256sum "$G"|awk '{print $1}')"
          M="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["capsule_manifest_sha256"])' "$G")"
          AUD="louksna-r4-part4-stage4-capsule:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H M AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split("."); payload=p[1]+"="*((4-len(p[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={
            "schema":"LOUKSNA_R4_PART4_STAGE4_CAPSULE_G24/1.0",
            "status":"PASS",
            "scope":"RECOVERY_CAPSULE_VALID_FOR_PRE_GROWTH_STATE",
            "g23_sha256":os.environ["H"],
            "capsule_manifest_sha256":os.environ["M"],
            "off_host_verified":True,
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
            "disk_geometry_mutation_authorized":False,
            "filesystem_mutation_authorized":False,
            "certification_propagated":False,
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-stage4-capsule-g24
          path: ${{ runner.temp }}/g24/G24.json
          retention-days: 90
          compression-level: 0

  ingest_stage4:
    name: Ingest Stage4 G24 and build Stage5 candidate
    needs: g24_stage4
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage4-capsule-g24
          path: ${{ runner.temp }}/g24
      - name: Bind certificate and let Maestro advance
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE="$HOME/.local/state/louksna/r4-master-part1-part9"
          EXEC="$STATE/PART_4_P3_HARDENED/EXECUTION.json"
          DIR="$STATE/PART_4_P3_HARDENED"
          install -m 0600 "$RUNNER_TEMP/g24/G24.json" "$DIR/STAGE4_G24.json"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UIDN/bus"
          systemctl --user restart luna-r4-master-part1-part9.service
          for i in $(seq 1 90); do
            if [ -f "$DIR/STAGE5_CANDIDATE.json" ]; then
              STAGE="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("current_stage",0))' "$EXEC")"
              [ "$STAGE" -eq 5 ] && break
            fi
            sleep 2
          done
          test -f "$DIR/STAGE5_CANDIDATE.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"])' "$DIR/STAGE5_CANDIDATE.json")" = CANDIDATE_READY
          OUT="$RUNNER_TEMP/stage5"; mkdir -p "$OUT"
          cp "$DIR/STAGE5_CANDIDATE.json" "$OUT/"
          cp "$DIR/STAGE3_DRYRUN.json" "$OUT/"
          cp "$DIR/STAGE4_CAPSULE/CAPSULE_MANIFEST.json" "$OUT/STAGE4_CAPSULE_MANIFEST.json"
          cp "$EXEC" "$OUT/EXECUTION.json"
          cp "$STATE/MASTER_STATUS.json" "$OUT/MASTER_STATUS.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-stage5-growth-candidate
          path: ${{ runner.temp }}/stage5/
          retention-days: 90
          compression-level: 0

  g23_stage5:
    name: G23 validate exact P3 growth candidate
    needs: ingest_stage4
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage5-growth-candidate
          path: ${{ runner.temp }}/stage5
      - name: Validate exact right-edge extension
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/stage5" "$RUNNER_TEMP/g23/G23.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          p=root/"STAGE5_CANDIDATE.json"; c=json.loads(p.read_text())
          h=lambda x: hashlib.sha256(x.read_bytes()).hexdigest()
          checks={
            "candidate_ready":c.get("status")=="CANDIDATE_READY",
            "scope":c.get("scope")=="P3_TRAILING_END_EXTENSION_CANDIDATE_ONLY",
            "all_candidate_checks":all(c.get("checks",{}).values()),
            "device":c.get("disk")=="/dev/nvme0n1",
            "partition":int(c.get("partition",0))==3,
            "start_immutable":int(c.get("old_start_sector",-1))==int(c.get("target_start_sector",-2))==567296,
            "positive_growth":int(c.get("delta_sectors",0))>0 and int(c.get("delta_bytes",0))>0,
            "end_growth":int(c.get("target_end_sector",0))>int(c.get("old_end_sector",0)),
            "within_gpt":int(c.get("target_end_sector",0))<=int(c.get("gpt_last_usable_sector",-1)),
            "dryrun_bound":c.get("stage3_dryrun_sha256")==h(root/"STAGE3_DRYRUN.json"),
            "capsule_bound":c.get("stage4_capsule_manifest_sha256")==h(root/"STAGE4_CAPSULE_MANIFEST.json"),
            "no_disk_mutation":c.get("disk_mutation_performed") is False,
            "no_fs_mutation":c.get("filesystem_mutation_performed") is False,
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_STAGE5_GROWTH_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "scope":"P3_TRAILING_END_EXTENSION_CANDIDATE_ONLY",
            "candidate_sha256":h(p),
            "checks":checks,
            "g24_allowed":ok,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-stage5-growth-g23
          path: ${{ runner.temp }}/g23/G23.json
          retention-days: 90
          compression-level: 0

  g24_stage6:
    name: G24 authorize exact trailing-end extension only
    needs: g23_stage5
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage5-growth-g23
          path: ${{ runner.temp }}/g23
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage5-growth-candidate
          path: ${{ runner.temp }}/stage5
      - name: Issue microscopic Stage6 certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23.json"
          C="$RUNNER_TEMP/stage5/STAGE5_CANDIDATE.json"
          test "$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["status"] if d.get("g24_allowed") else "HOLD")' "$G")" = PASS
          GH="$(sha256sum "$G"|awk '{print $1}')"
          CH="$(sha256sum "$C"|awk '{print $1}')"
          test "$CH" = "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["candidate_sha256"])' "$G")"
          OLD="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["old_end_sector"])' "$C")"
          NEW="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["target_end_sector"])' "$C")"
          AUD="louksna-r4-part4-stage6-p3:$GH:$CH"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export GH CH OLD NEW AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; p=t.split("."); payload=p[1]+"="*((4-len(p[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={
            "schema":"LOUKSNA_R4_PART4_STAGE6_P3_G24/1.0",
            "status":"PASS",
            "scope":"P3_TRAILING_END_EXTENSION_ONLY",
            "g23_sha256":os.environ["GH"],
            "candidate_sha256":os.environ["CH"],
            "authorized_device":"/dev/nvme0n1",
            "authorized_partition":3,
            "authorized_start_sector":567296,
            "authorized_old_end_sector":int(os.environ["OLD"]),
            "authorized_new_end_sector":int(os.environ["NEW"]),
            "format_authorized":False,
            "shrink_authorized":False,
            "move_start_authorized":False,
            "filesystem_resize_authorized":False,
            "p5_recreation_authorized":False,
            "migration_replay_authorized":False,
            "certification_propagated":False,
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-stage6-p3-g24
          path: ${{ runner.temp }}/g24/G24.json
          retention-days: 90
          compression-level: 0

  ingest_stage6:
    name: Bind G23 G24 and advance Maestro to Stage7 boundary
    needs: g24_stage6
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage5-growth-g23
          path: ${{ runner.temp }}/g23
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-stage6-p3-g24
          path: ${{ runner.temp }}/g24
      - name: Ingest exact gates and prove Stage7 boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE="$HOME/.local/state/louksna/r4-master-part1-part9"
          DIR="$STATE/PART_4_P3_HARDENED"
          EXEC="$DIR/EXECUTION.json"
          install -m 0600 "$RUNNER_TEMP/g23/G23.json" "$DIR/STAGE5_G23.json"
          install -m 0600 "$RUNNER_TEMP/g24/G24.json" "$DIR/STAGE6_G24.json"
          UIDN="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/$UIDN"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$UIDN/bus"
          systemctl --user restart luna-r4-master-part1-part9.service
          for i in $(seq 1 90); do
            STAGE="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("current_stage",0))' "$EXEC" 2>/dev/null || echo 0)"
            LAST="$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d.get("last_completed_stage",0))' "$EXEC" 2>/dev/null || echo 0)"
            [ "$STAGE" -eq 7 ] && [ "$LAST" -ge 6 ] && break
            sleep 2
          done
          OUT="$RUNNER_TEMP/result"; mkdir -p "$OUT"
          cp "$EXEC" "$OUT/EXECUTION.json"
          cp "$STATE/MASTER_STATUS.json" "$OUT/MASTER_STATUS.json"
          cp "$DIR/STAGE5_CANDIDATE.json" "$OUT/"
          cp "$DIR/STAGE5_G23.json" "$OUT/"
          cp "$DIR/STAGE6_G24.json" "$OUT/"
          python3 - "$OUT" <<'PY'
          import datetime as dt,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); e=json.loads((root/"EXECUTION.json").read_text())
          q={
            "schema":"LOUKSNA_R4_PART4_TEN_POINT_STAGE4_6_RESULT/1.0",
            "status":"PASS" if int(e.get("last_completed_stage",0))>=6 and int(e.get("current_stage",0))==7 else "HOLD",
            "last_completed_stage":e.get("last_completed_stage"),
            "current_stage":e.get("current_stage"),
            "next_authorized_action":e.get("next_authorized_action"),
            "disk_mutation_performed":e.get("disk_mutation_performed") is True,
            "filesystem_mutation_performed":e.get("filesystem_mutation_performed") is True,
            "expected_no_disk_mutation_so_far":e.get("disk_mutation_performed") is False,
            "expected_no_fs_mutation_so_far":e.get("filesystem_mutation_performed") is False,
            "observed_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          (root/"RESULT.json").write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if q["status"]!="PASS" or not q["expected_no_disk_mutation_so_far"] or not q["expected_no_fs_mutation_so_far"]:
              raise SystemExit(31)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-ten-point-stage4-6-result
          path: ${{ runner.temp }}/result/
          retention-days: 90
          compression-level: 0
