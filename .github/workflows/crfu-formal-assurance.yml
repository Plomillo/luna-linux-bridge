name: CUSTOSZV9 formal assurance (isolated)

on:
  push:
    branches:
      - "feature/formal-assurance-custoszv9-*"
      - "feature/formal-assurance-custosz9fix-*"
    paths:
      - "formal/crfu/**"
      - "formal/cubical/**"
      - ".github/workflows/crfu-formal-assurance.yml"
      - "docs/crfu-formal-assurance.md"
  pull_request:
    branches:
      - "feature/custoszv9-crfu-20261016"
    paths:
      - "formal/crfu/**"
      - "formal/cubical/**"
      - ".github/workflows/crfu-formal-assurance.yml"
      - "docs/crfu-formal-assurance.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crfu-formal-assurance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  formal-verification:
    name: Agda and Cubical Agda proof checking
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install verified Agda 2.8.0.2 release binary
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/Agda-v2.8.0.2-linux.tar.xz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/agda/agda/releases/download/v2.8.0.2/Agda-v2.8.0.2-linux.tar.xz" \
            --output "$archive"
          echo "2bcf24bb561b1be859bba841e5d67962d1616b3251bc147f878e4f60a2fbd9f7  $archive" | sha256sum --check -
          install_dir="$RUNNER_TEMP/agda-bin"
          mkdir -p "$install_dir" "$RUNNER_TEMP/agda-extract"
          tar -xf "$archive" -C "$RUNNER_TEMP/agda-extract"
          test -x "$RUNNER_TEMP/agda-extract/agda"
          install -m 0755 "$RUNNER_TEMP/agda-extract/agda" "$install_dir/agda"
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/agda" --version | tee "$RUNNER_TEMP/agda-version.txt"
          grep -F "Agda version 2.8.0.2" "$RUNNER_TEMP/agda-version.txt"

      - name: Extract the exact SQLite queue transition table from Python source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 - "custoszv9/crfu/event_queue.py" "evidence/PythonQueueTransitionsGenerated.expected.agda" "evidence/runtime-transition-refinement.json" <<'PY'
          import ast, hashlib, json, pathlib, re, sys
          source_path, agda_out, report_out = map(pathlib.Path, sys.argv[1:])
          source_bytes = source_path.read_bytes()
          source = source_bytes.decode("utf-8")
          tree = ast.parse(source, filename=str(source_path))
          expected_states = [
              "RECEIVED", "PREFLIGHT", "READY", "RUNNING", "WAITING_FOR_EVENT",
              "CHECKPOINTED", "VALIDATING", "RECOVERING", "COMPLETED", "FAILED",
              "BLOCKED", "DENIED",
          ]
          constructors = {
              "RECEIVED": "received", "PREFLIGHT": "preflight", "READY": "ready",
              "RUNNING": "running", "WAITING_FOR_EVENT": "waitingForEvent",
              "CHECKPOINTED": "checkpointed", "VALIDATING": "validating",
              "RECOVERING": "recovering", "COMPLETED": "completed",
              "FAILED": "failed", "BLOCKED": "blocked", "DENIED": "denied",
          }
          def name_is(node, name):
              return isinstance(node, ast.Name) and node.id == name
          assignments = [
              node for node in tree.body
              if isinstance(node, ast.Assign)
              and any(name_is(target, "ALLOWED") for target in node.targets)
          ]
          assert len(assignments) == 1 and isinstance(assignments[0].value, ast.Dict), "ALLOWED_TABLE_NOT_LITERAL"
          allowed_node = assignments[0].value
          table = {}
          edge_rows = []
          for key_node, value_node in zip(allowed_node.keys, allowed_node.values):
              assert isinstance(key_node, ast.Constant) and isinstance(key_node.value, str), "STATE_KEY_NOT_LITERAL"
              state = key_node.value
              assert state not in table, "DUPLICATE_STATE_KEY:" + state
              if isinstance(value_node, ast.Set):
                  targets = []
                  for target_node in value_node.elts:
                      assert isinstance(target_node, ast.Constant) and isinstance(target_node.value, str), "TARGET_NOT_LITERAL:" + state
                      targets.append(target_node.value)
                  assert len(targets) == len(set(targets)), "DUPLICATE_TARGET:" + state
              elif (isinstance(value_node, ast.Call) and name_is(value_node.func, "set")
                    and not value_node.args and not value_node.keywords):
                  targets = []
              else:
                  raise AssertionError("NON_LITERAL_ALLOWED_TARGETS:" + state)
              table[state] = targets
              edge_rows.extend((state, target) for target in targets)
          assert list(table) == expected_states, "RUNTIME_STATE_SET_OR_ORDER_MISMATCH:" + repr(list(table))
          state_set = set(expected_states)
          assert all(target in state_set for targets in table.values() for target in targets), "UNKNOWN_TARGET_STATE"
          assert len(edge_rows) == len(set(edge_rows)), "DUPLICATE_TRANSITION_EDGE"
          assert len(expected_states) * len(expected_states) == 144, "STATE_PAIR_DOMAIN_CHANGED"
          class_node = next((n for n in tree.body if isinstance(n, ast.ClassDef) and n.name == "PersistentMissionQueue"), None)
          assert class_node is not None, "QUEUE_CLASS_MISSING"
          methods = {n.name: n for n in class_node.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef))}
          transition_method = methods.get("transition")
          assert transition_method is not None, "TRANSITION_METHOD_MISSING"
          guard = ast.parse("new_state not in ALLOWED.get(expected_state, set())", mode="eval").body
          assert any(isinstance(n, ast.If) and ast.dump(n.test, include_attributes=False) == ast.dump(guard, include_attributes=False)
                     for n in ast.walk(transition_method)), "RUNTIME_TRANSITION_GUARD_NOT_EXACT"
          transaction_methods = ["submit", "transition", "claim_next_ready", "emit_signal"]
          for method_name in transaction_methods:
              method = methods.get(method_name)
              assert method is not None, "STATE_METHOD_MISSING:" + method_name
              assert any(isinstance(n, ast.Constant) and n.value == "BEGIN IMMEDIATE" for n in ast.walk(method)), (
                  "IMMEDIATE_TRANSACTION_MISSING:" + method_name
              )
          sql_edge_pattern = re.compile(
              r"UPDATE\s+missions\s+SET\s+state='([A-Z_]+)'.*?WHERE\s+mission_id=\?.*?AND\s+state='([A-Z_]+)'",
              re.IGNORECASE,
          )
          static_sql_edges = []
          state_updates_seen = 0
          for method_name, method in methods.items():
              for node in ast.walk(method):
                  if not (isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
                          and node.func.attr == "execute" and node.args
                          and isinstance(node.args[0], ast.Constant) and isinstance(node.args[0].value, str)):
                      continue
                  query = re.sub(r"\s+", " ", node.args[0].value).strip()
                  if not re.match(r"UPDATE\s+missions\s+SET\s+state", query, re.IGNORECASE):
                      continue
                  state_updates_seen += 1
                  if re.search(r"SET\s+state=\?", query, re.IGNORECASE):
                      assert method_name == "transition", "UNMODELED_DYNAMIC_STATE_UPDATE:" + method_name
                      continue
                  match = sql_edge_pattern.search(query)
                  assert match is not None, "UNPARSED_STATIC_STATE_UPDATE:" + query
                  target, source = match.group(1).upper(), match.group(2).upper()
                  assert source in table and target in table, "SQL_UPDATE_UNKNOWN_STATE"
                  assert target in table[source], "SQL_UPDATE_NOT_IN_ALLOWED_TABLE:" + source + "->" + target
                  static_sql_edges.append({"from": source, "to": target})
          assert state_updates_seen >= 4, "STATE_UPDATE_COVERAGE_INCOMPLETE"
          submit_method = methods.get("submit")
          assert submit_method and any(isinstance(n, ast.Constant) and isinstance(n.value, str) and n.value.startswith("INSERT INTO missions(mission_id,task_json,state,updated_at)") for n in ast.walk(submit_method)), "MISSION_INSERT_NOT_BOUND"
          assert any(isinstance(n, ast.Constant) and n.value == "RECEIVED" for n in ast.walk(submit_method)), "INITIAL_STATE_NOT_BOUND"

          # Extract the runtime task schema as syntax, not by importing executable code.
          model_source_path = pathlib.Path("custoszv9/crfu/model.py")
          model_source_bytes = model_source_path.read_bytes()
          model_tree = ast.parse(model_source_bytes.decode("utf-8"), filename=str(model_source_path))
          required_assignments = [
              node for node in model_tree.body
              if isinstance(node, ast.Assign)
              and any(name_is(target, "REQUIRED") for target in node.targets)
          ]
          assert len(required_assignments) == 1 and isinstance(required_assignments[0].value, ast.Tuple), "TASK_REQUIRED_NOT_LITERAL_TUPLE"
          task_fields = []
          for node in required_assignments[0].value.elts:
              assert isinstance(node, ast.Constant) and isinstance(node.value, str) and node.value, "TASK_REQUIRED_FIELD_NOT_LITERAL"
              task_fields.append(node.value)
          assert len(task_fields) == len(set(task_fields)) == 24, "TASK_REQUIRED_FIELD_SET_INVALID"
          task_class = next((n for n in model_tree.body if isinstance(n, ast.ClassDef) and n.name == "TaskContract"), None)
          assert task_class is not None, "TASK_CONTRACT_CLASS_MISSING"
          task_validate = next((n for n in task_class.body if isinstance(n, ast.FunctionDef) and n.name == "validate"), None)
          assert task_validate is not None and any(name_is(n, "REQUIRED") for n in ast.walk(task_validate)), "TASK_VALIDATOR_NOT_BOUND_TO_REQUIRED"

          lines = [
              "{-# OPTIONS --safe --without-K #-}",
              "module PythonQueueTransitionsGenerated where",
              "open import Agda.Builtin.List using (List; []; _∷_)",
              "open import Agda.Builtin.String using (String)",
              "open import RuntimeDerivedQueueModel using (QueueEdge; queueEdge; " + "; ".join(constructors[x] for x in expected_states) + ")",
              "",
              "pythonRequiredTaskFields : List String",
              "pythonRequiredTaskFields =",
          ]
          for index, field in enumerate(task_fields):
              suffix = " ∷" if index + 1 < len(task_fields) else " ∷ []"
              lines.append("  " + json.dumps(field, ensure_ascii=False) + suffix)
          lines.extend([
              "",
              "pythonQueueTransitions : List QueueEdge",
              "pythonQueueTransitions =",
          ])
          for index, (src, dst) in enumerate(edge_rows):
              suffix = " ∷" if index + 1 < len(edge_rows) else " ∷ []"
              lines.append("  queueEdge " + constructors[src] + " " + constructors[dst] + suffix)
          agda_out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          tracked_agda_path = pathlib.Path("formal/crfu/PythonQueueTransitionsGenerated.agda")
          assert tracked_agda_path.is_file(), "CHECKED_IN_GENERATED_FORMAL_MODULE_MISSING"
          extracted_bytes = agda_out.read_bytes()
          tracked_bytes = tracked_agda_path.read_bytes()
          assert extracted_bytes == tracked_bytes, "CHECKED_IN_RUNTIME_DERIVED_MODULE_DIFFERS_FROM_EXACT_PYTHON_SOURCE"
          # Source-level control-flow transcript for the runtime decision paths already modeled in Agda.
          # Every entry preserves function identity, branch kind, exact source position and normalized AST expression.
          targets = [
              ("custoszv9/crfu/model.py", "TaskContract.validate"),
              ("custoszv9/crfu/resources.py", "evaluate_budget"),
              ("custoszv9/crfu/planner.py", "build_plan"),
              ("custoszv9/crfu/anti_paralysis.py", "decide_next_action"),
              ("custoszv9/crfu/anti_paralysis.py", "retry_decision"),
              ("custoszv9/crfu/recovery.py", "verify_restoration"),
              ("custoszv9/crfu/equivalence.py", "validate_equivalence"),
              ("custoszv9/crfu/coordinator.py", "run_bounded_mission"),
              ("custoszv9/crfu/event_queue.py", "PersistentMissionQueue.submit"),
              ("custoszv9/crfu/event_queue.py", "PersistentMissionQueue.transition"),
              ("custoszv9/crfu/event_queue.py", "PersistentMissionQueue.claim_next_ready"),
              ("custoszv9/crfu/event_queue.py", "PersistentMissionQueue.emit_signal"),
              ("custoszv9/crfu/event_queue.py", "PersistentMissionQueue.verify_event_chain"),
              ("custoszv9/crfu/contracts.py", "run_composed_contracts"),
              ("custoszv9/crfu/migration.py", "validate_migration_witness"),
              ("custoszv9/crfu/formal.py", "validate_proof_bundle"),
              ("custoszv9/crfu/gates.py", "evaluate_gate_evidence"),
          ]
          target_set = set(targets)
          discovered = {}
          for py_path in sorted(pathlib.Path("custoszv9/crfu").glob("*.py")):
              module_tree = ast.parse(py_path.read_text(encoding="utf-8"), filename=py_path.as_posix())
              module_name = py_path.as_posix()
              def visit_defs(node, prefix=""):
                  for child in getattr(node, "body", []):
                      if isinstance(child, ast.ClassDef):
                          visit_defs(child, prefix + child.name + ".")
                      elif isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef)):
                          full_name = prefix + child.name
                          key = (module_name, full_name)
                          if key in target_set:
                              discovered[key] = child
                          visit_defs(child, full_name + ".")
              visit_defs(module_tree)
          missing_targets = sorted(f"{p}:{n}" for p, n in target_set if (p, n) not in discovered)
          assert not missing_targets, "MODELED_RUNTIME_FUNCTIONS_MISSING:" + ",".join(missing_targets)

          guard_trace = []
          def trace_block(source_path, qualname, statements):
              for stmt in statements:
                  if isinstance(stmt, ast.If):
                      guard_trace.append(f"{source_path}|{qualname}|IF|{stmt.lineno}:{stmt.col_offset}|{ast.unparse(stmt.test)}")
                      trace_block(source_path, qualname, stmt.body)
                      if stmt.orelse:
                          guard_trace.append(f"{source_path}|{qualname}|ELSE|{stmt.orelse[0].lineno}:{stmt.orelse[0].col_offset}|")
                          trace_block(source_path, qualname, stmt.orelse)
                      guard_trace.append(f"{source_path}|{qualname}|END_IF|{stmt.lineno}:{stmt.col_offset}|")
                  elif isinstance(stmt, (ast.For, ast.AsyncFor)):
                      guard_trace.append(f"{source_path}|{qualname}|FOR|{stmt.lineno}:{stmt.col_offset}|{ast.unparse(stmt.target)} in {ast.unparse(stmt.iter)}")
                      trace_block(source_path, qualname, stmt.body)
                      if stmt.orelse:
                          guard_trace.append(f"{source_path}|{qualname}|ELSE|{stmt.orelse[0].lineno}:{stmt.orelse[0].col_offset}|")
                          trace_block(source_path, qualname, stmt.orelse)
                      guard_trace.append(f"{source_path}|{qualname}|END_FOR|{stmt.lineno}:{stmt.col_offset}|")
                  elif isinstance(stmt, ast.While):
                      guard_trace.append(f"{source_path}|{qualname}|WHILE|{stmt.lineno}:{stmt.col_offset}|{ast.unparse(stmt.test)}")
                      trace_block(source_path, qualname, stmt.body)
                      if stmt.orelse:
                          guard_trace.append(f"{source_path}|{qualname}|ELSE|{stmt.orelse[0].lineno}:{stmt.orelse[0].col_offset}|")
                          trace_block(source_path, qualname, stmt.orelse)
                      guard_trace.append(f"{source_path}|{qualname}|END_WHILE|{stmt.lineno}:{stmt.col_offset}|")
                  elif isinstance(stmt, ast.Try):
                      guard_trace.append(f"{source_path}|{qualname}|TRY|{stmt.lineno}:{stmt.col_offset}|")
                      trace_block(source_path, qualname, stmt.body)
                      for handler in stmt.handlers:
                          exception = ast.unparse(handler.type) if handler.type is not None else "*"
                          guard_trace.append(f"{source_path}|{qualname}|EXCEPT|{handler.lineno}:{handler.col_offset}|{exception}")
                          trace_block(source_path, qualname, handler.body)
                      if stmt.orelse:
                          guard_trace.append(f"{source_path}|{qualname}|TRY_ELSE|{stmt.orelse[0].lineno}:{stmt.orelse[0].col_offset}|")
                          trace_block(source_path, qualname, stmt.orelse)
                      if stmt.finalbody:
                          guard_trace.append(f"{source_path}|{qualname}|FINALLY|{stmt.finalbody[0].lineno}:{stmt.finalbody[0].col_offset}|")
                          trace_block(source_path, qualname, stmt.finalbody)
                      guard_trace.append(f"{source_path}|{qualname}|END_TRY|{stmt.lineno}:{stmt.col_offset}|")
                  elif isinstance(stmt, (ast.With, ast.AsyncWith)):
                      item_text = ", ".join(ast.unparse(x.context_expr) for x in stmt.items)
                      guard_trace.append(f"{source_path}|{qualname}|WITH|{stmt.lineno}:{stmt.col_offset}|{item_text}")
                      trace_block(source_path, qualname, stmt.body)
                      guard_trace.append(f"{source_path}|{qualname}|END_WITH|{stmt.lineno}:{stmt.col_offset}|")
                  elif isinstance(stmt, ast.Match):
                      guard_trace.append(f"{source_path}|{qualname}|MATCH|{stmt.lineno}:{stmt.col_offset}|{ast.unparse(stmt.subject)}")
                      for case in stmt.cases:
                          guard_trace.append(f"{source_path}|{qualname}|CASE|{case.pattern.lineno}:{case.pattern.col_offset}|{ast.unparse(case.pattern)}")
                          trace_block(source_path, qualname, case.body)
                      guard_trace.append(f"{source_path}|{qualname}|END_MATCH|{stmt.lineno}:{stmt.col_offset}|")
                  elif isinstance(stmt, ast.Return):
                      detail = ast.unparse(stmt.value) if stmt.value is not None else "None"
                      guard_trace.append(f"{source_path}|{qualname}|RETURN|{stmt.lineno}:{stmt.col_offset}|{detail}")
                  elif isinstance(stmt, ast.Raise):
                      detail = ast.unparse(stmt.exc) if stmt.exc is not None else "re-raise"
                      guard_trace.append(f"{source_path}|{qualname}|RAISE|{stmt.lineno}:{stmt.col_offset}|{detail}")
                  elif isinstance(stmt, ast.Assert):
                      guard_trace.append(f"{source_path}|{qualname}|ASSERT|{stmt.lineno}:{stmt.col_offset}|{ast.unparse(stmt.test)}")
          for source_path, qualname in targets:
              node = discovered[(source_path, qualname)]
              guard_trace.append(f"{source_path}|{qualname}|FUNCTION|{node.lineno}:{node.col_offset}|")
              trace_block(source_path, qualname, node.body)
              guard_trace.append(f"{source_path}|{qualname}|END_FUNCTION|{node.end_lineno}:{node.end_col_offset}|")
          assert len(guard_trace) > 0, "RUNTIME_GUARD_TRACE_EMPTY"
          trace_lines = [
              "{-# OPTIONS --safe --without-K #-}",
              "module PythonRuntimeGuardTraceGenerated where",
              "open import Agda.Builtin.List using (List; []; _∷_)",
              "open import Agda.Builtin.String using (String)",
              "",
              "pythonRuntimeGuardTrace : List String",
              "pythonRuntimeGuardTrace =",
          ]
          for index, entry in enumerate(guard_trace):
              trace_lines.append("  " + json.dumps(entry, ensure_ascii=True) + (" ∷" if index + 1 < len(guard_trace) else " ∷ []"))
          trace_agda = "\n".join(trace_lines) + "\n"
          trace_path = pathlib.Path("evidence/PythonRuntimeGuardTrace.expected.agda")
          trace_path.write_text(trace_agda, encoding="utf-8")
          tracked_trace_path = pathlib.Path("formal/crfu/PythonRuntimeGuardTraceGenerated.agda")
          assert tracked_trace_path.is_file(), "CHECKED_IN_RUNTIME_GUARD_TRACE_MISSING"
          tracked_trace_bytes = tracked_trace_path.read_bytes()
          if tracked_trace_bytes != trace_path.read_bytes():
              print("RUNTIME_GUARD_TRACE_REPORT_BEGIN")
              print(json.dumps({"target_function_count": len(targets), "trace_entry_count": len(guard_trace),
                                "source_guard_trace_sha256": hashlib.sha256(trace_path.read_bytes()).hexdigest()}, indent=2))
              print("RUNTIME_GUARD_TRACE_REPORT_END")
              print("RUNTIME_GUARD_TRACE_AGDA_BEGIN")
              print(trace_agda)
              print("RUNTIME_GUARD_TRACE_AGDA_END")
              raise AssertionError("CHECKED_IN_RUNTIME_GUARD_TRACE_DIFFERS_FROM_PYTHON_AST")
          trace_report = {
              "schema": "CRFU_RUNTIME_GUARD_TRACE/1.0",
              "status": "SOURCE_TRACE_MATCH_PASS",
              "target_function_count": len(targets),
              "trace_entry_count": len(guard_trace),
              "target_functions": [f"{p}:{n}" for p, n in targets],
              "source_guard_trace_sha256": hashlib.sha256(trace_path.read_bytes()).hexdigest(),
              "tracked_guard_trace_sha256": hashlib.sha256(tracked_trace_bytes).hexdigest(),
              "matched_byte_for_byte": True,
          }
          pathlib.Path("evidence/runtime-guard-trace-report.json").write_text(
              json.dumps(trace_report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print("RUNTIME_GUARD_TRACE_REPORT_BEGIN")
          print(json.dumps(trace_report, sort_keys=True, indent=2))
          print("RUNTIME_GUARD_TRACE_REPORT_END")
          print("RUNTIME_GUARD_TRACE_AGDA_BEGIN")
          print(trace_agda)
          print("RUNTIME_GUARD_TRACE_AGDA_END")

          report = {
              "schema": "CRFU_RUNTIME_REFINEMENT_EVIDENCE/1.0",
              "status": "SOURCE_EXTRACTION_PASS",
              "runtime_source_path": source_path.as_posix(),
              "runtime_source_sha256": hashlib.sha256(source_bytes).hexdigest(),
              "runtime_source_size_bytes": len(source_bytes),
              "runtime_guard_trace_report": trace_report,
              "runtime_guard_trace_target_functions": [f"{p}:{n}" for p, n in targets],
              "runtime_guard_trace_entry_count": len(guard_trace),
              "runtime_guard_trace_source_sha256": trace_report["source_guard_trace_sha256"],
              "task_model_source_path": model_source_path.as_posix(),
              "task_model_source_sha256": hashlib.sha256(model_source_bytes).hexdigest(),
              "task_model_source_size_bytes": len(model_source_bytes),
              "task_required_field_count": len(task_fields),
              "task_required_field_order": task_fields,
              "state_count": len(expected_states),
              "state_pair_domain_size": len(expected_states) ** 2,
              "allowed_transition_count": len(edge_rows),
              "forbidden_transition_count": len(expected_states) ** 2 - len(edge_rows),
              "static_sql_state_updates": static_sql_edges,
              "transaction_methods_checked": transaction_methods,
              "runtime_transition_guard_ast_checked": True,
              "generated_agda_module_sha256": hashlib.sha256(extracted_bytes).hexdigest(),
              "checked_in_agda_module_sha256": hashlib.sha256(tracked_bytes).hexdigest(),
              "checked_in_generated_module_matches_runtime_extraction": True,
              "agda_proof_status": "PENDING_MODEL_EQUALITY_THEOREM",
              "claim_boundary": "Finite queue transition relation only; no universal claim about all Python callbacks or all SQLite failure modes.",
          }
          report_out.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True, indent=2))
          PY

      - name: Type-check every first-order CRFU module and soundness lemma
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          : > evidence/agda-first-order.log
          for source in formal/crfu/*.agda; do
            echo "===== $source =====" | tee -a evidence/agda-first-order.log
            agda --safe --without-K -i formal/crfu -i evidence "$source" 2>&1 | tee -a evidence/agda-first-order.log
          done

      - name: Finalize runtime refinement evidence only when the theorem is present
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib
          report_path = pathlib.Path("evidence/runtime-transition-refinement.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          proof_source = pathlib.Path("formal/crfu/RuntimeDerivedCorrespondence.agda").read_text(encoding="utf-8")
          theorems = [
              "sqlite-queue-transition-table-refines-exact-python-runtime",
              "python-task-required-fields-refine-exact-python-runtime",
          ]
          checked = [name for name in theorems if name in proof_source]
          report["agda_theorems_present"] = checked
          if len(checked) == len(theorems):
              report["agda_proof_status"] = "TYPECHECKED_DEFINITIONAL_EQUALITY"
              report["agda_theorems"] = checked
              report["status"] = "PASS"
          else:
              report["agda_proof_status"] = "PENDING_MODEL_EQUALITY_THEOREM"
              report["missing_agda_theorems"] = [name for name in theorems if name not in checked]
          report_path.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(report, sort_keys=True, indent=2))
          PY

      - name: Download pinned Cubical Agda v0.9 release and verify SHA-256
        shell: bash
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/cubical-0.9.tar.gz"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            "https://github.com/agda/cubical/releases/download/v0.9/cubical-0.9.tar.gz" \
            --output "$archive"
          echo "003f9c57c134e4a9401a4b339b3773be667aa169ff929ca3dfb9c8abefc225c5  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/cubical"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/cubical"
          test -f "$RUNNER_TEMP/cubical/Cubical/Foundations/Univalence.agda"

      - name: Type-check the Cubical Agda univalence interface
        shell: bash
        run: |
          set -Eeuo pipefail
          agda --cubical --safe --guardedness -i "$RUNNER_TEMP/cubical" -i formal/cubical \
            formal/cubical/CRFUUnivalenceBridge.agda 2>&1 | tee evidence/agda-cubical.log

      - name: Produce source-bound formal assurance report
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(".")
          files = sorted(
              p for folder in ("formal/crfu", "formal/cubical")
              for p in (root / folder).glob("*.agda")
          )
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          source_items = [{"path": str(p), "bytes": p.stat().st_size, "sha256": sha(p)} for p in files]
          runtime_refinement = json.loads(pathlib.Path("evidence/runtime-transition-refinement.json").read_text(encoding="utf-8"))
          package_sha = "667ceac7d7e59682292c864777ec3e1c228074716dc5dba17fe150e4d826ccf3"
          report = {
              "schema": "CRFU_FORMAL_ASSURANCE_EVIDENCE/1.0",
              "result": "PASS_TYPECHECKED_DECLARED_FORMAL_SCOPE",
              "formal_source_commit": os.environ["GITHUB_SHA"],
              "baseline_candidate_commit": "badd87ddee1a2a00cfcb9b1b54df139cdeda8a59",
              "baseline_CUSTOSZV9_pyz_sha256": package_sha,
              "agda_release": "2.8.0.2",
              "agda_linux_archive_sha256": "2bcf24bb561b1be859bba841e5d67962d1616b3251bc147f878e4f60a2fbd9f7",
              "cubical_agda_release": "v0.9",
              "cubical_archive_sha256": "003f9c57c134e4a9401a4b339b3773be667aa169ff929ca3dfb9c8abefc225c5",
              "source_files": source_items,
              "runtime_transition_refinement": runtime_refinement,
              "checks": [
                "runtime PersistentMissionQueue state-transition table extracted from exact Python source and compared by an Agda definitional-equality theorem when present",
                "all formal/crfu/*.agda files typechecked using --safe --without-K",
                "formal/cubical/CRFUUnivalenceBridge.agda typechecked using --cubical --safe --guardedness",
                "Agda official Linux binary archive SHA-256 verified before use",
                "Cubical Agda official release archive SHA-256 verified before use"
              ],
              "limitations": [
                "This report is evidence for the listed formal source files only.",
                "Typechecking the model is not by itself a proof that the Python runtime implements every model.",
                "The generated Agda equality theorem proves only that the finite SQLite queue transition table matches the exact source-extracted Python ALLOWED relation; it does not prove all runtime functions, arbitrary callbacks, or all database-failure behavior.",
                "The Cubical module checks the equivalence-to-path interface; it does not prove global Louksna correctness or implementation correspondence.",
                "No prior CUSTOSZV9 package, G22/G23/G24 certificate, or attestation is modified by this workflow."
              ]
          }
          out = pathlib.Path("evidence/formal-assurance-report.json")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          pathlib.Path("evidence/formal-source-manifest.json").write_text(
              json.dumps({"schema":"CRFU_FORMAL_SOURCE_MANIFEST/1.0","files":source_items},sort_keys=True,indent=2)+"\n",
              encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Upload type-check logs and source-bound report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CRFU-formal-assurance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            evidence/agda-first-order.log
            evidence/agda-cubical.log
            evidence/formal-assurance-report.json
            evidence/formal-source-manifest.json
            evidence/runtime-transition-refinement.json
            evidence/runtime-guard-trace-report.json
            evidence/PythonRuntimeGuardTrace.expected.agda
            evidence/PythonQueueTransitionsGenerated.expected.agda
            formal/crfu/
            formal/cubical/
          if-no-files-found: error
          retention-days: 90
