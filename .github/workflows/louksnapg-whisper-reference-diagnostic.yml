name: LOUKSNAPG — isolated Whisper reference diagnostic

on:
  push:
    branches:
      - louksnapg/phase4-resume-20261028
    paths:
      - tools/louksnapg_reference_whisper_diagnostic.py
      - .github/workflows/louksnapg-whisper-reference-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louksnapg-whisper-reference-diagnostic
  cancel-in-progress: false

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"
  PYTHONNOUSERSITE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_ENABLE_HF_TRANSFER: "0"

jobs:
  whisper-reference:
    name: "Pinned upstream Whisper / known-speech comparison"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Compile-check reference diagnostic without executing inference
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path
          name = "tools/louksnapg_reference_whisper_diagnostic.py"
          compile(Path(name).read_text(encoding="utf-8"), name, "exec")
          print("WHISPER_REFERENCE_DIAGNOSTIC_SYNTAX=PASS")
          PY

      - name: Install a single-threaded known-speech fixture generator
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends espeak-ng

      - name: Install pinned CPU-only reference inference dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "torch==2.7.1" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check             "transformers==4.55.4"             "huggingface_hub==0.35.3"             "safetensors==0.6.2"             "soundfile==0.13.1"             "scipy==1.16.2"             "sentencepiece==0.2.1"             "numpy==2.2.6"

      - name: Run pinned upstream Whisper comparison on known speech
        id: diagnostic
        shell: bash
        env:
          HF_HOME: ${{ runner.temp }}/whisper-reference/hf-home
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/whisper-reference/evidence" "$RUNNER_TEMP/whisper-reference/work"
          python -B tools/louksnapg_reference_whisper_diagnostic.py             --output "$RUNNER_TEMP/whisper-reference/evidence/LOUKSNAPG_WHISPER_REFERENCE_DIAGNOSTIC.json"             --work-dir "$RUNNER_TEMP/whisper-reference/work"

      - name: Preserve reference-only evidence (not a product certification)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-whisper-reference-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/whisper-reference/evidence/
          if-no-files-found: warn
          retention-days: 90
