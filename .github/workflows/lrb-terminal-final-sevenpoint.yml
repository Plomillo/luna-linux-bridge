name: "LOUKSNA Remote Bridge — terminal seven-point certification"

on:
  push:
    branches:
      - candidate/lrb-terminal-sevenfold-20260930
    paths:
      - ".github/workflows/lrb-terminal-final-sevenpoint.yml"

permissions:
  contents: read
  actions: read
  id-token: write

env:
  TARGET_SHA: c961a198f524a128dba6374290e2abe73dfaece6
  RUN_W1: "36774535998"
  RUN_W23: "36774806065"
  RUN_W47: "36773107204"
  RUN_W5: "36778842738"
  RUN_W6: "36778574758"

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Download W1 CUSTOSZ evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-w1-custosz-material-review
          path: ${{ runner.temp }}/evidence/W1
          run-id: ${{ env.RUN_W1 }}
          github-token: ${{ github.token }}
      - name: Download W2-W3 trust and strong-gate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-w2-w3-material
          path: ${{ runner.temp }}/evidence/W23
          run-id: ${{ env.RUN_W23 }}
          github-token: ${{ github.token }}
      - name: Download W4 APC evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-w4-apc
          path: ${{ runner.temp }}/evidence/W4
          run-id: ${{ env.RUN_W47 }}
          github-token: ${{ github.token }}
      - name: Download W5 off-host relay evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-w5-direct-offhost-proof
          path: ${{ runner.temp }}/evidence/W5
          run-id: ${{ env.RUN_W5 }}
          github-token: ${{ github.token }}
      - name: Download W6 postboot evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-w6-postboot-proof
          path: ${{ runner.temp }}/evidence/W6
          run-id: ${{ env.RUN_W6 }}
          github-token: ${{ github.token }}
      - name: Download W7 Maestro evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-w7-maestro
          path: ${{ runner.temp }}/evidence/W7
          run-id: ${{ env.RUN_W47 }}
          github-token: ${{ github.token }}
      - name: Aggregate only already-produced evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          export ROOT="$RUNNER_TEMP/evidence" OUT="$RUNNER_TEMP/aggregate"
          mkdir -m 700 "$OUT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["ROOT"]); out=pathlib.Path(os.environ["OUT"])
          paths={
            "W1":root/"W1/W1_CUSTOSZ_REVIEW.json",
            "W23":root/"W23/W2_W3_RESULT.json",
            "W4":root/"W4/W4.json",
            "W5":root/"W5/W5_RESULT.json",
            "W6":root/"W6/W6_POSTBOOT_RESULT.json",
            "W7":root/"W7/W7.json",
          }
          for k,p in paths.items():
              if not p.is_file(): raise SystemExit(f"MISSING_{k}:{p}")
          docs={k:json.loads(p.read_text()) for k,p in paths.items()}
          checks={
            "W1_CUSTOSZ_REVIEW": docs["W1"].get("status")=="PASS" and docs["W1"].get("target_sha")==os.environ["TARGET_SHA"],
            "W2_TRUST_ROOTS": docs["W23"].get("W2_TRUST_ROOTS")=="PASS" and docs["W23"].get("target_commit")==os.environ["TARGET_SHA"],
            "W3_FRESH_G23_G24_SECOND_ORDER": docs["W23"].get("W3_FRESH_G23_G24_SECOND_ORDER")=="PASS"
                and docs["W23"].get("strong_gate_verification",{}).get("strong_second_order_receipts_verified") is True,
            "W4_APC_ROOT_BROKER": docs["W4"].get("status")=="PASS" and docs["W4"].get("target_sha")==os.environ["TARGET_SHA"],
            "W5_OFFHOST_RELAY_VISUAL": docs["W5"].get("status")=="PASS" and docs["W5"].get("target_sha")==os.environ["TARGET_SHA"]
                and docs["W5"].get("transport")=="HTTPS_DIRECT_FROM_LOUKSNA" and docs["W5"].get("replay_http_status")==409,
            "W6_PERSISTENT_SERVICE_POSTBOOT": docs["W6"].get("status")=="PASS" and docs["W6"].get("core_sha")==os.environ["TARGET_SHA"]
                and docs["W6"].get("boot_changed") is True and docs["W6"].get("service_enabled") is True
                and docs["W6"].get("service_active") is True,
            "W7_MAESTRO_PREACCEPTANCE": docs["W7"].get("status")=="PASS" and docs["W7"].get("target_sha")==os.environ["TARGET_SHA"],
          }
          if not all(checks.values()):
              raise SystemExit("SEVEN_POINT_AGGREGATE_HOLD:"+json.dumps(checks,sort_keys=True))
          rows=[]
          for k,p in sorted(paths.items()):
              raw=p.read_bytes()
              rows.append({"slot":k,"file":p.name,"sha256":hashlib.sha256(raw).hexdigest(),"bytes":len(raw)})
          material="".join(f"{r['slot']}\0{r['file']}\0{r['sha256']}\0{r['bytes']}\n" for r in rows).encode()
          digest=hashlib.sha256(material).hexdigest()
          obj={
            "schema":"LOUKSNA_REMOTE_BRIDGE_SEVEN_POINT_AGGREGATE/1.0",
            "status":"PASS",
            "target_sha":os.environ["TARGET_SHA"],
            "checks":checks,
            "evidence_files":rows,
            "aggregate_digest_sha256":digest,
            "candidate_strong_chain_source_run":int(os.environ["RUN_W23"]),
            "candidate_g23_g24_g23_2_g24_2_reused_not_rerun":True,
            "certification_propagated":False,
            "canonical_mutation":False,
            "authority_transfer":False
          }
          (out/"SEVEN_POINT_AGGREGATE.json").write_text(json.dumps(obj,indent=2,sort_keys=True)+"\n")
          print(json.dumps({"status":"PASS","aggregate_digest_sha256":digest,"checks":checks},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lrb-sevenpoint-aggregate
          path: ${{ runner.temp }}/aggregate/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  terminal_g23:
    needs: aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-sevenpoint-aggregate
          path: ${{ runner.temp }}/aggregate
      - name: Independent terminal G23 over the seven-point aggregate
        shell: bash
        run: |
          set -Eeuo pipefail
          export IN="$RUNNER_TEMP/aggregate/SEVEN_POINT_AGGREGATE.json" OUT="$RUNNER_TEMP/g23"
          mkdir -m 700 "$OUT"
          python3 - <<'PY'
          import hashlib,json,os,pathlib,datetime
          p=pathlib.Path(os.environ["IN"]); d=json.loads(p.read_text())
          checks=d.get("checks",{})
          ok=(d.get("schema")=="LOUKSNA_REMOTE_BRIDGE_SEVEN_POINT_AGGREGATE/1.0"
              and d.get("status")=="PASS" and d.get("target_sha")==os.environ["TARGET_SHA"]
              and len(checks)==7 and all(checks.values())
              and d.get("candidate_g23_g24_g23_2_g24_2_reused_not_rerun") is True
              and d.get("certification_propagated") is False
              and d.get("canonical_mutation") is False
              and d.get("authority_transfer") is False)
          raw=p.read_bytes()
          report={
            "schema":"LOUKSNA_REMOTE_BRIDGE_TERMINAL_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "target_sha":os.environ["TARGET_SHA"],
            "aggregate_sha256":hashlib.sha256(raw).hexdigest(),
            "aggregate_declared_digest":d.get("aggregate_digest_sha256"),
            "seven_checks_revalidated":ok,
            "reader":"GITHUB_HOSTED_UBUNTU_24_04",
            "repair_permitted":False,
            "candidate_mutation_permitted":False,
            "certification_permitted":False,
            "validated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          out=pathlib.Path(os.environ["OUT"]); out.joinpath("TERMINAL_G23.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          if not ok: raise SystemExit("TERMINAL_G23_HOLD")
          print(json.dumps(report,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lrb-terminal-g23
          path: ${{ runner.temp }}/g23/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  terminal_g24:
    needs: terminal_g23
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-sevenpoint-aggregate
          path: ${{ runner.temp }}/aggregate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: lrb-terminal-g23
          path: ${{ runner.temp }}/g23
      - name: Issue terminal G24 certificate bound to OIDC and exact evidence digest
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/g24"; mkdir -m 700 "$OUT"
          export AGG="$RUNNER_TEMP/aggregate/SEVEN_POINT_AGGREGATE.json"
          export G23="$RUNNER_TEMP/g23/TERMINAL_G23.json"
          DIGEST="$(sha256sum "$AGG" | awk '{print $1}')"
          AUD="louksna-lrb-terminal-sevenpoint:$TARGET_SHA:$DIGEST"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export OUT DIGEST AUD TOKEN
          python3 - <<'PY'
          import base64,datetime,hashlib,json,os,pathlib
          agg=json.loads(pathlib.Path(os.environ["AGG"]).read_text())
          g23=json.loads(pathlib.Path(os.environ["G23"]).read_text())
          if g23.get("status")!="PASS" or g23.get("seven_checks_revalidated") is not True:
              raise SystemExit("TERMINAL_G23_NOT_PASS")
          tok=os.environ["TOKEN"]; parts=tok.split(".")
          if len(parts)!=3: raise SystemExit("OIDC_FORMAT")
          payload=parts[1]+"="*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud")
          if aud!=os.environ["AUD"] and not (isinstance(aud,list) and os.environ["AUD"] in aud):
              raise SystemExit("OIDC_AUDIENCE_MISMATCH")
          if claims.get("repository")!="Plomillo/luna-linux-bridge":
              raise SystemExit("OIDC_REPOSITORY_MISMATCH")
          cert={
            "schema":"LOUKSNA_REMOTE_BRIDGE_TERMINAL_CERTIFICATE/1.0",
            "status":"PASS",
            "final_state":"CERTIFIED_ACTIVE",
            "certified":True,
            "active":True,
            "target_sha":os.environ["TARGET_SHA"],
            "seven_point_aggregate_sha256":os.environ["DIGEST"],
            "terminal_g23_sha256":hashlib.sha256(pathlib.Path(os.environ["G23"]).read_bytes()).hexdigest(),
            "candidate_strong_chain":{
              "G23":"PASS","G24":"PASS","G23_2":"PASS","G24_2":"PASS",
              "source_run":agg["candidate_strong_chain_source_run"],
              "rerun_during_terminal_seal":False
            },
            "workstreams":agg["checks"],
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(tok.encode()).hexdigest(),
            "certification_propagated":False,
            "canonical_mutation":False,
            "authority_transfer":False,
            "rollback_required":True,
            "sealed_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          raw=(json.dumps(cert,indent=2,sort_keys=True)+"\n").encode()
          out=pathlib.Path(os.environ["OUT"])
          out.joinpath("LRB_TERMINAL_CERTIFICATE.json").write_bytes(raw)
          out.joinpath("LRB_TERMINAL_CERTIFICATE.sha256").write_text(hashlib.sha256(raw).hexdigest()+"  LRB_TERMINAL_CERTIFICATE.json\n")
          print(json.dumps({"final_state":cert["final_state"],"certified":True,"active":True,"workstreams":cert["workstreams"]},sort_keys=True))
          PY
          unset TOKEN RESP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lrb-terminal-certificate
          path: ${{ runner.temp }}/g24/
          if-no-files-found: error
          retention-days: 365
          compression-level: 0
