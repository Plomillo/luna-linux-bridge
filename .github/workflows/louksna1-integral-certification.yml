name: Louksna1 integral certification assessment

on:
  push:
    branches: [main]
    paths:
      - "LOUKSNAMEJORADA.md"
      - "Louksna1.md"
      - "cajita-luna-runtime/2. Orquestación/Multi + Interdisciplinar/**"
      - "cajita-luna-runtime/cajita_externalized_packaging.py"
      - "cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json"
      - "docs/cajita-luna/LOUKSNA1_RELEASE_MANIFEST.json"
      - "tools/cajita_axiom_graph_audit.py"
      - "tests/test_cajita_axiom_graph_audit.py"
      - ".github/workflows/louksna1-integral-certification.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Cajita V9 materialization and Louksna1 governed factory"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: louksna1-integral-certification-main
  cancel-in-progress: false

jobs:
  graph-audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout source and candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Java for the packaged Apache Jena runtime
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install extractor for the registered Apache Jena container
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full
          command -v 7z

      - name: Verify audit script syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/cajita_axiom_graph_audit.py tests/test_cajita_axiom_graph_audit.py
          PYTHONPATH=tools:cajita-luna-runtime python -m unittest discover -s tests -p 'test_cajita_axiom_graph_audit.py' -v

      - name: Materialize source-bound RDF and execute Apache Jena
        env:
          LOUKSNA_FACTORY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          LOUKSNA_FACTORY_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/cajita_axiom_graph_audit.py \
            --source LOUKSNAMEJORADA.md \
            --companion Louksna1.md \
            --manifest docs/cajita-luna/LOUKSNA1_RELEASE_MANIFEST.json \
            --runtime cajita-luna-runtime \
            --output out/louksna1-integral-certification \
            | tee "$RUNNER_TEMP/louksna1-integral-certification.log"

      - name: Upload graph and assessment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: louksna1-integral-certification-assessment
          path: |
            out/louksna1-integral-certification/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Write certification scope summary
        if: always()
        shell: bash
        run: |
          {
            echo "# Louksna1 integral certification assessment"
            echo
            echo "- This job verifies the 10,000 materialized axiom rows and runs Apache Jena RIOT + SPARQL over a source-bound RDF provenance graph."
            echo "- This is a structural graph-execution result, not a semantic proof or global certificate."
            echo "- Global certification remains NOT_GRANTED until all registered task adapters, semantic-quality baselines and full-runtime evidence pass."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist source-bound assessment after a successful factory release
        if: success() && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        shell: bash
        run: |
          set -euo pipefail
          report="out/louksna1-integral-certification/LOUKSNA1_INTEGRAL_CERTIFICATION_ASSESSMENT.json"
          target="docs/cajita-luna/LOUKSNA1_INTEGRAL_CERTIFICATION_ASSESSMENT.json"
          test -s "$report"
          mkdir -p docs/cajita-luna
          # A fresh timestamp must not create a new commit when all source-bound
          # assessment evidence is unchanged; concurrent workflows otherwise race
          # while rewriting this same report on main.
          if [ -e "$target" ]; then
            if [ -L "$target" ] || [ ! -f "$target" ]; then
              echo "ASSESSMENT_TARGET_NOT_REGULAR_FILE_FAIL_CLOSED" >&2
              exit 1
            fi
            set +e
            python - "$report" "$target" <<'PY'
          import json
          import sys
          from pathlib import Path
          try:
              incoming = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              existing = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          except Exception as exc:
              print("ASSESSMENT_JSON_COMPARISON_INVALID:" + type(exc).__name__, file=sys.stderr)
              sys.exit(2)
          incoming.pop("generated_at_utc", None)
          existing.pop("generated_at_utc", None)
          sys.exit(0 if incoming == existing else 1)
          PY
            compare_rc=$?
            set -e
            if [ "$compare_rc" -eq 0 ]; then
              echo "ASSESSMENT_EVIDENCE_UNCHANGED_SUBSTANTIVE_FIELDS"
              exit 0
            elif [ "$compare_rc" -ne 1 ]; then
              echo "ASSESSMENT_COMPARISON_INVALID_FAIL_CLOSED" >&2
              exit "$compare_rc"
            fi
          fi
          cp "$report" "$target"
          git diff --check
          git add "$target"
          if git diff --cached --quiet; then
            echo "ASSESSMENT_EVIDENCE_UNCHANGED"
          else
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Record source-bound Louksna1 integral certification assessment"
            # Evidence commits can race with other governed writers. Rebase only
            # onto the latest main; any same-file conflict aborts instead of
            # silently replacing a newer source-bound assessment.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "ASSESSMENT_PERSISTENCE_REBASE_CONFLICT_FAIL_CLOSED" >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "ASSESSMENT_PERSISTENCE_PUSH=PASS attempt=$attempt"
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "ASSESSMENT_PERSISTENCE_NON_FAST_FORWARD_RETRIES_EXHAUSTED" >&2
                exit 1
              fi
              echo "ASSESSMENT_PERSISTENCE_RETRY=$attempt" >&2
            done
          fi
