name: LOUKSNAPG semantic quality gate

on:
  pull_request:
    paths:
      - "tools/louksnapg_model_quality_gate.py"
      - "tests/test_louksnapg_model_quality_gate.py"
      - ".github/workflows/louksnapg-model-quality-gate.yml"
  push:
    branches:
      - "work/louksnapg-semantic-quality-gate-20261027"
    paths:
      - "tools/louksnapg_model_quality_gate.py"
      - "tests/test_louksnapg_model_quality_gate.py"
      - ".github/workflows/louksnapg-model-quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fail-closed quality gate tests
        run: python -m unittest discover -s tests -p "test_louksnapg_model_quality_gate.py" -v
