name: "R4 PART4 R2 — ntfsresize diagnostic"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-r2-ntfs-diagnostic/**

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Capture unmounted ntfsresize diagnostic and restore mount
        shell: bash
        run: |
          set -Eeuo pipefail
          WINROOT=/media/diegoignacionorambuenamiranda/Windows
          P3=/dev/nvme0n1p3
          echo "HOST=$(hostname)"
          echo "USER=$(id -un)"
          echo "--- BEFORE ---"
          findmnt -T "$WINROOT" -o SOURCE,FSTYPE,OPTIONS,TARGET
          sudo -n /usr/sbin/blkid -p "$P3"

          NEED_REMOUNT=0
          restore(){
            rc=$?
            if [ "$NEED_REMOUNT" -eq 1 ]; then
              sudo -n mount "$WINROOT" || true
            fi
            exit "$rc"
          }
          trap restore EXIT

          sudo -n umount "$WINROOT"
          NEED_REMOUNT=1
          echo "--- UNMOUNTED ---"
          if findmnt -S "$P3"; then
            echo "ERROR:P3_STILL_MOUNTED"
            exit 31
          fi

          echo "--- NTFSRESIZE INFO WHILE UNMOUNTED ---"
          set +e
          LC_ALL=C sudo -n ntfsresize --info --force "$P3" 2>&1
          rc=$?
          set -e
          echo "NTFSRESIZE_RC=$rc"

          sudo -n mount "$WINROOT"
          NEED_REMOUNT=0
          trap - EXIT

          echo "--- AFTER REMOUNT ---"
          findmnt -T "$WINROOT" -o SOURCE,FSTYPE,OPTIONS,TARGET
          sudo -n /usr/sbin/blkid -p "$P3"
          test -d "$WINROOT/PROYECTOS"
          exit "$rc"
