name: "SUPER1200 — explicit continuation worker"
on:
  workflow_dispatch:
    inputs:
      transition_id:
        required: true
        type: string
      next_point:
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: super1200-continuation-worker-${{ inputs.transition_id }}
  cancel-in-progress: true
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          fetch-depth: 0
          persist-credentials: true
      - name: Execute registered domain worker
        env:
          NEXT_POINT: ${{ inputs.next_point }}
          TARGET_ROOT: ${{ github.workspace }}
          CAP_ROOT: ${{ github.workspace }}
          OUT_DIR: ${{ runner.temp }}/super1200-continuation
        run: |
          set -Eeuo pipefail
          python3 -B continuity/super1200_continuation_worker.py
      - name: Persist continuation evidence
        if: always()
        run: |
          set -Eeuo pipefail
          git add continuity
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git commit -m "evidence(super1200): persist continuation checkpoint"
          git push origin HEAD:custosz/super-1200-implementation-20261007
