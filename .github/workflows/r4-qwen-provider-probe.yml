name: "R4 — Qwen reasoning provider operational probe"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-qwen-provider-probe.yml
      - mission-control/r4-qwen-provider-probe/**

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Invoke a Qwen model through GitHub Models using LRB-only evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          catalog="$(mktemp)"
          response="$(mktemp)"
          payload="$(mktemp)"
          trap 'rm -f "$catalog" "$response" "$payload"' EXIT

          cat_code="$(curl --location --silent --show-error             --output "$catalog" --write-out '%{http_code}'             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GITHUB_TOKEN"             -H "X-GitHub-Api-Version: 2026-03-10"             https://models.github.ai/catalog/models)"

          echo "SCHEMA=LOUKSNA_R4_QWEN_PROVIDER_OPERATIONAL/2.0"
          echo "CATALOG_HTTP=$cat_code"
          [ "$cat_code" = "200" ] || { echo "GITHUB_MODELS_QWEN=HOLD"; exit 1; }

          mapfile -t qwen_models < <(
            jq -r 'if type=="array" then . else (.models // .data // []) end
                   | .[] | (.id // .name // empty)' "$catalog"             | grep -i 'qwen' || true
          )
          [ "${#qwen_models[@]}" -gt 0 ] || {
            echo "QWEN_MODELS_FOUND=0"
            echo "GITHUB_MODELS_QWEN=HOLD"
            exit 1
          }

          selected="$(printf '%s\n' "${qwen_models[@]}" | grep -Ei 'thinking|reason' | head -n 1 || true)"
          [ -n "$selected" ] || selected="${qwen_models[0]}"
          echo "QWEN_MODELS_FOUND=${#qwen_models[@]}"
          echo "SELECTED_MODEL=$selected"

          jq -n --arg model "$selected" '{
            model:$model,
            messages:[
              {
                role:"system",
                content:"You are the swappable reasoning-only brain for LOUKSNA. You receive only LOUKSNA Remote Bridge evidence through GitHub. You have no host or material execution authority. Return a compact JSON decision envelope only."
              },
              {
                role:"user",
                content:"LRB_EVIDENCE={\"schema\":\"LOUKSNA_REMOTE_BRIDGE_EVIDENCE/1.0\",\"host_material_access\":false,\"partitioning\":false,\"observation\":\"services nominal\"}. Decide whether this evidence authorizes a reasoning-only PASS. Do not request or perform host actions."
              }
            ],
            temperature:0,
            max_tokens:96
          }' > "$payload"

          infer_code="$(curl --location --silent --show-error             --output "$response" --write-out '%{http_code}'             -H "Content-Type: application/json"             -H "Accept: application/json"             -H "Authorization: Bearer $GITHUB_TOKEN"             https://models.github.ai/inference/chat/completions             --data-binary @"$payload")"

          echo "INFERENCE_HTTP=$infer_code"
          [ "$infer_code" = "200" ] || {
            echo "GITHUB_MODELS_QWEN=HOLD"
            jq -c '{error:(.error.message // .error // "unknown")}' "$response" 2>/dev/null || true
            exit 1
          }

          answer="$(jq -r '.choices[0].message.content // empty' "$response")"
          [ -n "$answer" ] || { echo "GITHUB_MODELS_QWEN=HOLD"; exit 1; }
          answer_sha="$(printf '%s' "$answer" | sha256sum | awk '{print $1}')"

          echo "RESPONSE_SHA256=$answer_sha"
          echo "REASONING_RESPONSE_NONEMPTY=TRUE"
          echo "INPUT_SOURCE=LOUKSNA_REMOTE_BRIDGE_EVIDENCE_ONLY"
          echo "OPERATOR_PLANE=GITHUB"
          echo "ROLE=REASONING_ONLY"
          echo "PROVIDER_SWAPPABLE=TRUE"
          echo "HOST_MATERIAL_ACCESS=FALSE"
          echo "HOST_OBSERVATION_AUTHORITY=FALSE"
          echo "DIRECT_HOST_TOOLING=FALSE"
          echo "DESKTOP_COMMANDER_USED=FALSE"
          echo "PARTITIONING_PERFORMED=FALSE"
          echo "SECRETS_VALUES_EXPOSED=FALSE"
          echo "GITHUB_MODELS_QWEN=PASS"
