name: Restore externalized Cajita assets

on:
  push:
    branches:
      - repair/restore-externalized-assets-20261023
    paths:
      - .github/workflows/restore-externalized-assets.yml
      - scripts/restore_externalized_assets.py
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: restore-externalized-cajita-assets
  cancel-in-progress: false

jobs:
  recover:
    name: Download, checksum and stage externalized assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Download and verify upstream assets
        run: python3 -B scripts/restore_externalized_assets.py

      - name: Commit verified recovery payloads and report
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add externalized-assets-staging EXTERNALIZED_ASSET_RECOVERY_REPORT.json
          if git diff --cached --quiet; then
            echo "No verified staged assets to commit."
            exit 1
          fi
          git commit -m "Recover verified externalized Cajita assets to staging"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"
