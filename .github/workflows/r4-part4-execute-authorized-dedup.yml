name: "R4 PART4 — execute authorized deterministic dedup"
on:
  push:
    branches: [staging/luna-r4-master-part1-part9-20260929]
    paths: ["mission-control/r4-part4-execute-dedup/**"]
permissions:
  contents: read
jobs:
  dedup:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 20
    steps:
      - name: Execute bounded SHA256 dedup and Debian media cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          STATE="$HOME/.local/state/louksna/r4-master-part1-part9/analysis/PART_4_PROYECTOS_DEDUP"
          DB="$STATE/proyectos.sqlite3"
          test -f "$DB"
          OUT="$RUNNER_TEMP/r4-part4-execute-dedup-$GITHUB_RUN_ID"; mkdir -p "$OUT"
          python3 - "$DB" "$OUT" <<'PY'
          import sqlite3,sys,json,os,hashlib
          db,out=sys.argv[1:3]
          c=sqlite3.connect("file:"+db+"?mode=ro",uri=True)
          rows=c.execute("SELECT path,size,sha256 FROM files WHERE sha256 IS NOT NULL ORDER BY sha256,path").fetchall()
          groups={}
          for p,s,h in rows: groups.setdefault((h,s),[]).append(p)
          protected="8. Vida personal y Ocio"
          delete=[]; keep=[]; held=[]
          for (h,s),paths in groups.items():
            existing=[p for p in paths if os.path.isfile(p)]
            if not existing: continue
            # Never mutate protected area. If any copy is protected, retain it and dedup only other identical copies.
            prot=[p for p in existing if f"/{protected}/" in p]
            nonprot=[p for p in existing if p not in prot]
            low=" ".join(existing).lower()
            debian_media=("debian-live-13." in low and any(p.lower().endswith(".iso") for p in existing))
            if debian_media:
              # Explicit authorization: downloaded Debian/KDE installation media no longer required.
              for p in nonprot:
                if p.lower().endswith(".iso"): delete.append((p,s,h,"DEBIAN13_KDE_MEDIA_AUTHORIZED"))
              keep.extend((p,s,h,"PROTECTED") for p in prot)
              continue
            # Generic exact duplicate rule: one physical instance retained.
            if len(existing)>1:
              canonical=(prot[0] if prot else existing[0])
              keep.append((canonical,s,h,"CANONICAL"))
              for p in existing:
                if p==canonical or p in prot: continue
                delete.append((p,s,h,"SHA256_DUPLICATE"))
              keep.extend((p,s,h,"PROTECTED") for p in prot if p!=canonical)
            else:
              keep.append((existing[0],s,h,"UNIQUE"))
          # Precommit: recompute every deletion candidate and require DB hash equality.
          approved=[]
          for p,s,h,why in delete:
            try:
              st=os.stat(p)
              if st.st_size!=s: held.append((p,"SIZE_CHANGED")); continue
              q=hashlib.sha256()
              with open(p,"rb") as f:
                for b in iter(lambda:f.read(8*1024*1024),b""): q.update(b)
              if q.hexdigest()!=h: held.append((p,"HASH_CHANGED")); continue
              approved.append((p,s,h,why))
            except Exception as e: held.append((p,"PRECHECK_ERROR:"+repr(e)))
          plan={"approved_delete_count":len(approved),"approved_delete_bytes":sum(x[1] for x in approved),
                "held":held,"keep_count":len(keep),"protected_scope":protected}
          json.dump(plan,open(out+"/PRECOMMIT.json","w"),indent=2)
          # Commit bounded deletion.
          deleted=[]; errors=[]
          for p,s,h,why in approved:
            try:
              os.unlink(p); deleted.append((p,s,h,why))
            except Exception as e: errors.append((p,repr(e)))
          # Postcondition: deleted absent; retained canonical paths that existed at planning still present.
          absent=all(not os.path.exists(p) for p,_,_,_ in deleted)
          report={"schema":"LOUKSNA_R4_PART4_AUTHORIZED_DEDUP/1.0",
            "deleted_files":len(deleted),"reclaimed_bytes":sum(x[1] for x in deleted),
            "deleted":deleted,"held":held,"errors":errors,"deleted_absent":absent,
            "protected_scope":protected,"status":"PASS" if absent and not errors else "FAIL"}
          json.dump(report,open(out+"/REPORT.json","w"),indent=2,ensure_ascii=False)
          print(json.dumps({k:v for k,v in report.items() if k!="deleted"},indent=2,ensure_ascii=False))
          if report["status"]!="PASS": raise SystemExit(2)
          PY
          sha256sum "$OUT"/* > "$OUT/SHA256SUMS.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R4-PART4-authorized-dedup-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-part4-execute-dedup-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
