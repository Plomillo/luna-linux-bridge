name: LOUKSNAPG bundle branch validation

on:
  push:
    branches:
      - "louksnapg/**"
    paths:
      - ".github/workflows/louksnapg-bundle-ci.yml"
      - ".github/workflows/louksnapg-kestra-auxiliary.yml"
      - ".github/workflows/cajita-louksna1-factory.yml"
      - "tools/louksnapg_worker_mission.py"
      - "tools/louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_bundle.py"
      - "tools/louksnapg_independent_validator.py"
      - "tests/test_louksnapg_bundle.py"
      - "tests/test_louksnapg_worker_mission.py"
      - "tests/test_louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_integral_gate.py"
      - "tests/test_louksnapg_integral_gate.py"
      - "tools/louksnapg_architecture_contract.py"
      - "tests/test_louksnapg_architecture_contract.py"
      - "contracts/louksnapg/architecture-contract.v1.json"
      - "docs/cajita-luna/LOUKSNAPG_ARCHITECTURAL_CONTRACT.md"
      - "docs/cajita-luna/LOUKSNAPG_FUNCTIONAL_REPAIR_AUDIT_20261026.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.json"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_EXECUTION_AUDIT_40302483781_20261026.json"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_EXECUTION_AUDIT_40302483781_20261026.md"
      - "integrations/kestra/flows/24-louksnapg-bundle-audit.yml"
  pull_request:
    paths:
      - ".github/workflows/louksnapg-bundle-ci.yml"
      - ".github/workflows/louksnapg-kestra-auxiliary.yml"
      - ".github/workflows/cajita-louksna1-factory.yml"
      - "tools/louksnapg_worker_mission.py"
      - "tools/louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_bundle.py"
      - "tools/louksnapg_independent_validator.py"
      - "tests/test_louksnapg_bundle.py"
      - "tests/test_louksnapg_worker_mission.py"
      - "tests/test_louksnapg_six_obligation_audit.py"
      - "tools/louksnapg_integral_gate.py"
      - "tests/test_louksnapg_integral_gate.py"
      - "tools/louksnapg_architecture_contract.py"
      - "tests/test_louksnapg_architecture_contract.py"
      - "contracts/louksnapg/architecture-contract.v1.json"
      - "docs/cajita-luna/LOUKSNAPG_ARCHITECTURAL_CONTRACT.md"
      - "docs/cajita-luna/LOUKSNAPG_FUNCTIONAL_REPAIR_AUDIT_20261026.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.md"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.json"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_EXECUTION_AUDIT_40302483781_20261026.json"
      - "docs/cajita-luna/LOUKSNAPG_INTEGRAL_EXECUTION_AUDIT_40302483781_20261026.md"
      - "integrations/kestra/flows/24-louksnapg-bundle-audit.yml"

permissions:
  contents: read

concurrency:
  group: louksnapg-branch-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-contract-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3 cryptography==45.0.7
      - name: Compile LOUKSNAPG packaging, evidence gate and independent validator
        run: |
          python -m py_compile tools/louksnapg_bundle.py tools/louksnapg_independent_validator.py tools/louksnapg_worker_mission.py tools/louksnapg_integral_gate.py tests/test_louksnapg_bundle.py tests/test_louksnapg_integral_gate.py tests/test_louksnapg_worker_mission.py tools/louksnapg_architecture_contract.py tests/test_louksnapg_architecture_contract.py tools/louksnapg_six_obligation_audit.py tests/test_louksnapg_six_obligation_audit.py
      - name: Exercise ZIP build, cap, tamper and independent source-binding tests
        run: |
          python -m unittest discover -s tests -p 'test_louksnapg*.py' -v
          python tools/louksnapg_architecture_contract.py --contract contracts/louksnapg/architecture-contract.v1.json --report "$RUNNER_TEMP/LOUKSNAPG_ARCHITECTURE_CONTRACT.json"
      - name: Validate Kestra contract and pinned release ceiling
        shell: bash
        run: |
          python - <<'PY'
          import json
          import yaml
          from pathlib import Path
          path = Path("integrations/kestra/flows/24-louksnapg-bundle-audit.yml")
          flow = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert flow["id"] == "louksnapg_bundle_audit"
          assert flow["namespace"] == "louksna.kestra"
          inputs = {row["id"]: row for row in flow["inputs"]}
          assert inputs["max_bytes"]["defaults"] == 479000000
          contract = json.loads(Path("contracts/louksnapg/architecture-contract.v1.json").read_text(encoding="utf-8"))
          assert contract["global_luna_hard_max_bytes"] == 479000000
          assert contract["candidate_distribution_max_bytes"] == 479000000
          assert contract["cajita_runtime_archive_max_bytes"] == 470000000
          bundle_builder = Path("tools/louksnapg_bundle.py").read_text(encoding="utf-8")
          independent_validator = Path("tools/louksnapg_independent_validator.py").read_text(encoding="utf-8")
          integral_gate = Path("tools/louksnapg_integral_gate.py").read_text(encoding="utf-8")
          factory_text = Path(".github/workflows/cajita-louksna1-factory.yml").read_text(encoding="utf-8")
          auxiliary_workflow_text = Path(".github/workflows/louksnapg-kestra-auxiliary.yml").read_text(encoding="utf-8")
          telemetry_writer = next((line for line in auxiliary_workflow_text.splitlines() if "tp.write_text(json.dumps(telem" in line), "")
          assert telemetry_writer, "PREAUDIT_TELEMETRY_WRITER_MISSING"
          assert '+"\\\\n"' not in telemetry_writer, "PREAUDIT_TELEMETRY_MUST_NOT_APPEND_LITERAL_BACKSLASH_N"
          assert "LOUKSNAPG_SIX_OBLIGATION_AUDIT.json" in auxiliary_workflow_text
          assert "DEFAULT_MAX_BYTES = 479_000_000" in bundle_builder
          assert "CAP_BYTES = 479_000_000" in independent_validator
          assert "GLOBAL_LUNA_HARD_MAX_BYTES = 479000000" in integral_gate
          assert "BUNDLE_OVER_GLOBAL_LUNA_HARD_MAX_BYTES" in integral_gate
          assert "--max-bytes 490000000" not in factory_text
          assert "--max-bytes 490000000" not in auxiliary_workflow_text
          worker_mission = Path("tools/louksnapg_worker_mission.py").read_text(encoding="utf-8")
          assert "output_within_479000000_bytes" in worker_mission
          assert "runtime_archive_within_470000000_bytes" in worker_mission
          assert "output_within_470000000_bytes" not in worker_mission
          audit_path = Path("docs/cajita-luna/LOUKSNAPG_INTEGRAL_EXECUTION_AUDIT_40302483781_20261026.json")
          execution_audit = json.loads(audit_path.read_text(encoding="utf-8"))
          assert execution_audit["schema"] == "LOUKSNAPG_INTEGRAL_EXECUTION_AUDIT/1.0"
          assert execution_audit["evidence_sources"]["factory_workflow_run_id"] == 40302483781
          assert execution_audit["evidence_sources"]["source_commit"] == "59bedb1c47739e577068eeb31576ddea21b21467"
          assert execution_audit["candidate"]["bytes"] == 371947709
          assert execution_audit["candidate"]["sha256"] == "515b6e9c164c0e5add32ea7968c2ef00aab3a849eb756f76448c4e47f97e40a8"
          assert execution_audit["summary"]["decision"] == "HOLD_NOT_CERTIFIED"
          assert execution_audit["summary"]["obligations_passed"] == 2
          assert execution_audit["summary"]["obligations_held"] == 4
          assert execution_audit["six_obligations"]["C4_TELEMETRY_AND_AUDIT"]["status"] == "PASS_TRACEABILITY_WITH_RELEASE_HOLD"
          assert execution_audit["six_obligations"]["C6_PROHIBITIONS_AND_RECOVERY"]["status"] == "PASS_PROHIBITIONS_OBSERVED"
          assert all(execution_audit["model_tasks"]["task_results"][i]["quality_status"] == "FAIL" for i in range(5))
          assert execution_audit["worker_receipts"]["secondary"]["status"] == "NOT_CONFIGURED"
          required = {
              "source_commit", "bundle_sha256", "bundle_bytes", "document_sha256",
              "runtime_source_sha256", "worker_status", "independent_integrity_status",
              "identity_binding_status", "engine_replacement_status",
              "functional_status", "semantic_quality_status", "host_matrix_status",
              "rollback_status", "axiom_binding_status", "block_binding_status",
              "functional_evidence_sha256", "functional_evidence_source_commit",
              "functional_evidence_status", "functional_target_pass_count",
              "functional_target_expected_count", "functional_evidence_mode",
              "g23_attestation_sha256", "g23_signature_verification_status",
              "g23_producer_id", "g23_validator_id", "g24_decision_sha256", "g24_decision_status",
              "g24_signature_verification_status", "g24_signer_id",
              "architecture_contract_sha256", "architecture_contract_status",
              "primary_worker_id", "secondary_worker_id", "custosz_worker_evidence_sha256",
              "official_source_review_status", "telemetry_evidence_sha256", "telemetry_status",
              "heavy_model_download_count", "remote_commander_used",
          }
          assert required <= set(inputs)
          tasks = {row["id"]: row for row in flow["tasks"]}
          assert {"evidence_shape", "release_gates"} <= set(tasks)
          assert tasks["evidence_shape"]["type"] == "io.kestra.plugin.core.flow.If"
          assert tasks["release_gates"]["type"] == "io.kestra.plugin.core.flow.If"
          text = path.read_text(encoding="utf-8")
          assert "LOUKSNAPG_KESTRA_AUXILIARY_AUDIT=HOLD" in text
          assert "global_certification=PASS_ONLY_FOR_SEPARATELY_SIGNED_G24_SUBJECT" in text
          assert "functional_evidence_status == 'PASS_INTEGRAL_FUNCTIONAL_EVIDENCE'" in text
          assert "g23_signature_verification_status == 'PASS_VERIFIED'" in text
          assert "g24_decision_status == 'GRANTED'" in text
          assert "g24_signature_verification_status == 'PASS_VERIFIED'" in text
          assert "g24_signer_id != inputs.g23_producer_id" in text
          assert "g24_signer_id != inputs.g23_validator_id" in text
          assert "functional_target_pass_count == 21" in text
          assert "architecture_contract_status == 'PASS_CONTRACT_INTEGRITY'" in text
          assert "primary_worker_id == 'CUSTOSZ_V9'" in text
          assert "secondary_worker_id == 'KESTRA'" in text
          assert "official_source_review_status == 'PASS'" in text
          assert "telemetry_status == 'PASS'" in text
          assert "heavy_model_download_count == 0" in text
          assert "remote_commander_used == 'false'" in text
          gate = Path("tools/louksnapg_integral_gate.py").read_text(encoding="utf-8")
          assert "G23_ED25519_SIGNATURE_INVALID" in gate
          assert "G23_TRUSTED_PUBLIC_KEY_NOT_CONFIGURED" in gate
          assert "global_certification" in gate and "NOT_GRANTED" in gate
          factory = Path(".github/workflows/cajita-louksna1-factory.yml").read_text(encoding="utf-8")
          assert "Enforce LOUKSNAPG architectural contract before model asset access" in factory
          assert "STATIC_CONTRACT_CHECK_MUST_NOT_GRANT_PRODUCT_CERTIFICATION" in factory
          assert "task_adapter_execution_pass_count" in factory
          assert "task_adapter_quality_pass_count" in factory
          assert "task_adapter_quality_fail_count" in factory
          assert '"task_adapter_pass_count":task_quality_pass_count' in factory
          aux_path = Path(".github/workflows/louksnapg-kestra-auxiliary.yml")
          aux = yaml.safe_load(aux_path.read_text(encoding="utf-8"))
          aux_steps = aux["jobs"]["independently-validate-and-publish-product-artifact"]["steps"]
          step_ids = {step.get("id"):step for step in aux_steps if step.get("id")}
          assert "contract" in step_ids and "kestra" in step_ids
          aux_text = aux_path.read_text(encoding="utf-8")
          for required_text in (
              "LOUKSNAPG_TELEMETRY_PREAUDIT.json",
              "LOUKSNAPG_FUNCTIONAL_EVIDENCE_NOT_ESTABLISHED.json",
              "LOUKSNAPG_G23_ATTESTATION_NOT_PERFORMED.json",
              "LOUKSNAPG_G24_DECISION_NOT_GRANTED.json",
              "CONTRACT_SHA256:",
              "TELEMETRY_SHA256:",
              "/api/v1/main/executions/",
              "kestra_terminal_state",
              "POLL_TIMEOUT_TERMINAL_STATE_UNCONFIRMED",
              "KESTRA_SECONDARY_WORKER_NOT_VERIFIED",
              "global_certification",
              "NOT_GRANTED",
          ):
              assert required_text in aux_text, "auxiliary contract missing: " + required_text
          assert "Append the exact Kestra receipt to final C4 telemetry" in aux_text
          assert "KESTRA_AUDIT_RESULT" in aux_text
          assert "LOUKSNAPG_TELEMETRY_FINAL.json" in aux_text
          assert "--telemetry candidate/LOUKSNAPG_TELEMETRY_FINAL.json" in aux_text
          six_audit = Path("tools/louksnapg_six_obligation_audit.py").read_text(encoding="utf-8")
          assert 'POST_AUDIT_EVENT_TYPE = "KESTRA_AUDIT_RESULT"' in six_audit
          assert "KESTRA_RECEIPT_MISSING_OR_NOT_BOUND_TO_FINAL_TELEMETRY" in six_audit
          assert "expected_event_count" in six_audit
          blockers = json.loads(Path("docs/cajita-luna/LOUKSNAPG_INTEGRAL_REPAIR_BLOCKERS_20261026.json").read_text(encoding="utf-8"))
          assert blockers["final_decision"] == "HOLD_NOT_CERTIFIED"
          assert blockers["evidence_scope"]["source_commit"] == "d09f79a088781d26fc5b1c3e830db9abfb42c147"
          assert len(blockers["model_quality_results"]) == 5
          assert all(row["quality_status"] == "FAIL" for row in blockers["model_quality_results"])
          assert blockers["worker_and_safety"]["heavy_model_weight_download_count"] == 0
          assert blockers["worker_and_safety"]["remote_commander_used"] is False
          assert blockers["worker_and_safety"]["kestra_status"] == "NOT_CONFIGURED"
          assert all(key in factory for key in ("task_adapter_execution_pass_count","task_adapter_quality_pass_count","task_adapter_quality_fail_count"))
          print("LOUKSNAPG_FACTORY_AND_KESTRA_RUNTIME_CONTRACT=PASS; PRODUCT_CERTIFICATION=NOT_GRANTED_UNLESS_EVIDENCED")
          print("LOUKSNAPG_KESTRA_AND_INTEGRAL_GATE_CONTRACT=PASS; PRODUCT_CERTIFICATION=NOT_GRANTED_UNLESS_EVIDENCED")
          PY
