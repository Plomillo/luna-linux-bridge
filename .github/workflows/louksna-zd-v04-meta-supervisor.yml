name: "LOUKSNA V0.4 — second-order meta-supervisor"
on:
  workflow_dispatch:
  repository_dispatch:
    types: [louksna_meta_watch]
permissions:
  contents: write
jobs:
  meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/louksna-zd-v04-master-20261007
          fetch-depth: 0
          persist-credentials: true
      - run: python3 -B continuity/louksna_v04_meta_supervisor.py
      - if: always()
        run: |
          git add continuity/META_REPORT.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git commit -m "evidence(louksna): persist second-order supervision"
          git push origin HEAD:work/louksna-zd-v04-master-20261007
