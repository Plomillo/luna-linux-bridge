name: LOUKSNAPG2 direct local/offline functional evaluation

on:
  push:
    branches:
      - louksnapg2/puac2-alternative-20261029
      - repair/louksnapg2-foma-sense-xml-20261102
      - repair/louksnapg2-operational-engines-20261103
    paths:
      - ".github/workflows/louksnapg2-direct-functional-evaluation.yml"
      - "tools/louksnapg2_functional_eval.py"
      - "tools/louksnapg2_historical_weight_probe.py"
      - "tools/louksnapg2_q4_precision_probe.py"
      - "tools/louksnapg2_model_identity_evidence.py"
      - "tools/louksnapg2_refresh_module_integrity.py"
      - "tools/louksnapg2_whisper_build.py"
      - "cajita-luna-runtime/LOUKSNAPG2_RUNTIME/**"
      - "cajita-luna-runtime/cajita_task_adapters.py"
      - "cajita-luna-runtime/cajita_resource_limits.py"
      - "cajita-luna-runtime/**/CAJITA_MODULE.json"
      - "cajita-luna-runtime/**/compression_metadata.json"
      - "cajita-luna-runtime/**/model.safetensors"
      - "cajita-luna-runtime/**/model.safetensors.q4.json"
      - "cajita-luna-runtime/**/quantized_weights.bin"
      - "cajita-luna-runtime/CAJITA_RUNTIME_V1/weights_manifest.json"
      - "cajita-luna-runtime/CAJITA_COMPRESSED_TOKENIZER_MANIFEST.json"
      - "cajita-luna-runtime/REQUIREMENTS.runtime.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louksnapg2-direct-functional-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-real-local-models:
    if: (github.ref == 'refs/heads/louksnapg2/puac2-alternative-20261029' || github.ref == 'refs/heads/repair/louksnapg2-foma-sense-xml-20261102' || github.ref == 'refs/heads/repair/louksnapg2-operational-engines-20261103')
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --memory=1g --memory-swap=1g --cpus=1
    timeout-minutes: 100
    steps:
      - name: Verify candidate cgroup is 1 GiB RAM and at most one CPU
        shell: bash
        run: |
          set -Eeuo pipefail
          memory="$(cat /sys/fs/cgroup/memory.max)"
          read -r quota period < /sys/fs/cgroup/cpu.max
          expected=$(( 1 * 1024 * 1024 * 1024 ))
          if [[ "$memory" != "$expected" ]]; then
            echo "CANDIDATE_MEMORY_CGROUP_MISMATCH:$memory:$expected" >&2
            exit 1
          fi
          if [[ ! "$quota" =~ ^[0-9]+$ || ! "$period" =~ ^[0-9]+$ ]] || (( quota <= 0 || period <= 0 || quota > period )); then
            echo "CANDIDATE_CPU_CGROUP_MISMATCH:$quota:$period" >&2
            exit 1
          fi
          printf '{"status":"PASS","memory_limit_bytes":%s,"cpu_quota":%s,"cpu_period":%s}\n' "$memory" "$quota" "$period"


      - name: Install Git and Git LFS before checkout inside the 1-GiB candidate container
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git git-lfs
          update-ca-certificates
          git --version
          git lfs version

      - name: Checkout exact repository source without blanket LFS hydration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          # Non-cone sparse paths keep the functional lane bounded to the
          # five exact source-bound model trees, the Foma source/runtime,
          # and the runtime support files used by preflight and dispatch.
          sparse-checkout: |
            /cajita-luna-runtime/LOUKSNAPG2_RUNTIME/**
            /cajita-luna-runtime/1. Cerebro/**
            /cajita-luna-runtime/3. Transcripción/**
            /cajita-luna-runtime/4. Traductor Inteligente/Traducción general/**
            /cajita-luna-runtime/4. Traductor Inteligente/Traducción de lenguas antiguas/foma-master/foma-master/foma/**
            /cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/**
            /cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/**
            /cajita-luna-runtime/CAJITA_RUNTIME_V1/weights_manifest.json
            /cajita-luna-runtime/CAJITA_COMPRESSED_TOKENIZER_MANIFEST.json
            /cajita-luna-runtime/REQUIREMENTS.runtime.lock
            /cajita-luna-runtime/cajita_task_adapters.py
            /cajita-luna-runtime/cajita_tokenizer_materializer.py
            /cajita-luna-runtime/cajita_resource_limits.py
            /cajita-luna-runtime/cajita_weight_materializer.py
            /cajita-luna-runtime/command_subdomain_routing.json
            /tools/**
            /tests/**
          sparse-checkout-cone-mode: false
          lfs: false
          persist-credentials: false

      - name: Rehydrate exact shallow Git worktree for scoped LFS downloads
        shell: bash
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -Eeuo pipefail
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git init
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          git lfs install --local
          GIT_LFS_SKIP_SMUDGE=1 git fetch --depth=1 origin "$GITHUB_SHA"
          GIT_LFS_SKIP_SMUDGE=1 git checkout --force --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Initialize persistent evidence directory before setup
        run: |
          mkdir -p out/louksnapg2-direct-functional
          printf '%s\\n' "NOT_RUN" > out/louksnapg2-direct-functional/WORKFLOW_PREFLIGHT_STATUS.txt

      - name: Materialize only the existing GPT-OSS LFS object
        shell: bash
        run: |
          set -Eeuo pipefail
          git lfs install --local
          git lfs pull --include="cajita-luna-runtime/1. Cerebro/model.safetensors" --exclude="" origin "$GITHUB_SHA"
          git lfs checkout "cajita-luna-runtime/1. Cerebro/model.safetensors"

      - name: Set up the repository-pinned Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"

      - name: Install local audio fixture generator
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update
          apt-get install -y --no-install-recommends espeak-ng fonts-dejavu-core build-essential cmake flex bison libreadline-dev zlib1g-dev apertium apertium-eng-spa apertium-fr-es tesseract-ocr tesseract-ocr-eng
          for tool in make cc flex bison cmake apertium tesseract; do command -v "$tool"; done

      - name: Install only the committed CPU runtime lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r cajita-luna-runtime/REQUIREMENTS.runtime.lock

      - name: Create deterministic known-answer audio and invoice image fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out/louksnapg2-direct-functional
          espeak-ng -v en-us -s 135 -w "$RUNNER_TEMP/louksnapg2-audio-one.wav" "The meeting starts at noon."
          espeak-ng -v en-us -s 135 -w "$RUNNER_TEMP/louksnapg2-audio-two.wav" "Please turn left at the next street."
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "louksnapg2-invoice.png"
          image = Image.new("RGB", (1800, 1200), "white")
          draw = ImageDraw.Draw(image)
          font_path = Path("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf")
          if not font_path.is_file():
              raise SystemExit("DEJAVU_SANS_BOLD_FONT_MISSING")
          title_font = ImageFont.truetype(str(font_path), size=112)
          body_font = ImageFont.truetype(str(font_path), size=88)
          draw.text((150, 140), "INVOICE 4821", fill=(0, 0, 0), font=title_font)
          draw.line((140, 360, 1660, 360), fill=(0, 0, 0), width=6)
          draw.text((150, 520), "TOTAL 37.50", fill=(0, 0, 0), font=body_font)
          image.save(path, format="PNG", optimize=False, dpi=(300, 300))
          assert path.is_file() and path.stat().st_size > 0
          print("INVOICE_FIXTURE_SHA256_READY")
          PY
          test -s "$RUNNER_TEMP/louksnapg2-audio-one.wav"
          test -s "$RUNNER_TEMP/louksnapg2-audio-two.wav"

      - name: Provision verified Whisper.cpp tiny auxiliary ASR runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          python -B tools/louksnapg2_whisper_build.py --runtime-root cajita-luna-runtime --work-dir "$RUNNER_TEMP/louksnapg2-whisper-build" | tee out/louksnapg2-direct-functional/WHISPER_AUXILIARY_ASSETS.json

      - name: Verify Apertium, Tesseract and Whisper auxiliary executables
        shell: bash
        run: |
          set -Eeuo pipefail
          tesseract --version | head -n 1
          apertium -V
          printf 'The meeting starts at noon.\\n' | apertium eng-spa | tee "$RUNNER_TEMP/apertium-eng-spa.txt"
          grep -qi 'reunión\|reunion' "$RUNNER_TEMP/apertium-eng-spa.txt"
          printf 'Le livre est sur la table.\\n' | apertium fra-spa | apertium spa-eng | tee "$RUNNER_TEMP/apertium-fra-eng.txt"
          grep -qi 'book' "$RUNNER_TEMP/apertium-fra-eng.txt"
          test -s cajita-luna-runtime/LOUKSNAPG2_RUNTIME/auxiliary_models/ggml-tiny.bin
          test -x cajita-luna-runtime/LOUKSNAPG2_RUNTIME/auxiliary_bin/linux-x86_64/whisper-cli

      - name: Refresh Docling derived module-tree metadata without modifying its source weights
        shell: bash
        run: |
          set -Eeuo pipefail
          python -B tools/louksnapg2_refresh_module_integrity.py --runtime-root cajita-luna-runtime | tee out/louksnapg2-direct-functional/DOCLING_TREE_REFRESH.json

      - name: Verify all five source-bound model identities and runtime integrity
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/cajita-luna-runtime
        run: |
          set -Eeuo pipefail
          python -B tools/louksnapg2_model_identity_evidence.py \
            --runtime-root cajita-luna-runtime \
            --output out/louksnapg2-direct-functional/LOUKSNAPG2_MODEL_IDENTITY.json
          python -B cajita-luna-runtime/LOUKSNAPG2_RUNTIME/louksnapg2_service.py \
            --runtime-root cajita-luna-runtime preflight \
            > out/louksnapg2-direct-functional/LOUKSNAPG2_RUNTIME_PREFLIGHT.json
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("out/louksnapg2-direct-functional")
          model = json.loads((base / "LOUKSNAPG2_MODEL_IDENTITY.json").read_text())
          runtime = json.loads((base / "LOUKSNAPG2_RUNTIME_PREFLIGHT.json").read_text())
          if model.get("status") != "PASS" or len(model.get("models", [])) != 5:
              raise SystemExit("MODEL_IDENTITY_NOT_PASS")
          if runtime.get("status") != "PASS_MODEL_SOURCE_IDENTITIES":
              raise SystemExit("GLOBAL_RUNTIME_PREFLIGHT_NOT_PASS")
          print("SOURCE_BOUND_MODEL_IDENTITIES=5/5")
          print("RUNTIME_PREFLIGHT=PASS")
          PY

      - name: Run all 13 semantic acceptance cases through the exact repository runtime
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          VECLIB_MAXIMUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONNOUSERSITE: "1"
          LOUKSNAPG_REMOTE_MODE: "off"
          LOUKSNAPG_REMOTE_DOMAINS_REQUIRED: ""
        run: |
          set -Eeuo pipefail
          set +e
          python -B tools/louksnapg2_functional_eval.py \
            --runtime-root cajita-luna-runtime \
            --audio-one "$RUNNER_TEMP/louksnapg2-audio-one.wav" \
            --audio-two "$RUNNER_TEMP/louksnapg2-audio-two.wav" \
            --docling-image "$RUNNER_TEMP/louksnapg2-invoice.png" \
            --output out/louksnapg2-direct-functional/LOUKSNAPG2_FUNCTIONAL_EVIDENCE.json
          rc=$?
          set -e
          echo "$rc" > out/louksnapg2-direct-functional/LOUKSNAPG2_FUNCTIONAL_EXIT_CODE.txt
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("out/louksnapg2-direct-functional/LOUKSNAPG2_FUNCTIONAL_EVIDENCE.json")
          if not p.is_file():
              raise SystemExit("FUNCTIONAL_EVIDENCE_NOT_EMITTED")
          data = json.loads(p.read_text(encoding="utf-8"))
          print("FUNCTIONAL_STATUS=" + str(data.get("functional_status")))
          print("MODEL_INFERENCE_PERFORMED=" + str(data.get("model_inference_performed")))
          print("CASE_COUNT=" + str(len(data.get("tests", []))))
          for row in data.get("tests", []):
              case_id = str(row.get("case_id", "UNKNOWN"))
              status = str(row.get("status", "UNKNOWN"))
              execution = str(row.get("execution_status", "UNKNOWN"))
              quality = str(row.get("quality_criterion_passed", False))
              reason = str(row.get("reason", ""))[:240]
              output = str(row.get("actual_output") or "")[:260]
              print("CASE=" + case_id + " STATUS=" + status + " EXECUTION=" + execution
                    + " QUALITY=" + quality + " REASON=" + reason + " OUTPUT=" + output)
          print("GLOBAL_CERTIFICATION=" + str(data.get("global_certification")))
          PY
          echo "FUNCTIONAL_EVALUATOR_EXIT_CODE=$rc"
          # Preserve failed semantic evidence as a completed diagnostic job. This
          # workflow is an evaluation lane, not a certification or release gate.
          exit 0

      - name: Upload direct local/offline functional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg2-direct-functional-evidence
          path: out/louksnapg2-direct-functional/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
