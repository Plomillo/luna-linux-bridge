name: "Metacognitive Extension Materialization — cloud lab"

on:
  push:
    branches:
      - staging/metacognitive-ecosystem-v1-r4-20260928
    paths:
      - ecosystem/metacognitive-operational-v1/extensions/**
      - .github/workflows/metacognitive-reusable-worker.yml
      - .github/workflows/metacognitive-extension-materialization.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    uses: ./.github/workflows/metacognitive-reusable-worker.yml
    with:
      task: extension-selftest
      runner: ubuntu-24.04

  windows:
    runs-on: windows-2025
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ecosystem/metacognitive-operational-v1/extensions/novel_v1.py
          sparse-checkout-cone-mode: false
      - shell: pwsh
        run: python -B -I ecosystem/metacognitive-operational-v1/extensions/novel_v1.py

  debian13:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 8
    steps:
      - name: Minimal Debian runtime
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3 git ca-certificates
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: ecosystem/metacognitive-operational-v1/extensions/novel_v1.py
          sparse-checkout-cone-mode: false
      - shell: bash
        run: |
          cat /etc/debian_version
          python3 -B -I ecosystem/metacognitive-operational-v1/extensions/novel_v1.py

  codex_tool_ready:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify pinned official Codex CLI package without authentication
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(npm view @openai/codex@0.157.1 version)" = "0.157.1"
          npx -y @openai/codex@0.157.1 --version
          echo "NODE_STATE=TOOL_READY"
          echo "EXECUTOR_AUTHORIZED=FALSE"
          echo "MODEL_CALL_PERFORMED=FALSE"

  android_sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Verify Android API 36 and 37 SDK platforms in cloud
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "platforms;android-37"
          sdkmanager --list_installed | grep -E 'platforms;android-(36|37)'
          echo "ANDROID_16_API_36=PASS"
          echo "ANDROID_17_API_37=PASS"
