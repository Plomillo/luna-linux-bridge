name: LOUKSNAPG2 Dynamic Lexicon XML inspection
on:
  workflow_dispatch:
  push:
    branches: ["louksnapg2/puac2-alternative-20261029"]
    paths:
      - "research/LOUKSNAPG2_DYNAMIC_LEXICON_SOURCE/**"
      - "tools/louksnapg2_dynamic_lexicon_inspect.py"
      - "tests/test_louksnapg2_dynamic_lexicon_inspect.py"
      - ".github/workflows/louksnapg2-dynamic-lexicon-import.yml"
permissions:
  contents: read
concurrency:
  group: louksnapg2-dynamic-lexicon-\${{ github.sha }}
  cancel-in-progress: false
jobs:
  inspect-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Louksnapg2 commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: \${{ github.sha }}
          lfs: false
      - name: Set up pinned Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13.7"
      - name: Install pinned safe XML parser
        run: python -m pip install --disable-pip-version-check --no-input defusedxml==0.7.1
      - name: Verify pinned upstream archive identities
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("research/LOUKSNAPG2_DYNAMIC_LEXICON_SOURCE")
          expected={"greeklexicon.tar.gz":"31553992ff71bd59232ee012d22dc11c9af42465",
                    "latinlexicon.tar.gz":"e035c7c878f2856d41a5d88c4ae3a56ed84b480f"}
          report={}
          for name,blob_sha in expected.items():
              path=root/name; data=path.read_bytes()
              observed=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
              if observed != blob_sha: raise SystemExit("UPSTREAM_GIT_BLOB_IDENTITY_MISMATCH:"+name)
              report[name]={"bytes":len(data),"git_blob_sha1":observed,"sha256":hashlib.sha256(data).hexdigest()}
          print(json.dumps(report,sort_keys=True))
          PY
      - name: Run safe XML archive inspector
        run: |
          set -Eeuo pipefail
          python -B tools/louksnapg2_dynamic_lexicon_inspect.py \
            --greek research/LOUKSNAPG2_DYNAMIC_LEXICON_SOURCE/greeklexicon.tar.gz \
            --latin research/LOUKSNAPG2_DYNAMIC_LEXICON_SOURCE/latinlexicon.tar.gz \
            --output out/dynamic_lexicon_inventory.json
      - name: Run importer security and structure tests
        env:
          PYTHONPATH: tools
        run: python -B -m unittest discover -s tests -p "test_louksnapg2_dynamic_lexicon_inspect.py" -v
      - name: Upload XML schema inventory and hash evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg2-dynamic-lexicon-inventory-\${{ github.sha }}
          path: out/dynamic_lexicon_inventory.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 9
