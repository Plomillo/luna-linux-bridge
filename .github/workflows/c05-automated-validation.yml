name: C05 automated independent validation

on:
  push:
    branches:
      - repair/metagente-luna-structured-20261125
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c05-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-and-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: missions/training-alta-resolucion-20261123/s3
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: missions/training-alta-resolucion-20261123/s3/pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile all source and test modules
        run: python -m compileall -q src tests
      - name: Build source-bound planning backlog
        run: python scripts/build_c05_source_backlog.py
      - name: Archive source-bound planning backlog
        uses: actions/upload-artifact@v4
        with:
          name: c05-source-plan-backlog-${{ github.sha }}
          path: |
            missions/training-alta-resolucion-20261123/s3/reports/C05_SOURCE_PLAN_BACKLOG.jsonl
            missions/training-alta-resolucion-20261123/s3/reports/C05_SOURCE_PLAN_BACKLOG_SUMMARY.json
          if-no-files-found: error
          retention-days: 90
      - name: Compile source-bound TEO dossiers
        run: python scripts/build_c05_teo_dossiers.py
      - name: Archive source-bound TEO dossiers
        uses: actions/upload-artifact@v4
        with:
          name: c05-teo-dossiers-${{ github.sha }}
          path: |
            missions/training-alta-resolucion-20261123/s3/reports/C05_TEO_DOSSIERS.jsonl
            missions/training-alta-resolucion-20261123/s3/reports/C05_TEO_DOSSIERS_SUMMARY.json
          if-no-files-found: error
          retention-days: 90
      - name: Ruff
        run: ruff check src tests
      - name: Unit and adversarial tests
        run: pytest -q
      - name: Publish explicit non-certification summary
        if: always()
        run: |
          {
            echo "## C05 automated validation"
            echo "- Candidate: $GITHUB_SHA"
            echo "- Unit/adversarial test result: ${{ job.status }}"
            echo "- This workflow does not execute the 1,000 INF population."
            echo "- This workflow does not issue C05 PASS or certification."
            echo "- No human approval is an operational gate; independent automated validation is required per case."
          } >> "$GITHUB_STEP_SUMMARY"
