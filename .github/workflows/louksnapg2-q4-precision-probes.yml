name: LOUKSNAPG2 repository-retained Q4 precision probes — repair branch

on:
  push:
    branches:
      - repair/louksnapg2-gpu-foundation-20261103
    paths:
      - "tools/louksnapg2_q4_precision_probe.py"
      - "tools/louksnapg2_historical_weight_probe.py"
      - ".github/workflows/louksnapg2-q4-precision-probes.yml"
      - "cajita-luna-runtime/cajita_task_adapters.py"
      - "cajita-luna-runtime/cajita_resource_limits.py"
      - "tests/test_cajita_task_adapters.py"
      - "cajita-luna-runtime/1. Cerebro/model.safetensors*"
      - "cajita-luna-runtime/3. Transcripción/model.safetensors*"
      - "cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors*"
      - "cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louksnapg2-q4-precision-probes-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  compare-q2-to-q4:
    if: github.ref == 'refs/heads/repair/louksnapg2-gpu-foundation-20261103'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --memory=1g --memory-swap=1g --cpus=1
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        domain:
          - D03_TRANSCRIPCION
          - D04_TRADUCTOR_INTELIGENTE
    steps:
      - name: Install Git and LFS before checkout in the bounded container
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git git-lfs espeak-ng
          git --version
          git lfs version
      - name: Checkout active Q2 candidate source without blanket LFS hydration
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Set up Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"

      - name: Install repository-pinned CPU runtime
        run: |
          python -m pip install --disable-pip-version-check \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r cajita-luna-runtime/REQUIREMENTS.runtime.lock


      - name: Materialize the exact active Q2 LFS weights for the selected domain
        shell: bash
        env:
          MODEL_DOMAIN: ${{ matrix.domain }}
        run: |
          set -Eeuo pipefail
          case "$MODEL_DOMAIN" in
            D01_CEREBRO) WEIGHT_PATH="cajita-luna-runtime/1. Cerebro/model.safetensors" ;;
            D03_TRANSCRIPCION) WEIGHT_PATH="cajita-luna-runtime/3. Transcripción/model.safetensors" ;;
            D04_TRADUCTOR_INTELIGENTE) WEIGHT_PATH="cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors" ;;
            D06_SISTEMA_INTELIGENTE) WEIGHT_PATH="cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors" ;;
            *) echo "UNREGISTERED_MODEL_DOMAIN:$MODEL_DOMAIN" >&2; exit 2 ;;
          esac
          git lfs install --local
          git lfs pull --include="$WEIGHT_PATH" --exclude="" origin "$GITHUB_SHA"
          git lfs checkout "$WEIGHT_PATH"
          test -s "$WEIGHT_PATH"
          if head -n 1 "$WEIGHT_PATH" | grep -q "git-lfs.github.com/spec"; then
            echo "ACTIVE_Q2_WEIGHT_REMAINS_LFS_POINTER:$WEIGHT_PATH" >&2
            exit 2
          fi

      - name: Check out exact in-repository historical Q4 candidate
        shell: bash
        env:
          Q4_COMMIT: fa8b64b1319605e050c2064f955f5fbf47951908
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$Q4_COMMIT"
          git cat-file -e "$Q4_COMMIT^{commit}"
          git worktree add --detach "$RUNNER_TEMP/louksnapg2-q4" "$Q4_COMMIT"
          case "${{ matrix.domain }}" in
            D01_CEREBRO) WEIGHT_PATH="cajita-luna-runtime/1. Cerebro/model.safetensors" ;;
            D03_TRANSCRIPCION) WEIGHT_PATH="cajita-luna-runtime/3. Transcripción/model.safetensors" ;;
            D04_TRADUCTOR_INTELIGENTE) WEIGHT_PATH="cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors" ;;
            D06_SISTEMA_INTELIGENTE) WEIGHT_PATH="cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors" ;;
            *) echo "UNREGISTERED_MODEL_DOMAIN:${{ matrix.domain }}" >&2; exit 2 ;;
          esac
          git -C "$RUNNER_TEMP/louksnapg2-q4" lfs install --local
          git -C "$RUNNER_TEMP/louksnapg2-q4" lfs pull --include="$WEIGHT_PATH" --exclude="" origin "$Q4_COMMIT"
          git -C "$RUNNER_TEMP/louksnapg2-q4" lfs checkout "$WEIGHT_PATH"
          test -s "$RUNNER_TEMP/louksnapg2-q4/$WEIGHT_PATH"
          if head -n 1 "$RUNNER_TEMP/louksnapg2-q4/$WEIGHT_PATH" | grep -q "git-lfs.github.com/spec"; then
            echo "HISTORICAL_Q4_WEIGHT_REMAINS_LFS_POINTER:$WEIGHT_PATH" >&2
            exit 2
          fi
          test -d "$RUNNER_TEMP/louksnapg2-q4/cajita-luna-runtime"

      - name: Generate deterministic offline speech fixtures
        if: matrix.domain == 'D03_TRANSCRIPCION'
        shell: bash
        run: |
          set -Eeuo pipefail
          espeak-ng -v en-us -s 135 -w "$RUNNER_TEMP/audio-one.wav" "The meeting starts at noon."
          espeak-ng -v en-us -s 135 -w "$RUNNER_TEMP/audio-two.wav" "Please turn left at the next street."
          test -s "$RUNNER_TEMP/audio-one.wav"
          test -s "$RUNNER_TEMP/audio-two.wav"

      - name: Compare active Q2 and historical Q4 factors with the same semantic cases
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          LOUKSNAPG_REMOTE_MODE: "off"
          LOUKSNAPG_REMOTE_DOMAINS_REQUIRED: ""
        run: |
          set -Eeuo pipefail
          mkdir -p "out/${{ matrix.domain }}"
          args=(
            --runtime-root cajita-luna-runtime
            --q4-root "$RUNNER_TEMP/louksnapg2-q4/cajita-luna-runtime"
            --domain "${{ matrix.domain }}"
            --output "out/${{ matrix.domain }}/Q2_VS_HISTORICAL_Q4_PRECISION_PROBE.json"
          )
          if [ "${{ matrix.domain }}" = "D03_TRANSCRIPCION" ]; then
            args+=(--audio-one "$RUNNER_TEMP/audio-one.wav" --audio-two "$RUNNER_TEMP/audio-two.wav")
          fi
          python -B tools/louksnapg2_q4_precision_probe.py "${args[@]}"
          echo "=== FULL Q2 VS HISTORICAL Q4 CASE EVIDENCE ==="
          python -m json.tool "out/${{ matrix.domain }}/Q2_VS_HISTORICAL_Q4_PRECISION_PROBE.json"

      - name: Preserve Q2-to-Q4 model evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg2-q4-precision-probe-${{ matrix.domain }}
          path: out/${{ matrix.domain }}/
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
