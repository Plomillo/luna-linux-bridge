name: "G23 Isolated — Metacognitive Ecosystem b91d"

on:
  push:
    branches:
      - validation/g23-metacognitive-v1-20260928
    paths:
      - g23/metacognitive-v1/**
      - .github/workflows/g23-metacognitive-isolated.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: g23-meta-b91d-${{ github.sha }}
  cancel-in-progress: false

jobs:
  g23:
    name: "G23 isolated read-only validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout evaluator only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            g23/metacognitive-v1
          sparse-checkout-cone-mode: false

      - name: Download exact frozen producer artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: metacognitive-ecosystem-r4-frozen-candidate
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: Plomillo/luna-linux-bridge
          run-id: 36459022140

      - name: Establish read-only evaluator boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          SRC="$RUNNER_TEMP/candidate"
          ROOT="/tmp/g23-eval"
          C="$ROOT/candidate"
          O="$ROOT/out"
          V="$ROOT/validator.py"
          test -f "$SRC/FROZEN_CANDIDATE.json"
          sudo rm -rf "$ROOT"
          sudo install -d -m 0755 "$ROOT"
          sudo cp -a "$SRC" "$C"
          sudo find "$C" -type d -exec chmod 0555 {} +
          sudo find "$C" -type f -exec chmod 0444 {} +
          sudo install -m 0555 "$GITHUB_WORKSPACE/g23/metacognitive-v1/validator.py" "$V"
          sudo install -d -m 0755 -o nobody -g nogroup "$O"
          sudo -u nobody env -i \
            PATH=/usr/bin:/bin \
            python3 -I -B "$V" \
              --candidate "$C" \
              --out "$O" \
              --evaluator-commit "$GITHUB_SHA" \
              --evaluator-run-id "$GITHUB_RUN_ID" \
              --workflow-ref "$GITHUB_WORKFLOW_REF"
          sudo chown -R "$USER":"$USER" "$O"
          cp -a "$O" "$RUNNER_TEMP/g23-out"
          cat "$RUNNER_TEMP/g23-out/G23_RECORD.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify G23 terminal state
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json,os
          root=os.path.join(os.environ["RUNNER_TEMP"],"g23-out")
          g=json.load(open(os.path.join(root,"G23_RECORD.json"),encoding="utf-8"))
          p=json.load(open(os.path.join(root,"PUAC2_INDEPENDENT_EVALUATION.json"),encoding="utf-8"))
          c=json.load(open(os.path.join(root,"C27_INDEPENDENCE_EVIDENCE.json"),encoding="utf-8"))
          assert g["status"]=="PASS",g
          assert g["candidate_digest_sha256"]=="b91d04bf79cd98eda846a8d0435f20323013f7ef647d9b288ab4cf29dcc35240",g
          assert g["repair_allowed"] is False,g
          assert g["write_access_to_candidate"] is False,g
          assert p["status"]=="PASS",p
          assert all(v["status"]=="PASS" for v in p["controls"].values()),p
          assert c["status"]=="PASS" and c["distinct_evaluator_identity"] is True,c
          print("G23_ISOLATED_TERMINAL=PASS")
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g23-metacognitive-b91d-record
          path: ${{ runner.temp }}/g23-out
          if-no-files-found: error
          retention-days: 90
