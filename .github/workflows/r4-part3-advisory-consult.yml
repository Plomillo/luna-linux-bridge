name: "LUNA R4 — PART3 CUSTOSZ advisory consultation"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - .github/workflows/r4-part3-advisory-consult.yml

permissions:
  contents: read

jobs:
  consult:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Ask deployed CUSTOSZ architecture read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/advisory-output"
          mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          import json, os, pathlib, sys, traceback
          out=pathlib.Path(sys.argv[1])
          prompt=r"""
          CONSULTA ARQUITECTÓNICA READ_ONLY — LUNA R4 PART_3.
          Estado observado: PART_3 CORE_ORCHESTRATION_AND_PROJECTS, HOLD,
          blockers projects_center y semantic_container; ambos candidates null.
          runner, SYMPHYLAX, CUSTOSZ, Runtime, MetaOS, Louksna y project_workspace presentes.
          Hipótesis: si tras búsqueda suficiente y trazable no aparece Projects Center
          o Semantic Container aceptable, ¿qué remediación arquitectónica debe adoptarse
          para cerrar PART_3 sin fabricar PASS, sin saltarla y sin degradar gobernanza?
          Evaluar: (1) materializar proyección operacional gobernada desde candidato con
          procedencia demostrable; (2) reconstruir/materializar componente mínimo canónico
          desde fuentes/contratos autorizados; (3) demostrar equivalencia funcional y
          tramitar modificación formal del requisito; (4) mantener HOLD.
          Para alternativas viables indicar evidencia mínima, identidad/hashes, checkpoint,
          rollback, pruebas, no-regresión, relación con Louksna.md, gates G23/G24,
          autorización humana, ubicación operacional, riesgo de falso positivo por presencia
          nominal y criterio legítimo para declarar checks true.
          Concluir con opción preferida y respaldo.
          Restricciones: NO ejecutar, copiar, mover, promover, instalar, generar ni borrar;
          NO modificar controlador ni Louksna.md; NO alterar PART_3; NO avanzar a PART_4;
          NO autocertificar; preservar EXTEND_DO_NOT_REPLACE, FAIL_CLOSED, procedencia,
          trazabilidad, rollback y EVIDENCE->VALIDATION->G23->G24.
          """
          HOME=pathlib.Path("/home/diegoignacionorambuenamiranda")
          PROJECT_ROOT=HOME/"LOUKSNA_MAESTRO_20260925"
          CUSTOSZ=HOME/".local/lib/louksna/symphylax-r1/CUSTOSZ.v07.f04_b.pyz"
          os.environ["CUSTOSZ_STATE_DIR"]=str(out/"ephemeral-custosz-state")
          sys.path.insert(0,str(CUSTOSZ))
          import custosz_v05_legacy as w
          def workspace_adapter(): return PROJECT_ROOT
          def discover_adapter():
              return {"workspace":str(PROJECT_ROOT),"projects":{"LUNA_PROJECT":{"status":"RESOLVED","path":str(PROJECT_ROOT),"score":999}}}
          w.workspace=workspace_adapter
          w.discover=discover_adapter
          result={
            "schema":"LOUKSNA_PART3_ADVISORY_RESPONSE/1.0",
            "mode":"READ_ONLY_ADVISORY",
            "execution_authorized":False,
            "mutation_authorized":False,
            "authority":"Louksna.md",
            "workspace":str(PROJECT_ROOT)
          }
          try:
              result["architecture"]=w.architect(prompt,"LUNA_PROJECT")
          except Exception as e:
              result["architecture_error"]=type(e).__name__+":"+str(e)
              result["architecture_traceback"]=traceback.format_exc()
          try:
              result["reasoning_policy"]=w.reasoning_policy(prompt,"LUNA_PROJECT")
          except Exception as e:
              result["reasoning_policy_error"]=type(e).__name__+":"+str(e)
              result["reasoning_policy_traceback"]=traceback.format_exc()
          p=out/"CUSTOSZ_PART3_ADVISORY.json"
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Preserve advisory response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custosz-part3-advisory-response
          path: advisory-output/CUSTOSZ_PART3_ADVISORY.json
          if-no-files-found: error
          retention-days: 30
