name: "CUSTOSZV9 trusted G22 G23 G24 assurance"

# Default-branch trust root. Candidate bytes are always treated as data by the
# independent/certifying jobs. No host, mTLS, service, or remote rollback actions.
on:
  workflow_run:
    workflows:
      - "CUSTOSZV9 candidate build and validation"
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: custoszv9-assurance-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  g22:
    name: "G22 — exact package, baseline, authority bytes and reproducibility"
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'feature/custoszv9-crfu-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout trusted gate implementation from default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Checkout exact candidate source for read-only comparison
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate-source
          persist-credentials: false
      - name: Download candidate package and producer evidence as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - name: Independently verify exact bytes, scope, preserved authority and rebuild evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g22 \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --candidate-source "$GITHUB_WORKSPACE/candidate-source" \
            --trusted-source "$GITHUB_WORKSPACE/trust-root" \
            --candidate-sha "$CANDIDATE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --out "$RUNNER_TEMP/G22.json"
      - name: Preserve G22 record, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/G22.json
          if-no-files-found: warn
          retention-days: 90

  g23_validate:
    name: "G23 — independent execution, minimal environment, no tokens or private keys"
    needs: g22
    if: needs.g22.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      G23_VALIDATOR_ID: CUSTOSZV9_G23_GITHUB_ATTESTED_WORKFLOW_RUN
    steps:
      - name: Checkout trusted validator, not candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Download candidate bytes and G22 record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g22
      - name: Run CRFU and preserved V8 probes with an allowlisted environment
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 PYTHONNOUSERSITE=1 \
            python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g23 \
              --candidate-dir "$RUNNER_TEMP/candidate" \
              --candidate-sha "$CANDIDATE_SHA" \
              --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
              --validator-id "$G23_VALIDATOR_ID" \
              --g22 "$RUNNER_TEMP/g22/G22.json" \
              --out "$RUNNER_TEMP/G23_UNSIGNED.json"
      - name: Preserve G23 observations, including failed checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-g23-unsigned-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/G23_UNSIGNED.json
          if-no-files-found: warn
          retention-days: 90

  g23_attest:
    name: "G23 — attest the completed independent validation record"
    needs: g23_validate
    if: needs.g23_validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Download candidate, G22, and G23 results as data only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g23-unsigned-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g23
      - name: Bind G23 record to exact candidate and G22 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/g22/G22.json" "$RUNNER_TEMP/g23/G23_UNSIGNED.json" "$CANDIDATE_SHA" <<'PY'
          import hashlib,json,sys,zipfile
          from pathlib import Path
          root=Path(sys.argv[1]);g22p=Path(sys.argv[2]);g23p=Path(sys.argv[3]);commit=sys.argv[4]
          pkg=next(root.rglob("CUSTOSZV9.pyz"))
          d=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          g22=json.loads(g22p.read_text());g23=json.loads(g23p.read_text())
          assert g22["candidate_commit_sha"]==commit and g22["candidate_package_sha256"]==d(pkg)
          assert g23["candidate_commit_sha"]==commit and g23["candidate_package_sha256"]==d(pkg)
          assert g23["g22_record_sha256"]==d(g22p)
          assert g23["schema"]=="CUSTOSZV9_G23_UNSIGNED_VALIDATION/1.0"
          assert len(g23["independent_execution_results"])==5
          names={r["name"] for r in g23["independent_execution_results"]}
          assert names=={"version","crfu-status","crfu-selftest","v8-selftest","v8-status"}
          assert all(r.get("status") in {"PASS","FAIL"} for r in g23["independent_execution_results"])
          print(json.dumps({"status":"G23_RECORD_BOUND","tested_scope_result":g23["tested_scope_result"],"candidate_commit_sha":commit,"package_sha256":d(pkg)}))
          PY
      - name: Create GitHub OIDC/Sigstore attestation for exact G23 record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/g23/G23_UNSIGNED.json

  g24:
    name: "G24 — verify G23 trust, emit scope decision, attest certificate"
    needs: g23_attest
    if: needs.g23_attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout G24 certifier from trusted workflow revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Download exact candidate and G22/G23 evidence as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g23-unsigned-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g23
      - name: Verify G23 Sigstore attestation against trusted workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/g23/G23_UNSIGNED.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/custoszv9-independent-g22-g23-g24.yml" \
            --format json > "$RUNNER_TEMP/G23_ATTESTATION_VERIFICATION.json"
          test -s "$RUNNER_TEMP/G23_ATTESTATION_VERIFICATION.json"
      - name: Evaluate and issue exact-package G24 certificate or explicit HOLD
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g24 \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --candidate-sha "$CANDIDATE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --g22 "$RUNNER_TEMP/g22/G22.json" \
            --g23 "$RUNNER_TEMP/g23/G23_UNSIGNED.json" \
            --g23-attestation-verification "$RUNNER_TEMP/G23_ATTESTATION_VERIFICATION.json" \
            --out "$RUNNER_TEMP/CUSTOSZV9_CERTIFICATE.json"
          cat "$RUNNER_TEMP/CUSTOSZV9_CERTIFICATE.json"
      - name: Attest exact G24 certificate record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/CUSTOSZV9_CERTIFICATE.json
      - name: Verify G24 certificate attestation and preserve release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh attestation verify "$RUNNER_TEMP/CUSTOSZV9_CERTIFICATE.json" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/custoszv9-independent-g22-g23-g24.yml" \
            --format json > "$RUNNER_TEMP/G24_ATTESTATION_VERIFICATION.json"
          python3 - "$RUNNER_TEMP/CUSTOSZV9_CERTIFICATE.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          print("CUSTOSZV9 package-scope certified:",p.get("package_scope_certified",False))
          print("Decision:",p.get("decision"))
          print("Canonical promotion:",p.get("canonical_promotion"))
          print("Full release eligible:",p.get("full_release_eligible"))
          PY
      - name: Upload package plus G22/G23/G24 attested evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-certified-scope-${{ env.CANDIDATE_SHA }}
          path: |
            ${{ runner.temp }}/candidate/**
            ${{ runner.temp }}/g22/G22.json
            ${{ runner.temp }}/g23/G23_UNSIGNED.json
            ${{ runner.temp }}/G23_ATTESTATION_VERIFICATION.json
            ${{ runner.temp }}/CUSTOSZV9_CERTIFICATE.json
            ${{ runner.temp }}/G24_ATTESTATION_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 90
