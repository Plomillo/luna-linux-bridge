name: "CUSTOSZV9 trusted G22 G23 G24 assurance"

# Trust-root behavior only activates after this workflow is on the default branch.
# Candidate artifacts are downloaded as data. Untrusted candidate code runs only
# in the no-secret G23 validation job; signing occurs in a separate job afterwards.
on:
  workflow_run:
    workflows:
      - "CUSTOSZV9 candidate build and validation"
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: custoszv9-assurance-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  g22:
    name: "G22 — exact baseline and bounded global regression evidence"
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'feature/custoszv9-crfu-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Checkout trusted gate implementation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Checkout exact candidate source for comparison only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: candidate-source
          persist-credentials: false
      - name: Download candidate package and build evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - name: Independently bind commit, package, baseline and reproducibility
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g22 \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --candidate-source "$GITHUB_WORKSPACE/candidate-source" \
            --trusted-source "$GITHUB_WORKSPACE/trust-root" \
            --candidate-sha "$CANDIDATE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --out "$RUNNER_TEMP/G22.json"
      - name: Preserve G22 record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/G22.json
          if-no-files-found: error
          retention-days: 90

  g23_validate:
    name: "G23 — execute isolated validation with no signing secrets"
    needs: g22
    if: needs.g22.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      G23_VALIDATOR_ID: ${{ vars.PUAC2_G23_VALIDATOR_ID }}
    steps:
      - name: Checkout trusted validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Download candidate package and G22 record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g22
      - name: Run CRFU/V8 probes with only a minimal environment
        shell: bash
        run: |
          set -Eeuo pipefail
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 PYTHONNOUSERSITE=1 \
            python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g23 \
              --candidate-dir "$RUNNER_TEMP/candidate" \
              --candidate-sha "$CANDIDATE_SHA" \
              --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
              --validator-id "$G23_VALIDATOR_ID" \
              --g22 "$RUNNER_TEMP/g22/G22.json" \
              --out "$RUNNER_TEMP/G23_UNSIGNED.json"
      - name: Preserve unsigned G23 observation (not an attestation)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-g23-unsigned-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/G23_UNSIGNED.json
          if-no-files-found: error
          retention-days: 90

  g23_attest:
    name: "G23 — independently sign the finished validation record"
    needs: g23_validate
    if: needs.g23_validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      G23_VALIDATOR_ID: ${{ vars.PUAC2_G23_VALIDATOR_ID }}
      G23_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.PUAC2_G23_SIGNING_PRIVATE_KEY_PEM }}
      G23_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G23_PUBLIC_KEY_PEM }}
    steps:
      - name: Checkout trusted signer, never candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Set up pinned Python for Ed25519 signing
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install pinned cryptography signing dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Download candidate bytes and the unsigned result as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g23-unsigned-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g23-unsigned
      - name: Sign only the validated report bound to exact bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$G23_SIGNING_PRIVATE_KEY_PEM" || { echo "::error::G23 Ed25519 private key not provisioned"; exit 3; }
          test -n "$G23_PUBLIC_KEY_PEM" && test -n "$G23_VALIDATOR_ID" || { echo "::error::G23 public key/identity not provisioned"; exit 3; }
          python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g23-sign \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --candidate-sha "$CANDIDATE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --g22 "$RUNNER_TEMP/g22/G22.json" \
            --g23-unsigned "$RUNNER_TEMP/g23-unsigned/G23_UNSIGNED.json" \
            --out "$RUNNER_TEMP/G23_SIGNED.json"
      - name: Preserve Ed25519-signed G23 attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-g23-signed-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/G23_SIGNED.json
          if-no-files-found: error
          retention-days: 90

  g24:
    name: "G24 — verify G23 signature and sign an explicit release decision"
    needs: g23_attest
    if: needs.g23_attest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
      PRODUCER_RUN_ID: ${{ github.event.workflow_run.id }}
      TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
      G23_VALIDATOR_ID: ${{ vars.PUAC2_G23_VALIDATOR_ID }}
      G23_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G23_PUBLIC_KEY_PEM }}
      G24_CERTIFIER_ID: ${{ vars.PUAC2_G24_CERTIFIER_ID }}
      G24_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.PUAC2_G24_SIGNING_PRIVATE_KEY_PEM }}
      G24_PUBLIC_KEY_PEM: ${{ vars.PUAC2_G24_PUBLIC_KEY_PEM }}
    steps:
      - name: Checkout trusted certifier, never candidate code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: trust-root
          persist-credentials: false
      - name: Set up pinned Python for Ed25519 verification/signing
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"
      - name: Install pinned cryptography signing dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: cryptography==50.0.2
      - name: Download candidate bytes, G22 and signed G23 as data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: CUSTOSZV9-candidate-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRODUCER_RUN_ID }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g22-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: custoszv9-g23-signed-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/g23-signed
      - name: Verify G23 Ed25519 signature and issue a signed fail-closed decision
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$G23_PUBLIC_KEY_PEM" && test -n "$G23_VALIDATOR_ID" || { echo "::error::G23 trust key/identity not provisioned"; exit 3; }
          test -n "$G24_SIGNING_PRIVATE_KEY_PEM" && test -n "$G24_PUBLIC_KEY_PEM" && test -n "$G24_CERTIFIER_ID" || { echo "::error::G24 trust key/identity not provisioned"; exit 3; }
          python3 -I trust-root/scripts/custoszv9_gate_trust_root.py g24 \
            --candidate-dir "$RUNNER_TEMP/candidate" \
            --candidate-sha "$CANDIDATE_SHA" \
            --trusted-workflow-sha "$TRUSTED_WORKFLOW_SHA" \
            --g22 "$RUNNER_TEMP/g22/G22.json" \
            --g23 "$RUNNER_TEMP/g23-signed/G23_SIGNED.json" \
            --out "$RUNNER_TEMP/G24_DECISION.json"
      - name: Attest the exact signed G24 decision with GitHub OIDC/Sigstore
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/G24_DECISION.json
      - name: Verify the artifact attestation before preserving the decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify "$RUNNER_TEMP/G24_DECISION.json" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/custoszv9-independent-g22-g23-g24.yml" --format json
      - name: Publish machine-readable decision summary
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/G24_DECISION.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f: record=json.load(f)
          p=record.get("payload",{})
          print("CUSTOSZV9 G24 decision:",p.get("decision","UNKNOWN"))
          print("Tested sub-scope:",p.get("tested_subscope_result","UNKNOWN"))
          print("Full release eligible:",p.get("full_release_eligible",False))
          print("Certification:",p.get("certification","NOT_GRANTED"))
          print("Mandatory blockers:",json.dumps(p.get("mandatory_release_blockers",[])))
          PY
      - name: Preserve signed G24 decision and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custoszv9-g24-decision-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/G24_DECISION.json
          if-no-files-found: error
          retention-days: 90
