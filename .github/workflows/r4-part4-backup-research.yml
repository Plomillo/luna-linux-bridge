name: "R4 PART4 — 2min backup strategy research"
on:
  push:
    branches: [staging/luna-r4-master-part1-part9-20260929]
    paths:
      - "mission-control/r4-backup-research-request/**"
permissions:
  contents: read
jobs:
  research:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 2
    steps:
      - name: Research backup strategy read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJ="$HOME/Proyectos"
          REAL="$(readlink -f "$PROJ")"
          STATE="$HOME/.local/state/louksna/r4-master-part1-part9/analysis/PART_4_PROYECTOS_DEDUP"
          DB="$STATE/proyectos.sqlite3"
          OUT="$RUNNER_TEMP/r4-backup-research-$GITHUB_RUN_ID"
          mkdir -p "$OUT"
          test -d "$REAL"
          test -f "$DB"
          OPTS="$(findmnt -rn -T "$REAL" -o OPTIONS)"
          case ",$OPTS," in *,ro,*) ;; *) echo "FAIL_CLOSED: PROYECTOS not read-only"; exit 20;; esac
          {
            echo "captured_at_utc=$(date -u +%FT%TZ)"
            echo "source=$REAL"
            echo "source_mount_options=$OPTS"
            echo "root_df=$(df -B1 --output=size,used,avail,pcent,target / | tail -1)"
            echo "windows_df=$(df -B1 --output=size,used,avail,pcent,target "$REAL" | tail -1)"
            echo "tools:"
            for x in 7z zstd gzip xz tar borg restic; do
              if command -v "$x" >/dev/null 2>&1; then echo "$x=$(command -v "$x")"; else echo "$x=MISSING"; fi
            done
          } > "$OUT/ENVIRONMENT.txt"

          timeout 105s nice -n 15 ionice -c2 -n7 python3 - "$DB" "$OUT" <<'PY'
          import sqlite3,sys,json,os,collections,zlib,lzma,time,hashlib
          db,out=sys.argv[1:3]
          con=sqlite3.connect("file:"+db+"?mode=ro",uri=True)
          total_files,total_bytes=con.execute("select count(*),coalesce(sum(size),0) from files").fetchone()
          dup=con.execute("""select coalesce(sum((n-1)*size),0),coalesce(sum(n-1),0) from
            (select size,count(*) n from files where sha256 is not null group by sha256,size having count(*)>1)""").fetchone()
          reclaim, redundant=map(int,dup)
          unique_floor=total_bytes-reclaim
          exts=collections.defaultdict(lambda:[0,0])
          for p,s in con.execute("select path,size from files"):
              ext=os.path.splitext(p)[1].lower() or "[no_ext]"
              exts[ext][0]+=1; exts[ext][1]+=s
          top=sorted(({"extension":k,"files":v[0],"bytes":v[1]} for k,v in exts.items()),key=lambda x:x["bytes"],reverse=True)[:40]

          # Stratified bounded sample: largest file from top byte-heavy extensions,
          # capped at 256 MiB total and 8 MiB per file. No source writes.
          chosen=[]
          budget=256*1024*1024
          for e in top[:30]:
              ext=e["extension"]
              if ext=="[no_ext]":
                  row=con.execute("select path,size from files where instr(substr(path,instr(path,'/')+1),'.')=0 order by size desc limit 1").fetchone()
              else:
                  row=con.execute("select path,size from files where lower(path) like ? order by size desc limit 1",("%"+ext,)).fetchone()
              if row and os.path.isfile(row[0]) and budget>0:
                  take=min(8*1024*1024,row[1],budget)
                  if take>0: chosen.append((row[0],row[1],take,ext)); budget-=take
          raw=bytearray()
          sample_meta=[]
          for p,size,take,ext in chosen:
              try:
                  with open(p,"rb") as f: b=f.read(take)
                  raw.extend(b)
                  sample_meta.append({"extension":ext,"file_size":size,"sample_bytes":len(b)})
              except OSError: pass
          raw=bytes(raw)
          methods={}
          if raw:
              t=time.monotonic(); c=zlib.compress(raw,6); methods["zlib6"]={"bytes":len(c),"ratio":len(c)/len(raw),"seconds":round(time.monotonic()-t,3)}
              t=time.monotonic(); c=lzma.compress(raw,preset=3); methods["lzma3"]={"bytes":len(c),"ratio":len(c)/len(raw),"seconds":round(time.monotonic()-t,3)}
          summary={
            "schema":"LOUKSNA_R4_PART4_BACKUP_RESEARCH/1.0",
            "status":"RESEARCH_COMPLETE",
            "read_only":True,
            "source_mutation":False,
            "total_files":total_files,
            "total_bytes":total_bytes,
            "exact_duplicate_reclaimable_bytes":reclaim,
            "redundant_extra_copies":redundant,
            "content_addressed_unique_floor_bytes":unique_floor,
            "dedup_floor_ratio":round(unique_floor/total_bytes,6) if total_bytes else 0,
            "top_extensions_by_bytes":top,
            "compression_sample_bytes":len(raw),
            "compression_sample_manifest":sample_meta,
            "sample_methods":methods,
            "metacognitive_limits":[
              "Sample compression is an estimator, not a full-corpus archive size guarantee.",
              "Exact-duplicate floor is proven only for duplicate candidates hashed in the prior forensic pass.",
              "No backup is certified by this research; G23/G24 remain independent gates.",
              "A reconstruction manifest alone must not be counted as a second backup unless PART4 policy explicitly accepts it."
            ]
          }
          with open(out+"/RESEARCH.json","w") as f: json.dump(summary,f,indent=2); f.write("\n")
          print(json.dumps(summary,indent=2))
          PY

          python3 - "$OUT" <<'PY'
          import json,sys,re
          out=sys.argv[1]
          r=json.load(open(out+"/RESEARCH.json"))
          env=open(out+"/ENVIRONMENT.txt").read()
          m=re.search(r"root_df=\s*\d+\s+\d+\s+(\d+)",env)
          free=int(m.group(1)) if m else None
          unique=r["content_addressed_unique_floor_bytes"]
          methods=r["sample_methods"]
          estimates={k:int(unique*v["ratio"]) for k,v in methods.items()}
          # Recommendation is evidence-bounded and does not claim certification.
          rec={
            "schema":"LOUKSNA_R4_PART4_BACKUP_RECOMMENDATION/1.0",
            "decision_status":"PROPOSAL_NOT_CERTIFICATION",
            "priority":["integrity","restore_verifiability","space","determinism","speed"],
            "root_available_bytes":free,
            "deduplicated_unique_floor_bytes":unique,
            "sample_projected_archive_bytes":estimates,
            "recommended_architecture":{
              "backup_1":"content-addressed/deduplicated backup preserving full logical tree + SHA-256 manifest; compression after dedup",
              "backup_2":"independent second verified copy on a distinct storage failure domain if PART4 requires two backups; do not misclassify a manifest as a backup",
              "restore_proof":"restore a deterministic representative subset to scratch space and compare manifest/SHA-256; full restore proof if policy requires it",
              "destructive_scope":"explicitly exclude PROYECTOS and its backing extent/path before any Windows destructive operation"
            },
            "compression_selection_rule":"Prefer the smallest method that fits available space while preserving deterministic restore and verification; do not choose from sample ratio alone.",
            "gate_warning":"If local free space cannot hold the required independent backups, HOLD and require another storage target rather than weakening the gate."
          }
          with open(out+"/RECOMMENDATION.json","w") as f: json.dump(rec,f,indent=2); f.write("\n")
          print(json.dumps(rec,indent=2))
          PY

          (cd "$OUT" && sha256sum ./* > SHA256SUMS.txt)
          cat "$OUT/ENVIRONMENT.txt"
          echo "EVIDENCE_DIR=$OUT"
      - name: Preserve research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: R4-PART4-backup-research-${{ github.run_id }}
          path: ${{ runner.temp }}/r4-backup-research-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 14
