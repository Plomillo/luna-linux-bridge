name: "LOUKSNA Qwen F2 — echoed-prompt suffix diagnostic with inline G23 G24"

on:
  push:
    branches:
      - candidate/qwen35-4b-s-integral-20260930
    paths:
      - ".github/workflows/qwen-f2-output-diagnostic.yml"

permissions:
  contents: read

env:
  PRE_DIAG_SHA: b4025d258f52a740763c88b565e5605ab7b904c7
  MODEL_PATH: /home/diegoignacionorambuenamiranda/.local/share/louksna/reasoning/models/qwen35-4b-s/Qwen3.5-4B-S-TS-Q4_K_S.gguf
  RUNTIME_PATH: /home/diegoignacionorambuenamiranda/.local/share/louksna/reasoning/runtime/bec4772f6a2527d371557b5d2032641e5ff7619c/bin/llama-cli

jobs:
  diag_g23:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$PRE_DIAG_SHA"...HEAD)
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = ".github/workflows/qwen-f2-output-diagnostic.yml"
          echo "F2_SUFFIX_DIAG_G23=PASS"

  diag_g24:
    needs: diag_g23
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "F2_SUFFIX_DIAG_G24=PASS; CERTIFICATION_ISSUED=FALSE"

  material_diag:
    needs: diag_g24
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            bridge/reasoning
          sparse-checkout-cone-mode: false
      - name: Classify suffix after echoed prompt without publishing model text
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/qwen-f2-suffix"; mkdir -m 700 "$OUT"; export OUT
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,re
          sys.path.insert(0,str(pathlib.Path("bridge/reasoning").resolve()))
          from interface import build_prompt, model_wire_schema
          runtime=os.environ["RUNTIME_PATH"]; model=os.environ["MODEL_PATH"]; out=pathlib.Path(os.environ["OUT"])
          req={"schema":"LOUKSNA_REASONING_REQUEST/1.0","request_id":"F2-SUFFIX",
               "objective":"Identify the safe state. No execution is authorized.",
               "evidence_refs":["F1:36790409680"],"context":{"f1":"PASS"},
               "constraints":{"fail_closed":True,"execution_authority":False}}
          prompt=build_prompt(req)
          schema=model_wire_schema()
          cmd=[runtime,"-m",model,"-p",prompt,"-n","512","--temp","0","--ctx-size","3072","--threads","2",
               "--no-display-prompt","--simple-io","--single-turn","--reasoning-budget","0","--reasoning-format","deepseek",
               "--json-schema",json.dumps(schema,separators=(",",":"))]
          p=subprocess.run(cmd,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=90,check=False,shell=False)
          stdout=p.stdout or ""; stderr=p.stderr or ""
          idx=stdout.rfind(prompt)
          suffix=stdout[idx+len(prompt):] if idx>=0 else stdout
          ansi=re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          clean=ansi.sub('',suffix).strip()
          def first_obj(s):
              dec=json.JSONDecoder()
              for k,ch in enumerate(s):
                  if ch!="{": continue
                  try:
                      obj,end=dec.raw_decode(s[k:])
                      if isinstance(obj,dict): return True,sorted(obj),end
                  except Exception: pass
              return False,[],None
          ok,keys,end=first_obj(clean)
          result={
            "schema":"LOUKSNA_QWEN_F2_SUFFIX_DIAG/1.0","status":"PASS","published_model_text":False,
            "rc":p.returncode,"prompt_echoed":idx>=0,"stdout_bytes":len(stdout.encode()),
            "suffix_bytes":len(suffix.encode()),"clean_suffix_bytes":len(clean.encode()),
            "suffix_json_object":ok,"suffix_keys":keys,
            "suffix_has_open":"{" in clean,"suffix_has_close":"}" in clean,
            "suffix_sha256":hashlib.sha256(clean.encode()).hexdigest(),
            "stderr_bytes":len(stderr.encode()),"stderr_sha256":hashlib.sha256(stderr.encode()).hexdigest()
          }
          (out/"DIAG.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-f2-suffix-diagnostic
          path: ${{ runner.temp }}/qwen-f2-suffix/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
