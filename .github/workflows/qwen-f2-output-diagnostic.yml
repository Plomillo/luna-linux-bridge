name: "LOUKSNA Qwen F2 — reasoning-mode diagnostic with inline G23 G24"

on:
  push:
    branches:
      - candidate/qwen35-4b-s-integral-20260930
    paths:
      - ".github/workflows/qwen-f2-output-diagnostic.yml"

permissions:
  contents: read

env:
  PRE_DIAG_SHA: 002a7d4e042cde475a6c617a9b3051fc552d8dc9
  MODEL_PATH: /home/diegoignacionorambuenamiranda/.local/share/louksna/reasoning/models/qwen35-4b-s/Qwen3.5-4B-S-TS-Q4_K_S.gguf
  RUNTIME_PATH: /home/diegoignacionorambuenamiranda/.local/share/louksna/reasoning/runtime/bec4772f6a2527d371557b5d2032641e5ff7619c/bin/llama-cli

jobs:
  diag_g23:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false, fetch-depth: 0}
      - shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t CHANGED < <(git diff --name-only "$PRE_DIAG_SHA"...HEAD)
          test "${#CHANGED[@]}" -eq 1
          test "${CHANGED[0]}" = ".github/workflows/qwen-f2-output-diagnostic.yml"
          echo "F2_REASONING_MODE_DIAG_G23=PASS"

  diag_g24:
    needs: diag_g23
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo "F2_REASONING_MODE_DIAG_G24=PASS; CERTIFICATION_ISSUED=FALSE"

  material_diag:
    needs: diag_g24
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            bridge/reasoning
          sparse-checkout-cone-mode: false
      - name: Compare reasoning off against budget zero without publishing model text
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/qwen-f2-reasoning-mode"; mkdir -m 700 "$OUT"; export OUT
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys
          sys.path.insert(0,str(pathlib.Path("bridge/reasoning").resolve()))
          from interface import build_prompt, model_wire_schema
          runtime=os.environ["RUNTIME_PATH"]; model=os.environ["MODEL_PATH"]; out=pathlib.Path(os.environ["OUT"])
          req={"schema":"LOUKSNA_REASONING_REQUEST/1.0","request_id":"F2-REA",
               "objective":"Identify the safe state. No execution is authorized.",
               "evidence_refs":["F1:36790409680"],"context":{"f1":"PASS"},
               "constraints":{"fail_closed":True,"execution_authority":False}}
          prompt=build_prompt(req); schema=model_wire_schema()
          def first_obj(s):
              dec=json.JSONDecoder()
              for idx,ch in enumerate(s):
                  if ch!="{": continue
                  try:
                      obj,end=dec.raw_decode(s[idx:])
                      if isinstance(obj,dict): return True,sorted(obj),end
                  except Exception: pass
              return False,[],None
          cases=[
            ("BUDGET_ZERO",["--reasoning-budget","0","--reasoning-format","deepseek"]),
            ("REASONING_OFF",["--reasoning","off","--reasoning-format","deepseek"]),
            ("REASONING_OFF_NO_FORMAT",["--reasoning","off"]),
            ("REASONING_ON_BUDGET_64",["--reasoning","on","--reasoning-budget","64","--reasoning-format","deepseek"])
          ]
          rows=[]
          for name,extra in cases:
              cmd=[runtime,"-m",model,"-p",prompt,"-n","512","--temp","0","--ctx-size","3072","--threads","2",
                   "--no-display-prompt","--simple-io","--single-turn","--json-schema",json.dumps(schema,separators=(",",":")),*extra]
              p=subprocess.run(cmd,stdin=subprocess.DEVNULL,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,timeout=90,check=False,shell=False)
              ok,keys,end=first_obj(p.stdout or "")
              rows.append({"case":name,"rc":p.returncode,"json_object":ok,"keys":keys,
                           "stdout_bytes":len((p.stdout or "").encode()),"stderr_bytes":len((p.stderr or "").encode()),
                           "stdout_sha256":hashlib.sha256((p.stdout or "").encode()).hexdigest(),
                           "stderr_sha256":hashlib.sha256((p.stderr or "").encode()).hexdigest(),
                           "has_think_open":"<think>" in (p.stdout or ""),"has_think_close":"</think>" in (p.stdout or "")})
          result={"schema":"LOUKSNA_QWEN_F2_REASONING_MODE_DIAG/1.0","status":"PASS","published_model_text":False,"cases":rows}
          (out/"DIAG.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qwen-f2-reasoning-mode-diagnostic
          path: ${{ runner.temp }}/qwen-f2-reasoning-mode/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
