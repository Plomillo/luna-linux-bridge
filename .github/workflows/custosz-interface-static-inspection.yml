name: "CUSTOSZ V7: identificar interfaz real sin ejecutar"
on:
  push:
    branches:
      - staging/custosz-v7-metaos-20260927
    paths:
      - .github/workflows/custosz-interface-static-inspection.yml
permissions:
  contents: read
jobs:
  inspect-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Imprimir funciones de interfaz del ZIPAPP, sin ejecutar el programa
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          roots=[
            (Path('artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz'),['custosz_v05_legacy.py','custosz_bootstrap_control.py','custosz_v07_native.py']),
            (Path('artifacts/custosz-v7/CUSTOSZ_RUNTIME_V1_SR_EXEC_BOUND_FME_01.b.pyz'),['runtime_core.py','sr_exec_bound_fme_01.py'])
          ]
          for file, names in roots:
              with zipfile.ZipFile(file) as archive:
                  for name in names:
                      src=archive.read(name).decode('utf-8')
                      print('SOURCE_BEGIN',file.name,name,'lines',len(src.splitlines()))
                      if len(src)>40000:
                          print('SOURCE_TOO_LARGE; FIRST_40000_CHARS')
                      print(src[:40000])
                      print('SOURCE_END',file.name,name)
          PY
