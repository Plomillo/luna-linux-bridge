name: "R4 PART4 R2 — governed internal WinRE repair preparation"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - mission-control/r4-part4-r2-winre-repair/**

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r4-part4-r2-winre-repair
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Forensic preflight and immutable checkpoint evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          DISK=/dev/nvme0n1
          P3=/dev/nvme0n1p3
          P4=/dev/nvme0n1p4
          WINROOT=/media/diegoignacionorambuenamiranda/Windows
          EFI=/boot/efi
          OUT="$RUNNER_TEMP/winre-audit"
          P4M="$RUNNER_TEMP/winre-p4"
          mkdir -p "$OUT" "$P4M"

          test "$(hostname)" = LOUKSNA
          test "$(id -un)" = diegoignacionorambuenamiranda
          sudo -k
          sudo -n true
          sudo -n /usr/sbin/visudo -c
          test "$(sudo -n /usr/sbin/blkid -p -s UUID -o value "$P3")" = F2848A148489DC0B
          test "$(sudo -n /usr/sbin/blkid -p -s UUID -o value "$P4")" = CADE667DDE666225
          test "$(findmnt -T "$WINROOT" -n -o SOURCE)" = "$P3"
          test "$(findmnt -T "$WINROOT" -n -o FSTYPE)" = ntfs3
          test -d "$WINROOT/PROYECTOS"
          mapfile -t top < <(find "$WINROOT" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort)
          test "${#top[@]}" -eq 1
          test "${top[0]}" = PROYECTOS

          sudo -n sfdisk --dump "$DISK" > "$OUT/PARTITION_TABLE.sfdisk"
          sudo -n efibootmgr -v > "$OUT/EFIBOOTMGR.txt"
          lsblk -b -J -o NAME,PATH,TYPE,SIZE,FSTYPE,MOUNTPOINTS,UUID,PARTUUID,START > "$OUT/LSBLK.json"

          sudo -n mount -t ntfs3 -o ro "$P4" "$P4M"
          trap 'sudo -n umount "$P4M" >/dev/null 2>&1 || true' EXIT

          WIM="$P4M/Recovery/WindowsRE/winre.wim"
          SDI="$P4M/Recovery/WindowsRE/boot.sdi"
          REAG="$P4M/Recovery/WindowsRE/ReAgent.xml"
          BCD_BOOT="$EFI/EFI/Microsoft/Boot/BCD"
          BCD_REC="$EFI/EFI/Microsoft/Recovery/BCD"
          BOOTMGFW="$EFI/EFI/Microsoft/Boot/bootmgfw.efi"

          for f in "$WIM" "$SDI" "$REAG" "$BCD_BOOT" "$BCD_REC" "$BOOTMGFW"; do
            test -f "$f"
          done

          sha256sum "$WIM" "$SDI" "$REAG" "$BCD_BOOT" "$BCD_REC" "$BOOTMGFW" > "$OUT/HASHES.sha256"
          cp "$REAG" "$OUT/ReAgent.xml"
          cp "$BCD_BOOT" "$OUT/BCD_BOOT.bin"
          cp "$BCD_REC" "$OUT/BCD_RECOVERY.bin"

          strings -el "$BCD_REC" > "$OUT/BCD_RECOVERY.strings.txt" || true
          strings -el "$BCD_BOOT" > "$OUT/BCD_BOOT.strings.txt" || true

          python3 - "$OUT" "$P4M" <<'PY'
          import datetime as dt, hashlib, json, pathlib, re, subprocess, sys
          out=pathlib.Path(sys.argv[1]); p4=pathlib.Path(sys.argv[2])
          reag=(out/"ReAgent.xml").read_text(encoding="utf-8",errors="replace")
          bcdrec=(out/"BCD_RECOVERY.strings.txt").read_text(encoding="utf-8",errors="replace")
          bcdboot=(out/"BCD_BOOT.strings.txt").read_text(encoding="utf-8",errors="replace")
          efib=(out/"EFIBOOTMGR.txt").read_text(encoding="utf-8",errors="replace")
          hashes={}
          for line in (out/"HASHES.sha256").read_text().splitlines():
              sha,path=line.split(None,1); hashes[path.strip()]=sha
          wim=p4/"Recovery/WindowsRE/winre.wim"
          sdi=p4/"Recovery/WindowsRE/boot.sdi"
          checks={
            "winre_wim_present":wim.is_file() and wim.stat().st_size==624309008,
            "boot_sdi_present":sdi.is_file() and sdi.stat().st_size==3170304,
            "reagent_present":"WinreBCD" in reag and "WinreLocation" in reag,
            "efi_bootmgfw_present":any("bootmgfw.efi" in k for k in hashes),
            "efi_boot_bcd_present":any(k.endswith("/EFI/Microsoft/Boot/BCD") for k in hashes),
            "efi_recovery_bcd_present":any(k.endswith("/EFI/Microsoft/Recovery/BCD") for k in hashes),
            "debian_boot_entry_present":"Boot0000* Debian" in efib,
            "debian_first_in_bootorder":"BootOrder: 0000" in efib,
            "recovery_bcd_nonempty":len(bcdrec.strip())>0,
            "boot_bcd_nonempty":len(bcdboot.strip())>0,
          }
          result={
            "schema":"LOUKSNA_R4_PART4_R2_WINRE_AUDIT/1.0",
            "status":"PASS" if all(checks.values()) else "HOLD",
            "mode":"READ_ONLY",
            "disk":"/dev/nvme0n1",
            "p3":"/dev/nvme0n1p3",
            "p3_uuid":"F2848A148489DC0B",
            "p4":"/dev/nvme0n1p4",
            "p4_uuid":"CADE667DDE666225",
            "protected_scope":"/media/diegoignacionorambuenamiranda/Windows/PROYECTOS",
            "checks":checks,
            "hashes":hashes,
            "reagent_excerpt":reag[:12000],
            "recovery_bcd_strings_sha256":hashlib.sha256(bcdrec.encode()).hexdigest(),
            "boot_bcd_strings_sha256":hashlib.sha256(bcdboot.encode()).hexdigest(),
            "partition_table_sha256":hashlib.sha256((out/"PARTITION_TABLE.sfdisk").read_bytes()).hexdigest(),
            "efibootmgr_sha256":hashlib.sha256((out/"EFIBOOTMGR.txt").read_bytes()).hexdigest(),
            "source_mutated":False,
            "canonical_mutation":False,
            "authority_transfer":False,
            "audited_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          (out/"WINRE_AUDIT.json").write_text(json.dumps(result,indent=2,sort_keys=True)+"\n")
          print(json.dumps(result,indent=2,sort_keys=True))
          if result["status"]!="PASS": raise SystemExit(20)
          PY

          sudo -n umount "$P4M"
          trap - EXIT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-winre-audit
          path: ${{ runner.temp }}/winre-audit/
          retention-days: 90
          compression-level: 0

  g23:
    needs: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-winre-audit
          path: ${{ runner.temp }}/audit
      - name: Independent validation
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$RUNNER_TEMP/audit/WINRE_AUDIT.json" "$RUNNER_TEMP/g23/G23_WINRE.json" <<'PY'
          import datetime as dt, hashlib, json, pathlib, sys
          p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); out=pathlib.Path(sys.argv[2])
          checks={
            "producer_pass":d.get("status")=="PASS",
            "read_only":d.get("mode")=="READ_ONLY" and d.get("source_mutated") is False,
            "disk_exact":d.get("disk")=="/dev/nvme0n1",
            "p3_exact":d.get("p3")=="/dev/nvme0n1p3" and d.get("p3_uuid")=="F2848A148489DC0B",
            "p4_exact":d.get("p4")=="/dev/nvme0n1p4" and d.get("p4_uuid")=="CADE667DDE666225",
            "protected_scope_exact":d.get("protected_scope")=="/media/diegoignacionorambuenamiranda/Windows/PROYECTOS",
            "all_checks":all(d.get("checks",{}).values()),
            "hash_inventory":len(d.get("hashes",{}))>=6,
            "partition_checkpoint":len(d.get("partition_table_sha256",""))==64,
            "efi_checkpoint":len(d.get("efibootmgr_sha256",""))==64,
            "canonical_mutation_false":d.get("canonical_mutation") is False,
            "authority_transfer_false":d.get("authority_transfer") is False,
          }
          ok=all(checks.values())
          r={
            "schema":"LOUKSNA_R4_PART4_R2_WINRE_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "scope":"INTERNAL_WINRE_BOOTABILITY_AUDIT",
            "audit_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "checks":checks,
            "repair_allowed":False,
            "g24_allowed":ok,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          out.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps(r,indent=2,sort_keys=True))
          if not ok: raise SystemExit(3)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-winre-g23
          path: ${{ runner.temp }}/g23/G23_WINRE.json
          retention-days: 90
          compression-level: 0

  g24:
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-part4-r2-winre-g23
          path: ${{ runner.temp }}/g23
      - name: Certify audited WinRE assets
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23_WINRE.json"
          test "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["status"])' "$G")" = PASS
          H="$(sha256sum "$G" | awk '{print $1}')"
          AUD="louksna-r4-part4-r2-winre:$H"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export H AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$G" "$RUNNER_TEMP/g24/G24_WINRE.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          g=json.loads(pathlib.Path(sys.argv[1]).read_text())
          token=os.environ["TOKEN"]; parts=token.split(".")
          if len(parts)!=3: raise SystemExit("OIDC_FORMAT")
          payload=parts[1]+"="*((4-len(parts[1])%4)%4)
          claims=json.loads(base64.urlsafe_b64decode(payload))
          aud=claims.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if claims.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          cert={
            "schema":"LOUKSNA_R4_PART4_R2_WINRE_G24/1.0",
            "status":"PASS",
            "scope":"INTERNAL_WINRE_ASSETS_AUDITED",
            "g23_sha256":os.environ["H"],
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(token.encode()).hexdigest(),
            "does_not_authorize_reboot":True,
            "does_not_authorize_bcd_mutation":True,
            "canonical_mutation":False,
            "authority_transfer":False,
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat()
          }
          pathlib.Path(sys.argv[2]).write_text(json.dumps(cert,indent=2,sort_keys=True)+"\n")
          print(json.dumps(cert,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-part4-r2-winre-g24
          path: ${{ runner.temp }}/g24/G24_WINRE.json
          retention-days: 90
          compression-level: 0
