name: R4 PART4 — exact unique ISO footprint
on:
  push:
    paths:
      - 'mission-control/r4-part4-unique-isos/**'
permissions:
  contents: read
jobs:
  calculate:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 5
    steps:
      - name: Calculate from existing hashed inventory
        shell: bash
        run: |
          set -Eeuo pipefail
          DB="$HOME/.local/state/louksna/r4-master-part1-part9/analysis/PART_4_PROYECTOS_DEDUP/proyectos.sqlite3"
          test -f "$DB"
          python3 - "$DB" <<'PY'
          import sqlite3,sys,json,os
          db=sys.argv[1]
          c=sqlite3.connect("file:"+db+"?mode=ro",uri=True)
          rows=c.execute("""SELECT sha256,size,COUNT(*) n,MIN(path) exemplar
                            FROM files
                            WHERE sha256 IS NOT NULL AND lower(path) LIKE '%.iso'
                            GROUP BY sha256,size ORDER BY size DESC""").fetchall()
          total_instances=sum(r[2] for r in rows)
          unique_bytes=sum(r[1] for r in rows)
          all_bytes=sum(r[1]*r[2] for r in rows)
          report={
            "schema":"LOUKSNA_R4_PART4_UNIQUE_ISO_FOOTPRINT/1.0",
            "mode":"READ_ONLY_EXISTING_HASHED_INVENTORY",
            "rehash_performed":False,"mutation_performed":False,"deletion_performed":False,
            "unique_iso_sha256_count":len(rows),
            "total_iso_instances":total_instances,
            "duplicate_iso_instances":total_instances-len(rows),
            "unique_iso_bytes":unique_bytes,
            "unique_iso_GB_decimal":unique_bytes/1_000_000_000,
            "unique_iso_GiB_binary":unique_bytes/(1024**3),
            "all_iso_instance_bytes":all_bytes,
            "duplicate_iso_redundant_bytes":all_bytes-unique_bytes,
            "unique_isos":[{"sha256":h,"size_bytes":s,"copies":n,"exemplar":p} for h,s,n,p in rows]
          }
          print(json.dumps(report,indent=2,ensure_ascii=False))
          PY
