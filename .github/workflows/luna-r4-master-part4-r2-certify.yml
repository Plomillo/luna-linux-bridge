name: "LUNA R4 master — PART4 R2 dedicated G23 G24 certification"

on:
  push:
    branches:
      - staging/luna-r4-master-part1-part9-20260929
    paths:
      - evidence/r4-master-part4-r2/**/MATERIAL_EVIDENCE.json

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: r4-master-part4-r2-cert-${{ github.sha }}
  cancel-in-progress: false

jobs:
  g23:
    name: G23 validate exact PART4-R2 final evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve and independently validate R2 evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^evidence/r4-master-part4-r2/.*/PART_4/MATERIAL_EVIDENCE.json$' || true)
          test "${#files[@]}" -eq 1
          E="${files[0]}"
          mkdir -p "$RUNNER_TEMP/g23"
          python3 - "$E" "$RUNNER_TEMP/g23/G23.json" <<'PY'
          import datetime as dt,hashlib,json,pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2]); d=json.loads(p.read_text())
          checks0=d.get("checks",{}); details=d.get("details",{}); hg=d.get("human_gates",{})
          def h64(v): return isinstance(v,str) and bool(re.fullmatch(r"[0-9a-f]{64}",v))
          checks={
            "schema":d.get("schema")=="LOUKSNA_R4_PART_MATERIAL_EVIDENCE/1.0",
            "part":d.get("part")=="PART_4",
            "status":d.get("status")=="PASS",
            "authority":d.get("authority")=="Louksna.md",
            "canonical_mutation_false":d.get("canonical_mutation") is False,
            "authority_transfer_false":d.get("authority_transfer") is False,
            "self_certified_false":d.get("self_certified") is False,
            "validation_pass":d.get("validation")=="PASS",
            "non_regression_pass":d.get("non_regression")=="PASS",
            "traceability":bool(d.get("operation_id")) and bool(d.get("checkpoint")) and bool(d.get("rollback_pointer")),
            "previous_part_bound":h64(d.get("previous_part_g24_sha256")),
            "h2":hg.get("H2") is True,
            "h4":hg.get("H4") is True,
            "r2_amendment":d.get("operational_amendment")=="PART4-R2-20260929",
            "two_backups_explicitly_superseded":d.get("two_verified_backups")=="SUPERSEDED_BY_PART4_R2",
            "restore_proof_explicitly_superseded":d.get("restore_proof")=="SUPERSEDED_BY_PART4_R2",
            "destructive_scope_prevalidated":d.get("destructive_scope_prevalidated") is True,
            "freeze_g24":checks0.get("freeze_g24") is True,
            "purge_g23_g24":checks0.get("purge_scope_g23_g24") is True,
            "post_purge_integrity":checks0.get("post_purge_integrity") is True,
            "projects_migrated":checks0.get("projects_migrated_hash_equivalent") is True,
            "ntfs_retired":checks0.get("ntfs_retired") is True,
            "final_linux_layout":checks0.get("final_linux_layout") is True,
            "part4_r2_final_g24":checks0.get("part4_r2_final_g24") is True,
            "final_merge_g24":checks0.get("final_merge_g24") is True,
            "verified_root":checks0.get("verified_root_on_consolidated_linux") is True,
            "final_merge_digest":h64(details.get("final_merge_g24_sha256")),
            "storage_migration_digest":h64(details.get("storage_migration_g24_sha256")),
            "retirement_digest":h64(details.get("p2_p4_retirement_g24_sha256")),
            "lost_found_exception_certified":details.get("lost_found_exception_certified") is True,
            "migration_not_replayed":details.get("migration_replayed") is False,
            "final_merge_required":details.get("part4_close_requires_final_merge_g24") is True
          }
          ok=all(checks.values())
          q={
            "schema":"LOUKSNA_R4_PART4_R2_MASTER_G23/1.0",
            "status":"PASS" if ok else "HOLD",
            "part":"PART_4",
            "evidence_path":p.as_posix(),
            "evidence_sha256":hashlib.sha256(p.read_bytes()).hexdigest(),
            "checks":checks,
            "validated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
            "independent_reader":"GITHUB_HOSTED_UBUNTU_24_04",
            "repair_allowed":False,
            "g24_allowed":ok
          }
          out.write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          if not ok: raise SystemExit(23)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-master-part4-r2-g23
          path: ${{ runner.temp }}/g23/G23.json
          retention-days: 90
          compression-level: 0

  g24:
    name: G24 certify exact PART4-R2 state
    needs: g23
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: r4-master-part4-r2-g23
          path: ${{ runner.temp }}/g23
      - name: Issue digest-bound G24
        shell: bash
        run: |
          set -Eeuo pipefail
          G="$RUNNER_TEMP/g23/G23.json"
          test "$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["status"] if d.get("g24_allowed") else "HOLD")' "$G")" = PASS
          DIGEST="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["evidence_sha256"])' "$G")"
          G23_SHA="$(sha256sum "$G"|awk '{print $1}')"
          AUD="louksna-r4-master-part4-r2-g24:$DIGEST:$G23_SHA"
          RESP="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUD")"
          TOKEN="$(python3 -c 'import json,sys;print(json.loads(sys.argv[1])["value"])' "$RESP")"
          export DIGEST G23_SHA AUD TOKEN
          mkdir -p "$RUNNER_TEMP/g24"
          python3 - "$RUNNER_TEMP/g24/G24.json" <<'PY'
          import base64,datetime as dt,hashlib,json,os,pathlib,sys
          t=os.environ["TOKEN"]; parts=t.split(".")
          if len(parts)!=3: raise SystemExit("OIDC_FORMAT")
          p=parts[1]+"="*((4-len(parts[1])%4)%4); c=json.loads(base64.urlsafe_b64decode(p))
          aud=c.get("aud"); exp=os.environ["AUD"]
          if aud!=exp and not (isinstance(aud,list) and exp in aud): raise SystemExit("OIDC_AUDIENCE")
          if c.get("repository")!="Plomillo/luna-linux-bridge": raise SystemExit("OIDC_REPOSITORY")
          q={
            "schema":"LOUKSNA_R4_PART_G24/1.0",
            "status":"PASS",
            "part":"PART_4",
            "evidence_sha256":os.environ["DIGEST"],
            "g23_status":"PASS",
            "g23_sha256":os.environ["G23_SHA"],
            "authority_authenticated":True,
            "authority_reference":"GITHUB_OIDC_JWT_SHA256:"+hashlib.sha256(t.encode()).hexdigest(),
            "certified_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
            "canonical_mutation":False,
            "authority_transfer":False,
            "certificate_scope":"LUNA_R4_PART4_R2_ACTUAL_FINAL_EVIDENCE",
            "certification_propagated":False
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(q,indent=2,sort_keys=True)+"\n")
          print(json.dumps(q,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r4-master-g24
          path: ${{ runner.temp }}/g24/G24.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
