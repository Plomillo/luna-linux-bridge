name: n39-jasp-only-capture

on:
  push:
    branches:
      - lunita/entregas-3-4-n27-20261116
    paths:
      - ".github/workflows/n39-jasp-only-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-jasp:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lunita/entregas-3-4-n27-20261116
          fetch-depth: 0

      - name: Install only JASP desktop capture dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool wmctrl scrot dbus-x11 flatpak openbox python3-pip python3-tk python3-pil fonts-liberation

      - name: Install official JASP from Flathub
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y flathub org.jaspstats.JASP
          flatpak info org.jaspstats.JASP

      - name: Open the JASP descriptives output in the official GUI and capture
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          QT_X11_NO_MITSHM: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
          QTWEBENGINE_DISABLE_SANDBOX: "1"
        run: |
          python3 -m pip install --user --break-system-packages pyautogui
          mkdir -p /tmp/xdg-runtime
          chmod 700 /tmp/xdg-runtime
          export XDG_RUNTIME_DIR=/tmp/xdg-runtime
          touch "$HOME/.Xauthority"
          chmod 600 "$HOME/.Xauthority"
          export XAUTHORITY="$HOME/.Xauthority"
          Xvfb :99 -screen 0 1600x1200x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          sleep 3
          export DISPLAY=:99
          openbox --sm-disable >/tmp/openbox.log 2>&1 &
          for attempt in $(seq 1 30); do wmctrl -m >/dev/null 2>&1 && break; sleep 1; done
          dbus-run-session -- python3 - <<'PY'
          import os, subprocess, time
          from pathlib import Path
          import pyautogui

          root = Path(os.environ["GITHUB_WORKSPACE"])
          out = root / "academico/entregas-3-4/n39/evidencia-gui"
          result = root / "academico/entregas-3-4/n39/salidas/descriptivos_jasp.csv"
          target = out / "03_JASP_n39.png"
          log = out / "jasp-only-capture.log"
          out.mkdir(parents=True, exist_ok=True)
          if not result.is_file():
              raise SystemExit(f"Missing JASP engine output: {result}")

          p = subprocess.Popen(
              ["flatpak", "run", "org.jaspstats.JASP"],
              stdout=open(log, "w"), stderr=subprocess.STDOUT, start_new_session=True
          )
          pyautogui.FAILSAFE = False
          pyautogui.PAUSE = 0.6

          def get_windows():
              return subprocess.run(["wmctrl", "-lx"], text=True, capture_output=True).stdout

          def focus_jasp(timeout=150):
              end = time.time() + timeout
              while time.time() < end:
                  listing = get_windows()
                  candidates = [x.split()[0] for x in listing.splitlines() if "jasp.jasp" in x.lower()]
                  if candidates:
                      wid = candidates[-1]
                      subprocess.run(["wmctrl", "-i", "-a", wid], check=False)
                      subprocess.run(["xdotool", "windowraise", wid], check=False)
                      subprocess.run(["xdotool", "windowactivate", "--sync", wid], check=False)
                      subprocess.run(["wmctrl", "-i", "-r", wid, "-b", "add,maximized_vert,maximized_horz"], check=False)
                      subprocess.run(["wmctrl", "-i", "-r", wid, "-e", "0,0,0,1600,1200"], check=False)
                      time.sleep(4)
                      return wid
                  time.sleep(2)
              raise RuntimeError("JASP window did not appear")

          wid = focus_jasp()
          # Close JASP first-run update prompt using keyboard focus. The Yes button
          # has initial focus; Right selects No, Enter confirms without network use.
          time.sleep(5)
          pyautogui.press("right")
          pyautogui.press("enter")
          time.sleep(6)
          focus_jasp()

          # Open the JASP navigation panel and select Open > Computer.
          # Coordinates are for the fixed 1600x1200 virtual desktop.
          # Ensure the maximized window owns the full 1600x1200 desktop.
          wid = focus_jasp()
          pyautogui.click(28, 48)      # hamburger
          time.sleep(2)
          pyautogui.click(42, 165)     # Open
          time.sleep(2)
          pyautogui.click(210, 182)    # Computer
          time.sleep(4)
          pyautogui.click(336, 160)    # Browse (Recent Folders > Computer)
          time.sleep(5)
          pyautogui.hotkey("ctrl", "l")
          time.sleep(1)
          pyautogui.write(str(result), interval=0.003)
          pyautogui.press("enter")
          time.sleep(3)
          pyautogui.press("enter")
          time.sleep(25)
          wid = focus_jasp()
          time.sleep(4)

          # Capture the actual JASP window desktop; require a substantial PNG.
          target.unlink(missing_ok=True)
          subprocess.run(["scrot", str(target)], check=True)
          if not target.is_file() or target.stat().st_size < 10000:
              raise RuntimeError("JASP screenshot missing or too small")
          (out / "jasp-only-window-list.txt").write_text(get_windows(), encoding="utf-8")
          with (out / "captura_aplicaciones.txt").open("a", encoding="utf-8") as f:
              f.write("\nJASP_only_recapture=success\nJASP_output_file=" + str(result) + "\n")
          PY

      - name: Validate only JASP screenshot
        run: |
          file academico/entregas-3-4/n39/evidencia-gui/03_JASP_n39.png
          test -s academico/entregas-3-4/n39/evidencia-gui/03_JASP_n39.png

      - name: Commit only the JASP recapture
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academico/entregas-3-4/n39/evidencia-gui/03_JASP_n39.png \
                  academico/entregas-3-4/n39/evidencia-gui/jasp-only-capture.log \
                  academico/entregas-3-4/n39/evidencia-gui/jasp-only-window-list.txt \
                  academico/entregas-3-4/n39/evidencia-gui/captura_aplicaciones.txt
          git commit -m "Corrige la captura nativa de JASP para N=39"
          git push origin HEAD:lunita/entregas-3-4-n27-20261116
