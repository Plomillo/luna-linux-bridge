name: LOUKSNAPG — resume from checkpoint at phase 4

on:
  push:
    branches:
      - louksnapg/phase4-resume-20261028
    paths:
      - tools/louksnapg_phase4_resume.py
      - .github/workflows/louksnapg-phase4-resume.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: louksnapg-phase4-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase-4-diagnosis:
    name: Phase 4 — forensic diagnosis without repeating phases 1–3
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONNOUSERSITE: "1"
      LOUKSNAPG_BASELINE_SHA: "66f0f0d22f5e7f7d207b191b39e997d1253a3866"
      LOUKSNAPG_BASELINE_RUN_ID: "40614237594"
      LOUKSNAPG_BASELINE_ARTIFACT: "louksnapg-phase2-evidence-40614237594"

    steps:
      - name: Check out only the continuation branch and preserve candidate baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 10
          lfs: false
          persist-credentials: true
          clean: true

      - name: Select pinned Python runtime
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install bounded metadata inspection tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git-lfs

      - name: Reuse prior evidence and enforce checkpoint invariants
        id: checkpoint
        shell: bash
        run: |
          set -euo pipefail
          BASE="$LOUKSNAPG_BASELINE_SHA"
          git cat-file -e "$LOUKSNAPG_BASELINE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          if ! git diff --quiet "$BASE" HEAD -- cajita-luna-runtime; then
            echo "::error::Runtime content changed from the checkpoint candidate; phase 4 refuses to mutate or silently replace it."
            exit 2
          fi
          if git diff --name-only "$BASE" HEAD | grep -E '^(tools/louksnapg_phase2_functional\.py|\.github/workflows/louksnapg-phase2-functional\.yml|tests/test_cajita_router\.py|tests/test_cajita_antiparalysis\.py|tests/test_cajita_task_adapters\.py)$'; then
            echo "::error::This continuation branch modifies an input to the old phase-1–3 workflow; refusing to risk a duplicate run."
            exit 2
          fi
          printf 'PHASE_1_TO_3_REUSED=true\n'
          printf 'BASELINE_SHA=%s\n' "$BASE"
          printf 'CONTINUATION_SHA=%s\n' "$(git rev-parse HEAD)"
          printf 'RUNTIME_TREE_UNCHANGED=true\n'
          mkdir -p "$RUNNER_TEMP/louksnapg-phase4/prior-evidence"

      - name: Download the exact previous phase-2 checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: louksnapg-phase2-evidence-40614237594
          repository: ${{ github.repository }}
          run-id: 40614237594
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/louksnapg-phase4/prior-evidence

      - name: Materialize and verify only the four already-registered candidate weights
        id: candidate-weights
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          LFS_INCLUDE='cajita-luna-runtime/1. Cerebro/model.safetensors,cajita-luna-runtime/3. Transcripción/model.safetensors,cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors,cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors'
          git lfs pull --include="$LFS_INCLUDE" --exclude="" origin "$GITHUB_REF_NAME"
          echo "CANDIDATE_LFS_MATERIALIZATION=COMPLETE"
          echo "MODEL_INFERENCE=NOT_RUN"

      - name: Run phase-4 bounded forensic diagnosis against the pinned candidate
        id: phase4
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$(find "$RUNNER_TEMP/louksnapg-phase4/prior-evidence" -type f -name 'LOUKSNAPG_PHASE2_EVIDENCE.json' -print -quit)"
          if [ -z "$EVIDENCE" ]; then
            echo "::error::The prior phase-2 evidence artifact did not contain LOUKSNAPG_PHASE2_EVIDENCE.json."
            find "$RUNNER_TEMP/louksnapg-phase4/prior-evidence" -maxdepth 3 -type f -printf '%P\n'
            exit 3
          fi
          python tools/louksnapg_phase4_resume.py \
            --root "$GITHUB_WORKSPACE" \
            --evidence "$EVIDENCE" \
            --out "$RUNNER_TEMP/louksnapg-phase4/LOUKSNAPG_PHASE4_DIAGNOSIS.json" \
            | tee "$RUNNER_TEMP/louksnapg-phase4/phase4-event.jsonl"

      - name: Publish phase-4 result and explicit pending gate
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "## LOUKSNAPG — checkpoint continuation"
            echo
            echo "- Baseline candidate: $LOUKSNAPG_BASELINE_SHA"
            echo "- Phases 1–3: reused from existing evidence; not re-executed."
            echo "- Global certification: NOT GRANTED."
            REPORT="$RUNNER_TEMP/louksnapg-phase4/LOUKSNAPG_PHASE4_DIAGNOSIS.json"
            if [ -f "$REPORT" ]; then
              python - "$REPORT" <<'PY'
          import json, sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          p=d.get("phase_progress",{})
          r=d.get("root_cause_assessment",{})
          print(f"- Phase 4: {p.get('phase_4','UNKNOWN')}")
          print(f"- Rank-1 factor hypothesis corroborated for all failed domains: {r.get('rank1_factor_compression_across_all_four_failed_domains',False)}")
          print(f"- Phase 5 targeted post-repair tests: {p.get('phase_5_targeted_post_repair_tests','UNKNOWN')}")
          print(f"- Next action: {p.get('next_action','UNKNOWN')}")
          PY
            else
              echo "- Phase 4: FAILED_TO_PRODUCE_DIAGNOSTIC; no phase completion inferred."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload phase-4 evidence and continuation checkpoint
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg-phase4-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/louksnapg-phase4/LOUKSNAPG_PHASE4_DIAGNOSIS.json
            ${{ runner.temp }}/louksnapg-phase4/phase4-event.jsonl
          if-no-files-found: warn
          retention-days: 90
