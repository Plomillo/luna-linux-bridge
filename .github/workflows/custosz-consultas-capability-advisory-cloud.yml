name: "CUSTOSZ — consultas capability advisory cloud fallback"

on:
  push:
    branches:
      - staging/custosz-consultas-capability-advisory-20261002
    paths:
      - .github/workflows/custosz-consultas-capability-advisory-cloud.yml

permissions:
  contents: read

jobs:
  consult:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pinned CUSTOSZ surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Ask checked-in CUSTOSZ read-only
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/consultas-capability-output"
          mkdir -p "$OUT"
          CUSTOSZ="$GITHUB_WORKSPACE/artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz"
          test -f "$CUSTOSZ"
          ACTUAL_SHA="$(sha256sum "$CUSTOSZ" | awk '{print $1}')"
          EXPECTED_SHA="dacf1f8c13b2fcbfc617cf0d4d780b30502c13395224691e6b0f05f53d9816a2"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          python3 - "$OUT" "$CUSTOSZ" "$ACTUAL_SHA" <<'PY'
          import json, os, pathlib, sys, traceback
          out=pathlib.Path(sys.argv[1])
          custosz=pathlib.Path(sys.argv[2])
          custosz_sha=sys.argv[3]
          project_root=pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          prompt=r"""
          CONSULTA ARQUITECTÓNICA READ_ONLY — CAPACIDAD PARA ATENDER CONSULTAS.

          ¿Puede CUSTOSZ encargarse de investigar y responder la futura categoría
          consultas/ del buzón, incluyendo buscar evidencia, revisar repositorio,
          estudiar causas, comparar alternativas y devolver una respuesta trazable,
          sin convertir una consulta en misión material ni modificar el sistema?

          Responder operativamente:
          - CAN_HANDLE_CONSULTATION_RESEARCH = YES | CONDITIONAL | NO.
          - tipos de investigación soportados;
          - fuentes/proveedores disponibles vs. bindings adicionales;
          - acciones prohibidas en consulta;
          - provenance/traceability/auditability/evidence;
          - estados ANSWERED/HOLD/REJECTED;
          - stop rule anti-bucle;
          - conducta ante evidencia/fuente faltante;
          - respuesta humana en castellano + artefacto estructurado;
          - integración mínima detrás de consultas/ sin tocar missions/;
          - pasos exactos para generalizar este advisory a canal de consultas.

          Restricciones:
          READ_ONLY_ADVISORY; execution_authorized=false; mutation_authorized=false;
          no modificar main, Louksna.md, missions/ ni arquitectura canónica;
          no autocertificar; no fabricar PASS; no afirmar accesos inexistentes;
          no promoción implícita CONSULTA->MISIÓN;
          Louksna.md conserva autoridad;
          EXTEND_DO_NOT_REPLACE; FAIL_CLOSED; NO_SILENT_OPERATIONS;
          gaps explícitos y HOLD+NEXT cuando falte acceso/evidencia.
          """
          os.environ["CUSTOSZ_STATE_DIR"]=str(out/"ephemeral-custosz-state")
          sys.path.insert(0,str(custosz))
          import custosz_v05_legacy as w
          def workspace_adapter(): return project_root
          def discover_adapter():
              return {"workspace":str(project_root),"projects":{"LUNA_PROJECT":{"status":"RESOLVED","path":str(project_root),"score":999}}}
          w.workspace=workspace_adapter
          w.discover=discover_adapter
          result={
            "schema":"LOUKSNA_CONSULTAS_CAPABILITY_ADVISORY/1.0",
            "mode":"READ_ONLY_ADVISORY",
            "execution_authorized":False,
            "mutation_authorized":False,
            "authority":"Louksna.md",
            "workspace":str(project_root),
            "custosz_sha256":custosz_sha,
            "runner":"GITHUB_HOSTED_FALLBACK"
          }
          try:
              result["architecture"]=w.architect(prompt,"LUNA_PROJECT")
          except Exception as e:
              result["architecture_error"]=type(e).__name__+":"+str(e)
              result["architecture_traceback"]=traceback.format_exc()
          try:
              result["reasoning_policy"]=w.reasoning_policy(prompt,"LUNA_PROJECT")
          except Exception as e:
              result["reasoning_policy_error"]=type(e).__name__+":"+str(e)
              result["reasoning_policy_traceback"]=traceback.format_exc()
          p=out/"CUSTOSZ_CONSULTAS_CAPABILITY_ADVISORY.json"
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Preserve advisory response
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: custosz-consultas-capability-advisory-cloud
          path: consultas-capability-output/CUSTOSZ_CONSULTAS_CAPABILITY_ADVISORY.json
          if-no-files-found: error
          retention-days: 30
