name: "SUPER1200 repository implementation — GitHub-hosted resume 4"

on:
  push:
    branches:
      - staging/custosz-mission-mailbox-20260928
    paths:
      - .github/workflows/super1200-repository-resume-4.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: super1200-repository-implementation
  cancel-in-progress: true

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corrected mission plane
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: mission

      - name: Checkout exact 1200 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: bf683949eaa52087725a672d1cc0297b5a09e346
          persist-credentials: false
          path: capabilities

      - name: Checkout repository-owned work branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: custosz/super-1200-implementation-20261007
          fetch-depth: 0
          persist-credentials: true
          path: target

      - name: Revalidate ownership and control planes
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C target rev-parse HEAD)" = "84fbec427b7e067cc226ba868fbcd7c9675a862b"
          test ! -e target/implementation/super1200
          python3 -B -I mission/artifacts/custosz-v7/CUSTOSZ.v07.f04_b.pyz v07-selftest
          python3 - <<'PY'
          import hashlib,sys,tempfile
          from pathlib import Path
          runtime=Path("mission/artifacts/custosz-v7/CUSTOSZ_RUNTIME_V1_SR_EXEC_BOUND_FME_01.b.pyz").resolve()
          authority=Path("target/Louksna.md").resolve()
          sys.path.insert(0,str(runtime))
          from runtime_core import Runtime
          result=Runtime(Path(tempfile.mkdtemp())/"state",authority,hashlib.sha256(authority.read_bytes()).hexdigest()).selftest()
          assert result.get("status")=="PASS",result
          raw=Path("mission/artifacts/custosz-v7/MetaOS.wasm").read_bytes()
          for token in (b"implementation-gate",b"implementation-authorized",b"active-allowed",b"network-default-deny"):
              assert token in raw
          print("SUPER1200_TELEMETRY CONTROL_PLANES=PASS CAPABILITY_OWNER=REPOSITORY G23=READINESS G24=READINESS")
          PY

      - name: Resume live repository-owned domain stream
        shell: bash
        env:
          TARGET_ROOT: ${{ github.workspace }}/target
          CAP_ROOT: ${{ github.workspace }}/capabilities
          OUT_DIR: ${{ runner.temp }}/super1200
        run: |
          set -Eeuo pipefail
          nice -n 10 python3 -B -I mission/scripts/missions/super1200_repository_materializer.py

      - name: Validate and persist repository implementation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -B -I target/implementation/super1200/tests/test_shared.py
          cd target
          git add implementation/super1200
          BAD="$(git diff --cached --name-only | grep -v '^implementation/super1200/' || true)"
          test -z "$BAD"
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git commit -m "feat(super1200): begin repository-owned governed implementation"
          git push origin HEAD:refs/heads/custosz/super-1200-implementation-20261007
          echo "SUPER1200_TELEMETRY REPOSITORY_PERSISTENCE=PASS"

      - name: Preserve telemetry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: super1200-live-telemetry-resume-4
          path: ${{ runner.temp }}/super1200
          if-no-files-found: warn
          retention-days: 90
