# CONTINUITY_RETRY_P04_SUBSTRATE_ISOLATION
name: "LOUKSNA V0.4 — continuity supervisor"

on:
  push:
    branches: [work/louksna-zd-v04-master-20261007]
    paths:
      - ".github/workflows/louksna-zd-v04-continuity-supervisor.yml"
      - "continuity/signals/**"
  repository_dispatch:
    types: [louksna_continuity_watch]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: louksna-v04-continuity-supervisor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supervise:
    outputs:
      dispatch: ${{ steps.route.outputs.dispatch }}
      next_point: ${{ steps.route.outputs.next_point }}
      transition_id: ${{ steps.route.outputs.transition_id }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: work/louksna-zd-v04-master-20261007
          fetch-depth: 0
          persist-credentials: true
      - name: Run metacognitive continuity supervisor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          python3 -B scripts/continuity/louksna_zd_v04_supervisor.py
      - name: Route continuation
        id: route
        run: |
          python3 - <<'PY'
          import json, os
          s=json.load(open("continuity/STATE.json"))
          with open(os.environ["GITHUB_OUTPUT"],"a") as o:
              o.write("dispatch=" + ("true" if s.get("status")=="DISPATCH_REQUIRED" else "false") + "\n")
              o.write("next_point=" + s.get("next_point","") + "\n")
              o.write("transition_id=" + s.get("transition_id","") + "\n")
          PY
      - name: Persist checkpoint report and state
        if: always()
        run: |
          set -Eeuo pipefail
          git add continuity/STATE.json continuity/CONTINUITY_REPORT.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "custosz-v7-runtime-bot"
          git config user.email "custosz-v7-runtime-bot@users.noreply.github.com"
          git commit -m "evidence(louksna): persist continuity supervisor state"
          git pull --rebase origin work/louksna-zd-v04-master-20261007
          git push origin HEAD:work/louksna-zd-v04-master-20261007
  continue:
    needs: supervise
    if: needs.supervise.outputs.dispatch == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/louksna-zd-v04-continuation-worker.yml
    with:
      transition_id: ${{ needs.supervise.outputs.transition_id }}
      next_point: ${{ needs.supervise.outputs.next_point }}

  meta:
    needs: supervise
    if: always()
    permissions:
      contents: write
    uses: ./.github/workflows/louksna-zd-v04-meta-supervisor.yml
