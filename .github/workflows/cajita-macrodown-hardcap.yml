      - name: Commit final size-gate and reproducible-build evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            "cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json" \
            "cajita-luna-runtime/MACRODOWN_MANIFEST.json" \
            "docs/cajita-luna/CAJITA_RUNTIME_Q4_REBALANCE_20261023.json" \
            "docs/cajita-luna/CAJITA_MACRODOWN_BUILD_20261023.json" \
            "docs/cajita-luna/CAJITA_INVENTORY_AUDIT_20261024.json"
          if git diff --cached --quiet; then
            echo "CAJITA_FINAL_BUILD_EVIDENCE_ALREADY_CURRENT"
          else
            git diff --cached --check
            git diff --cached --stat
            git commit -m "Record Cajita final raw and Macrodown size-gate evidence"
            # Other governed workflows may advance main while this build is
            # producing reports. Rebase only the evidence commit; any conflict
            # fails closed so a newer report is never silently overwritten.
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "CAJITA_EVIDENCE_REBASE_CONFLICT_FAIL_CLOSED" >&2
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "CAJITA_EVIDENCE_PUSH=PASS attempt=$attempt"
                pushed=true
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "CAJITA_EVIDENCE_NON_FAST_FORWARD_RETRIES_EXHAUSTED" >&2
                exit 1
              fi
              echo "CAJITA_EVIDENCE_PUSH_RETRY=$attempt" >&2
            done
            test "$pushed" = true
          fi

      - name: Enforce final raw and reproducible archive gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("docs/cajita-luna/CAJITA_RUNTIME_Q4_REBALANCE_20261023.json").read_text())
          b=json.loads(Path("docs/cajita-luna/CAJITA_MACRODOWN_BUILD_20261023.json").read_text())
          p=json.loads(Path("cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json").read_text())
          raw_input_ceiling=1_500_000_000
          archive_cap=470_000_000
          print(json.dumps({
              "raw_payload_bytes":r["runtime_bytes_after"],
              "raw_input_ceiling_bytes":raw_input_ceiling,
              "raw_payload_target_bytes":b.get("raw_payload_target_bytes",archive_cap),
              "raw_payload_target_gate":b.get("raw_payload_target_gate"),
              "macrodown_gross_raw_payload_bytes":b["gross_raw_payload_bytes_including_manifest"],
              "macrodown_archive_bytes":b["archive_bytes"],
              "archive_cap_bytes":archive_cap,
              "raw_input_gate":r["size_gate"],
              "macrodown_build":b["build_status"],
              "archive_gate":b["archive_size_gate"],
              "registered_assets":p["runtime_size_gate"]["registered_asset_count"],
              "certification":b["certification"]
          },indent=2))
          if r["size_gate"]!="PASS" or b["build_status"]!="PASS" or b["archive_size_gate"]!="PASS":
              raise SystemExit("CAJITA_FINAL_HARD_GATE_FAIL")
          if int(r["runtime_bytes_after"])>raw_input_ceiling or int(b["gross_raw_payload_bytes_including_manifest"])>raw_input_ceiling or int(b["archive_bytes"])>archive_cap:
              raise SystemExit("CAJITA_FINAL_BYTE_LIMIT_EXCEEDED")
          if int(p["runtime_size_gate"]["registered_asset_count"])!=10:
              raise SystemExit("CAJITA_REGISTERED_ASSET_COUNT_MISMATCH")
          PY
