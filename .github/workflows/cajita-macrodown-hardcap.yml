name: Cajita — reproducible Macrodown build and final size gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cajita-macrodown-hardcap.yml"
      - "cajita-luna-runtime/cajita_router.py"
      - "cajita-luna-runtime/command_subdomain_routing.json"
      - "cajita-luna-runtime/CajitadeLuna.md"
      - "cajita-luna-runtime/reproduce_macrodown.py"
      - "cajita-luna-runtime/cajita_tokenizer_materializer.py"
      - "cajita-luna-runtime/cajita_task_adapters.py"
      - "cajita-luna-runtime/1. Cerebro/cerebro_180mb_runtime.py"
      - "cajita-luna-runtime/3. Transcripción/lowrank_runtime.py"
      - "cajita-luna-runtime/4. Traductor Inteligente/Traducción general/lowrank_runtime.py"
      - "cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/docling_30mb_runtime_v1.py"
      - "cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/lowrank_runtime_v2.py"
      - "tests/test_cajita_tokenizer_materializer.py"
      - "cajita-luna-runtime/cajita_externalized_packaging.py"
      - "cajita-luna-runtime/cajita_externalized_asset_loader.py"
      - "cajita-luna-runtime/module_registry.json"
      - "cajita-luna-runtime/command_subdomain_routing.json"
      - "cajita-luna-runtime/CAJITA_DISTRIBUTION_ROUTING.json"
      - "docs/cajita-luna/CAJITA_RUNTIME_Q4_REBALANCE_20261023.json"
      - "integrations/kestra/flows/20-cajita-runtime-size-gate.yml"
      - "cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json"
      - "cajita-luna-runtime/2. Orquestación/Orquestador/punto.json"
      - "cajita-luna-runtime/2. Orquestación/Orquestador/CLIS.txt"
      - "cajita-luna-runtime/2. Orquestación/Orquestador/CLIs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cajita-macrodown-hardcap-main
  cancel-in-progress: false

jobs:
  build-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout main without blanket LFS download
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: true

      - name: Materialize only Cajita's registered model payloads
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          LFS_INCLUDE='cajita-luna-runtime/1. Cerebro/model.safetensors,cajita-luna-runtime/3. Transcripción/model.safetensors,cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors,cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/quantized_weights.bin,cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors,cajita-luna-runtime/6. Sistema Inteligente/Anti-Alucinaciones/model.onnx'
          git lfs pull --include="$LFS_INCLUDE" --exclude="" origin main
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          model_files = [
              "cajita-luna-runtime/1. Cerebro/model.safetensors",
              "cajita-luna-runtime/3. Transcripción/model.safetensors",
              "cajita-luna-runtime/4. Traductor Inteligente/Traducción general/model.safetensors",
              "cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/quantized_weights.bin",
              "cajita-luna-runtime/6. Sistema Inteligente/Análisis Avanzado/model.safetensors",
              "cajita-luna-runtime/6. Sistema Inteligente/Anti-Alucinaciones/model.onnx",
          ]
          for item in model_files:
              p = Path(item)
              if not p.is_file() or p.stat().st_size < 4096:
                  raise SystemExit("LFS_MODEL_PAYLOAD_NOT_MATERIALIZED:" + item)
              if p.read_bytes()[:80].startswith(b"version https://git-lfs.github.com/spec/v1"):
                  raise SystemExit("LFS_MODEL_POINTER_REMAINS:" + item)
          placement = json.loads(Path("cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json").read_text(encoding="utf-8"))
          assets = placement.get("assets", [])
          expected_ids = {
              "APACHE_JENA_6_2_0", "PLAYWRIGHT_1_63_0_SOURCE", "ONNX_RUNTIME_1_29_0_CP311",
              "DAGGER_0_21_8_LINUX_AMD64", "OPA_STATIC_LINUX_AMD64_CANDIDATE",
              "RQLITE_10_2_7_LINUX_AMD64", "SQLITE_SOURCE_3_53_4",
              "CMAKE_4_4_3_WINDOWS_X64_OFFICIAL_BASE", "AVALONIA_12_1_1_NUGET", "TAURI_2_11_5_SOURCE_ZIP",
          }
          if len(assets) != 10 or {a.get("id") for a in assets} != expected_ids:
              raise SystemExit("EXTERNALIZED_ASSET_ID_SET_INVALID")
          for asset in assets:
              meta = asset["compact_runtime_container"]
              source = Path("externalized-assets-staging/optimized-containers") / Path(meta["path"]).name
              if source.is_symlink() or not source.is_file():
                  raise SystemExit("EXTERNALIZED_STAGING_CONTAINER_MISSING:" + str(source))
              digest = hashlib.sha256()
              size = 0
              with source.open("rb") as stream:
                  for block in iter(lambda: stream.read(4 * 1024 * 1024), b""):
                      digest.update(block)
                      size += len(block)
              if size != meta["size_bytes"] or digest.hexdigest() != meta["sha256"]:
                  raise SystemExit("EXTERNALIZED_STAGING_CONTAINER_IDENTITY_MISMATCH:" + asset["id"])
              with source.open("rb") as stream:
                  if stream.read(80).startswith(b"version https://git-lfs.github.com/spec/v1"):
                      raise SystemExit("EXTERNALIZED_STAGING_CONTAINER_POINTER_REMAINS:" + asset["id"])
          print("CAJITA_INPUT_MATERIALIZATION=PASS models=6 externalized_containers=10")
          PY

      - name: Verify compressed externalized assets and prepare distribution registry
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          python cajita-luna-runtime/reproduce_macrodown.py --root cajita-luna-runtime --prepare-distribution-registry
          python cajita-luna-runtime/cajita_externalized_asset_loader.py verify-all --root cajita-luna-runtime

      - name: Reconcile the ten-asset placement record with the measured tree size
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path("cajita-luna-runtime")
          sys.path.insert(0, str(root.resolve()))
          from cajita_externalized_packaging import distribution_contract
          from cajita_tokenizer_materializer import MANIFEST_NAME as TOKENIZER_MANIFEST_NAME, load_tokenizer_manifest
          externalized_contract = distribution_contract(root)
          excluded_expanded_roots = {item["expanded_relpath"] for item in externalized_contract}
          tokenizer_manifest = load_tokenizer_manifest(root)
          compressed_tokenizer_sources = {row["source_path"] for row in tokenizer_manifest.get("entries", []) if row.get("packed")}
          placement_path = root / "EXTERNALIZED_ASSET_PLACEMENT.json"
          archive_placement = json.loads(placement_path.read_text(encoding="utf-8"))
          archive_history = archive_placement.get("factory_reconciliation", {}).get("archives", [])
          archive_source_paths = {row.get("source_path") for row in archive_history if isinstance(row, dict) and isinstance(row.get("source_path"), str)}
          container_paths = {item["container_relpath"] for item in externalized_contract}
          build_only_archive_paths = archive_source_paths - container_paths
          report_path = Path("docs/cajita-luna/CAJITA_RUNTIME_Q4_REBALANCE_20261023.json")
          placement = json.loads(placement_path.read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))
          raw_input_ceiling = 1_500_000_000
          raw_payload_target = 470_000_000
          archive_cap = 470_000_000
          assets = placement.get("assets", [])
          if len(assets) != 10 or len({x.get("id") for x in assets}) != 10:
              raise SystemExit("TEN_ASSET_REGISTRY_INVALID")
          # The tracked report is historical input. Re-measure this checkout below;
          # a previous 470 MB raw-target result must not suppress a valid compressed build.
          previous_raw_bytes = int(report.get("runtime_bytes_after", 0))
          if previous_raw_bytes < 0 or previous_raw_bytes > raw_input_ceiling:
              raise SystemExit("PRIOR_RAW_INPUT_OUTSIDE_SAFETY_CEILING")
          # Q2 is a desired state, not necessarily a new mutation in this run.
          # Existing verified Q2-packed sidecars are valid evidence; promotion-count-only
          # checks incorrectly reject a runtime where all required factors are already Q2.
          import hashlib
          expected_q2 = {
              "W01_CEREBRO": "1. Cerebro/model.safetensors",
              "W02_TRANSCRIPTION": "3. Transcripción/model.safetensors",
              "W03_TRANSLATION": "4. Traductor Inteligente/Traducción general/model.safetensors",
              "W05_QWEN3": "6. Sistema Inteligente/Análisis Avanzado/model.safetensors",
          }
          q2_rows = report.get("q2_factor_results", [])
          if not isinstance(q2_rows, list) or len(q2_rows) != len(expected_q2):
              raise SystemExit("Q2_FACTOR_EVIDENCE_SET_INVALID")
          rows_by_id = {row.get("id"): row for row in q2_rows if isinstance(row, dict)}
          if set(rows_by_id) != set(expected_q2):
              raise SystemExit("Q2_FACTOR_EVIDENCE_IDS_INVALID")
          manifest_path = root / "CAJITA_RUNTIME_V1" / "weights_manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          manifest_by_path = {item.get("path"): item for item in manifest.get("artifacts", [])}
          promoted_count = 0
          for model_id, rel in expected_q2.items():
              row = rows_by_id[model_id]
              if row.get("path") != rel:
                  raise SystemExit("Q2_FACTOR_EVIDENCE_PATH_MISMATCH:" + model_id)
              status = row.get("status")
              if status not in {"ALREADY_Q2_PACKED", "PROMOTED_Q2_BLOCKWISE"}:
                  raise SystemExit("Q2_FACTOR_PACKING_EVIDENCE_MISSING:" + model_id + ":" + str(status))
              if status == "PROMOTED_Q2_BLOCKWISE":
                  promoted_count += 1
                  if int(row.get("saved_bytes", 0)) <= 0:
                      raise SystemExit("Q2_PROMOTION_WITHOUT_SIZE_REDUCTION:" + model_id)
              model_path = root / rel
              sidecar_path = model_path.with_name(model_path.name + ".q4.json")
              if not model_path.is_file() or not sidecar_path.is_file():
                  raise SystemExit("Q2_MODEL_OR_SIDECAR_MISSING:" + model_id)
              actual_bytes = model_path.stat().st_size
              actual_sha256 = hashlib.sha256(model_path.read_bytes()).hexdigest()
              artifact = manifest_by_path.get(rel)
              if not isinstance(artifact, dict):
                  raise SystemExit("Q2_WEIGHT_MANIFEST_ENTRY_MISSING:" + model_id)
              if int(row.get("candidate_bytes", -1)) != actual_bytes or int(artifact.get("bytes", -1)) != actual_bytes:
                  raise SystemExit("Q2_MODEL_SIZE_EVIDENCE_MISMATCH:" + model_id)
              if artifact.get("sha256") != actual_sha256:
                  raise SystemExit("Q2_MODEL_SHA256_EVIDENCE_MISMATCH:" + model_id)
              sidecar = json.loads(sidecar_path.read_text(encoding="utf-8"))
              tensors = sidecar.get("tensors", [])
              q2_pass = sidecar.get("q2_factor_pass", {})
              if not tensors or any(t.get("encoding") != "UNSIGNED_INT2_ASYMMETRIC" for t in tensors):
                  raise SystemExit("Q2_SIDECAR_ENCODING_INVALID:" + model_id)
              if q2_pass.get("packed_tensor_count") != len(tensors):
                  raise SystemExit("Q2_SIDECAR_TENSOR_COUNT_MISMATCH:" + model_id)
              if sidecar.get("candidate_sha256") != actual_sha256:
                  raise SystemExit("Q2_SIDECAR_MODEL_HASH_MISMATCH:" + model_id)
          if int(report.get("q2_factor_models_promoted", 0)) != promoted_count:
              raise SystemExit("Q2_PROMOTION_COUNT_MISMATCH")
          print("Q2_FACTOR_PACKING_EVIDENCE=PASS verified_models=4 new_promotions=" + str(promoted_count))

          placement["status"] = "COMPACT_DISTRIBUTION_PAYLOAD_MEASURED_FINAL_ARCHIVE_GATE_PENDING"
          placement["runtime_size_gate"] = {
              "audit_id": "CAJITA_FINAL_RUNTIME_SIZE_GATE_20261025",
              "measurement_method": "sum of reproducible distribution payload files; excludes source-only registries/routing, historical build-only archives and ten hash-pinned expanded trees; includes ten verified compressed containers, six materialized model payloads and all distribution members; no LFS pointers",
              "payload_bytes": 0,
              "hard_cap_bytes": raw_input_ceiling,
              "bytes_under_cap": raw_input_ceiling,
              "size_gate": "PENDING_REMEASUREMENT",
              "raw_input_ceiling_bytes": raw_input_ceiling,
              "raw_payload_target_bytes": raw_payload_target,
              "raw_payload_target_gate": "PENDING_REMEASUREMENT",
              "archive_cap_bytes": archive_cap,
              "archive_size_gate": "PENDING_FINAL_ZIP_BUILD",
              "registered_asset_count": len(assets),
              "registered_asset_ids": [x["id"] for x in assets],
              "q2_factor_models_promoted": int(report.get("q2_factor_models_promoted", 0)),
              "certification": "NOT_GRANTED"
          }

          def under_expanded_tree(rel):
              return any(rel == item or rel.startswith(item + "/") for item in excluded_expanded_roots)

          def runtime_inventory():
              entries = []
              excluded = {"expanded_trees": sum(item["expanded_bytes"] for item in externalized_contract), "source_only_registry_routing": 0, "historical_build_archives": 0, "generated_manifest": 0, "compressed_tokenizer_sources": 0}
              for base, dirs, files in os.walk(root, topdown=True, followlinks=False):
                  base_path = Path(base)
                  kept_dirs = []
                  for name in dirs:
                      directory = base_path / name
                      if directory.is_symlink():
                          raise SystemExit("SYMLINK_IN_RUNTIME:" + str(directory))
                      rel_dir = directory.relative_to(root).as_posix()
                      if name in {".git", "__pycache__", ".pytest_cache"} or under_expanded_tree(rel_dir):
                          continue
                      kept_dirs.append(name)
                  dirs[:] = kept_dirs
                  for name in files:
                      path = base_path / name
                      if path.is_symlink():
                          raise SystemExit("SYMLINK_IN_RUNTIME:" + str(path))
                      rel = path.relative_to(root).as_posix()
                      if not path.is_file():
                          continue
                      size = path.stat().st_size
                      if name == "MACRODOWN_MANIFEST.json":
                          excluded["generated_manifest"] += size
                          continue
                      if path.suffix.lower() in {".pyc", ".pyo", ".tmp", ".part"}:
                          continue
                      if rel in {"module_registry.json", "command_subdomain_routing.json"}:
                          excluded["source_only_registry_routing"] += size
                          continue
                      if rel in compressed_tokenizer_sources:
                          excluded["compressed_tokenizer_sources"] += size
                          continue
                      if rel in build_only_archive_paths:
                          excluded["historical_build_archives"] += size
                          continue
                      if under_expanded_tree(rel):
                          continue
                      entries.append({"path": rel, "bytes": size, "top_level": rel.split("/", 1)[0], "suffix": path.suffix.lower() or "(none)"})
              entries.sort(key=lambda item: item["path"].encode("utf-8"))
              return entries, excluded

          def runtime_size():
              entries, _ = runtime_inventory()
              return sum(item["bytes"] for item in entries)

          def report_payload_breakdown(entries, excluded):
              from collections import Counter
              by_top = Counter()
              by_suffix = Counter()
              for item in entries:
                  by_top[item["top_level"]] += item["bytes"]
                  by_suffix[item["suffix"]] += item["bytes"]
              print(json.dumps({
                  "schema": "CAJITA_RUNTIME_PAYLOAD_BREAKDOWN/1.0",
                  "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                  "included_payload_bytes": sum(item["bytes"] for item in entries),
                  "included_file_count": len(entries),
                  "excluded_bytes_by_policy": excluded,
                  "excluded_historical_archive_bytes": excluded.get("historical_build_archives", 0),
                  "bytes_by_top_level": [{"path": key, "bytes": value} for key, value in sorted(by_top.items(), key=lambda kv: (-kv[1], kv[0]))],
                  "bytes_by_suffix": [{"suffix": key, "bytes": value} for key, value in sorted(by_suffix.items(), key=lambda kv: (-kv[1], kv[0]))],
                  "largest_50_included_files": sorted(entries, key=lambda item: (-item["bytes"], item["path"]))[:50],
                  "registered_container_bytes": [{"id": item["id"], "path": item["container_relpath"], "bytes": item["container_bytes"], "sha256": item["container_sha256"]} for item in externalized_contract],
                  "distribution_certification": "NOT_GRANTED"
              }, ensure_ascii=False, sort_keys=True))

          placement_path.write_text(json.dumps(placement, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          measured = None
          for _ in range(8):
              entries, excluded_bytes = runtime_inventory()
              measured = sum(item["bytes"] for item in entries)
              report_payload_breakdown(entries, excluded_bytes)
              raw_gate = "PASS" if measured <= raw_input_ceiling else "FAIL"
              raw_target_gate = "PASS" if measured <= raw_payload_target else "OVER_TARGET_NOT_FINAL_GATE"
              placement["status"] = "COMPACT_DISTRIBUTION_RAW_INPUT_CEILING_" + raw_gate
              placement["runtime_size_gate"].update({
                  "payload_bytes": measured,
                  "hard_cap_bytes": raw_input_ceiling,
                  "bytes_under_cap": max(0, raw_input_ceiling - measured),
                  "size_gate": raw_gate,
                  "raw_input_ceiling_bytes": raw_input_ceiling,
                  "raw_payload_target_bytes": raw_payload_target,
                  "raw_payload_target_gate": raw_target_gate,
                  "raw_bytes_over_target": max(0, measured - raw_payload_target),
                  "archive_cap_bytes": archive_cap,
                  "archive_size_gate": "PENDING_FINAL_ZIP_BUILD",
              })
              placement_path.write_text(json.dumps(placement, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              after_write = runtime_size()
              if after_write == measured:
                  break
          else:
              raise SystemExit("PLACEMENT_SIZE_MEASUREMENT_DID_NOT_CONVERGE")

          report["runtime_bytes_after"] = measured
          report["saved_bytes"] = int(report.get("runtime_bytes_before", measured)) - measured
          report["bytes_over_cap"] = max(0, measured - raw_input_ceiling)
          report["size_gate"] = "PASS" if measured <= raw_input_ceiling else "FAIL"
          report["status"] = "RAW_INPUT_CEILING_PASS_FINAL_ARCHIVE_GATE_PENDING" if measured <= raw_input_ceiling else "RAW_INPUT_CEILING_FAIL"
          report["raw_input_ceiling_bytes"] = raw_input_ceiling
          report["raw_payload_target_bytes"] = raw_payload_target
          report["raw_payload_target_gate"] = "PASS" if measured <= raw_payload_target else "OVER_TARGET_NOT_FINAL_GATE"
          report["raw_bytes_over_target"] = max(0, measured - raw_payload_target)
          report["distribution_archive_cap_bytes"] = archive_cap
          report["distribution_archive_gate"] = "PENDING_FINAL_ZIP_BUILD"
          report["placement_size_gate_recorded"] = True
          report["runtime_measurement_scope"] = "REPRODUCIBLE_DISTRIBUTION_PAYLOAD; RAW INPUT CEILING IS 1.5 GB; 470 MB IS AN ARCHIVE TARGET, NOT THE PRE-COMPRESSION SUM"
          report["externalized_asset_reconstruction"] = "PASS_CONTAINER_RECONSTRUCTION_ONLY; CONSUMER_ADAPTERS_NOT_ESTABLISHED"
          report["registered_asset_count"] = len(assets)
          report_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({
              "runtime_payload_bytes": measured,
              "raw_input_ceiling_bytes": raw_input_ceiling,
              "raw_bytes_under_ceiling": max(0, raw_input_ceiling - measured),
              "raw_payload_target_bytes": raw_payload_target,
              "raw_payload_target_gate": report["raw_payload_target_gate"],
              "raw_bytes_over_target": report["raw_bytes_over_target"],
              "distribution_archive_cap_bytes": archive_cap,
              "raw_input_gate": report["size_gate"],
              "registered_assets": len(assets),
              "q2_factor_models_promoted": report.get("q2_factor_models_promoted"),
              "certification": "NOT_GRANTED"
          }, ensure_ascii=False))
          if report["size_gate"] != "PASS":
              raise SystemExit("RAW_BUILD_INPUT_OVER_SAFETY_CEILING")
          PY

      - name: Build deterministic Macrodown and enforce raw plus archive hard caps
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/CAJITA_LUNA_RUNTIME_V9.macrodown"
          RESULT="$RUNNER_TEMP/macrodown-build-result.json"
          cp "cajita-luna-runtime/MACRODOWN_MANIFEST.json" "$RUNNER_TEMP/macrodown-manifest-before.json"
          python cajita-luna-runtime/reproduce_macrodown.py \
            --root cajita-luna-runtime \
            --output "$OUT" \
            --raw-cap-bytes 1500000000 \
            --combined-cap-bytes 470000000 > "$RESULT"
          python - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "macrodown-build-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          raw_report_path = Path("docs/cajita-luna/CAJITA_RUNTIME_Q4_REBALANCE_20261023.json")
          raw_report = json.loads(raw_report_path.read_text(encoding="utf-8"))
          placement_path = Path("cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json")
          placement = json.loads(placement_path.read_text(encoding="utf-8"))
          raw_input_ceiling = 1_500_000_000
          archive_cap = 470_000_000
          raw_payload_target = 470_000_000
          archive_path = Path(result["output"])
          if result.get("status") != "PASS":
              raise SystemExit("MACRODOWN_BUILD_NOT_PASS")
          if int(result.get("gross_raw_payload_bytes", raw_input_ceiling + 1)) > raw_input_ceiling:
              raise SystemExit("MACRODOWN_RAW_INPUT_OVER_SAFETY_CEILING")
          if int(result.get("archive_bytes", archive_cap + 1)) > archive_cap:
              raise SystemExit("MACRODOWN_ARCHIVE_OVER_DISTRIBUTION_TARGET")
          if raw_report.get("size_gate") != "PASS" or placement.get("runtime_size_gate", {}).get("size_gate") != "PASS":
              raise SystemExit("RAW_INPUT_CEILING_GATE_NOT_PASS")
          if int(placement["runtime_size_gate"]["registered_asset_count"]) != 10:
              raise SystemExit("TEN_REGISTERED_ASSETS_NOT_PRESERVED")

          record = {
              "schema": "CAJITA_MACRODOWN_BUILD_AUDIT/1.0",
              "audit_id": "CAJITA_MACRODOWN_BUILD_20261023",
              "created_at_utc": datetime.now(timezone.utc).isoformat(),
              "repository": "Plomillo/luna-linux-bridge",
              "source_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "format": "deterministic ZIP container with .macrodown extension",
              "runtime_payload_bytes_excluding_generated_manifest": int(raw_report["runtime_bytes_after"]),
              "gross_raw_payload_bytes_including_manifest": int(result["gross_raw_payload_bytes"]),
              "archive_bytes": int(result["archive_bytes"]),
              "hard_cap_bytes": archive_cap,
              "raw_input_ceiling_bytes": raw_input_ceiling,
              "raw_input_bytes_under_ceiling": max(0, raw_input_ceiling - int(result["gross_raw_payload_bytes"])),
              "raw_payload_target_bytes": raw_payload_target,
