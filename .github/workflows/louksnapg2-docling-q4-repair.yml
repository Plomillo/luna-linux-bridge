name: LOUKSNAPG2 Granite Docling source-bound Q4 repair experiment

on:
  push:
    branches:
      - louksnapg2/docling-q3-reconstruction-20261102
    paths:
      - "tools/louksnapg2_docling_q4_repair.py"
      - "cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/docling_30mb_runtime_v1.py"
      - ".github/workflows/louksnapg2-docling-q4-repair.yml"
      - "cajita-luna-runtime/REQUIREMENTS.runtime.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: louksnapg2-docling-q4-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-source-bound-q4:
    if: github.ref == 'refs/heads/louksnapg2/docling-q3-reconstruction-20261102'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --memory=3g --memory-swap=3g --cpus=1
    timeout-minutes: 45
    steps:
      - name: Verify exact 3-GiB repair and one-core cgroup
        shell: bash
        run: |
          set -Eeuo pipefail
          memory="$(cat /sys/fs/cgroup/memory.max)"
          read -r quota period < /sys/fs/cgroup/cpu.max
          expected=$((3 * 1024 * 1024 * 1024))
          [[ "$memory" == "$expected" ]] || { echo "REPAIR_MEMORY_LIMIT_MISMATCH:$memory:$expected" >&2; exit 1; }
          [[ "$quota" =~ ^[0-9]+$ && "$period" =~ ^[0-9]+$ ]] || { echo "REPAIR_CPU_QUOTA_INVALID" >&2; exit 1; }
          (( quota > 0 && period > 0 && quota <= period )) || { echo "REPAIR_CPU_LIMIT_EXCEEDS_ONE_CORE" >&2; exit 1; }
          printf '{"status":"PASS","memory_limit_bytes":%s,"cpu_quota":%s,"cpu_period":%s}\n' "$memory" "$quota" "$period"

      - name: Checkout exact feature-branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up pinned Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"

      - name: Install pinned CPU runtime dependencies
        shell: bash
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r cajita-luna-runtime/REQUIREMENTS.runtime.lock

      - name: Test INT4 nibble codec and independent zlib frames
        shell: bash
        run: |
          set -Eeuo pipefail
          python -B tools/louksnapg2_docling_q4_repair.py --self-test

      - name: Reconstruct Granite Docling from its immutable pinned upstream teacher
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          HF_HOME: ${{ runner.temp }}/docling-q4-hf-home
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_XET: "1"
          HF_HUB_ETAG_TIMEOUT: "60"
          HF_HUB_DOWNLOAD_TIMEOUT: "300"
        run: |
          set -Eeuo pipefail
          BASE="cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate"
          mkdir -p "$RUNNER_TEMP/docling-q4-build"
          python -B tools/louksnapg2_docling_q4_repair.py build \
            --base-candidate "$BASE" \
            --output-dir "$RUNNER_TEMP/docling-q4-build"

      - name: Upload exact reconstructed candidate and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg2-docling-q4-source-candidate
          path: ${{ runner.temp }}/docling-q4-build/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  evaluate-under-one-gib:
    needs: [build-source-bound-q4]
    if: needs.build-source-bound-q4.result == 'success'
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
      options: --memory=1g --memory-swap=1g --cpus=1
    timeout-minutes: 35
    steps:
      - name: Verify exact 1-GiB candidate cgroup and one-core quota
        shell: bash
        run: |
          set -Eeuo pipefail
          memory="$(cat /sys/fs/cgroup/memory.max)"
          read -r quota period < /sys/fs/cgroup/cpu.max
          expected=$((1 * 1024 * 1024 * 1024))
          [[ "$memory" == "$expected" ]] || { echo "CANDIDATE_MEMORY_LIMIT_MISMATCH:$memory:$expected" >&2; exit 1; }
          [[ "$quota" =~ ^[0-9]+$ && "$period" =~ ^[0-9]+$ ]] || { echo "CANDIDATE_CPU_QUOTA_INVALID" >&2; exit 1; }
          (( quota > 0 && period > 0 && quota <= period )) || { echo "CANDIDATE_CPU_LIMIT_EXCEEDS_ONE_CORE" >&2; exit 1; }
          printf '{"status":"PASS","memory_limit_bytes":%s,"cpu_quota":%s,"cpu_period":%s}\n' "$memory" "$quota" "$period"

      - name: Install Git and CA certificates for memory-bounded sparse checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git ca-certificates
          update-ca-certificates

      - name: Sparse-checkout only the Docling inference closure
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/louksnapg2_docling_q4_repair.py
            /cajita-luna-runtime/REQUIREMENTS.runtime.lock
            /cajita-luna-runtime/cajita_tokenizer_materializer.py
            /cajita-luna-runtime/CAJITA_COMPRESSED_TOKENIZER_MANIFEST.json
            /cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate/
          lfs: false
          persist-credentials: false

      - name: Set up pinned Python 3.13
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.13"

      - name: Install pinned single-threaded CPU runtime
        shell: bash
        env:
          PIP_NO_CACHE_DIR: "1"
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -r cajita-luna-runtime/REQUIREMENTS.runtime.lock

      - name: Download source-reconstructed Q4 overlay from the 3-GiB build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: louksnapg2-docling-q4-source-candidate
          path: ${{ runner.temp }}/docling-q4-build

      - name: Apply only the temporary candidate overlay to this evaluation workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          BASE="cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate"
          test -s "$RUNNER_TEMP/docling-q4-build/candidate/quantized_weights.bin"
          test -s "$RUNNER_TEMP/docling-q4-build/candidate/quantized_manifest.json"
          cp "$RUNNER_TEMP/docling-q4-build/candidate/quantized_weights.bin" "$BASE/quantized_weights.bin"
          cp "$RUNNER_TEMP/docling-q4-build/candidate/quantized_manifest.json" "$BASE/quantized_manifest.json"
          cp "$RUNNER_TEMP/docling-q4-build/candidate/compression_metadata.json" "$BASE/compression_metadata.json"
          sha256sum "$BASE/quantized_weights.bin" "$BASE/quantized_manifest.json"

      - name: Build the fixed high-contrast invoice acceptance image
        shell: bash
        env:
          IMAGE_PATH: ${{ runner.temp }}/docling-q4-invoice.png
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          p=Path(os.environ["IMAGE_PATH"])
          image=Image.new("RGB",(1400,900),"white")
          draw=ImageDraw.Draw(image)
          title=ImageFont.load_default(size=84)
          body=ImageFont.load_default(size=64)
          draw.text((110,90),"INVOICE",fill=(0,0,0),font=title,stroke_width=1)
          draw.line((100,215,1300,215),fill=(0,0,0),width=5)
          draw.text((110,300),"Invoice Number: 4821",fill=(0,0,0),font=body,stroke_width=1)
          draw.text((110,470),"Total: 37.50",fill=(0,0,0),font=body,stroke_width=1)
          image.save(p,format="PNG",optimize=False)
          print("INVOICE_FIXTURE_BYTES="+str(p.stat().st_size))
          PY

      - name: Execute source-reconstructed candidate inference under 1 GiB
        shell: bash
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONNOUSERSITE: "1"
          LOUKSNAPG2_DOCLING_IMAGE_SIDE: "256"
          IMAGE_PATH: ${{ runner.temp }}/docling-q4-invoice.png
          REPORT_PATH: ${{ runner.temp }}/docling-q4-functional-evidence.json
        run: |
          set -Eeuo pipefail
          BASE="cajita-luna-runtime/5. Inteligencia documental/INTELDOC_GLOBAL_30MB_CANDIDATE_V9/docling/compact_upstream_hf_candidate"
          python -B tools/louksnapg2_docling_q4_repair.py evaluate \
            --repo-root "$GITHUB_WORKSPACE" \
            --candidate-dir "$BASE" \
            --image "$IMAGE_PATH" \
            --report "$REPORT_PATH" \
            --max-new-tokens 64 \
            | tee "$RUNNER_TEMP/docling-q4-functional-summary.json"

      - name: Upload semantic evaluation evidence whether pass or fail
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksnapg2-docling-q4-functional-evidence
          path: |
            ${{ runner.temp }}/docling-q4-functional-evidence.json
            ${{ runner.temp }}/docling-q4-functional-summary.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 0
