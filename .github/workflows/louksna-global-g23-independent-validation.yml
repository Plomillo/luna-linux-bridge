name: LUNITA G23 independent validation

# Independent of the image builder. The runner downloads a published release
# asset, hashes it, mounts it with squashfuse, and runs rsession and JASP
# from that mount. A local receipt cannot satisfy this workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that holds the squashfs asset
        required: true
        type: string
      asset_name:
        description: Exact asset filename
        required: true
        type: string
        default: LUNITA-I14.squashfs
      expected_sha256:
        description: Expected SHA-256 of the asset
        required: true
        type: string

permissions:
  contents: read

jobs:
  g23:
    name: Download, mount, and execute the published squashfs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Download the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.release_tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ inputs.asset_name }}" \
            --dir "$RUNNER_TEMP/lunita-asset" \
            --clobber
          test -f "$RUNNER_TEMP/lunita-asset/${{ inputs.asset_name }}"
          echo "ASSET=$RUNNER_TEMP/lunita-asset/${{ inputs.asset_name }}" >> "$GITHUB_ENV"

      - name: Verify SHA-256 and size ceiling
        run: |
          set -euo pipefail
          cd "$(dirname "$ASSET")"
          echo "${{ inputs.expected_sha256 }}  $(basename "$ASSET")" | sha256sum -c -
          python3 - << 'PY'
          import os
          n = os.path.getsize(os.environ["ASSET"])
          print(f"bytes={n}")
          if n > 2_000_000_000:
              raise SystemExit("over ceiling")
          if n < 1_000_000:
              raise SystemExit("asset too small to be the image")
          PY

      - name: Install squashfuse
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfuse fuse3
          test -e /dev/fuse
          command -v squashfuse
          command -v fusermount3

      - name: Ten real mount cycles
        run: |
          set -euo pipefail
          MNT="$RUNNER_TEMP/lunita-mnt"
          mkdir -p "$MNT"
          python3 - << 'PY'
          import json, os, subprocess
          img = os.environ["ASSET"]
          mnt = os.environ["RUNNER_TEMP"] + "/lunita-mnt"
          cycles = []
          for i in range(1, 11):
              if subprocess.call(["mountpoint", "-q", mnt]) == 0:
                  subprocess.check_call(["fusermount3", "-u", mnt])
              r = subprocess.run(["squashfuse", "-o", "ro", img, mnt], capture_output=True, text=True)
              mounted = subprocess.call(["mountpoint", "-q", mnt]) == 0
              rsession = os.path.join(mnt, "usr/lib/rstudio/resources/app/bin/rsession")
              with open(rsession, "rb") as fh:
                  fh.seek(0xDD6B76)
                  patch = fh.read(5).hex()
              present = {
                  "rsession": os.path.isfile(rsession),
                  "jasp": os.path.isfile(os.path.join(mnt, "opt/jasp/bin/jasp")),
                  "jasp_dataset": os.path.isfile(os.path.join(mnt, "opt/lunita/validate/Directed.jasp")),
                  "brujula_js": os.path.isfile(os.path.join(mnt, "opt/lunita/bin/brujula.js")),
                  "orchestrator": os.path.isfile(os.path.join(mnt, "opt/lunita/agent/lunita/orchestrator.py")),
                  "xfce_session": os.path.isfile(os.path.join(mnt, "usr/bin/xfce4-session")),
                  "qdrant": os.path.isfile(os.path.join(mnt, "opt/lunita/runtime/qdrant/qdrant")),
                  "mailbox": os.path.isfile(os.path.join(mnt, "usr/bin/lunita-mailbox")),
                  "model_xs": os.path.isfile(os.path.join(mnt, "opt/lunita/brain/qwen3/Qwen3-0.6B-IQ3_XS.gguf")),
                  "e2e": os.path.isfile(os.path.join(mnt, "opt/lunita/bin/e2e_mission.py")),
                  "t01": os.path.isfile(os.path.join(mnt, "opt/lunita/bin/t01_t80.py")),
                  "jamovi_electron": os.path.isfile(os.path.join(mnt, "opt/jamovi-desktop/bin/electron")),
                  "jamovi_asar": os.path.isfile(os.path.join(mnt, "opt/jamovi-desktop/bin/resources/default_app.asar")),
                  "vmlinuz": os.path.isfile(os.path.join(mnt, "boot/vmlinuz-6.1.0-50-cloud-amd64")),
                  "initrd": os.path.isfile(os.path.join(mnt, "boot/lunita-initrd.img")),
                  "qemu_marker": os.path.isfile(os.path.join(mnt, "opt/lunita/QEMU_MARKER")),
              }
              u = subprocess.run(["fusermount3", "-u", mnt], capture_output=True, text=True)
              still = subprocess.call(["mountpoint", "-q", mnt]) == 0
              row = {
                  "cycle": i,
                  "mount_rc": r.returncode,
                  "mounted": mounted,
                  "patch": patch,
                  "present": present,
                  "umount_rc": u.returncode,
                  "still_mounted": still,
                  "stderr": (r.stderr or "")[-200:],
              }
              cycles.append(row)
              print(json.dumps(row), flush=True)
              if r.returncode != 0 or not mounted or patch != "e9b4fbffff":
                  raise SystemExit(f"mount cycle {i} failed")
              if not all(present.values()):
                  raise SystemExit(f"missing component on cycle {i}")
              if u.returncode != 0 or still:
                  raise SystemExit(f"umount cycle {i} failed")
          open(os.environ["RUNNER_TEMP"] + "/mount-cycles.json", "w").write(json.dumps(cycles))
          print("TEN_MOUNT_CYCLES_OK")
          PY

      - name: Functional rsession and JASP from a fresh mount
        run: |
          set -euo pipefail
          MNT="$RUNNER_TEMP/lunita-run"
          mkdir -p "$MNT"
          # Root must own the FUSE mount. A user squashfuse is invisible to sudo,
          # so bind-mounting /proc onto it fails with EPERM/EINVAL.
          sudo squashfuse -o ro "$ASSET" "$MNT"
          sudo mount --bind /proc "$MNT/proc"
          # /dev in the image is not a device tree. Cover it with a tmpfs, then bind real nodes.
          sudo mount -t tmpfs -o size=64m tmpfs "$MNT/dev"
          for node in null zero random urandom; do
            sudo touch "$MNT/dev/$node"
            sudo mount --bind "/dev/$node" "$MNT/dev/$node"
          done
          sudo mkdir -p "$MNT/dev/shm" "$MNT/dev/pts" "$MNT/tmp"
          sudo mount -t tmpfs -o size=512m tmpfs "$MNT/dev/shm"
          sudo mount -t devpts -o gid=5,mode=620 devpts "$MNT/dev/pts" || sudo mount --bind /dev/pts "$MNT/dev/pts"
          sudo touch "$MNT/dev/ptmx"
          sudo mount --bind /dev/ptmx "$MNT/dev/ptmx" || true
          sudo touch "$MNT/dev/tty"
          sudo mount --bind /dev/tty "$MNT/dev/tty" || true
          sudo mount -t tmpfs -o size=2048m tmpfs "$MNT/tmp"
          sudo mkdir -p "$MNT/tmp/runhome"
          set +e
          sudo chroot "$MNT" /usr/bin/env -i \
            HOME=/tmp/runhome USER=root PATH=/usr/bin:/bin \
            R_HOME=/usr/lib/R R_DOC_DIR=/usr/share/R/doc \
            LD_LIBRARY_PATH=/usr/lib/rstudio LANG=C LC_ALL=C \
            RSTUDIO_MINIMUM_USER_ID=0 \
            /usr/lib/rstudio/resources/app/bin/rsession \
            --program-mode=server --standalone=1 --copilot-enabled=0 \
            --log-stderr=1 --r-run-rprofile=0 \
            --run-script 'a<-c(1,2,3,4);b<-c(2,3,4,6);res<-t.test(a,b);cat(sprintf("WELCH t=%.10f df=%.6f p=%.9f mean1=%.4f mean2=%.4f\n", unname(res$statistic), unname(res$parameter), res$p.value, mean(a), mean(b)))' \
            > "$RUNNER_TEMP/rsession.out" 2> "$RUNNER_TEMP/rsession.err"
          RS_RC=$?
          set -e
          echo "RS_RC=$RS_RC"
          cat "$RUNNER_TEMP/rsession.out"
          grep -q 'WELCH t=-1.1677484162 df=5.584615 p=0.290333569 mean1=2.5000 mean2=3.7500' "$RUNNER_TEMP/rsession.out"
          if grep -q 'stack smashing detected' "$RUNNER_TEMP/rsession.out" "$RUNNER_TEMP/rsession.err"; then
            echo "stack smash" >&2
            exit 1
          fi
          test "$RS_RC" = "0"
          sudo chroot "$MNT" /usr/sbin/visudo -cf /etc/sudoers
          sudo chroot "$MNT" /usr/bin/env -i HOME=/home/lunita USER=lunita LOGNAME=lunita PATH=/usr/bin:/bin \
            /usr/bin/sudo -n /usr/bin/id -u > "$RUNNER_TEMP/sudo-id.txt"
          grep -qx '0' "$RUNNER_TEMP/sudo-id.txt"
          set +e
          sudo chroot "$MNT" /usr/bin/python3.13 - << 'PY'
          import json, sys
          sys.path.insert(0, "/opt/lunita/agent")
          from lunita import engines
          from lunita.orchestrator import _jasp_status
          e01 = engines.e01_infer("Responde solo: OK", n_predict=8)
          e04 = engines.e04_embed("prueba")
          status = _jasp_status()
          report = {
              "e01_status": e01.get("status"),
              "e01_rc": e01.get("returncode"),
              "e01_answer": (e01.get("answer") or "")[:200],
              "e04_dims": len(e04),
              "jasp": status,
          }
          print(json.dumps({"e01_status": report["e01_status"], "e04_dims": report["e04_dims"], "jasp_ok": status.get("ok")}))
          open("/tmp/jasp-status.json", "w").write(json.dumps(status))
          open("/tmp/engine-smoke.json", "w").write(json.dumps(report))
          if e01.get("status") != "EXECUTED" or e01.get("returncode") != 0:
              raise SystemExit("e01 failed")
          if len(e04) != 384:
              raise SystemExit("e04 dims")
          if status.get("ok") is not True:
              raise SystemExit("jasp not ok")
          PY
          JASP_RC=$?
          set -e
          sudo cp "$MNT/tmp/jasp-status.json" "$RUNNER_TEMP/jasp-status.json"
          sudo cp "$MNT/tmp/engine-smoke.json" "$RUNNER_TEMP/engine-smoke.json"
          test "$JASP_RC" = "0"
          # The functional mount is root-owned squashfuse. The runner user cannot stat it.
          sudo test -x "$MNT/usr/bin/xfce4-session"
          sudo test -x "$MNT/usr/bin/xfwm4"
          sudo test -x "$MNT/usr/bin/xfce4-panel"
          sudo test -x "$MNT/opt/lunita/runtime/qdrant/qdrant"
          sudo test -x "$MNT/usr/bin/lunita-mailbox"
          sudo grep -q 'pam_permit.so' "$MNT/etc/pam.d/sudo"
          set +e
          sudo chroot "$MNT" /usr/bin/env -i \
            HOME=/tmp USER=root PATH=/usr/bin:/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONPATH=/opt/lunita/agent \
            LUNITA_STATE_DIR=/tmp/lunita-state \
            LUNITA_ROOT=/opt/lunita \
            GI_TYPELIB_PATH=/usr/lib/x86_64-linux-gnu/girepository-1.0 \
            /bin/sh -c 'Xvfb :18 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & echo $! >/tmp/xvfb.pid; sleep 0.5; DISPLAY=:18 /usr/bin/lunita-mailbox --self-test > /tmp/mailbox.json 2>/tmp/mailbox.err; rc=$?; kill $(cat /tmp/xvfb.pid) >/dev/null 2>&1 || true; exit $rc'
          MB_RC=$?
          set -e
          echo "MB_RC=$MB_RC"
          sudo cat "$MNT/tmp/mailbox.err" || true
          test "$MB_RC" = "0"
          sudo chroot "$MNT" /usr/bin/env -i \
            HOME=/tmp USER=root PATH=/usr/bin:/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONPATH=/opt/lunita/agent \
            LUNITA_STATE_DIR=/tmp/lunita-state \
            LUNITA_ROOT=/opt/lunita \
            /usr/bin/python3.13 - << 'PY'
          import json, sys
          sys.path.insert(0, "/opt/lunita/agent")
          from lunita import engines
          from lunita.qdrant_store import persist_roundtrip
          persisted = persist_roundtrip(engines.e04_embed)
          hits = engines.e05_search("alfa", [
              {"id": "alfa", "text": "alfa persistencia lunita"},
              {"id": "beta", "text": "otro tema distinto"},
          ])
          report = {"persisted": persisted.get("persisted") is True, "top": hits[0]["id"] if hits else None}
          open("/tmp/qdrant-smoke.json", "w").write(json.dumps(report))
          if report["persisted"] is not True or report["top"] != "alfa":
              raise SystemExit("qdrant failed " + json.dumps(report))
          PY
          sudo cp "$MNT/tmp/mailbox.json" "$RUNNER_TEMP/mailbox.json"
          sudo cp "$MNT/tmp/qdrant-smoke.json" "$RUNNER_TEMP/qdrant-smoke.json"
          # The checks above keep the r4 contract. r5 also has to execute the
          # chained mission and T01–T80 from this mount, not from the builder tree.
          sudo fuser -k "$MNT/opt/lunita/runtime/qdrant/qdrant" || true
          sleep 1
          set +e
          sudo chroot "$MNT" /usr/bin/env -i \
            HOME=/tmp USER=root PATH=/usr/bin:/bin:/opt/jasp/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONPATH=/opt/lunita/agent \
            LUNITA_STATE_DIR=/tmp/lunita-state-e2e \
            LUNITA_ROOT=/opt/lunita \
            GI_TYPELIB_PATH=/usr/lib/x86_64-linux-gnu/girepository-1.0 \
            /usr/bin/python3.13 /opt/lunita/bin/e2e_mission.py \
            > "$RUNNER_TEMP/e2e.out" 2> "$RUNNER_TEMP/e2e.err"
          E2E_RC=$?
          set -e
          echo "E2E_RC=$E2E_RC"
          sudo cat "$MNT/tmp/e2e-mission.json" || true
          test "$E2E_RC" = "0"
          sudo cp "$MNT/tmp/e2e-mission.json" "$RUNNER_TEMP/e2e-mission.json"
          sudo sha256sum "$MNT/opt/lunita/brain/qwen3/Qwen3-0.6B-IQ3_XS.gguf" | tee "$RUNNER_TEMP/model.sha"
          grep -q '^0906dcf62aa4f005887e855731376f0bf3be8f5ffa61f547df71e6154ea748d9 ' "$RUNNER_TEMP/model.sha"
          sudo fuser -k "$MNT/opt/lunita/runtime/qdrant/qdrant" || true
          sleep 1
          set +e
          sudo chroot "$MNT" /usr/bin/env -i \
            HOME=/tmp USER=root PATH=/usr/bin:/bin \
            LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            PYTHONPATH=/opt/lunita/agent \
            LUNITA_STATE_DIR=/tmp/lunita-state-t01 \
            LUNITA_ROOT=/opt/lunita \
            T01_OUT=/tmp/LUNITA_TEST_RESULTS.json \
            /usr/bin/python3.13 /opt/lunita/bin/t01_t80.py \
            > "$RUNNER_TEMP/t01.out" 2> "$RUNNER_TEMP/t01.err"
          T_RC=$?
          set -e
          echo "T_RC=$T_RC"
          test "$T_RC" = "0"
          sudo cp "$MNT/tmp/LUNITA_TEST_RESULTS.json" "$RUNNER_TEMP/LUNITA_TEST_RESULTS.json"
          # Boot the published squashfs itself. The kernel and initrd are copied
          # out of that mount; QEMU is only the harness, same role as squashfuse.
          sudo cp "$MNT/boot/vmlinuz-6.1.0-50-cloud-amd64" "$RUNNER_TEMP/vmlinuz"
          sudo cp "$MNT/boot/lunita-initrd.img" "$RUNNER_TEMP/lunita-initrd.img"
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86
          if [ -e /dev/kvm ]; then QEMU_ACCEL=kvm; else QEMU_ACCEL=tcg; fi
          echo "QEMU_ACCEL=$QEMU_ACCEL" >> "$GITHUB_ENV"
          echo "$QEMU_ACCEL" > "$RUNNER_TEMP/qemu-accel.txt"
          rm -f "$RUNNER_TEMP/qemu-serial.txt"
          set +e
          qemu-system-x86_64 \
            -m 1024 -smp 1 -machine pc -accel "$QEMU_ACCEL" -no-reboot \
            -kernel "$RUNNER_TEMP/vmlinuz" \
            -initrd "$RUNNER_TEMP/lunita-initrd.img" \
            -append "console=ttyS0 quiet" \
            -drive "file=${ASSET},format=raw,if=virtio,readonly=on" \
            -display none -serial "file:${RUNNER_TEMP}/qemu-serial.txt" -monitor none
          QEMU_RC=$?
          set -e
          echo "QEMU_RC=$QEMU_RC"
          # QEMU serial is CRLF. Whole-line checks fail if the CR is left in place.
          tr -d '\r' < "$RUNNER_TEMP/qemu-serial.txt" > "$RUNNER_TEMP/qemu-serial.lf"
          mv "$RUNNER_TEMP/qemu-serial.lf" "$RUNNER_TEMP/qemu-serial.txt"
          cat "$RUNNER_TEMP/qemu-serial.txt" || true
          grep -q 'SQUASH_MOUNTED' "$RUNNER_TEMP/qemu-serial.txt"
          grep -q 'LUNITA-I14-r6 qemu boot marker' "$RUNNER_TEMP/qemu-serial.txt"
          grep -q 'JAMOVI_ELECTRON_PRESENT' "$RUNNER_TEMP/qemu-serial.txt"
          grep -qx 'XFCE_FOUND xfce4-session xfwm4 xfce4-panel xfconfd' "$RUNNER_TEMP/qemu-serial.txt"
          grep -qx 'LUNITA_BOOT_OK' "$RUNNER_TEMP/qemu-serial.txt"
          python3 - << PY
          import json, os, hashlib, pathlib
          asset = os.environ["ASSET"]
          h = hashlib.sha256()
          with open(asset, "rb") as fh:
              for chunk in iter(lambda: fh.read(8 << 20), b""):
                  h.update(chunk)
          digest = h.hexdigest()
          expected = "${{ inputs.expected_sha256 }}"
          if digest != expected:
              raise SystemExit("rehash mismatch")
          jasp = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/jasp-status.json").read_text())
          smoke = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/engine-smoke.json").read_text())
          mailbox = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/mailbox.json").read_text())
          qdrant = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/qdrant-smoke.json").read_text())
          e2e = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/e2e-mission.json").read_text())
          t01 = json.loads(pathlib.Path(os.environ["RUNNER_TEMP"] + "/LUNITA_TEST_RESULTS.json").read_text())
          model_line = pathlib.Path(os.environ["RUNNER_TEMP"] + "/model.sha").read_text().split()[0]
          sudo_id = pathlib.Path(os.environ["RUNNER_TEMP"] + "/sudo-id.txt").read_text().strip()
          out = pathlib.Path(os.environ["RUNNER_TEMP"] + "/rsession.out").read_text()
          serial = pathlib.Path(os.environ["RUNNER_TEMP"] + "/qemu-serial.txt").read_text(errors="replace")
          qemu_accel = pathlib.Path(os.environ["RUNNER_TEMP"] + "/qemu-accel.txt").read_text().strip()
          qemu_boot = (
              "SQUASH_MOUNTED" in serial
              and "LUNITA-I14-r6 qemu boot marker" in serial
              and "JAMOVI_ELECTRON_PRESENT" in serial
              and "XFCE_FOUND xfce4-session xfwm4 xfce4-panel xfconfd" in serial
              and "LUNITA_BOOT_OK" in serial
              and "6.1.0-50-cloud-amd64" in serial
          )
          steps = e2e["steps"]
          xfce_found = set(steps["xfce"].get("found") or [])
          xfce_live = {"xfce4-session", "xfwm4", "xfce4-panel", "xfconfd"} <= xfce_found
          page = (steps["brujula"].get("page") or {})
          means = steps["rstudio"].get("means") or []
          attestation = {
              "schema": "LUNITA_G23_ATTESTATION/3",
              "gate": "G23",
              "result": "PASS",
              "independent_runner": True,
              "builder_host": False,
              "release_tag": "${{ inputs.release_tag }}",
              "asset_name": "${{ inputs.asset_name }}",
              "sha256": digest,
              "bytes": os.path.getsize(asset),
              "mount": "squashfuse",
              "mount_cycles": 10,
              "rsession_rc": 0,
              "welch_line": "WELCH t=-1.1677484162 df=5.584615 p=0.290333569 mean1=2.5000 mean2=3.7500",
              "welch_observed": "WELCH t=-1.1677484162" in out,
              "jasp_ok": jasp.get("ok") is True and steps["jasp"].get("ok") is True,
              "jasp_comparator": jasp.get("comparator"),
              "jasp_unit_test_rc": jasp.get("unit_test_rc"),
              "sudo_uid": sudo_id,
              "sudo_ok": sudo_id == "0",
              "sudo_scope": "root-equivalent NOPASSWD ALL inside the image, not least privilege",
              "e01_status": smoke.get("e01_status"),
              "e01_model": steps["e01"].get("model"),
              "e04_dims": smoke.get("e04_dims"),
              "model_file": steps["model"].get("file"),
              "model_bytes": steps["model"].get("bytes"),
              "model_sha256": model_line,
              "brujula_status": page.get("status"),
              "brujula_title": page.get("title"),
              "jamovi_ok": steps["jamovi"].get("ok") is True,
              "jamovi_engine": steps["jamovi"].get("engine"),
              "jamovi_mean_a": steps["jamovi"].get("mean_a"),
              "jamovi_desktop_ui": steps["jamovi"].get("desktop_ui") is True,
              "jamovi_window": (steps["jamovi"].get("desktop") or {}).get("window") is True,
              "rstudio_ok": steps["rstudio"].get("ok") is True,
              "libreoffice_ok": steps["libreoffice"].get("ok") is True,
              "xfce_session": xfce_live,
              "xfce_found": sorted(xfce_found),
              "xfce_display": steps["xfce"].get("display"),
              "physical_console": False,
              "kvm": qemu_accel == "kvm",
              "qemu_boot": qemu_boot,
              "qemu_accel": qemu_accel,
              "mailbox_ok": mailbox.get("ok") is True and mailbox.get("modules") == ["CONSULTAS", "TRABAJOS"] and (steps["xfce"].get("mailbox") or {}).get("modules") == ["CONSULTAS", "TRABAJOS"],
              "mailbox_modules": mailbox.get("modules"),
              "qdrant_persisted": qdrant.get("persisted") is True and steps["qdrant"].get("persisted") is True,
              "qdrant_top": qdrant.get("top"),
              "e2e_ok": e2e.get("ok") is True,
              "t01_count": t01.get("count"),
              "t01_failed": t01.get("failed"),
              "integral_meta28": (steps["jamovi"].get("desktop_ui") is True) and qemu_boot,
              "not_certified": [] if ((steps["jamovi"].get("desktop_ui") is True) and qemu_boot) else ["jamovi_electron_desktop", "physical_or_kvm_console_boot"],
              "not_a_local_second_script": True,
          }
          if not attestation["welch_observed"] or not attestation["jasp_ok"] or not attestation["sudo_ok"] or attestation["e04_dims"] != 384 or attestation["e01_status"] != "EXECUTED":
              raise SystemExit("attestation inputs failed")
          if not attestation["mailbox_ok"] or not attestation["qdrant_persisted"] or attestation["qdrant_top"] != "alfa":
              raise SystemExit("xfce/qdrant/mailbox attestation failed")
          if attestation["model_file"] != "Qwen3-0.6B-IQ3_XS.gguf" or attestation["model_bytes"] != 379605408 or attestation["model_sha256"] != "0906dcf62aa4f005887e855731376f0bf3be8f5ffa61f547df71e6154ea748d9":
              raise SystemExit("model identity failed")
          if "IQ3_XS" not in str(attestation["e01_model"]):
              raise SystemExit("e01 did not run IQ3_XS")
          if attestation["brujula_status"] != 200 or attestation["brujula_title"] != "LUNITA-BRUJULA-MARKER":
              raise SystemExit("brujula navigation failed")
          if not attestation["jamovi_ok"] or attestation["jamovi_engine"] != "jmv::ttestIS" or attestation["jamovi_mean_a"] != 2.5 or attestation["jamovi_desktop_ui"] is not True:
              raise SystemExit("jamovi desktop failed")
          if attestation["qemu_boot"] is not True:
              raise SystemExit("qemu boot failed")
          if attestation["integral_meta28"] is not True:
              raise SystemExit("integral_meta28 is not true")
          if not attestation["rstudio_ok"] or not attestation["libreoffice_ok"] or not attestation["xfce_session"] or attestation["xfce_display"] != "Xvfb":
              raise SystemExit("rstudio/libreoffice/xfce session failed")
          if not attestation["e2e_ok"] or attestation["t01_count"] != 80 or attestation["t01_failed"] != []:
              raise SystemExit("e2e or T01-T80 failed")
          if len(means) < 2 or abs(means[0] - 2.5) > 1e-9 or abs(means[1] - 3.75) > 1e-9:
              raise SystemExit("rstudio means failed")
          path = pathlib.Path(os.environ["RUNNER_TEMP"] + "/LUNITA_G23_ATTESTATION.json")
          path.write_text(json.dumps(attestation, indent=2) + "\n")
          print(path.read_text())
          PY
          sudo umount "$MNT/tmp" || sudo umount -l "$MNT/tmp" || true
          sudo umount "$MNT/dev/shm" || sudo umount -l "$MNT/dev/shm" || true
          sudo umount "$MNT/dev/pts" || sudo umount -l "$MNT/dev/pts" || true
          for node in tty ptmx urandom random zero null; do sudo umount "$MNT/dev/$node" || sudo umount -l "$MNT/dev/$node" || true; done
          sudo umount "$MNT/dev" || sudo umount -l "$MNT/dev" || true
          sudo umount "$MNT/proc" || sudo umount -l "$MNT/proc" || true
          # Qdrant keeps the squashfs executable mapped. Lazy detach must not fail the gate.
          sudo fuser -km "$MNT" || true
          sleep 1
          sudo fusermount3 -u "$MNT" || sudo umount -l "$MNT" || true

      - name: Upload G23 attestation
        uses: actions/upload-artifact@v4
        with:
          name: lunita-g23-attestation
          path: |
            ${{ runner.temp }}/LUNITA_G23_ATTESTATION.json
            ${{ runner.temp }}/mount-cycles.json
            ${{ runner.temp }}/rsession.out
            ${{ runner.temp }}/jasp-status.json
            ${{ runner.temp }}/engine-smoke.json
            ${{ runner.temp }}/sudo-id.txt
            ${{ runner.temp }}/e2e-mission.json
            ${{ runner.temp }}/LUNITA_TEST_RESULTS.json
            ${{ runner.temp }}/model.sha
            ${{ runner.temp }}/qemu-serial.txt
            ${{ runner.temp }}/qemu-accel.txt
          if-no-files-found: error
