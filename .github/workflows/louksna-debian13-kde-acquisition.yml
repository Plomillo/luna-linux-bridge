name: "Louksna Debian 13 KDE infrastructure acquisition"

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact candidate commit SHA to bind the evidence to"
        required: true
        type: string
  push:
    branches:
      - "ops/infra-acquisition-install-20261009"
    paths:
      - ".github/workflows/louksna-debian13-kde-acquisition.yml"

permissions:
  contents: read

concurrency:
  group: louksna-debian13-kde-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-install-verify:
    name: "Download and install Debian 13 runtime dependencies in disposable CI container"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install container tooling
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends podman jq coreutils
          podman --version

      - name: Pull official Debian 13 image and record immutable image digest
        id: image
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/infra-acquisition
          podman pull docker.io/library/debian:13
          podman image inspect docker.io/library/debian:13 --format '{{.Digest}}' | tee evidence/infra-acquisition/debian-image-digest.txt
          podman image inspect docker.io/library/debian:13 > evidence/infra-acquisition/debian-image-inspect.json

      - name: Download and install runtime plus KDE/X11 test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          podman run --rm --volume "$PWD/evidence/infra-acquisition:/evidence:Z" docker.io/library/debian:13 bash -Eeuc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install --yes --no-install-recommends \
              ca-certificates dbus dbus-x11 xvfb xauth x11-utils \
              libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2 \
              libssl3 libasound2t64 libpulse0 libudev1 libxkbcommon0 \
              libwayland-client0 libwayland-egl1 libegl1 libgl1 libgbm1 \
              libx11-6 libxext6 libxrender1 libxrandr2 libxcomposite1 \
              libxcursor1 libxdamage1 libxi6 libxtst6 libnss3 \
              libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
              libglib2.0-0 libgdk-pixbuf-2.0-0 libpango-1.0-0 libcairo2 \
              plasma-workspace kwin-x11
            dpkg-query -W -f="${Package}\t${Version}\t${Architecture}\n" | sort > /evidence/dpkg-installed.tsv
            {
              command -v Xvfb
              command -v dbus-run-session
              command -v startplasma-x11
              command -v kwin_x11
              dpkg-query -W -f="${Package}\t${Version}\n" plasma-workspace kwin-x11 xvfb dbus-x11
              timeout 15s xvfb-run -a dbus-run-session -- bash -c "echo DISPLAY=\$DISPLAY; xdpyinfo >/dev/null"
            } > /evidence/runtime-smoke.log 2>&1
          ' 2> evidence/infra-acquisition/install.log

      - name: Bind hashes, commit, environment, and verdict
        if: always()
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess,datetime
          root=pathlib.Path("evidence/infra-acquisition")
          files=sorted(p for p in root.rglob("*") if p.is_file())
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          report={
            "schema":"louksna.infra-acquisition.v1",
            "generated_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "repository":os.environ.get("GITHUB_REPOSITORY","Plomillo/luna-linux-bridge"),
            "candidate_sha":os.environ["CANDIDATE_SHA"],
            "workflow_source_sha":os.environ["WORKFLOW_SHA"],
            "workflow_run_id":os.environ["RUN_ID"],
            "workflow_run_attempt":os.environ["RUN_ATTEMPT"],
            "runner_os":platform.platform(),
            "scope":"ephemeral Debian 13 container; package installation and headless X11/DBus smoke test",
            "status":"PASS" if (root/"runtime-smoke.log").is_file() and (root/"dpkg-installed.tsv").is_file() else "HOLD",
            "physical_debian_kde_host_provisioned":False,
            "real_microphone_or_remote_voice_test":False,
            "self_hosted_runner_registered":False,
            "certification":"NOT_GRANTED",
            "activation":False,
            "artifact_sha256":hashes,
            "limitations":[
              "This workflow installs into an ephemeral container and does not provision a persistent physical or VM host.",
              "A headless X11/DBus smoke test is not proof of a real interactive KDE desktop session.",
              "It does not run the project Debian package install/launch/rollback gate CP-09.",
              "It does not validate microphone capture, audio transport, or remote voice response.",
              "CP-10, G23 independent validation, and G24 certification remain separate gates."
            ]
          }
          (root/"acquisition-report.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print(json.dumps(report,indent=2))
          PY

      - name: Upload install logs, package inventory, image identity, and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: louksna-debian13-kde-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/infra-acquisition/
          if-no-files-found: warn
          retention-days: 90
