name: "Dropbox META OS reconciled frozen inventory"

on:
  push:
    branches:
      - staging/dropbox-github-cloud-partitioned-20261005
    paths:
      - .github/workflows/dropbox-metaos-reconcile-inventory.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recover exact public probe evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dropbox-metaos-public-inventory-probe-37585254356
          path: ${{ runner.temp }}/metaos-probe
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37585254356

      - name: Reconcile network metadata with frozen hydrated HTML
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/reconciled"
          export STATE_ROOT="$RUNNER_TEMP/reconcile-state"
          mkdir -p "$STATE_ROOT/evidence" "$STATE_ROOT/browser-downloads" "$STATE_ROOT/payload" "$STATE_ROOT/checkpoints" "$STATE_ROOT/quarantine"
          python3 - "$RUNNER_TEMP/metaos-probe" "$RUNNER_TEMP/reconciled/METAOS_FROZEN_INVENTORY.json" <<'PY'
          import hashlib,importlib.util,json,pathlib,sys,urllib.parse
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])
          target="https://www.dropbox.com/scl/fo/0dhs5jhwksqtmwl26vusi/AFlrQdNPUUfhI5kxk-DHWPg/8.%20META%20OS?rlkey=p712fwlkbwn9g0dtybu2sf159&dl=0"

          jc=next(root.rglob("json_candidates.json"))
          htmlp=next(root.rglob("page.html"))
          candidates=json.loads(jc.read_text(encoding="utf-8"))
          hit=next(x for x in candidates if (x.get("url") or {}).get("path")=="/list_shared_link_folder_entries" and int(x.get("status") or 0)==200)
          assert hit.get("sha256")=="c0793fda60a0739bda5bf228cbc0f4eb3223e58fc6f4953d26e593155bf34c91"
          payload=json.loads(hit["body"])
          assert int(payload.get("total_num_entries") or 0)==37
          assert payload.get("has_more_entries") is False

          spec=importlib.util.spec_from_file_location("dbxpart","scripts/dropbox_cloud_partitioned_acquire.py")
          mod=importlib.util.module_from_spec(spec); assert spec and spec.loader; spec.loader.exec_module(mod)
          html_rows=mod.children_from_html_text(htmlp.read_text(encoding="utf-8",errors="replace"),target)

          network={}
          for raw in payload.get("entries") or []:
              href=str(raw.get("href") or "").strip()
              if not href: continue
              key=mod.link_key(href)
              network[key]={
                  "kind":"folder" if raw.get("is_dir") else "file",
                  "url":href,
                  "label":mod.clean_label(str(raw.get("filename") or ""),"object-"+key[:10]),
                  "key":key,
                  "transport":"frozen_metaos_network_exact",
                  "dropbox_id":raw.get("folder_id") if raw.get("is_dir") else raw.get("file_id"),
                  "size":None if raw.get("is_dir") else int(raw.get("bytes") or 0),
                  "classification_source":"DROPBOX_PUBLIC_NETWORK_JSON",
              }

          merged={}
          for row in html_rows:
              key=row["key"]
              if key in network:
                  merged[key]=network[key]
              else:
                  merged[key]={
                      "kind":"unknown",
                      "url":row["url"],
                      "label":row["label"],
                      "key":key,
                      "transport":"frozen_metaos_hydrated_html_unknown",
                      "classification_source":"FROZEN_HYDRATED_HTML_LINK_ONLY",
                  }
          for key,row in network.items():
              merged.setdefault(key,row)

          entries=sorted(merged.values(),key=lambda x:(x["label"].casefold(),x["key"]))
          assert len(entries)==37,(len(entries),len(html_rows),len(network))
          exact=sum(x["kind"]!="unknown" for x in entries)
          unknown=sum(x["kind"]=="unknown" for x in entries)
          cert={
              "schema":"PUAC2_METAOS_FROZEN_INVENTORY_EVIDENCE/2.0",
              "status":"PASS",
              "source_run_id":37585254356,
              "source_artifact_id":11466490492,
              "network_response_sha256":hit["sha256"],
              "page_html_sha256":hashlib.sha256(htmlp.read_bytes()).hexdigest(),
              "declared_total_num_entries":37,
              "resolved_entry_count":len(entries),
              "network_exact_classification_count":exact,
              "unknown_link_only_count":unknown,
              "network_has_more_entries":False,
              "entries":entries,
              "invariants":{
                  "no_false_folder_classification":True,
                  "unknown_objects_are_opaque_download_first":True,
                  "source_identity_bound":mod.link_key(target),
              },
          }
          raw=json.dumps(cert,ensure_ascii=False,indent=2,sort_keys=True)+"\n"
          out.write_text(raw,encoding="utf-8")
          print("METAOS_FROZEN_RESOLVED_ENTRIES="+str(len(entries)))
          print("METAOS_FROZEN_EXACT_CLASSIFICATIONS="+str(exact))
          print("METAOS_FROZEN_UNKNOWN_OBJECTS="+str(unknown))
          print("METAOS_FROZEN_INVENTORY_SHA256="+hashlib.sha256(raw.encode()).hexdigest())
          print(json.dumps({"status":"PASS","resolved":len(entries),"exact":exact,"unknown":unknown},sort_keys=True))
          PY

      - name: Preserve reconciled inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-metaos-reconciled-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/reconciled/METAOS_FROZEN_INVENTORY.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
