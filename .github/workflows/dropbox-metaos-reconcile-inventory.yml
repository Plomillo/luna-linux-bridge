name: "Dropbox META OS reconciled frozen inventory"

on:
  push:
    branches:
      - staging/dropbox-github-cloud-partitioned-20261005
    paths:
      - .github/workflows/dropbox-metaos-reconcile-inventory.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recover exact public probe evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dropbox-metaos-public-inventory-probe-37585254356
          path: ${{ runner.temp }}/metaos-probe
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 37585254356

      - name: Reconcile network metadata with rendered rows
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/reconciled"
          python3 - "$RUNNER_TEMP/metaos-probe" "$RUNNER_TEMP/reconciled/METAOS_FROZEN_INVENTORY.json" <<'PY'
          import hashlib,json,pathlib,sys,urllib.parse
          root=pathlib.Path(sys.argv[1]); out=pathlib.Path(sys.argv[2])

          jc=next(root.rglob("json_candidates.json"))
          el=next(root.rglob("elements.json"))
          candidates=json.loads(jc.read_text(encoding="utf-8"))
          elements=json.loads(el.read_text(encoding="utf-8"))

          hit=None
          for row in candidates:
              u=row.get("url") or {}
              if u.get("path")=="/list_shared_link_folder_entries" and int(row.get("status") or 0)==200:
                  hit=row; break
          assert hit is not None
          assert hit.get("sha256")=="c0793fda60a0739bda5bf228cbc0f4eb3223e58fc6f4953d26e593155bf34c91"
          payload=json.loads(hit["body"])
          assert int(payload.get("total_num_entries") or 0)==37
          assert payload.get("has_more_entries") is False

          def canon(url):
              p=urllib.parse.urlsplit(url)
              q=[(k,v) for k,v in urllib.parse.parse_qsl(p.query,keep_blank_values=True) if k!="dl"]
              q.sort()
              qs=urllib.parse.urlencode(q)
              return urllib.parse.urlunsplit((p.scheme,p.netloc,p.path,qs,""))

          network={}
          for raw in payload.get("entries") or []:
              href=str(raw.get("href") or "")
              if not href: continue
              key=hashlib.sha256(canon(href).encode()).hexdigest()
              network[key]={
                  "key":key,
                  "name":str(raw.get("filename") or ""),
                  "href":href,
                  "kind":"folder" if raw.get("is_dir") else "file",
                  "bytes":None if raw.get("is_dir") else int(raw.get("bytes") or 0),
                  "object_id":raw.get("folder_id") if raw.get("is_dir") else raw.get("file_id"),
                  "classification_source":"DROPBOX_PUBLIC_NETWORK_JSON",
              }

          rendered={}
          for raw in elements:
              href=(raw.get("href") or {})
              if not isinstance(href,dict): continue
              if href.get("host")!="www.dropbox.com": continue
              path=str(href.get("path") or "")
              if "/8.%20META%20OS/" not in path: continue
              # The probe sanitized query values, so rebuild from the original href
              # exposed on the element is not possible here. Use the text and path
              # only to reconcile identity against network objects and count rows.
              text=str(raw.get("text") or "").strip()
              testid=str(raw.get("data_testid") or "")
              marker=(path,text,testid)
              rendered[str(marker)]={
                  "path":path,
                  "name":text,
                  "data_testid":testid,
              }

          # The public probe's summary already recorded 37 hydrated rows; preserve
          # exact observable counts separately from object-classification coverage.
          summary_path=next(root.rglob("summary.json"))
          summary=json.loads(summary_path.read_text(encoding="utf-8"))
          interesting=summary.get("interesting_elements") or []
          row_hits=[]
          for raw in interesting:
              href=raw.get("href") or {}
              if isinstance(href,dict) and href.get("host")=="www.dropbox.com" and "/8.%20META%20OS/" in str(href.get("path") or ""):
                  row_hits.append(raw)

          cert={
              "schema":"PUAC2_METAOS_FROZEN_INVENTORY_EVIDENCE/1.0",
              "status":"PASS",
              "source_run_id":37585254356,
              "source_artifact_id":11466490492,
              "network_response_sha256":hit["sha256"],
              "declared_total_num_entries":37,
              "network_entries_materialized":len(network),
              "network_has_more_entries":False,
              "rendered_probe_element_candidates":len(row_hits),
              "network_entries":sorted(network.values(),key=lambda x:(x["kind"],x["name"].casefold(),x["key"])),
              "note":"This artifact does not falsely equate declared_total_num_entries with network_entries_materialized. It is evidence for deterministic fallback and reconciliation only.",
          }
          raw=json.dumps(cert,ensure_ascii=False,indent=2,sort_keys=True)+"\n"
          out.write_text(raw,encoding="utf-8")
          print("METAOS_FROZEN_NETWORK_ENTRIES="+str(len(network)))
          print("METAOS_DECLARED_TOTAL=37")
          print("METAOS_RENDERED_CANDIDATES="+str(len(row_hits)))
          print("METAOS_FROZEN_INVENTORY_SHA256="+hashlib.sha256(raw.encode()).hexdigest())
          print(json.dumps({"status":"PASS","network_entries":len(network),"declared_total":37,"rendered_candidates":len(row_hits)},sort_keys=True))
          PY

      - name: Preserve reconciled inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dropbox-metaos-reconciled-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/reconciled/METAOS_FROZEN_INVENTORY.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
