name: "Document Factory — FFprobe fresh producer self-hosted"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/document-factory-ffprobe-fresh-producer-selfhosted.yml"

permissions:
  contents: read

concurrency:
  group: document-factory-ffprobe-fresh-producer-selfhosted
  cancel-in-progress: false

env:
  CANDIDATE_SHA: 3774cb102ad6318fc824b2cb87c5055e9f5f4b0b
  ACTIVE_SHA: 43a82aa30607b8775c998fa39b2bc08bfc2a263f
  PANDOC_SHA256: 67d7d011fed8c8543306022b985b9b2499ab9b74818df91d8727c7e9ebc5ba06
  LIBREOFFICE_SHA256: d0a6031a3837e48f9854e6d2da6489b9fadbd814afa4741fa32a197741663a22

jobs:
  fresh-producer:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 30
    steps:
      - name: Checkout exact FFprobe candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 3774cb102ad6318fc824b2cb87c5055e9f5f4b0b
          fetch-depth: 0
          persist-credentials: false

      - name: Fresh producer with live telemetry
        shell: bash
        run: |
          set -Eeuo pipefail
          emit() {
            printf 'CUSTOSZ_FRESH_PRODUCER_TELEMETRY {"phase":"%s","status":"%s","candidate_sha":"%s","at":"%s"}\n' "$1" "$2" "$CANDIDATE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          HB_SEQ=0
          heartbeat() {
            while true; do
              HB_SEQ=$((HB_SEQ+1))
              printf 'CUSTOSZ_FRESH_PRODUCER_HEARTBEAT {"sequence":%s,"state":"RUNNING","candidate_sha":"%s","at":"%s"}\n' "$HB_SEQ" "$CANDIDATE_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              sleep 2
            done
          }
          heartbeat &
          HB_PID=$!
          cleanup() { kill "$HB_PID" 2>/dev/null || true; wait "$HB_PID" 2>/dev/null || true; }
          trap cleanup EXIT

          emit PRECHECK RUNNING
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git rev-parse HEAD^)" = "$ACTIVE_SHA"
          git diff --name-only "$ACTIVE_SHA" "$CANDIDATE_SHA" > "$RUNNER_TEMP/changed-paths.txt"
          BAD="$(grep -Ev '^document-factory/' "$RUNNER_TEMP/changed-paths.txt" || true)"
          test -z "$BAD"
          emit PRECHECK PASS

          emit CORE_SELFTEST RUNNING
          python3 -B document-factory/src/selftest.py | tee "$RUNNER_TEMP/selftest.json"
          python3 -B document-factory/src/factory.py validate-profile document-factory/profiles/uniacc-neuroplasticidad-u2.json --repo-root .
          emit CORE_SELFTEST PASS

          emit PINNED_PANDOC RUNNING
          curl -fsSL "https://github.com/jgm/pandoc/releases/download/3.12/pandoc-3.12-linux-amd64.tar.gz" -o "$RUNNER_TEMP/pandoc.tgz"
          echo "$PANDOC_SHA256  $RUNNER_TEMP/pandoc.tgz" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/pandoc"
          mkdir -p "$RUNNER_TEMP/pandoc"
          tar -xzf "$RUNNER_TEMP/pandoc.tgz" --strip-components=1 -C "$RUNNER_TEMP/pandoc"
          "$RUNNER_TEMP/pandoc/bin/pandoc" --version | head -n 1 | tee "$RUNNER_TEMP/pandoc-version.txt"
          export PATH="$RUNNER_TEMP/pandoc/bin:$PATH"
          emit PINNED_PANDOC PASS

          emit PINNED_LIBREOFFICE RUNNING
          curl -fsSL "https://download.documentfoundation.org/libreoffice/stable/26.8.0/deb/x86_64/LibreOffice_26.8.0_Linux_x86-64_deb.tar.gz" -o "$RUNNER_TEMP/libreoffice.tgz"
          echo "$LIBREOFFICE_SHA256  $RUNNER_TEMP/libreoffice.tgz" | sha256sum -c -
          if [ ! -x /opt/libreoffice26.8/program/soffice ]; then
            rm -rf "$RUNNER_TEMP/lo"
            mkdir -p "$RUNNER_TEMP/lo"
            tar -xzf "$RUNNER_TEMP/libreoffice.tgz" -C "$RUNNER_TEMP/lo"
            sudo dpkg -i "$RUNNER_TEMP"/lo/*/DEBS/*.deb || { sudo apt-get update; sudo apt-get -f install -y; sudo dpkg -i "$RUNNER_TEMP"/lo/*/DEBS/*.deb; }
          fi
          /opt/libreoffice26.8/program/soffice --version | head -n 1 | tee "$RUNNER_TEMP/libreoffice-version.txt"
          export PATH="/opt/libreoffice26.8/program:$PATH"
          emit PINNED_LIBREOFFICE PASS

          emit SYNTHETIC_BUILD RUNNING
          W="$RUNNER_TEMP/factory-demo"
          rm -rf "$W"
          mkdir -p "$W/source" "$W/data"
          python3 - <<'PY'
          import json,os,pathlib
          w=pathlib.Path(os.environ["RUNNER_TEMP"])/"factory-demo"
          body=" ".join(["evidence"]*850)
          (w/"source/report.md").write_text("---\ntitle: Synthetic Demo\n---\n<!-- BODY_START -->\n# Introducción\n"+body+"\n<!-- BODY_END -->\n",encoding="utf-8")
          (w/"source/slides.md").write_text("---\ntitle: Synthetic Demo\n---\n# Demo\nSynthetic CI fixture.\n",encoding="utf-8")
          (w/"data/sheets.json").write_text(json.dumps({"sheets":[{"name":"Evidence","rows":[["id","status"],["SELFTEST","PASS"]]}]},indent=2)+"\n",encoding="utf-8")
          sources={"schema":"DOCUMENT_FACTORY_SOURCE_LEDGER/1.0","fixture":True,"sources":[{"source_id":"TEST-S1","verified":True},{"source_id":"TEST-S2","verified":True},{"source_id":"TEST-S3","verified":True}]}
          (w/"data/source-ledger.json").write_text(json.dumps(sources,indent=2)+"\n",encoding="utf-8")
          PY
          python3 -B document-factory/src/factory.py build "$W" document-factory/profiles/uniacc-neuroplasticidad-u2.json --repo-root .
          python3 -B document-factory/src/factory.py self-audit "$W" document-factory/profiles/uniacc-neuroplasticidad-u2.json
          python3 -B document-factory/src/factory.py freeze "$W"
          emit SYNTHETIC_BUILD PASS

          emit FREEZE_CANDIDATE RUNNING
          P="$RUNNER_TEMP/frozen"
          rm -rf "$P"
          mkdir -p "$P/framework" "$P/workspace"
          cp -a document-factory/. "$P/framework/"
          cp -a "$W"/. "$P/workspace/"
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          rt=pathlib.Path(os.environ["RUNNER_TEMP"])
          root=rt/"frozen"
          selftest=json.loads((rt/"selftest.json").read_text(encoding="utf-8").splitlines()[-1])
          evidence={
            "schema":"DOCUMENT_FACTORY_PRODUCER_EVIDENCE/1.0",
            "status":"PASS",
            "candidate_head_sha":os.environ["CANDIDATE_SHA"],
            "base_sha":"716f9dc3f45324eb87280954c18b8dc475a451e8",
            "trust_root_sha":"17fdfa77aabf06ded29a4291a34bad27e80fac84",
            "selftest":selftest,
            "changed_paths":[x for x in (rt/"changed-paths.txt").read_text().splitlines() if x],
            "provider_archive_sha256":{"pandoc":os.environ["PANDOC_SHA256"],"libreoffice":os.environ["LIBREOFFICE_SHA256"]},
            "pandoc_version":(rt/"pandoc-version.txt").read_text().strip(),
            "libreoffice_version":(rt/"libreoffice-version.txt").read_text().strip(),
            "runner":"self-hosted:luna-linux",
            "bitwise_cross_environment_reproducibility_claimed":False
          }
          (root/"PRODUCER_EVIDENCE.json").write_text(json.dumps(evidence,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          rows=[]
          for f in sorted(x for x in root.rglob("*") if x.is_file() and x.name not in {"CANDIDATE_DIGEST.txt","FROZEN_CANDIDATE.json"}):
              rows.append({"path":f.relative_to(root).as_posix(),"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"size_bytes":f.stat().st_size})
          digest=hashlib.sha256(json.dumps(rows,sort_keys=True,separators=(",",":")).encode()).hexdigest()
          (root/"CANDIDATE_DIGEST.txt").write_text(digest+"\n",encoding="utf-8")
          (root/"FROZEN_CANDIDATE.json").write_text(json.dumps({"schema":"DOCUMENT_FACTORY_FROZEN_CANDIDATE/1.0","frozen":True,"candidate_digest_sha256":digest,"files":rows,"g23":"NOT_EXECUTED","g24":"NOT_EXECUTED"},indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print("CUSTOSZ_FRESH_PRODUCER_DIGEST="+digest,flush=True)
          PY
          emit FREEZE_CANDIDATE PASS
          emit FRESH_PRODUCER PASS

      - name: Upload fresh producer candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-factory-ffprobe-fresh-producer
          path: ${{ runner.temp }}/frozen
          if-no-files-found: error
          retention-days: 90
