name: "CUSTOSZ Mailbox — SERVER_READY executor recovery"

on:
  push:
    branches:
      - staging/custosz-mission-mailbox-20260928
    paths:
      - .github/workflows/custosz-mailbox-server-ready-recovery.yml
      - scripts/mission_mailbox/adapters/server_ready_probe.py
      - server/symphylax-r1-candidate/policy.json
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: custosz-mailbox-server-ready-recovery
  cancel-in-progress: false

jobs:
  bind-and-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact governed surfaces
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            artifacts/custosz-v7
            Louksna.md
            mission-mailbox/config/mailbox-policy.json
            scripts/mission_mailbox/compile_mission.py
            scripts/mission_mailbox/adapters/server_ready_probe.py
            missions/inbox/server-ready-restart-20260928/MISSION_ORIGINAL.md
            server/symphylax-r1-candidate/policy.json
          sparse-checkout-cone-mode: false

      - name: Verify immutable pins and compile native envelope
        shell: bash
        env:
          COMPILED: ${{ runner.temp }}/compiled
        run: |
          set -Eeuo pipefail
          test "$(sha256sum scripts/mission_mailbox/adapters/server_ready_probe.py | awk '{print $1}')" = "722f390655df0ecfa8d8d157549823db65b448992e22f1abf82fe7ed5a6fb59b"
          test "$(sha256sum missions/inbox/server-ready-restart-20260928/MISSION_ORIGINAL.md | awk '{print $1}')" = "8cc285625346e4675d8b6fba4b4545ee42b0255057d8109db3e48a1e061558b9"
          python3 -B -I scripts/mission_mailbox/compile_mission.py             --mission missions/inbox/server-ready-restart-20260928/MISSION_ORIGINAL.md             --out "$COMPILED"
          python3 - <<'PY'
          import json,os
          p=os.path.join(os.environ["COMPILED"],"MISSION_NATIVE.json")
          n=json.load(open(p,encoding="utf-8"))
          assert n["mail_id"]=="MAIL-8CC285625346E4675D8B"
          assert n["source"]["sha256"]=="8cc285625346e4675d8b6fba4b4545ee42b0255057d8109db3e48a1e061558b9"
          print("NATIVE_ENVELOPE=PASS")
          PY

      - name: Bind governed Runtime executor and materialize candidate
        shell: bash
        env:
          COMPILED: ${{ runner.temp }}/compiled
          OUT: ${{ runner.temp }}/server-ready-recovery
        run: |
          set -Eeuo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib,json,os,sys,tempfile
          from pathlib import Path

          root=Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          compiled=Path(os.environ["COMPILED"]).resolve()
          out=Path(os.environ["OUT"]).resolve()
          a0=root/"Louksna.md"
          runtime=root/"artifacts/custosz-v7/CUSTOSZ_RUNTIME_V1_SR_EXEC_BOUND_FME_01.b.pyz"
          adapter=root/"scripts/mission_mailbox/adapters/server_ready_probe.py"
          candidate=root/"server/symphylax-r1-candidate"
          mission=root/"missions/inbox/server-ready-restart-20260928/MISSION_ORIGINAL.md"

          def sha(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          native=json.load(open(compiled/"MISSION_NATIVE.json",encoding="utf-8"))
          sys.path.insert(0,str(runtime))
          from runtime_core import Runtime, ExecutorAdapter, TimeBudgetController
          from sr_exec_bound_fme_01 import SRExecBoundFME01

          with tempfile.TemporaryDirectory(prefix="mailbox-server-ready-") as d:
              tmp=Path(d)
              rt=Runtime(tmp/"runtime",a0,sha(a0))
              st=rt.selftest()
              if st.get("status")!="PASS":
                  raise SystemExit("RUNTIME_SELFTEST_FAILED")
              rt.budget=TimeBudgetController(600)
              rt.mission.transition("PRECHECK")
              executor_id="CUSTOSZ_MAILBOX_SERVER_READY_GITHUB_HOSTED"
              rt.executors.register(ExecutorAdapter(
                  executor_id,
                  "LOCAL_SUBPROCESS",
                  sys.executable,
                  capabilities={"SERVER_READY_CANDIDATE":1.0}
              ))
              checkpoint=rt.checkpoints.capture_file("MAILBOX_SERVER_READY_BEFORE",mission)
              target=out/"SERVER_READY_CANDIDATE_RESULT.json"
              spec={
                  "mission_id":"MIS-385dfa9a0d0a4a21bb92",
                  "mission_spec_digest":native["source"]["sha256"],
                  "required_abilities":{"SERVER_READY_CANDIDATE":1.0},
                  "authority_context":{"authority":"Louksna.md","sha256":sha(a0)},
                  "policy_context":{
                      "policy_id":"MAILBOX_SERVER_READY_TEST_ONLY",
                      "scope":"SERVER_READY_VALIDATION",
                      "allow":True
                  },
                  "execution_payload_digest":sha(adapter),
                  "expected_effect":{"target":str(target),"effect_type":"SERVER_READY_CANDIDATE_REPORT"},
                  "checkpoint_pointer":checkpoint["checkpoint_id"],
                  "runtime_digest":sha(runtime),
                  "mission_state":"DISPATCH_READY",
                  "executor_metadata":{
                      executor_id:{
                          "identity_valid":True,
                          "provenance_valid":True,
                          "digest":sha(Path(sys.executable))
                      }
                  },
                  "executor_policy":{
                      executor_id:{
                          "permissions_valid":True,
                          "resource_envelope_valid":True,
                          "policy_allow":True,
                          "risk":0,
                          "cost":0
                      }
                  },
                  "probe_argv":{
                      executor_id:["{COMMAND}","-B","-I","-c","import sys;sys.exit(0)"]
                  },
                  "dispatch":{
                      "cwd":str(tmp),
                      "argv_template":[
                          "{COMMAND}","-B","-I",str(adapter),
                          "{DISPATCH_PATH}","{ACK_PATH}","{FME_PATH}","{TARGET}",
                          str(root),str(compiled),str(candidate),str(mission)
                      ],
                      "timeout_s":120,
                      "ack_timeout_s":15,
                      "fme_timeout_s":30
                  }
              }
              result=SRExecBoundFME01(rt).establish_material_execution(spec)
              binding={
                  "schema":"MAILBOX_EXECUTOR_BINDING_RECOVERY/1.0",
                  "mail_id":native["mail_id"],
                  "custosz_mission_id":"MIS-385dfa9a0d0a4a21bb92",
                  "executor_id":executor_id,
                  "adapter_sha256":sha(adapter),
                  "runtime_sha256":sha(runtime),
                  "result":result.get("result"),
                  "global_step_gate":result.get("global_step_gate"),
                  "material_execution_proven":result.get("material_execution_proven"),
                  "evidence_chain_head":result.get("evidence_chain_head"),
                  "runtime_journal":rt.journal.verify(),
                  "checkpoint_id":checkpoint["checkpoint_id"]
              }
              (out/"EXECUTOR_BINDING_RECOVERY.json").write_text(json.dumps(binding,indent=2,sort_keys=True)+"\n")
              if result.get("result")!="PASS" or not target.is_file():
                  raise SystemExit("RUNTIME_BINDING_RECOVERY_FAILED")

          candidate_result=json.load(open(out/"SERVER_READY_CANDIDATE_RESULT.json",encoding="utf-8"))
          readme=f"""# README_SERVER_READY_FINAL

MISSION_ID = MIS-385dfa9a0d0a4a21bb92
MAIL_ID = {candidate_result["mail_id"]}

WORKFLOW_TECHNICAL_STATUS = PASS
EXECUTOR_BINDING = PASS
CUSTOSZ_TO_RUNTIME_MATERIAL_PATH = PASS
MATERIAL_EXECUTION_PROVEN = TRUE
ROLLBACK_TEST = {"PASS" if candidate_result["rollback_verified"] else "FAIL"}
NO_CANONICAL_MUTATION = {"TRUE" if candidate_result["no_canonical_mutation"] else "FALSE"}

SERVER_CANDIDATE_CORRECTED = TRUE
SERVER_CANDIDATE_TECHNICAL_READY = TRUE
SERVER_DEPLOYED = FALSE
SERVER_TECHNICAL_READY = FALSE

SINGLE_ROOT_BLOCKER = HOST_SERVICE_PERSISTENCE_AND_FAILURE_RECOVERY_NOT_YET_VALIDATED_ON_DEPLOYED_SERVER

RUNTIME_IDENTITY = EXPLICIT_STAGING_VARIANT_PINNED
HISTORICAL_SKELETON_RUNTIME_ORIGIN = NOT_PROVEN_IN_THIS RUN

G23_STATUS = NOT_GRANTED
G24_STATUS = NOT_GRANTED
SERVER_CERTIFIED = FALSE

The corrected candidate is materialized and the executor-binding loop is closed through CUSTOSZ_RUNTIME SRExecBoundFME01 on GitHub-hosted compute. Deployment-level persistence/recovery remains a separate gate and is not fabricated as PASS.
"""
          (out/"README_SERVER_READY_FINAL.md").write_text(readme,encoding="utf-8")
          print(readme)
          PY

      - name: Preserve corrected candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-ready-corrected-candidate
          path: ${{ runner.temp }}/server-ready-recovery
          if-no-files-found: error

      - name: Report recovery to issue 7
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          if test -f "${{ runner.temp }}/server-ready-recovery/README_SERVER_READY_FINAL.md"; then
            BODY=$(cat "${{ runner.temp }}/server-ready-recovery/README_SERVER_READY_FINAL.md")
            gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue comment 7 --repo "$GITHUB_REPOSITORY" --body "SERVER_READY mailbox recovery failed before terminal README. RUN_ID=$GITHUB_RUN_ID."
          fi
