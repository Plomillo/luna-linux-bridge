name: "SERVER_READY Final — material producer points 1-3"

on:
  push:
    branches:
      - staging/custosz-mission-mailbox-20260928
    paths:
      - .github/workflows/server-ready-final-material.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-ready-final-material-${{ github.ref }}
  cancel-in-progress: false

jobs:
  produce:
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 20
    steps:
      - name: Checkout exact governed surface
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            artifacts/custosz-v7
            Louksna.md
            missions/inbox/server-ready-final-g23-g24-20260928/MISSION_ORIGINAL.md
            server/symphylax-r1-candidate
            scripts/mission_mailbox/adapters/final_server_ready_closure.py
            scripts/missions/final_server_ready_materialize.py
            mission-mailbox/runtime-adapters/registry.json
          sparse-checkout-cone-mode: false
      - name: Verify pinned transition
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path(".")
          reg=json.load(open("mission-mailbox/runtime-adapters/registry.json"))
          a=next(x for x in reg["adapters"] if x["adapter_id"]=="FINAL_SERVER_READY_CLOSURE_V1")
          def sha(p): return hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
          assert sha(a["path"])==a["sha256"], "ADAPTER_SHA256_MISMATCH"
          assert sha(a["materializer_path"])==a["materializer_sha256"], "MATERIALIZER_SHA256_MISMATCH"
          assert sha("missions/inbox/server-ready-final-g23-g24-20260928/MISSION_ORIGINAL.md")==a["source_sha256"], "MISSION_SHA256_MISMATCH"
          assert a["scope"]=="FINAL_SERVER_READY_CLOSURE"
          assert a["execution_location"]=="SELF_HOSTED_LUNA_AUX"
          print("MATERIAL_TRANSITION_GATE=PASS")
          PY
      - name: Revalidate twelve controls
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/server-ready-final-preflight"
          nice -n 10 python3 -B -I scripts/mission_mailbox/adapters/final_server_ready_closure.py --repo-root . --out "$RUNNER_TEMP/server-ready-final-preflight"
      - name: Execute original mission points 1-3
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/server-ready-final-producer"
          nice -n 10 python3 -B -I scripts/missions/final_server_ready_materialize.py --repo-root . --preflight "$RUNNER_TEMP/server-ready-final-preflight" --out "$RUNNER_TEMP/server-ready-final-producer"
      - name: Preserve producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-ready-final-producer
          path: |
            ${{ runner.temp }}/server-ready-final-preflight
            ${{ runner.temp }}/server-ready-final-producer
          if-no-files-found: error
      - name: Show terminal producer report
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/server-ready-final-producer/README_SERVER_READY_FINAL.md" && cat "$RUNNER_TEMP/server-ready-final-producer/README_SERVER_READY_FINAL.md" || true
