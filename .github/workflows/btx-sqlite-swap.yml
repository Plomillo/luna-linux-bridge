name: One-shot BTX SQLite runtime substitution

on:
  push:
    branches:
      - audit/btx-book-census-20261023
    paths:
      - ".github/workflows/btx-sqlite-swap.yml"

permissions:
  actions: read
  contents: write

jobs:
  substitute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify artifact and candidate database
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/btx-book-census-20261023"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12539134323" > /tmp/btx-artifact-metadata.json
          python - <<'PY'
          import json
          a=json.load(open("/tmp/btx-artifact-metadata.json",encoding="utf-8"))
          assert a.get("id")==12539134323, "UNEXPECTED_ARTIFACT_ID"
          assert a.get("name")=="BTX-SQLite-Core-Candidate-STRUCTURAL-NOT-CERTIFIED", "UNEXPECTED_ARTIFACT_NAME"
          assert not a.get("expired", True), "ARTIFACT_EXPIRED"
          w=a.get("workflow_run") or {}
          assert w.get("id")==40041740047, "ARTIFACT_RUN_MISMATCH"
          assert w.get("head_branch")=="audit/btx-book-census-20261023", "ARTIFACT_BRANCH_MISMATCH"
          assert w.get("head_sha")=="ddfc1a97d4a5981824c427caaa3acdcfdde76c00", "ARTIFACT_COMMIT_MISMATCH"
          PY
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12539134323/zip" > /tmp/btx-candidate-artifact.zip
          python - <<'PY'
          import hashlib,json,shutil,sqlite3,zipfile
          from pathlib import Path
          zp=Path("/tmp/btx-candidate-artifact.zip")
          out=Path("/tmp/BTX_Book_Core_Candidate.sqlite3")
          expected_sha="fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0"
          expected_size=6750208
          with zipfile.ZipFile(zp) as z:
              names=z.namelist()
              def one(name):
                  found=[n for n in names if Path(n).name==name]
                  assert len(found)==1, f"ARTIFACT_MEMBER_COUNT:{name}:{len(found)}"
                  return found[0]
              b=json.loads(z.read(one("btx-candidate-validation.json")))
              i=json.loads(z.read(one("btx-independent-validation.json")))
              r=json.loads(z.read(one("btx-reproducibility.json")))
              assert b.get("structural_candidate_pass") is True, "BUILDER_GATE_NOT_PASS"
              assert i.get("candidate_structural_independent_validation")=="PASS", "INDEPENDENT_GATE_NOT_PASS"
              assert not i.get("failures"), "INDEPENDENT_VALIDATOR_FAILURES"
              assert i.get("certification")=="NOT_GRANTED", "UNEXPECTED_CERTIFICATION_STATE"
              assert r.get("reproducible") is True, "REPRODUCIBILITY_NOT_PASS"
              assert b.get("database_sha256")==expected_sha==i.get("database_sha256"), "REPORT_HASH_MISMATCH"
              assert b.get("database_file_bytes")==expected_size==i.get("database_file_bytes"), "REPORT_SIZE_MISMATCH"
              with z.open(one("BTX_Book_Core_Candidate.sqlite3")) as src, out.open("wb") as dst:
                  shutil.copyfileobj(src,dst)
          data=out.read_bytes()
          assert len(data)==expected_size, "DATABASE_SIZE_MISMATCH"
          assert hashlib.sha256(data).hexdigest()==expected_sha, "DATABASE_SHA256_MISMATCH"
          con=sqlite3.connect(f"file:{out}?mode=ro",uri=True)
          try:
              assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok", "SQLITE_INTEGRITY_FAILED"
              assert con.execute("SELECT COUNT(*) FROM books").fetchone()[0]==66, "BOOK_COUNT_MISMATCH"
              assert con.execute("SELECT COUNT(*) FROM chapters").fetchone()[0]==1189, "CHAPTER_COUNT_MISMATCH"
              assert con.execute("SELECT COUNT(*) FROM verses").fetchone()[0]==29883, "VERSE_ROW_COUNT_MISMATCH"
          finally:
              con.close()
          print(json.dumps({"candidate_bytes":len(data),"candidate_sha256":expected_sha,"structural_validation":"PASS","reproducibility":"PASS","certification":"NOT_GRANTED"},indent=2))
          PY

      - name: Replace runtime asset and update governed references
        run: |
          set -euo pipefail
          SOURCE='cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).7z'
          TARGET='cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).sqlite3'
          ROLLBACK='externalized-assets-staging/2-Orquestacion/BTX/Biblia_Textual_BTX_original_rollback.7z'
          test -f "$SOURCE"
          test "$(stat -c %s "$SOURCE")" = "6949245"
          test "$(sha256sum "$SOURCE" | cut -d ' ' -f 1)" = "be5ec9ee6153a5573a8e491e2f96ea0a4e94c9c6c023d3cb43abd6807f040b36"
          test ! -e "$TARGET"
          test ! -e "$ROLLBACK"
          mkdir -p "$(dirname "$ROLLBACK")"
          git mv "$SOURCE" "$ROLLBACK"
          cp /tmp/BTX_Book_Core_Candidate.sqlite3 "$TARGET"
          test "$(stat -c %s "$TARGET")" = "6750208"
          test "$(sha256sum "$TARGET" | cut -d ' ' -f 1)" = "fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0"
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path(".")
          old="cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).7z"
          new="externalized-assets-staging/2-Orquestacion/BTX/Biblia_Textual_BTX_original_rollback.7z"
          for name in ("tools/btx-audit/build_btx_sqlite_candidate.py",
                       "tools/btx-audit/inspect_pdf_layout.py",
                       "tools/btx-audit/analyze_chapter_spans.py"):
              p=root/name
              text=p.read_text(encoding="utf-8")
              assert old in text, f"SOURCE_PATH_NOT_FOUND:{name}"
              p.write_text(text.replace(old,new),encoding="utf-8")
          p=root/"tools/btx-audit/audit_source.py"
          text=p.read_text(encoding="utf-8")
          before="SOURCE_PATH = ROOT / SUBDIR / SOURCE_NAME"
          after='SOURCE_PATH = ROOT / "externalized-assets-staging/2-Orquestacion/BTX/Biblia_Textual_BTX_original_rollback.7z"'
          assert text.count(before)==1, "AUDIT_SOURCE_PATH_NOT_UNIQUE"
          p.write_text(text.replace(before,after),encoding="utf-8")
          regpath=root/"cajita-luna-runtime/RUNTIME_CANDIDATE_V1/registry.json"
          data=json.loads(regpath.read_text(encoding="utf-8"))
          found=[]
          def walk(value):
              if isinstance(value,dict):
                  if value.get("id")=="A029":
                      found.append(value)
                  for child in value.values():
                      walk(child)
              elif isinstance(value,list):
                  for child in value:
                      walk(child)
          walk(data)
          assert len(found)==1, f"A029_COUNT:{len(found)}"
          a=found[0]
          old_reg="2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).7z"
          new_reg="2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).sqlite3"
          assert a.get("path")==old_reg, "A029_OLD_PATH_MISMATCH"
          a["path"]=new_reg
          a["type"]=".sqlite3"
          a["size"]=6750208
          a["sha256"]="fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0"
          a["archive_or_distribution_artifact"]="PRESENT_AS_SQLITE_CORE_DATABASE"
          a["optional_authorization"]="EXPLICIT_USER_AUTHORIZATION_FOR_SQLITE_SUBSTITUTION_2026-10-23"
          a["runtime_substitution"]={
            "status":"APPLIED_UNCERTIFIED",
            "authorization":"EXPLICIT_USER_DIRECTIVE_2026-10-23",
            "previous_runtime_path":old_reg,
            "previous_sha256":"be5ec9ee6153a5573a8e491e2f96ea0a4e94c9c6c023d3cb43abd6807f040b36",
            "previous_size_bytes":6949245,
            "rollback_path":new,
            "candidate_runtime_path":new_reg,
            "candidate_sha256":"fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0",
            "candidate_size_bytes":6750208,
            "candidate_build_run_id":40041740047,
            "candidate_artifact_id":12539134323,
            "structural_validation":"PASS",
            "byte_reproducibility":"PASS",
            "source_to_verse_content_equivalence":"NOT_INDEPENDENTLY_VALIDATED",
            "editorial_apparatus":"NOT_INCLUDED_OR_CERTIFIED",
            "certification":"NOT_GRANTED",
            "operability":"UNVERIFIED",
            "rollback_verified_after_substitution":False
          }
          regpath.write_text(json.dumps(data,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          docpath=root/"cajita-luna-runtime/CajitadeLuna.md"
          doc=docpath.read_text(encoding="utf-8")
          marker="## Sustitución operativa BTX por SQLite — 2026-10-23"
          assert marker not in doc, "BTX_SWAP_SECTION_ALREADY_EXISTS"
          doc += """

          ## Sustitución operativa BTX por SQLite — 2026-10-23

          El recurso BTX del runtime se ha sustituido por la candidata SQLite en la ruta equivalente del dominio Orquestación. El PDF empaquetado en el antiguo contenedor .7z ya no está en la ruta de runtime.

          - Recurso activo: 2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).sqlite3
          - Tamaño: 6.750.208 bytes.
          - SHA-256: fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0.
          - Fuente original preservada para rollback fuera del runtime: externalized-assets-staging/2-Orquestacion/BTX/Biblia_Textual_BTX_original_rollback.7z
          - Construcción de origen: GitHub Actions run 40041740047, artefacto 12539134323.
          - Estado: RUNTIME_SUBSTITUTION=APPLIED_UNCERTIFIED; STRUCTURAL_VALIDATION=PASS; BYTE_REPRODUCIBILITY=PASS; SOURCE_TO_VERSE_CONTENT_EQUIVALENCE=NOT_INDEPENDENTLY_VALIDATED; EDITORIAL_APPARATUS=NOT_INCLUDED_OR_CERTIFIED; CERTIFICATION=NOT_GRANTED; OPERABILITY=UNVERIFIED.

          Esta sustitución cambia el formato de almacenamiento del recurso; no declara certificación integral del texto bíblico ni equivalencia versículo por versículo. La entrada A029 conserva los hashes, tamaños, procedencia y estado pendiente. El archivo original se retiene únicamente para recuperación.
          """
          docpath.write_text(doc,encoding="utf-8")
          auditpath=root/"docs/cajita-luna/BTX_ORCHESTRATOR_FORENSIC_AUDIT_20261023.md"
          audit=auditpath.read_text(encoding="utf-8")
          marker2="## 15. Sustitución de runtime ejecutada por autorización explícita — 2026-10-23"
          assert marker2 not in audit, "AUDIT_SWAP_ADDENDUM_ALREADY_EXISTS"
          audit += """

          ## 15. Sustitución de runtime ejecutada por autorización explícita — 2026-10-23

          Esta sección actualiza el estado operativo posterior a las secciones históricas anteriores. Por instrucción explícita del usuario, el contenedor BTX .7z fue retirado de su ubicación dentro del runtime y reemplazado por la candidata SQLite de la ejecución de GitHub Actions 40041740047 (artefacto 12539134323).

          - Archivo anterior retirado del runtime: cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).7z.
          - Copia de recuperación preservada fuera del runtime: externalized-assets-staging/2-Orquestacion/BTX/Biblia_Textual_BTX_original_rollback.7z; SHA-256 original be5ec9ee6153a5573a8e491e2f96ea0a4e94c9c6c023d3cb43abd6807f040b36.
          - Nuevo recurso de runtime: cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).sqlite3; 6.750.208 bytes; SHA-256 fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0.
          - El registro A029 y CajitadeLuna.md se actualizaron aditivamente. Las herramientas de auditoría apuntan ahora al original preservado fuera del runtime para permitir futuras reconstrucciones.
          - Estado: STRUCTURAL_VALIDATION=PASS; BYTE_REPRODUCIBILITY=PASS; SOURCE_TO_VERSE_CONTENT_EQUIVALENCE=NOT_INDEPENDENTLY_VALIDATED; CERTIFICATION=NOT_GRANTED; OPERABILITY=UNVERIFIED; ROLLBACK_VERIFIED_AFTER_SUBSTITUTION=NOT_YET_EXECUTED.

          El contenido del archivo original no se modificó; solo se movió a la ubicación de rollback. Esta operación sustituye el recurso del runtime y no equivale a certificación del contenido.
          """
          auditpath.write_text(audit,encoding="utf-8")
          report={
            "schema":"BTX_SQLITE_RUNTIME_SWAP/1.0",
            "status":"APPLIED_UNCERTIFIED",
            "authorization":"EXPLICIT_USER_DIRECTIVE_2026-10-23",
            "runtime_old_path":old,
            "runtime_new_path":"cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).sqlite3",
            "rollback_path":new,
            "old_archive_bytes":6949245,
            "old_archive_sha256":"be5ec9ee6153a5573a8e491e2f96ea0a4e94c9c6c023d3cb43abd6807f040b36",
            "embedded_source_pdf_sha256":"30dc19d8bc0905b311a185726583cb55d0907d97cdcf015e971cf46ff33d3acd",
            "candidate_bytes":6750208,
            "candidate_sha256":"fdb4a43776a06e76cf772242bc8c802970b2b55c9544cd03826aa8453bc993e0",
            "candidate_build_run_id":40041740047,
            "candidate_artifact_id":12539134323,
            "structural_validation":"PASS",
            "independent_structural_validation":"PASS",
            "byte_reproducibility":"PASS",
            "source_to_verse_content_equivalence":"NOT_INDEPENDENTLY_VALIDATED",
            "editorial_apparatus":"NOT_INCLUDED_OR_CERTIFIED",
            "certification":"NOT_GRANTED",
            "operability":"UNVERIFIED",
            "global_package_size_recomputed":False,
            "rollback_verified_after_substitution":False
          }
          out=root/"docs/cajita-luna/BTX_SQLITE_RUNTIME_SWAP_20261023.json"
          out.write_text(json.dumps(report,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
          python -m json.tool cajita-luna-runtime/RUNTIME_CANDIDATE_V1/registry.json > /dev/null
          python -m py_compile tools/btx-audit/*.py
          test ! -e "$SOURCE"
          test -f "$TARGET"
          test -f "$ROLLBACK"
          test "$(sha256sum "$ROLLBACK" | cut -d ' ' -f 1)" = "be5ec9ee6153a5573a8e491e2f96ea0a4e94c9c6c023d3cb43abd6807f040b36"
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          report=json.loads(Path("docs/cajita-luna/BTX_SQLITE_RUNTIME_SWAP_20261023.json").read_text())
          assert report["status"]=="APPLIED_UNCERTIFIED"
          con=sqlite3.connect("cajita-luna-runtime/2. Orquestación/Confesión Eclesial Reformada/Biblia Textual BTX -- Biblia Textual BTX -- ( WeLib.org ).sqlite3")
          assert con.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          con.close()
          print(json.dumps({"runtime_swap_report":"PASS","candidate_present":True,"original_outside_runtime":True,"certification":"NOT_GRANTED"},indent=2))
          PY

      - name: Commit replacement with rollback provenance
        run: |
          set -euo pipefail
          find tools/btx-audit -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Replace runtime BTX PDF archive with compact SQLite candidate"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Runtime replacement committed; certification remains NOT_GRANTED." >> "$GITHUB_STEP_SUMMARY"
