name: "SYMPHYLAX: prueba estatica de candado inerte (sin servidor)"
on:
  push:
    branches:
      - staging/architecture-louksnamejorada-20260927
    paths:
      - .github/workflows/verify-symphylax-inert-static.yml
      - scripts/governance/verify_symp_inert_candidate.py
      - docs/architecture/SYMPHYLAX_R1_NIGHT_MISSION_LOCK_CANDIDATE.json
permissions:
  contents: read
concurrency:
  group: symphylax-static-inert-only
  cancel-in-progress: false
jobs:
  static-negative-tests:
    name: "GitHub-hosted; SIN SSH, SIN CUSTOSZ, SIN PROYECTOS"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Descargar solo el commit candidato
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validar que el candado DECLARA no activacion y rechaza mutaciones
        shell: bash
        env:
          GITHUB_RUNNER_KIND: GITHUB_HOSTED_NO_USER_HOST_ACCESS
        run: |
          set -Eeuo pipefail
          python3 -B -I scripts/governance/verify_symp_inert_candidate.py \
            --lock docs/architecture/SYMPHYLAX_R1_NIGHT_MISSION_LOCK_CANDIDATE.json \
            --self-test
          echo "STATIC_TESTS_ONLY=PASS; NO_G23_NO_G24_NO_AUTORIZO; NO_HOST_ACTION"
