                    "updated_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())})
          t=str(p)+".tmp"; json.dump(d,open(t,"w"),indent=2,sort_keys=True); os.replace(t,p)
          PY
          BODY="$(python3 - "$M" "$R" <<'PY'
          import hashlib,json,sys,os
          print(json.dumps({"schema":"LOUKSNA_R4_PART4_R2_HANDOFF_V7/1.0","status":"PASS","from":"P2_P4_RETIRED_G24","to":"FINAL_MERGE_PREBOOT",
                            "source_run":int(os.environ["GITHUB_RUN_ID"]),"migration_g24_sha256":hashlib.sha256(open(sys.argv[1],"rb").read()).hexdigest(),
                            "retirement_g24_sha256":hashlib.sha256(open(sys.argv[2],"rb").read()).hexdigest(),"privilege_bridge_v121":"CERTIFIED_ACTIVE",
                            "failure_posture":"FAIL_CLOSED"},sort_keys=True))
          PY
