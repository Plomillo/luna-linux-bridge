name: "CUSTOSZ — desktop folder ingestion consultation 60s"

on:
  push:
    branches:
      - staging/mailbox-dispatch-bridge-repair-20261002
    paths:
      - "missions/inbox/desktop-priority-folder-ingestion-consult-20261003/MISSION_ORIGINAL.md"

permissions:
  contents: read

concurrency:
  group: custosz-desktop-folder-ingestion-consult-60s
  cancel-in-progress: false

env:
  MISSION_PATH: "missions/inbox/desktop-priority-folder-ingestion-consult-20261003/MISSION_ORIGINAL.md"

jobs:
  receipt:
    name: "Receipt evidence"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout consultation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            missions/inbox/desktop-priority-folder-ingestion-consult-20261003/MISSION_ORIGINAL.md
          sparse-checkout-cone-mode: false

      - name: Produce receipt
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/receipt"
          test -s "$MISSION_PATH"
          SHA="$(sha256sum "$MISSION_PATH" | awk '{print $1}')"
          BYTES="$(stat -c '%s' "$MISSION_PATH")"
          python3 - "$RUNNER_TEMP/receipt/RECEIPT.json" "$MISSION_PATH" "$SHA" "$BYTES" "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          out,path,sha,size,commit,run_id=sys.argv[1:]
          obj={
            "schema":"LOUKSNA_MISSION_CONSULT_RECEIPT/1.0",
            "status":"RECEIVED",
            "source_path":path,
            "source_sha256":sha,
            "source_bytes":int(size),
            "source_commit":commit,
            "run_id":run_id,
            "consultation_only":True,
            "material_execution_authorized":False,
            "mutation_authorized":False,
            "download_authorized":False,
            "install_authorized":False
          }
          open(out,"w",encoding="utf-8").write(json.dumps(obj,indent=2,sort_keys=True)+"\n")
          print(json.dumps(obj,sort_keys=True))
          PY

      - name: Preserve receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-folder-ingestion-consult-receipt
          path: ${{ runner.temp }}/receipt/RECEIPT.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  certify_flow:
    name: "Certify receipt and start eligibility"
    needs: receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Checkout source independently
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            missions/inbox/desktop-priority-folder-ingestion-consult-20261003/MISSION_ORIGINAL.md
          sparse-checkout-cone-mode: false

      - name: Recover receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: desktop-folder-ingestion-consult-receipt
          path: ${{ runner.temp }}/receipt

      - name: Independent flow-start certification
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/cert"
          python3 - "$MISSION_PATH" "$RUNNER_TEMP/receipt/RECEIPT.json" "$RUNNER_TEMP/cert/FLOW_CERT.json" <<'PY'
          import hashlib,json,sys
          mission,receipt_path,out=sys.argv[1:]
          raw=open(mission,"rb").read()
          r=json.load(open(receipt_path,encoding="utf-8"))
          sha=hashlib.sha256(raw).hexdigest()
          checks={
            "received": r.get("status")=="RECEIVED",
            "source_sha_match": r.get("source_sha256")==sha,
            "source_bytes_match": r.get("source_bytes")==len(raw),
            "consultation_only": r.get("consultation_only") is True,
            "material_execution_forbidden": r.get("material_execution_authorized") is False,
            "mutation_forbidden": r.get("mutation_authorized") is False,
            "download_forbidden_now": r.get("download_authorized") is False,
            "install_forbidden_now": r.get("install_authorized") is False
          }
          status="PASS" if all(checks.values()) else "FAIL"
          obj={
            "schema":"LOUKSNA_CONSULT_FLOW_START_CERT/1.0",
            "scope":"RECEIPT_INTEGRITY_AND_FLOW_START_ONLY",
            "status":status,
            "checks":checks,
            "semantic_answer_certified":False,
            "material_execution_authorized":False,
            "certification_propagation":False
          }
          open(out,"w",encoding="utf-8").write(json.dumps(obj,indent=2,sort_keys=True)+"\n")
          print(json.dumps(obj,sort_keys=True))
          raise SystemExit(0 if status=="PASS" else 2)
          PY

      - name: Preserve flow-start certificate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-folder-ingestion-flow-cert
          path: ${{ runner.temp }}/cert/FLOW_CERT.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  consult:
    name: "CUSTOSZ corrected read-only consultation"
    needs: certify_flow
    runs-on: [self-hosted, Linux, x64, luna-aux]
    timeout-minutes: 2
    steps:
      - name: Checkout consultation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            missions/inbox/desktop-priority-folder-ingestion-consult-20261003/MISSION_ORIGINAL.md
          sparse-checkout-cone-mode: false

      - name: Ask deployed CUSTOSZ with governed workspace adapter
        shell: bash
        run: |
          set -Eeuo pipefail
          OUT="$RUNNER_TEMP/desktop-folder-ingestion-consult"
          mkdir -p "$OUT"
          timeout --signal=TERM --kill-after=5s 60s python3 - "$MISSION_PATH" "$OUT/CUSTOSZ_RESPONSE.json" <<'PY'
          import json,os,pathlib,sys,traceback
          mission_path=pathlib.Path(sys.argv[1])
          out=pathlib.Path(sys.argv[2])
          mission=mission_path.read_text(encoding="utf-8")

          home=pathlib.Path("/home/diegoignacionorambuenamiranda")
          project_root=home/"LOUKSNA_MAESTRO_20260925"
          custosz=home/".local/lib/louksna/symphylax-r1/CUSTOSZ.v07.f04_b.pyz"

          os.environ["CUSTOSZ_STATE_DIR"]=str(out.parent/"ephemeral-custosz-state")
          sys.path.insert(0,str(custosz))
          import custosz_v05_legacy as w

          # This consultation is architectural. The target desktop folder is
          # explicitly NOT required to exist inside the GitHub checkout.
          def workspace_adapter():
              return project_root

          def discover_adapter():
              return {
                "workspace":str(project_root),
                "projects":{
                  "LUNA_PROJECT":{
                    "status":"RESOLVED",
                    "path":str(project_root),
                    "score":999
                  }
                }
              }

          w.workspace=workspace_adapter
          w.discover=discover_adapter

          prompt = """CONSULTA ARQUITECTÓNICA READ_ONLY. IMPORTANTE: la carpeta objetivo NO está actualmente en GitHub ni dentro del workflow. Está en el host/escritorio del usuario y se pregunta por una capacidad FUTURA de ingestión desde el host hacia el repositorio. No intentes descubrir esa carpeta dentro del checkout para decidir si la capacidad existe. Evalúa la arquitectura y mecanismos disponibles. Si la capacidad es insuficiente, investiga conceptualmente qué dependencias, adaptadores, herramientas o contratos faltan y cuáles podrían obtenerse posteriormente mediante la capacidad gobernada de descarga de main. No descargar, instalar, copiar, mover, indexar, absorber ni mutar nada en esta consulta. Techo bruto: 60 segundos.\n\n""" + mission

          result={
            "schema":"LOUKSNA_DESKTOP_FOLDER_INGESTION_CONSULT/1.0",
            "mode":"READ_ONLY_ADVISORY",
            "authority":"Louksna.md",
            "consultation_only":True,
            "execution_authorized":False,
            "mutation_authorized":False,
            "download_authorized":False,
            "install_authorized":False,
            "target_folder_present_in_github":False
          }

          try:
              result["architecture"]=w.architect(prompt,"LUNA_PROJECT")
          except Exception as e:
              result["architecture_error"]=type(e).__name__+":"+str(e)
              result["architecture_traceback"]=traceback.format_exc()

          try:
              result["reasoning_policy"]=w.reasoning_policy(prompt,"LUNA_PROJECT")
          except Exception as e:
              result["reasoning_policy_error"]=type(e).__name__+":"+str(e)
              result["reasoning_policy_traceback"]=traceback.format_exc()

          out.write_text(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          print(json.dumps(result,ensure_ascii=False,indent=2,sort_keys=True))
          PY

      - name: Preserve response
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-folder-ingestion-custosz-response
          path: ${{ runner.temp }}/desktop-folder-ingestion-consult/CUSTOSZ_RESPONSE.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
