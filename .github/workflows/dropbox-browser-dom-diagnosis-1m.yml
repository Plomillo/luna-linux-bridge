name: "Dropbox browser DOM diagnosis — 1m"

on:
  push:
    branches:
      - staging/dropbox-main-governed-recovery-20h-20261004
    paths:
      - .github/workflows/dropbox-browser-dom-diagnosis-1m.yml

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Read browser page evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11357220112"
        run: |
          set -Eeuo pipefail
          mkdir -p /tmp/dbxdom
          curl -fsSL             -H "Authorization: Bearer ${GH_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"             -o /tmp/dbxdom/evidence.zip
          python3 - <<'PY'
          import zipfile, pathlib, re, html
          z=zipfile.ZipFile('/tmp/dbxdom/evidence.zip')
          z.extractall('/tmp/dbxdom/unpacked')
          p=pathlib.Path('/tmp/dbxdom/unpacked/BROWSER_PAGE.html')
          if not p.exists():
              p=pathlib.Path('/tmp/dbxdom/unpacked/acquisition/BROWSER_PAGE.html')
          print("HTML_PATH=",p)
          text=p.read_text(encoding='utf-8',errors='replace')
          print("HTML_BYTES=",len(text.encode('utf-8')))
          pats=[
              r'.{0,300}download.{0,500}',
              r'.{0,300}descargar.{0,500}',
              r'.{0,300}aria-label=.{0,500}',
              r'.{0,300}data-testid=.{0,500}',
              r'.{0,300}<button.{0,700}',
          ]
          seen=set()
          for pat in pats:
              print("\n=== PATTERN",pat,"===")
              n=0
              for m in re.finditer(pat,text,re.I|re.S):
                  s=re.sub(r'\s+',' ',m.group(0))
                  s=html.unescape(s)
                  key=s[:500]
                  if key in seen: continue
                  seen.add(key)
                  print(s[:1200])
                  n+=1
                  if n>=30: break
              print("MATCHES_SHOWN=",n)
          PY
