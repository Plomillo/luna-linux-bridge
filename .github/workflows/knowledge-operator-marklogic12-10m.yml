name: Knowledge Operator MarkLogic12 10m

on:
  push:
    branches:
      - staging/knowledge-operator-marklogic12-10m-20261003
    paths:
      - 'mission-control/knowledge-operator-marklogic12-10m/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Execute exact three-point mission
        shell: bash
        run: bash mission-control/knowledge-operator-marklogic12-10m/run.sh
