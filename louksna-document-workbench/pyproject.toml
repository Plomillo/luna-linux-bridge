[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "louksna-document-workbench"
version = "0.1.0"
description = "Standalone, local-first PDF organization, text reflow, OCR orchestration and document translation toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "PyMuPDF>=1.24,<2",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5"
]

[project.optional-dependencies]
translate = ["argostranslate>=1.9"]
test = ["pytest>=8"]

[project.scripts]
louksna-docworkbench = "louksna_docworkbench.cli:main"
louksna-docworkbench-gui = "louksna_docworkbench.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
