id: louksnapg_phase4_to9_supervisor
namespace: louksna.kestra
description: >-
  Kestra control-plane supervisor for the isolated LOUKSNAPG Phase 4–9 continuation.
  GitHub-hosted runners execute bounded work; Kestra monitors the exact branch,
  phase jobs, and local checkpoint. This flow is read-only: no model inference,
  no local file writes, no weight upload, and no certification propagation.
tasks:
  - id: latest_phase4_to9_run
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/runs?branch=louksnapg%2Fphase4-resume-20261028&per_page=10"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
    timeout: PT15S
    options:
      connectTimeout: PT5S
      readTimeout: PT10S
      retry:
        type: constant
        maxAttempts: 2
        interval: PT10S
        maxDuration: PT25S
        warningOnRetry: true

  - id: latest_phase_job_states
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/runs/{{ fromJson(outputs.latest_phase4_to9_run.body).workflow_runs[0].id }}/jobs?per_page=20"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
    timeout: PT15S
    options:
      connectTimeout: PT5S
      readTimeout: PT10S
      retry:
        type: constant
        maxAttempts: 2
        interval: PT10S
        maxDuration: PT25S
        warningOnRetry: true

  - id: read_local_phase_checkpoint
    type: io.kestra.plugin.core.http.Request
    uri: "http://127.0.0.1:8765/LOUKSNAPG_ACTIVE_CHECKPOINT.json"
    method: GET
    timeout: PT10S
    options:
      connectTimeout: PT3S
      readTimeout: PT7S

  - id: record_ordered_phase_state
    type: io.kestra.plugin.core.log.Log
    message: |
      LOUKSNAPG_CONTROL_PLANE=KESTRA
      EXECUTION_WORKER=GITHUB_HOSTED_RUNNER
      BRANCH=louksnapg/phase4-resume-20261028
      LATEST_RUN_ID={{ fromJson(outputs.latest_phase4_to9_run.body).workflow_runs[0].id }}
      LATEST_RUN_SHA={{ fromJson(outputs.latest_phase4_to9_run.body).workflow_runs[0].head_sha }}
      LATEST_RUN_STATUS={{ fromJson(outputs.latest_phase4_to9_run.body).workflow_runs[0].status }}
      LATEST_RUN_CONCLUSION={{ fromJson(outputs.latest_phase4_to9_run.body).workflow_runs[0].conclusion }}
      LATEST_RUN_URL={{ fromJson(outputs.latest_phase4_to9_run.body).workflow_runs[0].html_url }}
      PHASE_JOB_STATES={{ outputs.latest_phase_job_states.body }}
      LOCAL_CHECKPOINT_SCHEMA={{ fromJson(outputs.read_local_phase_checkpoint.body).schema }}
      LOCAL_CHECKPOINT_CANDIDATE={{ fromJson(outputs.read_local_phase_checkpoint.body).candidate_commit }}
      PHASES_1_TO_3=REUSED_NOT_RERUN
      PHASE_4=PINNED_DIAGNOSTIC_EVIDENCE_AND_FAIL_CLOSED_REPAIR_GATE
      PHASE_5=RUN_ONLY_AFTER_VERIFIED_PRIVATE_REPAIR_BUNDLE_ADMISSION
      PHASE_6=RUN_ONLY_AFTER_PHASE_5_PASS
      PHASE_7=INDEPENDENT_EVIDENCE_RECHECK_ONLY_AFTER_PHASE_5_AND_6_PASS
      PHASE_8=RELEASE_BLOCKED_UNLESS_ALL_DOMAIN_GATES_AND_G23_G24_PASS
      PHASE_9=PROVENANCE_ROLLBACK_AND_FINAL_GATE_RECORD
      LOCAL_MODEL_INFERENCE=FORBIDDEN
      LOCAL_WEIGHT_UPLOAD_TO_PUBLIC_REPOSITORY=FORBIDDEN
      PRIVATE_REPAIR_BUNDLE=REQUIRED_BEFORE_PHASE_5
      GLOBAL_CERTIFICATION=NOT_GRANTED_BY_SUPERVISOR
triggers:
  - id: monitor_phase4_to9_every_five_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    timezone: Etc/UTC
    allowConcurrent: false
