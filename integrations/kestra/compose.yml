services:
  postgres:
    image: postgres:18.6-alpine
    pull_policy: always
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in integrations/kestra/.env}
    volumes:
      - kestra-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d \"$${POSTGRES_DB}\" -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot permission bootstrap: root is used only here, with CHOWN capability,
  # no network, no Docker socket, and no access to any other host path.
  storage-init:
    image: kestra/kestra:v2.0.3
    pull_policy: always
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        kestra_uid="$(id -u kestra)"
        kestra_gid="$(id -g kestra)"
        test "$kestra_uid" -gt 0
        mkdir -p /app/storage/plugins
        if [ ! -e /app/storage/.kestra-volume-permissions-v1 ]; then
          touch /app/storage/.kestra-volume-permissions-v1
          chown -R "$kestra_uid:$kestra_gid" /app/storage
        fi
    network_mode: none
    read_only: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    volumes:
      - kestra-data:/app/storage

  kestra:
    image: kestra/kestra:v2.0.3
    pull_policy: always
    command: server standalone
    restart: unless-stopped
    stop_grace_period: 6m
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      KESTRA_CONFIGURATION: |
        endpoints:
          all:
            basic-auth:
              username: ${KESTRA_ADMIN_EMAIL:?Set KESTRA_ADMIN_EMAIL in integrations/kestra/.env}
              password: ${KESTRA_ADMIN_PASSWORD:?Set KESTRA_ADMIN_PASSWORD in integrations/kestra/.env}
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD:?Set KESTRA_DB_PASSWORD in integrations/kestra/.env}
        kestra:
          server:
            basic-auth:
              enabled: true
              username: ${KESTRA_ADMIN_EMAIL:?Set KESTRA_ADMIN_EMAIL in integrations/kestra/.env}
              password: ${KESTRA_ADMIN_PASSWORD:?Set KESTRA_ADMIN_PASSWORD in integrations/kestra/.env}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      # Both ports deliberately bind to loopback only. Port 8081 is an
      # unauthenticated management endpoint; do not bind it to 0.0.0.0.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:18081:8081"
    volumes:
      - kestra-data:/app/storage
    security_opt:
      - no-new-privileges:true

volumes:
  kestra-postgres-data:
  kestra-data:
