id: louksnapg_bundle_audit
namespace: louksna.kestra
description: >-
  Fail-closed secondary audit of an exact LOUKSNAPG candidate. Package integrity,
  bounded worker execution, and primitive smoke tests are not integral product
  certification. G23 must be independently signed and verified; G24 must be a
  separate signed and authorized decision by an independent signer.
inputs:
  - id: source_commit
    type: STRING
  - id: architecture_contract_sha256
    type: STRING
  - id: architecture_contract_status
    type: STRING
  - id: primary_worker_id
    type: STRING
  - id: secondary_worker_id
    type: STRING
  - id: custosz_worker_evidence_sha256
    type: STRING
  - id: custosz_repair_report_sha256
    type: STRING
  - id: custosz_repair_status
    type: STRING
  - id: custosz_repair_preflight_status
    type: STRING
  - id: custosz_candidate_integrity_status
    type: STRING
  - id: custosz_repair_target_pass_count
    type: INT
    defaults: 0
  - id: custosz_repair_target_expected_count
    type: INT
    defaults: 3
  - id: custosz_repair_source_commit
    type: STRING
  - id: custosz_repair_bundle_sha256
    type: STRING
  - id: custosz_repair_contract_sha256
    type: STRING
  - id: custosz_repair_hash_verified
    type: STRING
  - id: official_source_review_status
    type: STRING
  - id: telemetry_evidence_sha256
    type: STRING
  - id: telemetry_status
    type: STRING
  - id: heavy_model_download_count
    type: INT
    defaults: 0
  - id: remote_commander_used
    type: STRING
  - id: bundle_sha256
    type: STRING
  - id: bundle_bytes
    type: INT
  - id: max_bytes
    type: INT
    defaults: 479000000
  - id: document_sha256
    type: STRING
  - id: runtime_source_sha256
    type: STRING
  - id: worker_status
    type: STRING
  - id: independent_integrity_status
    type: STRING
  - id: identity_binding_status
    type: STRING
  - id: engine_replacement_status
    type: STRING
  - id: functional_status
    type: STRING
  - id: semantic_quality_status
    type: STRING
  - id: host_matrix_status
    type: STRING
  - id: rollback_status
    type: STRING
  - id: axiom_binding_status
    type: STRING
  - id: block_binding_status
    type: STRING
  - id: functional_evidence_sha256
    type: STRING
  - id: functional_evidence_source_commit
    type: STRING
  - id: functional_evidence_status
    type: STRING
  - id: functional_target_pass_count
    type: INT
    defaults: 0
  - id: functional_target_expected_count
    type: INT
    defaults: 21
  - id: functional_evidence_mode
    type: STRING
  - id: g23_attestation_sha256
    type: STRING
  - id: g23_signature_verification_status
    type: STRING
  - id: g23_producer_id
    type: STRING
  - id: g23_validator_id
    type: STRING
  - id: g24_decision_sha256
    type: STRING
  - id: g24_decision_status
    type: STRING
  - id: g24_signature_verification_status
    type: STRING
  - id: g24_signer_id
    type: STRING

tasks:
  - id: evidence_shape
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.source_commit matches '^[0-9a-f]{40}$'
         and inputs.architecture_contract_sha256 matches '^[0-9a-f]{64}$'
         and inputs.custosz_worker_evidence_sha256 matches '^[0-9a-f]{64}$'
         and inputs.custosz_repair_report_sha256 matches '^[0-9a-f]{64}$'
         and inputs.custosz_repair_source_commit == inputs.source_commit
         and inputs.custosz_repair_bundle_sha256 == inputs.bundle_sha256
         and inputs.custosz_repair_contract_sha256 == inputs.architecture_contract_sha256
         and inputs.telemetry_evidence_sha256 matches '^[0-9a-f]{64}$'
         and inputs.bundle_sha256 matches '^[0-9a-f]{64}$'
         and inputs.document_sha256 matches '^[0-9a-f]{64}$'
         and inputs.runtime_source_sha256 matches '^[0-9a-f]{64}$'
         and inputs.functional_evidence_sha256 matches '^[0-9a-f]{64}$'
         and inputs.g23_attestation_sha256 matches '^[0-9a-f]{64}$'
         and inputs.g24_decision_sha256 matches '^[0-9a-f]{64}$'
         and inputs.functional_evidence_source_commit == inputs.source_commit
         and inputs.bundle_bytes > 0
         and inputs.max_bytes == 479000000
         and inputs.bundle_bytes <= inputs.max_bytes }}
    then:
      - id: evidence_shape_pass
        type: io.kestra.plugin.core.log.Log
        message: >-
          LOUKSNAPG_EVIDENCE_SHAPE=PASS
          source_commit={{ inputs.source_commit }}
          contract_sha256={{ inputs.architecture_contract_sha256 }}
          bundle_sha256={{ inputs.bundle_sha256 }}
          custosz_repair_report_sha256={{ inputs.custosz_repair_report_sha256 }}
          bundle_bytes={{ inputs.bundle_bytes }}
          hard_cap_bytes={{ inputs.max_bytes }}
          release_eligibility=NOT_GRANTED_BY_SHAPE_CHECK
    else:
      - id: evidence_shape_fail
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          LOUKSNAPG_EVIDENCE_SHAPE=HOLD.
          A required identity hash, CUSTOSZ repair binding, source binding,
          or byte ceiling is missing or invalid. Global certification remains NOT_GRANTED.

  - id: release_gates
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ inputs.worker_status == 'PASS'
         and inputs.architecture_contract_status == 'PASS_CONTRACT_INTEGRITY'
         and inputs.primary_worker_id == 'CUSTOSZ_V9'
         and inputs.secondary_worker_id == 'KESTRA'
         and inputs.custosz_repair_status == 'PASS_THREE_TARGETED_PRIMITIVES'
         and inputs.custosz_repair_preflight_status == 'PASS'
         and inputs.custosz_candidate_integrity_status == 'PASS'
         and inputs.custosz_repair_target_pass_count == 3
         and inputs.custosz_repair_target_expected_count == 3
         and inputs.custosz_repair_hash_verified == 'true'
         and inputs.custosz_repair_source_commit == inputs.source_commit
         and inputs.custosz_repair_bundle_sha256 == inputs.bundle_sha256
         and inputs.custosz_repair_contract_sha256 == inputs.architecture_contract_sha256
         and inputs.independent_integrity_status == 'PASS'
         and inputs.identity_binding_status == 'PASS_SOURCE_IDENTITY_PRESERVED'
         and inputs.engine_replacement_status == 'FORBIDDEN'
         and inputs.official_source_review_status == 'PASS'
         and inputs.functional_status == 'PASS_ALL_21_REQUIRED_TARGETS'
         and inputs.functional_evidence_status == 'PASS_INTEGRAL_FUNCTIONAL_EVIDENCE'
         and inputs.functional_evidence_mode == 'REAL_RUNTIME_EXECUTION'
         and inputs.functional_target_pass_count == 21
         and inputs.functional_target_expected_count == 21
         and inputs.semantic_quality_status == 'PASS'
         and inputs.g23_signature_verification_status == 'PASS_VERIFIED'
         and inputs.g23_producer_id != inputs.g23_validator_id
         and inputs.g24_decision_status == 'GRANTED'
         and inputs.g24_signature_verification_status == 'PASS_VERIFIED'
         and inputs.g24_signer_id != inputs.g23_producer_id
         and inputs.g24_signer_id != inputs.g23_validator_id
         and inputs.telemetry_status == 'PASS'
         and inputs.host_matrix_status == 'PASS'
         and inputs.rollback_status == 'PASS'
         and inputs.axiom_binding_status == 'PASS'
         and inputs.block_binding_status == 'PASS'
         and inputs.heavy_model_download_count == 0
         and inputs.remote_commander_used == 'false' }}
    then:
      - id: auxiliary_pass
        type: io.kestra.plugin.core.log.Log
        message: >-
          LOUKSNAPG_KESTRA_AUXILIARY_AUDIT=PASS
          source_commit={{ inputs.source_commit }}
          contract_sha256={{ inputs.architecture_contract_sha256 }}
          bundle_sha256={{ inputs.bundle_sha256 }}
          custosz_repair_report_sha256={{ inputs.custosz_repair_report_sha256 }}
          worker_status={{ inputs.worker_status }}
          global_certification=PASS_ONLY_FOR_SEPARATELY_SIGNED_G24_SUBJECT
    else:
      - id: auxiliary_hold
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          LOUKSNAPG_KESTRA_AUXILIARY_AUDIT=HOLD.
          A required CUSTOSZ repair result, source, function, quality, telemetry,
          G23/G24, host, rollback, axiom/block, or safety control has not independently passed.
          Global certification is NOT_GRANTED.
