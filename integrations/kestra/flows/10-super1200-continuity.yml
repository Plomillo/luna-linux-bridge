id: super1200_continuity
namespace: louksna.kestra
description: >-
  Checkpoint supervisor for SUPER1200, executed by a bounded GitHub-hosted Kestra instance.
  CUSTOSZ V7 is the authorized worker; Kestra gates D04 105-108 against the prior scoped G23/G24 certificate, and the hosted runner executes only after gate success.
  It reads durable GitHub checkpoints, guards active/queued runs, and never certifies or promotes.
tasks:
  - id: checkpoint
    type: io.kestra.plugin.core.http.Request
    uri: "https://raw.githubusercontent.com/Plomillo/luna-linux-bridge/custosz/super-1200-implementation-20261007/continuity/STATE.json?cache_bust={{ execution.id }}"
    method: GET
  - id: executors
    type: io.kestra.plugin.core.http.Request
    uri: "https://raw.githubusercontent.com/Plomillo/luna-linux-bridge/custosz/super-1200-implementation-20261007/continuity/EXECUTORS.json?cache_bust={{ execution.id }}"
    method: GET
  - id: prior_certificate
    type: io.kestra.plugin.core.http.Request
    uri: "https://raw.githubusercontent.com/Plomillo/luna-linux-bridge/custosz/super-1200-implementation-20261007/continuity/certification/D04_101_104.json?cache_bust={{ execution.id }}"
    method: GET
  - id: secret_provider_diagnostic
    type: io.kestra.plugin.core.log.Log
    message: "SUPER1200_KESTRA_AUTH_PROVIDER=PUBLIC_READ_ONLY_GITHUB_API"
  - id: active_runs
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/workflows/super1200-continuation-lrb-live.yml/runs?branch=custosz%2Fsuper-1200-implementation-20261007&status=in_progress&per_page=1"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    options:
      allowFailed: "true"
  - id: queued_runs
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/workflows/super1200-continuation-lrb-live.yml/runs?branch=custosz%2Fsuper-1200-implementation-20261007&status=queued&per_page=1"
    method: GET
    headers:
      Accept: application/vnd.github+json
      X-GitHub-Api-Version: "2022-11-28"
    options:
      allowFailed: "true"
  - id: gate_and_dispatch
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ fromJson(outputs.checkpoint.body).blocked == false
         and (fromJson(outputs.checkpoint.body).status == 'READY_FOR_CONTINUATION'
              or fromJson(outputs.checkpoint.body).status == 'ACTIVE')
         and fromJson(outputs.checkpoint.body).material_worker_ready == true
         and fromJson(outputs.checkpoint.body).next_point != null
         and fromJson(outputs.checkpoint.body).current_checkpoint == 'D04_101_104_MATERIALIZED'
         and fromJson(outputs.executors.body).executors.D04 == 'implementation/super1200/runtime/d04_material_worker_105_108.py'
         and fromJson(outputs.checkpoint.body).g23 == 'PASS_FOR_SCOPE_D04_101_104'
         and fromJson(outputs.checkpoint.body).g24 == 'PASS_FOR_SCOPE_D04_101_104'
         and fromJson(outputs.checkpoint.body).scoped_certification.scope == 'D04:101-104'
         and fromJson(outputs.checkpoint.body).scoped_certification.status == 'PASS'
         and fromJson(outputs.checkpoint.body).scoped_certification.global_certification_granted == false
         and outputs.prior_certificate.code == 200
         and fromJson(outputs.prior_certificate.body).result == 'PASS'
         and fromJson(outputs.prior_certificate.body).scope == 'D04:101-104'
         and fromJson(outputs.prior_certificate.body).global_super1200_certified == false
         and outputs.active_runs.code == 200
         and outputs.queued_runs.code == 200
         and fromJson(outputs.active_runs.body).total_count == 0
         and fromJson(outputs.queued_runs.body).total_count == 0 }}
    then:
      - id: authorization_receipt
        type: io.kestra.plugin.core.log.Log
        message: >-
          SUPER1200_CUSTOSZ_V7_AUTHORIZED checkpoint={{ fromJson(outputs.checkpoint.body).current_checkpoint }} prior_scope=D04:101-104 G23=PASS G24=PASS next=D04:105-108
          executor={{ fromJson(outputs.executors.body).executors.D04 }}
          kestra_execution={{ execution.id }}
          material_execution=DELEGATED_TO_GITHUB_HOSTED_JOB
          certification=NOT_GRANTED
    else:
      - id: blocked_safe_hold
        type: io.kestra.plugin.core.log.Log
        message: >-
          SUPER1200_SAFE_HOLD status={{ fromJson(outputs.checkpoint.body).status }}
          blocked={{ fromJson(outputs.checkpoint.body).blocked }}
          reason={{ fromJson(outputs.checkpoint.body).block_reason }}
          next={{ fromJson(outputs.checkpoint.body).next_point }}
          material_worker_ready={{ fromJson(outputs.checkpoint.body).material_worker_ready ?? false }}
          prior_certificate_http_code={{ outputs.prior_certificate.code }} active_run_http_code={{ outputs.active_runs.code }}
          queued_run_http_code={{ outputs.queued_runs.code }}
          active_run_count={{ outputs.active_runs.body.total_count ?? 'UNAVAILABLE' }}
          queued_run_count={{ outputs.queued_runs.body.total_count ?? 'UNAVAILABLE' }}
          active_run_api_message={{ outputs.active_runs.body.message ?? 'none' }}
          queued_run_api_message={{ outputs.queued_runs.body.message ?? 'none' }}
          MetaOS deferred; hold unless checkpoint, prior scoped certificate, and both public GitHub API reads validate; no global certification or promotion.
      - id: fail_closed_safe_hold
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: "SUPER1200_FAIL_CLOSED: checkpoint gate denied continuation; material worker must not execute."
triggers:
  - id: every_five_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    timezone: "America/Santiago"
    recoverMissedSchedules: NONE
    allowConcurrent: false
    lateMaximumDelay: PT2M
