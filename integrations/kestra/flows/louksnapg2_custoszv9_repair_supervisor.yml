id: louksnapg2_custoszv9_repair_supervisor
namespace: louksna.kestra
description: >-
  Read-only Kestra supervisor for the CUSTOSZ V9 LOUKSNAPG2 repair workflow.
  It records the exact GitHub run, primary worker state and G23/G24 outcomes.
  It does not dispatch, mutate Git, load models or grant certification.
tasks:
  - id: latest_repair_runs
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/workflows/louksnapg2-custoszv9-repair.yml/runs?branch=repair%2Flouksnapg2-custoszv9-kestra-20261029&per_page=5"
    method: GET
    headers:
      Accept: "application/vnd.github+json"
      X-GitHub-Api-Version: "2022-11-28"
      Cache-Control: "no-cache, no-store"
      Pragma: "no-cache"
    timeout: PT20S
    options:
      connectTimeout: PT5S
      readTimeout: PT15S

  - id: record_repair_state
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ outputs.latest_repair_runs.code == 200
         and fromJson(outputs.latest_repair_runs.body).total_count > 0 }}
    then:
      - id: latest_repair_jobs
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/runs/{{ fromJson(outputs.latest_repair_runs.body).workflow_runs[0].id }}/jobs?per_page=20"
        method: GET
        headers:
          Accept: "application/vnd.github+json"
          X-GitHub-Api-Version: "2022-11-28"
          Cache-Control: "no-cache, no-store"
        timeout: PT20S
        options:
          connectTimeout: PT5S
          readTimeout: PT15S
      - id: emit_latest_repair_state
        type: io.kestra.plugin.core.log.Log
        message: |
          LOUKSNAPG2_REPAIR_SUPERVISOR=READ_ONLY
          WORKER=CUSTOSZ_V9_PRIMARY
          COORDINATOR=KESTRA
          RUN_ID={{ fromJson(outputs.latest_repair_runs.body).workflow_runs[0].id }}
          RUN_STATUS={{ fromJson(outputs.latest_repair_runs.body).workflow_runs[0].status }}
          RUN_CONCLUSION={{ fromJson(outputs.latest_repair_runs.body).workflow_runs[0].conclusion }}
          SOURCE_COMMIT={{ fromJson(outputs.latest_repair_runs.body).workflow_runs[0].head_sha }}
          RUN_URL={{ fromJson(outputs.latest_repair_runs.body).workflow_runs[0].html_url }}
          G23_G24=AUTOMATED_SEPARATE_JOBS_OIDC_ATTESTED
          CERTIFICATION=ONLY_IF_G24_CERTIFIED
          GIT_MUTATION=false
          MODEL_INFERENCE_BY_KESTRA=false
          CANONICAL_PROMOTION=false
    else:
      - id: emit_safe_hold
        type: io.kestra.plugin.core.log.Log
        message: |
          LOUKSNAPG2_REPAIR_SUPERVISOR=SAFE_HOLD
          HTTP_CODE={{ outputs.latest_repair_runs.code }}
          REASON=NO_REPAIR_RUN_OR_GITHUB_API_UNAVAILABLE
          CERTIFICATION=NOT_GRANTED

triggers:
  - id: poll_repair_pipeline_every_five_minutes
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"
    timezone: Etc/UTC
    allowConcurrent: false
