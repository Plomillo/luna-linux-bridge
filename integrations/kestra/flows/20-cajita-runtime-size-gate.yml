id: cajita_runtime_size_gate
namespace: louksna.kestra
description: >-
  Read-only cross-check of the actual deterministic Macrodown distribution payload,
  its exact byte cap, Q2 factor evidence, and ten registered asset identities.
  The Q4 expanded-tree byte count is retained as informational provenance only;
  it is not the distribution-size gate. This flow cannot mutate source or certify globally.
tasks:
  - id: runtime_report
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/docs/cajita-luna/CAJITA_RUNTIME_Q4_REBALANCE_20261023.json?ref=main&cache_bust={{ execution.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ envs.github_token }}"
      Accept: application/vnd.github.raw+json
      Cache-Control: no-cache, no-store
      Pragma: no-cache
  - id: macrodown_report
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/docs/cajita-luna/CAJITA_MACRODOWN_BUILD_20261023.json?ref=main&cache_bust={{ execution.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ envs.github_token }}"
      Accept: application/vnd.github.raw+json
      Cache-Control: no-cache, no-store
      Pragma: no-cache
  - id: placement_record
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/cajita-luna-runtime/EXTERNALIZED_ASSET_PLACEMENT.json?ref=main&cache_bust={{ execution.id }}"
    method: GET
    headers:
      Authorization: "Bearer {{ envs.github_token }}"
      Accept: application/vnd.github.raw+json
      Cache-Control: no-cache, no-store
      Pragma: no-cache
  - id: gate
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ outputs.runtime_report.code == 200
         and outputs.macrodown_report.code == 200
         and outputs.placement_record.code == 200
         and fromJson(outputs.runtime_report.body).q2_factor_models_promoted == 0
         and fromJson(outputs.runtime_report.body).q2_factor_results[0].id == 'W01_CEREBRO'
         and fromJson(outputs.runtime_report.body).q2_factor_results[0].status == 'ALREADY_Q2_PACKED'
         and fromJson(outputs.runtime_report.body).q2_factor_results[1].id == 'W02_TRANSCRIPTION'
         and fromJson(outputs.runtime_report.body).q2_factor_results[1].status == 'ALREADY_Q2_PACKED'
         and fromJson(outputs.runtime_report.body).q2_factor_results[2].id == 'W03_TRANSLATION'
         and fromJson(outputs.runtime_report.body).q2_factor_results[2].status == 'ALREADY_Q2_PACKED'
         and fromJson(outputs.runtime_report.body).q2_factor_results[3].id == 'W05_QWEN3'
         and fromJson(outputs.runtime_report.body).q2_factor_results[3].status == 'ALREADY_Q2_PACKED'
         and fromJson(outputs.runtime_report.body).certification == 'NOT_GRANTED'
         and fromJson(outputs.macrodown_report.body).build_status == 'PASS'
         and fromJson(outputs.macrodown_report.body).raw_payload_size_gate == 'PASS'
         and fromJson(outputs.macrodown_report.body).archive_size_gate == 'PASS'
         and fromJson(outputs.macrodown_report.body).gross_raw_payload_bytes_including_manifest <= 470000000
         and fromJson(outputs.macrodown_report.body).archive_bytes <= 470000000
         and fromJson(outputs.macrodown_report.body).registered_assets_preserved == 10
         and fromJson(outputs.macrodown_report.body).certification == 'NOT_GRANTED'
         and fromJson(outputs.placement_record.body).runtime_size_gate.size_gate == 'PASS'
         and fromJson(outputs.placement_record.body).runtime_size_gate.hard_cap_bytes == 470000000
         and fromJson(outputs.placement_record.body).runtime_size_gate.registered_asset_count == 10 }}
    then:
      - id: record_pass
        type: io.kestra.plugin.core.log.Log
        message: >-
          CAJITA_SIZE_AUDIT=PASS
          expanded_tree_bytes_informational={{ fromJson(outputs.runtime_report.body).runtime_bytes_after }}
          macrodown_payload_bytes={{ fromJson(outputs.macrodown_report.body).runtime_payload_bytes_excluding_generated_manifest }}
          macrodown_gross_raw_bytes={{ fromJson(outputs.macrodown_report.body).gross_raw_payload_bytes_including_manifest }}
          macrodown_archive_bytes={{ fromJson(outputs.macrodown_report.body).archive_bytes }}
          hard_cap_bytes=470000000
          registered_assets=10
          q2_factor_models_promoted={{ fromJson(outputs.runtime_report.body).q2_factor_models_promoted }}
          q2_factor_models_already_packed=4
          certification=NOT_GRANTED
          kestra_execution={{ execution.id }}
    else:
      - id: audit_failed_predicates
        type: io.kestra.plugin.core.log.Log
        message: >-
          CAJITA_SIZE_AUDIT_DIAGNOSTICS
          runtime_http={{ outputs.runtime_report.code }}
          macrodown_http={{ outputs.macrodown_report.code }}
          placement_http={{ outputs.placement_record.code }}
          expanded_tree_bytes_informational={{ fromJson(outputs.runtime_report.body).runtime_bytes_after }}
          macrodown_payload_bytes={{ fromJson(outputs.macrodown_report.body).runtime_payload_bytes_excluding_generated_manifest }}
          q2_promoted={{ fromJson(outputs.runtime_report.body).q2_factor_models_promoted }}
          q2_packed_first={{ fromJson(outputs.runtime_report.body).q2_factor_results[0].status }}
          raw_payload_bytes={{ fromJson(outputs.macrodown_report.body).gross_raw_payload_bytes_including_manifest }}
          archive_bytes={{ fromJson(outputs.macrodown_report.body).archive_bytes }}
          registered_assets={{ fromJson(outputs.macrodown_report.body).registered_assets_preserved }}
          placement_gate={{ fromJson(outputs.placement_record.body).runtime_size_gate.size_gate }}
      - id: fail_closed
        type: io.kestra.plugin.core.execution.Fail
        errorMessage: >-
          CAJITA_SIZE_AUDIT_FAIL: one or more current-main raw-size, archive-size,
          manifest, ten-asset registry, or non-certification invariants did not pass.
