id: louksnapg_nine_point_supervisor
namespace: louksna.kestra
description: >-
  LOUKSNAPG.md — nine-point certification order. Follow this sequence strictly;
  do not reorder, silently replace components, or infer certification from
  metadata. (1) Establish the exact candidate revision, completed work, open
  defects and existing evidence. (2) Review GPT-OSS-120B reasoning, Qwen advanced
  reasoning, general translation, ancient-language translation and Whisper
  transcription by their assigned domains. (3) Inspect dependencies, routes,
  input-to-motor wiring and result return paths. (4) Repair only demonstrated
  functional defects with the smallest justified change. (5) Re-run direct
  checks of each repaired defect on the exact candidate. (6) Verify actual
  integrated routes and cooperation without redesigning working configuration.
  (7) Record independent per-domain decisions and the separate integral
  decision; leave certification NOT_GRANTED if any required evidence is absent.
  (8) Preserve chronological order, candidate identity, hashes, provenance,
  audit logs, rollback pointers and non-regression evidence. Static checks and
  synthetic tests must never be represented as real motor function. (9) Keep
  the PC inspection-only: at most 1 GiB RAM and one CPU thread; never run heavy
  inference locally. Perform heavy tests, repair and certification in the
  repository runner. Inspect original large weights only by metadata/hash when
  a proven defect requires it. Download only necessary small dependencies from
  GitHub with source/version/integrity recorded. No substitution of models,
  no hidden size-limit changes, no CUSTOSZ V7 launch, and no DigitalOcean.
  This supervisor establishes step 1, emits telemetry for a pinned candidate,
  then waits for a newer factory run. It does not claim to execute or certify
  the five motor domains; heavy operations belong to the repository runner.
tasks:
  - id: phase_1_candidate_snapshot
    type: io.kestra.plugin.core.output.OutputValues
    values:
      candidate_source_commit: a57fc224ebe8f3ec3fba69f6b07716aa9fe8aedf
      audit_contract_blob_sha: 30570d435b6c30f71e9f121b9fd0475309d83b7c
      candidate_branch: main
      candidate_commit_timestamp_utc: "2026-10-25T23:16:39Z"
      baseline_created_at: "{{ execution.startDate }}"
      factory_snapshot_state: DEFERRED_UNTIL_GITHUB_RATE_LIMIT_RESET
      functional_status: NOT_ESTABLISHED
      global_certification: NOT_GRANTED

  - id: phase_1_telemetry
    type: io.kestra.plugin.core.log.Log
    message: |
      LOUKSNAPG_STEP_1_TELEMETRY=STARTED
      LOUKSNAPG_NINE_POINT_ORDER=1>2>3>4>5>6>7>8>9
      LOUKSNAPG_POINT_1=IN_PROGRESS
      candidate_repository=Plomillo/luna-linux-bridge
      candidate_branch={{ outputs.phase_1_candidate_snapshot.values.candidate_branch }}
      candidate_source_commit={{ outputs.phase_1_candidate_snapshot.values.candidate_source_commit }}
      candidate_commit_timestamp_utc={{ outputs.phase_1_candidate_snapshot.values.candidate_commit_timestamp_utc }}
      audit_contract_blob_sha={{ outputs.phase_1_candidate_snapshot.values.audit_contract_blob_sha }}
      telemetry_baseline_created_at={{ outputs.phase_1_candidate_snapshot.values.baseline_created_at }}
      factory_snapshot_state={{ outputs.phase_1_candidate_snapshot.values.factory_snapshot_state }}
      POINT_2_DOMAIN_REVIEW=WAITING_FOR_REPOSITORY_RUNNER
      required_domains=GPT-OSS-120B;QWEN;GENERAL_TRANSLATION;ANCIENT_LANGUAGE_TRANSLATION;WHISPER_TRANSCRIPTION
      POINT_3_ROUTE_WIRING=WAITING_FOR_REPOSITORY_RUNNER
      POINT_4_MINIMAL_REPAIR=ONLY_FOR_DEMONSTRATED_DEFECTS
      POINT_5_POST_REPAIR_VERIFICATION=REQUIRED_ON_EXACT_CANDIDATE
      POINT_6_INTEGRATION_VERIFICATION=REQUIRED
      POINT_7_PER_DOMAIN_AND_INTEGRAL_CERTIFICATION=EVIDENCE_GATED
      POINT_8_TRACEABILITY_PROVENANCE_AUDIT_ROLLBACK=REQUIRED
      POINT_9_PC_LIMITS_AND_AUTHORIZED_SCOPE=ENFORCED_BY_INSTRUCTION
      functional_status=NOT_ESTABLISHED
      global_certification=NOT_GRANTED
      NEXT_GATE=WAITING_FOR_NEW_FACTORY_RUN
      PC_HEAVY_INFERENCE=FORBIDDEN
      CUSTOSZ_V7=NOT_STARTED_NOT_TOUCHED
      DIGITALOCEAN=PROHIBITED

  - id: wait_for_new_factory_run
    type: io.kestra.plugin.core.flow.LoopUntil
    condition: >-
      {{ (outputs.poll_factory_runs.body | jq('.workflow_runs[0].created_at // ""') | first) >
         outputs.phase_1_candidate_snapshot.values.baseline_created_at }}
    checkFrequency:
      interval: PT10S
    tasks:
      - id: wait_thirty_minutes_before_poll
        type: io.kestra.plugin.core.flow.Sleep
        duration: PT30M

      - id: poll_factory_runs
        type: io.kestra.plugin.core.http.Request
        uri: https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/workflows/cajita-louksna1-factory.yml/runs?per_page=5
        method: GET
        headers:
          Accept: application/vnd.github+json
          User-Agent: Kestra-LOUKSNAPG-supervisor
        options:
          connectTimeout: PT5S
          readTimeout: PT15S

  - id: phase_2_worker_start_observed
    type: io.kestra.plugin.core.log.Log
    message: |
      LOUKSNAPG_POINT_2_REPOSITORY_RUN_OBSERVED=TRUE
      latest_factory_run_id={{ outputs.wait_for_new_factory_run.outputs.poll_factory_runs.body | jq('.workflow_runs[0].id // "NONE"') | first }}
      latest_factory_run_status={{ outputs.wait_for_new_factory_run.outputs.poll_factory_runs.body | jq('.workflow_runs[0].status // "NONE"') | first }}
      latest_factory_run_sha={{ outputs.wait_for_new_factory_run.outputs.poll_factory_runs.body | jq('.workflow_runs[0].head_sha // "NONE"') | first }}
      The repository runner owns heavy work. Continue only with source-bound evidence.
      Points 2-7 remain uncertified unless the runner publishes the required domain,
      route, repair, post-repair and integrated-function evidence for this candidate.
      No functional or integral certification is inferred from run creation.

triggers:
  - id: start_phase_1_now
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/1 * * * *"
    timezone: Etc/UTC
    allowConcurrent: false
    stopAfter:
      - RUNNING
      - FAILED
