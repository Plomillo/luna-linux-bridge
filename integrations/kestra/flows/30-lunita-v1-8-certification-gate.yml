id: lunita_v1_8_certification_gate
namespace: louksna.lunita
description: >-
  Read-only evidence orchestration for the additive Lunita v1.8 candidate.
  It checks the current recovery-contract CI run and overlay artifact, then
  validates a published CUSTOSZ_V7 target-runtime receipt when present.
  A green Kestra execution is never a Lunita certificate.
tasks:
  - id: branch
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/branches/recovery%2Flunita-custoszv9-operational-20261020?cache_bust={{ execution.id }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      Cache-Control: no-cache, no-store
      Pragma: no-cache
    options:
      allowFailed: true

  - id: latest_ci
    type: io.kestra.plugin.core.http.Request
    uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/workflows/lunita-custoszv9-recovery-contract.yml/runs?branch=recovery%2Flunita-custoszv9-operational-20261020&per_page=1&cache_bust={{ execution.id }}"
    method: GET
    headers:
      Accept: application/vnd.github+json
      Cache-Control: no-cache, no-store
      Pragma: no-cache
    options:
      allowFailed: true

  - id: candidate_ci_gate
    type: io.kestra.plugin.core.flow.If
    condition: >-
      {{ outputs.branch.code == 200
         and outputs.latest_ci.code == 200
         and fromJson(outputs.latest_ci.body).total_count > 0
         and fromJson(outputs.latest_ci.body).workflow_runs[0].status == 'completed'
         and fromJson(outputs.latest_ci.body).workflow_runs[0].conclusion == 'success'
         and fromJson(outputs.latest_ci.body).workflow_runs[0].head_branch == 'recovery/lunita-custoszv9-operational-20261020' }}
    then:
      - id: latest_ci_artifacts
        type: io.kestra.plugin.core.http.Request
        uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/actions/runs/{{ fromJson(outputs.latest_ci.body).workflow_runs[0].id }}/artifacts?cache_bust={{ execution.id }}"
        method: GET
        headers:
          Accept: application/vnd.github+json
          Cache-Control: no-cache, no-store
          Pragma: no-cache
        options:
          allowFailed: true

      - id: artifact_gate
        type: io.kestra.plugin.core.flow.If
        condition: >-
          {{ outputs.latest_ci_artifacts.code == 200
             and fromJson(outputs.latest_ci_artifacts.body).total_count > 0
             and fromJson(outputs.latest_ci_artifacts.body).artifacts[0].name == 'lunita-engine-overlay-v1-py312'
             and fromJson(outputs.latest_ci_artifacts.body).artifacts[0].expired == false
             and fromJson(outputs.latest_ci_artifacts.body).artifacts[0].size_in_bytes > 0 }}
        then:
          - id: target_publication
            type: io.kestra.plugin.core.http.Request
            uri: "https://api.github.com/repos/Plomillo/luna-linux-bridge/contents/evidence/lunita/target-runtime-acceptance/CURRENT.json?ref=recovery%2Flunita-custoszv9-operational-20261020&cache_bust={{ execution.id }}"
            method: GET
            headers:
              Accept: application/vnd.github.raw+json
              Cache-Control: no-cache, no-store
              Pragma: no-cache
            options:
              allowFailed: true

          - id: target_receipt_gate
            type: io.kestra.plugin.core.flow.If
            condition: "{{ outputs.target_publication.code == 200 }}"
            then:
              - id: validate_target_receipt
                type: io.kestra.plugin.core.flow.If
                condition: >-
                  {{ fromJson(outputs.target_publication.body).schema == 'LUNITA_TARGET_RUNTIME_ACCEPTANCE_PUBLICATION/1.0'
                     and fromJson(outputs.target_publication.body).candidate_id == 'G06_REBUILD_CANDIDATE_R1'
                     and fromJson(outputs.target_publication.body).source_receipt_sha256 != null
                     and fromJson(outputs.target_publication.body).receipt.schema == 'LUNITA_TARGET_RUNTIME_ACCEPTANCE/1.0'
                     and fromJson(outputs.target_publication.body).receipt.status == 'PASS_TARGET_RUNTIME_ACCEPTANCE_NOT_CERTIFIED'
                     and fromJson(outputs.target_publication.body).receipt.candidate_id == 'G06_REBUILD_CANDIDATE_R1'
                     and fromJson(outputs.target_publication.body).receipt.worker_required == 'CUSTOSZ_V7'
                     and fromJson(outputs.target_publication.body).receipt.worker_version == 'CUSTOSZ_V7'
                     and fromJson(outputs.target_publication.body).receipt.certification == 'NOT_GRANTED'
                     and fromJson(outputs.target_publication.body).receipt.canonical_g06_certification == 'NOT_GRANTED'
                     and fromJson(outputs.target_publication.body).receipt.canonical_g08_binding_mutation == false
                     and fromJson(outputs.target_publication.body).receipt.overlay_integrity.status == 'PASS_OVERLAY_INTEGRITY'
                     and fromJson(outputs.target_publication.body).receipt.e04_quantization.status == 'PASS_E04_INT8_QUALITY_GATE'
                     and fromJson(outputs.target_publication.body).receipt.qwen_e01.status == 'PASS_E01_QWEN_INFERENCE'
                     and fromJson(outputs.target_publication.body).receipt.dependency_inventory.status == 'PASS'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.status == 'PASS'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.skipped == 0
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.tests_run >= 14
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[0] == 'E02'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[1] == 'E03'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[2] == 'E04'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[3] == 'E05'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[4] == 'E06'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[5] == 'E07'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[6] == 'E08'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[7] == 'E09'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[8] == 'E10'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[9] == 'E11'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[10] == 'E12'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[11] == 'E13'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[12] == 'E14'
                     and fromJson(outputs.target_publication.body).receipt.engine_acceptance_tests.engine_ids_covered[13] == 'E15'
                     and fromJson(outputs.target_publication.body).receipt.legacy_application_smokes.status == 'PASS_LEGACY_APPLICATION_SMOKES' }}
                then:
                  - id: ready_for_independent_validation
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      LUNITA_V1_8_TARGET_RUNTIME_ACCEPTANCE=PASS_NOT_CERTIFIED
                      candidate=G06_REBUILD_CANDIDATE_R1
                      worker=CUSTOSZ_V7
                      engine_coverage=E02-E15
                      E01=PASS
                      E04_INT8=PASS
                      legacy_instruments=PASS
                      G23=NOT_PERFORMED
                      G24=NOT_GRANTED
                      next=INDEPENDENT_VALIDATION_AND_S32
                      certification=NOT_GRANTED
                else:
                  - id: reject_target_receipt
                    type: io.kestra.plugin.core.log.Log
                    message: >-
                      LUNITA_TARGET_RUNTIME_ACCEPTANCE=HOLD_INVALID_OR_BLOCKED_RECEIPT
                      G23=NOT_PERFORMED G24=NOT_GRANTED certification=NOT_GRANTED
            else:
              - id: wait_for_custosz_v7
                type: io.kestra.plugin.core.log.Log
                message: >-
                  LUNITA_TARGET_RUNTIME_ACCEPTANCE=HOLD_CUSTOSZ_V7_RECEIPT_NOT_PUBLISHED
                  The hosted CI artifact is not target-runtime evidence.
                  Run the authorized CUSTOSZ_V7 handoff on the actual candidate.
                  G23=NOT_PERFORMED G24=NOT_GRANTED certification=NOT_GRANTED
        else:
          - id: hold_overlay_artifact
            type: io.kestra.plugin.core.log.Log
            message: >-
              LUNITA_V1_8_ARTIFACT_GATE=HOLD
              The latest successful CI run lacks the expected non-expired engine overlay artifact.
              No older successful run is substituted. certification=NOT_GRANTED
    else:
      - id: hold_candidate_ci
        type: io.kestra.plugin.core.log.Log
        message: >-
          LUNITA_V1_8_CI_GATE=HOLD
          The branch is missing, or its latest recovery-contract run is incomplete or unsuccessful.
          No older successful run is substituted. certification=NOT_GRANTED
