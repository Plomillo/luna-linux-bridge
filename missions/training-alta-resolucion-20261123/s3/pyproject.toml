[project]
name = "metagente-luna-s3"
version = "0.1.0"
description = "Typed IR, planner and fixture discovery. Not a promotion to M1."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "lark>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "hypothesis>=6,<7",
  "jsonschema>=4,<5",
  "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metagente_luna_s3", "src/metagente_luna_s4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
